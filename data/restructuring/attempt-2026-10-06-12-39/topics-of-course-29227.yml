analysis:
  mode: all-courses
source_clusters:
- id: 5
  name: Computing Education Informatics (5)
course:
  id: '29227'
  name: Foundations of Informatics T
topics:
  abstract_data_type_specification: Abstract data types, including type definitions
    and operations such as constructors, selectors, predicates, functions, and transformers.
  activation_records_and_runtime_storage: Runtime storage organization using activation-record
    stacks and heaps.
  algorithmic_problem_solving_and_programming_basics: Basic principles of algorithms
    and programming.
  c_arrays_and_pointers: Arrays and pointers in C programs.
  c_character_strings: Character strings in C programs.
  c_control_flow_and_iteration: C control-flow structures, cycles, iteration, and
    structured programming.
  c_data_types: Data types in C programs.
  c_dynamic_memory_management: Functions for direct memory management in C.
  c_file_handling: File-handling functions in C.
  c_functions_and_recursion: Defining and using C functions, including recursive functions.
  c_input_output_functions: Input/output functions in C.
  c_operators_and_expressions: Values, operators, and expressions in C programs.
  c_structures: Definition and use of structures in C programs.
  computer_hardware_and_software_components: Basic hardware and software building
    blocks of a computer and processing system.
  ebnf_syntax_specification: Specification of programming-language syntax using Extended
    Backus–Naur Form (EBNF) grammars.
  high_and_low_level_programming_languages: The distinction between high-level and
    low-level programming languages.
  history_of_informatics: Brief historical development of informatics.
  linked_list_data_structures: Lists as elementary data structures, including their
    implementation and use.
  operating_system_structure_and_functions: The structure and main functions of an
    operating system.
  recursive_algorithm_design: Recursive algorithms as a technique for solving problems.
  sorting_algorithms: Sorting algorithms.
  stack_and_queue_data_structures: Elementary stack and queue data structures.
  structured_and_modular_programming: Methodologies of structured and modular programming.
  turing_machine_computability: Turing machines as a model of computation and their
    use in determining which functions or problems are computable.
  undecidable_problems: Undecidable problems and noncomputable functions, including
    determining when no program can compute a specified function.
  von_neumann_architecture: The von Neumann computer architecture.
