analysis:
  mode: all-courses
source_clusters:
- id: 7
  name: Informatica Computer Science (7)
course:
  id: '65094'
  name: ADVANCED PROGRAMMING
topics:
  numerical_modeling_of_physical_pdes: Basic numerical modeling to solve physical
    partial differential equations, including D'Alembert (wave), heat, and transport
    equations.
  object_oriented_programming_in_python: Object-oriented programming techniques taught
    using Python.
  python_control_flow_and_iteration: Sequential execution, conditional selection,
    and loop-based iteration in Python.
  python_data_analysis_libraries: Use of Python data-analysis libraries, including
    NumPy, SciPy, Matplotlib, pandas, and scikit-learn.
  python_functions: Defining and using functions in Python.
  python_sequence_list_and_dictionary_data_structures: Use of Python sequence, list,
    and dictionary data structures.
  python_text_and_file_processing: String manipulation and the creation, automated
    processing, and storage of text documents and other digital resources using Python
    files.
  python_variables_expressions_statements_and_data_types: Python variables, expressions,
    statements, and basic data types.
  shell_and_shell_scripting: Use of shells and shell scripting.
  statistical_analysis_of_physical_datasets: Extracting major statistical properties
    from physical datasets and comparing them with theoretical predictions.
