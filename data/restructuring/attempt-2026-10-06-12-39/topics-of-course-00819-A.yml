topics:
  algorithm_design_and_analysis: Algorithmic problem-solving, including the design
    and analysis of solution algorithms.
  c_arrays_matrices_and_memory_representation: C arrays and matrices, including their
    representation in memory.
  c_complex_data_structures: Fundamental and complex data structures in C and their
    related algorithms.
  c_data_types: Data types in C programs.
  c_dynamic_memory_management: Functions for direct memory management in C.
  c_file_handling: File-handling functions in C.
  c_functions_parameter_passing_and_recursion: C library and user-defined functions,
    parameter passing, and recursive functions.
  c_input_output_functions: Input/output functions in C.
  c_memory_organization_and_pointers: Computer memory organization in C, including
    addresses, words, and pointers.
  c_pointer_arithmetic: Pointer arithmetic in C.
  c_program_structure_headers_and_libraries: Structure of C programs, including inclusion
    of headers and libraries.
  c_string_functions: String functions in C.
  imperative_programming_paradigm: Methodological foundations for analyzing and developing
    software systems using the imperative programming paradigm.
  object_oriented_language_fundamentals: Fundamental functional aspects of modern
    object-oriented languages.
