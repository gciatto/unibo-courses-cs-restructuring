analysis:
  mode: all-courses
source_clusters:
- id: 4
  name: Internet Things Systems (4)
course:
  id: '81683'
  name: Internet of Things
topics:
  coap_and_mqtt_protocols: Use of the CoAP and MQTT protocols for message-based interactions
    among distributed software components.
  edge_ai_and_tinyml: Edge AI and TinyML techniques for executing machine-learning
    functionality on IoT edge devices.
  embedded_cpp_and_micropython_programming: Programming embedded IoT systems using
    C++ and MicroPython.
  embedded_hardware_components: Embedded-system hardware basics, including microcontrollers,
    systems-on-chip, sensors, actuators, and electronics.
  embedded_iot_networks_protocols_and_wireless: Network models and architectures,
    communication protocols, and wireless technologies for networks of embedded systems
    and IoT.
  embedded_systems_and_iot_fundamentals: Introductory concepts of embedded systems,
    embedded software, and the Internet of Things.
  http_protocol_basics: Fundamental concepts and operation of the HTTP protocol.
  iot_application_domains: IoT application domains, including Industry 4.0, smart-home
    automation, intelligent transportation systems, and wearable devices.
  iot_architectures_and_platforms: Basic architectural concepts and platforms for
    Internet-of-Things systems.
  iot_edge_fog_cloud_architectures: IoT data-storage and processing architectures
    based on edge, fog, and cloud computing.
  iot_electronic_circuit_design_basics: Overview-level electronic-circuit design concepts
    for IoT sensing and actuation components.
  iot_low_power_network_architectures_and_routing: Low-power IoT network architectures
    and routing using 6LoWPAN and RPL.
  iot_m2m_middleware_platforms: Middleware platforms supporting machine-to-machine
    communication in IoT systems.
  iot_sensor_actuator_interfacing_with_arduino_and_esp_idf: Interfacing sensors and
    actuators in embedded IoT prototypes using Arduino and ESP-IDF frameworks.
  iot_time_series_storage_and_influxdb: Storage and processing of IoT sensor time-series
    data, including use of InfluxDB time-series databases.
  iot_time_series_visualization_with_grafana: Visualization of IoT sensor time-series
    data using Grafana.
  iot_wireless_wpan_wlan_and_lpwan_technologies: Wireless IoT communication technologies
    across WPAN, WLAN, and LP-WAN networks, including BLE, IEEE 802.15.4, Z-Wave,
    LoRa, and LoRaWAN.
  kafka_sensor_data_streaming: Using the Kafka framework for streaming sensor data
    in IoT systems.
  semantic_web_concepts: Semantic Web concepts for graph-based data.
  sensing_and_data_acquisition_policies: Sensing, sensor-data generation, and policies
    for acquiring IoT data.
  serial_peripheral_communication_protocols: 'Serial peripheral communication protocols:
    OneWire, I2C, SPI, and UART.'
  time_series_machine_learning_forecasting: Forecasting time-series data using artificial-intelligence
    and machine-learning techniques.
  time_series_statistical_forecasting: Forecasting time-series data using statistical
    methods.
  web_of_things: Introductory Web of Things concepts.
