analysis:
  mode: all-courses
source_clusters:
- id: 4
  name: Internet Things Systems (4)
course:
  id: '81678'
  name: Laboratory of Making
topics:
  analog_electronics_passive_components_and_circuit_laws: Analog electronics with
    passive components, including current, voltage, power, energy, Kirchhoff's laws,
    Ohm's law, resistors, capacitors, inductors, and transformers.
  arduino_and_raspberry_pi_embedded_platforms: Use of Arduino microcontrollers and
    Raspberry Pi system-on-chip platforms for digitally enabled objects.
  asterisk_voip_pbx: VoIP telephone exchanges using Asterisk.
  digital_electronics_fundamentals: Fundamental digital-electronics concepts.
  digital_fabrication_cnc_and_laser_cutting: Software-supported digital fabrication
    with CNC-like subtractive tools, including CNC mills and laser cutters.
  electronics_laboratory_instrumentation: Laboratory use of multimeters, oscilloscopes,
    and logic analyzers for electronics work.
  embedded_hardware_components: Embedded-system hardware basics, including microcontrollers,
    systems-on-chip, sensors, actuators, and electronics.
  making_as_constructive_problem_solving: Making as a constructive problem-solving
    approach for practical and artistic projects.
  making_based_computer_science_education: Design and development of computer-science
    teaching methodologies based on Making.
  motor_drives_and_h_bridges: Controlling motors using H-bridge driver circuits.
  programmable_logic_design: Programmable logic devices and their digital-circuit
    design flow.
  radio_wave_fundamentals: Fundamental concepts of radio waves and radio transmission.
  rfid_systems: Radio Frequency Identification (RFID) systems.
  semiconductor_diodes_and_transistors: Semiconductor electronic components, specifically
    diodes and transistors.
  serial_peripheral_communication_protocols: 'Serial peripheral communication protocols:
    OneWire, I2C, SPI, and UART.'
  three_dimensional_printing: Three-dimensional printing techniques.
  verilog_hardware_description_language: Introduction to using the Verilog hardware-description
    language in programmable-logic design.
