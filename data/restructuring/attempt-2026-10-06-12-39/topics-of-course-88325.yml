analysis:
  mode: all-courses
source_clusters:
- id: 0
  name: Security Information Cryptography (0)
course:
  id: '88325'
  name: Computer and Network Security Lab T
topics:
  authentication_systems: Authentication systems used to verify identities.
  authorization_and_access_control: Authorization as a basic cybersecurity mechanism
    for controlling access to networked resources.
  binary_exploitation_buffer_overflow_shellcoding_and_return_to_libc: Binary-code
    exploitation techniques including buffer overflows, shellcoding, and return-to-libc
    attacks.
  configuration_exploitation_and_privilege_escalation: Exploiting configuration errors
    to obtain privilege escalation.
  cryptographic_fundamentals: Fundamental cryptography concepts in the context of
    system protection and security.
  cyber_attack_methods_and_impact: Cyberattack methods and their impacts on systems
    and information.
  cybersecurity_kill_chain: The cybersecurity kill chain as a model of attack stages.
  data_at_rest_anonymization_and_encryption: Protection of data at rest through anonymization
    and encryption.
  incident_response_and_recovery: Incident-response and recovery activities following
    security incidents.
  information_security_properties: Security properties of information and computing
    systems.
  intrusion_detection_prevention_and_siem: Attack detection and prevention using IDS,
    IPS, and SIEM systems.
  network_enumeration_scanning_and_credential_bruteforcing: Network enumeration and
    scanning, including brute-force attacks against credentials.
  network_firewalls: Firewalls for preventing network-based attacks.
  offensive_security_and_red_teaming: Offensive-security and red-teaming approaches
    for assessing the effectiveness of attack vectors.
  operating_system_hardening: Basic operating-system hardening measures.
  physical_security_for_computing_systems: Physical-security measures for computing
    systems.
  secure_communication_protocols_and_vpns: Secure communication protocols and virtual
    private networks (VPNs) for protecting data in transit.
  threat_vulnerability_exploit_and_risk: Definitions and relationships among threats,
    vulnerabilities, exploits, and risk.
  vulnerability_origins_and_identification: Origins of vulnerabilities and methods
    for identifying them.
  web_application_vulnerability_exploitation: Exploitation of web-application vulnerabilities,
    including cross-site scripting, path traversal, and code injection.
