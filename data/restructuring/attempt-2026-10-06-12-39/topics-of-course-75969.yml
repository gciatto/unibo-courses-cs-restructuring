analysis:
  mode: all-courses
source_clusters:
- id: 17
  name: Basic Skills Informatics (17)
course:
  id: '75969'
  name: Basic Informatics
topics:
  algorithm_fundamentals: Fundamental notion of an algorithm in introductory computer-science
    contexts.
  algorithm_notation_pseudocode_and_flowcharts: Representing algorithms using pseudocode
    and flow diagrams.
  computational_thinking: Computational-thinking concepts for formulating and solving
    problems.
  computer_and_software_fundamentals: Introductory concepts of the computer and software.
  data_collections: Introductory treatment of data collections in a digital and computational
    context.
  digital_editions_and_markup: Markup approaches and digital editions for Humanities
    studies.
  digital_humanities_technologies_and_projects: Computer-science and computational
    technologies used in Humanities research, including digital Humanities projects.
  digital_information_units_bits_and_bytes: Bits and bytes as basic units of digital
    information.
  dns_protocol: The Domain Name System (DNS) protocol.
  fundamental_data_structures: Introduction to fundamental data structures used in
    algorithms and programs.
  history_of_computers: Historical development of computers.
  html_and_css_basics: Basic HTML elements and the separation of markup from presentation
    using CSS.
  http_protocol_basics: Fundamental concepts and operation of the HTTP protocol.
  hypertext_history_and_web_origins: The birth of hypertext and the creation of the
    World Wide Web.
  internet_history_and_foundational_principles: The history, founding principles,
    and protocol-stack basis of the Internet.
  internet_protocol_ip: The role and basic operation of the Internet Protocol (IP).
  internet_routing: Routing in the Internet.
  programming_language_concepts_and_history: General concepts of programming languages
    and their historical development.
  tcp_protocol_basics: The role and basic operation of the Transmission Control Protocol
    (TCP).
  undecidable_problems: Undecidable problems and noncomputable functions, including
    determining when no program can compute a specified function.
  visual_programming_languages: Visual languages as a category of programming language.
  web_browser_and_server_technologies: Operation of web browsers and web servers,
    including the technologies they support.
  web_urls: Uniform Resource Locators (URLs) and their role in identifying Web resources.
  webpage_request_lifecycle: The end-to-end scenario through which a webpage request
    is made and information is transferred on the Internet.
