analysis:
  mode: all-courses
source_clusters:
- id: 25
  name: Administration Systems System (25)
course:
  id: '78810'
  name: Real Time Systems for Automation M
topics:
  aperiodic_task_scheduling: Scheduling of aperiodic tasks in real-time systems.
  clock_driven_and_priority_driven_scheduling: Clock-driven and priority-driven approaches
    to real-time task scheduling.
  concurrent_programming_synchronization_and_liveness: Concurrent programming concerns
    including deadlock, starvation, and busy waiting.
  hard_real_time_periodic_task_scheduling: Scheduling hard real-time periodic tasks,
    including tasks that share resources.
  io_management: Operating-system input/output management.
  memory_management: Memory management in operating systems.
  operating_system_scheduling: Scheduling in operating systems.
  operating_system_structure_and_functions: The structure and main functions of an
    operating system.
  posix_system_programming_interfaces: POSIX programming interfaces in operating-system
    laboratory work, including system-call programming, threads, and synchronization.
  process_synchronization: Synchronization mechanisms and concerns among processes.
  processes_and_threads: Operating-system processes and threads.
  python_classes_and_object_oriented_concepts: Python classes and basic object-oriented
    programming concepts.
  python_language_introduction: Introductory programming in the Python language.
  real_time_resource_access_protocols: Resource-access protocols for real-time tasks
    that share resources.
  real_time_system_characteristics_and_task_types: Characteristics and application
    domains of real-time systems, including the distinction between hard and soft
    real-time tasks.
  shell_and_shell_scripting: Use of shells and shell scripting.
  system_calls: Operating-system system calls.
  vxworks_real_time_application_programming: Programming real-time applications using
    the VxWorks operating system and Workbench environment, including implementation
    of a metascheduler.
