analysis:
  mode: all-courses
source_clusters:
- id: 26
  name: Programming Software Design (26)
course:
  id: '81672'
  name: Emerging Programming Paradigms
topics:
  certified_programming: Certified programming and its use to provide strong correctness
    guarantees.
  classical_monads: The origins and use of classical monads for partial computations,
    state, and input/output.
  classless_object_oriented_programming: Classless object-oriented programming as
    an alternative object-oriented programming style.
  dependent_type_certification_case_studies: Certified-programming case studies involving
    numbers, lists, and sized vectors.
  monad_transformers: Monad transformers for combining monadic computational effects.
  monadic_effect_composition: Compositional programming approaches for managing side
    effects.
  nondeterministic_parsing: Non-deterministic parsing as a monadic programming case
    study.
  object_oriented_programming_limitations: Limits and weaknesses of the object-oriented
    programming paradigm.
  parametric_and_dependent_types: The progression from parametric types to dependent
    types.
  property_based_testing_with_quickcheck: Code testing using the QuickCheck property-based
    testing approach.
  software_transactional_memory: Concurrent programming using Software Transactional
    Memory.
  traits_and_type_classes: Traits in Go and Rust and type classes in Haskell as mechanisms
    for structuring typed abstractions.
