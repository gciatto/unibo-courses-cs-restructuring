source_clusters:
- id: 5
  name: Computing Education Informatics (5)
course:
  id: '87469'
  name: Decision Making with Constraint Programming
topics:
  constraint_based_scheduling: Constraint-programming models and solution methods
    for scheduling problems.
  constraint_programming_and_global_constraints: Constraint programming, including
    the use of global constraints.
  constraint_programming_applications: Overview of constraint programming and its
    successful applications for constrained decision-support problems.
  constraint_programming_modeling: Modeling combinatorial decision problems using
    constraint-programming techniques.
  constraint_programming_optimization: Modeling and solving optimization problems
    with constraint programming.
  constraint_programming_search_strategies: Search strategies used to solve constraint-programming
    problems.
  constraint_propagation_and_local_consistency: Local consistency notions and constraint-propagation
    methods for reducing constraint-programming search spaces.
  heuristic_search_methods: Heuristic search methods for solving constrained combinatorial
    problems.
  hybrid_constraint_programming_heuristic_search: Hybrid methods that combine constraint
    programming with heuristic search.
