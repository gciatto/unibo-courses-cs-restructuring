analysis:
  mode: all-courses
source_clusters:
- id: 15
  name: Network Networks Programming (15)
course:
  id: '70226'
  name: Network Programming
topics:
  authorization_and_access_control: Authorization as a basic cybersecurity mechanism
    for controlling access to networked resources.
  client_server_application_architecture: The client/server model and the design of
    small client/server applications.
  computer_network_basics: Basic concepts of computer networks.
  cryptographic_authentication: Authentication using cryptographic techniques and
    protocols.
  digital_certificates: Digital certificates and their use in cryptographic systems.
  digital_signatures: Digital-signature mechanisms and their cryptographic role.
  dns_protocol: The Domain Name System (DNS) protocol.
  email_protocols_smtp_pop_imap: Email protocols including SMTP, POP, and IMAP.
  error_detection_correction_and_arq: Channel reliability mechanisms, including error
    detection versus error correction, common error-detection codes, and ARQ protocols.
  ftp_protocol: The File Transfer Protocol (FTP) as an application-layer network protocol.
  http_protocol_basics: Fundamental concepts and operation of the HTTP protocol.
  peer_to_peer_file_sharing: Peer-to-peer architectures and file-sharing applications.
  socket_programming_and_network_apis: Network communication using socket programming
    and related application programming interfaces.
  tcp_congestion_control: Congestion-control mechanisms in TCP transport communication.
  tcp_udp_transport_protocols: Transport-layer communication using TCP and UDP.
  transport_layer_services_and_multiplexing: Transport-layer services, including multiplexing
    and demultiplexing of application communication.
  wireshark_packet_capture_and_protocol_analysis: Network-protocol analysis through
    traffic capture, trace collection, debugging, and use of the Wireshark protocol
    analyzer.
