analysis:
  mode: all-courses
source_clusters:
- id: 12
  name: Knowledge Engineering Extraction (12)
course:
  id: '81609'
  name: Languages, Compilers and Computational Models
topics:
  code_generation: Generation of program code as a compiler phase.
  concurrent_process_synchronization_and_interleaving: Concurrent finite-state processes,
    including synchronization and interleaving.
  context_free_grammars_and_pushdown_automata_fundamentals: Context-free grammars,
    pushdown automata, and their relationship.
  finite_state_automata_and_regular_expressions: Finite-state automata, regular expressions,
    and their relationship.
  lexical_analysis: Lexical analysis as a stage of programming-language recognition
    and translation.
  petri_nets_for_concurrent_system_modeling: Petri nets for modeling concurrent systems.
  predicate_logic_fundamentals: Foundational concepts of predicate logic.
  propositional_logic_fundamentals: Foundational concepts of propositional logic.
  recursive_and_recursively_enumerable_problems: Recursive (decidable) and recursively
    enumerable problems.
  static_program_checking: Static checking of programs during compilation.
  syntactic_analysis: Syntactic analysis as a compiler phase.
  temporal_logic_property_specification_and_verification: Temporal logics for specifying
    and verifying system properties.
  transition_system_modeling: Transition systems for modeling system behavior.
  turing_machine_computability: Turing machines as a model of computation and their
    use in determining which functions or problems are computable.
