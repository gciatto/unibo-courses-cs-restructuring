  name: Computer Vision Image (22)
course:
  id: '70210'
  name: Lab-based Course on Computer Graphics
topics:
  computer_hardware_and_software_components: Basic hardware and software building
    blocks of a computer and processing system.
  data_compression_fundamentals: Basic results and techniques of data compression.
  digital_image_formats: Main digital formats used for images.
  operating_systems_overview: Overview of the main operating systems.
  raster_graphics_and_photoshop: Raster graphics, including pixels, color spaces,
    image and device resolution, lossy and lossless compression, common raster formats,
    and use of Adobe Photoshop.
  vector_graphics_technical_drawing_and_autocad: Vector graphics and technical drawing
    using drawing primitives and editing tools, layers, line styles and weights, screen
    frequency, printing, graphic-layout design, vector and vector/raster formats,
    and Autodesk AutoCAD.
