analysis:
  mode: all-courses
source_clusters:
- id: 16
  name: Data Algorithms Structures (16)
course:
  id: '85301'
  name: Algorithms and Data Structures in Biology
topics:
  algorithm_correctness_analysis: Techniques for analyzing the correctness of an algorithm.
  algorithm_fundamentals: Fundamental notion of an algorithm in introductory computer-science
    contexts.
  approximation_algorithms: Approximation algorithms for obtaining near-optimal solutions
    to computational problems.
  asymptotic_algorithm_cost_analysis: Using basic discrete-mathematics notions to
    calculate and estimate the order of magnitude of algorithmic computational costs.
  divide_and_conquer_algorithm_design: Divide-and-conquer as an algorithm-design technique.
  dynamic_programming_algorithm_design: Dynamic programming as an algorithm-design
    technique.
  exhaustive_search_for_biological_sequence_problems: Exhaustive-search algorithms
    applied to biological computational tasks, including restriction mapping and motif
    finding.
  greedy_algorithm_design: Greedy algorithms as an algorithm-design technique.
  recursive_algorithm_design: Recursive algorithms as a technique for solving problems.
  sorting_by_reversals: Greedy algorithms for sorting by reversals.
