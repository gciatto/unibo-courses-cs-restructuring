analysis:
  mode: all-courses
source_clusters:
- id: 4
  name: Internet Things Systems (4)
course:
  id: '78779'
  name: Mobile Systems M
topics:
  android_activities: Android application activities and their role in mobile applications.
  android_architecture_and_components: Android platform architecture and core application
    components.
  android_background_work: Performing background work in Android applications.
  android_intents: Android intents for interactions among application components.
  bluetooth_protocols_topologies_and_java: Bluetooth protocol stack, network topologies,
    discovery, scatternet and multi-hop communication, and the Bluetooth Java programming
    stack.
  cellular_network_architecture_and_handoff: GSM architecture and cellular handoff,
    including common-MSC and differentiated-MSC handoffs and handoff classifications.
  corba_messaging: CORBA Messaging, including Asynchronous Method Invocation (AMI)
    and Time-Independent Invocation (TII).
  discovery_services_and_autoconfiguration: Discovery-service taxonomies and mechanisms
    for auto-configuration, discovery, and access to resources and services.
  distributed_event_notification_systems: Distributed event systems including OMG
    DDS partitions and quality levels, the Java distributed-event model, GENA, RSS/Atom,
    the SIP Event Framework, and Web Services Eventing and Notification.
  edge_fog_computing_and_mobile_offloading: Edge and fog computing for sensor-edge-cloud
    integration, distributed control and intelligence, computation offloading, proactive
    approaches, and mobility prediction.
  ieee_802_16_and_802_20_wireless_networks: General features of IEEE 802.16 and IEEE
    802.20 wireless-network technologies.
  ios_architecture_and_components: iOS platform architecture and application components.
  iot_architectures_and_platforms: Basic architectural concepts and platforms for
    Internet-of-Things systems.
  jini_discovery_services: Jini-based resource and service discovery.
  jms_messaging: Java Message Service (JMS) architecture, messaging models, reliability
    and quality characteristics, and examples.
  manet_clustering_protocols: Clustering solutions for mobile ad-hoc networks, including
    LEACH, HEED, and REDMAN.
  manet_routing_protocols: MANET application domains and routing approaches, including
    reactive, proactive, geographic, and hybrid routing and the DSR, AODV, and GPSR
    protocols.
  mobile_data_synchronization: Data synchronization in mobile systems using pessimistic
    and optimistic approaches, versioning, change detection, and reconciliation.
  mobile_ip_and_transport_mobility_support: Location update and search, Mobile IP
    and hierarchical Mobile IPv6, and split-connection and I-TCP support for mobile
    communication.
  mobile_middleware_principles_and_architectural_patterns: Mobile middleware motivations
    and advantages; Internet, Web, SOA, mobile-computing, and cross-layering principles;
    and general and mobile-specific architectural patterns.
  mobile_positioning_systems_and_gps: Positioning systems for ad-hoc networks and
    systems using or avoiding additional hardware, including GPS and differential
    GPS, Active Badge, AHLoS, Bluetooth-based positioning, PlaceLab, RADAR, Ekahau,
    sensor fusion, Universal Location Framework, and JSR-179.
  mobile_positioning_taxonomy_and_techniques: Positioning-system motivations and taxonomies,
    including physical versus symbolic, centralized versus distributed, absolute versus
    relative systems, and lateration, TDOA, angulation, scene analysis, and proximity
    techniques.
  mobile_web_hybrid_and_native_apps: Key differences among mobile web apps, hybrid
    apps, and native apps.
  mobility_and_handoff_management: Core concepts, definitions, and management concerns
    for mobility and handoff.
  network_function_virtualization_and_open_ran: Network Function Virtualization (NFV)
    and Open RAN (O-RAN) technologies.
  publish_subscribe_event_routing: Publish/subscribe event-management models, including
    event-router topologies, propagation of interests and subscriptions, and routing
    decisions.
  service_location_protocol: The Service Location Protocol (SLP) for service discovery.
  sip_and_ims_session_management: Session management in converged 4G networks using
    SIP and IP Multimedia Subsystem (IMS) architecture, entities, protocols, monitoring,
    load balancing, and scalability considerations.
  syncml_synchronization_protocol: SyncML representation and synchronization protocols,
    with examples.
  upnp_architecture_and_service_discovery: UPnP architecture, description files, bridging
    possibilities, and service-discovery examples.
  wifi_mac_and_ad_hoc_networking: IEEE 802.11 MAC operation, including the transition
    from CSMA/CD to CSMA/CA, hidden and exposed terminals, MACA, and infrastructure
    versus ad-hoc configurations.
  wifi_mesh_and_wifi_direct: IEEE 802.11 municipal mesh networks and Wi-Fi Direct.
  wireless_communication_technology_overview: Introductory overview of major wireless
    communication technologies.
  wireless_propagation_and_fading_models: Wireless communication propagation models
    and fading models.
  xmpp_web_services_and_rest_overview: Introductory overview of XMPP, Web Services,
    and RESTful Web Services for mobile-system message exchange.
  zigbee_architecture_and_topologies: ZigBee features, architecture, and possible
    network topologies.
