analysis:
  mode: all-courses
source_clusters:
- id: 5
  name: Computing Education Informatics (5)
course:
  id: 29227-B
  name: Foundations of Informatics T
topics:
  cpp_arrays: Arrays in C++ programs.
  cpp_classes: Definition and use of classes in C++ programs.
  cpp_conditionals_and_iteration: Conditional statements and iterative control structures
    in C++.
  cpp_data_types_assignment_and_io: C++ data types, assignment, and input/output operations.
  cpp_dynamic_memory_allocation: Dynamic memory allocation in C++.
  cpp_functions: Defining and using functions in C++.
  cpp_headers_multifile_compilation_and_makefiles: C++ header files, conditional inclusion,
    compilation of multiple source files, and Makefiles.
  cpp_operator_overloading: Operator overloading in C++ classes.
  cpp_parameter_passing_and_scope: C++ function argument passing by reference, external
    variables, and variable scope.
  cpp_pointers_and_address_arithmetic: C++ pointers and addresses, pointer arithmetic,
    pointer arrays, pointers to pointers, function pointers, void pointers, and command-line
    arguments.
  cpp_variables_and_operators: Variables and operators in C++ programs.
  file_system_organization: File-system concepts and organization in operating systems.
  numerical_differentiation: Numerical approximation of derivatives.
  numerical_error_analysis_and_machine_precision: Numerical errors, including absolute,
    relative, and percentage error, cancellation, error propagation, machine precision,
    and significant digits.
  numerical_function_approximation: Numerical approximation of functions.
  numerical_integration: Numerical approximation of integrals.
  numerical_linear_systems_gaussian_elimination: Numerical solution of linear systems
    using the Gauss elimination method.
  numerical_root_finding: Numerical approximation of zeros, or roots, of functions.
  numerical_second_order_ordinary_differential_equations: Second-order ordinary differential
    equations in the context of finite-difference methods.
  operating_system_installation: Installation of an operating system.
  unix_command_line_basics: Introductory use of Unix commands and the command-line
    console.
