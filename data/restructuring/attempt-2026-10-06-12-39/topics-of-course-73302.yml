analysis:
  mode: all-courses
source_clusters:
- id: 22
  name: Computer Vision Image (22)
course:
  id: '73302'
  name: Computer Vision And Image Processing M
topics:
  camera_calibration_and_stereo_rectification: Camera intrinsic and extrinsic calibration,
    lens-distortion estimation, planar-target homography calibration using Zhang's
    algorithm, stereo calibration, and image rectification.
  cnn_object_detection_architectures: CNN-based object-detection architectures, including
    R-CNN, Feature Pyramid Networks, Faster R-CNN, and YOLO.
  connected_components_and_blob_analysis: Connected-components labeling and blob analysis
    in segmented binary images.
  convolutional_neural_networks_for_image_classification: Convolutional neural networks
    for image classification, including AlexNet, VGG, Inception, and ResNet architectures.
  digital_image_processing_and_computer_vision_fundamentals: Basic definitions of
    digital image processing and computer vision, with an overview of their application
    domains.
  hough_transform_shape_detection: Detection of analytic and general shapes using
    the standard and generalized Hough transforms.
  image_classification_with_linear_and_fully_connected_models: Image classification
    using linear classifiers and fully connected neural networks.
  image_convolution: Convolution as a basic tool for digital image processing.
  image_denoising_and_smoothing_filters: Image filtering with mean, Gaussian, median,
    bilateral, and non-local-means filters.
  image_edges_gradients_and_canny_detection: Edge and gradient features, smooth derivative
    filtering with Sobel operators, and Canny edge detection.
  image_formation_and_perspective_projection: Image-formation geometry, including
    pinhole cameras, lenses, field and depth of view, projective coordinates, and
    perspective projection matrices.
  image_keypoint_features_and_matching: Keypoint detectors and descriptors, including
    Harris corners, scale-invariant and SIFT features, and efficient kd-tree feature
    matching.
  image_object_detection: Techniques for detecting objects in images.
  image_sampling_and_quantization: Image sensing and the sampling and quantization
    of digital images.
  image_segmentation: Techniques for segmenting objects or regions from images.
  mathematical_morphology: Mathematical morphology operations for image analysis.
  neural_networks_and_deep_learning: Introduction to neural networks and deep learning.
  template_matching_similarity_metrics: Instance pattern matching using SSD, SAD,
    NCC, and ZNCC similarity measures.
  transfer_learning_for_image_classification: Transfer-learning methods for image-classification
    models.
