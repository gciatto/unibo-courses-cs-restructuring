analysis:
  mode: all-courses
source_clusters:
- id: 12
  name: Knowledge Engineering Extraction (12)
course:
  id: '66857'
  name: Logic for Computer Science
topics:
  bnf_syntax_specification: Specification of programming-language syntax using Backus–Naur
    Form (BNF).
  cardinality_and_cantors_theorem: Cardinality and Cantor's theorem.
  first_order_logic_semantics_and_natural_deduction: Semantics and natural deduction
    for first-order logic.
  first_order_logic_syntax: First-order logic syntax, including predicates, terms,
    quantifiers, free and bound variables, alpha-conversion, and substitution.
  logical_paradoxes_and_formal_logic: Logical paradoxes, their resolution, and their
    use in motivating formal logic and negative results in computer science.
  propositional_logic_metatheory: Soundness, compactness, and completeness theorems
    for propositional logic, presented without proofs.
  propositional_logic_syntax_and_semantics: Syntax of propositional logic and an overview
    of classical and intuitionistic semantics.
  propositional_natural_deduction: Classical and intuitionistic natural-deduction
    systems for propositional logic.
  set_relations_functions_and_quotients: Set-theoretic relations, functions, and quotients.
  structural_induction_and_recursion: Structural induction and structural recursion
    over grammatically defined structures.
  zf_axiomatic_set_theory: Introduction to ZF axiomatic set theory.
