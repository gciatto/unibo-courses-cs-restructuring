analysis:
  mode: all-courses
source_clusters:
- id: 25
  name: Administration Systems System (25)
course:
  id: '28020'
  name: Operating Systems T
topics:
  concurrency_and_interprocess_communication: Concurrency and communication between
    executing entities in operating systems.
  cpu_scheduling: CPU scheduling algorithms and policies in operating systems.
  file_system_organization: File-system concepts and organization in operating systems.
  hardware_synchronization_primitives: Hardware synchronization primitives for mutual
    exclusion, including test-and-set.
  io_management: Operating-system input/output management.
  java_multithreaded_programming: Multithreaded programming in Java using its basic
    mechanisms and libraries.
  memory_management: Memory management in operating systems.
  processes_and_threads: Operating-system processes and threads.
  shared_memory_synchronization: Shared-memory interaction and synchronization using
    semaphores and monitors.
  shell_and_shell_scripting: Use of shells and shell scripting.
  system_calls: Operating-system system calls.
  unix_interprocess_message_passing: Interprocess message passing, including direct
    and indirect communication, symmetry, buffering, and UNIX pipes, FIFOs, and signals.
  unix_process_management: UNIX/Linux process states, representation, management operations,
    and process-related commands.
