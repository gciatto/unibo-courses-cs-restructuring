analysis:
  mode: all-courses
source_clusters:
- id: 11
  name: Computer Computing High-Performance (11)
course:
  id: '90074'
  name: Smart Vehicular Systems
topics:
  autonomous_driving_and_adas_scenarios: Application scenarios for vehicular systems,
    from Advanced Driver Assistance Systems (ADAS) to fully autonomous driving, and
    their evolution.
  autonomous_vehicle_decision_making: Decision-making functions in autonomous vehicular
    systems.
  autonomous_vehicle_planning_and_control: Planning and control of autonomous vehicles,
    including hands-on laboratory activities.
  autonomous_vehicle_sensing_and_perception: Sensing and perception functions and
    architectures for autonomous vehicular systems.
  carla_simulation_for_autonomous_vehicles: Use of the CARLA simulator and experimental
    platforms to model, simulate, and validate autonomous and connected vehicular
    systems.
  connected_vehicle_networking_v2v_v2i: Vehicular communications for connected vehicles,
    including vehicle-to-vehicle (V2V) and vehicle-to-infrastructure (V2I) communication,
    networking, and distributed-system architectures.
  digital_twin_concepts: Digital-twin concepts in the context of simulation and complex-system
    analysis.
  vehicular_mobility_propagation_and_performance: Effects of vehicle mobility and
    wireless propagation on vehicular-system performance.
  vehicular_system_architecture_design: Selection and design of sensing, perception,
    communication, and computation architectures for connected and autonomous vehicular
    systems.
