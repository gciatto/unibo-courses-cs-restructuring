analysis:
  mode: all-courses
source_clusters:
- id: 15
  name: Network Networks Programming (15)
course:
  id: '28024'
  name: Computer Networks T
topics:
  client_server_application_architecture: The client/server model and the design of
    small client/server applications.
  computer_network_basics: Basic concepts of computer networks.
  distributed_interaction_models: Distributed-system interaction models, including
    shared-memory and message-exchange models, connection models, and interaction
    models.
  distributed_process_granularity_and_interaction: Process granularity and process
    interaction in distributed operating systems.
  distributed_resource_management: Resource-management concerns in distributed operating
    systems.
  distributed_resource_naming_and_dns: Resource naming in distributed operating systems,
    including DNS and advanced naming systems.
  distributed_system_concepts: Fundamental concepts of distributed systems.
  file_system_organization: File-system concepts and organization in operating systems.
  java_rmi_programming: Distributed application programming using Java RMI.
  network_application_services: Common network application services, including remote
    virtual terminals, file transfer, mail, and news services.
  osi_reference_model: The ISO OSI layered organization, including network and transport
    layers and the session, presentation, and application layers.
  rpc_distributed_programming: Distributed programming using RPC-like models.
  socket_programming_with_tcp_ip: Socket APIs in C on UNIX and Java for client/server
    interactions using TCP/IP protocols.
