analysis:
  mode: all-courses
source_clusters:
- id: 25
  name: Administration Systems System (25)
course:
  id: '88324'
  name: System Administration T
topics:
  ansible_configuration_management: Automated system configuration using Ansible.
  centralized_infrastructure_monitoring: Platforms and approaches for centralized
    monitoring in large-scale or heterogeneous installations.
  dns_protocol: The Domain Name System (DNS) protocol.
  gnu_linux_operating_systems: GNU/Linux operating systems.
  high_availability_concepts: Basic concepts of availability and high-availability
    distributed systems.
  infrastructure_as_code_provisioning: Automated creation and configuration of virtual
    systems as configuration as code, including OpenTofu and Vagrant.
  ldap_centralized_authentication: Centralized authentication using LDAP.
  network_bootstrap_configuration_protocols: Practical use of RARP, BOOTP, and DHCP
    for automatic network configuration.
  network_connection_monitoring: Tools for monitoring network connections.
  network_interface_and_routing_configuration: Configuration of network interfaces
    and routing on administered systems.
  scheduled_task_automation: Automating administrative activities through scheduled
    execution services.
  shell_and_shell_scripting: Use of shells and shell scripting.
  snmp_protocol: The Simple Network Management Protocol (SNMP) for centralized network
    and system monitoring.
  system_hardware_setup: Hardware setup activities as part of local system administration.
  system_logging_daemons: System logging services and daemons used in administration.
  system_resource_usage_monitoring: Command-line monitoring of system resource usage.
  unix_filesystem_permissions_and_ownership: Unix filesystem authorization mechanisms,
    including permissions and ownership.
  unix_process_management: UNIX/Linux process states, representation, management operations,
    and process-related commands.
  user_account_management: Creation and management of user accounts in administered
    systems.
