analysis:
  mode: all-courses
source_clusters:
- id: 24
  name: Systems Distributed Models (24)
course:
  id: '87474'
  name: Distributed Systems
topics:
  blockchain_as_distributed_middleware: Distributed-ledger technology and the use
    of blockchain as middleware in distributed systems.
  cap_theorem: The CAP theorem and its availability, consistency, and failure-related
    trade-offs in distributed systems.
  code_mobility: Code mobility as a distributed-systems mechanism.
  distributed_consensus: The consensus problem in distributed systems.
  distributed_data_serialization: Data presentation, serialization, and deserialization
    mechanisms and technologies for distributed systems.
  distributed_interaction_models: Distributed-system interaction models, including
    shared-memory and message-exchange models, connection models, and interaction
    models.
  distributed_replication_and_consistency: Replication models, strategies, and protocols
    in distributed systems, including consistency degrees and their effects on service
    properties.
  distributed_system_architectures: Architectural organization and models of distributed
    systems.
  distributed_system_concepts: Fundamental concepts of distributed systems.
  distributed_system_dependability: Dependability concerns in distributed systems.
  distributed_system_design_and_implementation: Guided design and implementation of
    a distributed system from scratch.
  distributed_system_modeling_tools_and_diagrams: Tools and diagrams used to model
    distributed systems.
  jade_agent_programming: Development of simple distributed agents using JADE.
  linda_coordination_model: Coordination of distributed computations using the Linda
    model.
  logical_clocks: Logical clocks for ordering events in distributed systems.
  process_algebra_for_distributed_systems: Use of process algebra to model distributed
    systems.
  rest_architectural_style: Representational State Transfer (REST) as an architectural
    style for distributed systems.
  rpc_distributed_programming: Distributed programming using RPC-like models.
  socket_programming_and_network_apis: Network communication using socket programming
    and related application programming interfaces.
