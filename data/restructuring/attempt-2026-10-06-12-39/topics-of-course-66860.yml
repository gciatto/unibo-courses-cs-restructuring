analysis:
  mode: all-courses
source_clusters:
- id: 4
  name: Internet Things Systems (4)
course:
  id: '66860'
  name: Mobile Applications Laboratory
topics:
  android_activities: Android application activities and their role in mobile applications.
  android_architecture_and_components: Android platform architecture and core application
    components.
  android_background_work: Performing background work in Android applications.
  android_compose_programmatic_ui: Programmatic Android user-interface development
    with Compose.
  android_data_management: Data management in Android applications.
  android_development_setup: Setting up the Android development environment and SDK
    tools.
  android_fragments_and_navigation: Android fragments and navigation between application
    views.
  android_intents: Android intents for interactions among application components.
  android_resources: Managing Android application resources.
  android_views_layouts_and_events: Android views, layouts, and event handling for
    user interfaces.
  architectural_design_patterns: Architectural design patterns used in application
    development.
  flutter_mobile_app_development: Mobile application development using Flutter.
  ios_architecture_and_components: iOS platform architecture and application components.
  ios_development_setup: Setting up the iOS development environment, including Xcode
    and Cocoa Touch tools.
  ios_storyboards_and_uikit: Building iOS user interfaces with Storyboards and UIKit.
  ios_targets_actions_and_outlets: iOS interface connections using targets, actions,
    and outlets.
  kotlin_for_android: Kotlin programming for Android application development.
  mobile_application_networking_services: Networking services used by mobile applications.
  mobile_application_testing: Unit testing and user-interface testing of mobile applications.
  mobile_device_technology_overview: Technological aspects of mobile devices and mobile
    application development platforms.
  mobile_maps_sensors_and_geolocation: Using maps, sensors, and geolocation capabilities
    in mobile applications.
  mobile_multimedia_management: Managing multimedia in mobile applications.
  mobile_multitouch_and_event_interfaces: Multi-touch interaction and event management
    in mobile-device user interfaces.
  mobile_web_hybrid_and_native_apps: Key differences among mobile web apps, hybrid
    apps, and native apps.
  mobile_wireless_execution_scenarios: Issues affecting application execution in wireless
    mobile scenarios.
  model_view_controller_architecture: Designing applications according to the Model-View-Controller
    architectural pattern.
  objective_c_for_ios: Objective-C programming for iOS mobile application development.
  react_native_mobile_app_development: Mobile application development using React
    Native.
  swift_for_ios: Swift programming for iOS application development.
  swiftui_programmatic_ui: Programmatic iOS user-interface development with SwiftUI.
