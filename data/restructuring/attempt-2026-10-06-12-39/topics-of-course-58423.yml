analysis:
  mode: all-courses
source_clusters:
- id: 15
  name: Network Networks Programming (15)
course:
  id: '58423'
  name: Internet Architecture
topics:
  client_server_application_architecture: The client/server model and the design of
    small client/server applications.
  computer_network_basics: Basic concepts of computer networks.
  email_protocols_smtp_pop_imap: Email protocols including SMTP, POP, and IMAP.
  http_protocol_basics: Fundamental concepts and operation of the HTTP protocol.
  internet_and_world_wide_web: The Internet and the World Wide Web.
  internet_communication_services: Internet communication services including email,
    instant messaging, and remote connections.
  internet_protocol_suite_ip_arp_rarp_icmp: Internet-layer protocols including IP,
    ARP, RARP, and ICMP.
  internet_routing: Routing in the Internet.
  internet_structure_and_architecture: The structure and architectural organization
    of the Internet.
  internetworking_fundamentals: Fundamentals of internetworking and the organization
    of the Internet.
  it_security_and_data_protection: Fundamental IT security and data-protection considerations.
  lan_wan_man_communication: Communication networks and protocols in LAN, WAN, and
    MAN settings.
  link_layer_protocols: MAC-layer communication and link-layer protocols including
    Ethernet, IEEE 802.11, HDLC, and PPP.
  network_application_services: Common network application services, including remote
    virtual terminals, file transfer, mail, and news services.
  osi_reference_model: The ISO OSI layered organization, including network and transport
    layers and the session, presentation, and application layers.
  peer_to_peer_file_sharing: Peer-to-peer architectures and file-sharing applications.
  tcp_udp_transport_protocols: Transport-layer communication using TCP and UDP.
  wireless_internet_networking: Wireless networking in relation to Internet connectivity.
