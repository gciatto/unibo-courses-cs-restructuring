  name: Informatics Informatic Humanities (29)
course:
  id: '20741'
  name: Information Processing Systems
topics:
  clinical_laboratory_data_archiving: Data archiving in clinical pathology, pathological
    anatomy, and transfusion medicine.
  computer_network_basics: Basic concepts of computer networks.
  computerization_in_healthcare_information_systems: The importance of computerization
    in healthcare information-system contexts.
  healthcare_information_system_operational_roles: The operational roles of biomedical
    laboratory technicians and system administrators in healthcare information systems.
  hospital_information_systems: Introduction to Hospital Information Systems (HIS).
  hub_and_spoke_information_system_architecture: Hub-and-spoke system architecture
    for organizing information-system connections and communication flows.
  laboratory_information_systems: Laboratory Information Systems (LIS).
  laboratory_workflow_tracking_and_system_configuration: Tracking laboratory workflows,
    including test configuration, instrument connections, department configuration,
    user authorization, and registry changes.
  operating_systems_overview: Overview of the main operating systems.
  patient_record_noncompliance_and_data_entry_errors: Management of non-compliance
    arising from patient-record data-entry errors, including incorrect records or
    sampling dates and their repercussions.
