  name: Informatics Informatic Humanities (29)
course:
  id: '28106'
  name: Computer Science for Environmental Sciences
topics:
  ai_assisted_vba_macro_generation: Using an AI system to generate VBA macros for
    spreadsheet data-cleaning tasks.
  collaborative_digital_tools: Use of digital collaborative tools.
  computer_network_basics: Basic concepts of computer networks.
  excel_vba_macro_automation: Automating spreadsheet work with Excel VBA macros, including
    inserting, verifying, debugging, and applying macros to environmental datasets.
  hypertext_and_markup_concepts: Hypertext and the classification of markup languages.
  internet_and_world_wide_web: The Internet and the World Wide Web.
  network_protocols: Network communication protocols.
  presentation_software: Use of presentation software, including PowerPoint and Google
    Presentations.
  relational_data_model_and_database_structure: The relational data model and the
    structure of relational databases.
  relational_database_keys: Keys in relational databases.
  spreadsheet_data_organization_and_cleaning: Organizing, cleaning, and preparing
    environmental data in spreadsheets.
  spreadsheet_software: Use of spreadsheet software, including Microsoft Excel and
    Google Sheets.
  sql_data_definition_and_manipulation: SQL data-definition and data-manipulation
    statements (DDL and DML).
  sql_querying: Using SQL to query relational databases.
  web_evolution_and_social_networks: Web 1.0 and Web 2.0 concepts and social networks.
  web_markup_languages_and_css: Web markup and styling languages, including XHTML,
    XML, HTML5, and CSS.
