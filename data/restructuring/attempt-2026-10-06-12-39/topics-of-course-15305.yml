analysis:
  mode: all-courses
source_clusters:
- id: 1
  name: Informatics Principles Foundations (1)
course:
  id: '15305'
  name: Foundations of Informatics A
topics:
  algorithm_notation_pseudocode_and_flowcharts: Representing algorithms using pseudocode
    and flow diagrams.
  algorithmic_problem_solving_and_programming_basics: Basic principles of algorithms
    and programming.
  binary_information_encoding: Binary encoding of information.
  c_array_searching_reversal_and_sorting: Algorithms on C arrays, including reversal,
    searching, and ordering.
  c_arrays_and_pointers: Arrays and pointers in C programs.
  c_character_strings: Character strings in C programs.
  c_control_flow_and_iteration: C control-flow structures, cycles, iteration, and
    structured programming.
  c_data_types: Data types in C programs.
  c_functions_and_recursion: Defining and using C functions, including recursive functions.
  c_operators_and_expressions: Values, operators, and expressions in C programs.
  computer_hardware_and_software_components: Basic hardware and software building
    blocks of a computer and processing system.
  fundamental_data_structures: Introduction to fundamental data structures used in
    algorithms and programs.
  numeric_data_representation: Binary representation of numeric information, including
    two's-complement integers and floating-point values.
  software_abstraction_levels: Software levels in the organization of a computer system.
  von_neumann_architecture: The von Neumann computer architecture.
