source_clusters:
- id: 18
  name: Data Management Multimedia (18)
course:
  id: '77933'
  name: Multimedia Data Management M
topics:
  automatic_multimedia_semantic_annotation: Automatic techniques for assigning semantic
    annotations to multimedia data.
  index_based_multimedia_retrieval: Index-based retrieval algorithms for multimedia
    data.
  multimedia_collection_browsing: Browsing multimedia data collections.
  multimedia_data_coding: Coding of multimedia data for multimedia data-management
    applications.
  multimedia_database_management_systems: Database management systems for managing
    multimedia data.
  multimedia_information_representation: Digital representation of multimedia information.
  multimedia_object_description_models: Description models for complex multimedia
    objects.
  multimedia_presentation_visualization_and_dimensionality_reduction: Presentation
    and exploration of multimedia data through user interfaces, visualization paradigms,
    and dimensionality-reduction techniques.
  multimedia_query_formulation: Query-formulation paradigms for multimedia data retrieval.
  multimedia_retrieval_evaluation_and_relevance_feedback: Evaluation of multimedia-retrieval
    result quality and relevance-feedback techniques.
  multimedia_similarity_measures: Similarity measures for multimedia data content
    and their use in retrieval.
  semantic_web_concepts: Semantic Web concepts for graph-based data.
  sequential_multimedia_retrieval: Sequential retrieval algorithms for multimedia
    data.
  social_network_graph_data: Social networks as graph-based data.
  web_recommender_systems: Web recommender systems and their role in suggesting relevant
    content or items.
  web_search_engines: Web search engines as systems for finding Web information.
