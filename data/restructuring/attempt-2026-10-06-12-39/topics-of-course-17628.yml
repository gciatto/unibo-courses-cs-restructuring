analysis:
  mode: all-courses
source_clusters:
- id: 25
  name: Administration Systems System (25)
course:
  id: '17628'
  name: Concurrent and Distributed Programming
topics:
  actor_based_distributed_programming: Distributed programming using actors.
  actor_model_programming: Actor-model programming for concurrent systems.
  akka_actor_programming: Actor-based programming using the Akka framework in Java
    or Scala.
  asynchronous_control_flow_patterns: Asynchronous control-flow styles including continuation-passing
    style, promises, and async/await.
  channel_based_message_passing: Synchronous and asynchronous channel-based message-passing
    models.
  cloud_computing_fundamentals: Introduction to cloud computing.
  concurrent_program_model_checking: Practical verification of concurrent-program
    properties using model checking.
  concurrent_program_modeling: Modeling concurrent programs and systems.
  distributed_algorithms: Algorithms for distributed systems.
  distributed_system_concepts: Fundamental concepts of distributed systems.
  event_loop_asynchronous_programming: Event-based asynchronous programming using
    event-loop architectures.
  futures: Future mechanisms for asynchronous computation.
  go_channel_programming: Channel-based message-passing programming in Go.
  java_executor_framework: Task-oriented asynchronous programming in Java using the
    Executors framework.
  java_monitor_implementation: Implementing monitors in Java.
  java_multithreaded_programming: Multithreaded programming in Java using its basic
    mechanisms and libraries.
  java_pathfinder_verification: Verification of concurrent Java programs using Java
    PathFinder (JPF).
  java_rmi_programming: Distributed application programming using Java RMI.
  javascript_nodejs_and_vertx_asynchronous_programming: Asynchronous programming in
    JavaScript/Node.js and Vert.x.
  ltl_safety_and_liveness_specification: Specifying safety and liveness properties
    of concurrent systems using Linear Temporal Logic (LTL).
  message_oriented_middleware: Distributed programming using message-oriented middleware.
  petri_nets_statecharts_and_activity_diagrams: Using Petri nets, Statecharts, and
    activity diagrams as visual formalisms for concurrent systems.
  rabbitmq_message_oriented_programming: Distributed application programming with
    RabbitMQ message-oriented middleware.
  reactive_programming: Reactive programming concepts and reactive extensions.
  rpc_distributed_programming: Distributed programming using RPC-like models.
  rxjava_reactive_programming: Reactive programming using RxJava.
  service_oriented_computing_fundamentals: Introduction to service-oriented computing.
  shared_memory_synchronization: Shared-memory interaction and synchronization using
    semaphores and monitors.
  task_oriented_asynchronous_programming: Task-oriented approaches to asynchronous
    programming.
