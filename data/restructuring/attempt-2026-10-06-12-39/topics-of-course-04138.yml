analysis:
  mode: all-courses
source_clusters:
- id: 25
  name: Administration Systems System (25)
course:
  id: 04138
  name: Programming Languages
topics:
  abstract_machines_interpreters_and_compilers: Abstract machines and the roles of
    interpreters and compilers in programming-language implementation.
  activation_records_and_runtime_storage: Runtime storage organization using activation-record
    stacks and heaps.
  bnf_syntax_specification: Specification of programming-language syntax using Backus–Naur
    Form (BNF).
  concurrent_and_service_oriented_programming_in_jolie: The concurrent programming
    paradigm and service-oriented computing using Jolie.
  context_free_grammars_and_pushdown_automata: Context-free grammars and push-down
    automata, including their equivalences and results such as the pumping theorem.
  deterministic_context_free_parsing: Parsing algorithms for deterministic context-free
    grammars, including LL(1), LR(0), SLR, LR(1), and LALR(1) grammars.
  environments_and_scoping_rules: Programming-language environments, scoping rules,
    and their implementation.
  exception_handling: Exceptions in programming languages.
  functional_parameters_and_closures: Functional parameters and closures.
  functional_programming_in_scala: The functional programming paradigm using Scala.
  garbage_collection: Garbage collection as a memory-management technique.
  lexical_analyzer_design_with_lex: Design of lexical analysers, including use of
    Lex.
  logic_programming_paradigm: The logical programming paradigm.
  object_oriented_classes_inheritance_and_late_binding: Object-oriented classes and
    objects, initialization, inheritance, and late binding.
  parameter_passing_modes: Parameter passing by value, reference, result, and name.
  parser_generation_with_yacc: Parser generation using YACC.
  procedure_calls_and_recursion: Sequence control, procedures, and recursion.
  programming_language_description_dimensions: Syntax, semantics, pragmatics, and
    implementation as dimensions for describing a programming language.
  programming_language_evolution: Evolution of programming languages from assembly
    language to higher-level languages.
  regular_grammars_regex_and_finite_automata: Regular grammars, regular expressions,
    and finite automata, including their equivalences and results such as the pumping
    lemma.
  structured_operational_semantics: Structured Operational Semantics (SOS) for defining
    programming-language semantics.
  subtyping_and_inheritance: The distinction between subtyping and inheritance.
  type_systems_and_type_checking: Types and type checking in programming languages.
