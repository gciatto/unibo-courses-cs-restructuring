analysis:
  mode: all-courses
source_clusters:
- id: 8
  name: Databases Database Systems (8)
course:
  id: '90107'
  name: BASI DI DATI
topics:
  conceptual_entity_relationship_modeling: Conceptual data modeling using Entity-Relationship
    diagrams.
  database_architecture_fundamentals: Basic architecture of databases in the context
    of creating relational databases.
  database_indexing_fundamentals: Fundamental database-index concepts and their role
    in data access.
  database_overview: Outline-level introduction to databases.
  database_transaction_fundamentals: Fundamental concepts of database transactions.
  entity_relationship_model_quality_verification: Verification of the quality of conceptual
    database designs expressed with the Entity-Relationship model.
  relational_algebra: Relational algebra, including its basic and derived operators.
  relational_calculus: Relational calculus as a formal query language for the relational
    data model.
  relational_data_model_and_database_structure: The relational data model and the
    structure of relational databases.
  relational_database_design_basics: Basic design of relational databases.
  sql_data_definition_and_manipulation: SQL data-definition and data-manipulation
    statements (DDL and DML).
  sql_querying: Using SQL to query relational databases.
