analysis:
  mode: all-courses
source_clusters:
- id: 7
  name: Informatica Computer Science (7)
course:
  id: '41588'
  name: INTRODUZIONE ALL'ANALISI DEI DATI
topics:
  algorithmic_problem_solving_and_programming_basics: Basic principles of algorithms
    and programming.
  analytics_types_and_enabling_techniques: Types of data analytics, including diagnostic,
    predictive, and prescriptive analytics, and their main enabling techniques.
  biological_data_types_and_structures: Types of biological data and suitable data
    structures for representing them.
  data_pipeline_design: Designing a data pipeline from data acquisition through analysis
    and value extraction.
  descriptive_analytics_with_python: Descriptive analysis of different data types
    using Python libraries.
  fundamental_data_structures: Introduction to fundamental data structures used in
    algorithms and programs.
  model_variable_importance_analysis: Analyzing models to identify important variables.
  predictive_regression_and_classification: Predictive data analysis using regression
    and classification models.
  python_control_flow_and_iteration: Sequential execution, conditional selection,
    and loop-based iteration in Python.
  python_data_analysis_libraries: Use of Python data-analysis libraries, including
    NumPy, SciPy, Matplotlib, pandas, and scikit-learn.
  python_data_types_and_data_structures: Python data types and data structures.
  python_functions: Defining and using functions in Python.
  python_language_introduction: Introductory programming in the Python language.
  statistical_hypothesis_testing: Statistical tests for analyzing data and models.
