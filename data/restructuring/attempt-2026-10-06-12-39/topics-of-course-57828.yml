analysis:
  mode: all-courses
source_clusters:
- id: 29
  name: Informatics Informatic Humanities (29)
course:
  id: '57828'
  name: Informatics
topics:
  algorithmic_problem_solving_and_programming_basics: Basic principles of algorithms
    and programming.
  cloud_collaboration_and_storage_tools: Use of cloud-based tools for online collaboration
    and file storage.
  collaborative_digital_tools: Use of digital collaborative tools.
  computational_thinking: Computational-thinking concepts for formulating and solving
    problems.
  computer_and_software_fundamentals: Introductory concepts of the computer and software.
  computer_hardware_and_software_components: Basic hardware and software building
    blocks of a computer and processing system.
  computer_hardware_organization: Hardware architecture and organization of a computer.
  computer_network_basics: Basic concepts of computer networks.
  database_basics_and_structured_archive_design: Basic database concepts of tables,
    records, and keys, and designing, creating, importing, and exporting structured-data
    archives.
  file_concepts_and_formats: The concept of computer files and their digital formats.
  file_system_basic_operations: Basic file-system operations.
  file_system_organization: File-system concepts and organization in operating systems.
  internet_and_world_wide_web: The Internet and the World Wide Web.
  internet_history_and_foundational_principles: The history, founding principles,
    and protocol-stack basis of the Internet.
  it_security_and_data_protection: Fundamental IT security and data-protection considerations.
  network_protocols: Network communication protocols.
  operating_system_structure_and_functions: The structure and main functions of an
    operating system.
  program_lifecycle: The lifecycle of a computer program.
  spreadsheet_formulas_reporting_and_data_formatting: Spreadsheet cells, formulas
    and functions; creating tables, charts, and reports; filtering, sorting, conditional
    formatting, and data import/export.
  spreadsheet_software: Use of spreadsheet software, including Microsoft Excel and
    Google Sheets.
  visual_block_programming: Programming through visual block-based programming environments.
  web_application_concepts: Basic concepts of web applications.
  web_browsing_and_institutional_portals: Browsing the Web and using institutional
    web portals.
  web_search_engine_use: Using search engines to collect information for study and
    work activities.
  word_processing_software: Use of word-processing software, including Word and Google
    Docs.
