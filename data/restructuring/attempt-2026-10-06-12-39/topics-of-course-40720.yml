analysis:
  mode: all-courses
source_clusters:
- id: 2
  name: Big Data Cloud (2)
course:
  id: '40720'
  name: Data Mining
topics:
  association_rule_mining: Discovery and use of association rules.
  bayesian_network_classification: Classification using Bayesian networks.
  chatbots_and_function_call_generation: Building chatbots and generating function
    calls with language-model tools.
  clustering_methods: Clustering methods for grouping data instances.
  data_acquisition_and_processing_for_machine_learning: Acquiring and processing data
    for machine-learning use cases.
  data_mining_applications: Introduction to the areas in which data-mining methods
    can be applied.
  data_mining_validation: Data understanding and validation in the data-mining process.
  data_preprocessing_feature_selection_and_engineering: Data preprocessing, including
    selecting attributes and creating derived attributes or features.
  data_types_and_quality_for_data_mining: Data-type characteristics and data-quality
    concerns in data-mining work.
  decision_tree_classification: Decision-tree methods for machine-learning tasks.
  feature_extraction_for_machine_learning: Extracting features for machine-learning
    models.
  generative_large_language_models: Generative large language models.
  graph_machine_learning: Machine-learning methods for graph-structured data.
  knowledge_discovery_and_crisp_dm: The knowledge-discovery process, design of a data-mining
    process, and the CRISP-DM methodology.
  language_models_transformers_and_efficient_attention: Language models, Transformer
    architectures, and efficient attention mechanisms.
  large_action_models: Large action models for generating or selecting actions.
  large_language_model_evaluation: Methods for evaluating large language models.
  machine_learning_modeling_and_output_interpretation: Machine-learning modeling and
    interpretation of model outputs.
  model_compression_and_quantization: Compression and quantization techniques for
    machine-learning models.
  neural_networks_and_deep_learning: Introduction to neural networks and deep learning.
  neuro_symbolic_methods_for_trustworthy_ai: Neuro-symbolic methods in the context
    of trustworthy AI.
  outlier_detection: Detection of outlying or anomalous data instances.
  parameter_efficient_finetuning: Parameter-efficient fine-tuning of language models,
    including QLoRA and prompt tuning.
  prompt_engineering: Designing and refining prompts for large language models.
  python_open_source_text_mining_tools: Practical text-mining and language-model development
    with Python and open-source tools including Hugging Face, LangChain, LlamaIndex,
    and Milvus.
  retrieval_augmented_generation_and_vector_databases: Retrieval-augmented generation
    and the use of vector databases for retrieval.
  similarity_and_dissimilarity_measures: Measures of similarity and dissimilarity
    used in data mining.
  statistical_data_analysis_for_data_mining: Statistical analysis of data as part
    of data understanding for data mining.
  text_classification_and_opinion_mining: Text classification and opinion-mining methods.
  text_representation_and_retrieval: Representing text and retrieving relevant textual
    information.
  text_summarization_and_information_extraction: Practical text summarization and
    information-extraction tasks.
  vision_language_models: Vision-language models that jointly process visual and language
    information.
  weka_data_mining_software: Practical use of the Weka software for data-mining tasks.
