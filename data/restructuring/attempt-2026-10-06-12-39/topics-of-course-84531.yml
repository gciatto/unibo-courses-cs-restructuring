analysis:
  mode: all-courses
source_clusters:
- id: 2
  name: Big Data Cloud (2)
course:
  id: '84531'
  name: Infrastructures For Cloud Computing and Big Data M
topics:
  batch_and_stream_big_data_processing_frameworks: Batch and streaming Big Data processing
    using MapReduce, Spark, Storm, and S4.
  cap_theorem: The CAP theorem and its availability, consistency, and failure-related
    trade-offs in distributed systems.
  cassandra_and_mongodb_nosql_storage: Global NoSQL data-storage solutions using Cassandra
    and MongoDB.
  client_server_application_architecture: The client/server model and the design of
    small client/server applications.
  cloud_computing_fundamentals: Introduction to cloud computing.
  corba_middleware_environment: CORBA middleware and its operating environment for
    distributed systems.
  distributed_interaction_models: Distributed-system interaction models, including
    shared-memory and message-exchange models, connection models, and interaction
    models.
  distributed_parallelization_models: Parallelization models considered as part of
    large distributed and cloud-system design.
  distributed_replication_and_consistency: Replication models, strategies, and protocols
    in distributed systems, including consistency degrees and their effects on service
    properties.
  distributed_system_architectures: Architectural organization and models of distributed
    systems.
  distributed_system_scalability: Scalability concerns in distributed systems.
  group_communication_and_multicast_protocols: Group and many-to-many communication
    models, protocols, and algorithms, including multicast communication.
  message_oriented_middleware: Distributed programming using message-oriented middleware.
  multicloud_resource_federation: MultiCloud systems and federation of resources in
    global distributed and cloud infrastructures.
  nosql_architectures_and_nonrelational_models: An introductory overview of NoSQL
    systems, architectures, and non-relational data models.
  openstack_iaas_platform: OpenStack as a cloud Infrastructure-as-a-Service (IaaS)
    platform.
  qos_systems_and_protocols: Systems and protocols for providing quality of service
    (QoS) in large distributed and cloud systems.
