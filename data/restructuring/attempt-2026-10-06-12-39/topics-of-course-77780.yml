analysis:
  mode: all-courses
source_clusters:
- id: 4
  name: Internet Things Systems (4)
course:
  id: '77780'
  name: Embedded Systems Programming and Internet of Things
topics:
  arduino_uno_cpp_and_wiring_programming: Laboratory use of the Arduino UNO microcontroller
    platform, including an introduction to C++ and the Wiring framework.
  augmented_reality_introduction: Brief introductory overview of augmented reality.
  digital_twin_concepts: Digital-twin concepts in the context of simulation and complex-system
    analysis.
  embedded_event_driven_architectures: Event-driven architectural models for embedded-system
    software.
  embedded_hardware_components: Embedded-system hardware basics, including microcontrollers,
    systems-on-chip, sensors, actuators, and electronics.
  embedded_iot_networks_protocols_and_wireless: Network models and architectures,
    communication protocols, and wireless technologies for networks of embedded systems
    and IoT.
  embedded_message_passing_models: Message-passing models for communication among
    embedded systems and IoT components.
  embedded_rtos_architectures: Embedded-software architectures based on a real-time
    operating system.
  embedded_super_loop_programming: The super-loop programming model for embedded systems.
  embedded_systems_and_iot_fundamentals: Introductory concepts of embedded systems,
    embedded software, and the Internet of Things.
  embedded_task_programming_models: Task-based programming models for embedded systems.
  esp32_and_freertos_platform: Use of the ESP32 system-on-chip as an IoT-oriented
    embedded platform with the FreeRTOS real-time operating system.
  finite_state_machine_model: The finite-state-machine model.
  iot_architectures_and_platforms: Basic architectural concepts and platforms for
    Internet-of-Things systems.
  iot_augmented_mixed_and_mirror_worlds: Introductory connections between IoT and
    augmented or mixed reality, including mirror and augmented worlds.
  iot_mobile_system_integration_and_app_programming: Integration of IoT systems with
    mobile systems and mobile-application programming.
  mobile_device_technology_overview: Technological aspects of mobile devices and mobile
    application development platforms.
  web_of_things: Introductory Web of Things concepts.
