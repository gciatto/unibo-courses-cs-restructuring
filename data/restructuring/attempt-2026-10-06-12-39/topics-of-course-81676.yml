analysis:
  mode: all-courses
source_clusters:
- id: 29
  name: Informatics Informatic Humanities (29)
course:
  id: '81676'
  name: Digital Forensic
topics:
  cloud_forensics: Forensic investigation involving cloud-computing environments and
    data.
  digital_crime_and_incident_scene_processing: Processing crime scenes and incident
    scenes in digital-forensics investigations.
  digital_forensic_analysis_and_validation: Analysis and validation of digital-forensics
    evidence and results.
  digital_forensic_data_acquisition_and_chain_of_custody: Procedures for acquiring
    and preserving digital data, including the importance of chain of custody.
  digital_forensics_expert_witness_ethics: Ethical responsibilities of expert witnesses
    in digital-forensics contexts.
  digital_forensics_office_and_laboratory: Organization and operation of the investigator's
    office and digital-forensics laboratory.
  digital_forensics_profession_and_investigations: The digital-forensics profession
    and the conduct of digital investigations.
  digital_forensics_report_writing: Drafting final reports for high-technology and
    digital-forensics investigations.
  digital_forensics_tools: Use of current tools for digital-forensics tasks and common
    investigation scenarios.
  email_and_social_media_forensics: Forensic investigation of email and social-media
    evidence.
  expert_testimony_in_digital_investigations: Expert testimony in digital investigations.
  graphics_file_recovery: Recovery of graphics files in digital-forensics investigations.
  linux_and_macos_file_system_forensics: Forensic examination of Linux and Macintosh
    file systems.
  mobile_device_forensics: Forensic investigation of mobile devices, including smartphones
    and tablets.
  network_forensics: Forensic investigation of wired and wireless network evidence.
  virtual_machine_and_live_acquisition_forensics: Forensic investigation of virtual
    machines and live acquisition of digital evidence.
  windows_and_command_line_forensics: Digital-forensics work involving Windows systems
    and command-line-interface systems.
