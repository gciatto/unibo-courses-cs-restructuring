analysis:
  mode: all-courses
source_clusters:
- id: 19
  name: Cultural Heritage Computer (19)
course:
  id: 48693-A
  name: Computer Science for Cultural Heritage
topics:
  computer_hardware_and_software_components: Basic hardware and software building
    blocks of a computer and processing system.
  digital_humanities_data_lifecycle_management: Management of humanities data throughout
    the lifecycle of a Digital Humanities project.
  digital_image_processing_for_virtual_restoration: Digital image processing in support
    of virtual restoration of cultural-heritage resources.
  digital_text_and_document_transcription_and_analysis: Digital transcription and
    analysis of texts and documentary resources in cultural-heritage study.
  fair_data_management_principles: 'Designing digital resources according to FAIR
    principles: findability, accessibility, interoperability, and reusability.'
  gis_and_historical_cartography: Use of GIS together with historical cartography
    for cultural-heritage investigation.
  humanities_database_and_web_database_management: Creation and management of databases
    and web databases for humanities and cultural-heritage resources.
  three_dimensional_acquisition_for_cultural_heritage: Three-dimensional acquisition
    of historical and archaeological contexts for cultural-heritage study.
  three_dimensional_modeling_for_cultural_heritage: Three-dimensional modeling for
    reconstructing cultural-heritage objects.
  virtual_restoration_of_cultural_heritage: Virtual restoration of cultural-heritage
    objects using three-dimensional reconstruction and modeling.
