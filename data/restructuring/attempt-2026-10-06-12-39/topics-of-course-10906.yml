analysis:
  mode: all-courses
source_clusters:
- id: 8
  name: Databases Database Systems (8)
course:
  id: '10906'
  name: Databases
topics:
  data_integrity_constraints: Integrity constraints on data in relational databases.
  database_requirements_and_conceptual_design: Requirements analysis and conceptual
    relational-database design using the Entity-Relationship model.
  logical_database_design: Logical relational-database design, including workload
    estimation, schema restructuring, and translation of entities and associations
    into a relational schema.
  normal_forms_and_normalization: Relational normal forms and normalization techniques.
  nosql_architectures_and_nonrelational_models: An introductory overview of NoSQL
    systems, architectures, and non-relational data models.
  rdbms_component_architecture: 'The roles of RDBMS components: query optimizer, transaction
    manager, scheduler, recovery manager, cache manager, storage manager, and access
    methods.'
  relational_data_model_and_database_structure: The relational data model and the
    structure of relational databases.
  sql_data_definition_and_manipulation: SQL data-definition and data-manipulation
    statements (DDL and DML).
  sql_querying: Using SQL to query relational databases.
