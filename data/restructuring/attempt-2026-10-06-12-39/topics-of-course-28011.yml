analysis:
  mode: all-courses
source_clusters:
- id: 12
  name: Knowledge Engineering Extraction (12)
course:
  id: '28011'
  name: Logic Design T
topics:
  asynchronous_sequential_logic_networks: Analysis and synthesis of asynchronous sequential
    logic networks.
  binary_information_encoding: Binary encoding of information.
  boolean_algebra_and_logical_functions: Boolean algebra, Boolean expressions and
    functions, logic gates, and circuit diagrams.
  combinational_logic_analysis_and_synthesis: Analysis and synthesis of combinational
    logic networks.
  cpu_structure: Basic structure of a CPU within computer architecture.
  digital_memory_fundamentals: Basic elements and organization of digital memories.
  finite_state_machine_model: The finite-state-machine model.
  io_interface_fundamentals: Basic elements of input/output interfaces in digital
    systems.
  programmable_logic_design: Programmable logic devices and their digital-circuit
    design flow.
  sequential_logic_circuits: Design and operation of sequential logic circuits, without
    restricting coverage to synchronous or asynchronous designs.
  verilog_hardware_description_language: Introduction to using the Verilog hardware-description
    language in programmable-logic design.
