  mode: all-courses
source_clusters:
- id: 20
  name: Language Natural Processing (20)
course:
  id: '87898'
  name: Methods and Technologies for Interpreting
topics:
  advanced_web_search_for_interpreter_preparation: Advanced use of search engines
    for documentation research in preparation for conference interpreting.
  ai_supported_terminology_extraction: Comparison of traditional terminology-extraction
    methods with AI-supported extraction methods.
  interpretation_booth_glossary_consultation_tools: Consulting glossaries during conference
    interpreting using booth-oriented software, including Interplex and InterpretBank.
  interpreter_documentation_strategies: Traditional and AI-supported documentation
    strategies for preparing conference interpreters.
  specialized_corpus_construction_with_bootcat: Construction and use of electronic
    specialized corpora with BootCaT to support terminology extraction.
  terminography_glossary_and_terminology_database_management: Creating and managing
    glossaries and terminology databases with terminographic tools, including MultiTerm.
  terminology_theory_and_detection: Theoretical foundations of terminology and basic
    terminology-detection tools, including AntConc.
