analysis:
  mode: all-courses
source_clusters:
- id: 25
  name: Administration Systems System (25)
course:
  id: '28652'
  name: IT Systems T-1
topics:
  data_flow_diagrams_and_workflows: Modeling information-system flows and operations
    using Data-Flow Diagrams and workflows.
  database_btree_indexing: B+tree indexes as part of the physical organization of
    relational databases.
  database_parallelism_and_replication: Parallel database architectures and data replication
    in relational systems.
  database_recovery: Recovery of database information following failures or malfunctions.
  database_requirements_and_conceptual_design: Requirements analysis and conceptual
    relational-database design using the Entity-Relationship model.
  database_transactions_and_concurrency_control: Database transactions, including
    ACID properties, concurrency management, and concurrency-control protocols.
  distributed_database_fragmentation_and_transactions: Distributed database fragmentation
    and distributed transaction management.
  enterprise_resource_planning_systems: Enterprise Resource Planning (ERP) systems
    as a class of organizational information systems.
  integrated_data_and_function_design: Integrated design of data structures and system
    functions in information systems.
  logical_database_design: Logical relational-database design, including workload
    estimation, schema restructuring, and translation of entities and associations
    into a relational schema.
  normal_forms_and_normalization: Relational normal forms and normalization techniques.
  organizational_information_systems: Information systems used by firms or organizations.
  query_optimization_and_join_methods: Database join methods and query optimization.
  relational_algebra: Relational algebra, including its basic and derived operators.
  relational_data_model_and_database_structure: The relational data model and the
    structure of relational databases.
  sql_data_definition_and_manipulation: SQL data-definition and data-manipulation
    statements (DDL and DML).
  sql_querying: Using SQL to query relational databases.
  sql_views: Definition and use of SQL views.
