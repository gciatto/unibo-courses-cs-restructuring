analysis:
  mode: all-courses
source_clusters:
- id: 5
  name: Computing Education Informatics (5)
course:
  id: '88145'
  name: Fundamentals of Computer Programming P1
topics:
  algorithm_notation_pseudocode_and_flowcharts: Representing algorithms using pseudocode
    and flow diagrams.
  algorithmic_problem_solving_and_programming_basics: Basic principles of algorithms
    and programming.
  c_arrays_and_matrices: C arrays, multidimensional arrays, and matrices.
  c_character_strings: Character strings in C programs.
  c_command_line_arguments: Receiving and using command-line input arguments in C
    programs.
  c_compilation_and_linking: Compiling and linking C programs using software development
    tools.
  c_control_flow_and_iteration: C control-flow structures, cycles, iteration, and
    structured programming.
  c_cross_compilation_for_embedded_devices: Elements of cross-compiling C programs
    and programming embedded devices.
  c_data_types: Data types in C programs.
  c_dynamic_memory_management: Functions for direct memory management in C.
  c_file_handling: File-handling functions in C.
  c_functions_and_recursion: Defining and using C functions, including recursive functions.
  c_input_output_functions: Input/output functions in C.
  c_language_libraries: Using functions provided by C language libraries.
  c_structures: Definition and use of structures in C programs.
  c_variables_constants_and_identifiers: Variables, constants, and identifiers in
    introductory C programming.
  computer_hardware_organization: Hardware architecture and organization of a computer.
  file_system_organization: File-system concepts and organization in operating systems.
  machine_language_fundamentals: General characteristics and use of machine languages.
  numerical_and_alphanumeric_data_representation: Representation of numerical and
    alphanumeric data in computer programs.
  operating_system_scheduling: Scheduling in operating systems.
  searching_and_sorting_c_vectors: Searching and sorting algorithms implemented on
    C vectors (arrays).
