analysis:
  mode: all-courses
source_clusters:
- id: 29
  name: Informatics Informatic Humanities (29)
course:
  id: 08574-A
  name: Operating Systems
topics:
  ansi_c_programming_language: Programming using the ANSI C language.
  concurrency_and_interprocess_communication: Concurrency and communication between
    executing entities in operating systems.
  concurrent_programming_synchronization_and_liveness: Concurrent programming concerns
    including deadlock, starvation, and busy waiting.
  containerization_and_orchestration: Containers, Docker, and Kubernetes.
  cpu_scheduling: CPU scheduling algorithms and policies in operating systems.
  file_system_organization: File-system concepts and organization in operating systems.
  io_management: Operating-system input/output management.
  linux_and_windows_operating_system_case_studies: Case-study examination of Linux
    and Windows operating systems.
  linux_kernel: The Linux kernel.
  memory_management: Memory management in operating systems.
  operating_system_history: Introduction to and history of operating systems.
  operating_system_structure_and_functions: The structure and main functions of an
    operating system.
  processes_and_threads: Operating-system processes and threads.
  secondary_storage_management: Management of secondary storage in operating systems.
  shell_and_shell_scripting: Use of shells and shell scripting.
  virtualization_and_cloud_service_models: Introduction to virtualization and the
    IaaS and PaaS cloud service models.
