analysis:
  mode: all-courses
source_clusters:
- id: 20
  name: Language Natural Processing (20)
course:
  id: '72940'
  name: Computational Models And Languages M
topics:
  formal_grammars_and_chomsky_hierarchy: Formal grammar-based description of programming
    and specification languages, including the Chomsky classification of grammars.
  formal_language_semantics: Formal methods for describing the semantic aspects of
    programming and specification languages.
  function_evaluation_models: Models for evaluating functions in programming languages.
  functional_parameters_and_closures: Functional parameters and closures.
  functional_programming_fundamentals: Basic concepts and practical use of functional
    programming.
  interpreter_compiler_structure_and_runtime_support: Organization of interpreters
    and compilers, including their runtime support and illustrative Java-based examples.
  iterative_recursive_computation_and_tail_calls: Iterative and recursive computational
    models, including tail-recursion optimization.
  javascript_functional_programming_and_prototypes: JavaScript as a dynamic functional
    language with a prototype-based object model.
  lambda_calculus_fundamentals: Introductory concepts of lambda calculus.
  lexical_analysis: Lexical analysis as a stage of programming-language recognition
    and translation.
  parser_generator_tools: Use of parser-generator tools in language recognition and
    translation.
  scala_and_kotlin_multi_paradigm_programming: Scala and Kotlin as blended multi-paradigm
    programming languages on the Java platform.
  top_down_and_bottom_up_parsing: Top-down and bottom-up syntactic-analysis techniques
    for regular and context-free languages.
  turing_machine_computability: Turing machines as a model of computation and their
    use in determining which functions or problems are computable.
  xtext_language_development: Model-driven language development using Xtext.
