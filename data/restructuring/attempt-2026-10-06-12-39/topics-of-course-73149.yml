analysis:
  mode: all-courses
source_clusters:
- id: 12
  name: Knowledge Engineering Extraction (12)
course:
  id: '73149'
  name: Logic for Informatics
topics:
  action_logic: Action logic for reasoning about actions.
  first_order_logic_syntax: First-order logic syntax, including predicates, terms,
    quantifiers, free and bound variables, alpha-conversion, and substitution.
  imperative_programming_fundamentals: Fundamental constructs of imperative programming.
  information_theory_fundamentals: Basic results and foundational concepts of information
    theory.
  knowledge_representation_for_automated_reasoning: Knowledge-representation techniques
    in the context of automated reasoning.
  modal_and_epistemic_logic: Modal logic and epistemic logic.
  propositional_logic_syntax_and_semantics: Syntax of propositional logic and an overview
    of classical and intuitionistic semantics.
  syllogistic_logic: Syllogistic logic and its logical forms.
  turing_machine_computability: Turing machines as a model of computation and their
    use in determining which functions or problems are computable.
