analysis:
  mode: all-courses
source_clusters:
- id: 8
  name: Databases Database Systems (8)
course:
  id: '79194'
  name: Databases
topics:
  conceptual_entity_relationship_modeling: Conceptual data modeling using Entity-Relationship
    diagrams.
  data_integrity_constraints: Integrity constraints on data in relational databases.
  database_management_systems: Database management systems as software for managing
    database data.
  elementary_complex_and_web_data: Elementary, complex, and Web-based data as introductory
    categories for understanding data.
  introduction_to_nosql_systems: Brief introduction to NoSQL database systems.
  nonrelational_database_query_languages: Languages used to access or query non-relational
    databases.
  r_statistical_data_analysis: Practical statistical analysis in R using data from
    databases and the Web.
  relational_data_model_and_database_structure: The relational data model and the
    structure of relational databases.
  relational_schema_modeling: Logical data modeling through relational schemas.
  sql_data_definition_and_manipulation: SQL data-definition and data-manipulation
    statements (DDL and DML).
  sql_querying: Using SQL to query relational databases.
  sql_views: Definition and use of SQL views.
