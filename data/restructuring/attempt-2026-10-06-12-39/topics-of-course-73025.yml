analysis:
  mode: all-courses
source_clusters:
- id: 25
  name: Administration Systems System (25)
course:
  id: '73025'
  name: Distributed Systems M
topics:
  application_server_clustering_jboss_wildfly: Clustering configuration and proprietary
    clustering mechanisms of JBoss/WildFly application servers for scalable distributed
    deployments.
  application_servers_jboss_wildfly: Use of JBoss/WildFly application servers as runtime
    platforms for developing and deploying enterprise distributed applications.
  component_based_distributed_architectures: Evolution and integration of component-based
    models within distributed enterprise architectures, including three-tier and web-integrated
    deployments.
  distributed_system_architectures: Architectural organization and models of distributed
    systems.
  distributed_system_scalability: Scalability concerns in distributed systems.
  ejb_component_services: Enterprise JavaBeans services and components, including
    session-oriented and message-oriented components, persistence, interceptors, and
    their evolution through EJB 3.0.
  enterprise_application_naming_jndi: Enterprise naming and directory services, with
    Java Naming and Directory Interface (JNDI) examples and deployment integration.
  enterprise_java_beans_container_model: Enterprise JavaBeans (EJB) as an example
    of a heavy component-container model for enterprise web applications.
  enterprise_service_bus_and_jbi: Enterprise Service Bus concepts and Java Business
    Integration (JBI) as enterprise messaging and integration technologies.
  enterprise_transaction_management: Transaction-management support in enterprise
    application components and lightweight application frameworks.
  function_as_a_service: Function-as-a-Service (FaaS) execution models and supporting
    frameworks for scalable enterprise-server applications.
  jpa_hibernate_persistence: Enterprise persistence using JPA and Hibernate, including
    transparent persistence, object-relational mapping, queries, metadata, and performance
    considerations.
  message_oriented_middleware: Distributed programming using message-oriented middleware.
  nodejs_event_driven_stateless_servers: Event-oriented and stateless server-side
    web models using Node.js, including asynchronous I/O management.
  online_stream_processing: Introductory high-performance online processing of big-data
    streams over clustered distributed systems.
  runtime_monitoring_and_management_jmx: Runtime monitoring, control, and management
    of application servers and distributed support frameworks using JMX, including
    evaluation of performance, scalability, fault tolerance, and reliability.
  spring_ioc_aop_and_transactions: Spring framework mechanisms for inversion of control,
    aspect-oriented programming, and transaction management.
  spring_lightweight_container_model: Spring as an example of a lightweight container
    model for enterprise web applications.
  web_multitier_architecture_and_container_models: Multi-layer web architectures,
    including horizontal and vertical distribution, business-logic separation, and
    component-container models.
