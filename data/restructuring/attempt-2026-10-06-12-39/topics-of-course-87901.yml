  name: Language Natural Processing (20)
course:
  id: '87901'
  name: Methods and Advanced Technologies for Interpreting
topics:
  interpretation_booth_glossary_consultation_tools: Consulting glossaries during conference
    interpreting using booth-oriented software, including Interplex and InterpretBank.
  real_time_audiovisual_subtitling_accessibility: Techniques for producing real-time
    subtitles for audiovisual products, particularly to support deaf audiences.
  speech_recognition_for_intralingual_live_subtitling: Use of speech-recognition software
    to produce intralingual live subtitles from public speeches, including DIT.tafono
    and Dragon NaturallySpeaking and practical voice-input transcription exercises.
  terminography_glossary_and_terminology_database_management: Creating and managing
    glossaries and terminology databases with terminographic tools, including MultiTerm.
