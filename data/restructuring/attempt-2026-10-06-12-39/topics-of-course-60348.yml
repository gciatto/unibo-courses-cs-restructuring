analysis:
  mode: all-courses
source_clusters:
- id: 1
  name: Informatics Principles Foundations (1)
course:
  id: '60348'
  name: Informatics
topics:
  algorithm_design_and_analysis: Algorithmic problem-solving, including the design
    and analysis of solution algorithms.
  algorithm_fundamentals: Fundamental notion of an algorithm in introductory computer-science
    contexts.
  computational_complexity: Introduction to computational complexity.
  computer_hardware_and_software_components: Basic hardware and software building
    blocks of a computer and processing system.
  computer_hardware_organization: Hardware architecture and organization of a computer.
  computer_network_basics: Basic concepts of computer networks.
  computer_performance_measurement: Measurement of computer performance.
  development_environment_use: Use of a software development environment for program
    development.
  internet_and_world_wide_web: The Internet and the World Wide Web.
  internet_communication_services: Internet communication services including email,
    instant messaging, and remote connections.
  it_security_and_data_protection: Fundamental IT security and data-protection considerations.
  operating_system_structure_and_functions: The structure and main functions of an
    operating system.
  r_data_types: Data types in the R language.
  r_functions: Defining and using procedures and functions in R programs.
  r_program_design_implementation_and_testing: Designing, implementing, and testing
    programs using R.
  r_random_value_generation: Generation and use of random values in R.
  r_structured_programming: Structured programming in R, including sequence, iteration,
    and choice constructs.
