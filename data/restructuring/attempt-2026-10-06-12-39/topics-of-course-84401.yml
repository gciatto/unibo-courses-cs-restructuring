analysis:
  mode: all-courses
source_clusters:
- id: 4
  name: Internet Things Systems (4)
course:
  id: '84401'
  name: Context-Aware Systems
topics:
  containerization_with_docker: Containerization of software applications using Docker.
  context_aware_computing_fundamentals: Definitions, core concepts, and use cases
    of context-aware computing and context-aware systems.
  context_aware_edge_task_allocation: Metrics and workload-allocation decisions for
    mobile edge computing based on user or device context, including location.
  context_aware_system_architectures: Reference software architectures and system
    typologies for context-aware and ubiquitous applications.
  context_data_representation_and_management: Models for representing and managing
    context data.
  docker_swarm_and_kubernetes_orchestration: Orchestration of services and workloads
    using Docker Swarm and Kubernetes.
  human_activity_recognition_architectures_and_algorithms: Architectures and algorithms
    for human activity recognition in activity-aware systems.
  localization_technologies: Technologies for localizing users and devices in context-aware
    systems.
  location_based_services: Location-aware systems and location-based services.
  location_intelligence: Location-intelligence methods and uses in location-aware
    systems.
  mapping_apis_for_geospatial_visualization: Use of mapping APIs to visualize geospatial
    data on maps.
  mobile_edge_computing_architectures: Mobile edge computing architectures, definitions,
    and application examples for distributed context-aware systems.
  mobility_aware_service_migration: Migration of services in response to user or device
    mobility.
  spatial_data_privacy: Privacy issues concerning location and spatial data.
  spatial_database_management: Management and storage of spatial data using spatial
    database management systems.
  supervised_human_activity_recognition: Human activity recognition using supervised
    artificial-intelligence techniques.
