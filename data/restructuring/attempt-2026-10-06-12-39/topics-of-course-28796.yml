analysis:
  mode: all-courses
source_clusters:
- id: 8
  name: Databases Database Systems (8)
course:
  id: '28796'
  name: Elements of Databases
topics:
  basic_data_mining_techniques: Basic data-mining techniques used in data-mining projects.
  boolean_and_vector_space_information_retrieval: Information-retrieval models based
    on Boolean retrieval and vector-space retrieval.
  data_warehouse_lifecycle_and_design: 'Data-warehouse lifecycle and design activities:
    data-source and requirements analysis, conceptual and logical design, workload
    and data-volume analysis, ETL-procedure design, and physical design.'
  reporting_and_olap_analysis: Data-analysis techniques based on reporting and OLAP.
  sql_limitations_for_semistructured_data: Limitations of SQL when working with semi-structured
    and unstructured data.
  sql_xml: SQL/XML constructs for representing and querying XML-related semi-structured
    data.
  structured_unstructured_and_semistructured_data_models: Structured, unstructured,
    and semi-structured data models.
  web_information_retrieval_and_pagerank: Web information retrieval, including the
    PageRank algorithm.
  xquery: Introduction to XQuery for querying XML data.
