analysis:
  mode: all-courses
source_clusters:
- id: 12
  name: Knowledge Engineering Extraction (12)
course:
  id: '85446'
  name: Knowledge Representation and Extraction
topics:
  description_logic: Description logic as a computational-logic formalism for knowledge
    representation and reasoning.
  foundational_philosophical_and_cognitive_views_of_knowledge: Philosophical and cognitive
    viewpoints on knowledge representation and knowledge extraction.
  generative_ai_for_knowledge_extraction: Use of generative AI models as statistical
    methods for extracting knowledge from content.
  knowledge_graph_fundamentals: Knowledge graphs as representations of machine-queryable
    knowledge supporting automated inference.
  knowledge_representation_for_automated_reasoning: Knowledge-representation techniques
    in the context of automated reasoning.
  knowledge_requirements_analysis_and_implementation_planning: Analysis of customer
    knowledge requirements and preparation of a plan to implement them.
  linked_open_data_concepts: Linked Open Data concepts for publishing and connecting
    Web data.
  ontology_design_patterns: Ontology design patterns for structuring reusable knowledge
    representations.
  rule_based_knowledge_extraction: Rule-based knowledge-extraction heuristics, including
    scraping, linguistic patterns, and graph-based data analysis.
  semantic_web_concepts: Semantic Web concepts for graph-based data.
  text_summarization_and_information_extraction: Practical text summarization and
    information-extraction tasks.
