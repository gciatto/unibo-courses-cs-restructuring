analysis:
  mode: all-courses
source_clusters:
- id: 7
  name: Informatica Computer Science (7)
course:
  id: '85189'
  name: Systems and Algorithms for Data Science
topics:
  autoencoder_models: Autoencoder models as generative neural-network architectures.
  collaborative_software_development_tools: Use of collaborative tools for software
    development.
  convolutional_neural_networks: Convolutional neural networks as a deep-learning
    architecture.
  deep_learning_frameworks_pytorch_tensorflow: Using PyTorch and TensorFlow environments
    and libraries to define and use machine-learning models.
  development_environment_use: Use of a software development environment for program
    development.
  generative_adversarial_networks: Generative adversarial networks (GANs) as generative
    deep-learning models.
  hugging_face_model_platform: Use of the Hugging Face platform to support data analysis
    and machine-learning model work.
  large_language_models: Large language models and their relationship to Transformer
    architectures.
  lstm_neural_networks: Long short-term memory (LSTM) neural networks for sequential
    data.
  natural_language_processing_fundamentals: Fundamental natural-language-processing
    methods for text analysis.
  neural_networks_and_deep_learning: Introduction to neural networks and deep learning.
  notebook_based_data_science_environments: Using Jupyter Notebook and Google Colab
    as notebook-based environments for data analysis and sharing.
  python_collections_and_comprehensions: Python tuples, lists, sets, dictionaries,
    and comprehension syntax.
  python_control_flow_and_iteration: Sequential execution, conditional selection,
    and loop-based iteration in Python.
  python_data_analysis_libraries: Use of Python data-analysis libraries, including
    NumPy, SciPy, Matplotlib, pandas, and scikit-learn.
  recurrent_neural_networks: Recurrent neural networks as a deep-learning architecture
    for sequential data.
  supervised_and_unsupervised_learning: The distinction between supervised and unsupervised
    machine-learning paradigms.
  topic_modeling: Topic-modeling methods for discovering themes in text collections.
  transformer_architectures: Transformer neural-network architectures.
