analysis:
  mode: all-courses
source_clusters:
- id: 8
  name: Databases Database Systems (8)
course:
  id: 10906-A
  name: Databases
topics:
  client_server_rdbms_architectures: Main client-server architectures for relational
    database management systems.
  database_application_data_access: Database-application data-access modalities, with
    examples using Java and .NET C#.
  database_requirements_and_conceptual_design: Requirements analysis and conceptual
    relational-database design using the Entity-Relationship model.
  database_storage_structures_and_indexing: Secondary-memory database storage organizations
    and access algorithms, including sequential and direct access, primary and secondary
    indexes, and B-tree, B*-tree, and B+tree structures.
  database_transactions_and_concurrency_control: Database transactions, including
    ACID properties, concurrency management, and concurrency-control protocols.
  distributed_and_cloud_databases_overview: Overview of distributed DBMSs and cloud
    databases.
  introduction_to_nosql_systems: Brief introduction to NoSQL database systems.
  logical_database_design: Logical relational-database design, including workload
    estimation, schema restructuring, and translation of entities and associations
    into a relational schema.
  normal_forms_and_normalization: Relational normal forms and normalization techniques.
  rdbms_component_architecture: 'The roles of RDBMS components: query optimizer, transaction
    manager, scheduler, recovery manager, cache manager, storage manager, and access
    methods.'
  relational_algebra: Relational algebra, including its basic and derived operators.
  relational_data_model_and_database_structure: The relational data model and the
    structure of relational databases.
  sql_data_definition_and_manipulation: SQL data-definition and data-manipulation
    statements (DDL and DML).
  sql_querying: Using SQL to query relational databases.
