analysis:
  mode: all-courses
source_clusters:
- id: 12
  name: Knowledge Engineering Extraction (12)
course:
  id: '42500'
  name: Semantic Web
topics:
  graph_machine_learning: Machine-learning methods for graph-structured data.
  knowledge_graph_completion: Methods for completing missing information in knowledge
    graphs.
  knowledge_graph_embeddings: Embedding methods for representing knowledge-graph entities
    and relations in vector spaces.
  knowledge_graph_mapping_and_alignment: Mapping and alignment of knowledge graphs
    and their semantic resources.
  knowledge_graph_programming_visualization_and_analytics: Knowledge-graph programming
    together with knowledge-graph visualization and analytics applications.
  linked_open_data_concepts: Linked Open Data concepts for publishing and connecting
    Web data.
  owl_ontology_representation: Knowledge representation with ontologies using OWL.
  rdf_rdfs_and_logical_inference: RDF and RDFS representations and logical inference
    over RDF data.
  rdfa_and_microformats: RDFa and microformats for embedding semantic metadata in
    web resources.
  semantic_search: Semantic-search methods for retrieving resources using semantic
    representations.
  semantic_web_concepts: Semantic Web concepts for graph-based data.
  sparql_rdf_querying: Querying RDF data with SPARQL, including use of the DBpedia
    knowledge graph.
