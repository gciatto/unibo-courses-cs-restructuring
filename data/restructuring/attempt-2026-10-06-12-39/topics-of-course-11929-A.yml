analysis:
  mode: all-courses
source_clusters:
- id: 16
  name: Data Algorithms Structures (16)
course:
  id: 11929-A
  name: Algorithms and Data Structures
topics:
  algorithm_correctness_analysis: Techniques for analyzing the correctness of an algorithm.
  asymptotic_algorithm_cost_analysis: Using basic discrete-mathematics notions to
    calculate and estimate the order of magnitude of algorithmic computational costs.
  binary_search_trees_and_balancing: Binary search trees and balanced binary search
    trees.
  complexity_classes_p_np_np_hard: Complexity classes P and NP, NP-complete and NP-hard
    problems, and the P versus NP question.
  dictionary_abstract_data_types: Dictionary data structures and their use.
  divide_and_conquer_algorithm_design: Divide-and-conquer as an algorithm-design technique.
  dynamic_programming_algorithm_design: Dynamic programming as an algorithm-design
    technique.
  graph_data_structures: Graphs as elementary data structures.
  graph_search_algorithms: Search algorithms on graphs.
  greedy_algorithm_design: Greedy algorithms as an algorithm-design technique.
  hash_tables: Hash tables as dictionary implementations.
  heap_data_structures_priority_queues_and_heapsort: Heap data structures, priority
    queues, and HeapSort.
  linked_list_data_structures: Lists as elementary data structures, including their
    implementation and use.
  minimum_spanning_tree_algorithms: Minimum-spanning-tree algorithms, including Prim's
    and Kruskal's algorithms.
  object_oriented_programming_and_java_basics: Introduction to the object-oriented
    paradigm and basic Java notions.
  recurrence_relations_for_algorithm_analysis: Recurrence equations used in the analysis
    of algorithm costs.
  shortest_path_algorithms: Shortest-path algorithms, including Bellman-Ford, Dijkstra,
    and Floyd-Warshall.
  sorting_algorithms: Sorting algorithms.
  stack_and_queue_data_structures: Elementary stack and queue data structures.
  tree_data_structures_and_traversals: Tree data structures and preorder, inorder,
    and postorder traversals.
  union_find_data_structures: Union-find data structures.
