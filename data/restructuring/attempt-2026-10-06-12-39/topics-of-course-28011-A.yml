analysis:
  mode: all-courses
source_clusters:
- id: 1
  name: Informatics Principles Foundations (1)
course:
  id: 28011-A
  name: Logic Design T
topics:
  asynchronous_sequential_hazard_control: Correct-use constraints and techniques for
    preventing undesired behaviors in asynchronous sequential circuits with direct
    feedback.
  asynchronous_sequential_logic_networks: Analysis and synthesis of asynchronous sequential
    logic networks.
  binary_information_encoding: Binary encoding of information.
  binary_memory_elements_latches_and_flip_flops: Binary memory elements, specifically
    SR latches, D latches, and D flip-flops.
  boolean_algebra_and_logical_functions: Boolean algebra, Boolean expressions and
    functions, logic gates, and circuit diagrams.
  combinational_logic_analysis_and_synthesis: Analysis and synthesis of combinational
    logic networks.
  combinational_logic_karnaugh_minimization: Gate-level minimization of combinational
    logic using Karnaugh maps.
  digital_machine_design_descriptions_and_signals: Digital-machine design layers,
    including block and verbal behavior descriptions and signal classification.
  finite_state_machine_model: The finite-state-machine model.
  signed_binary_arithmetic_adders_and_alu: Unsigned and signed binary arithmetic,
    two's-complement representation, half and full adders, n-bit adders, and arithmetic-logic
    units.
  standard_combinational_circuits: Standard combinational circuits including decoders,
    encoders, multiplexers, ROM-based programmable logic, three-state buffers, and
    decoder- or multiplexer-based design.
  switch_level_digital_logic: Logic circuits modeled as networks of switches, including
    logic gates.
  synchronous_registers_shift_registers_and_counters: Synchronous registers, shift
    registers, synchronizers, counters, and their use in synchronous logic-circuit
    design.
  synchronous_sequential_logic_networks: Analysis and synthesis of synchronous sequential
    logic networks.
  synchronous_sequential_timing_and_d_flip_flop_design: Clock-period timing constraints
    and formal design of synchronous sequential circuits using D flip-flops.
