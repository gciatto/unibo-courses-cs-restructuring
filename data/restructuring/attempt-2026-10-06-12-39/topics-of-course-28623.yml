  c_data_types: Data types in C programs.
  c_dynamic_memory_management: Functions for direct memory management in C.
  c_file_handling: File-handling functions in C.
  c_functions_and_recursion: Defining and using C functions, including recursive functions.
  c_input_output_functions: Input/output functions in C.
  c_operators_and_expressions: Values, operators, and expressions in C programs.
  computer_hardware_and_software_components: Basic hardware and software building
    blocks of a computer and processing system.
  computer_network_basics: Basic concepts of computer networks.
  development_environment_use: Use of a software development environment for program
    development.
  operating_systems_overview: Overview of the main operating systems.
  sorting_algorithms: Sorting algorithms.
  unix_command_line_basics: Introductory use of Unix commands and the command-line
    console.
