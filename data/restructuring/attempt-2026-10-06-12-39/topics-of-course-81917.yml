analysis:
  mode: all-courses
source_clusters:
- id: 25
  name: Administration Systems System (25)
course:
  id: '81917'
  name: Interaction Multimedia Services
topics:
  algorithm_fundamentals: Fundamental notion of an algorithm in introductory computer-science
    contexts.
  application_security_for_web_and_mobile: Security considerations for Web and mobile
    applications.
  artificial_intelligence_overview: Brief overview of artificial intelligence.
  client_server_application_architecture: The client/server model and the design of
    small client/server applications.
  cloud_computing_fundamentals: Introduction to cloud computing.
  coding_fundamentals: Basic coding concepts introduced as part of introductory computer
    science and information processing.
  creative_ideation_brainstorming_and_scamper: Creative ideation through guided brainstorming
    and the SCAMPER method.
  cybersecurity_threats: IT-security threats, including viruses and phishing.
  digital_privacy_law_and_online_rights: Privacy law, privacy, and online rights in
    digital-service contexts.
  double_diamond_design_process: The Double Diamond design framework, including Discover,
    Define, Develop, and Deliver phases.
  html_markup_authoring: Authoring web content with HTML.
  intellectual_property_in_digital_services: Intellectual-property considerations
    for digital technologies and services.
  javascript_programming_fundamentals: JavaScript programming with variables, instructions,
    functions, and event-driven programming.
  password_management: Management of passwords as a cybersecurity practice.
  service_blueprint_design: Creating and using service blueprints to model the structure
    of a service.
  service_component_design_for_fixed_mobile_heterogeneous_environments: Designing
    service-supplying components for fixed, mobile, and heterogeneous environments.
  social_engineering_threats: Social-engineering threats in cybersecurity.
  usability_testing_and_concept_iteration: Designing and conducting usability tests,
    gathering feedback, and iterating a service concept based on test results.
  user_centered_design_and_design_thinking: User-centered design, its relationship
    to HCI and UX, and the Design Thinking process of empathizing, defining, ideating,
    prototyping, and testing.
  user_journey_and_ecosystem_mapping: Visualizing services through user journey maps
    and ecosystem maps, contextualized by user and experience research.
  user_personas_and_experience_maps: Creating proto-personas, personas, and experience
    maps to represent users and their current context.
  user_research_qualitative_methods: Qualitative user research using semi-structured
    interviews, contextual inquiry, observation, and user-research planning.
  user_research_quantitative_methods_and_survey_design: Quantitative user research,
    including survey design and statistical analysis of collected data.
  user_research_synthesis_and_problem_framing: Synthesizing user research with empathy
    maps, points of view, how-might-we questions, and why-how laddering to frame design
    problems.
  virtualization_fundamentals: Introductory concepts of virtuality and virtualization.
  web_application_concepts: Basic concepts of web applications.
  web_browser_and_server_technologies: Operation of web browsers and web servers,
    including the technologies they support.
