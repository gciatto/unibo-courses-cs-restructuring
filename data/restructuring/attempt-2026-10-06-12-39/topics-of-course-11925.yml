course:
  id: '11925'
  name: Computer Architecture
topics:
  assembly_language_programming: Writing assembly-language code at the instruction-set
    architecture level.
  binary_information_encoding: Binary encoding of information.
  boolean_algebra_and_logical_functions: Boolean algebra, Boolean expressions and
    functions, logic gates, and circuit diagrams.
  combinational_logic_analysis_and_synthesis: Analysis and synthesis of combinational
    logic networks.
  computer_hardware_organization: Hardware architecture and organization of a computer.
  computer_memory_and_system_buses: The roles of computer memory and system buses
    in computer organization.
  cpu_structure: Basic structure of a CPU within computer architecture.
  instruction_set_architecture: Instruction Set Architecture (ISA).
  sequential_logic_circuits: Design and operation of sequential logic circuits, without
    restricting coverage to synchronous or asynchronous designs.
  software_abstraction_levels: Software levels in the organization of a computer system.
