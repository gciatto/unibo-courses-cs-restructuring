analysis:
  mode: all-courses
source_clusters:
- id: 14
  name: Engineering Software Cultural (14)
course:
  id: '66858'
  name: Software Engineering
topics:
  agile_software_development: Agile approaches and practices for software development.
  build_automation: Build-automation tools and their use in software development.
  continuous_integration: Continuous-integration practices and tools for integrating
    and validating software changes.
  design_patterns: Software design patterns.
  domain_modeling: Developing a domain model that represents the concepts and relationships
    of a software problem domain.
  grasp_design_principles: GRASP principles for assigning responsibilities in object-oriented
    software design.
  modern_software_patterns_and_frameworks: Modern software patterns and frameworks
    used in software development.
  object_oriented_design_principles: Object-oriented principles applied to the design
    of software systems.
  software_analysis_models: Analysis models for describing and understanding a software
    system before design.
  software_process_models: Software process models used to organize software development
    activities.
  uml_activity_diagrams: Modeling workflows and behavior using UML activity diagrams.
  uml_class_diagrams: Modeling software-system classes and their relationships using
    UML class diagrams.
  uml_interaction_diagrams: Modeling interactions among software-system elements using
    UML interaction diagrams.
  uml_language_fundamentals: The UML language as a notation for modeling software
    systems in object-oriented analysis and design.
  uml_use_case_diagrams: Modeling requirements with UML use-case diagrams.
  unit_integration_and_acceptance_testing: Unit, integration, and acceptance testing
    of software systems.
