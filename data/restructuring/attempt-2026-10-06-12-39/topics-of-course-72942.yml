analysis:
  mode: all-courses
source_clusters:
- id: 0
  name: Security Information Cryptography (0)
course:
  id: '72942'
  name: Information Security M
topics:
  blockchain_principles_bitcoin_ethereum: Blockchain operating principles, with introductory
    treatment of the Bitcoin and Ethereum platforms.
  cryptographic_authentication: Authentication using cryptographic techniques and
    protocols.
  cryptographic_hash_functions: Cryptographically secure hash functions and their
    correct use.
  cryptographic_key_management_infrastructures: Symmetric- and asymmetric-key management
    models and infrastructures, including key distribution centers and public-key
    infrastructure (PKI).
  cryptographic_misuse_and_attack_prevention: Attacks caused by incorrect use of cryptographic
    ciphers and methods for using ciphers correctly.
  cryptographic_random_number_generation: Cryptographically secure pseudorandom-number
    generation (PRNG) and pitfalls in its use.
  federated_identity_protocols: Federated authentication models and protocols, including
    OAuth, OpenID, and SAML.
  pgp_cryptography: PGP cryptographic mechanisms.
  public_key_cryptography: Public-key cryptographic algorithms and techniques.
  single_sign_on_and_kerberos: Single sign-on authentication models and systems, including
    Kerberos.
  symmetric_key_cryptography: Secret-key cryptographic algorithms and techniques.
