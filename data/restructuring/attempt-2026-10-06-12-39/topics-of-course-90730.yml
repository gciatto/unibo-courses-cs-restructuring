analysis:
  mode: all-courses
source_clusters:
- id: 15
  name: Network Networks Programming (15)
course:
  id: '90730'
  name: Social Network Analysis
topics:
  large_network_reduction_and_sampling: Methods for handling large networks through
    edge elimination, node pruning, divide-and-conquer, aggregation, sampling, and
    consideration of small-world and scale-free structure.
  network_analysis_introduction_and_interdisciplinary_applications: Introduction to
    network analysis and its applications across research fields including computer
    science, forensics, archaeology, literature, history, and religious studies.
  network_analysis_research_design_and_paper_reading: Research design for network
    analysis, the scientific-publication process, and critical reading of network-analysis
    research papers.
  network_data_collection_reliability_and_transformation: Formulating network questions;
    collecting reliable network data; handling network data formats and transformations;
    and using analysis and visualization algorithms and software.
  network_graph_representations_and_matrix_operations: Network and graph representations,
    network types, paths, components, adjacency matrices, modes, and matrix operations.
  network_hypothesis_testing_and_permutation_tests: Hypothesis testing in network
    analysis, including permutation tests and dyadic hypotheses.
  network_measurement_scales: Measurement types used in network analysis, including
    multi-category nominal, ordinal, and scalar measures.
  network_subgroups_similarity_and_assortativity: Network groups and relational structure,
    including cliques, cores, components, k-components, clustering coefficients, reciprocity,
    similarity, structural equivalence, homophily, and assortative mixing.
  network_topology_and_global_metrics: Network-level structural properties and metrics,
    including small-world effects, degree distributions, power laws, scale-free and
    random graphs, clustering, cohesion, reciprocity, transitivity, triad census,
    centralization, core-periphery indices, giant and small components, and locally
    tree-like networks.
  network_visualization_and_graph_layouts: Network visualization using graph-layout
    algorithms, node attributes and filtering, ego networks, tie characteristics and
    strengths, and visualizations of network change.
  node_centrality_and_influence_measures: Node-level network measures including degree,
    PageRank, hubs and authorities, closeness, and betweenness centrality.
  web_as_sociotechnical_network_system: The Web as a socio-technical system of entities,
    behaviours, data, applications, agents, computational profiles, and information,
    physical, social, and conceptual network spaces.
