analysis:
  mode: all-courses
source_clusters:
- id: 19
  name: Cultural Heritage Computer (19)
course:
  id: '76011'
  name: Multimedia Technologies in Archaelogy
topics:
  archaeological_metadata_and_web_formats: Use of metadata and web-oriented formats,
    including XML, JavaScript, and KML, to represent archaeological data.
  archaeological_total_station_and_gnss_surveying: Surveying archaeological sites
    using total stations and GNSS receivers.
  evidence_based_virtual_archaeological_reconstruction: Step-by-step, scientifically
    grounded virtual reconstruction of archaeological objects or contexts, from collecting
    and analyzing evidence through 2D graphic representation and 3D modeling.
  laser_scanning_and_point_cloud_processing: Laser-scanner acquisition of archaeological
    survey data and workflows for processing point clouds into 3D models.
  multimedia_information_representation: Digital representation of multimedia information.
  photogrammetry_for_3d_reconstruction: Principles and application of photogrammetry
    for three-dimensional reconstruction of cultural-heritage objects.
  public_presentation_of_virtual_reconstructions: Planning effective public presentation
    of virtual archaeological reconstruction products.
  three_dimensional_acquisition_for_cultural_heritage: Three-dimensional acquisition
    of historical and archaeological contexts for cultural-heritage study.
  three_dimensional_modeling_for_cultural_heritage: Three-dimensional modeling for
    reconstructing cultural-heritage objects.
