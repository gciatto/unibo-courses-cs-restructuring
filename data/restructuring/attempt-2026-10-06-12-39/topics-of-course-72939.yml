analysis:
  mode: all-courses
source_clusters:
- id: 14
  name: Engineering Software Cultural (14)
course:
  id: '72939'
  name: Software Systems Engineering M
topics:
  agile_software_development: Agile approaches and practices for software development.
  ai_generated_code_technologies: AI-generated-code technologies in the context of
    software development environments and processes.
  build_automation: Build-automation tools and their use in software development.
  coap_and_mqtt_protocols: Use of the CoAP and MQTT protocols for message-based interactions
    among distributed software components.
  containerization_with_docker: Containerization of software applications using Docker.
  custom_metamodeling_and_executable_models: Definition and use of custom metamodels
    and executable models in software production and analysis.
  devops_practices: DevOps practices and tools in the software-development process.
  differential_drive_robotics_and_sensor_integration: Development of applications
    for differential-drive robots (DDR) equipped with sensors and operating autonomously
    in virtual or real environments.
  domain_modeling: Developing a domain model that represents the concepts and relationships
    of a software problem domain.
  domain_specific_languages: Domain-Specific Languages (DSLs) for software development
    and model-based code generation.
  event_driven_distributed_programming: Design and development of distributed applications
    based on event-driven computational models.
  http_protocol_basics: Fundamental concepts and operation of the HTTP protocol.
  iot_programming_with_raspberry_pi_and_arduino: Development of Internet-of-Things
    applications using low-cost devices such as Raspberry Pi and Arduino in virtual
    and real environments.
  kotlin_programming: Use of the Kotlin programming language in software development.
  message_passing_distributed_programming: Design and development of distributed applications
    using message-passing computational models and interactions.
  model_driven_software_development: Model-Driven Software Development (MDSD), including
    executable models for requirements and problem analysis.
  software_architectural_styles: Selection and use of software architectural styles,
    including layered, client-server, pipeline, microkernel, service-based, event-driven,
    space-based, and microservice architectures.
  software_factories_and_model_driven_code_generation: Software-development environments
    and software factories for automated code generation based on model-driven development
    and DSLs.
  software_testing: Software testing.
  spring_boot_application_development: Software application development using Spring
    Boot.
  tcp_udp_transport_protocols: Transport-layer communication using TCP and UDP.
