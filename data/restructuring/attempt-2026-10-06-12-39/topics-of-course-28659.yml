analysis:
  mode: all-courses
source_clusters:
- id: 13
  name: Web Technologies Web-Related (13)
course:
  id: '28659'
  name: Web Technologies T
topics:
  enterprise_java_beans_container_model: Enterprise JavaBeans (EJB) as an example
    of a heavy component-container model for enterprise web applications.
  http2_protocol: The transition to HTTP/2 and its role in evolving web communication.
  http3_and_quic_protocol: Introductory HTTP/3 concepts, including motivations and
    primary characteristics of QUIC.
  http_and_uri_web_model: HTTP and URIs as primary elements of the original World
    Wide Web model.
  javascript_and_ajax_client_side_programming: Client-side web programming using JavaScript
    and Ajax.
  nodejs_event_driven_stateless_servers: Event-oriented and stateless server-side
    web models using Node.js, including asynchronous I/O management.
  server_side_java_servlets_and_jsp: Server-side web programming using Java Servlets
    and JSP.
  single_page_applications_and_react: Single-page applications and React.js as emerging
    client-side web technologies.
  spring_lightweight_container_model: Spring as an example of a lightweight container
    model for enterprise web applications.
  web_application_state_sessions_and_conversations: Dynamic web-application state
    management, including personalization, sessions, and conversations.
  web_markup_languages_and_css: Web markup and styling languages, including XHTML,
    XML, HTML5, and CSS.
  web_multitier_architecture_and_container_models: Multi-layer web architectures,
    including horizontal and vertical distribution, business-logic separation, and
    component-container models.
  web_mvc_and_java_model_2: Model-View-Controller for web applications and the Java
    Model 2 approach.
  web_origins_and_static_model: The origins of the Web, including its historical context
    and original static model.
  web_socket_programming: WebSocket motivations and mechanisms for JavaScript clients
    and Java servers.
