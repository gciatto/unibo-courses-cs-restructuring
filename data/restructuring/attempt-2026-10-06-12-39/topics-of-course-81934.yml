analysis:
  mode: all-courses
source_clusters:
- id: 5
  name: Computing Education Informatics (5)
course:
  id: '81934'
  name: HUMAN COMPUTER INTERACTION
topics:
  ai_driven_interaction_systems: AI-driven systems considered as an interaction paradigm,
    including their rationale, examples, and development tools.
  gesture_based_interaction: Gesture-based interaction as an interaction paradigm,
    including its rationale, examples, and development tools.
  hci_interaction_models_and_frameworks: Foundational Human-Computer Interaction models
    and frameworks, including Norman's Model of Interaction and the Abowd and Beale
    interaction framework.
  heuristic_usability_evaluation: Heuristic evaluation methods for assessing the usability
    of user interfaces.
  interaction_prototyping_low_and_high_fidelity: Creation and use of low-fidelity
    and high-fidelity prototypes in interactive-application design.
  tangible_interaction: Tangible interaction as an interaction paradigm, including
    its rationale, examples, and development tools.
  user_centered_interaction_design: Human-centered methods and processes for designing,
    developing, and evaluating interactive applications.
  user_experience_and_experience_design_principles: Principles and methodologies of
    User Experience and Experience Design for interactive systems.
  user_mental_models_in_interaction_design: Use of users' mental models to inform
    the design of interactive applications.
  user_needfinding_strategies: Needfinding strategies for identifying user needs in
    the design of interactive applications.
  user_study_basics: Fundamental concepts and methods for conducting user studies
    in interactive-application evaluation.
  visual_interface_design: Visual design considerations for interactive application
    interfaces.
  voice_user_interfaces: Voice user interfaces as an interaction paradigm, including
    their rationale, examples, and development tools.
