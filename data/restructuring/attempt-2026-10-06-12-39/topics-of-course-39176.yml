analysis:
  mode: all-courses
source_clusters:
- id: 29
  name: Informatics Informatic Humanities (29)
course:
  id: '39176'
  name: Basic and Laboratory Informatics
topics:
  algorithm_fundamentals: Fundamental notion of an algorithm in introductory computer-science
    contexts.
  cloud_spreadsheet_storage_and_sharing: Creating, storing, and sharing spreadsheets
    using Google Drive and Microsoft OneDrive.
  computer_and_software_fundamentals: Introductory concepts of the computer and software.
  computer_network_basics: Basic concepts of computer networks.
  database_overview: Outline-level introduction to databases.
  digital_eeg_signal_processing_visualization_and_storage: Digital processing, visualization,
    and storage of EEG signals, including conversion from acquired bioelectric signals
    to digital form.
  health_data_privacy_and_protection: Protection and processing of health-related
    data, including privacy management in health-information contexts.
  health_informatics_application_areas: Main application areas of information technology
    in health activities.
  internet_and_world_wide_web: The Internet and the World Wide Web.
  internet_communication_services: Internet communication services including email,
    instant messaging, and remote connections.
  medical_document_dematerialization_lifecycle_and_preservation: Dematerialization,
    lifecycle management, archival, and preservation periods of clinical and health-related
    digital documents.
  microsoft_access_database_creation_forms_and_queries: Creating databases in Microsoft
    Access, including tables, relationships, forms, and queries.
  neurophysiology_information_system_requirements: Functional computer-system and
    service requirements supporting a Neurophysiology Information System.
  online_catalogues_and_specialized_information_databases: Using online public-access
    catalogues (OPACs) and generalist or specialized databases to locate information.
  presentation_software: Use of presentation software, including PowerPoint and Google
    Presentations.
  relational_data_model_and_database_structure: The relational data model and the
    structure of relational databases.
  relational_database_design_basics: Basic design of relational databases.
  spreadsheet_data_analysis_and_visualization: Organizing, summarizing, processing,
    analyzing, representing, and graphing biometric and clinical data with spreadsheets.
  spreadsheet_data_import_export: Importing and exporting spreadsheet data, including
    exporting data in formats suitable for R statistical analysis.
  spreadsheet_software: Use of spreadsheet software, including Microsoft Excel and
    Google Sheets.
  web_evolution_and_social_networks: Web 1.0 and Web 2.0 concepts and social networks.
  web_search_engine_use: Using search engines to collect information for study and
    work activities.
  workstation_and_network_security: Security of workstations and networks in a health-information
    setting.
