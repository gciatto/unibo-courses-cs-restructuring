analysis:
  mode: all-courses
source_clusters:
- id: 13
  name: Web Technologies Web-Related (13)
course:
  id: '88566'
  name: Web Technology
topics:
  character_encoding_and_web_formats: Character encoding and digital format choices
    for producing web-oriented digital objects.
  client_side_frameworks_vue_react_angular: Client-side JavaScript frameworks used
    to develop web applications, including Vue, React, and Angular.
  garrett_model_for_web_user_experience_design: The Garrett model for designing user
    experience for websites.
  http_and_uri_web_model: HTTP and URIs as primary elements of the original World
    Wide Web model.
  javascript_and_ajax_client_side_programming: Client-side web programming using JavaScript
    and Ajax.
  json_data_interchange_format: JSON as a data-representation format for web technologies.
  nodejs_server_side_web_programming: Server-side web-application development using
    Node.js.
  owl_ontology_representation: Knowledge representation with ontologies using OWL.
  php_server_side_web_programming: Server-side web-application development using PHP.
  python_server_side_web_programming: Server-side web-application development using
    Python.
  semantic_web_concepts: Semantic Web concepts for graph-based data.
  sparql_rdf_querying: Querying RDF data with SPARQL, including use of the DBpedia
    knowledge graph.
  web_document_validation_and_universality: Verification of the correctness and universality
    of web documents and applications.
  web_markup_languages_and_css: Web markup and styling languages, including XHTML,
    XML, HTML5, and CSS.
  web_usability_and_user_experience_design: Designing and evaluating usability and
    user experience for web applications.
  world_wide_web_evolution_and_standardization: Principles and evolution of the World
    Wide Web, including web standardization bodies and processes.
