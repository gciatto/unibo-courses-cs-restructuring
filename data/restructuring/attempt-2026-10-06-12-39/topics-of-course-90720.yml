analysis:
  mode: all-courses
source_clusters:
- id: 9
  name: Experience User Usability (9)
course:
  id: '90720'
  name: Usability & User Experience Design
topics:
  goal_oriented_usability_design: Goal-oriented methodologies for usability design.
  hci_scope_and_ux_design_evolution: The evolution from Human-Computer Interaction
    to User Experience Design, including the scope of humans, computers, and their
    interaction.
  usability_analysis_with_and_without_users: Usability-analysis approaches conducted
    with user participation and without direct user participation.
  usability_design_guidelines_and_patterns: Historical and practical guidelines, patterns,
    and methods that support concrete usability design.
  user_centered_interaction_design: Human-centered methods and processes for designing,
    developing, and evaluating interactive applications.
  user_experience_and_experience_design_principles: Principles and methodologies of
    User Experience and Experience Design for interactive systems.
  ux_design_for_complex_systems: Application of User Experience Design to complex
    systems, including AI systems.
  ux_design_process_standards: Techniques and standards for managing the User Experience
    Design process.
  web_and_mobile_usability_design: Usability-design considerations for web applications
    and mobile applications.
