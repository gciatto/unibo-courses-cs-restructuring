cluster:
  id: 29
  name: Informatics Informatic Humanities (29)
course:
  id: '96007'
  name: Foundations of Computer Architecture and Operating Systems
topics:
  binary_representation: Binary representation of information in computer systems.
  computer_architecture: Organization of computer systems, including the CPU, memory,
    bus, instruction set architecture, and relationships between architectural levels.
  computer_arithmetic: Computer arithmetic involving numerical representations and
    operations in computer systems.
  computing_history: History of computer science and computing.
  concurrency_communication: Concurrency, parallelism, and multi-user issues in operating
    systems.
  cpu_scheduling: CPU scheduling concepts and algorithms.
  digital_logic_circuits: Boolean algebra, logic gates, and the design of combinational
    and sequential digital circuits.
  file_systems: Secondary memory management and file systems.
  io_management: Input/output management in operating systems.
  low_level_programming: Low-level programming languages, including machine language,
    used to program information processors.
  memory_management: Memory management in operating systems.
  number_systems: Numbering systems used in computer representation and processing.
  operating_systems: Operating-system structure and main functions.
