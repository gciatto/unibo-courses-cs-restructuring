cluster:
  id: 29
  name: Informatics Informatic Humanities (29)
course:
  id: 07276-C
  name: Computer Science
topics:
  artificial_intelligence: Applications of artificial intelligence, including using
    AI systems to generate VBA macros for data-processing tasks.
  computer_hardware_software: Building blocks of computers, including hardware and
    software, and their use in computer systems.
  computer_networks: Computer networks.
  databases_sql: Relational databases, database keys, SQL, and the creation of tables
    and queries.
  information_systems: Information systems, including laboratory and hospital information
    systems, their network organization, clinical workflows, data archiving, authorization,
    electronic health records, and system administration.
  internet_world_wide_web: The Internet and the World Wide Web.
  medical_devices: Medical devices and their use in medical and physiotherapy contexts.
  operating_systems: Operating-system structure and main functions.
  spreadsheets: Spreadsheet software and its use for managing and analyzing information.
  web_search: Using search engines to collect information for study and work activities.
