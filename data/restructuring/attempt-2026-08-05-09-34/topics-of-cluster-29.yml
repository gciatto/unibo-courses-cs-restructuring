cluster:
  id: 29
  name: Informatics Informatic Humanities (29)
topics:
  artificial_intelligence: Applications of artificial intelligence, including using
    AI systems to generate VBA macros for data-processing tasks.
  assembly_programming: Assembly programming, instruction set architecture, and correspondence
    between assembly and high-level programming languages.
  bibliography_management: Building bibliographies using Google Scholar, Scopus, and
    search engines.
  big_data: Large-scale datasets and their introduction in healthcare and informatics
    contexts.
  binary_representation: Binary representation of information in computer systems.
  c_programming: Programming in the ANSI C programming language.
  case_mix_classification: Case mix classification systems, including SDO and Diagnosis-Related
    Groups (DRG) used in healthcare information processing.
  cloud_forensics: Forensic investigations involving cloud environments and cloud-based
    data.
  cloud_services: Cloud-based tools for online collaboration and storage.
  computer_architecture: Organization of computer systems, including the CPU, memory,
    bus, instruction set architecture, and relationships between architectural levels.
  computer_arithmetic: Computer arithmetic involving numerical representations and
    operations in computer systems.
  computer_fundamentals: Basic informatics concepts concerning computers, algorithms,
    and software.
  computer_hardware_software: Building blocks of computers, including hardware and
    software, and their use in computer systems.
  computer_networks: Computer networks.
  computing_history: History of computer science and computing.
  concurrency_communication: Concurrency, parallelism, and multi-user issues in operating
    systems.
  cpu_scheduling: CPU scheduling concepts and algorithms.
  cryptography: Cryptographic concepts used for protection and security.
  data_structures: Common data structures used to organize data in programs, including
    lists, queues, stacks, sets, dictionaries, graphs, trees, vectors, and tensors.
  databases: Database concepts and outlines.
  databases_sql: Relational databases, database keys, SQL, and the creation of tables
    and queries.
  digital_evidence_handling: Acquiring, conserving, validating, and analyzing digital
    data, including chain-of-custody procedures and live acquisitions.
  digital_forensics: The digital forensics profession, digital investigations, and
    the roles of investigators, laboratories, and expert witnesses.
  digital_graphics: Digital graphics and the processing of digital graphical information.
  digital_logic_circuits: Boolean algebra, logic gates, and the design of combinational
    and sequential digital circuits.
  digital_transformation_legislation: European Union legislation concerning digital
    transformation.
  distributed_communication: Communication in distributed systems.
  distributed_systems: Concepts and organization of distributed systems.
  documentary_databases: Consultation of documentary databanks.
  eeg_signal_processing: Acquisition, digitization, digital processing, visualization,
    and storage of EEG bioelectric signals.
  electronic_document_management: Management of electronic documents.
  electronic_documents: Electronic documents and technologies supporting dematerialized,
    paperless transactions.
  electronic_identification: Electronic identification and government authentication
    systems, including electronic identity cards and biometric passport services.
  electronic_trust_services: Electronic trust services used in digital transactions.
  email_digital_signatures: Email, certified email, and digital signatures.
  email_messaging: Email and instant messaging as Internet and Web communication services.
  email_social_media_forensics: Forensic investigations involving e-mail and social
    media.
  file_system_forensics: Forensic examination of Windows, Linux, and Macintosh file
    systems, including work with command-line systems.
  file_systems: Secondary memory management and file systems.
  forensic_graphics_recovery: Recovering and examining graphics files during digital
    forensic investigations.
  forensic_investigations: Processing crime and incident scenes and conducting digital
    forensic investigations across computers and other devices.
  forensic_reporting_testimony: Writing final reports for high-technology investigations,
    expert testimony, and ethics for expert witnesses.
  forensic_tools: Tools used in digital forensic investigations and their application
    to common forensic scenarios.
  gis_geospatial_data: Geographic information systems and tools for importing, creating,
    managing, and analyzing geographical data.
  government_portals: Italian government portals and online services, including services
    of the Companies House, municipal SUAP desks, regional information services, the
    Revenue Agency, INPS, INAIL, Justice of the Peace, police, and Interior Department.
  health_system_organization: Organization of the Italian health system.
  healthcare_indicators: Healthcare indicators and their use with healthcare information
    and databases.
  information_systems: Information systems, including laboratory and hospital information
    systems, their network organization, clinical workflows, data archiving, authorization,
    electronic health records, and system administration.
  internet_world_wide_web: The Internet and the World Wide Web.
  io_management: Input/output management in operating systems.
  it_security: IT security, privacy, and protection of health-related data, including
    workstation and network security.
  latex_overleaf: LaTeX and Overleaf for collaborative document writing and preparation.
  low_level_programming: Low-level programming languages, including machine language,
    used to program information processors.
  machine_learning: An overview of machine learning in the context of computer science
    for text analysis.
  medical_devices: Medical devices and their use in medical and physiotherapy contexts.
  memory_management: Memory management in operating systems.
  mobile_device_forensics: Forensic examination of mobile devices, including smartphones
    and tablets.
  network_forensics: Virtual machine forensics and network forensics for investigating
    digital evidence.
  network_protocols: Network protocols used in computer networks and Internet communication.
  number_systems: Numbering systems used in computer representation and processing.
  numerical_cartography: Numerical cartography, including cartographic projections,
    coordinate systems, and the representation and georeferencing of geographical
    data.
  online_collaboration: Social networks and collaborative online tools.
  operating_systems: Operating-system structure and main functions.
  presentation_software: Presentation software, specifically PowerPoint and Google
    Presentations.
  processes_threads: Processes and threads in operating systems.
  programming_languages: Programming languages, including object-oriented programming,
    concurrency and distribution, service programming, and foundational principles
    of program development.
  python_scripting: Introductory scripting in the Python programming language, including
    its use for text analysis.
  regular_expressions: Regular expressions for automatically finding patterns such
    as words and groups of words in text.
  shell_scripting: Shell environments and shell scripting.
  spreadsheets: Spreadsheet software and its use for managing and analyzing information.
  telemedicine: Telemedicine and its introduction as a future application of health
    informatics.
  vba_programming: VBA programming and macros for automating, cleaning, verifying,
    and debugging spreadsheet data.
  virtualization_containers_cloud: Virtualization, containers, Docker, Kubernetes,
    and infrastructure- and platform-as-a-service services.
  visual_block_programming: Visual block programming as an introductory approach to
    developing computer programs.
  web_markup: Hypertext, markup classification, HTML, CSS, and historical Web versions
    including Web 1.0 and Web 2.0.
  web_search: Using search engines to collect information for study and work activities.
  word_processing: Word-processing software, specifically Word and Google Docs.
