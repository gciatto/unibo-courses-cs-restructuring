cluster:
  id: 29
  name: Informatics Informatic Humanities (29)
course:
  id: '82202'
  name: Informatic
topics:
  big_data: Large-scale datasets and their introduction in healthcare and informatics
    contexts.
  cloud_services: Cloud-based tools for online collaboration and storage.
  computer_fundamentals: Basic informatics concepts concerning computers, algorithms,
    and software.
  computer_hardware_software: Building blocks of computers, including hardware and
    software, and their use in computer systems.
  computer_networks: Computer networks.
  databases: Database concepts and outlines.
  information_systems: Information systems, including laboratory and hospital information
    systems, their network organization, clinical workflows, data archiving, authorization,
    electronic health records, and system administration.
  it_security: IT security, privacy, and protection of health-related data, including
    workstation and network security.
  online_collaboration: Social networks and collaborative online tools.
  presentation_software: Presentation software, specifically PowerPoint and Google
    Presentations.
  spreadsheets: Spreadsheet software and its use for managing and analyzing information.
  telemedicine: Telemedicine and its introduction as a future application of health
    informatics.
  web_search: Using search engines to collect information for study and work activities.
  word_processing: Word-processing software, specifically Word and Google Docs.
