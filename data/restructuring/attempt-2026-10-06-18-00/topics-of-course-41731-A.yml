topics:
  character_encodings: Character encodings used to represent text in web documents
    and communications.
  client_side_web_programming: Client-side Web programming using JavaScript and Ajax.
  hci_techniques: Human-computer interaction techniques applied to web application
    and website design.
  http_uris: The HTTP protocol and Uniform Resource Identifiers as primary elements
    of the original Web model.
  json: JSON as a data representation format used in web technologies.
