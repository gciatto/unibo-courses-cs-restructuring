analysis:
  mode: all-courses
source_clusters:
- id: 2
  name: Big Data Cloud (2)
course:
  id: '96142'
  name: Business Intelligence and Big Data M
topics:
  bi_reporting: Reporting as a business-intelligence technique for analyzing enterprise
    data.
  big_data_revolution: The Big Data Revolution and its implications for enterprise
    data strategies and technologies.
  business_intelligence_overview: Role of business intelligence in the corporate information
    system and the structure of the BI pyramid.
  cloud_big_data_deployment: Handling Big Data in the cloud, including comparison
    of on-premises and cloud clusters, cloud technology stacks, and deployment of
    a case study on a cloud provider.
  conceptual_database_design: Requirements analysis and conceptual database design
    for relational databases.
  data_governance: Data-governance principles and practices for managing enterprise
    data.
  data_lakehouse: Data Lakehouse architectures combining data-lake flexibility with
    structured analytical data-management capabilities.
  data_lakes: Data Lake concepts and their role as enabling infrastructure for data-mining
    processes.
  data_platform_ecosystems: Data platforms and integrated data ecosystems that extend
    or replace isolated database systems.
  data_source_analysis: Analysis of data sources as part of the data-warehouse lifecycle.
  data_strategy: Enterprise data-strategy methods and planning for using organizational
    data.
  data_visualization: Infographic communication techniques and principles for visualizing
    data.
  data_warehouse_architecture: Architectural organization of enterprise data warehouses.
  data_warehouse_workload_volume: Assessment of data-warehouse workloads and data
    volumes during warehouse design.
  data_warehousing_olap: Data-warehouse design and development with online analytical
    processing (OLAP).
  etl_procedures: Design of extract, transform, and load procedures for populating
    a data warehouse.
  hadoop: The Apache Hadoop framework for Big Data processing, including HDFS and
    YARN, with practical use of related Hadoop technologies.
  logical_database_design: Logical database design for relational databases.
  nosql_databases: Introductory architectures and non-relational data models of NoSQL
    systems.
  requirements_analysis: Analysis of software requirements as part of planning and
    software-system development.
  spark: The Apache Spark system, including its architecture, data structures, data
    partitioning, shuffling, and computation optimization.
  tableau_data_visualization: Hands-on business-data visualization using Tableau.
