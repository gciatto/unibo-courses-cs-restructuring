source_clusters:
- id: 29
  name: Informatics Informatic Humanities (29)
course:
  id: '69259'
  name: Computer Science
topics:
  cartographic_projections: Fundamental cartographic projections used in numerical
    cartography.
  computer_hardware_architecture: Fundamental organization of computer hardware systems.
  computer_networks: Basic computer-network concepts.
  digital_cartography: Fundamental concepts and computer-based aspects of digital
    and numerical cartography.
  digital_graphics: Introductory concepts of digital graphics as part of digital information
    processing.
  geographic_coordinate_systems: Coordinate systems used to represent geographic information
    in numerical cartography.
  geographic_data_representation: Representation of geographical data in numerical
    and digital cartography.
  geospatial_data_analysis: Analyzing geographical data with GIS and related computer
    tools.
  geospatial_data_management: Importing, creating, and managing geographical data
    with GIS and related computer tools.
  geospatial_databases: Basic database concepts with particular attention to databases
    for geographic data.
  gis_fundamentals: Fundamentals of geographic information systems (GIS).
  raster_vector_georeferencing: Georeferencing raster and vector elements in numerical
    cartography applications.
