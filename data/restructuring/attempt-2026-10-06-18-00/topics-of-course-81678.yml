analysis:
  mode: all-courses
source_clusters:
- id: 4
  name: Internet Things Systems (4)
course:
  id: '81678'
  name: Laboratory of Making
topics:
  additive_subtractive_manufacturing: Additive and subtractive manufacturing methods
    for physically realizing objects, including CNC-like machines such as 3D printers,
    CNC mills, and laser cutters.
  arduino_programming: Programming the Arduino UNO microcontroller platform using
    introductory C++ and the Wiring framework.
  digital_electronics: Introduction to digital electronics.
  electronics_lab_instruments: Use of electronic laboratory instruments, including
    multimeters, oscilloscopes, and logic analyzers.
  embedded_systems_intro: Introduction to embedded systems, including microcontrollers,
    systems-on-chip, sensors, actuators, and related electronics.
  iot_devices_sensors: Internet of Things things, including sensors, actuators, and
    complex devices, with examples such as Raspberry Pi and Arduino platforms.
  making_based_cs_education: Design and development of computer-science teaching methods
    based on Making.
  making_problem_solving: Making as a constructive problem-solving paradigm for practical
    and artistic challenges.
  motor_control_h_bridges: Engines and H-bridge circuits for controlling motors.
  passive_electronics: Basic passive electronic components and principles, including
    current, intensity, potential, power, energy, Kirchhoff's laws, resistors, Ohm's
    laws, capacitors, inductors, and transformers.
  radio_waves: Radio waves and radio transmission as used in digitally enabled objects.
  rfid: Radio Frequency Identification (RFID) technology.
  semiconductors: Semiconductor components including diodes and transistors.
  serial_communication_protocols: Serial communication protocols for interfacing electronic
    components and systems, including OneWire, I2C, SPI, and UART.
  three_d_printing_principles: Principles of 3D printing and software for innovative
    use of 3D printers.
  verilog_design_flow: Introduction to the digital-design flow using the Verilog hardware-description
    language.
  voip_asterisk: VoIP telephone exchanges using Asterisk.
