analysis:
  mode: all-courses
source_clusters:
- id: 25
  name: Administration Systems System (25)
course:
  id: '91261'
  name: Artificial Intelligence in Industry
topics:
  anomaly_detection: Detection of anomalous behavior in industrial systems and data.
  combinatorial_ml_integration: Integration methods combining combinatorial optimization
    with machine-learning models.
  combinatorial_optimization: Combinatorial optimization methods for industrial decision
    problems.
  constraint_ml_integration: Integration methods combining constraints with machine-learning
    models.
  epidemic_control: Control and planning problems arising in epidemic-management scenarios.
  fair_recommendation_systems: Recommendation systems incorporating fairness constraints.
  industrial_problem_modeling: Mathematical modeling of industrial problems and their
    practical use cases.
  power_network_management: Management and decision problems in power networks.
  predictive_diagnostic_time_series: Predictive and diagnostic models for industrial
    time-series data.
  probabilistic_ml_integration: Integration methods combining probabilistic models
    with machine-learning models.
  production_planning: Planning decisions for industrial production.
  recommender_systems: Web recommender systems for suggesting multimedia or other
    content to users.
  remaining_useful_life_estimation: Estimation of the remaining useful life of industrial
    assets or components.
  resource_management_planning: Planning and management of industrial resources.
  rul_maintenance_policies: Maintenance policies based on estimated remaining useful
    life.
