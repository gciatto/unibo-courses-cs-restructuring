analysis:
  mode: all-courses
source_clusters:
- id: 14
  name: Engineering Software Cultural (14)
course:
  id: '72939'
  name: Software Systems Engineering M
topics:
  agile_software_development: Agile software-development principles and practices.
  ai_code_generation: Use of AI-generated code technologies within software-development
    environments and model-driven development workflows.
  autonomous_mobile_robots: Development of relatively autonomous mobile robotic applications
    operating in virtual or real environments.
  build_automation: Build automation tools and practices for automating software construction.
  client_server_model: Client/server interaction and the design of small client/server
    applications.
  code_generation: Automatic source-code generation in software factories and development
    environments such as Eclipse and IntelliJ.
  devops_practices: DevOps practices for software development, deployment, and maintenance
    processes.
  differential_drive_robots: Differential Drive Robot applications using sensors and
    software that separates robotic operation from business logic.
  distributed_systems: Fundamental concepts of distributed systems.
  domain_specific_languages: Domain Specific Languages and related language-development
    environments for expressing domain models and software solutions.
  event_driven_architecture: Event-driven computational models and architectures for
    distributed proactive-reactive applications.
  http_protocols: HTTP protocols used in distributed-system and network communication.
  internet_of_things: Design and development of applications combining high-level
    software or AI capabilities with connected Internet of Things devices.
  iot_devices_sensors: Internet of Things things, including sensors, actuators, and
    complex devices, with examples such as Raspberry Pi and Arduino platforms.
  iot_messaging_protocols: Message-based Internet of Things interactions using CoAP
    and MQTT, alongside TCP, UDP, and HTTP communication.
  kotlin_programming: Kotlin programming as a software-development language.
  message_passing: Concurrent message-passing models based on synchronous and asynchronous
    communication.
  model_driven_development: Model Driven Software Development using executable requirements
    and problem models, custom metamodels, and model-based development processes.
  requirements_analysis: Analysis of software requirements as part of planning and
    software-system development.
  software_architecture_design: Design of system architecture and definition of the
    logical architecture of a software problem.
  software_architecture_styles: Selection and use of layered, client-server, pipeline,
    microkernel, service-based, event-driven, space-based, and microservice architectural
    styles for software subsystems.
  software_lifecycle: Phases and activities in the lifecycle of software systems,
    including planning, requirements analysis, and design.
  software_testing: Testing activities for software systems.
  spring_boot: Spring Boot as a platform for developing software applications.
  tcp_protocol: The Transmission Control Protocol as a connection-oriented transport
    protocol.
  udp_protocol: The User Datagram Protocol as a connectionless transport protocol.
  virtualization_containers: Virtualization and container technologies, including
    Docker and Kubernetes.
