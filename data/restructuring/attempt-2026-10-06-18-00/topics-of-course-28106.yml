  name: Informatics Informatic Humanities (29)
course:
  id: '28106'
  name: Computer Science for Environmental Sciences
topics:
  ai_vba_generation: Using an AI system to generate VBA macros for Excel and incorporating
    the generated code into spreadsheets.
  collaborative_tools: Collaborative tools used on the Web.
  computer_networks: Basic computer-network concepts.
  excel_data_cleaning: Organizing, cleaning, and preparing environmental datasets
    in Excel spreadsheets.
  internet_www: The Internet and World Wide Web.
  network_protocols: Introduction to protocols used in computer networks.
  productivity_software: Personal productivity tools for word processing, spreadsheets,
    and presentations, including Microsoft Word, Excel, and PowerPoint.
  relational_keys: Keys used to identify and relate records in relational databases.
  relational_model: Structure and principles of the relational data model.
  social_networks: Social networks as Web-based communication and collaboration platforms.
  sql_queries: Databases and the formulation and use of SQL queries.
  vba_macros: Automating Excel data-processing tasks with VBA macros, including insertion,
    verification, debugging, and best practices.
  web_evolution: The development of the Web from Web 1.0 to Web 2.0.
  web_markup_languages: Web markup and styling languages including XHTML, XML, HTML5,
    and CSS.
