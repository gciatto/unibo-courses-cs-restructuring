analysis:
  mode: all-courses
source_clusters:
- id: 19
  name: Cultural Heritage Computer (19)
course:
  id: B5059
  name: Interaction Media Design
topics:
  card_sorting: Card-sorting activities for organizing content and understanding users'
    conceptual groupings in interactive-media design.
  classic_image_representation: Classic computer-vision techniques for representing
    and processing images.
  cognitive_emotional_interaction_goals: Cognitive and emotional goals for interactive
    Cultural Heritage media, including engagement, empathy, curiosity, memory, authenticity,
    belonging, embodiment, meaningfulness, and perception of heritage.
  color_models: Color models used in basic image processing.
  computer_vision_overview: Basic definitions of computer vision and an overview of
    its major application domains.
  cultural_heritage_interaction_design: Design of interactive applications and media
    for humanities and Cultural Heritage contexts, including cultural-heritage practices,
    representations, skills, objects, artifacts, and spaces.
  cultural_probes: Cultural-probe methods for eliciting contextual, experiential,
    and cultural information from intended audiences.
  design_briefs: Design briefs for interactive-media projects, including motivations,
    barriers, capabilities, devices, and institutional or educational goals.
  digital_analog_paradigm: The contrast between analog and digital representations
    and the digital paradigm associated with the information-technology revolution.
  digital_graphics: Introductory concepts of digital graphics as part of digital information
    processing.
  digital_image_formats: Digital formats used to represent images.
  digital_photography: Digital-photography principles and camera controls, including
    SLR/DSLR cameras, focus, exposure, shutter speed, aperture, F-number, luminance,
    focal length, depth of field, and ISO.
  experience_design: User Experience and Experience Design principles and methodologies
    for designing interaction systems.
  file_formats: File formats and their role in storing, exchanging, and archiving
    digital documents and data.
  goal_oriented_usability_design: Goal-oriented methodologies for designing software
    usability around the tasks and objectives users need to accomplish.
  hci_techniques: Human-computer interaction techniques applied to web application
    and website design.
  image_based_modeling: Image-based modelling for creating three-dimensional or virtual
    representations from image material.
  image_formation_acquisition: Image formation and acquisition concepts, including
    image sensors and the use of lenses.
  image_sampling_quantization: Basic image sensing, sampling, and quantization.
  interaction_metaphors: Metaphors used to communicate and structure interaction in
    interactive-media design.
  interaction_models: Foundational human-computer interaction models, including Norman's
    Model of Interaction and the Abowd and Beale interaction framework.
  interactive_prototyping: Low- and high-fidelity prototyping methods for designing
    and developing interactive applications.
  interactive_storytelling: Interactive storytelling design using tools such as Twine
    to create branching or participatory narratives.
  mental_models: Mental models as part of the design and evaluation of human-computer
    interactions.
  needfinding: Strategies and methods for identifying user needs when designing interactive
    applications.
  pacts_framework: PACT frameworks for interactive-media design, considering people,
    activities, contexts, and technologies.
  personas: Creation and use of proto-personas and personas from user-research findings.
  raster_graphics: Raster graphics concepts including pixels, color space, image and
    device resolution, raster formats, compression, and practical use of Adobe Photoshop.
  requirements_analysis: Analysis of software requirements as part of planning and
    software-system development.
  scenario_based_design: Scenarios and role-play used to envision and specify interactions
    and user experiences.
  storyboarding: Storyboarding for envisioning interactive experiences and communicating
    sequences of media, actions, and narrative.
  three_d_modeling: Three-dimensional modeling of cultural heritage objects.
  usability_analysis: Techniques and process phases for analyzing usability, including
    approaches conducted with and without user participation.
  usability_guidelines_patterns: Historical and practical guidelines, patterns, and
    methods that support concrete usability design.
  user_centered_design: User-centered design and the relationship between human-computer
    interaction, user experience, and product development.
  user_interface_design: Basic principles of user interface design.
  virtual_tours: Virtual tours as a digital technology for communicating cultural
    heritage.
