analysis:
  mode: all-courses
source_clusters:
- id: 14
  name: Engineering Software Cultural (14)
course:
  id: B5474
  name: ARCHITETTURE SOFTWARE A MICROSERVIZI
topics:
  architectural_patterns: Advanced architectural patterns for structuring and designing
    software systems.
  business_process_modeling_bpmn: Modeling business processes with Business Process
    Model and Notation (BPMN).
  data_serialization: Tools and technologies for presenting, serializing, and deserializing
    data in distributed systems.
  grpc: gRPC as a protocol and implementation technology for service-to-service communication.
  jolie: Rapid prototyping and implementation of service-oriented architecture solutions
    using the Jolie language.
  microservices: Microservice architectures, including their principles, technologies,
    and enterprise-software perspective.
  rest_web_apis: REST principles and design of APIs for Web applications.
  scalable_reliable_architecture: Architectural principles and the AKF Scale Cube
    model for designing scalable and reliable services.
  service_choreographies: Modeling interactions and coordination between processes
    and services, and among distributed services, through service choreographies.
  service_orchestration: Orchestration of cloud services, including practical use
    of OpenStack and Kubernetes.
  service_oriented_computing: Service-oriented computing as illustrated through Jolie.
  soap_wsdl: SOAP-based Web services and WSDL descriptions for service-based software
    architectures.
  software_architecture_design: Design of system architecture and definition of the
    logical architecture of a software problem.
  software_architecture_styles: Selection and use of layered, client-server, pipeline,
    microkernel, service-based, event-driven, space-based, and microservice architectural
    styles for software subsystems.
  uml_software_modeling: Unified Modeling Language (UML) as a standard language for
    visualizing software-application designs.
  virtualization_containers: Virtualization and container technologies, including
    Docker and Kubernetes.
  web_services: Development of back ends based on Web services.
