analysis:
  mode: all-courses
source_clusters:
- id: 25
  name: Administration Systems System (25)
course:
  id: '81917'
  name: Interaction Multimedia Services
topics:
  algorithmic_problem_solving: Algorithmic approaches to solving problems with computers
    using the imperative programming paradigm.
  application_security: Security considerations and protective practices for web and
    mobile applications.
  client_server_model: Client/server interaction and the design of small client/server
    applications.
  cloud_computing: Introduction to cloud computing in the context of distributed and
    service-oriented programming.
  data_backup: Data-backup practices as part of personal and application security.
  design_thinking: The Design Thinking process of empathizing, defining, ideating,
    prototyping, and testing service concepts.
  event_driven_architecture: Event-driven computational models and architectures for
    distributed proactive-reactive applications.
  experience_mapping: Creation of experience maps to represent users' current contexts
    and experiences.
  hci_techniques: Human-computer interaction techniques applied to web application
    and website design.
  intellectual_property: Intellectual-property considerations introduced as a computer-science
    fundamentals topic.
  internet_security_privacy: Introductory security and privacy considerations in Internet
    communication.
  internet_www: The Internet and World Wide Web.
  it_security: Basic IT security issues, including personal-data and file protection,
    viruses, and phishing.
  javascript_language: JavaScript as a dynamic functional programming language.
  machine_learning_basics: Basic machine-learning algorithms and methods used to develop
    intelligent applications.
  mobile_app_design: Design considerations for native smartphone applications, including
    application architecture and graphical interfaces.
  mobile_application_types: Differences among web, hybrid, and native mobile applications.
  password_management: Password-management practices for protecting accounts and services.
  personas: Creation and use of proto-personas and personas from user-research findings.
  privacy_law: Privacy law and online rights as they relate to digital services and
    technology use.
  programming_languages_intro: Introductory concepts of programming languages, including
    what a language is and the role of programming languages.
  quantitative_research: Quantitative research methodologies, including survey design
    and analysis of feedback.
  service_blueprint: Service blueprints for modeling the structure and operation of
    a service.
  service_ecosystem_mapping: Ecosystem maps for visualizing the actors, components,
    and relationships involved in a service.
  social_engineering: Social-engineering threats considered in the context of cybersecurity.
  statistical_data_analysis: Statistical analysis of data as part of data understanding
    for data mining.
  usability_testing: Designing and conducting usability tests to gather feedback and
    iterate on a service concept.
  user_centered_design: User-centered design and the relationship between human-computer
    interaction, user experience, and product development.
  user_journey_mapping: User journey maps for representing and contextualizing users'
    interactions with a service.
  user_research_methods: Qualitative user-research methods including semi-structured
    interviews, contextual inquiry, observation, and research planning.
  virtualization_containers: Virtualization and container technologies, including
    Docker and Kubernetes.
  web_applications: Basic concepts and use of Web applications, including browsing
    institutional portals.
  web_architectures_stacks: Comparisons of Web architectures and solution stacks for
    developing Web sites, front ends, and back ends.
  web_markup_languages: Web markup and styling languages including XHTML, XML, HTML5,
    and CSS.
