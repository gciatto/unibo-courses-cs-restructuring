analysis:
  mode: all-courses
source_clusters:
- id: 8
  name: Databases Database Systems (8)
course:
  id: '79194'
  name: Databases
topics:
  conceptual_database_design: Requirements analysis and conceptual database design
    for relational databases.
  database_integrity_constraints: Integrity constraints governing valid data in relational
    databases.
  entity_relationship_model: Entity-Relationship modeling for representing data and
    relationships in database design.
  logical_database_design: Logical database design for relational databases.
  nosql_databases: Introductory architectures and non-relational data models of NoSQL
    systems.
  relational_dbms_features: Features and main data-management functionalities of relational
    database management systems.
  relational_model: Structure and principles of the relational data model.
  sql_ddl_dml: SQL statements for defining relational database structures and creating,
    modifying, and deleting data.
  sql_queries: Databases and the formulation and use of SQL queries.
  sql_views: Definition and use of views in SQL databases.
