analysis:
  mode: all-courses
source_clusters:
- id: 12
  name: Knowledge Engineering Extraction (12)
course:
  id: '95639'
  name: Industry 4.0
topics:
  classic_image_representation: Classic computer-vision techniques for representing
    and processing images.
  cloud_computing: Introduction to cloud computing in the context of distributed and
    service-oriented programming.
  computer_vision_overview: Basic definitions of computer vision and an overview of
    its major application domains.
  digital_transformation_business_models: Technology-driven business models and decision-making
    in digital transformation projects.
  digital_twins: Digital-twin concepts in simulation.
  edge_fog_computing: Edge and fog computing for sensor-edge-cloud integration, distributed
    control and intelligence, offloading, proactive approaches, mobility prediction,
    and orchestration in mobile and industrial environments.
  embedded_systems_intro: Introduction to embedded systems, including microcontrollers,
    systems-on-chip, sensors, actuators, and related electronics.
  image_classification: Image classification using linear classifiers and fully connected
    neural networks.
  industrial_digital_transformation: Industrial digital transformation and its technological,
    organizational, business, and societal implications.
  industrial_iot: Industrial Internet of Things concepts, technological landscape,
    and applications in industrial digital transformation.
  industrial_iot_applications: Application domains and real-world case studies for
    Internet of Things and Industrial IoT technologies.
  industry4_foundations: History, cross-disciplinary drivers, technological foundations,
    trends, and current state of Industry 4.0.
  industry5_human_centered: Industry 5.0 and human-centered paradigms for industrial
    technology and digital transformation.
  internet_of_things: Design and development of applications combining high-level
    software or AI capabilities with connected Internet of Things devices.
  iot_architectures_platforms: Basic architectures and platforms for Internet of Things
    systems.
  iot_devices_sensors: Internet of Things things, including sensors, actuators, and
    complex devices, with examples such as Raspberry Pi and Arduino platforms.
  iot_interoperability_standards: Interoperability standards and technology trade-offs
    in Internet of Things and Industrial IoT systems.
  iot_resource_constraints: Resource-constrainedness in Industry 4.0 and Industrial
    IoT systems, including methods suited to constrained environments.
  iot_sensing_processing_communication: Sensing, identification, processing, and communication
    functions in Internet of Things and Industrial IoT solutions.
  machine_learning_basics: Basic machine-learning algorithms and methods used to develop
    intelligent applications.
  neural_networks_deep_learning: Introduction to neural networks and deep learning,
    including their applications.
  object_detection: Techniques for detecting objects in images and video.
  web_of_things: Introductory Web of Things concepts for connecting and interacting
    with Internet of Things devices through Web technologies.
