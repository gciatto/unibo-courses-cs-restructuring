analysis:
  mode: all-courses
source_clusters:
- id: 10
  name: Reliable Scalable Services (10)
course:
  id: '97431'
  name: Scalable and Reliable Services M
topics:
  benchmarking: Benchmarking methods for evaluating service performance.
  capacity_planning: Planning service capacity to support performance, scalability,
    and reliability requirements.
  change_management: Managing changes affecting services and their operation.
  cloud_computing: Introduction to cloud computing in the context of distributed and
    service-oriented programming.
  cloud_infrastructure_models: Data-center, multicloud, and federated-resource infrastructure
    models supporting large distributed and cloud systems, including cloud internals
    and organizational patterns.
  complexity_management: Understanding and managing complexity in organizations and
    service operations.
  cost_benefit_analysis: Cost-benefit analysis applied to information-system initiatives.
  crisis_management: Management of crises affecting digital services and their organizations.
  data_governance: Data-governance principles and practices for managing enterprise
    data.
  data_strategy: Enterprise data-strategy methods and planning for using organizational
    data.
  devops_practices: DevOps practices for software development, deployment, and maintenance
    processes.
  high_availability: Basic concepts of availability in distributed systems designed
    for continued service operation.
  incident_management: Management of incidents affecting the operation of digital
    services.
  performance_testing: Performance testing of digital services.
  scalability_distributed_systems: Scalability considerations in distributed systems.
  scalable_reliable_architecture: Architectural principles and the AKF Scale Cube
    model for designing scalable and reliable services.
  secure_devops: Secure and robust DevOps practices for deploying and operating digital
    services.
  secure_software_production: Secure and robust software-production practices for
    high-quality digital services.
  service_maturity_assessment: Maturity assessment methods applied to the design and
    improvement of high-quality services.
  service_migration_cloud: Migration of services to cloud environments.
  service_orchestration: Orchestration of cloud services, including practical use
    of OpenStack and Kubernetes.
  service_organization_management: Roles, responsibilities, leadership, and management
    practices for organizations operating scalable and reliable services.
  service_outage_analysis: Analysis of service outages, critical dependencies, bottlenecks,
    and single points of failure.
  service_performance_monitoring: Monitoring service performance and identifying warning
    signs during operation.
  software_architecture_design: Design of system architecture and definition of the
    logical architecture of a software problem.
  software_lifecycle: Phases and activities in the lifecycle of software systems,
    including planning, requirements analysis, and design.
  software_production: Production activities in software engineering.
  software_testing: Testing activities for software systems.
  stress_testing: Stress testing of digital services under demanding loads.
