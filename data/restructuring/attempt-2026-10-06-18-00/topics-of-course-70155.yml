analysis:
  mode: all-courses
source_clusters:
- id: 8
  name: Databases Database Systems (8)
course:
  id: '70155'
  name: Data Bases
topics:
  big_data_management: Introductory approaches and technologies for managing big data
    as alternatives or complements to relational databases.
  classification_models: Predictive data analysis using classification models in Python.
  clustering: Clustering techniques for data mining.
  conceptual_database_design: Requirements analysis and conceptual database design
    for relational databases.
  data_mining_overview: General concepts, application scenarios, and supervised and
    unsupervised techniques in data mining.
  database_integrity_constraints: Integrity constraints governing valid data in relational
    databases.
  database_normalization: Normal forms and normalization techniques for relational
    database design.
  database_performance_analysis: Analysis of relational database designs and data
    models for performance.
  database_storage_structures: Secondary-memory data structures and management algorithms,
    including sequential and direct access organizations, primary and secondary indexes,
    and B-tree, B*-tree, and B+tree structures.
  database_transactions: Database transactions, including ACID properties, concurrency
    management, and transaction protocols.
  entity_relationship_model: Entity-Relationship modeling for representing data and
    relationships in database design.
  logical_database_design: Logical database design for relational databases.
  nosql_databases: Introductory architectures and non-relational data models of NoSQL
    systems.
  relational_dbms_features: Features and main data-management functionalities of relational
    database management systems.
  relational_keys: Keys used to identify and relate records in relational databases.
  relational_model: Structure and principles of the relational data model.
  requirements_analysis: Analysis of software requirements as part of planning and
    software-system development.
  server_side_php: Server-side web application development using PHP.
  sql_ddl_dml: SQL statements for defining relational database structures and creating,
    modifying, and deleting data.
  sql_queries: Databases and the formulation and use of SQL queries.
  sql_views: Definition and use of views in SQL databases.
  web_applications: Basic concepts and use of Web applications, including browsing
    institutional portals.
