analysis:
  mode: all-courses
source_clusters:
- id: 26
  name: Programming Software Design (26)
course:
  id: '95648'
  name: Software Design and Development
topics:
  agile_software_development: Agile software-development principles and practices.
  build_automation: Build automation tools and practices for automating software construction.
  concurrent_programming: The concurrent programming paradigm.
  continuous_integration: Continuous Integration and delivery practices for integrating,
    validating, and delivering software changes.
  devops_practices: DevOps practices for software development, deployment, and maintenance
    processes.
  distributed_version_control: Distributed version-control concepts and workflows,
    including Git repositories, commits, branches, merges, remotes, forks, pull requests,
    conflicts, and branching strategies.
  exceptions: Exception mechanisms in programming languages.
  functional_programming: Basic concepts and practical use of the functional programming
    paradigm.
  inheritance: Inheritance in object-oriented programming.
  java_annotations: Annotations in the Java programming language.
  java_development_tools: Java development tools and environments, including the JDK
    and VSCode.
  java_generics: Generic programming constructs in Java.
  java_gui: Graphical user-interface construction in Java.
  java_io: Input/output management in Java programs.
  java_oop: Introduction to object-oriented programming in Java.
  java_standard_libraries: Basic Java libraries used for constructing programs.
  lambda_expressions: Lambda expressions in Java programming.
  object_oriented_programming: Introduction to the object-oriented programming paradigm
    in practical lectures.
  oo_analysis_design: Analysis and design of software systems using the object-oriented
    paradigm.
  oo_classes_objects: Classes and objects in the object-oriented programming paradigm.
  oo_interfaces_abstract_classes: Interfaces and abstract classes for abstraction
    and reuse in object-oriented Java programs.
  oo_polymorphism: Polymorphism in object-oriented programming, as covered through
    Java programming.
  software_design_patterns: Design patterns used in the design of software systems.
