analysis:
  mode: all-courses
source_clusters:
- id: 21
  name: Artificial Intelligence Fundamentals (21)
course:
  id: '78778'
  name: Intelligent Systems M
topics:
  ai_planning: Planning problems as a class of artificial-intelligence problem-solving
    tasks.
  ai_search_strategies: Search-based problem solving in artificial intelligence using
    informed and uninformed search strategies.
  ant_colony_optimization: Ant-colony optimization methods inspired by ant foraging
    behavior.
  bayesian_approaches: Bayesian approaches to machine learning covered as part of
    the course's symbolic and sub-symbolic methods.
  bee_colony_optimization: Bee-colony optimization methods inspired by the collective
    behavior of bees.
  conditional_planning: Planning methods that incorporate conditional actions or branching
    plans to handle differing outcomes or information.
  constraint_programming: Constraint-programming methods, including global constraints,
    search strategies, and applications.
  decision_tree_classification: Classification using decision-tree models.
  graph_based_planning: Planning techniques that represent and solve planning problems
    using graph-based structures.
  inductive_logic_programming: Inductive Logic Programming methods that learn logical
    programs or rules from examples and background knowledge.
  neural_networks_deep_learning: Introduction to neural networks and deep learning,
    including their applications.
  nonlinear_planning: Planning methods that allow actions and subgoals to be arranged
    without a fixed linear order.
  particle_swarm_optimization: Particle Swarm Optimization methods for solving optimization
    problems.
  random_forest_classification: Random-forest ensemble methods for classification.
  robotics_planning: Planning techniques applied to robotic tasks and robot action
    selection.
  swarm_intelligence: Optimization and problem-solving methods inspired by the collective
    behavior of swarms.
