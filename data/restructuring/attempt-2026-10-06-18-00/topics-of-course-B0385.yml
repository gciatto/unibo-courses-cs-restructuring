analysis:
  mode: all-courses
source_clusters:
- id: 20
  name: Language Natural Processing (20)
course:
  id: B0385
  name: Natural Language Processing
topics:
  bayesian_classifiers: Bayesian methods for classification.
  corpus_analysis: Building and analyzing text corpora for developing and evaluating
    natural-language prediction models.
  latent_semantic_analysis: Latent Semantic Analysis (LSA) for deriving latent semantic
    structure from word-document representations.
  model_evaluation: Evaluation methods for language and machine-learning models.
  neural_networks: Neural networks as a technique and current technical issue in artificial
    intelligence.
  nlp_basics: Fundamentals of natural language processing, including introductory
    methods for analyzing and processing text.
  opinion_mining: Opinion mining from textual data.
  recurrent_neural_networks: Recurrent neural networks.
  similarity_dissimilarity: Measures of similarity and dissimilarity used in data-mining
    analysis.
  supervised_unsupervised_learning: Supervised and unsupervised machine-learning approaches.
  text_classification: Classification of text documents or other textual data.
  text_cnn: Convolutional neural networks applied to text sequences for natural-language
    processing tasks.
  text_representation: Representation of text for text-mining applications.
  tokenization: Tokenization of natural-language text into words, subwords, or other
    processing units.
  word_embeddings: Vector representations of words, including word vectors and learned
    word embeddings for capturing semantic relationships.
