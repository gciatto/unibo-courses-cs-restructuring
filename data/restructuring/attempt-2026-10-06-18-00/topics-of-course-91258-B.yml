analysis:
  mode: all-courses
source_clusters:
- id: 20
  name: Language Natural Processing (20)
course:
  id: 91258-B
  name: Natural Language Processing
topics:
  computational_linguistics: Elements of computational linguistics relevant to the
    computational analysis and processing of natural language.
  computational_morphology: Computational treatment of morphological operations in
    natural-language processing.
  computational_phonetics: Computational analysis of speech samples, including acoustic
    properties and measures used in phonetic applications.
  corpus_analysis: Building and analyzing text corpora for developing and evaluating
    natural-language prediction models.
  dependency_grammars: Dependency grammars for representing syntactic relationships
    in natural-language sentences.
  language_models: Language models used in text-mining and language-processing workflows.
  lexical_semantics: Lexical meaning in natural language, including WordNet and FrameNet.
  logical_sentence_semantics: Logical approaches to representing and analyzing sentence
    meaning.
  model_evaluation: Evaluation methods for language and machine-learning models.
  named_entity_recognition: Identification and classification of named entities in
    text.
  natural_language_grammars: Grammars for natural language, including formal-language
    foundations and phrase-structure grammars.
  natural_language_parsing: Parsing methods and modern formalisms for analyzing natural-language
    sentences.
  neural_networks_deep_learning: Introduction to neural networks and deep learning,
    including their applications.
  ngram_language_models: N-gram language models for estimating and using probabilities
    over sequences of words or other language units.
  nlp_basics: Fundamentals of natural language processing, including introductory
    methods for analyzing and processing text.
  opinion_mining: Opinion mining from textual data.
  part_of_speech_tagging: Part-of-speech tagging in natural-language processing.
  prompting_language_models: Prompting pre-trained language models for natural-language-processing
    applications.
  similarity_dissimilarity: Measures of similarity and dissimilarity used in data-mining
    analysis.
  spectrogram_analysis: Frequency-domain analysis of speech and interpretation of
    spectrograms.
  speech_processing: Elements of speech processing within natural-language processing.
  speech_recognition: Speech-recognition methods using deep neural networks.
  static_lexica: Static lexica used in computational morphology and natural-language
    processing.
  text_classification: Classification of text documents or other textual data.
  text_retrieval: Retrieval of textual information in text-mining applications.
  treebanks: Treebanks as annotated resources for studying and parsing natural-language
    syntax.
  two_level_morphology: Two-level morphology for representing and processing morphological
    relationships.
  word_association_measures: Concordances, collocations, and statistical measures
    of association between words in corpora.
  word_embeddings: Vector representations of words, including word vectors and learned
    word embeddings for capturing semantic relationships.
  word_sense_disambiguation: Methods for determining the intended sense of an ambiguous
    word in context.
  wordnet_framenet: Use of WordNet and FrameNet for representing lexical-semantic
    information.
