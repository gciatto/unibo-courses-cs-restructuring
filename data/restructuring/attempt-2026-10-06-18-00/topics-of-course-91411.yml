analysis:
  mode: all-courses
source_clusters:
- id: 21
  name: Artificial Intelligence Fundamentals (21)
course:
  id: '91411'
  name: Intelligent Robotic Systems
topics:
  a_star_path_planning: A* and related informed-search variants for robot path-planning
    problems.
  ai_search_strategies: Search-based problem solving in artificial intelligence using
    informed and uninformed search strategies.
  associative_learning: Associative learning methods for robot adaptation and learning.
  automatic_robot_program_design: Automatic design of programs for controlling robots.
  autonomous_mobile_robots: Development of relatively autonomous mobile robotic applications
    operating in virtual or real environments.
  behavior_based_control: Behavior-based robotics paradigms for coordinating multiple
    robot behaviors.
  behavior_trees: Behavior trees for structuring and controlling robot behaviors.
  evolutionary_robotics: Artificial evolution and evolutionary methods for designing
    or adapting robots.
  fuzzy_robotics: Fuzzy logic and fuzzy systems applied to intelligent robotic-system
    control.
  intrinsic_motivation: Intrinsic motivation mechanisms used in robot learning.
  motor_schemas: Motor schemas as behavior-coordination mechanisms for controlling
    robots.
  reinforcement_learning: Reinforcement-learning methods.
  robot_control_evaluation_tuning: Experimental evaluation and parameter tuning of
    robot-control software, including practical testing guidelines.
  robot_navigation: Navigation problems for robots and their principal solution approaches.
  robotics_ai: Introductory treatment of robotics and its implications for artificial
    intelligence, including recent developments.
  robotics_planning: Planning techniques applied to robotic tasks and robot action
    selection.
  subsumption_architecture: The Subsumption Architecture for organizing and coordinating
    robot behaviors.
  swarm_robotics: Swarm robotics and the coordination of groups of robots.
  value_based_learning: Value-based learning methods for robot adaptation and decision-making.
