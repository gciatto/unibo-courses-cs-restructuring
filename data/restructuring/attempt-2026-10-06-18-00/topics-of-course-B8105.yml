analysis:
  mode: all-courses
source_clusters:
- id: 17
  name: Basic Skills Informatics (17)
course:
  id: B8105
  name: Computational Management of Data
topics:
  algorithm_notations: Representing algorithms using pseudocode and flow diagrams.
  algorithmic_problem_solving: Algorithmic approaches to solving problems with computers
    using the imperative programming paradigm.
  algorithms_programming_basics: Basic principles of algorithms and programming.
  backtracking_algorithms: Backtracking as an algorithmic technique for systematically
    exploring and pruning candidate solutions.
  brute_force_algorithms: Brute-force approaches to solving algorithmic problems through
    systematic exploration of possible solutions.
  computational_abstraction: Abstraction as a central computational-thinking tool
    for simplifying and representing problems.
  computational_complexity: An introduction to computational complexity.
  computational_thinking: Computational thinking as an approach to formulating and
    solving problems with computers.
  computer_operation_principles: General principles governing the operation of computers
    and the relationship between hardware and software.
  data_types: Basic types of data used in computational problem solving and programming.
  data_visualization: Infographic communication techniques and principles for visualizing
    data.
  database_management_systems: Database Management Systems as software for organizing,
    managing, and accessing relational and NoSQL databases.
  descriptive_statistics: Univariate and bivariate descriptive statistics for summarizing
    biomedical and clinical data.
  dictionaries: Dictionary data structures for storing and retrieving key-value associations.
  divide_and_conquer: Divide-and-conquer as an algorithm design technique.
  dynamic_programming: Dynamic programming as an algorithm design technique.
  graphs: Graphs as elementary data structures.
  greedy_algorithms: Greedy methods as an algorithm design technique.
  language_evolution: The evolution of programming languages from assembly languages
    to higher-level languages.
  linear_search: Linear search for locating an item by examining elements sequentially.
  lists: List data structures, including their practical implementation and use.
  nosql_data_models: Design and use of non-relational data models, including document-based,
    graph-based, and column-oriented models.
  pandas_series_dataframes: Pandas Series and DataFrame structures for tabular data
    analysis.
  programming_languages_intro: Introductory concepts of programming languages, including
    what a language is and the role of programming languages.
  python_control_flow: Conditional statements and iteration constructs in Python.
  python_data_structures: Data structures used in Python programming, as introduced
    alongside Python data types, control flow, functions, and libraries.
  python_programming_basics: Introduction to programming in Python.
  python_variables_expressions: Variables and expressions in Python programming.
  queues: Queue data structures in C++.
  rdf_rdfs: RDF and RDFS for representing metadata and structured knowledge on the
    Web.
  recursion: Recursion and recursive procedures in programming languages.
  recursive_algorithms: Recursive algorithms and their use in algorithm design.
  relational_model: Structure and principles of the relational data model.
  sets: Set data structures for representing unordered collections and related operations.
  sorting_algorithms: Algorithms for sorting data.
  sparql_querying: Querying RDF and knowledge graphs with SPARQL, including use of
    the DBpedia knowledge graph.
  sql_queries: Databases and the formulation and use of SQL queries.
  stacks: Stack data structures as elementary data structures.
  test_driven_development: Test-driven development practices for designing and implementing
    software through iterative test-first development.
  trees: Tree data structures in C++.
  undecidable_problems: Limitations of effective procedures, including non-decidable
    problems.
