analysis:
  mode: all-courses
source_clusters:
- id: 20
  name: Language Natural Processing (20)
course:
  id: 91258-A
  name: Natural Language Processing
topics:
  attention_mechanisms: Attention mechanisms for visual and language representations,
    including their use in vision Transformers and image-classification architectures.
  computational_linguistics: Elements of computational linguistics relevant to the
    computational analysis and processing of natural language.
  contextual_word_embeddings: Contextual word embeddings that represent word meaning
    according to surrounding language context.
  language_models: Language models used in text-mining and language-processing workflows.
  large_language_models: Generative large language models.
  linear_text_classification: Text classification using linear models.
  neural_networks_deep_learning: Introduction to neural networks and deep learning,
    including their applications.
  ngram_language_models: N-gram language models for estimating and using probabilities
    over sequences of words or other language units.
  nlp_basics: Fundamentals of natural language processing, including introductory
    methods for analyzing and processing text.
  nlp_libraries_tools: Libraries and tools used to implement natural-language processing
    systems and applications.
  recurrent_neural_networks: Recurrent neural networks.
  speech_processing: Elements of speech processing within natural-language processing.
  text_classification: Classification of text documents or other textual data.
  text_representation: Representation of text for text-mining applications.
  text_retrieval: Retrieval of textual information in text-mining applications.
  tokenization: Tokenization of natural-language text into words, subwords, or other
    processing units.
  transformers: Transformer architectures and attention-based models, including applications
    to visual and language-related machine-learning tasks.
  word_embeddings: Vector representations of words, including word vectors and learned
    word embeddings for capturing semantic relationships.
