analysis:
  mode: all-courses
source_clusters:
- id: 0
  name: Security Information Cryptography (0)
course:
  id: '93470'
  name: Cybersecurity
topics:
  anti_forensics: Anti-computer-forensics techniques intended to hinder or undermine
    forensic investigations.
  application_security: Security considerations and protective practices for web and
    mobile applications.
  authentication: Authentication as a security goal and cryptographic mechanism.
  authorization: Authorization as a cybersecurity mechanism for controlling access
    to resources or actions.
  cryptographic_protocols: Basic protocols that use cryptographic techniques.
  cryptographic_security_foundations: Fundamental security issues arising in computer
    systems as addressed through cryptography.
  denial_of_service_attacks: Denial-of-Service and Distributed Denial-of-Service attacks
    against computing and network infrastructures.
  digital_signatures: Digital signatures, including their use in email and certified
    email.
  forensic_investigations: The digital-forensics profession and the procedures used
    in digital investigations.
  key_management: Symmetric and asymmetric cryptographic key-management models and
    systems.
  malicious_software: Malicious software and the security problems caused by malware.
  os_hardening: Basic operating-system hardening practices for reducing system vulnerabilities.
  public_key_cryptography: Public-key cryptographic algorithms and their use.
  risk_analysis: Risk analysis for information-system design and projects.
  secret_key_cryptography: Secret-key cryptographic algorithms and their use.
  security_auditing: Auditing activities for evaluating and managing the security
    of computing infrastructures.
  security_policies: Design and implementation of security policies as part of security
    management.
  security_threats_vulnerabilities: Definitions and relationships among threats, vulnerabilities,
    exploits, and risks in information and system security.
  social_engineering: Social-engineering threats considered in the context of cybersecurity.
