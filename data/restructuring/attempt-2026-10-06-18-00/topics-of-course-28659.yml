analysis:
  mode: all-courses
source_clusters:
- id: 13
  name: Web Technologies Web-Related (13)
course:
  id: '28659'
  name: Web Technologies T
topics:
  client_side_web_programming: Client-side Web programming using JavaScript and Ajax.
  enterprise_java_containers: Enterprise JavaBeans and Spring as examples of heavy
    and lightweight container-based server-side environments.
  http2_websockets: Motivations and mechanisms for WebSockets in the transition toward
    HTTP/2, including JavaScript client-side and Java server-side use.
  http3_quic: Motivations and primary characteristics of HTTP/3 and the QUIC protocol.
  http_uris: The HTTP protocol and Uniform Resource Identifiers as primary elements
    of the original Web model.
  internet_www: The Internet and World Wide Web.
  mvc_web_architecture: Model-View-Controller architecture for the Web and the related
    Java Model 2 approach.
  nodejs_async_io: Event-oriented and stateless server-side models using Node.js and
    asynchronous input/output management.
  server_side_web_programming: Server-side Web programming with Servlets and JavaServer
    Pages (JSP).
  single_page_react_apps: Single-page applications, React.js, and emerging directions
    in front-end technology.
  web_evolution: The development of the Web from Web 1.0 to Web 2.0.
  web_markup_languages: Web markup and styling languages including XHTML, XML, HTML5,
    and CSS.
  web_multilayer_architecture: Multi-layer Web architectures with horizontal and vertical
    distribution, separation of business logic, and component-container models.
  web_state_sessions: Personalization, state management, sessions, and conversations
    in dynamic Web applications.
