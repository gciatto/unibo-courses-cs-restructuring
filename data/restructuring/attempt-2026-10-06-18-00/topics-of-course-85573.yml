analysis:
  mode: all-courses
source_clusters:
- id: 9
  name: Experience User Usability (9)
course:
  id: '85573'
  name: Usability and User Experience
topics:
  experience_design: User Experience and Experience Design principles and methodologies
    for designing interaction systems.
  mobile_usability_ux: Usability and user-experience considerations for mobile applications.
  usability_analysis: Techniques and process phases for analyzing usability, including
    approaches conducted with and without user participation.
  usability_guidelines_patterns: Historical and practical guidelines, patterns, and
    methods that support concrete usability design.
  usability_standards: Standards used to manage and evaluate the user-experience and
    usability-design process.
  user_centered_design: User-centered design and the relationship between human-computer
    interaction, user experience, and product development.
  web_usability_ux: Design and verification of Web usability and user experience,
    including correctness and universal accessibility.
