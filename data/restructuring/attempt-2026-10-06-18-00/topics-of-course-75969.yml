analysis:
  mode: all-courses
source_clusters:
- id: 17
  name: Basic Skills Informatics (17)
course:
  id: '75969'
  name: Basic Informatics
topics:
  algorithm_notations: Representing algorithms using pseudocode and flow diagrams.
  algorithmic_problem_solving: Algorithmic approaches to solving problems with computers
    using the imperative programming paradigm.
  bits_bytes: Bits and bytes as basic units for representing and transferring information.
  computational_thinking: Computational thinking as an approach to formulating and
    solving problems with computers.
  computer_networks: Basic computer-network concepts.
  computer_operation_principles: General principles governing the operation of computers
    and the relationship between hardware and software.
  data_collections: Data collections as an introductory concept in the organisation
    and use of humanities data.
  digital_humanities_projects: Digital projects that apply computer science technologies
    to humanities studies.
  digital_textualization: Transposition and digitization of humanities texts and documents
    for use in Digital Humanities projects.
  dns: DNS and advanced name systems used in distributed environments.
  fundamental_data_structures: Introductory fundamental data structures considered
    alongside algorithms and programming.
  http_protocols: HTTP protocols used in distributed-system and network communication.
  http_uris: The HTTP protocol and Uniform Resource Identifiers as primary elements
    of the original Web model.
  internet_routing: Routing mechanisms and organization used to move packets through
    the Internet.
  internet_www: The Internet and World Wide Web.
  network_protocols: Introduction to protocols used in computer networks.
  programming_languages_intro: Introductory concepts of programming languages, including
    what a language is and the role of programming languages.
  tcp_protocol: The Transmission Control Protocol as a connection-oriented transport
    protocol.
  undecidable_problems: Limitations of effective procedures, including non-decidable
    problems.
  visual_programming_languages: Visual programming languages as an introductory approach
    to expressing computer programs.
  web_browser_server: How Web browsers and Web servers work, including the technologies
    they support.
  web_evolution: The development of the Web from Web 1.0 to Web 2.0.
  web_markup_languages: Web markup and styling languages including XHTML, XML, HTML5,
    and CSS.
