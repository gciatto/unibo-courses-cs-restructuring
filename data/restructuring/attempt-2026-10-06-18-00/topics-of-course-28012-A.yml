analysis:
  mode: all-courses
source_clusters:
- id: 27
  name: Architectures Computer Architetture (27)
course:
  id: 28012-A
  name: Electronic Calculators T
topics:
  computer_hardware_architecture: Fundamental organization of computer hardware systems.
  cpu_pipelining: Pipelined CPU organization, including pipeline principles, datapaths,
    and performance metrics.
  dlx_cpu_organization: Internal CPU structure and implementation using the sequentially
    organized DLX processor.
  interrupt_systems: Hardware and software interrupts and exceptions, including interrupt
    handling by a programmable interrupt controller and vectored interrupts.
  io_handling: Handling of input/output devices in microprocessor-based systems.
  memory_devices: Memory devices as components of computer architecture.
  memory_interfacing: Interfacing ROM and RAM with the system bus, including address
    decoding, data-bus width, access time, wait states, and READY circuitry.
  microprocessor_evolution: Evolution of microprocessors as covered in the course's
    computer-architecture material.
  processor_hierarchy_design: Processor hierarchy and methodologies for designing
    processor-based systems.
  risc_cisc_architectures: RISC and CISC processor architecture approaches.
  sequential_control_units: Sequential control units used in microprocessor organization
    and control.
