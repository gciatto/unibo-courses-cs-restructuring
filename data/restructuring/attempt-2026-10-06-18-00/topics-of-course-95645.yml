  name: Web Technologies Web-Related (13)
course:
  id: '95645'
  name: Foundations of Web Systems
topics:
  character_encodings: Character encodings used to represent text in web documents
    and communications.
  client_side_frameworks: Introduction to client-side Web frameworks, including Vue,
    React, and Angular.
  client_side_web_programming: Client-side Web programming using JavaScript and Ajax.
  hci_techniques: Human-computer interaction techniques applied to web application
    and website design.
  http_uris: The HTTP protocol and Uniform Resource Identifiers as primary elements
    of the original Web model.
  javascript_language: JavaScript as a dynamic functional programming language.
  json: JSON as a data representation format used in web technologies.
  web_markup_languages: Web markup and styling languages including XHTML, XML, HTML5,
    and CSS.
  web_usability_ux: Design and verification of Web usability and user experience,
    including correctness and universal accessibility.
