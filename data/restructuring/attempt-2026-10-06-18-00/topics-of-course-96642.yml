analysis:
  mode: all-courses
source_clusters:
- id: 25
  name: Administration Systems System (25)
course:
  id: '96642'
  name: Virtualization and System Integration
topics:
  authentication: Authentication as a security goal and cryptographic mechanism.
  block_storage: Block-storage technologies for distributed and virtualized systems,
    including iSCSI.
  centralized_configuration_management: Centralized configuration of distributed systems,
    services, and applications, including dynamic configuration support.
  centralized_monitoring: Centralized monitoring of distributed systems and services
    using monitoring applications such as Nagios.
  cloud_computing: Introduction to cloud computing in the context of distributed and
    service-oriented programming.
  distributed_architectures: Software and system architectures used to model and design
    distributed systems.
  distributed_communication: Communication mechanisms and concepts for distributed
    systems.
  distributed_file_systems: File-system concepts and tools in distributed operating
    systems.
  distributed_systems: Fundamental concepts of distributed systems.
  docker_api: The Docker API for managing containerized applications and Docker resources.
  dtls_protocol: Datagram Transport Layer Security (DTLS) for protecting datagram-based
    communication.
  firewalls: Firewalls for preventing network-based attacks.
  identity_management: Identity-management concepts, platforms, and protocols for
    Windows- and Linux-based systems, including Active Directory, LDAP, Kerberos,
    and OpenLDAP.
  kerberos: Kerberos as an example of a Single Sign-On authentication system.
  ldap_authentication: Centralized authentication using the Lightweight Directory
    Access Protocol (LDAP).
  message_oriented_middleware: Distributed programming using message-oriented middleware,
    including RabbitMQ.
  microservices: Microservice architectures, including their principles, technologies,
    and enterprise-software perspective.
  network_address_translation: Network Address Translation in IP networks.
  opc_industrial_protocols: OPC communication protocols for interactions between software
    systems and industrial systems such as programmable logic controllers.
  proxy_protocols: Proxying protocols and tools, including SOCKS, for relaying network
    communication.
  service_orchestration: Orchestration of cloud services, including practical use
    of OpenStack and Kubernetes.
  snmp_monitoring: The Simple Network Management Protocol and platforms for centralized
    monitoring of large or heterogeneous installations.
  ssh_protocol: SSH for secure remote communication and administration of information
    systems and servers.
  ssl: SSL for securing communications.
  virtual_machines: Structure and implementation of virtual machines.
  virtual_networks: Structure and implementation of virtual networks.
  virtualization_containers: Virtualization and container technologies, including
    Docker and Kubernetes.
  windows_linux_integration: Integration and interaction between Windows and Linux
    systems using relevant protocols and application approaches.
