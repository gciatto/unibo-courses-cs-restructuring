analysis:
  mode: all-courses
source_clusters:
- id: 12
  name: Knowledge Engineering Extraction (12)
course:
  id: '42500'
  name: Semantic Web
topics:
  graph_machine_learning: Machine-learning methods for graph-structured data.
  kg_completion: Knowledge-graph completion methods for inferring or adding missing
    graph information.
  kg_embeddings: Embedding knowledge graphs into vector representations.
  kg_mapping_alignment: Mapping and alignment of knowledge graphs and their represented
    concepts or entities.
  knowledge_graph_programming: Programming and development of applications that use
    knowledge graphs.
  knowledge_graph_visualization_analytics: Visualization and analytics of knowledge
    graphs.
  knowledge_graphs: Knowledge graphs in the Web of Data, including their conceptual
    foundations and use for representing and integrating knowledge.
  linked_open_data: Linked Open Data approaches for integrating, organising, and using
    interconnected Web resources.
  logical_inference: Logical inference over semantic Web representations.
  ontology_modeling_owl: Knowledge representation with ontologies and the OWL ontology
    language.
  rdf_rdfs: RDF and RDFS for representing metadata and structured knowledge on the
    Web.
  rdfa_microformats: RDFa and microformats for embedding semantic metadata in Web
    resources.
  semantic_search: Semantic search over knowledge graphs and Web of Data resources.
  semantic_web_architecture: Architecture, concepts, standards, and languages underlying
    the Semantic Web and Web of Data.
  sparql_querying: Querying RDF and knowledge graphs with SPARQL, including use of
    the DBpedia knowledge graph.
