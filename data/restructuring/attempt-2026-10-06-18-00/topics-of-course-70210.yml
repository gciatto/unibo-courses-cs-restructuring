analysis:
  mode: all-courses
source_clusters:
- id: 22
  name: Computer Vision Image (22)
course:
  id: '70210'
  name: Lab-based Course on Computer Graphics
topics:
  cad_technical_drawing: Basic use of computer-aided design tools for representing
    buildings and architectural components, producing technical drawings, and preparing
    drawings for screen display and printing.
  color_models: Color models used in basic image processing.
  computer_hardware_architecture: Fundamental organization of computer hardware systems.
  data_compression: Basic concepts and results in data compression.
  digital_graphics: Introductory concepts of digital graphics as part of digital information
    processing.
  digital_image_formats: Digital formats used to represent images.
  operating_systems_overview: Overview of the main operating systems referenced in
    the course.
  raster_graphics: Raster graphics concepts including pixels, color space, image and
    device resolution, raster formats, compression, and practical use of Adobe Photoshop.
  vector_graphics: Vector graphics concepts including graphic primitives, drawing
    and modification tools, layers, line styles and weights, vector and raster formats,
    and graphic-layout preparation.
