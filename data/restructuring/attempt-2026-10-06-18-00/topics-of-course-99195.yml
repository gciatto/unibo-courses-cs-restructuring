analysis:
  mode: all-courses
source_clusters:
- id: 4
  name: Internet Things Systems (4)
course:
  id: '99195'
  name: Cyber-Physical Systems Programming M
topics:
  activation_records: Stacks of activation records used to implement procedure calls
    and execution environments.
  autonomous_mobile_robots: Development of relatively autonomous mobile robotic applications
    operating in virtual or real environments.
  c_runtime: The C runtime environment and its role in embedded firmware execution.
  compilers: Compilers as implementation mechanisms for programming languages.
  control_flow_integrity: Control-flow integrity techniques for protecting cyber-physical-system
    software against unauthorized control-flow changes.
  cps_middleware: Middleware for cyber-physical systems, including microROS, XRCE-DDS,
    and DDS communication.
  cross_compilation_embedded: Basic principles of cross-compilation and programming
    applications for embedded devices.
  debugging_assertions: Debugging techniques for checking and diagnosing programs.
  deep_reinforcement_learning: Deep reinforcement-learning methods for learning and
    decision processes.
  digital_signatures: Digital signatures, including their use in email and certified
    email.
  embedded_device_drivers: Development and debugging of device and sensor drivers
    for embedded cyber-physical systems.
  embedded_firmware: Bare-metal embedded-firmware development, including firmware
    structure and execution on embedded systems.
  firmware_security: Firmware signature and verification mechanisms and secure communication
    protections for cyber-physical systems.
  freertos: FreeRTOS programming, including tasks, scheduling, priorities, synchronization,
    communication, timers, interrupts, and memory management.
  middleware_for_cps: Middleware technologies that support communication and coordination
    in cyber-physical systems.
  neural_networks_deep_learning: Introduction to neural networks and deep learning,
    including their applications.
  nuttx: The NuttX real-time operating system.
  qemu_emulation: Bare-metal programming and experimentation for embedded systems
    using the QEMU emulator.
  real_time_systems: Main design issues, implementation strategies, supporting environments,
    performance evaluation, and application domains of real-time systems.
  reinforcement_learning: Reinforcement-learning methods.
  secure_communications_vpn: Secure communication protocols and virtual private networks
    for protecting data in transit.
  system_calls: System calls as the interface between operating-system services and
    application programs.
  trusted_execution_environments: Trusted Execution Environments and Trusted Platform
    Modules for protecting cyber-physical-system software and firmware.
  zephyr: The Zephyr real-time operating system.
