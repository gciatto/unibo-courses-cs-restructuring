analysis:
  mode: all-courses
source_clusters:
- id: 15
  name: Network Networks Programming (15)
course:
  id: '90730'
  name: Social Network Analysis
topics:
  large_network_analysis: Methods for handling large networks by reducing problem
    size through edge elimination, node pruning, divide-and-conquer, aggregation,
    and sampling.
  network_analysis_foundations: Introduction to network analysis as an interdisciplinary
    approach for studying networks of entities and Web phenomena.
  network_data_collection_management: Formulating network questions, collecting reliable
    network data, transforming data formats, and using algorithms and software for
    network analysis and visualization.
  network_hypothesis_testing: Testing hypotheses in network analysis using permutation
    tests and dyadic hypotheses.
  network_metrics: Network-level properties and metrics, including small-world effects,
    degree distributions, power laws, scale-free networks, cohesion, reciprocity,
    transitivity, triad census, centralization, core-periphery indices, random graphs,
    and component structure.
  network_node_metrics: Node-level network measures, including degree, centrality,
    closeness, betweenness, hubs and authorities, cliques, cores, components, k-components,
    clustering coefficients, reciprocity, similarity, equivalence, homophily, and
    assortative mixing.
  network_representation: Network types and representations using graphs, paths, components,
    adjacency matrices, matrix operations, and related network concepts.
  network_research_design: Scientific publication processes, research design, and
    analysis of research papers in network analysis.
  network_visualization: Visualization of networks using graph-layout algorithms,
    node attributes and filtering, ego networks, tie characteristics and strengths,
    and visualizations of network change.
  pagerank: PageRank as a method for Web information retrieval.
