  name: Fashion Technologies Immersive (3)
course:
  id: '93379'
  name: Digital Culture
topics:
  automatic_decision_systems: Characteristics of activation and the logical-functional
    architecture of automatic decision systems.
  business_process_agents: Artificial agents applied to productivity and business
    processes.
  data_storytelling: Principles and methods for communicating data through structured
    stories and visual explanations.
  data_visualization: Infographic communication techniques and principles for visualizing
    data.
  decision_quality_monitoring: The adaptation dimension of digital intelligence and
    monitoring the quality of decision-making processes.
  digital_analog_paradigm: The contrast between analog and digital representations
    and the digital paradigm associated with the information-technology revolution.
  digital_data_acquisition: The concept of digital data and methods for constructing
    and acquiring digital data.
  digital_decision_making_forecasting: Effects of digital technologies on decision-making
    phases and methods for anticipating or predicting future developments.
  digital_intelligence_dimensions: 'The six dimensions of digital intelligence: data
    acquisition, memory, processing, representation, activation, and adaptation.'
  digital_memory_architectures: Fundamental characteristics and properties of digital
    memory and four types of logical memory architecture.
  digital_text_analysis_methods: Methods for analyzing digital text as part of computational
    processing and digital intelligence.
  digitalization_impacts: Effects of digitalization and the information-technology
    revolution across astronomical, ecological, political, economic, social, and individual
    contexts.
  generative_ai_platforms: Large-language-model and generative-artificial-intelligence
    platforms covered as tools of digital intelligence.
  large_language_models: Generative large language models.
  machine_learning_basics: Basic machine-learning algorithms and methods used to develop
    intelligent applications.
  time_series_analysis: Analysis of time-series data as a method used within digital
    intelligence.
