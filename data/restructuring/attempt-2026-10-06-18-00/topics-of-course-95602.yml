analysis:
  mode: all-courses
source_clusters:
- id: 7
  name: Informatica Computer Science (7)
course:
  id: '95602'
  name: Programming and Computer Architectures
topics:
  algorithms_programming_basics: Basic principles of algorithms and programming.
  architecture_comparison: Comparison of computer architecture approaches.
  binary_encoding: Binary encoding of information.
  chip_manufacturing: Computer chips and their production as part of computer hardware
    technology.
  cloud_computing: Introduction to cloud computing in the context of distributed and
    service-oriented programming.
  computer_architecture_history: Historical evolution of computer architectures from
    early stored-program systems through mainframes, minicomputers, microprocessors,
    and personal computers.
  computer_architecture_trends: Current trends and applications in computer architectures.
  computer_hardware_architecture: Fundamental organization of computer hardware systems.
  computer_industry: Computer-related companies and the computing industry.
  computer_performance: Measurement of computer performance.
  computer_storage_devices: Computer secondary-storage devices, including hard disk
    drives and solid-state drives, as hardware components.
  dictionaries: Dictionary data structures for storing and retrieving key-value associations.
  immutable_mutable_objects: Immutable and mutable objects in Python.
  logic_gates_circuits: Boolean logic gates and circuit diagrams.
  memory_devices: Memory devices as components of computer architecture.
  parallel_architectures: Parallel computer architectures as covered in the course's
    overview of computer-architecture levels and examples.
  processor_memory_io: Basic elements of processors, memories, and input/output interfaces
    in digital systems.
  python_control_flow: Conditional statements and iteration constructs in Python.
  python_data_analysis_libraries: Use of Python libraries for data analysis, including
    NumPy, SciPy, Matplotlib, pandas, and scikit-learn.
  python_data_structures: Data structures used in Python programming, as introduced
    alongside Python data types, control flow, functions, and libraries.
  python_data_types: Basic Python data types and their use in solving problems.
  python_functions: Functions in the Python programming language.
  python_modules_packages: Python modules, standard-library components, and packages.
  python_name_scope: Names and their visibility, including scope rules, in Python
    programs.
  python_objects_attributes_methods: Python objects, including object attributes and
    methods.
  python_programming_basics: Introduction to programming in Python.
  python_sequences: Sequences as data structures in Python.
  python_variables_expressions: Variables and expressions in Python programming.
