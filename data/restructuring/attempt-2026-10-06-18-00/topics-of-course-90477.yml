analysis:
  mode: all-courses
source_clusters:
- id: 7
  name: Informatica Computer Science (7)
course:
  id: '90477'
  name: Machine Learning Systems For Data Science
topics:
  cnn_architectures: Convolutional neural-network architectures for computer vision,
    including ResNeXt and grouped convolutions, MobileNets, EfficientNet, RegNet,
    AlexNet, VGG, Inception, and ResNet.
  data_science_development_tools: Development and collaboration tools for data-science
    work, including Python IDEs, Jupyter Notebook, Google Colab, Hugging Face, and
    GitLab.
  dictionaries: Dictionary data structures for storing and retrieving key-value associations.
  generative_models: Generative machine-learning models, specifically Generative Adversarial
    Networks (GANs) and autoencoders.
  large_language_models: Generative large language models.
  lstm_networks: Long Short-Term Memory (LSTM) recurrent neural networks.
  machine_learning_basics: Basic machine-learning algorithms and methods used to develop
    intelligent applications.
  neural_networks_deep_learning: Introduction to neural networks and deep learning,
    including their applications.
  nlp_basics: Fundamentals of natural language processing, including introductory
    methods for analyzing and processing text.
  python_control_flow: Conditional statements and iteration constructs in Python.
  python_data_analysis_libraries: Use of Python libraries for data analysis, including
    NumPy, SciPy, Matplotlib, pandas, and scikit-learn.
  python_data_structures: Data structures used in Python programming, as introduced
    alongside Python data types, control flow, functions, and libraries.
  python_ml_frameworks: Use of Python machine-learning frameworks, specifically PyTorch
    and TensorFlow, for defining and applying models.
  python_programming_basics: Introduction to programming in Python.
  python_sequences: Sequences as data structures in Python.
  python_variables_expressions: Variables and expressions in Python programming.
  recurrent_neural_networks: Recurrent neural networks.
  supervised_unsupervised_learning: Supervised and unsupervised machine-learning approaches.
  topic_modeling: Topic-modeling methods for discovering themes in text collections.
  transformers: Transformer architectures and attention-based models, including applications
    to visual and language-related machine-learning tasks.
