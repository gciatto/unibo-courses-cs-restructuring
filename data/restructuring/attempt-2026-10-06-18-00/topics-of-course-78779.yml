analysis:
  mode: all-courses
source_clusters:
- id: 4
  name: Internet Things Systems (4)
course:
  id: '78779'
  name: Mobile Systems M
topics:
  android_activities: Android activities and their role in application development.
  android_architecture_components: Android platform architecture and application components.
  android_intents: Android intents for communication and navigation among application
    components.
  android_power_management: Android power management and wakelocks.
  android_threading_model: Android application threading and execution models.
  bluetooth_networking: Bluetooth protocol stack, topologies, discovery, scatternets,
    multi-hop communication, and Bluetooth programming support.
  cellular_networks_handoff: Cellular-network architecture and handoff procedures,
    including GSM, common and differentiated MSC configurations, and handoff classification.
  edge_fog_computing: Edge and fog computing for sensor-edge-cloud integration, distributed
    control and intelligence, offloading, proactive approaches, mobility prediction,
    and orchestration in mobile and industrial environments.
  enterprise_messaging: Enterprise messaging systems and integration technologies,
    including Java Message Service (JMS), Enterprise Service Bus concepts, and Java
    Business Integration (JBI).
  event_pub_sub: Event management and publish/subscribe systems, including event-router
    topologies, interest propagation, subscription handling, routing decisions, DDS,
    GENA, RSS/Atom, SIP Event Framework, and Web Services Eventing and Notification.
  ieee_80211_networking: IEEE 802.11 networking, including CSMA/CA, hidden and exposed
    terminals, MACA, infrastructure and ad-hoc configurations, municipal meshes, and
    Wi-Fi Direct.
  ios_architecture_components: iOS platform architecture and application components.
  ios_multitasking: The iOS multitasking model and introductory native and Web application
    development.
  iot_architectures_platforms: Basic architectures and platforms for Internet of Things
    systems.
  manet_routing: Mobile Ad Hoc Network concepts, application domains, and reactive,
    proactive, geographic, and hybrid routing, including DSR, AODV, GPSR, LEACH, HEED,
    and REDMAN.
  mobile_application_types: Differences among web, hybrid, and native mobile applications.
  mobile_data_synchronization: Data synchronization in mobile systems using pessimistic
    and optimistic approaches, versioning, change detection, reconciliation, and SyncML.
  mobile_ip: Mobile IP and Hierarchical Mobile IPv6 architectures, protocols, issues,
    split connections, and I-TCP.
  mobile_messaging: Messaging support in mobile systems, including message-exchange
    principles and architectures, CORBA Messaging, XMPP, and related service communication
    mechanisms.
  mobile_middleware_architecture: Mobile middleware definitions, motivations, design
    principles, Internet and Web principles, SOA principles, mobile-computing principles,
    cross-layering, and mobile architectural patterns.
  mobile_positioning: Positioning systems for mobile and ad-hoc networks, including
    lateration, time-difference-of-arrival, angulation, scene analysis, proximity,
    GPS, differential GPS, Active Badge, AHLoS, Bluetooth-based positioning, PlaceLab,
    RADAR, Ekahau, sensor fusion, and JSR-179.
  mobility_handoff_management: Mobility and handoff management, including location
    updates and location searches in mobile systems.
  open_ran: Open RAN (O-RAN) architectures and technologies in telecommunications.
  rest_web_apis: REST principles and design of APIs for Web applications.
  service_discovery: Discovery services, including discovery taxonomies, auto-configuration,
    resource and service access, Jini, SLP, and UPnP.
  sip_ims: Session management using SIP and IP Multimedia Subsystem architectures,
    entities, protocols, monitoring, load balancing, and scalability considerations.
  web_services: Development of back ends based on Web services.
  wireless_access_standards: Overview of IEEE 802.16 and IEEE 802.20 wireless communication
    technologies.
  wireless_networking: Wireless networking and its relationship to Internet communication.
  wireless_propagation_fading: Propagation and fading models used to characterize
    wireless communication systems.
  zigbee: ZigBee features, architecture, and network topologies.
