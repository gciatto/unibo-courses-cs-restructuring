analysis:
  mode: all-courses
source_clusters:
- id: 5
  name: Computing Education Informatics (5)
course:
  id: '91161'
  name: Networks, Security And Data Bases
topics:
  boolean_algebra: Boolean algebra and logical functions.
  cryptographic_security_foundations: Fundamental security issues arising in computer
    systems as addressed through cryptography.
  entity_relationship_model: Entity-Relationship modeling for representing data and
    relationships in database design.
  internet_applications: Prominent Internet applications including email, news, chat,
    and the World Wide Web.
  internetworking_fundamentals: Fundamentals and organization of internetworks, including
    the structure of the Internet and communication across LAN, WAN, and MAN environments.
  modular_arithmetic: Modular arithmetic basics used as mathematical foundations for
    cryptography, including the RSA and Diffie-Hellman key-exchange examples.
  network_layer_architecture: Layered organization of network communication, including
    MAC, transport, and application layers.
  network_protocols: Introduction to protocols used in computer networks.
  public_key_cryptography: Public-key cryptographic algorithms and their use.
  relational_algebra: Basic and derived operators of relational algebra.
  relational_dbms_features: Features and main data-management functionalities of relational
    database management systems.
  relational_model: Structure and principles of the relational data model.
  sql_queries: Databases and the formulation and use of SQL queries.
  web_applications: Basic concepts and use of Web applications, including browsing
    institutional portals.
