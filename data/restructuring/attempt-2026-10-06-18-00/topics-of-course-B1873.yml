analysis:
  mode: all-courses
source_clusters:
- id: 5
  name: Computing Education Informatics (5)
course:
  id: B1873
  name: Machine Learning for Humanities
topics:
  cnn_architectures: Convolutional neural-network architectures for computer vision,
    including ResNeXt and grouped convolutions, MobileNets, EfficientNet, RegNet,
    AlexNet, VGG, Inception, and ResNet.
  computer_vision_overview: Basic definitions of computer vision and an overview of
    its major application domains.
  generative_ai_models: Generative artificial-intelligence models used as statistical
    methods for extracting knowledge from content.
  large_language_models: Generative large language models.
  linear_classification: Linear classification methods introduced through worked examples
    and implemented with NumPy.
  linear_regression: Linear regression as a foundational machine-learning method,
    including implementation with NumPy.
  machine_learning_basics: Basic machine-learning algorithms and methods used to develop
    intelligent applications.
  model_evaluation: Evaluation methods for language and machine-learning models.
  multi_layer_perceptron: Multi-Layer Perceptron models introduced through worked
    examples and implemented with NumPy.
  nlp_basics: Fundamentals of natural language processing, including introductory
    methods for analyzing and processing text.
  python_ml_frameworks: Use of Python machine-learning frameworks, specifically PyTorch
    and TensorFlow, for defining and applying models.
  retrieval_augmented_generation: Retrieval-augmented generation using vector databases.
  transformers: Transformer architectures and attention-based models, including applications
    to visual and language-related machine-learning tasks.
