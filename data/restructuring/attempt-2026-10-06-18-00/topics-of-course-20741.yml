analysis:
  mode: all-courses
source_clusters:
- id: 29
  name: Informatics Informatic Humanities (29)
course:
  id: '20741'
  name: Information Processing Systems
topics:
  clinical_data_archiving: Archiving data from clinical pathology, pathological anatomy,
    and transfusion medicine.
  clinical_information_systems: Laboratory Information Systems and Hospital Information
    Systems used in clinical and hospital settings.
  clinical_workflow_tracking: Tracking workflows in clinical pathology, pathological
    anatomy, and transfusion medicine, including test configuration, instrument connections,
    department configuration, and registry changes.
  communication_flows: Communication flows among healthcare information systems, departments,
    users, and connected instruments.
  computer_networks: Basic computer-network concepts.
  data_organization_basics: Basic organization of data in healthcare information-system
    contexts.
  hub_and_spoke_architecture: Hub-and-spoke system organization for connecting components
    of an information system.
  noncompliance_management: Management of non-compliance caused by patient-entry and
    sampling-date errors, including effects on electronic health records, repeated
    sampling, and delays.
  operating_systems_overview: Overview of the main operating systems referenced in
    the course.
  system_administration_role: The role and responsibilities of a system administrator
    in healthcare information-system environments.
  user_authorization: User authorization within clinical information-system workflows.
