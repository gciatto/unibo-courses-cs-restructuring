analysis:
  mode: all-courses
source_clusters:
- id: 17
  name: Basic Skills Informatics (17)
course:
  id: B9254
  name: Basic IT Skills
topics:
  ai_introduction: Introduction to artificial intelligence, including its history,
    main application fields, and core principles and methods.
  bibliography_management: Building and managing bibliographies using scholarly databases
    and search services such as Google Scholar and Scopus.
  cloud_collaboration_storage: Use of cloud tools for online collaboration and storage.
  collaborative_tools: Collaborative tools used on the Web.
  computer_hardware_architecture: Fundamental organization of computer hardware systems.
  computer_networks: Basic computer-network concepts.
  computer_operation_principles: General principles governing the operation of computers
    and the relationship between hardware and software.
  excel_spreadsheet_basics: Basic use of Microsoft Excel spreadsheets, including creating
    and working with spreadsheet data and using basic functions.
  it_security: Basic IT security issues, including personal-data and file protection,
    viruses, and phishing.
  malicious_software: Malicious software and the security problems caused by malware.
  medical_informatics_software: Introductory use of software tools for medical informatics.
  operating_systems_overview: Overview of the main operating systems referenced in
    the course.
  presentation_creation_formatting: Creating and formatting professional presentations
    with Microsoft PowerPoint.
  productivity_software: Personal productivity tools for word processing, spreadsheets,
    and presentations, including Microsoft Word, Excel, and PowerPoint.
  professional_email: Professional use of email for communication in academic and
    workplace contexts.
  spreadsheet_formulas_functions: Spreadsheet structure, cells, formulas, and useful
    functions for data processing.
  spreadsheet_reporting: Creating spreadsheet tables, charts, and reports using filtering,
    sorting, and conditional formatting.
  word_processing: Editing and formatting professional documents with tables, headers,
    notes, images, PDF/PDF-A export, printing, and archiving.
