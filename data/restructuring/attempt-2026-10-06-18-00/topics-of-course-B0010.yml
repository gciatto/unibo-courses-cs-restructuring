analysis:
  mode: all-courses
source_clusters:
- id: 14
  name: Engineering Software Cultural (14)
course:
  id: B0010
  name: Software Architecture and Platforms
topics:
  architectural_patterns: Advanced architectural patterns for structuring and designing
    software systems.
  architectural_requirements: Architecturally significant requirements used to guide
    software-architecture decisions and evaluation.
  architecture_evolution: Evolution of software architectures through the design,
    implementation, evaluation, documentation, and ongoing adaptation of architectural
    solutions.
  cloud_computing: Introduction to cloud computing in the context of distributed and
    service-oriented programming.
  cloud_infrastructure_models: Data-center, multicloud, and federated-resource infrastructure
    models supporting large distributed and cloud systems, including cloud internals
    and organizational patterns.
  cognitive_architectures: Cognitive architectures considered in the design of autonomous
    and intelligent systems.
  devops_practices: DevOps practices for software development, deployment, and maintenance
    processes.
  digital_twins: Digital-twin concepts in simulation.
  domain_driven_design: Domain-Driven Design concepts and practices, including domains,
    bounded contexts, ubiquitous language, entities, value objects, aggregates, repositories,
    services, factories, domain events, and anti-corruption layers.
  event_driven_architecture: Event-driven computational models and architectures for
    distributed proactive-reactive applications.
  intelligent_agents: Agents as entities that perceive, reason, and act to exhibit
    intelligent behavior.
  internet_of_things: Design and development of applications combining high-level
    software or AI capabilities with connected Internet of Things devices.
  microservices: Microservice architectures, including their principles, technologies,
    and enterprise-software perspective.
  requirements_analysis: Analysis of software requirements as part of planning and
    software-system development.
  rest_web_apis: REST principles and design of APIs for Web applications.
  service_oriented_computing: Service-oriented computing as illustrated through Jolie.
  software_architect_role: The responsibilities and practical role of the software
    architect, including architectural thinking and relating architecture to organizational
    context.
  software_architecture_design: Design of system architecture and definition of the
    logical architecture of a software problem.
  software_architecture_styles: Selection and use of layered, client-server, pipeline,
    microkernel, service-based, event-driven, space-based, and microservice architectural
    styles for software subsystems.
  software_documentation: Documenting a software project and its development.
  software_evaluation: Evaluation of software systems.
  software_lifecycle: Phases and activities in the lifecycle of software systems,
    including planning, requirements analysis, and design.
  software_quality_criteria: Quality criteria for software systems.
  uml_software_modeling: Unified Modeling Language (UML) as a standard language for
    visualizing software-application designs.
  web_of_things: Introductory Web of Things concepts for connecting and interacting
    with Internet of Things devices through Web technologies.
