analysis:
  mode: all-courses
source_clusters:
- id: 19
  name: Cultural Heritage Computer (19)
course:
  id: '48693'
  name: Computer Science for Cultural Heritage
topics:
  cultural_heritage_communication: Principles, strategies, and technologies for communicating
    cultural heritage, with emphasis on digital technologies.
  digital_images: Digital images as technologies for communicating cultural heritage.
  gis_fundamentals: Fundamentals of geographic information systems (GIS).
  gis_web_applications: GIS-based web applications for communicating or presenting
    cultural heritage information.
  photogrammetry: Principles of photogrammetry for three-dimensional reconstruction
    of cultural heritage objects.
  semiotics_signs: Fundamentals of semiotics and the sign as applied to communication.
  structured_light_scanning: Principles of structured-light scanning for three-dimensional
    reconstruction of cultural heritage objects.
  three_d_modeling: Three-dimensional modeling of cultural heritage objects.
  three_d_printing: Three-dimensional printing as a technology for cultural heritage
    reconstruction and communication.
  virtual_restoration: Virtual restoration of cultural heritage objects using digital
    three-dimensional reconstruction and modeling.
  virtual_tours: Virtual tours as a digital technology for communicating cultural
    heritage.
