analysis:
  mode: all-courses
source_clusters:
- id: 20
  name: Language Natural Processing (20)
course:
  id: '72940'
  name: Computational Models And Languages M
topics:
  abstract_machines: Abstract machines used to explain programming-language execution
    and implementation.
  activation_records: Stacks of activation records used to implement procedure calls
    and execution environments.
  chomsky_hierarchy: Chomsky classification of formal grammars and the corresponding
    language classes.
  closures: Closures and their role in programming-language implementation.
  compilers: Compilers as implementation mechanisms for programming languages.
  context_free_grammars: Context-free grammars, including their equivalences and principal
    theorems such as the pumping theorem.
  finite_automata: Finite automata, their equivalence with regular-language formalisms,
    and results such as the pumping lemma.
  function_evaluation_models: Computational models for evaluating functions in programming
    languages.
  functional_programming: Basic concepts and practical use of the functional programming
    paradigm.
  functional_programming_scala: The functional programming paradigm as illustrated
    through Scala.
  grammar_parsing: Algorithms for parsing deterministic context-free grammars.
  interpreters: Interpreters as implementation mechanisms for programming languages.
  iterative_recursive_models: Iterative and recursive computational models, including
    tail-recursion optimization.
  javascript_language: JavaScript as a dynamic functional programming language.
  kotlin_programming: Kotlin programming as a software-development language.
  lambda_calculus: Introductory concepts of the lambda calculus as a model for computation
    and function evaluation.
  language_semantics: The semantics of programming languages as part of their formal
    description.
  language_syntax: The syntax of programming languages as part of their formal description.
  lexical_analysis: Design of lexical analysers for programming languages.
  ll1_parsing: LL(1) grammars and parsing.
  lr_parsing: LR(0), SLR, LR(1), and LALR(1) grammars and parsing methods.
  model_driven_development: Model Driven Software Development using executable requirements
    and problem models, custom metamodels, and model-based development processes.
  parser_generators: Parser-generator tools used to implement syntactic analysis for
    programming languages.
  prototype_object_model: Prototype-based object models in JavaScript.
  recursion: Recursion and recursive procedures in programming languages.
  regular_grammars: Regular grammars, including their equivalences and principal theorems.
  turing_machines: Turing machines as formal models for computation.
