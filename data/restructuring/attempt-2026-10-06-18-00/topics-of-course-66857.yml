analysis:
  mode: all-courses
source_clusters:
- id: 12
  name: Knowledge Engineering Extraction (12)
course:
  id: '66857'
  name: Logic for Computer Science
topics:
  axiomatic_set_theory: ZF axiomatic set theory, relations, functions, quotients,
    cardinality, and Cantor's Theorem.
  bnf: Backus-Naur Form for specifying programming-language syntax.
  first_order_logic: Syntax and semantics of first-order logic, including predicates,
    terms, quantifiers, free and bound variables, alpha-conversion, substitution,
    and natural deduction.
  logical_paradoxes: Paradoxes used to motivate formal logic and illustrate negative
    results in computer science.
  propositional_logic: Syntax, classical and intuitionistic semantics, and natural
    deduction for propositional logic, including soundness, compactness, and completeness
    theorems.
  structural_induction: Structural induction for reasoning about recursively defined
    formal structures.
  structural_recursion: Structural recursion for defining computations over recursively
    defined formal structures.
