analysis:
  mode: all-courses
source_clusters:
- id: 12
  name: Knowledge Engineering Extraction (12)
course:
  id: '85446'
  name: Knowledge Representation and Extraction
topics:
  description_logics: Description logics as computational logic formalisms for representing
    knowledge and supporting automated reasoning.
  generative_ai_models: Generative artificial-intelligence models used as statistical
    methods for extracting knowledge from content.
  graph_based_data_analysis: Graph-based analysis techniques for extracting and interpreting
    knowledge represented as interconnected data.
  knowledge_extraction: Methods for automatically extracting knowledge from text and
    other arbitrary content using rule-based, linguistic, graph-based, and statistical
    approaches.
  knowledge_graphs: Knowledge graphs in the Web of Data, including their conceptual
    foundations and use for representing and integrating knowledge.
  knowledge_representation: Knowledge-representation techniques used in the context
    of automated reasoning.
  linguistic_patterns: Linguistic patterns used as rule-based heuristics for extracting
    knowledge from content.
  linked_open_data: Linked Open Data approaches for integrating, organising, and using
    interconnected Web resources.
  ontology_design_patterns: Reusable ontology design patterns for structuring and
    representing domain knowledge.
  semantic_web_architecture: Architecture, concepts, standards, and languages underlying
    the Semantic Web and Web of Data.
  web_scraping: Using programs to retrieve and process data from websites.
