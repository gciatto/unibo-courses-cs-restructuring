analysis:
  mode: all-courses
source_clusters:
- id: 4
  name: Internet Things Systems (4)
course:
  id: '84401'
  name: Context-Aware Systems
topics:
  context_aware_systems: Definitions, use cases, system typologies, and reference
    architectures for ubiquitous systems that adapt behavior to user, device, and
    environmental context.
  context_aware_task_allocation: Metrics and methods for allocating tasks and workloads
    according to user or device context, including location.
  context_data_management: Models and techniques for representing and managing context
    data in context-aware and ubiquitous systems.
  geospatial_data_management: Importing, creating, and managing geographical data
    with GIS and related computer tools.
  geospatial_databases: Basic database concepts with particular attention to databases
    for geographic data.
  human_activity_recognition: Architectures and algorithms for recognizing human activities
    in activity-aware systems.
  location_based_services: Location-based services and applications that use the current
    position or location context of users and devices.
  location_intelligence: Location intelligence techniques for deriving and using insights
    from spatial and location data.
  mapping_apis: APIs for displaying and working with maps in location-aware applications.
  mobile_edge_computing: Mobile edge-computing architectures, definitions, application
    examples, and workload allocation near mobile users and devices.
  mobile_positioning: Positioning systems for mobile and ad-hoc networks, including
    lateration, time-difference-of-arrival, angulation, scene analysis, proximity,
    GPS, differential GPS, Active Badge, AHLoS, Bluetooth-based positioning, PlaceLab,
    RADAR, Ekahau, sensor fusion, and JSR-179.
  service_migration_mobility: Migration of services in response to user or device
    mobility in distributed and mobile edge systems.
  service_orchestration: Orchestration of cloud services, including practical use
    of OpenStack and Kubernetes.
  spatial_data_privacy: Privacy considerations associated with collecting, managing,
    and using spatial and location data.
  supervised_activity_recognition: Human activity recognition using supervised artificial-intelligence
    techniques.
  virtualization_containers: Virtualization and container technologies, including
    Docker and Kubernetes.
