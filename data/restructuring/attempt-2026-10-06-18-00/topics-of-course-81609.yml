analysis:
  mode: all-courses
source_clusters:
- id: 12
  name: Knowledge Engineering Extraction (12)
course:
  id: '81609'
  name: Languages, Compilers and Computational Models
topics:
  compiler_code_generation: Code-generation techniques used in compiler construction.
  concurrent_finite_state_processes: Finite-state processes that model concurrent
    behavior through synchronization and interleaving.
  context_free_grammars: Context-free grammars, including their equivalences and principal
    theorems such as the pumping theorem.
  finite_automata: Finite automata, their equivalence with regular-language formalisms,
    and results such as the pumping lemma.
  first_order_logic: Syntax and semantics of first-order logic, including predicates,
    terms, quantifiers, free and bound variables, alpha-conversion, substitution,
    and natural deduction.
  labeled_transition_systems: Labeled transition systems for modelling the behavior
    of concurrent and distributed systems.
  lexical_analysis: Design of lexical analysers for programming languages.
  petri_nets: Petri Nets as a visual formalism for modelling concurrent systems.
  propositional_logic: Syntax, classical and intuitionistic semantics, and natural
    deduction for propositional logic, including soundness, compactness, and completeness
    theorems.
  pushdown_automata: Push-down automata and their equivalence with context-free grammars.
  recursive_problems: Recursive or decidable languages and problems, including their
    relationship to computable decision procedures and Turing machines.
  recursively_enumerable_problems: Recursively enumerable languages and problems,
    including their relationship to Turing machines and computation.
  regular_expressions: Regular expressions and their relationship to regular-language
    formalisms.
  static_analysis: Static analysis of program correctness properties and resource
    or asset consumption without executing the program.
  syntax_analysis: Syntactic analysis of programs, including parsing techniques used
    in compiler construction.
  temporal_logics: Temporal logics for specifying and verifying properties of system
    behavior.
  turing_machines: Turing machines as formal models for computation.
