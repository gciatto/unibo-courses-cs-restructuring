analysis:
  mode: all-courses
source_clusters:
- id: 4
  name: Internet Things Systems (4)
course:
  id: B8019
  name: PROGRAMMING THE INTERNET OF THINGS M
topics:
  atlas_iot_architecture: The Atlas IoT architectures and middleware, including Atlas
    1.0 SODA middleware and the Atlas 2.0 IoT Thing Architecture.
  internet_of_things: Design and development of applications combining high-level
    software or AI capabilities with connected Internet of Things devices.
  iot_application_models: Programming and application models for Internet of Things
    systems, including the SODA application model and the use of sensors, actuators,
    complex devices, microservices, and humans in the loop.
  iot_architectures_platforms: Basic architectures and platforms for Internet of Things
    systems.
  iot_device_description_language: The Atlas Device Description Language (IoT-DDL)
    for describing Internet of Things devices.
  iot_devices_sensors: Internet of Things things, including sensors, actuators, and
    complex devices, with examples such as Raspberry Pi and Arduino platforms.
  iot_platforms: Internet of Things platform environments, including Raspberry Pi,
    Arduino, and Mbed OS, as well as other IoT service platforms.
  iot_safety_mechanisms: Safety concerns and safety mechanisms in SODA-based Internet
    of Things applications.
  iot_thing_identification: Identification technologies for Internet of Things entities,
    including QR codes and beacons.
  iot_transaction_model: IoTranx as a transactional model for Internet of Things systems.
  rfid: Radio Frequency Identification (RFID) technology.
  smart_space_case_study: The Gator Tech Smart House as a deployed smart-space and
    assistive environment for graceful aging.
  smart_spaces: Introduction to smart spaces, including their constraints, requirements,
    deployment challenges, and construction.
  soda_architecture: Service-Oriented Device Architecture (SODA) for structuring and
    programming Internet of Things systems.
