analysis:
  mode: all-courses
source_clusters:
- id: 21
  name: Artificial Intelligence Fundamentals (21)
course:
  id: '90147'
  name: Artificial intelligence
topics:
  ai_epistemology_ethics: Philosophical, epistemological, and ethical issues concerning
    artificial intelligence and cognitive science.
  ai_introduction: Introduction to artificial intelligence, including its history,
    main application fields, and core principles and methods.
  ai_planning: Planning problems as a class of artificial-intelligence problem-solving
    tasks.
  cognitive_science: Classical and contemporary cognitive science in relation to artificial
    intelligence.
  human_computer_interaction: Human-computer interaction as an artificial-intelligence
    topic and area of application.
  knowledge_representation_ai: Knowledge representation and representation of concepts
    in artificial-intelligence systems.
  machine_learning_basics: Basic machine-learning algorithms and methods used to develop
    intelligent applications.
  neural_networks: Neural networks as a technique and current technical issue in artificial
    intelligence.
  nlp_basics: Fundamentals of natural language processing, including introductory
    methods for analyzing and processing text.
  problem_solving_ai: Introductory artificial-intelligence problem solving as addressed
    in the course's basic treatment of AI techniques and methods.
  robotics_ai: Introductory treatment of robotics and its implications for artificial
    intelligence, including recent developments.
