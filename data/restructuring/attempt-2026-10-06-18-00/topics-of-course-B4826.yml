analysis:
  mode: all-courses
source_clusters:
- id: 29
  name: Informatics Informatic Humanities (29)
course:
  id: B4826
  name: Informatics for the Humanities
topics:
  algorithm_notations: Representing algorithms using pseudocode and flow diagrams.
  bibliography_management: Building and managing bibliographies using scholarly databases
    and search services such as Google Scholar and Scopus.
  cloud_collaboration_storage: Use of cloud tools for online collaboration and storage.
  collaborative_tools: Collaborative tools used on the Web.
  computer_hardware_architecture: Fundamental organization of computer hardware systems.
  computer_networks: Basic computer-network concepts.
  computer_operation_principles: General principles governing the operation of computers
    and the relationship between hardware and software.
  dictionaries: Dictionary data structures for storing and retrieving key-value associations.
  graphs: Graphs as elementary data structures.
  information_systems_intro: Introductory concepts of information systems as part
    of the foundations of computer science.
  internet_www: The Internet and World Wide Web.
  internetworking_fundamentals: Fundamentals and organization of internetworks, including
    the structure of the Internet and communication across LAN, WAN, and MAN environments.
  latex_overleaf: Document authoring with LaTeX and the Overleaf collaborative writing
    environment.
  lists: List data structures, including their practical implementation and use.
  machine_learning_basics: Basic machine-learning algorithms and methods used to develop
    intelligent applications.
  network_protocols: Introduction to protocols used in computer networks.
  osi_model: ISO OSI layered organization, including network, transport, session,
    presentation, and application layers.
  programming_languages_intro: Introductory concepts of programming languages, including
    what a language is and the role of programming languages.
  python_programming_basics: Introduction to programming in Python.
  python_text_processing: Manipulation and automated processing of text, including
    string operations and creation of text documents in Python.
  queues: Queue data structures in C++.
  regular_expressions: Regular expressions and their relationship to regular-language
    formalisms.
  scripting_languages: Scripting languages as tools for writing and executing small
    programs.
  search_engines: Use of search engines for internet-based research.
  sets: Set data structures for representing unordered collections and related operations.
  stacks: Stack data structures as elementary data structures.
  tree_data_structures: Tree data structures introduced as hierarchical structures
    for organizing information.
  vectors_tensors: Vectors and tensors introduced as data structures for organizing
    data in programs.
  web_markup_languages: Web markup and styling languages including XHTML, XML, HTML5,
    and CSS.
  word_processing: Editing and formatting professional documents with tables, headers,
    notes, images, PDF/PDF-A export, printing, and archiving.
