topics:
  algorithms_programming_basics: Basic principles of algorithms and programming.
  biological_data_types: Types of biological data and suitable data structures for
    representing and analyzing them.
  classification_models: Predictive data analysis using classification models in Python.
  data_analytics_types: Types of data analytics, including diagnostic, predictive,
    and prescriptive analytics, and their enabling techniques.
  data_pipeline_design: Design of a data pipeline from data acquisition through data
    analysis and valorization.
  descriptive_analytics: Descriptive analysis of different data types using Python
    libraries.
  model_analysis: Analysis of predictive models to assess results and identify important
    variables.
  python_control_flow: Conditional statements and iteration constructs in Python.
  python_data_analysis_libraries: Use of Python libraries for data analysis, including
    NumPy, SciPy, Matplotlib, pandas, and scikit-learn.
  python_data_structures: Data structures used in Python programming, as introduced
    alongside Python data types, control flow, functions, and libraries.
  python_data_types: Basic Python data types and their use in solving problems.
  python_functions: Functions in the Python programming language.
  python_programming_basics: Introduction to programming in Python.
  regression_analysis: Predictive data analysis using regression models in Python.
  statistical_tests: Statistical tests used in data analysis to identify important
    variables.
