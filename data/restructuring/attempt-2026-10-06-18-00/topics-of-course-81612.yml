analysis:
  mode: all-courses
source_clusters:
- id: 1
  name: Informatics Principles Foundations (1)
course:
  id: '81612'
  name: Programming and Development paradigms
topics:
  agile_software_development: Agile software-development principles and practices.
  architectural_patterns: Advanced architectural patterns for structuring and designing
    software systems.
  clean_code: Rules and practices for writing clean, effective, and maintainable code.
  continuous_integration: Continuous Integration and delivery practices for integrating,
    validating, and delivering software changes.
  functional_programming: Basic concepts and practical use of the functional programming
    paradigm.
  functional_programming_scala: The functional programming paradigm as illustrated
    through Scala.
  lambda_calculus: Introductory concepts of the lambda calculus as a model for computation
    and function evaluation.
  logical_programming: The logical programming paradigm.
  object_oriented_programming: Introduction to the object-oriented programming paradigm
    in practical lectures.
  prolog_java_integration: Integration of Prolog programs with Java applications.
  prolog_programming: Design and development of simple Prolog programs for implementing
    artificial-intelligence systems and problem solvers.
  refactoring: Refactoring techniques for improving software structure while preserving
    behavior.
  scrum: The role and practices of Scrum in agile software development.
  software_design_patterns: Design patterns used in the design of software systems.
  software_documentation: Documenting a software project and its development.
  software_methodologies: Overview of software-development methodologies, including
    waterfall and agile approaches.
  software_testing: Testing activities for software systems.
  test_driven_development: Test-driven development practices for designing and implementing
    software through iterative test-first development.
  types_and_type_checking: Types and type-checking mechanisms in programming languages.
  unit_testing: Unit testing of software components as part of software testing.
