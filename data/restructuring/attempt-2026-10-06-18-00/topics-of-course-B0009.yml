analysis:
  mode: all-courses
source_clusters:
- id: 14
  name: Engineering Software Cultural (14)
course:
  id: B0009
  name: Advanced Software Modelling and Design
topics:
  aggregate_computing: Aggregate-computing and macro-programming patterns for programming
    networks of devices and enabling self-organisation.
  ai_code_generation: Use of AI-generated code technologies within software-development
    environments and model-driven development workflows.
  ai_program_synthesis: AI-based program synthesis, including the use of large language
    models for software testing and program completion.
  approximate_model_checking: Approximate model-checking techniques for validating
    complex or probabilistic systems.
  behavior_driven_development: Behavior-Driven Development (BDD) and its use in specifying
    and testing software behavior.
  chemical_oriented_models: Chemical-oriented models for representing and modelling
    complex software systems.
  code_coverage: Code-coverage measurement as a software-testing and quality-assurance
    practice.
  continuous_time_markov_chains: Continuous-time Markov chains for modelling probabilistic
    state transitions over continuous time.
  deep_reinforcement_learning: Deep reinforcement-learning methods for learning and
    decision processes.
  discrete_time_markov_chains: Discrete-time Markov chains for modelling probabilistic
    state transitions over discrete time steps.
  distributed_cps_simulation: Simulation of distributed cyber-physical systems.
  effect_composition: Compositional approaches to programming with side effects.
  functional_programming_scala: The functional programming paradigm as illustrated
    through Scala.
  integration_acceptance_testing: Integration testing of collaborating software components
    and acceptance testing against system requirements.
  large_language_models: Generative large language models.
  markov_decision_processes: Markov decision processes for modelling sequential decisions
    under uncertainty.
  model_checking: Pragmatic verification of concurrent-program properties using model
    checking, including Java PathFinder in laboratory work.
  monads: The origin and classical uses of monads for partial computations, state,
    and input/output.
  multi_agent_reinforcement_learning: Multi-Agent Reinforcement Learning in systems
    of interacting learning agents.
  nondeterministic_systems: Modelling software systems and computations featuring
    nondeterministic behavior.
  petri_nets: Petri Nets as a visual formalism for modelling concurrent systems.
  probabilistic_model_checking: Model-checking techniques for systems with probabilistic
    behavior.
  property_based_testing: Property-based code testing using QuickCheck.
  reinforcement_learning: Reinforcement-learning methods.
  self_organizing_systems: Self-organization in multi-agent and other complex systems.
  software_design_patterns: Design patterns used in the design of software systems.
  test_driven_development: Test-driven development practices for designing and implementing
    software through iterative test-first development.
