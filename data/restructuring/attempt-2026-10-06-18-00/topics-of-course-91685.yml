analysis:
  mode: all-courses
source_clusters:
- id: 5
  name: Computing Education Informatics (5)
course:
  id: '91685'
  name: History of Informatics and Computing Systems
topics:
  computer_architecture_history: Historical evolution of computer architectures from
    early stored-program systems through mainframes, minicomputers, microprocessors,
    and personal computers.
  computer_history: Historical development of computers as introduced alongside computer
    architecture.
  early_electronic_computers: Prehistory and development of the first general-purpose
    programmable electronic computers before and around 1945.
  language_evolution: The evolution of programming languages from assembly languages
    to higher-level languages.
  mainframe_computing_history: The development of mainframe computers in the 1950s
    and their role in establishing computing as a discipline.
  minicomputers_microprocessors: The historical development of minicomputers and microprocessors
    as stages in the evolution of computing systems.
  operating_system_history: Historical evolution of operating systems from early computing
    systems through the early 1980s, considered in relation to architectures and programming
    languages.
  personal_computing_history: The emergence and development of personal computers
    as a major stage in computing history.
  stored_program_computing: The stored-program concept and the ideas that led to general-purpose
    programmable electronic computers.
