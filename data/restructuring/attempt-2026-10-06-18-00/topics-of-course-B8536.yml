analysis:
  mode: all-courses
source_clusters:
- id: 20
  name: Language Natural Processing (20)
course:
  id: B8536
  name: 'Computer-Aided Human Translation: CAT, MT and AI'
topics:
  ai_assisted_translation: Generative-artificial-intelligence functionalities used
    to support translation and revision workflows.
  cat_mt_integration: Integration of computer-assisted translation tools with machine-translation
    systems and related generative translation functions.
  cat_tools: Use of proprietary and free computer-assisted translation tools, including
    Trados Studio, MemoQ, and MateCat.
  computer_assisted_translation: Theoretical foundations and role of computer-assisted
    translation in professional translation workflows.
  machine_translation: Machine-translation systems and their use as part of AI-enhanced
    translation workflows.
  post_editing: Light, full, and other post-editing interventions for improving machine-translation
    and generative-AI output according to translation-context requirements.
  translation_file_formats: Translation workflows involving the main file formats
    handled by computer-assisted translation tools.
  translation_memories: Creation and management of translation memories in computer-assisted
    translation workflows.
  translation_project_management: Setting up and managing complex translation projects
    involving multiple professionals through computer-assisted translation tools.
  translation_prompting: Basic prompting techniques used within AI-based translation
    tools to optimize machine-translated output and support post-editing.
  translation_quality_assurance: Quality-assurance checks for translated target texts
    in computer-assisted translation workflows.
