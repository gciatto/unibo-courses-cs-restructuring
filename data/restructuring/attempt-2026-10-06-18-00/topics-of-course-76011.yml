analysis:
  mode: all-courses
source_clusters:
- id: 19
  name: Cultural Heritage Computer (19)
course:
  id: '76011'
  name: Multimedia Technologies in Archaelogy
topics:
  archaeological_digital_surveying: Digital documentation and surveying of archaeological
    sites using total stations, laser scanners, GNSS receivers, and related techniques,
    including challenges posed by site extent and preservation conditions.
  archaeological_virtual_reconstruction: Evidence-based methodology for reliable virtual
    reconstruction of archaeological objects or contexts, including information collection
    and analysis, 2D representation, 3D model development, and planning public presentation.
  archaeological_web_information_systems: Server-web information systems for archiving
    and multimedia representation of archaeological data.
  cultural_heritage_communication: Principles, strategies, and technologies for communicating
    cultural heritage, with emphasis on digital technologies.
  digital_graphics: Introductory concepts of digital graphics as part of digital information
    processing.
  file_formats: File formats and their role in storing, exchanging, and archiving
    digital documents and data.
  information_representation: Representation of information as covered in the course's
    information-representation material.
  multimedia_information: Representation of multimedia information as covered in the
    course's multimedia-information material.
  photogrammetry: Principles of photogrammetry for three-dimensional reconstruction
    of cultural heritage objects.
  point_cloud_processing: Processing workflows for developing three-dimensional models
    from point clouds acquired by laser scanning and image-based photogrammetry.
  three_d_modeling: Three-dimensional modeling of cultural heritage objects.
  vector_graphics: Vector graphics concepts including graphic primitives, drawing
    and modification tools, layers, line styles and weights, vector and raster formats,
    and graphic-layout preparation.
  virtual_restoration: Virtual restoration of cultural heritage objects using digital
    three-dimensional reconstruction and modeling.
