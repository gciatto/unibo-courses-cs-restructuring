analysis:
  mode: all-courses
source_clusters:
- id: 1
  name: Informatics Principles Foundations (1)
course:
  id: 09730-A
  name: Principles of Informatics
topics:
  algorithmic_problem_solving: Algorithmic approaches to solving problems with computers
    using the imperative programming paradigm.
  algorithms_programming_basics: Basic principles of algorithms and programming.
  binary_encoding: Binary encoding of information.
  boolean_algebra: Boolean algebra and logical functions.
  computer_hardware_architecture: Fundamental organization of computer hardware systems.
  fundamental_data_structures: Introductory fundamental data structures considered
    alongside algorithms and programming.
  logic_gates_circuits: Boolean logic gates and circuit diagrams.
  matlab_data_structures: Data structures supported and used in the MATLAB/Octave
    language.
  matlab_functions: Functions in the MATLAB/Octave language.
  matlab_fundamental_constructs: Fundamental programming constructs in the MATLAB/Octave
    language.
  matlab_graphics: Graphic functions in the MATLAB/Octave language.
  matlab_input_output: Input and output operations in the MATLAB/Octave language.
  matlab_variable_scope: Visibility and scope of variables in the MATLAB/Octave language.
  matlab_vector_programming: Vector programming elements in the MATLAB/Octave language.
  matlab_vectors_matrices: Operations on vectors and matrices in the MATLAB/Octave
    language.
  numeric_representation: Representation and computation with numeric formats, including
    binary notation, two's-complement representation, and floating-point numbers.
  von_neumann_architecture: The organization and operating principles of the Von Neumann
    computer architecture.
