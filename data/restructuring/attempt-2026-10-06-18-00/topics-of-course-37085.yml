analysis:
  mode: all-courses
source_clusters:
- id: 24
  name: Systems Distributed Models (24)
course:
  id: '37085'
  name: Principles, Models and Applications for Distributed Systems M
topics:
  cloud_computing: Introduction to cloud computing in the context of distributed and
    service-oriented programming.
  distributed_communication: Communication mechanisms and concepts for distributed
    systems.
  distributed_systems: Fundamental concepts of distributed systems.
  dns: DNS and advanced name systems used in distributed environments.
  http_protocols: HTTP protocols used in distributed-system and network communication.
  netconf: NETCONF for configuring and managing network devices and services.
  network_function_virtualization: Network Function Virtualization (NFV) for implementing
    network functions using distributed and virtualized resources.
  network_sockets: Sockets and related C/UNIX and Java APIs for implementing TCP/IP
    client/server interactions.
  open_ran: Open RAN (O-RAN) architectures and technologies in telecommunications.
  processes_threads: Operating-system processes and threads, including their organization
    and execution.
  python_programming_basics: Introduction to programming in Python.
  rpc: Distributed programming using remote-procedure-call-like models, including
    Java RMI.
  scalability_distributed_systems: Scalability considerations in distributed systems.
  service_orchestration: Orchestration of cloud services, including practical use
    of OpenStack and Kubernetes.
  software_defined_networking: Software-Defined Networking (SDN) concepts and technologies.
  virtualization_containers: Virtualization and container technologies, including
    Docker and Kubernetes.
