analysis:
  mode: all-courses
source_clusters:
- id: 5
  name: Computing Education Informatics (5)
course:
  id: '90749'
  name: Computing Education
topics:
  computational_thinking: Computational thinking as an approach to formulating and
    solving problems with computers.
  cs_education_assessment: Evaluation and assessment methodologies for computer-science
    learning, with particular attention to programming.
  cs_education_big_ideas: Big Ideas of Computer Science Education as organizing concepts
    for teaching and learning computer science.
  cs_education_curricula: Computer science in international and Italian school curricula
    and textbooks, including formulation and management of school study paths.
  cs_education_learning_theories: Pedagogical and learning theories applied to computer
    science education, with particular attention to constructivism and constructionism.
  cs_education_teaching_methodologies: Teaching methodologies for Computer Science,
    including dramatization, top-down and bottom-up approaches, and the use of physical-computing
    tools.
  cs_history_epistemology_ethics: Historical, epistemological, and ethical aspects
    of Computer Science and their implications for teaching the subject.
  cs_programming_education: Teaching programming, algorithms, and data structures,
    including programming-language choice and common misconceptions and difficulties
    in learning programming.
  educational_debugging: Using debugging of other people's code as a computer-science
    teaching and learning activity.
  educational_software_licenses: Free Software and proprietary software licenses and
    their implications for computer-science education.
  making_based_cs_education: Design and development of computer-science teaching methods
    based on Making.
  program_execution_visualization: Teaching program execution by displaying machine
    state while a program runs.
  unplugged_cs_education: Unplugged approaches for teaching computer science without
    relying on computers or conventional programming environments.
