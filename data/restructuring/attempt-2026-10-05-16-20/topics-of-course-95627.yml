analysis:
  mode: all-courses
source_clusters:
- id: 14
  name: Engineering Software Cultural (14)
course:
  id: '95627'
  name: Software Engineering
topics:
  agile_software_development: Agile software development practices and approaches.
  cloud_computing: Cloud computing for Big Data, including comparisons between on-premises
    and cloud clusters, cloud technology stacks, and deployment of case studies on
    cloud providers.
  collaborative_software_development: Use of collaborative tools to support software
    development.
  continuous_integration: Continuous Integration practices and tools for integrating
    and validating software changes.
  design_patterns: Design patterns used in software design.
  devops_practices: DevOps practices and tools supporting the development, deployment,
    and maintenance of software systems.
  distributed_systems: Concepts and organization of distributed systems.
  domain_driven_design: Domain-Driven Design concepts and building blocks, including
    domains, bounded contexts, models, ubiquitous language, entities, value objects,
    aggregates, repositories, services, factories, domain events, and anti-corruption
    layers.
  http_web_protocols: Web communication protocols and identifiers, including HTTP,
    URIs, WebSocket, HTTP/2, HTTP/3, and QUIC.
  intelligent_systems: Definitions, problem types, and application areas of intelligent
    systems.
  json_data_format: JSON as a data representation format used in basic Web technologies.
  markup_languages: Markup and presentation languages for Web-oriented digital resources,
    including XHTML, XML, HTML5, and CSS.
  microservices_architecture: Microservices as a distributed software-architecture
    style and as an architectural choice for subsystems.
  multi_agent_systems: Conceptual and technical foundations of multi-agent systems
    for modeling and engineering complex computational and socio-technical systems.
  object_mutability: Immutable and mutable objects in Python.
  object_oriented_programming: Fundamental concepts and features of object-oriented
    programming.
  programming_in_python: Programming in Python, including names, visibility, functions,
    objects, classes, and problem-solving applications.
  python_packaging: Building, configuring, packaging, and distributing Python projects
    using tools such as pip, virtual environments, Poetry, project metadata, dependency
    declarations, and package repositories.
  service_oriented_computing: Service-oriented computing, including Jolie.
  software_architecture: Design of a software system's architecture and definition
    of a logical architecture for the problem domain.
  software_build_automation: Build automation tools and practices used in software
    development.
  software_design_principles: Design principles concerning rigidity, fragility, and
    immobility in software.
  software_engineering: Introduction to software engineering and the analysis, design,
    development, and testing of software systems.
  software_license: Software licensing concepts and practices, including copyright,
    copyleft, proprietary and free software, ownership versus licensing, and common
    licenses such as MIT, Apache, and GPL.
  software_lifecycle: Phases and activities in the lifecycle of software systems,
    including planning, requirements analysis, design, production, testing, certification,
    and maintenance.
  software_quality_assurance: Software quality criteria, evaluation, and certification.
  software_testing: Testing activities for software systems.
  software_versioning: Software versioning schemes, semantic versioning, API-stability
    considerations, and conventional commits for managing releases and version histories.
  static_analysis: Static analysis of programs, including checking correctness properties
    and analyzing resource and asset consumption without executing the code.
  test_driven_development: Test-driven development as an iterative software-development
    approach involving automated tests and implementation.
  uml_modeling: Modeling software systems with UML use case, class, object, sequence,
    collaboration, state, activity, component, and deployment diagrams.
  version_control_systems: Version control systems used in software development.
  web_api_design: Design of Web application interfaces and APIs, including REST principles.
  web_services: Web services as back-end technologies for Web applications.
