analysis:
  mode: all-courses
source_clusters:
- id: 4
  name: Internet Things Systems (4)
course:
  id: '81683'
  name: Internet of Things
topics:
  cloud_computing: Cloud computing for Big Data, including comparisons between on-premises
    and cloud clusters, cloud technology stacks, and deployment of case studies on
    cloud providers.
  coap_mqtt_protocols: Use of CoAP and MQTT protocols for message-based interactions
    among distributed software components and IoT devices.
  data_pipeline_design: Design of data-pipeline processes from data acquisition through
    data analysis and valorization.
  data_visualization: Visualization and graphical representation of datasets and their
    properties, including frequency tables and statistical graphics.
  edge_fog_computing: Edge and fog computing for integrating sensor, edge, and cloud
    resources, including distributed control and intelligence, offloading, proactive
    approaches, mobility prediction, ETSI Mobile Edge Computing, orchestration, ETSI
    MANO, and deployment in 5G environments.
  electronics_fundamentals: Fundamentals of passive-component electronics, including
    current, potential, power, energy, Kirchhoff's laws, resistors, capacitors, inductors,
    transformers, diodes, transistors, and digital electronics.
  embedded_systems: Embedded-system hardware and software, including microcontrollers,
    systems-on-chip, sensors, actuators, electronics, and programming models such
    as super-loops, tasks, and real-time operating-system-based architectures.
  iot_network_routing: Network architectures and routing mechanisms for Internet-of-Things
    networks, including 6LoWPAN and RPL.
  iot_systems: Internet of Things systems combining high-level application aspects
    with low-level devices in virtual and real environments.
  machine_learning: Fundamental machine-learning technologies and algorithms for developing
    intelligent applications.
  predictive_analytics: Predictive data analysis using statistical and machine-learning
    models.
  programming_in_cpp: Introduction to programming and creating programs using C++.
  programming_in_python: Programming in Python, including names, visibility, functions,
    objects, classes, and problem-solving applications.
  semantic_web: Architecture, concepts, standards, languages, and technologies of
    the Semantic Web.
  serial_communication_protocols: Serial communication protocols for interfacing embedded
    devices and peripherals, including OneWire, I2C, SPI, and UART.
  statistical_data_analysis: Statistical analysis of datasets, including descriptive
    analysis and statistical tests used to understand data and assess models.
  stream_processing: Introductory high-performance online stream processing of big
    data over clustered distributed systems.
  time_series_data_management: Storage and processing of sensor time-series data using
    time-series databases such as InfluxDB.
  web_of_things: Introductory Web of Things concepts for connecting and integrating
    embedded and Internet-of-Things devices with Web technologies.
  wireless_communication_systems: Wireless communication systems, including propagation
    and fading models and an overview of wireless technologies such as IEEE 802.11,
    IEEE 802.16, IEEE 802.20, cellular networks, Bluetooth, and ZigBee.
  wireless_networking: Wireless networking and its relationship to the Internet.
