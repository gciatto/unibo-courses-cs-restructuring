analysis:
  mode: all-courses
source_clusters:
- id: 17
  name: Basic Skills Informatics (17)
course:
  id: '91266'
  name: Machine Learning for Computer Vision
topics:
  attention_mechanisms: Attention mechanisms used in computer-vision models, including
    their relationship to Transformer architectures.
  convolutional_neural_networks: Convolutional neural networks (CNNs) as a deep-learning
    architecture.
  depth_estimation: Monocular depth estimation from images, including photometric
    loss and Monodepth.
  ensemble_learning: Ensemble-learning methods, including bagging, boosting, random
    forests, and related ensemble models, for predictive and machine-learning applications.
  generative_models: Generative deep-learning models and techniques, including adversarial
    and diffusion models.
  image_classification: Image classification using linear classifiers and fully connected
    neural networks.
  image_representation: Image representations based on Bag of Visual Words, representation
    learning, convolutional layers, pooling, and batch normalization.
  image_segmentation: Techniques for segmenting objects or regions from images.
  machine_learning: Fundamental machine-learning technologies and algorithms for developing
    intelligent applications.
  metric_learning: Deep metric and representation learning for applications such as
    face recognition and identification, including contrastive and triplet losses,
    ArcFace, and NT-Xent loss.
  model_evaluation: Evaluation methods for generative and machine-learning models.
  neural_networks_deep_learning: Neural networks and deep-learning techniques, including
    their use in machine-learning applications.
  object_detection: Techniques for detecting objects in images and videos.
  vision_language_models: Vision-language models for multimodal language and vision
    applications.
  vision_transformers: Vision Transformer architectures for image classification and
    other computer-vision tasks.
