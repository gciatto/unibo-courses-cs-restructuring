analysis:
  mode: all-courses
source_clusters:
- id: 2
  name: Big Data Cloud (2)
course:
  id: '98671'
  name: Business Analytics
topics:
  business_intelligence: Business intelligence in corporate information systems, including
    the role of BI and the BI pyramid.
  data_models: Structured, semi-structured, and unstructured data models.
  data_pipeline_design: Design of data-pipeline processes from data acquisition through
    data analysis and valorization.
  data_preprocessing: Preparation of data for mining and machine-learning analysis,
    including data acquisition, preprocessing, and transformation.
  data_visualization: Visualization and graphical representation of datasets and their
    properties, including frequency tables and statistical graphics.
  database_administration: Administration of relational database management systems.
  database_architectures: Database management system architectures, including three-tier
    and client-server architectures, with introductory coverage of distributed and
    cloud database systems.
  descriptive_analytics: Descriptive analysis of data of various types using Python
    libraries.
  predictive_analytics: Predictive data analysis using statistical and machine-learning
    models.
  prescriptive_analytics: Analytics methods that recommend actions or decisions based
    on data and analytical results.
  programming_in_r: Programming in R, including structured-programming constructs,
    procedures and functions, implementation of algorithms, and program development.
  report_sharing: Techniques for sharing and distributing Business Intelligence and
    Business Analytics reports.
