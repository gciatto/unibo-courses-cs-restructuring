  semantic_textual_similarity: Semantic textual similarity as a downstream natural-language-processing
    task.
  semantic_universals: Computational and empirical investigation of recurring semantic
    patterns across languages, modalities, cultures, practices, and neurocognitive
    systems.
  semantic_web: Architecture, concepts, standards, languages, and technologies of
    the Semantic Web.
  semiconductor_manufacturing: Computer-chip production as covered in the context
    of digital logic, computer components, and modern computer architectures.
  semiotics: Semiotic approaches to signs, interpretation, and meaning-making across
    modalities, cultures, and practices.
  sensor_data_stream_processing: Processing of real-time data streams from sensors
    toward actuators in cyber-physical-system applications.
  sensor_fundamentals: Fundamentals of electronic sensors, including sensing, information
    classification, interfaces, raw data, signal interpretation, and sensor-system
    applications.
  sensor_measurements: Sensor measurement concepts including characterization, operating
    modes, DC and AC measurements, resolution, precision, accuracy, digits, full scale,
    estimation, and measurement errors.
  sensor_modeling: Ideal and non-ideal sensor models, including black-box interfaces,
    quasi-static functions, sensitivity, temporal and spatial quantization, uncertainty,
    and propagation of errors.
  sensor_networks: Embedded sensor networks and their communication, including I2C
    and SPI interfaces and an overview of wireless sensor communications and networks.
  sensor_noise: Sensor noise and signal-quality concepts, including random and systematic
    noise, power spectral distributions, minimum detectable signal, signal-to-noise
    ratio, dynamic range, and bandwidth effects.
  sensor_system_design: Design of sensor systems, including acquisition chains, gain
    plots, feedback sensor designs, trade-offs, and implementation considerations.
  sentiment_analysis: Sentiment analysis as a supervised natural-language-processing
    task.
  seo: Search-engine optimization as a Web and communication technology.
  sequence_alignment: Pairwise local and global sequence alignment, multiple sequence
    alignment, and algorithmic approaches to sequence alignment.
  sequence_assembly: Sequence-assembly methods using overlap graphs and greedy algorithms
    for shortest common supersequence problems.
  serial_communication_protocols: Serial communication protocols for interfacing embedded
    devices and peripherals, including OneWire, I2C, SPI, and UART.
  server_side_application_development: Development of a server-side application.
  serverless_computing: Function-as-a-Service models and supporting frameworks as
    an evolution toward scalable asynchronous enterprise-server architectures.
  service_choreography: Choreographies for modeling interactions between business
    processes and services and among different services.
  service_design: Service design processes and deliverables, including service concepts,
    user journeys, ecosystem maps, and service blueprints.
  service_discovery: Discovery services for locating and accessing resources and services,
    including auto-configuration, Jini, the Service Location Protocol, and UPnP.
  service_meshes: Service-mesh technologies, including Linkerd, for supporting communication
    and management among microservices.
  service_migration: Migration of services in response to user or device mobility
    in distributed and mobile edge environments.
  service_monitoring: Operational monitoring of digital services, including performance
    monitoring and identification of warning signs.
  service_oriented_computing: Service-oriented computing, including Jolie.
  service_performance_testing: Benchmarking, performance testing, and stress testing
    for evaluating digital-service performance and capacity.
  session_management: Session management in converged 4G and IMS networks, including
    SIP, IMS architecture and functional entities, protocol examples, monitoring,
    load-balancing, scalability, and related limitations.
  shared_memory_architectures: Shared-memory multiprocessor organization, including
    Uniform Memory Access (UMA) and an introduction to Non-Uniform Memory Access (NUMA)
    multicore architectures.
  shared_memory_programming: Programming shared-memory architectures using C and OpenMP.
  shell_scripting: Shell use and shell scripting.
  signal_processing: Processing and analysis of sensor signals, including random and
    ergodic processes, power, correlations, spectral distributions, bandwidth, and
    signal acquisition.
  simd_programming: SIMD programming using compiler intrinsics and compiler auto-vectorization.
  similarity_measures: Measurement of similarities and dissimilarities between data
    items for data-mining analysis.
  simulation: Simulation methods used to analyze and solve industrial use cases.
  simulation_data_analysis: Analysis of input and output data from simulation models.
  simulation_experiment_design: Design of experiments for simulation studies.
  simulation_machine_learning: Use of machine learning in simulation.
  simulation_tools: Design and implementation of simulators and simulation tools.
  simulation_verification_validation: Verification, validation, and testing of simulation
    models.
  single_sign_on: Single sign-on authentication models and related protocols or systems,
    including Kerberos.
  skyline_queries: Skyline query processing based on domination and scoring relationships,
    including index-based BBS and non-index algorithms such as NL, BNL, SFS, and SaLSa.
  smart_contracts: Smart contracts and the development and deployment of simple contracts
    on a blockchain.
  smart_homes: Smart homes as complex digital-health platforms integrating devices,
    solutions, sensing, and services for personal health purposes.
  smart_sensors: Smart sensors and sensor operating principles for collecting data
    in Internet-of-Things and agricultural applications.
  smart_society: Cybersecurity-related risks and countermeasures associated with smart-society
    environments.
  smart_spaces: Smart spaces as instrumented environments with associated constraints,
    requirements, deployment challenges, and assistive-environment applications.
  soap_wsdl: SOAP and Web Services Description Language (WSDL) technologies for implementing
    web services.
  social_engineering: Social-engineering threats and the role of human factors in
    cybersecurity.
  social_implications_it: Social implications of information technology.
  social_networks: Social networks as part of Web 1.0 and Web 2.0 environments.
  software_architecture: Design of a software system's architecture and definition
    of a logical architecture for the problem domain.
  software_build_automation: Build automation tools and practices used in software
    development.
  software_defined_networking: Software-Defined Networking (SDN) technologies and
    their use in telecommunications systems.
  software_design_principles: Design principles concerning rigidity, fragility, and
    immobility in software.
  software_engineering: Introduction to software engineering and the analysis, design,
    development, and testing of software systems.
  software_levels: Levels of computer software as part of the organization of computer
    systems.
  software_license: Software licensing concepts and practices, including copyright,
    copyleft, proprietary and free software, ownership versus licensing, and common
    licenses such as MIT, Apache, and GPL.
  software_licensing: Free and proprietary software licenses and their implications
    for Computer Science education.
  software_lifecycle: Phases and activities in the lifecycle of software systems,
    including planning, requirements analysis, design, production, testing, certification,
    and maintenance.
  software_localization: Localization of software and IT products, including the distinctive
    features, conventions, and potential pitfalls of adapting software content.
  software_maintenance: Maintenance of software systems.
  software_performance_engineering: Bug hunting and performance engineering techniques
    for improving software behavior and performance.
  software_prototyping: Prototyping as a software engineering activity.
  software_quality_assurance: Software quality criteria, evaluation, and certification.
  software_quality_models: Quality models involving the application of machine learning
    and artificial intelligence in software development and system development.
  software_testing: Testing activities for software systems.
  software_transactional_memory: Concurrent programming using Software Transactional
    Memory as a case study.
  software_versioning: Software versioning schemes, semantic versioning, API-stability
    considerations, and conventional commits for managing releases and version histories.
  sorting_algorithms: Algorithms for sorting data.
  spark_computing: Apache Spark for Big Data processing, including its architecture,
    data structures, partitioning, shuffling, computation optimization, and Spark
    SQL.
  sparql: Querying RDF and Knowledge Graphs with SPARQL, including queries over the
    DBPedia Knowledge Graph.
  spatial_data_privacy: Privacy issues associated with the collection, management,
    and use of spatial and location data.
  spatial_databases: Management and storage of spatial data using spatial database
    management systems.
  specialized_corpora: Construction and use of electronic specialized corpora for
    terminology research and extraction.
  speech_processing: Basic speech-processing concepts covered as an element of natural-language
    processing.
  speech_recognition: Use of speech-recognition software to convert spoken or voice
    input into written text, including speaker-independent and speaker-dependent tools.
  spreadsheet_automation: Automation of environmental-data spreadsheet workflows with
    VBA macros, including macro generation, insertion, verification, debugging, and
    best practices.
  spreadsheet_data_processing: Organizing, cleaning, and processing data in spreadsheets,
    including the use of Excel for data-processing tasks.
  sql_xml_xquery: SQL/XML and XQuery, including their basic constructors and use with
    semi-structured and unstructured data.
  stateful_web_interactions: State management for Web applications, including personalization,
    sessions, and client-server conversations.
  static_analysis: Static analysis of programs, including checking correctness properties
    and analyzing resource and asset consumption without executing the code.
  statistical_data_analysis: Statistical analysis of datasets, including descriptive
    analysis and statistical tests used to understand data and assess models.
  statistical_inference: Inferential statistical methods, including confidence intervals,
    precision and bias, and the practical application of statistical tests.
  stereo_vision: Geometry of stereopsis and stereo image calibration.
  stream_processing: Introductory high-performance online stream processing of big
    data over clustered distributed systems.
  string_matching: Exact and approximate string-matching techniques.
  string_processing: String manipulation and string functions.
  structural_induction_recursion: Structural induction and structural recursion.
  structured_light_scanning: Principles of structured-light scanning for three-dimensional
    reconstruction of cultural-heritage objects.
  study_designs: Overview of experimental and observational study designs.
  subtractive_manufacturing: Subtractive methods for physically producing objects,
    including CNC mills and laser cutters.
  suffix_data_structures: Suffix trees, suffix tries, and suffix arrays for string
    processing.
  supervised_unsupervised_learning: Supervised and unsupervised machine-learning approaches.
  sustainability_esg: Sustainability and Environmental, Social, and Governance (ESG)
    perspectives in data-science platforms and business-performance monitoring.
  swarm_intelligence: Swarm-intelligence optimization methods, including ant colony
    optimization, bee colony optimization, and particle swarm optimization.
  swarm_robotics: Robotic systems involving swarm behavior and coordination among
    multiple robots.
  syllogistic_logic: Syllogistic logic and its formalisms as covered in the course.
  symbol_tables: Symbol tables used during semantic analysis of programs.
  symbolic_model: The symbolic model for representing and analyzing cryptographic
    protocols.
  system_administration: Operating-system system administration procedures.
  system_administrator_role: The role of the system administrator in the computerization
    of healthcare-related laboratory and hospital activities.
  system_calls: System calls used by programs to request operating-system services.
  system_daemons: Standard system daemons used to automate administration tasks, including
    scheduled execution and logging.
  system_integration: Integration of heterogeneous operating systems, services, APIs,
    and applications, including interactions between Windows and Linux systems and
    supporting integration tools and methods.
  system_monitoring: Command-line monitoring of system processes and resource usage.
  system_programming: System programming practices using UNIX tools and C or Java
    environments, with attention to resource usage, correctness, protocols, and user
    interfaces.
  systematic_literature_review: Systematic literature review as a methodology for
    scientific surveys of intelligent and autonomous systems.
  systems_models_classification: Classification of systems and models for simulation
    analysis.
  tangible_interaction: Tangible interaction paradigms and related approaches to designing
    interactive systems.
  tcp_ip_protocols: TCP/IP protocol-suite connections and common synchronous and asynchronous
    applications such as remote terminals, file transfer, mail, and news.
  teamwork_innovation_projects: Teamwork and collaborative problem solving in digital
    innovation projects.
  technical_metadata: The function of technical metadata in the management and documentation
    of digitised images and digital collections.
  technology_assessment: Analysis and diagnosis of company technologies, together
    with an overview of relevant technologies, architectures, and procedures.
  telemedicine: Introduction to telemedicine as an emerging healthcare application
    of information technology.
  temporal_logic: Temporal logics for specifying and verifying properties of system
    behavior.
  terminology_extraction: Detection and extraction of terminology using traditional
    methods, AI-supported methods, and tools such as AntConc.
  terminology_management: Creation and management of glossaries and terminology databases
    using terminographic tools such as MultiTerm, Interplex, and InterpretBank.
  test_driven_development: Test-driven development as an iterative software-development
    approach involving automated tests and implementation.
  text_classification: Supervised classification of text for tasks such as topic identification.
  text_hypertext_management: Management of texts and hypertexts using simple application
    programs.
  text_mining: Text representation, retrieval, classification, opinion mining, summarization,
    and information extraction, with practical text-mining case studies.
  text_summarization: Text summarization as a practical text-mining and language-processing
    application.
  text_tokenization: Tokenisation of natural-language text as a core natural-language-processing
    task.
  text_vectorization: Vectorisation of words and documents for representing text in
    computational models, including vector-space representations.
  theory_of_mind: Theory of mind as a phenomenon for investigating the representation
    and interpretation of cognitive perspectives and mental states.
  three_dimensional_modeling: Three-dimensional modeling using software tools, including
    applications to cultural-heritage objects and fashion design.
  three_dimensional_printing: Three-dimensional printing principles and use in digitally
    enabled physical-object prototyping, including its role in cultural-heritage communication
    and object reconstruction.
  time_series_analysis: Time-series analysis as a method used in the computational
    analysis of data and decision-related processes.
  time_series_data_management: Storage and processing of sensor time-series data using
    time-series databases such as InfluxDB.
  topic_modeling: Topic-modeling methods covered as part of natural language processing.
  tor_dark_web: TOR and Dark Web technologies and their role in cybersecurity.
  transfer_learning: Transfer learning for deep-learning-based computer vision.
  translation_file_formats: Handling and translating the main file formats within
    computer-assisted translation workflows.
  translation_memories: Creation and management of translation memories in CAT tools.
  translation_post_editing: Light and full post-editing of machine-translated and
    generative-AI-translated texts, including post-editor roles, task conditions,
    text types, audiences, publication contexts, and strategies for improving raw
    output.
  translation_pre_editing: Pre-editing of source texts to prepare them for machine
    translation and improve machine-produced translation output.
  translation_prompting: Basic prompting techniques for optimizing machine-translated
    output and supporting post-editing within AI-based translation tools.
  translation_quality_assurance: Quality-assurance checks for target texts produced
    through CAT, machine translation, and post-editing workflows.
  transport_layer_protocols: Transport-layer services and mechanisms, including multiplexing
    and demultiplexing, connectionless communication with UDP, reliable data transfer,
    connection-oriented communication with TCP, and congestion control.
  treebanks: Treebanks as resources for computational syntax and natural-language
    parsing.
  turing_machines: Turing machines as formal models for studying computability and
    the existence of programs computing specified functions.
  turtle_graphics_animation: Drawing basic geometric shapes and creating basic animations
    with Python turtle modules.
  type_checking: Types and type-checking mechanisms in programming languages.
  type_classes_traits: Traits in Go and Rust and type classes in Haskell as mechanisms
    for expressing reusable, composable type-based abstractions.
  ubiquitous_systems: Design and development of ubiquitous systems and applications
    that use pervasive sensing and processing to provide adaptive services.
  uml_modeling: Modeling software systems with UML use case, class, object, sequence,
    collaboration, state, activity, component, and deployment diagrams.
  unification_resolution: Unification and resolution methods used in the course's
    mathematical logic and logic-programming material.
  uniform_convergence: Learning via uniform convergence as a computational learning-theory
    approach.
  union_find_structures: Union-find data structures.
  usability_design_guidelines: Guidelines, patterns, standards, and methods for designing
    usable interactive systems, including usability considerations for Web applications
    and mobile apps.
  usability_evaluation: Theories and methods for evaluating interface usability, including
    heuristic evaluation and introductory user-study approaches.
  usability_testing: Planning, conducting, and analyzing usability tests to gather
    feedback and iteratively improve service concepts.
  user_account_authorization: Management of user accounts and authorization mechanisms
    on Unix filesystems.
  user_experience_design: User Experience and Experience Design principles and methodologies
    for designing interactive applications and systems.
  user_interface_design: Basics of designing user interfaces.
  user_level_operating_systems: User-level operating systems, including the VUOS system
    and its modules.
  user_research_methods: User-centered research methods, including semi-structured
    interviews, contextual inquiry, observation, personas, empathy maps, experience
    maps, surveys, and research planning.
  variable_importance_analysis: Use of statistical tests and model analysis to identify
    important variables.
  variable_scope: Scope of variables in C++ programs, including external variables
    and visibility across program components.
  vc_dimension: VC-dimension as a measure used in computational learning theory.
  vector_graphics: Vector graphics and digital technical drawing, including graphic
    primitives, modification tools, layers, line styles and weights, screen frequency,
    printing, graphic layouts, and common vector and vector/raster formats.
  vehicular_communications: Vehicular communication challenges, opportunities, and
    deployments, including vehicle-to-vehicle (V2V) and vehicle-to-infrastructure
    (V2I) communication and the effects of mobility and propagation on performance.
  version_control_systems: Version control systems used in software development.
  video_object_tracking: Techniques for detecting and tracking objects in video.
  videogame_localization: Localization of videogames, including the adaptation of
    dialogues, interfaces, tutorials, and other text types found in videogame applications.
  virtual_channels_networking: Virtual channels and virtual network mechanisms in
    computer networks, including MPLS and VLANs.
  virtual_content_design: Standards and design principles for creating virtual-reality
    content.
  virtual_devices: Virtual devices in virtual-system environments.
  virtual_file_systems: Virtual file systems and their implementation.
  virtual_machine_forensics: Forensic investigation of virtual machines, including
    live acquisitions.
  virtual_machines: Virtual machines and their implementation.
  virtual_memory: Virtual memory management in operating systems.
  virtual_networking_stacks: Virtual networking stacks, including the Internet of
    Threads (IoTh).
  virtual_networks: Virtual network systems and their implementation.
  virtual_reality: Introduction to virtual reality.
  virtual_reconstruction: Methodologies for scientifically reliable virtual reconstruction
    of archaeological objects and contexts, including information analysis, two-dimensional
    representation, three-dimensional modeling, and presentation to the public.
  virtual_restoration: Virtual restoration of cultural-heritage objects using digital
    three-dimensional reconstruction and modeling.
  virtual_systems: Introduction to the structure and implementation of virtual systems.
  virtual_tours: Virtual tours as a digital technology for communicating cultural
    heritage.
  virtualization_cloud_services: Virtualization, containers, Docker, Kubernetes, and
    infrastructure-as-a-service and platform-as-a-service services.
  vision_language_models: Vision-language models for multimodal language and vision
    applications.
  vision_transformers: Vision Transformer architectures for image classification and
    other computer-vision tasks.
  voice_user_interfaces: Voice-user-interface paradigms and related approaches to
    designing and developing interactive systems.
  voip_telephony: VoIP telephone exchanges, including Asterisk.
  von_neumann_architecture: The Von Neumann computer architecture.
  vr_software_platforms: Software platforms for virtual reality, including VR runtime
    systems, real-time physics engines, distributed virtual-environment support, collaborative-environment
    support, and game engines.
  web_accessibility: Web accessibility principles and considerations for designing
    Web applications and content that can be accessed and used by diverse users.
  web_api_design: Design of Web application interfaces and APIs, including REST principles.
  web_application_modeling: Modeling Web applications using data, hypertext, and content-management
    models, including WebML and IFML-related model-based development.
  web_architectures_solution_stacks: Comparison of Web architectures and solution
    stacks, including the LAMP and MEAN stacks.
  web_browsers: Web browsers, including what they are and their role in accessing
    Web resources.
  web_build_tools: Introduction to build tools used in Web development.
  web_client_side_programming: Client-side Web programming using JavaScript and Ajax,
    including single-page applications and React.js.
  web_content_localization: Localization of web contents and their adaptation between
    English and Italian.
  web_distribution_frameworks: Frameworks and tools for distributing digital resources
    on the Web, including Boilerplate and Bootstrap.
  web_frameworks_content_management: Use of Web-development frameworks and content
    management systems.
  web_language_supersets: Web-language supersets and stylesheet syntaxes, including
    TypeScript, SCSS, and SASS.
  web_mobile_application_types: Differences between Web, hybrid, and native applications
    for mobile devices.
  web_of_things: Introductory Web of Things concepts for connecting and integrating
    embedded and Internet-of-Things devices with Web technologies.
  web_page_processing: Working with Web pages through Python libraries, as identified
    in the course learning outcomes.
  web_scraping: Methods for retrieving information from websites through web-scraping
    techniques.
  web_server_side_programming: Server-side Web programming and execution environments,
    including Servlets, JSP, event-oriented and stateless models, Node.js, and asynchronous
    I/O management.
  web_servers: Introduction to Web servers in the context of delivering Web pages
    and responding to Web requests.
  web_services: Web services as back-end technologies for Web applications.
  web_workflows: Workflows implemented as part of Web applications and back-end systems.
  wireless_communication_systems: Wireless communication systems, including propagation
    and fading models and an overview of wireless technologies such as IEEE 802.11,
    IEEE 802.16, IEEE 802.20, cellular networks, Bluetooth, and ZigBee.
  wireless_networking: Wireless networking and its relationship to the Internet.
  word_embeddings: Word vectors and word-embedding representations for capturing relationships
    and meaning in text.
  word_sense_disambiguation: Word-sense disambiguation in natural-language processing.
  workflow_modeling: Workflow schemata for representing the operations and processes
    of information systems.
  xml_processing: XML and XHTML information description, DTD and XML Schema typing,
    XSL and XSLT transformations, and XML parsing in Java using DOM and SAX models.
  zero_trust_security: Zero Trust as a modern cybersecurity approach for protecting
    information, services, software, components, and network connections.
