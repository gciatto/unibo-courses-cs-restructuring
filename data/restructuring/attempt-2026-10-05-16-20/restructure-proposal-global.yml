proposed_topics:
- key: digital_image_fundamentals
  description: Foundational digital-image concepts and operations, including image
    formation and acquisition, sensing, sampling, quantization, gray-level histograms,
    convolution, filtering, and general digital-image processing.
  source_topic_keys:
  - digital_image_processing
  - image_formation_acquisition
  - image_sampling_quantization
  - image_histograms
  - image_convolution
  - image_filtering
- key: binary_image_analysis
  description: Foundational image-analysis methods for binary and structured image
    data, including digital topology, thresholding, connected-components and blob
    analysis, mathematical morphology, and edge detection.
  source_topic_keys:
  - digital_topology
  - image_thresholding
  - connected_components_blob_analysis
  - mathematical_morphology
  - edge_detection
- key: local_features_and_matching
  description: Extraction and matching of local image features, including image gradients,
    keypoints, descriptors, Harris corners, SIFT features, invariant matching, and
    efficient feature matching.
  source_topic_keys:
  - local_image_features
  - feature_matching
- key: camera_and_stereo_geometry
  description: Geometric image formation and multi-camera calibration, including intrinsic
    and extrinsic parameters, lens distortion, planar targets, homographies, rectification,
    stereopsis, and stereo calibration.
  source_topic_keys:
  - camera_calibration
  - stereo_vision
- key: segmentation_and_shape_detection
