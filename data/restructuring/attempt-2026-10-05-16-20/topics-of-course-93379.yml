analysis:
  mode: all-courses
source_clusters:
- id: 3
  name: Fashion Technologies Immersive (3)
course:
  id: '93379'
  name: Digital Culture
topics:
  automated_decision_systems: Logical-functional architectures of systems that automatically
    support or make decisions.
  data_visualization: Visualization and graphical representation of datasets and their
    properties, including frequency tables and statistical graphics.
  decision_quality_monitoring: Monitoring and assessment of the quality of decision-making
    processes.
  digital_data_acquisition_storage: Methods for constructing and acquiring digital
    data, together with principles and logical architectures for digital data storage
    and memory.
  digital_decision_making: Effects of digital technologies on decision-making processes
    and methods for considering or predicting future developments.
  digital_intelligence: Digital intelligence as a technological paradigm comprising
    data acquisition, memory, processing, representation, activation, and adaptation.
  digitalization_impacts: Effects of digitalization and the information-technology
    revolution across astronomical, ecological, political, economic, social, and individual
    domains.
  generative_models: Generative deep-learning models and techniques, including adversarial
    and diffusion models.
  intelligent_agents: Agents as systems that exhibit intelligent behavior, including
    the notion of an agent and the construction of systems that simulate human-expert
    behavior in specific disciplines.
  large_language_models: Generative large language models and their use in language-processing
    applications.
  machine_learning: Fundamental machine-learning technologies and algorithms for developing
    intelligent applications.
  predictive_analytics: Predictive data analysis using statistical and machine-learning
    models.
  text_mining: Text representation, retrieval, classification, opinion mining, summarization,
    and information extraction, with practical text-mining case studies.
  time_series_analysis: Time-series analysis as a method used in the computational
    analysis of data and decision-related processes.
