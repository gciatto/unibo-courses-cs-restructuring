analysis:
  mode: all-courses
source_clusters:
- id: 5
  name: Computing Education Informatics (5)
course:
  id: '90749'
  name: Computing Education
topics:
  computational_thinking: Computational thinking as a way of formulating problems
    and designing step-by-step solutions.
  computer_science_education: Computer Science education as a discipline, including
    historical, epistemological, and ethical aspects of Computer Science and the rationale
    for teaching it.
  cs_curriculum_design: Computer Science curricula, national guidelines, international
    and Italian school curricula, and the use of textbooks in planning Computer Science
    education.
  cs_education_pedagogy: Pedagogical and didactical approaches for teaching Computer
    Science at different school levels, including the organization of courses and
    study paths.
  cs_teaching_methods: Subject-specific methodologies for teaching Computer Science,
    including dramatization, making and tinkering with physical computing tools, unplugged
    activities, program-comprehension exercises, debugging others' code, and displaying
    machine state during program execution.
  educational_assessment: Evaluation and assessment methodologies for learning Computer
    Science, with particular reference to programming.
  learning_theories: Learning paradigms and theories applied to Computer Science education,
    including constructivism and constructionism, as well as top-down and bottom-up
    teaching approaches.
  making_based_computing_education: Design and development of computer-science teaching
    methods based on Making and Making-oriented problem solving.
  programming_learning_difficulties: Cognitive difficulties and misconceptions involved
    in learning programming, together with strategies for addressing them and implications
    of choosing programming languages.
  software_licensing: Free and proprietary software licenses and their implications
    for Computer Science education.
