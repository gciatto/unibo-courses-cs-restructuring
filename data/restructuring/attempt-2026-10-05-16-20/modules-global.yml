  description: JavaScript as a dynamic functional language with a prototype-based
    object model.
  source_topics:
    javascript_programming: JavaScript as a dynamic functional language with a prototype-based
      object model.
- key: linear_algebra_for_computation
  description: Linear algebra concepts used in deep-learning models and computations.
  source_topics:
    linear_algebra: Linear algebra concepts used in deep-learning models and computations.
- key: user_interface_design
  description: Basics of designing user interfaces.
  source_topics:
    user_interface_design: Basics of designing user interfaces.
- key: user_research_and_usability_testing
  description: User-centered research and usability evaluation, including interviews,
    contextual inquiry, observation, personas, empathy maps, experience maps, surveys,
    research planning, and the planning, conduct, and analysis of usability tests.
  source_topics:
    user_research_methods: User-centered research methods, including semi-structured
      interviews, contextual inquiry, observation, personas, empathy maps, experience
      maps, surveys, and research planning.
    usability_testing: Planning, conducting, and analyzing usability tests to gather
      feedback and iteratively improve service concepts.
- key: design_and_service_conception
  description: Iterative Design Thinking and service design processes, including empathize,
    define, ideate, prototype, test, service concepts, user journeys, ecosystem maps,
    and service blueprints.
  source_topics:
    design_thinking: Design Thinking as an iterative process involving empathize,
      define, ideate, prototype, and test activities.
    service_design: Service design processes and deliverables, including service concepts,
      user journeys, ecosystem maps, and service blueprints.
- key: basic_cybersecurity_practices
  description: Password-management and data-backup practices covered as part of basic
    cybersecurity and protection against data loss.
  source_topics:
    data_backup: Data-backup practices as part of basic cybersecurity and protection
      against data loss.
    password_management: Password-management practices covered as part of basic cybersecurity.
- key: digital_rights_and_intellectual_property
  description: Intellectual-property concepts, privacy law, and online rights as they
    relate to digital services and technology use.
  source_topics:
    intellectual_property: Intellectual-property concepts covered as part of computer-science
      fundamentals.
    privacy_law: Privacy law and online rights as they relate to digital services
      and technology use.
- key: healthcare_information_and_archiving
  description: Healthcare information systems and the collection, organization, cataloging,
    use, and archiving of health information in clinical pathology, pathological anatomy,
    transfusion medicine, hospitals, and electronic health records.
  source_topics:
    healthcare_data_archiving: Data archiving in clinical pathology, pathological
      anatomy, and transfusion medicine.
    healthcare_data_management: Use of computer systems and databases to collect,
      organize, catalog, and use health information, including corporate and regional
      healthcare databases.
    healthcare_information_systems: Laboratory Information Systems, Hospital Information
      Systems, and electronic health records in healthcare settings.
- key: healthcare_workflow_operations
  description: Computerized healthcare laboratory and hospital operations, including
    system-administrator roles, workflow configuration and tracking, instrument connections,
    department configuration, user authorization, registry changes, and management
    of non-compliance caused by patient-entry and sampling-date errors.
  source_topics:
    clinical_workflow_tracking: Configuration and tracking of workflows in clinical
      pathology, pathological anatomy, and transfusion medicine, including instrument
      connections, department configuration, user authorization, and registry changes.
    healthcare_non_compliance_management: Management of non-compliance caused by patient-entry
      and sampling-date errors, including repercussions for electronic health records,
      repeated sampling, and delays.
    system_administrator_role: The role of the system administrator in the computerization
      of healthcare-related laboratory and hospital activities.
- key: healthcare_classification_and_indicators
  description: Healthcare case-mix classification systems, including SDO and Diagnosis-Related
    Groups, and the use of healthcare indicators in healthcare information contexts.
  source_topics:
    healthcare_classification_systems: Healthcare case-mix classification systems,
      including SDO and Diagnosis-Related Groups (DRG).
    healthcare_indicators: Healthcare indicators and their use in healthcare information
      contexts.
- key: hub_and_spoke_system_organization
  description: Hub-and-spoke system organization as covered in the source course context.
  source_topics:
    hub_and_spoke_systems: Hub-and-spoke system organization as covered in the course.
- key: augmented_and_mixed_reality_foundations
  description: Introduction to augmented reality and the mixed-reality continuum from
    augmented reality to virtual reality, including the technologies supporting mixed-reality
    environments and their applications in the course context.
  source_topics:
    augmented_reality: Introduction to augmented reality and its applications in the
      course context.
    mixed_reality: The mixed-reality continuum from augmented reality to virtual reality
      and the technologies supporting mixed-reality environments.
- key: virtual_reality_graphics_and_content
  description: Computer-graphics principles and standards and design principles for
    creating virtual-reality content and environments.
  source_topics:
    computer_graphics: Computer-graphics principles used to design and create virtual
      and augmented reality environments.
    virtual_content_design: Standards and design principles for creating virtual-reality
      content.
- key: immersive_environment_systems_and_interaction
  description: Hardware, tracking, input and output channels, interaction techniques,
    avatars, distributed and collaborative virtual environments, and software platforms
    for virtual reality, including runtimes, physics engines, collaborative-environment
    support, and game engines.
  source_topics:
    avatar_systems: Avatars in virtual and augmented reality environments.
    distributed_virtual_environments: Distributed and collaborative virtual environments
      for virtual-reality applications.
    immersive_hardware: Output and input hardware for immersive environments, including
      visual, auditory, haptic, vestibular, and olfactory channels, tracking systems,
      and input devices.
    immersive_interaction: Interaction techniques in virtual and augmented reality,
      including selection and manipulation, travel, navigation, wayfinding, system
      control, and symbolic input.
    vr_software_platforms: Software platforms for virtual reality, including VR runtime
      systems, real-time physics engines, distributed virtual-environment support,
      collaborative-environment support, and game engines.
- key: software_and_digital_content_localization
  description: Localization of software, videogames, web contents, and IT products,
    including translation and adaptation between English and Italian and the adaptation
    of videogame dialogues, interfaces, tutorials, and other digital text types.
  source_topics:
    software_localization: Localization of software and IT products, including the
      distinctive features, conventions, and potential pitfalls of adapting software
      content.
    videogame_localization: Localization of videogames, including the adaptation of
      dialogues, interfaces, tutorials, and other text types found in videogame applications.
    web_content_localization: Localization of web contents and their adaptation between
      English and Italian.
    localization_translation_adaptation: Translation and adaptation of complex digital
      applications and their varied text types between English and Italian.
- key: localization_production_and_quality
  description: Information mining, accessibility, interface-size and visual constraints,
    variables and placeholders, editing and revision, prevention of localization-specific
    bugs, and assessment of the linguistic quality of localized digital content.
  source_topics:
    localization_accessibility: Application of media accessibility requirements when
      localizing videogames, IT products, and web contents.
    localization_bug_prevention: Identification and prevention of bugs and other localization-specific
      problems in software applications.
    localization_editing_revision: Editing and revision of localized texts as part
      of software and digital-content localization.
    localization_information_mining: Information-mining techniques used in the localization
      of videogames, IT products, and web contents.
    localization_interface_constraints: Management of size and visual restrictions
      affecting localized software interfaces and other digital application content.
    localization_placeholders: Handling variables and placeholders in localized software
      content.
    localization_quality_assessment: Assessment of the linguistic quality of a localized
      videogame, IT product, or web content as a whole.
- key: quantum_computing_mathematical_foundations
  description: Quantum computing as an alternative computational paradigm, including
    its basic overview, qubits and their mathematical representation, and complex
    Hilbert spaces as mathematical background.
  source_topics:
    complex_hilbert_spaces: Complex Hilbert spaces as mathematical background for
      quantum computing.
    quantum_computing: Quantum computing as an alternative computational paradigm,
      including its basic overview and mathematical foundations.
    qubits: Qubits and their mathematical representation.
- key: quantum_circuits_and_programming
  description: Quantum circuits as a computational model, implementation of quantum
    algorithms and sample circuits, graphical languages for quantum circuits, and
    an overview of quantum programming.
  source_topics:
    quantum_circuits: Quantum circuits as a computational model, including implementation
      of quantum algorithms and sample circuits such as Deutsch and Bernstein–Vazirani.
    quantum_graphical_languages: Development and use of graphical languages for quantum
      circuits.
    quantum_programming: An overview of quantum programming.
- key: quantum_algorithms_protocols_and_error_correction
  description: Quantum algorithms including Simon's, Grover's, and Shor's algorithms,
    together with quantum protocols, quantum cryptography, and quantum error-correction
    techniques.
  source_topics:
    quantum_algorithms: Quantum algorithms including Simon's, Grover's, and Shor's
      algorithms.
    quantum_cryptography: Quantum cryptography as an advanced topic in quantum computing.
    quantum_error_correction: Quantum error-correction techniques.
    quantum_protocols: Quantum protocols.
- key: interpreting_documentation
  description: Traditional and AI-supported strategies for preparing conference interpreters.
  source_topics:
    documentation_strategies: Traditional and AI-supported documentation strategies
      for preparing conference interpreters.
- key: specialized_terminology_research
  description: Construction and use of specialized electronic corpora for terminology
    research, including traditional and AI-supported terminology detection and extraction.
  source_topics:
    specialized_corpora: Construction and use of electronic specialized corpora for
      terminology research and extraction.
    terminology_extraction: Detection and extraction of terminology using traditional
      methods, AI-supported methods, and tools such as AntConc.
- key: terminology_management
  description: Creation and management of glossaries and terminology databases using
    terminographic tools such as MultiTerm, Interplex, and InterpretBank.
  source_topics:
    terminology_management: Creation and management of glossaries and terminology
      databases using terminographic tools such as MultiTerm, Interplex, and InterpretBank.
- key: live_subtitling
  description: Production of intralingual real-time subtitles from spoken and audiovisual
    material, including subtitling techniques for deaf audiences.
  source_topics:
    live_subtitling: Production of intralingual real-time subtitles from spoken and
      audiovisual material, including subtitling techniques for deaf audiences.
- key: cryptographic_security_foundations
  description: Perfect security as a theoretical criterion for assessing cryptographic
    techniques and pseudorandomness as a fundamental concept in modern cryptography.
  source_topics:
    perfect_security: Perfect security as a theoretical criterion for assessing the
      security of cryptographic techniques.
    pseudorandomness: Pseudorandomness as a fundamental concept in modern cryptography.
- key: cryptographic_protocol_models_and_verification
  description: The symbolic model for representing and analyzing cryptographic protocols,
    together with formal, automatic, and semi-automatic techniques for verifying protocols
    and detecting security bugs.
  source_topics:
    symbolic_model: The symbolic model for representing and analyzing cryptographic
      protocols.
    cryptographic_protocol_verification: Formal, automatic, and semi-automatic techniques
      for verifying cryptographic protocols and detecting security bugs.
- key: network_analysis_concepts
  description: Analysis of networks as representations of entities and relationships,
    including graph representations, network structures, node and network measures,
    structural patterns, and random-graph properties.
  source_topics:
    network_analysis: Analysis of networks as representations of entities and relationships,
      including graph representations, paths, components, adjacency and matrix representations,
      network types, node and network measures, centrality, PageRank, hubs and authorities,
      cliques, cores, cohesion, reciprocity, similarity, equivalence, homophily, assortative
      mixing, clustering, transitivity, triads, centralisation, core-periphery structure,
      random graphs, degree distributions, power laws, scale-free and small-world
      networks, and component structure.
- key: network_data_and_visualization
  description: Collection, reliability assessment, formatting, transformation, and
    management of network-analysis data, together with algorithms, software, and visualization
    techniques for networks, network change, and large-network reduction and aggregation.
  source_topics:
    network_data_management: Collection, reliability assessment, formatting, transformation,
      and management of data for network analysis, including algorithms and software
      used for network analysis and visualisation.
    network_visualization: Visualisation of networks using graph-layout algorithms,
      node attributes, node filtering, ego networks, tie characteristics and strengths,
      and representations of network change, including approaches for reducing and
      aggregating large networks.
- key: network_research_design
  description: Research design for network-analysis studies, including network questions,
    scientific publication, analysis of research papers, hypothesis formulation, permutation
    tests, and dyadic hypothesis testing.
  source_topics:
    network_research_design: Research design for network-analysis studies, including
      network questions, the scientific publication process, reading and analysing
      network-analysis research papers, hypothesis formulation, permutation tests,
      and dyadic hypothesis testing.
- key: digital_media_economics_and_markets
  description: Economic principles and models governing digital media, including market
    dynamics and structures in music and video, relevant player types, technological
    evolution, and changing consumer habits.
  source_topics:
    digital_media_economics: Economic principles and models governing the digital
      media landscape.
    media_market_dynamics: Market dynamics and structures in music and video, including
      relevant player types and the influence of technological evolution and changing
      consumer habits.
- key: digital_media_value_chains
  description: Value-chain analysis of the music and video industries.
  source_topics:
    media_value_chains: Value-chain analysis of the music and video industries.
- key: digital_media_transformation
  description: Transformations within media industries and innovations involving new
    digital technologies applied to creative industries.
  source_topics:
    digital_media_transformation: Transformations within media industries and innovations
      involving new digital technologies applied to creative industries.
