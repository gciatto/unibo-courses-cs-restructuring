analysis:
  mode: all-courses
modules:
- key: digital_image_fundamentals
  description: Foundational digital-image concepts and operations, including image
    formation and acquisition, sensing, sampling, quantization, gray-level histograms,
    convolution, filtering, and general digital-image processing.
  source_topics:
    digital_image_processing: Basic concepts, algorithms, tools, and systems for processing
      and analyzing digital images.
    image_formation_acquisition: Image formation and acquisition using pinhole cameras,
      perspective projection, lenses, field of view, depth of field, and image sensors.
    image_sampling_quantization: Basic image sensing, sampling, and quantization.
    image_histograms: Gray-level histograms for digital-image analysis.
    image_convolution: Convolution as a basic tool for processing and analyzing images.
    image_filtering: Digital-image filtering using mean, Gaussian, median, bilateral,
      and non-local-means filters.
- key: binary_image_analysis
  description: Foundational image-analysis methods for binary and structured image
    data, including digital topology, thresholding, connected-components and blob
    analysis, mathematical morphology, and edge detection.
  source_topics:
    digital_topology: Digital topology as a basic tool for image processing and analysis.
    image_thresholding: Global, automatically estimated, and spatially adaptive thresholding
      for image binarization.
    connected_components_blob_analysis: Connected-components labeling and blob analysis
      of binary images.
    mathematical_morphology: Mathematical morphology as a basic tool for image processing
      and analysis.
    edge_detection: Image edge detection using image gradients, non-maximum suppression,
      the Laplacian of Gaussian, and the Canny edge detector.
- key: local_features_and_matching
  description: Extraction and matching of local image features, including image gradients,
    keypoints, descriptors, Harris corners, SIFT features, invariant matching, and
    efficient feature matching.
  source_topics:
    local_image_features: Image gradients, smooth derivatives such as Sobel, Canny
      edge detection, keypoint detectors, descriptors, Harris corners, and scale-invariant
      SIFT features.
    feature_matching: Matching local image features, including efficient matching
      using kd-trees and invariant-feature matching.
- key: camera_and_stereo_geometry
  description: Geometric image formation and multi-camera calibration, including intrinsic
    and extrinsic parameters, lens distortion, planar targets, homographies, rectification,
    stereopsis, and stereo calibration.
  source_topics:
    camera_calibration: Camera calibration using intrinsic and extrinsic parameters,
      lens-distortion models, planar targets, homography estimation, image rectification,
      and stereo calibration.
    stereo_vision: Geometry of stereopsis and stereo image calibration.
- key: segmentation_and_shape_detection
  description: Methods for separating image regions and detecting analytic shapes
    or objects, including image segmentation and Hough and generalized Hough transforms.
  source_topics:
    image_segmentation: Techniques for segmenting objects or regions from images.
    hough_transform: Hough and generalized Hough transforms for detecting analytic
      shapes and objects.
- key: visual_detection_recognition_and_tracking
  description: Computer-vision methods for detecting, recognizing, and tracking objects
    in images and video, including pattern and shape-based instance detection, object
    recognition, and video object tracking.
  source_topics:
    instance_detection: Instance detection using pattern matching with SSD, SAD, NCC,
      and ZNCC, as well as shape-based matching and similarity estimation.
    object_detection: Techniques for detecting objects in images and videos.
    object_recognition: Recognition of objects from images and videos.
    video_object_tracking: Techniques for detecting and tracking objects in video.
- key: deep_learning_foundations
  description: Mathematical and computational foundations for neural-network learning,
    including calculus, automatic differentiation, feedforward architectures, backpropagation-based
    training, and optimization algorithms.
  source_topics:
    calculus: Calculus concepts used in deep learning, including differentiation.
    automatic_differentiation: Automatic differentiation as a calculus-based technique
      used in deep-learning computation and optimization.
    feedforward_neural_networks: Feedforward neural-network architectures and their
      use in deep-learning applications.
    neural_network_training: Training of neural networks using backpropagation.
    optimization_algorithms: Optimization algorithms for training and optimizing deep-learning
      approaches.
- key: learned_visual_representations_and_classification
  description: Deep-learning approaches for visual representation and classification,
    including convolutional neural networks, image representations, fully connected
    image classifiers, vision transformers, data augmentation, regularization, and
    transfer learning.
  source_topics:
    convolutional_neural_networks: Convolutional neural networks (CNNs) as a deep-learning
      architecture.
    image_representation: Image representations based on Bag of Visual Words, representation
      learning, convolutional layers, pooling, and batch normalization.
    image_classification: Image classification using linear classifiers and fully
      connected neural networks.
    vision_transformers: Vision Transformer architectures for image classification
      and other computer-vision tasks.
    data_augmentation: Data-augmentation techniques for training image-classification
      and computer-vision models, including augmentations such as FixRes, cutout,
      mix-up, and cut-mix.
    regularization: Regularization and training techniques for computer-vision neural
      networks, including model capacity, learning-rate scheduling, weight decay,
      label smoothing, and dropout.
    transfer_learning: Transfer learning for deep-learning-based computer vision.
- key: recurrent_models_and_visual_captioning
  description: Recurrent neural-network architectures and their use with image and
    video captioning tasks.
  source_topics:
    recurrent_neural_networks: Recurrent neural networks (RNNs) as a neural-network
      architecture for machine learning.
    image_video_captioning: Image and video captioning tasks addressed using computer-vision
      and sequence-modeling techniques.
- key: generative_and_interpretable_deep_models
  description: Generative and behavior-focused deep-learning methods, including autoencoders,
    generative models, adversarial examples, and visualization and interpretation
    of neural-network units and behavior.
  source_topics:
    autoencoders: Autoencoder neural-network architectures.
    generative_models: Generative deep-learning models and techniques, including adversarial
      and diffusion models.
    adversarial_examples: Techniques for fooling neural networks and studying adversarial
      behavior.
    neural_network_visualization: Visualization and interpretation of hidden neural
      units and neural-network behavior, including deep dreams and inceptionism.
- key: learned_visual_geometry_and_similarity
  description: Specialized learned computer-vision methods for monocular depth estimation
    and deep metric and representation learning, including photometric, contrastive,
    triplet, ArcFace, and NT-Xent approaches.
  source_topics:
    depth_estimation: Monocular depth estimation from images, including photometric
      loss and Monodepth.
    metric_learning: Deep metric and representation learning for applications such
      as face recognition and identification, including contrastive and triplet losses,
      ArcFace, and NT-Xent loss.
- key: document_digitization_and_quality
  description: Digitisation and management of printed and handwritten textual documents,
    including scanner calibration, digital representation, restoration and enhancement,
    image-quality assessment, and technical metadata for digitised collections.
  source_topics:
    document_digitization: Digitisation, digital representation, processing, restoration,
      enhancement, and project planning for printed and handwritten textual documents,
      including cultural-heritage documents.
    scanner_calibration: Calibration of scanners used to acquire digital images of
      textual documents.
    digital_image_quality_assessment: Methods for verifying the quality of digitised
      images using histograms, distributions, information content, and related quality-control
      procedures.
    technical_metadata: The function of technical metadata in the management and documentation
      of digitised images and digital collections.
- key: digital_data_and_intelligence
  description: Digital data and intelligence foundations, including digital data acquisition
    and storage, memory and representation, digital intelligence, and the effects
    of digitalization and the information-technology revolution across societal and
    individual domains.
  source_topics:
    digital_data_acquisition_storage: Methods for constructing and acquiring digital
      data, together with principles and logical architectures for digital data storage
      and memory.
    digital_intelligence: Digital intelligence as a technological paradigm comprising
      data acquisition, memory, processing, representation, activation, and adaptation.
    digitalization_impacts: Effects of digitalization and the information-technology
      revolution across astronomical, ecological, political, economic, social, and
      individual domains.
- key: digital_transformation_innovation_practice
  description: Planning and implementing digital innovation and transformation initiatives
    through business ideas and plans, technology assessment, teamwork and collaborative
    problem solving, transformation design, KPIs, and action plans.
  source_topics:
    business_planning: Development of business ideas, business cases, business plans,
      and action plans for digital innovation initiatives.
    digital_transformation_design: Designing digital transformation initiatives by
      defining business challenges, generating technology-based ideas, deploying solutions,
      and conducting presentation and follow-up activities.
    kpi_management: Use of key performance indicators (KPIs) in digital transformation
      planning and action plans.
    teamwork_innovation_projects: Teamwork and collaborative problem solving in digital
      innovation projects.
    technology_assessment: Analysis and diagnosis of company technologies, together
      with an overview of relevant technologies, architectures, and procedures.
- key: industrial_digitalization_and_iot
  description: Industrial digitalization and connected industrial systems, including
    Industry 4.0 and Industry 5.0, industrial digital transformation, Industrial IoT
    architectures and interoperability, and smart sensors and their operating principles.
  source_topics:
    industrial_digital_transformation: Industrial digital transformation, including
      its cross-disciplinary drivers, technology-driven business models, organizational
      considerations, and future trends.
    industrial_iot_architectures: Scalable Industrial IoT architectures, reference
      architectures, interoperability standards, and architectural trade-offs in industrial
      scenarios.
    industry_4_0: Foundations, drivers, technologies, trends, applications, and implications
      of Industry 4.0.
    industry_5_0: Emerging Industry 5.0 approaches and human-centered paradigms in
      industrial technology.
    smart_sensors: Smart sensors and sensor operating principles for collecting data
      in Internet-of-Things and agricultural applications.
- key: decision_quality_monitoring
  description: Monitoring and assessing the quality of decision-making processes.
  source_topics:
    decision_quality_monitoring: Monitoring and assessment of the quality of decision-making
      processes.
- key: abstract_data_types_and_structures
  description: Abstract data types, their operations, representation, implementation
    techniques, and elementary data structures such as lists, queues, stacks, trees,
    and graphs.
  source_topics:
    abstract_data_types: Abstract data types, including type definitions and operations
      such as constructors, selectors, predicates, functions, and transformators,
      with related representation and implementation techniques.
    data_structures: Elementary data structures including vectors, records, lists,
      queues, stacks, trees, and graphs.
- key: arrays_and_matrices
  description: Organization, representation, and memory layout of arrays and matrices.
  source_topics:
    arrays_matrices: Arrays and matrices, including their organization and representation
      in memory.
- key: programming_foundations
  description: Computational thinking, basic programming principles, programming languages,
    and scripting languages for formulating problems and writing small-scale programs.
  source_topics:
    computational_thinking: Computational thinking as a way of formulating problems
      and designing step-by-step solutions.
    programming_basics: Basic principles of programming.
    programming_languages: Introduction to programming languages, including what languages
      are and the role of visual languages.
    scripting_languages: Scripting languages and their use for writing small-scale
      programs, including Python.
- key: python_programming_fundamentals
  description: Python programming with basic data types, names and visibility, mutable
    and immutable objects, and problem-solving applications.
  source_topics:
    basic_data_types: Basic Python data types and their use in solving problems.
    object_mutability: Immutable and mutable objects in Python.
    programming_in_python: Programming in Python, including names, visibility, functions,
      objects, classes, and problem-solving applications.
    scope_visibility: Names and visibility rules in Python programs.
- key: imperative_programming_and_functions
  description: Imperative programming constructs, including algorithms, assignment,
    input and output, conditionals, iteration, functions, parameter passing, and recursion.
  source_topics:
    imperative_constructs: Imperative programming concepts, including algorithms and
      programs, data types, assignment, input/output, conditional statements, and
      iteration.
    functions: Functions in Python and their use in programming problem solutions.
    functions_recursion: Functions, parameter passing, and recursive functions.
- key: programming_environments_and_tools
  description: Development environments and the use of open-source technologies and
    Linux as software tools for programming work.
  source_topics:
    development_environment: Use of a development environment for programming.
    linux_introduction: Brief introduction to Linux at the beginning of the course.
    open_source_technologies: Open-source technologies contrasted with proprietary
      technologies in the use of basic software tools.
- key: program_organization_and_libraries
  description: Program structure, header inclusion, libraries, and library functions.
  source_topics:
    program_structure_libraries: Program structure, header inclusion, libraries, and
      library functions.
- key: program_input_output_and_files
  description: Console and file input/output operations and file-handling functions.
  source_topics:
    file_handling: Input/output and file-handling functions.
    program_input_output: Input and output operations in programs, including console
      and file input/output.
- key: string_processing
  description: String manipulation, string functions, and regular expressions for
    pattern matching and string processing.
  source_topics:
    regular_expressions: Regular expressions for pattern matching and processing strings,
      introduced as part of practical Python programming.
    string_processing: String manipulation and string functions.
- key: c_programming_and_memory
  description: Programming in C together with computer memory organization, addresses,
    words, pointers, pointer arithmetic, and memory representation.
  source_topics:
    programming_in_c: Introduction to programming and software development using the
      C language.
    memory_organization_pointers: Computer memory organization, including addresses,
      words, pointers, pointer arithmetic, and memory representation.
- key: cpp_programming
  description: Programming in C++, including C++ functions, parameter or variable
    scope, and visibility across program components.
  source_topics:
    programming_in_cpp: Introduction to programming and creating programs using C++.
    programming_functions: Functions in C++ programming.
    variable_scope: Scope of variables in C++ programs, including external variables
      and visibility across program components.
- key: object_oriented_programming
  description: Fundamental concepts and features of object-oriented programming.
  source_topics:
    object_oriented_programming: Fundamental concepts and features of object-oriented
      programming.
- key: java_application_development
  description: Java language features and application development using generics,
    annotations, inner classes, lambda expressions, graphical user interfaces, and
    object serialization.
  source_topics:
    java_language_features: Java language features including generics, annotations,
      inner classes, and lambda expressions.
    graphical_user_interfaces: Graphical user interfaces in Java applications.
    object_serialization: Serialization and deserialization of objects as part of
      object-oriented application development, including object serialization in Java.
- key: exception_handling
  description: Exceptions as a programming-language construct.
  source_topics:
    exceptions: Exceptions as a programming-language construct.
- key: computer_information_representation
  description: Representation of numeric and non-numeric information in digital computers,
    including two's complement and floating-point representations.
  source_topics:
    numeric_information_representation: Representation of numeric information in computers,
      including two's complement and floating-point representations.
    non_numeric_information_representation: Representation of non-numerical information
      in digital machines.
- key: software_system_levels
  description: Levels of computer software as part of the organization of computer
    systems.
  source_topics:
    software_levels: Levels of computer software as part of the organization of computer
      systems.
- key: analytics_and_variable_analysis
  description: Types of data analytics, descriptive analysis with Python libraries,
    and the use of statistical tests and model analysis to identify important variables.
  source_topics:
    analytics_types: Types of data analytics, including diagnostic, descriptive, predictive,
      and prescriptive analytics.
    descriptive_analytics: Descriptive analysis of data of various types using Python
      libraries.
    variable_importance_analysis: Use of statistical tests and model analysis to identify
      important variables.
- key: financial_data_access
  description: Methods for accessing financial data for computational solutions involving
    financial problems.
  source_topics:
    financial_data_access: Methods for accessing financial data for computational
      solutions involving financial problems.
- key: scientific_and_numerical_computing
  description: Scientific computing concepts and tools, numerical analysis, numerical
    errors and precision, numerical modeling, and stochastic Monte Carlo simulation
    methods.
  source_topics:
    scientific_computing: Basic concepts, methods, and tools for scientific computing.
    numerical_analysis: Elementary numerical analysis methods for approximating functions,
      derivatives, zeros, and integrals.
    numerical_errors: Numerical errors and precision issues, including absolute, relative,
      and percentage errors, cancellation, error propagation, machine precision, and
      significant digits.
    numerical_modeling: Basic numerical modeling for solving physical equations such
      as the d’Alembert, heat, and transport equations.
    monte_carlo_simulation: Monte Carlo simulation methods based on stochastic programs,
      sampling, and repeated random experiments.
- key: bioinformatics_data_and_analysis
  description: Biological data types, computational representation of biological data,
    biomolecular sequence and structure analysis, genomic annotation, and heuristic
    sequence-alignment methods.
  source_topics:
    biological_data_types: Types of biological data and the use of suitable data structures
      for representing them.
    biomolecular_sequence_structure_analysis: Tools and computational approaches for
      sequence and structure analysis of biomolecules.
    genomic_annotation: Annotation problems involving biomolecules and genomic-era
      sequence data.
    heuristic_alignment: Heuristic algorithms used as sequence-alignment tools, including
      their theoretical basis and implementation.
- key: logic_programming_methods
  description: Introductory mathematical logic using unification and resolution methods.
  source_topics:
    mathematical_logic: Introductory mathematical logic techniques covered in the
      course, including unification and resolution.
    unification_resolution: Unification and resolution methods used in the course's
      mathematical logic and logic-programming material.
- key: cognitive_science_and_cognition
  description: Theoretical, empirical, neurocognitive, embodied, enactive, embedded,
    and extended approaches to cognition, including theory of mind.
  source_topics:
    cognitive_science: Cognitive-science approaches to cognition, including theoretical,
      empirical, and neurocognitive perspectives.
    four_e_cognition: The embodied, enactive, embedded, and extended (4E) approach
      assumed for interpreting cognition and multimodal content.
    theory_of_mind: Theory of mind as a phenomenon for investigating the representation
      and interpretation of cognitive perspectives and mental states.
- key: semiotics_and_multimodal_meaning
  description: Semiotic, formal, ontological, and computational approaches to interpreting
    multimodal content, conceptual blending, and recurring semantic patterns across
    languages, modalities, cultures, and practices.
  source_topics:
    conceptual_blending: Conceptual blending as a framework for analyzing how meaning
      is constructed by integrating concepts across domains.
    multimodal_data_interpretation: Semiotic interpretation of multimodal data and
      content using formal, ontological, and computational methods.
    ontological_methods: Ontological methods for interpreting multimodal data and
      content across different ontological levels.
    semantic_universals: Computational and empirical investigation of recurring semantic
      patterns across languages, modalities, cultures, practices, and neurocognitive
      systems.
    semiotics: Semiotic approaches to signs, interpretation, and meaning-making across
      modalities, cultures, and practices.
- key: digital_transformation
  description: The concept of digital transformation and the use of text-processing
    and computational tools as examples of transformation processes.
  source_topics:
    digital_transformation: The concept of digital transformation and the use of text
      processing and computational tools as examples of transformation processes.
- key: python_graphics_and_animation
  description: Drawing basic geometric shapes and creating basic animations with Python
    turtle modules.
  source_topics:
    turtle_graphics_animation: Drawing basic geometric shapes and creating basic animations
      with Python turtle modules.
- key: data_science_computing
  description: Foundational data-science methods, Python libraries, and Jupyter-based
    computational environments for processing data and developing intelligent applications.
  source_topics:
    data_science: Fundamental data-science methods for processing structured and unstructured
      data and developing intelligent applications.
    python_data_science_libraries: Python libraries and frameworks for data science,
      including NumPy and Pandas for numerical computation and data representation,
      and PyTorch and TensorFlow for defining and using machine-learning models.
    jupyter_notebooks: Jupyter notebooks as computational environments for developing
      and running programming solutions.
- key: data_visualization
  description: Visualization and graphical representation of datasets and their properties,
    including frequency tables and statistical graphics.
  source_topics:
    data_visualization: Visualization and graphical representation of datasets and
      their properties, including frequency tables and statistical graphics.
- key: statistical_methods_and_study_design
  description: Statistical inference, study designs, and sampling bias, including
    confidence intervals, statistical tests, precision, bias, and experimental and
    observational studies.
  source_topics:
    statistical_inference: Inferential statistical methods, including confidence intervals,
      precision and bias, and the practical application of statistical tests.
    study_designs: Overview of experimental and observational study designs.
    sampling_bias: Sampling bias as a source of unreliable or misleading conclusions
      in data analysis and machine-learning applications.
- key: machine_learning_methods
  description: Supervised and unsupervised learning, regression, predictive analytics,
    and the selection and validation of machine-learning models and results.
  source_topics:
    supervised_unsupervised_learning: Supervised and unsupervised machine-learning
      approaches.
    regression_analysis: Regression models and algorithms for predicting continuous
      outcomes.
    predictive_analytics: Predictive data analysis using statistical and machine-learning
      models.
    model_selection_validation: Selection and validation of machine-learning models,
      including assessment and presentation of results.
- key: reinforcement_learning
  description: Reinforcement learning as a machine-learning approach.
  source_topics:
    reinforcement_learning: Reinforcement learning as a machine-learning approach.
- key: computer_vision
  description: Computer-vision concepts and applications, including image representation,
    object detection and classification, classical techniques, and deep-learning solutions.
  source_topics:
    computer_vision: Computer-vision topics and applications, including image representation,
      object detection and classification, classical techniques, and deep-learning
      solutions.
- key: health_ai_and_medical_imaging
  description: Application of data science and machine-learning methods to health
    datasets, including classification, detection, prediction, digital-health interventions,
    and deep learning for medical imaging.
  source_topics:
    health_data_science: Application of statistics, machine learning, deep learning,
      and reinforcement learning to health datasets for classification, detection,
      prediction, and digital-health interventions.
    medical_imaging_ai: Use of deep-learning techniques for medical-imaging data within
      health AI.
- key: natural_language_topic_modeling
  description: Topic-modeling methods covered as part of natural language processing.
  source_topics:
    topic_modeling: Topic-modeling methods covered as part of natural language processing.
- key: systematic_literature_review
  description: Systematic literature review as a methodology for scientific surveys
    of intelligent and autonomous systems.
  source_topics:
    systematic_literature_review: Systematic literature review as a methodology for
      scientific surveys of intelligent and autonomous systems.
- key: context_aware_and_ubiquitous_systems
  description: Concepts, architectures, and applications of adaptive and ubiquitous
    systems using user, device, location, or activity context, including activity
    recognition and context-aware task allocation.
  source_topics:
    context_aware_computing: Fundamental concepts, definitions, use cases, architectures,
      and applications of systems that adapt their behavior based on user, device,
      location, or activity context.
    activity_aware_systems: Systems that adapt their behavior based on recognition
      of the user's current activity.
    context_aware_task_allocation: Allocation of tasks and workloads using metrics
      derived from the current context of users or devices, such as location.
    location_aware_systems: Systems that adapt their behavior or provide services
      based on the current location of users or devices.
    location_based_services: Services and applications whose behavior or functionality
      depends on the location of users or devices.
    human_activity_recognition: Architectures and algorithms for recognizing human
      activities, including human activity recognition using supervised AI techniques.
    ubiquitous_systems: Design and development of ubiquitous systems and applications
      that use pervasive sensing and processing to provide adaptive services.
- key: spatial_and_positioning_systems
  description: Positioning, mapping, spatial data management, and location intelligence,
    including positioning technologies, mapping APIs, and spatial database systems.
  source_topics:
    positioning_systems: Positioning systems for mobile and ad hoc environments, including
      positioning taxonomies, lateration, time difference of arrival, angulation,
      scene analysis, proximity, GPS, differential GPS, Bluetooth-based positioning,
      PlaceLab, RADAR, Ekahau, sensor fusion, and related frameworks.
    geospatial_mapping: Visualization and use of geospatial data on maps, including
      mapping APIs.
    location_intelligence: Use of location and spatial data to support location intelligence
      in context-aware systems.
    spatial_databases: Management and storage of spatial data using spatial database
      management systems.
- key: spatial_data_privacy
  description: Privacy issues associated with collecting, managing, and using spatial
    and location data.
  source_topics:
    spatial_data_privacy: Privacy issues associated with the collection, management,
      and use of spatial and location data.
- key: internet_of_things
  description: Internet of Things systems combining high-level applications with low-level
    devices in virtual and real environments.
  source_topics:
    iot_systems: Internet of Things systems combining high-level application aspects
      with low-level devices in virtual and real environments.
- key: edge_fog_and_service_migration
  description: Edge and fog computing for integrating sensor, edge, and cloud resources,
    including orchestration, distributed intelligence, offloading, mobility-related
    deployment, and migration of services in response to mobility.
  source_topics:
    edge_fog_computing: Edge and fog computing for integrating sensor, edge, and cloud
      resources, including distributed control and intelligence, offloading, proactive
      approaches, mobility prediction, ETSI Mobile Edge Computing, orchestration,
      ETSI MANO, and deployment in 5G environments.
    service_migration: Migration of services in response to user or device mobility
      in distributed and mobile edge environments.
- key: mobile_systems_middleware
  description: Middleware for mobile systems, including Internet and Web principles,
    service-oriented architecture, mobile-computing and cross-layering principles,
    and mobile architectural patterns.
  source_topics:
    mobile_middleware: Middleware for mobile systems, including middleware motivations
      and principles, Internet and Web principles, SOA principles, mobile-computing
      and cross-layering principles, and architectural patterns for mobile computing.
- key: virtualization_and_containerization
  description: Virtualization, containers, Docker, Kubernetes, and infrastructure-as-a-service
    and platform-as-a-service environments, including their use in software development
    and deployment.
  source_topics:
    virtualization_cloud_services: Virtualization, containers, Docker, Kubernetes,
      and infrastructure-as-a-service and platform-as-a-service services.
    docker_containerization: Use of Docker and container-based environments in software
      development and deployment.
- key: digital_health_overview
  description: Digital health as an interdisciplinary transformation of healthcare
    involving digital technologies, data, artificial intelligence, sensing, monitoring,
    medical devices, mobile health, and health data science.
  source_topics:
    digital_health: Digital health as an interdisciplinary transformation of healthcare
      involving digital technologies, data, artificial intelligence, sensing, monitoring,
      medical devices, mobile health, and health data science.
- key: healthcare_systems_and_efficiency
  description: Healthcare delivery and payer models in national and private contexts,
    together with the use of digital health to improve care processes, reduce errors
    and bias, and reduce procedure time and cost.
  source_topics:
    healthcare_delivery_systems: National and private healthcare delivery systems,
      their operational contexts, costs, advantages, and disadvantages.
    healthcare_payer_models: Payer models associated with healthcare delivery systems
      in different national and private care contexts.
    clinical_efficiency: Use of digital health to improve care-delivery processes,
      reduce errors and bias, and reduce the time and unit or total cost of clinical
      procedures.
- key: personal_health_systems
  description: Personal health informatics and cybernetics, including data from users,
    devices, and platforms, activity recognition, user or patient engagement, behavioral
    change, health maintenance, and mobile-health applications.
  source_topics:
    personal_health_informatics: The informatics direction of personal health systems,
      including obtaining and interpreting data from users, devices, and platforms,
      with activity recognition as a covered example.
    personal_health_cybernetics: The cybernetic direction of personal health systems,
      including interventions, user or patient engagement, behavioral change, convergence,
      and health maintenance.
    behavior_change_models: Behavioral-change models used to understand and support
      user engagement, intervention, and health maintenance in digital health systems.
    mobile_health: Mobile-health applications and smartphone-based personal health
      systems for monitoring, diagnosis, intervention, support, empowerment, compliance,
      and lifestyle-related measures.
    smart_homes: Smart homes as complex digital-health platforms integrating devices,
      solutions, sensing, and services for personal health purposes.
    health_outcomes_measurement: Measurement of health and wellbeing outcomes to assess
