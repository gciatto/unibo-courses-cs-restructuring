analysis:
  mode: all-courses
source_clusters:
- id: 12
  name: Knowledge Engineering Extraction (12)
course:
  id: '95639'
  name: Industry 4.0
topics:
  cloud_computing: Cloud computing for Big Data, including comparisons between on-premises
    and cloud clusters, cloud technology stacks, and deployment of case studies on
    cloud providers.
  computer_vision: Computer-vision topics and applications, including image representation,
    object detection and classification, classical techniques, and deep-learning solutions.
  digital_image_processing: Basic concepts, algorithms, tools, and systems for processing
    and analyzing digital images.
  digital_transformation_design: Designing digital transformation initiatives by defining
    business challenges, generating technology-based ideas, deploying solutions, and
    conducting presentation and follow-up activities.
  digital_twins: Digital-twin concepts and their use in simulation.
  digitalization_impacts: Effects of digitalization and the information-technology
    revolution across astronomical, ecological, political, economic, social, and individual
    domains.
  edge_fog_computing: Edge and fog computing for integrating sensor, edge, and cloud
    resources, including distributed control and intelligence, offloading, proactive
    approaches, mobility prediction, ETSI Mobile Edge Computing, orchestration, ETSI
    MANO, and deployment in 5G environments.
  embedded_systems: Embedded-system hardware and software, including microcontrollers,
    systems-on-chip, sensors, actuators, electronics, and programming models such
    as super-loops, tasks, and real-time operating-system-based architectures.
  image_classification: Image classification using linear classifiers and fully connected
    neural networks.
  image_representation: Image representations based on Bag of Visual Words, representation
    learning, convolutional layers, pooling, and batch normalization.
  industrial_digital_transformation: Industrial digital transformation, including
    its cross-disciplinary drivers, technology-driven business models, organizational
    considerations, and future trends.
  industrial_iot_architectures: Scalable Industrial IoT architectures, reference architectures,
    interoperability standards, and architectural trade-offs in industrial scenarios.
  industry_4_0: Foundations, drivers, technologies, trends, applications, and implications
    of Industry 4.0.
  industry_5_0: Emerging Industry 5.0 approaches and human-centered paradigms in industrial
    technology.
  iot_systems: Internet of Things systems combining high-level application aspects
    with low-level devices in virtual and real environments.
  machine_learning: Fundamental machine-learning technologies and algorithms for developing
    intelligent applications.
  neural_networks_deep_learning: Neural networks and deep-learning techniques, including
    their use in machine-learning applications.
  object_detection: Techniques for detecting objects in images and videos.
  smart_sensors: Smart sensors and sensor operating principles for collecting data
    in Internet-of-Things and agricultural applications.
  technology_assessment: Analysis and diagnosis of company technologies, together
    with an overview of relevant technologies, architectures, and procedures.
  web_of_things: Introductory Web of Things concepts for connecting and integrating
    embedded and Internet-of-Things devices with Web technologies.
