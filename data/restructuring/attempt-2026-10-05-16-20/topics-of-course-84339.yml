analysis:
  mode: all-courses
source_clusters:
- id: 8
  name: Databases Database Systems (8)
course:
  id: '84339'
  name: Advanced Database Systems
topics:
  active_databases: Active database concepts and programming.
  data_models: Structured, semi-structured, and unstructured data models.
  database_administration: Administration of relational database management systems.
  database_architectures: Database management system architectures, including three-tier
    and client-server architectures, with introductory coverage of distributed and
    cloud database systems.
  database_programming: Programming with relational database management systems.
  database_resource_optimization: Provisioning and optimization of database resources.
  database_sharding: Sharding architectures for NoSQL database management systems.
  nosql_data_model_design: Design of non-relational data models, including document-based,
    graph-based, and column-oriented models.
  nosql_databases: Introductory coverage of NoSQL systems, architectures, and non-relational
    data models.
