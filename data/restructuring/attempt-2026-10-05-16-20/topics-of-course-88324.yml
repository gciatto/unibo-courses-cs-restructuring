analysis:
  mode: all-courses
source_clusters:
- id: 25
  name: Administration Systems System (25)
course:
  id: '88324'
  name: System Administration T
topics:
  authentication_models: Authentication systems and principles for designing secure
    authentication protocols.
  centralized_monitoring: Centralized monitoring platforms for large and heterogeneous
    installations, including the SNMP protocol.
  computer_networks: Basic concepts of computer networks.
  configuration_as_code: Automated creation and configuration of virtual systems using
    configuration-as-code and automation tools such as OpenTofu, Vagrant, and Ansible.
  distributed_naming: Resource naming in distributed systems, including DNS and advanced
    name systems.
  distributed_systems: Concepts and organization of distributed systems.
  file_systems: File systems as an operating-system component.
  hardware_setup: Hardware setup activities as part of local GNU/Linux system administration.
  high_availability: Basic concepts of availability and high-availability distributed
    systems.
  network_configuration_management: Configuration of network interfaces and routing,
    together with tools for monitoring network connections.
  network_configuration_protocols: Network configuration and management protocols,
    including NETCONF and automatic configuration protocols such as RARP, BOOTP, and
    DHCP.
  operating_systems: Operating-system structure and main functions.
  processes_threads: Processes and threads in operating systems.
  resource_management: Management and awareness of system resources across layers
    when designing distributed and system-level solutions.
  shell_scripting: Shell use and shell scripting.
  system_administration: Operating-system system administration procedures.
  system_daemons: Standard system daemons used to automate administration tasks, including
    scheduled execution and logging.
  system_monitoring: Command-line monitoring of system processes and resource usage.
  user_account_authorization: Management of user accounts and authorization mechanisms
    on Unix filesystems.
  virtual_systems: Introduction to the structure and implementation of virtual systems.
