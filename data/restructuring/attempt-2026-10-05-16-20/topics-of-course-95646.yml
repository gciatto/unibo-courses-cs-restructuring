analysis:
  mode: all-courses
source_clusters:
- id: 4
  name: Internet Things Systems (4)
course:
  id: '95646'
  name: Virtualized Systems
topics:
  authentication_models: Authentication systems and principles for designing secure
    authentication protocols.
  cloud_computing: Cloud computing for Big Data, including comparisons between on-premises
    and cloud clusters, cloud technology stacks, and deployment of case studies on
    cloud providers.
  cloud_service_models: Service and cloud computing models used to organize and design
    large distributed and cloud systems.
  configuration_as_code: Automated creation and configuration of virtual systems using
    configuration-as-code and automation tools such as OpenTofu, Vagrant, and Ansible.
  distributed_file_systems: Distributed file systems for storing and managing Big
    Data across distributed infrastructures.
  docker_containerization: Use of Docker and container-based environments in software
    development and deployment.
  internet_protocols: Internet addressing and forwarding mechanisms, including IP
    addressing, IP forwarding, ICMP, DHCP, and Network Address Translation (NAT).
  message_oriented_middleware: Message-oriented middleware, including message-oriented
    communication environments and middleware-based message exchange.
  microservices_architecture: Microservices as a distributed software-architecture
    style and as an architectural choice for subsystems.
  network_firewalls: Firewalls for preventing network-based attacks.
  secure_network_communications: Secure communication protocols and virtual private
    networks for protecting data in transit.
  serverless_computing: Function-as-a-Service models and supporting frameworks as
    an evolution toward scalable asynchronous enterprise-server architectures.
  shell_scripting: Shell use and shell scripting.
  virtual_machines: Virtual machines and their implementation.
  virtual_networks: Virtual network systems and their implementation.
  virtualization_cloud_services: Virtualization, containers, Docker, Kubernetes, and
    infrastructure-as-a-service and platform-as-a-service services.
