analysis:
  mode: all-courses
source_clusters:
- id: 18
  name: Data Management Multimedia (18)
course:
  id: '91269'
  name: Multimedia Data Management
topics:
  data_models: Structured, semi-structured, and unstructured data models.
  dimensionality_reduction: Dimensionality-reduction methods for machine-learning
    data, including principal component analysis (PCA) and DA as specified.
  information_retrieval: Basic information-retrieval models, including Boolean and
    vector-space models, text analysis, and web information retrieval with PageRank.
  multimedia_data_management: Management of multimedia data and content in multimedia
    data-intensive applications and services, including multimedia data-management
    systems.
  multimedia_information: Representation of multimedia information using digital technologies.
  multimedia_retrieval: Multimedia-data retrieval methods, including query formulation,
    sequential retrieval, index-based retrieval, browsing, and retrieval models for
    multimedia content.
  multimedia_semantic_annotation: Automatic techniques for adding semantic annotations
    to multimedia data.
  multimedia_visualization: Visualization paradigms and presentation of multimedia
    data and collections, including interaction-oriented exploration and dimensionality-reduction
    techniques.
  recommender_systems: Web recommender systems for multimedia data and content.
  relevance_feedback: Relevance-feedback techniques for improving the accuracy and
    relevance of multimedia-data retrieval results.
  semantic_web: Architecture, concepts, standards, languages, and technologies of
    the Semantic Web.
  similarity_measures: Measurement of similarities and dissimilarities between data
    items for data-mining analysis.
  social_networks: Social networks as part of Web 1.0 and Web 2.0 environments.
  user_interface_design: Basics of designing user interfaces.
