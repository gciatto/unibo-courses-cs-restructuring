analysis:
  mode: all-courses
source_clusters:
- id: 13
  name: Web Technologies Web-Related (13)
course:
  id: '95605'
  name: Web and Mobile Systems
topics:
  http_web_protocols: Web communication protocols and identifiers, including HTTP,
    URIs, WebSocket, HTTP/2, HTTP/3, and QUIC.
  human_computer_interaction: Human-Computer Interaction and its relationship to user
    experience in the design of interactive services.
  internet_world_wide_web: The Internet and the World Wide Web.
  markup_languages: Markup and presentation languages for Web-oriented digital resources,
    including XHTML, XML, HTML5, and CSS.
  mobile_application_development: Development of mobile applications for Android and
    iOS, including platform setup, SDKs, platform architectures and components, Kotlin,
    Swift, Objective-C, Android Activities, iOS targets, actions, and outlets.
  mobile_user_interfaces: Mobile user-interface development using Android Views, layouts,
    events, resources, Intents, fragments and navigation, iOS Storyboards and UIKit,
    and programmatic interfaces with Compose and SwiftUI.
  software_architecture: Design of a software system's architecture and definition
    of a logical architecture for the problem domain.
  user_interface_design: Basics of designing user interfaces.
