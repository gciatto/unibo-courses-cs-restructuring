analysis:
  mode: all-courses
source_clusters:
- id: 20
  name: Language Natural Processing (20)
course:
  id: B0385
  name: Natural Language Processing
topics:
  basic_text_processing: Basic processing operations for analyzing and preparing natural-language
    text.
  classification_algorithms: Classification models and algorithms, including Bayes
    classifiers, k-nearest neighbor, support vector machines, multiclass classification,
    decision trees, and Bayesian networks where specified.
  convolutional_neural_networks: Convolutional neural networks (CNNs) as a deep-learning
    architecture.
  corpus_construction: Construction and analysis of text corpora for developing prediction
    models in natural-language processing.
  latent_semantic_analysis: Introduction to Latent Semantic Analysis (LSA) for deriving
    representations of text from word-document relationships.
  machine_learning: Fundamental machine-learning technologies and algorithms for developing
    intelligent applications.
  model_evaluation: Evaluation methods for generative and machine-learning models.
  natural_language_processing: Natural language processing as an artificial-intelligence
    topic and application area.
  neural_networks_deep_learning: Neural networks and deep-learning techniques, including
    their use in machine-learning applications.
  recurrent_neural_networks: Recurrent neural networks (RNNs) as a neural-network
    architecture for machine learning.
  sentiment_analysis: Sentiment analysis as a supervised natural-language-processing
    task.
  similarity_measures: Measurement of similarities and dissimilarities between data
    items for data-mining analysis.
  text_classification: Supervised classification of text for tasks such as topic identification.
  text_tokenization: Tokenisation of natural-language text as a core natural-language-processing
    task.
  text_vectorization: Vectorisation of words and documents for representing text in
    computational models, including vector-space representations.
  word_embeddings: Word vectors and word-embedding representations for capturing relationships
    and meaning in text.
