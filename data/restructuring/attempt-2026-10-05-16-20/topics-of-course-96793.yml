analysis:
  mode: all-courses
source_clusters:
- id: 8
  name: Databases Database Systems (8)
course:
  id: '96793'
  name: Information Systems and Database Management
topics:
  data_models: Structured, semi-structured, and unstructured data models.
  database_application_access: Database applications and data-access modalities, including
    examples using Java and .NET C#.
  database_basics: Introductory coverage of databases at an outline level.
  databases_sql: Databases and SQL queries.
  nosql_data_model_design: Design of non-relational data models, including document-based,
    graph-based, and column-oriented models.
  nosql_databases: Introductory coverage of NoSQL systems, architectures, and non-relational
    data models.
  relational_data_model: Structure of the relational data model, integrity constraints,
    and normal forms.
  relational_database_design: Relational database design using the Entity-Relationship
    model, conceptual and logical design, and normalization techniques.
  statistical_data_analysis: Statistical analysis of datasets, including descriptive
    analysis and statistical tests used to understand data and assess models.
