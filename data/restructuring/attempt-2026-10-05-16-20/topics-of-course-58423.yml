analysis:
  mode: all-courses
source_clusters:
- id: 15
  name: Network Networks Programming (15)
course:
  id: '58423'
  name: Internet Architecture
topics:
  client_server_model: Client/server interaction and the design of small client/server
    applications.
  computer_networks: Basic concepts of computer networks.
  http_web_protocols: Web communication protocols and identifiers, including HTTP,
    URIs, WebSocket, HTTP/2, HTTP/3, and QUIC.
  internet_applications: Prominent Internet applications and communication services,
    including email, news, chat, and peer-to-peer file sharing.
  internet_architecture: Organization and structure of the Internet, including internetworking
    fundamentals and communication across LAN, WAN, and MAN environments.
  internet_routing: Routing in the Internet.
  internet_world_wide_web: The Internet and the World Wide Web.
  it_security: Basic information-technology security issues, including viruses and
    phishing.
  link_layer_protocols: Link and network-access protocols and technologies, including
    MAC, Ethernet, IEEE 802.11, HDLC, PPP, ARP, and RARP.
  tcp_ip_protocols: TCP/IP protocol-suite connections and common synchronous and asynchronous
    applications such as remote terminals, file transfer, mail, and news.
  wireless_networking: Wireless networking and its relationship to the Internet.
