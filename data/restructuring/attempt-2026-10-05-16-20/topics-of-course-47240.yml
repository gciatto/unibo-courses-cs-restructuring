analysis:
  mode: all-courses
source_clusters:
- id: 13
  name: Web Technologies Web-Related (13)
course:
  id: '47240'
  name: Web Systems Engineering
topics:
  web_architectures_solution_stacks: Comparison of Web architectures and solution
    stacks, including the LAMP and MEAN stacks.
  web_build_tools: Introduction to build tools used in Web development.
  web_client_side_programming: Client-side Web programming using JavaScript and Ajax,
    including single-page applications and React.js.
  web_frameworks_content_management: Use of Web-development frameworks and content
    management systems.
  web_language_supersets: Web-language supersets and stylesheet syntaxes, including
    TypeScript, SCSS, and SASS.
  web_mobile_application_types: Differences between Web, hybrid, and native applications
    for mobile devices.
  web_server_side_programming: Server-side Web programming and execution environments,
    including Servlets, JSP, event-oriented and stateless models, Node.js, and asynchronous
    I/O management.
