analysis:
  mode: all-courses
source_clusters:
- id: 19
  name: Cultural Heritage Computer (19)
course:
  id: '98618'
  name: '"Document Digitization Techniques "'
topics:
  digital_data_acquisition_storage: Methods for constructing and acquiring digital
    data, together with principles and logical architectures for digital data storage
    and memory.
  digital_image_formats: Digital-image formats used in document digitisation, together
    with considerations for visualisation and storage on different media.
  digital_image_processing: Basic concepts, algorithms, tools, and systems for processing
    and analyzing digital images.
  digital_image_quality_assessment: Methods for verifying the quality of digitised
    images using histograms, distributions, information content, and related quality-control
    procedures.
  document_digitization: Digitisation, digital representation, processing, restoration,
    enhancement, and project planning for printed and handwritten textual documents,
    including cultural-heritage documents.
  image_formation_acquisition: Image formation and acquisition using pinhole cameras,
    perspective projection, lenses, field of view, depth of field, and image sensors.
  image_histograms: Gray-level histograms for digital-image analysis.
  scanner_calibration: Calibration of scanners used to acquire digital images of textual
    documents.
  technical_metadata: The function of technical metadata in the management and documentation
    of digitised images and digital collections.
