analysis:
  mode: all-courses
source_clusters:
- id: 1
  name: Informatics Principles Foundations (1)
course:
  id: '93034'
  name: Foundations of Computer Science T
topics:
  abstract_data_types: Abstract data types, including type definitions and operations
    such as constructors, selectors, predicates, functions, and transformators, with
    related representation and implementation techniques.
  algorithm_design_analysis: Algorithm design and analysis for solving problems with
    computers.
  arrays_matrices: Arrays and matrices, including their organization and representation
    in memory.
  computability_limits: Limitations of effective procedures, including non-decidable
    problems.
  computing_history: Historical development of computer science and computing systems
    from prehistory through the early 1980s, including stored-program electronic computers,
    calculators, mainframes, minicomputers, microprocessors, and personal computers.
  data_structures: Elementary data structures including vectors, records, lists, queues,
    stacks, trees, and graphs.
  file_handling: Input/output and file-handling functions.
  functions_recursion: Functions, parameter passing, and recursive functions.
  grammar_definitions: BNF notation for defining grammars.
  imperative_constructs: Imperative programming concepts, including algorithms and
    programs, data types, assignment, input/output, conditional statements, and iteration.
  information_representation: Representation of information in digital information-technology
    systems.
  language_syntax: Formal description of programming-language syntax, including Backus–Naur
    form and related grammar notation.
  memory_allocation: Memory allocation and direct memory management.
  memory_organization_pointers: Computer memory organization, including addresses,
    words, pointers, pointer arithmetic, and memory representation.
  object_oriented_programming: Fundamental concepts and features of object-oriented
    programming.
  operating_systems: Operating-system structure and main functions.
  program_execution_model: The model by which computer programs are executed.
  program_input_output: Input and output operations in programs, including console
    and file input/output.
  programming_basics: Basic principles of programming.
  programming_in_c: Introduction to programming and software development using the
    C language.
  programming_languages: Introduction to programming languages, including what languages
    are and the role of visual languages.
  recursive_algorithms: Recursive algorithms and the divide-and-conquer methodology.
  scoping_activation_records: Programming-language environments, scoping rules, activation-record
    stacks, and heaps.
  sorting_algorithms: Algorithms for sorting data.
  string_processing: String manipulation and string functions.
  turing_machines: Turing machines as formal models for studying computability and
    the existence of programs computing specified functions.
  von_neumann_architecture: The Von Neumann computer architecture.
