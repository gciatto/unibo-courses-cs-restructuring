  name: Cultural Heritage Computer (19)
course:
  id: B5079
  name: Digital Humanities and Data Management for Cultural Heritage
topics:
  digital_humanities: Digital Humanities concepts, projects, tools, and computational
    technologies for humanities studies.
  digital_resource_design: Conception, design, and implementation of digital resources
    using the languages, models, tools, and principles introduced in the course.
  fair_data_management: FAIR data-management principles—Findability, Accessibility,
    Interoperability, and Reusability—for open research data.
  humanities_data_management: Management of humanities data in bibliographic, archival,
    documentary, and artistic domains.
  linked_open_data: Linked Open Data and the Web of Data, including the integration
    and reuse of linked resources.
  open_science: Theoretical, historical, and social principles of the Open Science
    movement, together with practices for setting up and developing Open Science projects.
