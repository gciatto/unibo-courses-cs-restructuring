analysis:
  mode: all-courses
source_clusters:
- id: 16
  name: Data Algorithms Structures (16)
course:
  id: '81942'
  name: Scalable and Cloud Programming
topics:
  cloud_computing: Cloud computing for Big Data, including comparisons between on-premises
    and cloud clusters, cloud technology stacks, and deployment of case studies on
    cloud providers.
  concurrent_computing: The concurrent programming paradigm.
  distributed_scalability: Scalability considerations in distributed systems.
  distributed_systems: Concepts and organization of distributed systems.
  functional_programming: The functional programming paradigm, including functional
    parameters, closures, and Scala.
  mapreduce_computing: The MapReduce programming paradigm for Big Data, including
    its principles, limitations, algorithm design, and design of non-trivial MapReduce
    problems.
  object_oriented_programming: Fundamental concepts and features of object-oriented
    programming.
  parallel_computation_models: Models of parallel computation used to design and analyze
    parallel algorithms.
  scala_programming: Scala as a blended programming language on the Java platform.
  spark_computing: Apache Spark for Big Data processing, including its architecture,
    data structures, partitioning, shuffling, computation optimization, and Spark
    SQL.
