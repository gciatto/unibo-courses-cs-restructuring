analysis:
  mode: all-courses
source_clusters:
- id: 25
  name: Administration Systems System (25)
course:
  id: 04138
  name: Programming Languages
topics:
  concurrent_computing: The concurrent programming paradigm.
  context_free_grammars_parsing: Context-free grammars, push-down automata, their
    equivalences and principal theorems, and parsing algorithms for LL(1), LR(0),
    SLR, LR(1), and LALR(1) grammars, including YACC.
  exceptions: Exceptions as a programming-language construct.
  functional_programming: The functional programming paradigm, including functional
    parameters, closures, and Scala.
  functions_recursion: Functions, parameter passing, and recursive functions.
  imperative_constructs: Imperative programming concepts, including algorithms and
    programs, data types, assignment, input/output, conditional statements, and iteration.
  language_evolution: Evolution of programming languages from assembly to higher-level
    languages.
  language_implementation: Abstract machines, interpreters, compilers, and implementation
    of programming-language constructs.
  language_semantics: Formal description of programming-language meaning, including
    Structured Operational Semantics.
  language_syntax: Formal description of programming-language syntax, including Backus–Naur
    form and related grammar notation.
  lexical_analysis: Design of lexical analysers, including the use of Lex.
  logic_programming: The logical programming paradigm.
  memory_allocation: Memory allocation and direct memory management.
  object_oriented_programming: Fundamental concepts and features of object-oriented
    programming.
  program_execution_model: The model by which computer programs are executed.
  regular_languages_automata: Regular grammars, regular expressions, finite automata,
    their equivalences, and principal theorems including the pumping lemma.
  scoping_activation_records: Programming-language environments, scoping rules, activation-record
    stacks, and heaps.
  service_oriented_computing: Service-oriented computing, including Jolie.
  type_checking: Types and type-checking mechanisms in programming languages.
