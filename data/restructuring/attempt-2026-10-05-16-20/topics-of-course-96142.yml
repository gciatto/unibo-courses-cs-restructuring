analysis:
  mode: all-courses
source_clusters:
- id: 2
  name: Big Data Cloud (2)
course:
  id: '96142'
  name: Business Intelligence and Big Data M
topics:
  big_data_management: Big Data applications, challenges, technologies, storage approaches,
    programming paradigms, and methodologies for designing Big Data applications.
  big_data_platforms: Data platforms and cloud data platforms for managing and processing
    Big Data.
  business_intelligence: Business intelligence in corporate information systems, including
    the role of BI and the BI pyramid.
  cloud_computing: Cloud computing for Big Data, including comparisons between on-premises
    and cloud clusters, cloud technology stacks, and deployment of case studies on
    cloud providers.
  data_governance: Data governance as part of enterprise data management and data
    strategy.
  data_lakehouse: Data Lakehouse architectures and their role in enterprise Big Data
    platforms.
  data_lakes: Data Lake concepts, architectures, and use as an enabling technology
    for data-mining processes.
  data_visualization: Visualization and graphical representation of datasets and their
    properties, including frequency tables and statistical graphics.
  data_warehousing: Enterprise data warehouse architectures, administration, reporting
    and OLAP analysis, and the data-warehouse lifecycle from data-source and requirements
    analysis through conceptual and logical design, ETL procedures, workload and volume
    assessment, and physical design.
  enterprise_data_strategy: Enterprise data strategy, including strategic approaches
    for managing and using organizational data.
  hadoop_ecosystem: The Hadoop ecosystem and its technologies for Big Data processing,
    including its relationship to Spark.
  nosql_databases: Introductory coverage of NoSQL systems, architectures, and non-relational
    data models.
  spark_computing: Apache Spark for Big Data processing, including its architecture,
    data structures, partitioning, shuffling, computation optimization, and Spark
    SQL.
