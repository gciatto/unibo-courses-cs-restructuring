analysis:
  mode: all-courses
source_clusters:
- id: 29
  name: Informatics Informatic Humanities (29)
course:
  id: '78510'
  name: Informatics
topics:
  computer_hardware_architecture: Hardware architecture of computers.
  computer_networks: Basic concepts of computer networks.
  computer_software_basics: Basic computer software, including the classification
    and use of simple application programs.
  cryptography: Cryptography, including its mathematical foundations, secret-key and
    public-key algorithms, and applications to protection and security in operating
    systems and distributed systems.
  digital_privacy_security: Digital privacy and security issues associated with information
    technology.
  digital_signatures: Digital signatures as a cryptographic mechanism for authentication
    and integrity.
  email_digital_signatures: Email, certified email, and digital signatures.
  internet_world_wide_web: The Internet and the World Wide Web.
  it_security: Basic information-technology security issues, including viruses and
    phishing.
  memory_devices: Memory devices as components of computer architecture.
  operating_systems: Operating-system structure and main functions.
  productivity_software: Individual productivity software, including spreadsheets,
    word processors, and presentation software.
  programming_languages: Introduction to programming languages, including what languages
    are and the role of visual languages.
