analysis:
  mode: all-courses
source_clusters:
- id: 28
  name: Systems Real-Time Real (28)
course:
  id: '95638'
  name: Operational Analytics
topics:
  analytics_types: Types of data analytics, including diagnostic, descriptive, predictive,
    and prescriptive analytics.
  combinatorial_optimization: Modeling and solving complex combinatorial decision-making
    and optimization problems using constraint programming, SAT, SMT, linear programming,
    and integer linear programming approaches.
  descriptive_analytics: Descriptive analysis of data of various types using Python
    libraries.
  ensemble_learning: Ensemble-learning methods, including bagging, boosting, random
    forests, and related ensemble models, for predictive and machine-learning applications.
  feedforward_neural_networks: Feedforward neural-network architectures and their
    use in deep-learning applications.
  integer_linear_programming: Integer linear programming and its extensions and hybrid
    methods for combinatorial optimization.
  machine_learning: Fundamental machine-learning technologies and algorithms for developing
    intelligent applications.
  operational_analytics: Analysis of business processes using operational data, predictive
    analytics, forecasting, and resource-optimization techniques to support competitive
    advantage and operational decision-making.
  predictive_analytics: Predictive data analysis using statistical and machine-learning
    models.
  probability_distributions: Probability concepts and probability distributions used
    in stochastic programming and analysis of experimental data.
  programming_in_python: Programming in Python, including names, visibility, functions,
    objects, classes, and problem-solving applications.
  recurrent_neural_networks: Recurrent neural networks (RNNs) as a neural-network
    architecture for machine learning.
  statistical_data_analysis: Statistical analysis of datasets, including descriptive
    analysis and statistical tests used to understand data and assess models.
  time_series_analysis: Time-series analysis as a method used in the computational
    analysis of data and decision-related processes.
