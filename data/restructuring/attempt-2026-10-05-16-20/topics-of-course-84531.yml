analysis:
  mode: all-courses
source_clusters:
- id: 2
  name: Big Data Cloud (2)
course:
  id: '84531'
  name: Infrastructures For Cloud Computing and Big Data M
topics:
  big_data_management: Big Data applications, challenges, technologies, storage approaches,
    programming paradigms, and methodologies for designing Big Data applications.
  cap_theorem: The CAP theorem in the context of non-relational and Big Data database
    management systems.
  client_server_model: Client/server interaction and the design of small client/server
    applications.
  cloud_computing: Cloud computing for Big Data, including comparisons between on-premises
    and cloud clusters, cloud technology stacks, and deployment of case studies on
    cloud providers.
  cloud_resource_federation: Federation of resources and coordination across multi-cloud
    systems for global distributed infrastructures.
  cloud_service_models: Service and cloud computing models used to organize and design
    large distributed and cloud systems.
  data_centers: Data-center infrastructures supporting global data storage, processing,
    and cloud systems.
  distributed_algorithms: Algorithms designed for distributed systems.
  distributed_communication: Communication mechanisms for distributed systems.
  distributed_consistency: Consistency degrees in distributed systems and their effects
    on service properties, including BASE-related considerations.
  distributed_middleware: Middleware definitions, categories, organization, patterns,
    and operating environments for developing and managing large distributed and cloud
    systems.
  distributed_qos: Systems and protocols for providing and managing quality of service
    in distributed systems.
  distributed_replication: Replication models, strategies, and protocols for distributed
    and cloud systems.
  distributed_scalability: Scalability considerations in distributed systems.
  distributed_systems: Concepts and organization of distributed systems.
  group_communication: Group and many-to-many communication models, protocols, algorithms,
    and multicast mechanisms in distributed systems.
  mapreduce_computing: The MapReduce programming paradigm for Big Data, including
    its principles, limitations, algorithm design, and design of non-trivial MapReduce
    problems.
  message_oriented_middleware: Message-oriented middleware, including message-oriented
    communication environments and middleware-based message exchange.
  message_passing: Message-passing models and implementations for interactions among
    distributed software components.
  nosql_data_model_design: Design of non-relational data models, including document-based,
    graph-based, and column-oriented models.
  nosql_databases: Introductory coverage of NoSQL systems, architectures, and non-relational
    data models.
  parallel_computation_models: Models of parallel computation used to design and analyze
    parallel algorithms.
  spark_computing: Apache Spark for Big Data processing, including its architecture,
    data structures, partitioning, shuffling, computation optimization, and Spark
    SQL.
  stream_processing: Introductory high-performance online stream processing of big
    data over clustered distributed systems.
