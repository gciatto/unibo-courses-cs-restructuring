analysis:
  mode: all-courses
source_clusters:
- id: 1
  name: Informatics Principles Foundations (1)
course:
  id: 09730-A
  name: Principles of Informatics
topics:
  algorithm_design_analysis: Algorithm design and analysis for solving problems with
    computers.
  arrays_matrices: Arrays and matrices, including their organization and representation
    in memory.
  boolean_algebra: Elements of Boolean algebra and logical functions.
  computer_hardware_architecture: Hardware architecture of computers.
  cpu_organization: Internal CPU structure and implementation using a sequential organization,
    including DLX.
  data_structures: Elementary data structures including vectors, records, lists, queues,
    stacks, trees, and graphs.
  digital_logic_networks: Analysis and synthesis of combinational, asynchronous sequential,
    and synchronous sequential logic networks.
  functions: Functions in Python and their use in programming problem solutions.
  graphics_functions: Use of graphic functions in MATLAB/Octave programs.
  non_numeric_information_representation: Representation of non-numerical information
    in digital machines.
  numeric_information_representation: Representation of numeric information in computers,
    including two's complement and floating-point representations.
  program_input_output: Input and output operations in programs, including console
    and file input/output.
  programming_basics: Basic principles of programming.
  programming_in_matlab_octave: Fundamental programming constructs, data structures,
    vector programming, functions, variable visibility, and graphic functions using
    MATLAB/Octave.
  scope_visibility: Names and visibility rules in Python programs.
  von_neumann_architecture: The Von Neumann computer architecture.
