analysis:
  mode: all-courses
source_clusters:
- id: 21
  name: Artificial Intelligence Fundamentals (21)
course:
  id: '92858'
  name: Autonomous and Adaptive Systems M
topics:
  ai_epistemology: Epistemological issues concerning artificial intelligence and its
    approaches.
  ai_ethics: Ethical issues concerning artificial intelligence, cognitive science,
    and robotics.
  ai_safety_alignment: Safety, value alignment, controllability, super-intelligence,
    and self-awareness as open problems in intelligent and autonomous AI systems.
  algorithmic_game_theory: Algorithmic game-theory concepts for multi-agent learning,
    including cooperation, coordination, and social dilemmas.
  autonomous_adaptive_systems: Design, implementation, and evaluation of intelligent
    machines and autonomous systems that adapt and learn through interaction with
    their environment, including automatic and autonomous decision-making.
  bio_inspired_adaptation: Bio-inspired approaches to designing adaptive systems.
  generative_models: Generative deep-learning models and techniques, including adversarial
    and diffusion models.
  intelligent_agents: Agents as systems that exhibit intelligent behavior, including
    the notion of an agent and the construction of systems that simulate human-expert
    behavior in specific disciplines.
  large_action_models: Large action models as language-model-based systems for generating
    or carrying out actions.
  large_language_models: Generative large language models and their use in language-processing
    applications.
  multi_agent_reinforcement_learning: Reinforcement learning by multiple agents, including
    cooperation, coordination, and learning in social dilemmas.
  multi_agent_systems: Conceptual and technical foundations of multi-agent systems
    for modeling and engineering complex computational and socio-technical systems.
  preference_optimization: Training methods based on human preferences for agentic
    AI systems, including reinforcement learning from human feedback and Direct Preference
    Optimization.
  reinforcement_learning: Reinforcement learning as a machine-learning approach.
