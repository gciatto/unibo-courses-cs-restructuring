analysis:
  mode: all-courses
source_clusters:
- id: 21
  name: Artificial Intelligence Fundamentals (21)
course:
  id: '98931'
  name: Fundamentals of Artificial Intelligence
topics:
  ai_planning: Planning problems as a problem-solving approach in artificial intelligence.
  ai_problem_solving: AI problem formulation using states, forward and backward reasoning,
    search-based solving, and problem types including games, constraint satisfaction,
    and planning.
  artificial_intelligence: Introduction to the main principles, methods, history,
    application fields, and problem-solving approaches of artificial intelligence.
  automated_reasoning: Automated reasoning and reasoning agents as techniques for
    intelligent systems.
  bayesian_networks: Representation and reasoning with Bayesian networks, including
    exact and approximate inference.
  constraint_satisfaction: Constraint satisfaction problems as a problem-solving approach
    in artificial intelligence.
  description_logic: Description logic as a computational-logic foundation for knowledge
    representation and automated reasoning.
  event_calculus: Use of the Event Calculus for representing and reasoning about events
    and temporal situations.
  knowledge_based_systems: Knowledge-based systems, including their introduction,
    architectural organization, and use in artificial-intelligence problem solving.
  knowledge_representation: Knowledge representation for artificial-intelligence systems,
    including first-order predicate logic, production rules, knowledge-based systems,
    and introductory formal ontologies.
  logic_programming: The logical programming paradigm.
  ontology_engineering: Knowledge representation and ontology development using OWL
    and related conceptualisation methods.
  probabilistic_reasoning: Reasoning under uncertainty using probability queries and
    independence relationships.
  production_rule_systems: Production rule systems as a knowledge-representation approach
    for artificial intelligence.
  scheduling: Scheduling as a planning and artificial-intelligence problem-solving
    method.
  search_algorithms: Search algorithms for solving problems.
  semantic_networks: Semantic networks for representing terminological knowledge in
    artificial intelligence.
