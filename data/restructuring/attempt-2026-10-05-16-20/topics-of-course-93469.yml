analysis:
  mode: all-courses
source_clusters:
- id: 21
  name: Artificial Intelligence Fundamentals (21)
course:
  id: '93469'
  name: Human Data Science
topics:
  ai_ethics: Ethical issues concerning artificial intelligence, cognitive science,
    and robotics.
  automated_reasoning: Automated reasoning and reasoning agents as techniques for
    intelligent systems.
  data_quality: Assessment and handling of data quality in data-mining workflows.
  data_science: Fundamental data-science methods for processing structured and unstructured
    data and developing intelligent applications.
  digital_decision_making: Effects of digital technologies on decision-making processes
    and methods for considering or predicting future developments.
  human_in_the_loop: Human-machine collaboration workflows in which feedback loops
    preserve human agency, oversight, and understanding of machine-learning model
    behavior.
  machine_learning: Fundamental machine-learning technologies and algorithms for developing
    intelligent applications.
  model_evaluation: Evaluation methods for generative and machine-learning models.
  neural_networks_deep_learning: Neural networks and deep-learning techniques, including
    their use in machine-learning applications.
  predictive_analytics: Predictive data analysis using statistical and machine-learning
    models.
  probabilistic_reasoning: Reasoning under uncertainty using probability queries and
    independence relationships.
  regression_analysis: Regression models and algorithms for predicting continuous
    outcomes.
  sampling_bias: Sampling bias as a source of unreliable or misleading conclusions
    in data analysis and machine-learning applications.
  social_implications_it: Social implications of information technology.
  statistical_data_analysis: Statistical analysis of datasets, including descriptive
    analysis and statistical tests used to understand data and assess models.
  statistical_inference: Inferential statistical methods, including confidence intervals,
    precision and bias, and the practical application of statistical tests.
