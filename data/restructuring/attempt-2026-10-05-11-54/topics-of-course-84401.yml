analysis:
  mode: all-courses
source_clusters:
- id: 4
  name: Internet Things Systems (4)
course:
  id: '84401'
  name: Context-Aware Systems
topics:
  activity_aware_systems: Systems that adapt their behavior based on recognition of
    the user's current activity.
  context_aware_computing: Fundamental concepts, definitions, use cases, architectures,
    and applications of systems that adapt their behavior based on user, device, location,
    or activity context.
  context_aware_task_allocation: Allocation of tasks and workloads using metrics derived
    from the current context of users or devices, such as location.
  data_models: Structured, semi-structured, and unstructured data models.
  distributed_systems: Concepts and organization of distributed systems.
  docker_containerization: Use of Docker and container-based environments in software
    development and deployment.
  edge_fog_computing: Edge and fog computing for integrating sensor, edge, and cloud
    resources, including distributed control and intelligence, offloading, proactive
    approaches, mobility prediction, ETSI Mobile Edge Computing, orchestration, ETSI
    MANO, and deployment in 5G environments.
  geospatial_mapping: Visualization and use of geospatial data on maps, including
    mapping APIs.
  human_activity_recognition: Architectures and algorithms for recognizing human activities,
    including human activity recognition using supervised AI techniques.
  location_aware_systems: Systems that adapt their behavior or provide services based
    on the current location of users or devices.
  location_based_services: Services and applications whose behavior or functionality
    depends on the location of users or devices.
  location_intelligence: Use of location and spatial data to support location intelligence
    in context-aware systems.
  machine_learning: Fundamental machine-learning technologies and algorithms for developing
    intelligent applications.
  mobile_middleware: Middleware for mobile systems, including middleware motivations
    and principles, Internet and Web principles, SOA principles, mobile-computing
    and cross-layering principles, and architectural patterns for mobile computing.
  positioning_systems: Positioning systems for mobile and ad hoc environments, including
    positioning taxonomies, lateration, time difference of arrival, angulation, scene
    analysis, proximity, GPS, differential GPS, Bluetooth-based positioning, PlaceLab,
    RADAR, Ekahau, sensor fusion, and related frameworks.
  service_migration: Migration of services in response to user or device mobility
    in distributed and mobile edge environments.
  software_architecture: Design of a software system's architecture and definition
    of a logical architecture for the problem domain.
  spatial_data_privacy: Privacy issues associated with the collection, management,
    and use of spatial and location data.
  spatial_databases: Management and storage of spatial data using spatial database
    management systems.
  supervised_unsupervised_learning: Supervised and unsupervised machine-learning approaches.
  ubiquitous_systems: Design and development of ubiquitous systems and applications
    that use pervasive sensing and processing to provide adaptive services.
  virtualization_cloud_services: Virtualization, containers, Docker, Kubernetes, and
    infrastructure-as-a-service and platform-as-a-service services.
