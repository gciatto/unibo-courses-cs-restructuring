analysis:
  mode: all-courses
source_clusters:
- id: 0
  name: Security Information Cryptography (0)
course:
  id: '93466'
  name: FONDAMENTI DI CYBERSECURITY
topics:
  access_control_models: Access-control models and their implementation for protecting
    systems and information.
  authentication_models: Authentication systems and principles for designing secure
    authentication protocols.
  cryptographic_key_management: Symmetric and asymmetric cryptographic key-management
    models and systems, including key distribution centers, PKI, and PGP.
  cryptographic_security_properties: Cryptographic security properties including confidentiality,
    authentication, and integrity.
  cryptography: Cryptography, including its mathematical foundations, secret-key and
    public-key algorithms, and applications to protection and security in operating
    systems and distributed systems.
  digital_certificates: Digital certificates used in cryptographic trust and authentication.
  digital_signatures: Digital signatures as a cryptographic mechanism for authentication
    and integrity.
  network_security: Security of communication networks, including privacy, integrity,
    secure network and transport layers, firewalls, and intrusion detection.
  offensive_security: Practical red-team security methods, including vulnerability
    identification, the cybersecurity kill chain, enumeration, scanning, credential
    brute forcing, privilege-escalation exploitation, web-application exploitation,
    and binary-code exploitation.
  reverse_engineering: Reverse engineering techniques for analyzing software and systems
    in the context of cybersecurity.
  security_threats_vulnerabilities_risk: Security threats, vulnerabilities, exploits,
    risks, attack methods, and their impacts on information and systems.
  tor_dark_web: TOR and Dark Web technologies and their role in cybersecurity.
  wireless_communication_systems: Wireless communication systems, including propagation
    and fading models and an overview of wireless technologies such as IEEE 802.11,
    IEEE 802.16, IEEE 802.20, cellular networks, Bluetooth, and ZigBee.
