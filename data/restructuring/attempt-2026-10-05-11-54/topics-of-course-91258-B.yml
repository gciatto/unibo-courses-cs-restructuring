analysis:
  mode: all-courses
source_clusters:
- id: 20
  name: Language Natural Processing (20)
course:
  id: 91258-B
  name: Natural Language Processing
topics:
  computational_linguistics: Computational linguistics concepts relevant to the computational
    processing and analysis of natural language.
  computational_morphology: Computational morphology, including morphological operations,
    static lexica, and two-level morphology.
  computational_phonetics: Computational analysis of speech samples, including acoustic
    properties, acoustic measures, frequency-domain analysis, spectrograms, and acoustic-phonetic
    applications.
  context_free_grammars_parsing: Context-free grammars, push-down automata, their
    equivalences and principal theorems, and parsing algorithms for LL(1), LR(0),
    SLR, LR(1), and LALR(1) grammars, including YACC.
  corpus_construction: Construction and analysis of text corpora for developing prediction
    models in natural-language processing.
  information_retrieval: Basic information-retrieval models, including Boolean and
    vector-space models, text analysis, and web information retrieval with PageRank.
  language_models: Language models, transformer architectures, and efficient attention
    mechanisms for text and language processing.
  lexical_association_measures: Concordances, collocations, and measures of association
    between words in text corpora.
  lexical_semantics: Lexical semantic resources and analysis, including WordNet and
    FrameNet.
  logical_sentence_semantics: Logical approaches to representing and analyzing sentence
    semantics.
  model_evaluation: Evaluation methods for generative and machine-learning models.
  n_gram_language_models: N-gram language models for representing and predicting sequences
    of natural-language tokens.
  named_entity_recognition: Named entity recognition as a downstream natural-language-processing
    task.
  natural_language_parsing: Parsing of natural language using modern parsing formalisms,
    including phrase-structure and dependency approaches.
  natural_language_processing: Natural language processing as an artificial-intelligence
    topic and application area.
  neural_networks_deep_learning: Neural networks and deep-learning techniques, including
    their use in machine-learning applications.
  part_of_speech_tagging: Part-of-speech tagging in natural-language text.
  probability_calculus: Introductory recall of probability calculus for statistical
    and algorithmic natural-language-processing methods.
  prompt_engineering: Prompt-engineering techniques for generative large language
    models.
  semantic_textual_similarity: Semantic textual similarity as a downstream natural-language-processing
    task.
  sentiment_analysis: Sentiment analysis as a supervised natural-language-processing
    task.
  speech_processing: Basic speech-processing concepts covered as an element of natural-language
    processing.
  speech_recognition: Use of speech-recognition software to convert spoken or voice
    input into written text, including speaker-independent and speaker-dependent tools.
  text_classification: Supervised classification of text for tasks such as topic identification.
  treebanks: Treebanks as resources for computational syntax and natural-language
    parsing.
  word_embeddings: Word vectors and word-embedding representations for capturing relationships
    and meaning in text.
  word_sense_disambiguation: Word-sense disambiguation in natural-language processing.
