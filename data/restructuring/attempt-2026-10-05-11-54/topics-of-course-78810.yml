analysis:
  mode: all-courses
source_clusters:
- id: 25
  name: Administration Systems System (25)
course:
  id: '78810'
  name: Real Time Systems for Automation M
topics:
  concurrent_computing: The concurrent programming paradigm.
  cpu_scheduling: CPU scheduling in operating systems.
  io_management: Operating-system management of input and output operations.
  memory_allocation: Memory allocation and direct memory management.
  object_oriented_programming: Fundamental concepts and features of object-oriented
    programming.
  operating_systems: Operating-system structure and main functions.
  process_synchronization: Concurrent-process problems and synchronization issues,
    including deadlock, starvation, and busy waiting.
  processes_threads: Processes and threads in operating systems.
  programming_in_python: Programming in Python, including names, visibility, functions,
    objects, classes, and problem-solving applications.
  real_time_resource_access_protocols: Shared-resource access protocols for real-time
    systems, including priority inheritance, priority-ceiling, immediate priority-ceiling,
    and stack resource protocols.
  real_time_scheduling: Clock-driven and priority-driven scheduling approaches for
    real-time systems, including RM, DM, EDF, and LSTF algorithms and server-based
    strategies for soft real-time aperiodic tasks.
  real_time_systems: Introduction to real-time systems, including their distinguishing
    features and typical application domains, with emphasis on design issues, implementation
    strategies, support environments, and performance evaluation.
  real_time_task_models: Hard and soft real-time tasks and temporal reference models
    for periodic, sporadic, and aperiodic tasks.
  shell_scripting: Shell use and shell scripting.
  system_calls: System calls used by programs to request operating-system services.
