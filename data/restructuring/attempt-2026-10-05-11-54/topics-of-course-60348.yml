analysis:
  mode: all-courses
source_clusters:
- id: 1
  name: Informatics Principles Foundations (1)
course:
  id: '60348'
  name: Informatics
topics:
  algorithm_design_analysis: Algorithm design and analysis for solving problems with
    computers.
  computational_complexity: Computational complexity and complexity classes, including
    P, NP, NP-complete problems, the P versus NP question, space complexity classes,
    oracle classes, class hierarchies, and functional classes.
  computer_hardware_architecture: Hardware architecture of computers.
  computer_networks: Basic concepts of computer networks.
  computer_operation: Principles governing the operation of computers.
  computer_performance: Measurement of computer performance and the impact of architecture
    on performance.
  computer_software_basics: Basic computer software, including the classification
    and use of simple application programs.
  development_environment: Use of a development environment for programming.
  imperative_constructs: Imperative programming concepts, including algorithms and
    programs, data types, assignment, input/output, conditional statements, and iteration.
  internet_applications: Prominent Internet applications and communication services,
    including email, news, chat, and peer-to-peer file sharing.
  internet_world_wide_web: The Internet and the World Wide Web.
  it_security: Basic information-technology security issues, including viruses and
    phishing.
  memory_devices: Memory devices as components of computer architecture.
  operating_systems: Operating-system structure and main functions.
  programming_in_r: Programming in R, including structured-programming constructs,
    procedures and functions, implementation of algorithms, and program development.
  r_data_types: Data types in the R language.
  random_number_generation: Generation and use of random values in R.
  software_testing: Testing activities for software systems.
