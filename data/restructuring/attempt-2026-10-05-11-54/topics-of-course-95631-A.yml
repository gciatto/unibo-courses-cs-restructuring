analysis:
  mode: all-courses
source_clusters:
- id: 2
  name: Big Data Cloud (2)
course:
  id: 95631-A
  name: Machine Learning and Data Mining
topics:
  association_rule_mining: Mining association rules from data.
  attention_mechanisms: Attention mechanisms used in computer-vision models, including
    their relationship to Transformer architectures.
  chatbots_function_calling: Chatbot construction and function-call generation in
    language-processing applications.
  classification_algorithms: Classification models and algorithms, including Bayes
    classifiers, k-nearest neighbor, support vector machines, multiclass classification,
    decision trees, and Bayesian networks where specified.
  clustering: Clustering methods for unsupervised learning, including K-means and
    expectation-maximization (EM).
  crisp_dm_methodology: The CRISP-DM methodology and its application to data-mining
    projects, including business and data understanding, data preparation, modeling,
    evaluation, and deployment-oriented project activities.
  data_mining: Data-mining techniques and workflows, including knowledge discovery,
    data understanding and preparation, classification with decision trees and Bayesian
    networks, association rules, clustering, outlier detection, validation, and practical
    use of mining tools.
  data_models: Structured, semi-structured, and unstructured data models.
  data_preprocessing: Preparation of data for mining and machine-learning analysis,
    including data acquisition, preprocessing, and transformation.
  data_quality: Assessment and handling of data quality in data-mining workflows.
  feature_engineering: Selection, creation, and extraction of attributes or features
    for data-mining and machine-learning models.
  graph_machine_learning: Graph machine-learning methods.
  information_extraction: Information extraction from text as a practical text-mining
    and language-processing application.
  information_retrieval: Basic information-retrieval models, including Boolean and
    vector-space models, text analysis, and web information retrieval with PageRank.
  language_models: Language models, transformer architectures, and efficient attention
    mechanisms for text and language processing.
  large_action_models: Large action models as language-model-based systems for generating
    or carrying out actions.
  large_language_models: Generative large language models and their use in language-processing
    applications.
  machine_learning: Fundamental machine-learning technologies and algorithms for developing
    intelligent applications.
  model_compression_quantization: Model-compression and efficiency techniques for
    machine-learning and deep-learning models, including quantization, sparsity, depthwise
    convolutions, inverse bottlenecks, and optimized attention.
  model_evaluation: Evaluation methods for generative and machine-learning models.
  model_validation: Understanding and validation of data-mining and machine-learning
    results.
  neural_networks_deep_learning: Neural networks and deep-learning techniques, including
    their use in machine-learning applications.
  neurosymbolic_ai: Neuro-symbolic methods for trustworthy artificial intelligence.
  outlier_detection: Detection of outliers in data-mining analysis.
  parameter_efficient_fine_tuning: Parameter-efficient fine-tuning methods such as
    QLoRA and prompt tuning.
  programming_in_python: Programming in Python, including names, visibility, functions,
    objects, classes, and problem-solving applications.
  prompt_engineering: Prompt-engineering techniques for generative large language
    models.
  retrieval_augmented_generation: Retrieval-augmented generation using vector databases.
  sentiment_analysis: Sentiment analysis as a supervised natural-language-processing
    task.
  similarity_measures: Measurement of similarities and dissimilarities between data
    items for data-mining analysis.
  statistical_data_analysis: Statistical analysis of datasets, including descriptive
    analysis and statistical tests used to understand data and assess models.
  supervised_unsupervised_learning: Supervised and unsupervised machine-learning approaches.
  text_classification: Supervised classification of text for tasks such as topic identification.
  text_mining: Text representation, retrieval, classification, opinion mining, summarization,
    and information extraction, with practical text-mining case studies.
  text_summarization: Text summarization as a practical text-mining and language-processing
    application.
  vision_language_models: Vision-language models for multimodal language and vision
    applications.
