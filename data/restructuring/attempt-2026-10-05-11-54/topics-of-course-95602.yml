analysis:
  mode: all-courses
source_clusters:
- id: 7
  name: Informatica Computer Science (7)
course:
  id: '95602'
  name: Programming and Computer Architectures
topics:
  algorithm_design_analysis: Algorithm design and analysis for solving problems with
    computers.
  basic_data_types: Basic Python data types and their use in solving problems.
  binary_encoding: Binary encoding of information.
  cloud_computing: Cloud computing for Big Data, including comparisons between on-premises
    and cloud clusters, cloud technology stacks, and deployment of case studies on
    cloud providers.
  computer_hardware_architecture: Hardware architecture of computers.
  computer_operation: Principles governing the operation of computers.
  computer_performance: Measurement of computer performance and the impact of architecture
    on performance.
  computing_history: Historical development of computer science and computing systems
    from prehistory through the early 1980s, including stored-program electronic computers,
    calculators, mainframes, minicomputers, microprocessors, and personal computers.
  data_structures: Elementary data structures including vectors, records, lists, queues,
    stacks, trees, and graphs.
  data_visualization: Visualization and graphical representation of datasets and their
    properties, including frequency tables and statistical graphics.
  digital_logic_networks: Analysis and synthesis of combinational, asynchronous sequential,
    and synchronous sequential logic networks.
  functions: Functions in Python and their use in programming problem solutions.
  memory_devices: Memory devices as components of computer architecture.
  object_mutability: Immutable and mutable objects in Python.
  parallel_architectures: Parallel computer architectures, as introduced in the course
    alongside computer architecture and digital logic.
  programming_in_python: Programming in Python, including names, visibility, functions,
    objects, classes, and problem-solving applications.
  scope_visibility: Names and visibility rules in Python programs.
  semiconductor_manufacturing: Computer-chip production as covered in the context
    of digital logic, computer components, and modern computer architectures.
  spreadsheet_data_processing: Organizing, cleaning, and processing data in spreadsheets,
    including the use of Excel for data-processing tasks.
  statistical_data_analysis: Statistical analysis of datasets, including descriptive
    analysis and statistical tests used to understand data and assess models.
  web_page_processing: Working with Web pages through Python libraries, as identified
    in the course learning outcomes.
