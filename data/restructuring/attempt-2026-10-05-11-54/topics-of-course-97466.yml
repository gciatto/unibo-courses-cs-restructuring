  mode: all-courses
source_clusters:
- id: 14
  name: Engineering Software Cultural (14)
course:
  id: '97466'
  name: Digital represention of the Landscape Project
topics:
  cad_technical_drawing: Basic use of computer-aided design tools for representing
    buildings and architectural components and for creating and managing digital technical
    drawings and architectural sheets.
  digital_graphics: Digital graphics as part of digital information processing.
  digital_image_processing: Basic concepts, algorithms, tools, and systems for processing
    and analyzing digital images.
  graphic_library_management: Organization and management of graphic libraries supporting
    landscape-project representation.
  landscape_survey_representation: Methods and techniques for surveying, interpreting,
    and digitally representing landscapes, open spaces, site conditions, vegetation,
    and related design projects.
  layout_sheet_organization: Logical organization, pagination, sequencing, layout,
    headers, printing, and presentation of drawing sheets for landscape and open-space
    projects.
  raster_graphics: Raster graphics, including pixels, color space, image and device
    resolution, common raster formats, lossy and lossless compression, and practical
    use of Adobe Photoshop.
  vector_graphics: Vector graphics and digital technical drawing, including graphic
    primitives, modification tools, layers, line styles and weights, screen frequency,
    printing, graphic layouts, and common vector and vector/raster formats.
