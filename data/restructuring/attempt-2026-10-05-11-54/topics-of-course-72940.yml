analysis:
  mode: all-courses
source_clusters:
- id: 20
  name: Language Natural Processing (20)
course:
  id: '72940'
  name: Computational Models And Languages M
topics:
  computability_limits: Limitations of effective procedures, including non-decidable
    problems.
  context_free_grammars_parsing: Context-free grammars, push-down automata, their
    equivalences and principal theorems, and parsing algorithms for LL(1), LR(0),
    SLR, LR(1), and LALR(1) grammars, including YACC.
  functional_programming: The functional programming paradigm, including functional
    parameters, closures, and Scala.
  functions_recursion: Functions, parameter passing, and recursive functions.
  grammar_definitions: BNF notation for defining grammars.
  javascript_programming: JavaScript as a dynamic functional language with a prototype-based
    object model.
  kotlin_programming: Use of the Kotlin programming language in software-system development.
  lambda_calculus: Basic concepts of lambda calculus as a model for function evaluation.
  language_implementation: Abstract machines, interpreters, compilers, and implementation
    of programming-language constructs.
  language_semantics: Formal description of programming-language meaning, including
    Structured Operational Semantics.
  language_syntax: Formal description of programming-language syntax, including Backus–Naur
    form and related grammar notation.
  lexical_analysis: Design of lexical analysers, including the use of Lex.
  model_driven_software_development: Model-Driven Software Development using executable
    requirement and problem models and custom metamodels.
  regular_languages_automata: Regular grammars, regular expressions, finite automata,
    their equivalences, and principal theorems including the pumping lemma.
  scala_programming: Scala as a blended programming language on the Java platform.
  turing_machines: Turing machines as formal models for studying computability and
    the existence of programs computing specified functions.
