analysis:
  mode: all-courses
source_clusters:
- id: 25
  name: Administration Systems System (25)
course:
  id: '96642'
  name: Virtualization and System Integration
topics:
  authentication_models: Authentication systems and principles for designing secure
    authentication protocols.
  centralized_configuration: Centralized and automated configuration of distributed
    systems, services, applications, and local or distributed infrastructure.
  centralized_monitoring: Centralized monitoring platforms for large and heterogeneous
    installations, including the SNMP protocol.
  cloud_computing: Cloud computing for Big Data, including comparisons between on-premises
    and cloud clusters, cloud technology stacks, and deployment of case studies on
    cloud providers.
  cryptographic_protocols: Basic cryptographic protocols and protocols or systems
    such as SSL and PGP.
  distributed_communication: Communication mechanisms for distributed systems.
  distributed_file_systems: Distributed file systems for storing and managing Big
    Data across distributed infrastructures.
  distributed_systems: Concepts and organization of distributed systems.
  docker_containerization: Use of Docker and container-based environments in software
    development and deployment.
  identity_management: Identity-management systems, platforms, and protocols, including
    Windows Active Directory and LDAP and Linux Kerberos and OpenLDAP environments.
  industrial_protocols: Protocols for integrating software systems with industrial
    systems and programmable logic controllers, including OPC.
  internet_protocols: Internet addressing and forwarding mechanisms, including IP
    addressing, IP forwarding, ICMP, DHCP, and Network Address Translation (NAT).
  message_oriented_middleware: Message-oriented middleware, including message-oriented
    communication environments and middleware-based message exchange.
  microservices_architecture: Microservices as a distributed software-architecture
    style and as an architectural choice for subsystems.
  network_configuration_management: Configuration of network interfaces and routing,
    together with tools for monitoring network connections.
  network_firewalls: Firewalls for preventing network-based attacks.
  network_proxying: Network proxying and relay mechanisms, including proxy tools and
    SOCKS protocols.
  secure_network_communications: Secure communication protocols and virtual private
    networks for protecting data in transit.
  system_administration: Operating-system system administration procedures.
  system_integration: Integration of heterogeneous operating systems, services, APIs,
    and applications, including interactions between Windows and Linux systems and
    supporting integration tools and methods.
  virtual_machines: Virtual machines and their implementation.
  virtual_networks: Virtual network systems and their implementation.
  virtualization_cloud_services: Virtualization, containers, Docker, Kubernetes, and
    infrastructure-as-a-service and platform-as-a-service services.
