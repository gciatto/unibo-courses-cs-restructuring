analysis:
  mode: all-courses
source_clusters:
- id: 4
  name: Internet Things Systems (4)
course:
  id: B8019
  name: PROGRAMMING THE INTERNET OF THINGS M
topics:
  device_description_languages: Device description languages for specifying IoT things
    and devices, including the Atlas Device Description Language (IoT-DDL).
  distributed_middleware: Middleware definitions, categories, organization, patterns,
    and operating environments for developing and managing large distributed and cloud
    systems.
  human_in_the_loop: Human-machine collaboration workflows in which feedback loops
    preserve human agency, oversight, and understanding of machine-learning model
    behavior.
  intelligent_system_perception_actuation: Perception and actuation technologies as
    components of intelligent systems.
  iot_platforms: IoT platforms used for deploying and programming IoT systems, including
    Raspberry Pi, Arduino, and Mbed OS.
  iot_programming_models: Programming and application models for IoT systems, including
    the SODA application model and the separation of IoT deployment from smart-space
    programmability and application development.
  iot_systems: Internet of Things systems combining high-level application aspects
    with low-level devices in virtual and real environments.
  iot_transaction_models: Transactional models for IoT applications, including the
    IoTranx model.
  radio_frequency_identification: Radio Frequency Identification (RFID) technologies
    and their use in digitally enabled objects.
  service_oriented_computing: Service-oriented computing, including Jolie.
  smart_spaces: Smart spaces as instrumented environments with associated constraints,
    requirements, deployment challenges, and assistive-environment applications.
  software_architecture: Design of a software system's architecture and definition
    of a logical architecture for the problem domain.
