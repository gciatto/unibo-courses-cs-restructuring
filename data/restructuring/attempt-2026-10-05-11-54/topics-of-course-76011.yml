analysis:
  mode: all-courses
source_clusters:
- id: 19
  name: Cultural Heritage Computer (19)
course:
  id: '76011'
  name: Multimedia Technologies in Archaelogy
topics:
  archaeological_surveying: Archaeological site surveying and documentation using
    total stations, laser scanners, GNSS receivers, and digital photogrammetry.
  cultural_heritage_communication: Principles, strategies, and technologies for communicating
    cultural heritage.
  digital_graphics: Digital graphics as part of digital information processing.
  laser_scanning: Laser-scanning techniques for documenting archaeological sites and
    acquiring three-dimensional point-cloud data.
  markup_languages: Markup and presentation languages for Web-oriented digital resources,
    including XHTML, XML, HTML5, and CSS.
  multimedia_information: Representation of multimedia information using digital technologies.
  photogrammetry: Principles of photogrammetry for the three-dimensional reconstruction
    of cultural-heritage objects.
  point_cloud_processing: Workflows for processing three-dimensional models and point
    clouds acquired through laser scanning and image-based photogrammetry.
  three_dimensional_modeling: Three-dimensional modeling using software tools, including
    applications to cultural-heritage objects and fashion design.
  vector_graphics: Vector graphics and digital technical drawing, including graphic
    primitives, modification tools, layers, line styles and weights, screen frequency,
    printing, graphic layouts, and common vector and vector/raster formats.
  virtual_reconstruction: Methodologies for scientifically reliable virtual reconstruction
    of archaeological objects and contexts, including information analysis, two-dimensional
    representation, three-dimensional modeling, and presentation to the public.
