analysis:
  mode: all-courses
source_clusters:
- id: 5
  name: Computing Education Informatics (5)
course:
  id: '81934'
  name: HUMAN COMPUTER INTERACTION
topics:
  advanced_interaction_paradigms: Interaction paradigms beyond traditional interfaces,
    including their rationale, vision, contemporary examples, and associated development
    tools.
  gesture_based_interaction: Gesture-based interaction paradigms and related approaches
    to designing and developing interactive systems.
  human_computer_interaction: Human-Computer Interaction and its relationship to user
    experience in the design of interactive services.
  interaction_design: Design of interaction systems and interactive applications using
    tasks, design methods, and human-centered development processes.
  interaction_models: Foundational models and frameworks for human-computer interaction,
    including Norman’s Model of Interaction and the Abowd and Beale interaction framework.
  mental_models: Mental models as a consideration in the design of human-computer
    interactions.
  prototyping: Low- and high-fidelity prototyping as methods for developing and evaluating
    interactive applications.
  tangible_interaction: Tangible interaction paradigms and related approaches to designing
    interactive systems.
  usability_evaluation: Theories and methods for evaluating interface usability, including
    heuristic evaluation and introductory user-study approaches.
  user_experience_design: User Experience and Experience Design principles and methodologies
    for designing interactive applications and systems.
  user_interface_design: Basics of designing user interfaces.
  user_research_methods: User-centered research methods, including semi-structured
    interviews, contextual inquiry, observation, personas, empathy maps, experience
    maps, surveys, and research planning.
  voice_user_interfaces: Voice-user-interface paradigms and related approaches to
    designing and developing interactive systems.
