analysis:
  mode: all-courses
source_clusters:
- id: 26
  name: Programming Software Design (26)
course:
  id: B8554
  name: SISTEMI SOFTWARE A OGGETTI T
topics:
  abstract_data_types: Abstract data types, including type definitions and operations
    such as constructors, selectors, predicates, functions, and transformators, with
    related representation and implementation techniques.
  algorithm_design_analysis: Algorithm design and analysis for solving problems with
    computers.
  csharp_dotnet_programming: Introduction to the .NET framework and the C# programming
    language.
  data_structures: Elementary data structures including vectors, records, lists, queues,
    stacks, trees, and graphs.
  design_patterns: Design patterns used in software design.
  event_driven_computing: Event-driven computational models and applications, including
    proactive-reactive distributed software.
  exceptions: Exceptions as a programming-language construct.
  file_handling: Input/output and file-handling functions.
  functional_programming: The functional programming paradigm, including functional
    parameters, closures, and Scala.
  graphical_user_interfaces: Graphical user interfaces in Java applications.
  hash_tables: Hash tables as a data structure.
  java_language_features: Java language features including generics, annotations,
    inner classes, and lambda expressions.
  kotlin_programming: Use of the Kotlin programming language in software-system development.
  object_oriented_programming: Fundamental concepts and features of object-oriented
    programming.
  object_oriented_software_design: Analysis and design of software systems using abstraction,
    information hiding, inheritance, polymorphism, delegation, and other object-oriented
    techniques.
  object_serialization: Serialization and deserialization of objects as part of object-oriented
    application development, including object serialization in Java.
  programming_in_java: Introduction to implementing and using data structures in Java,
    including basic Java language notions.
  programming_languages: Introduction to programming languages, including what languages
    are and the role of visual languages.
  scala_programming: Scala as a blended programming language on the Java platform.
