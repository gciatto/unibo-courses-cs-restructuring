analysis:
  mode: all-courses
source_clusters:
- id: 15
  name: Network Networks Programming (15)
course:
  id: '95644'
  name: Computer Networks and Network Programming
topics:
  access_control_models: Access-control models and their implementation for protecting
    systems and information.
  authentication_models: Authentication systems and principles for designing secure
    authentication protocols.
  client_server_model: Client/server interaction and the design of small client/server
    applications.
  computer_networks: Basic concepts of computer networks.
  digital_certificates: Digital certificates used in cryptographic trust and authentication.
  digital_signatures: Digital signatures as a cryptographic mechanism for authentication
    and integrity.
  internet_protocols: Internet addressing and forwarding mechanisms, including IP
    addressing, IP forwarding, ICMP, DHCP, and Network Address Translation (NAT).
  internet_routing: Routing in the Internet.
  network_configuration_protocols: Network configuration and management protocols,
    including NETCONF and automatic configuration protocols such as RARP, BOOTP, and
    DHCP.
  network_services: Functional principles of network services and basic network applications
    in Internet-oriented networking.
  protocol_analysis: Network-protocol analysis through traffic sniffing, traffic-trace
    collection, debugging, and use of the Wireshark protocol analyzer.
  transport_layer_protocols: Transport-layer services and mechanisms, including multiplexing
    and demultiplexing, connectionless communication with UDP, reliable data transfer,
    connection-oriented communication with TCP, and congestion control.
