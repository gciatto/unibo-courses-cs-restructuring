analysis:
  mode: all-courses
source_clusters:
- id: 12
  name: Knowledge Engineering Extraction (12)
course:
  id: '85446'
  name: Knowledge Representation and Extraction
topics:
  description_logic: Description logic as a computational-logic foundation for knowledge
    representation and automated reasoning.
  generative_ai_models: Generative AI models used as statistical methods for extracting
    knowledge from arbitrary content.
  graph_based_data_analysis: Graph-based analysis methods for extracting knowledge
    from content and data.
  information_extraction: Information extraction from text as a practical text-mining
    and language-processing application.
  knowledge_extraction: Methods and technologies for automatically extracting machine-queryable
    knowledge from text and other arbitrary content.
  knowledge_graphs: Knowledge Graph concepts, applications, programming, visualisation,
    and analytics for semantic management of knowledge.
  knowledge_representation: Knowledge representation for artificial-intelligence systems,
    including first-order predicate logic, production rules, knowledge-based systems,
    and introductory formal ontologies.
  linguistic_patterns: Linguistic patterns used as heuristics for extracting knowledge
    from text.
  linked_open_data: Linked Open Data and the Web of Data, including the integration
    and reuse of linked resources.
  ontology_design_patterns: Ontology design patterns for structuring and representing
    knowledge.
  ontology_engineering: Knowledge representation and ontology development using OWL
    and related conceptualisation methods.
  requirements_analysis: Analysis of software requirements as part of software-system
    planning and development.
  rule_based_extraction: Rule-based heuristics for extracting knowledge from content.
  semantic_inference: Logical inference over semantic representations and Knowledge
    Graph data.
  semantic_web: Architecture, concepts, standards, languages, and technologies of
    the Semantic Web.
  web_scraping: Methods for retrieving information from websites through web-scraping
    techniques.
