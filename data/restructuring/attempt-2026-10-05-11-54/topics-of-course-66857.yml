  mode: all-courses
source_clusters:
- id: 12
  name: Knowledge Engineering Extraction (12)
course:
  id: '66857'
  name: Logic for Computer Science
topics:
  axiomatic_set_theory: Introduction to ZF axiomatic set theory, including relations,
    functions, quotients, cardinality, and Cantor’s Theorem.
  first_order_logic: Syntax and semantics of first-order logic, including predicates,
    terms, quantifiers, free and bound variables, alpha-conversion, substitution,
    and natural deduction.
  formal_logic_foundations: Paradoxes and their resolution as motivation for formal
    logic and an overview of negative results in computer science.
  grammar_definitions: BNF notation for defining grammars.
  propositional_logic: Syntax, classical and intuitionistic semantics, natural deduction,
    soundness, compactness, and completeness for propositional logic.
  structural_induction_recursion: Structural induction and structural recursion.
