analysis:
  mode: all-courses
source_clusters:
- id: 14
  name: Engineering Software Cultural (14)
course:
  id: '72939'
  name: Software Systems Engineering M
topics:
  agile_software_development: Agile software development practices and approaches.
  ai_code_generation: Use of AI-generated code technologies in software development.
  automatic_code_generation: Automatic source-code generation through software factories
    and development environments in ecosystems such as Eclipse and IntelliJ.
  client_server_model: Client/server interaction and the design of small client/server
    applications.
  coap_mqtt_protocols: Use of CoAP and MQTT protocols for message-based interactions
    among distributed software components and IoT devices.
  development_environment: Use of a development environment for programming.
  devops_practices: DevOps practices and tools supporting the development, deployment,
    and maintenance of software systems.
  distributed_communication: Communication mechanisms for distributed systems.
  distributed_systems: Concepts and organization of distributed systems.
  docker_containerization: Use of Docker and container-based environments in software
    development and deployment.
  domain_specific_languages: Domain-Specific Languages (DSLs) for expressing domain-specific
    software models and solutions.
  event_driven_computing: Event-driven computational models and applications, including
    proactive-reactive distributed software.
  iot_systems: Internet of Things systems combining high-level application aspects
    with low-level devices in virtual and real environments.
  kotlin_programming: Use of the Kotlin programming language in software-system development.
  message_passing: Message-passing models and implementations for interactions among
    distributed software components.
  microservices_architecture: Microservices as a distributed software-architecture
    style and as an architectural choice for subsystems.
  model_driven_software_development: Model-Driven Software Development using executable
    requirement and problem models and custom metamodels.
  requirements_analysis: Analysis of software requirements as part of software-system
    planning and development.
  robotics_autonomous_systems: Design and development of relatively autonomous Differential
    Drive Robot applications using sensors in virtual or real environments.
  software_architecture: Design of a software system's architecture and definition
    of a logical architecture for the problem domain.
  software_build_automation: Build automation tools and practices used in software
    development.
  software_lifecycle: Phases and activities in the lifecycle of software systems,
    including planning, requirements analysis, design, production, testing, certification,
    and maintenance.
  software_maintenance: Maintenance of software systems.
  software_testing: Testing activities for software systems.
  tcp_ip_protocols: TCP/IP protocol-suite connections and common synchronous and asynchronous
    applications such as remote terminals, file transfer, mail, and news.
  transport_layer_protocols: Transport-layer services and mechanisms, including multiplexing
    and demultiplexing, connectionless communication with UDP, reliable data transfer,
    connection-oriented communication with TCP, and congestion control.
