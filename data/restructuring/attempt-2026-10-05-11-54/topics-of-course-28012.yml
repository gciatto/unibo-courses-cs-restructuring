analysis:
  mode: all-courses
source_clusters:
- id: 11
  name: Computer Computing High-Performance (11)
course:
  id: '28012'
  name: Electronic Calculators T
topics:
  binary_encoding: Binary encoding of information.
  computer_hardware_architecture: Hardware architecture of computers.
  computer_operation: Principles governing the operation of computers.
  computer_performance: Measurement of computer performance and the impact of architecture
    on performance.
  cpu_organization: Internal CPU structure and implementation using a sequential organization,
    including DLX.
  cpu_pipelining: Pipelined CPU organization, including datapaths, performance metrics,
    dependencies, hazards, stalls, forwarding, control hazards, and branch prediction.
  digital_logic_networks: Analysis and synthesis of combinational, asynchronous sequential,
    and synchronous sequential logic networks.
  finite_state_machines: Finite state machine modeling.
  instruction_set_architecture: Instruction Set Architecture and its role in processor
    operation.
  interrupt_handling: Hardware, software, and exception interrupts, including programmable
    interrupt controllers and vectored interrupts.
  io_port_interfacing: Interfacing I/O ports with system buses, accessing port registers,
    and handling I/O through polling and interrupts.
  machine_languages: General principles of machine languages.
  memory_devices: Memory devices as components of computer architecture.
  memory_io_addressing: Addressing of computer memory and input/output devices.
  microprocessor_system_design: Design of microprocessor-based systems.
  program_execution_model: The model by which computer programs are executed.
  risc_cisc_architectures: RISC and CISC architectural approaches.
  von_neumann_architecture: The Von Neumann computer architecture.
