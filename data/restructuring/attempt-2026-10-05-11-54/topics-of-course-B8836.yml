course:
  id: B8836
  name: Universal Semantics
topics:
  cognitive_science: Cognitive-science approaches to cognition, including theoretical,
    empirical, and neurocognitive perspectives.
  conceptual_blending: Conceptual blending as a framework for analyzing how meaning
    is constructed by integrating concepts across domains.
  multimodal_data_interpretation: Semiotic interpretation of multimodal data and content
    using formal, ontological, and computational methods.
  semantic_universals: Computational and empirical investigation of recurring semantic
    patterns across languages, modalities, cultures, practices, and neurocognitive
    systems.
  semiotics: Semiotic approaches to signs, interpretation, and meaning-making across
    modalities, cultures, and practices.
  theory_of_mind: Theory of mind as a phenomenon for investigating the representation
    and interpretation of cognitive perspectives and mental states.
