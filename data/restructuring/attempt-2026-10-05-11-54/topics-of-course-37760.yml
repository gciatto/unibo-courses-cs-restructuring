analysis:
  mode: all-courses
source_clusters:
- id: 28
  name: Systems Real-Time Real (28)
course:
  id: '37760'
  name: Systems Simulation
topics:
  agent_based_simulation: Agent-based simulation for analyzing systems through interacting
    agents.
  complex_systems_analysis: Analysis and evaluation of complex systems using simulation
    methods.
  digital_twins: Digital-twin concepts and their use in simulation.
  discrete_event_simulation: Discrete-event models and techniques for simulating systems
    in which events change system state.
  parallel_distributed_simulation: Introduction to parallel and distributed simulation.
  queueing_models: Analytical models of queueing systems and queueing networks.
  random_variate_generation: Random-number generation and random-variate generation
    for simulation models.
  simulation_data_analysis: Analysis of input and output data from simulation models.
  simulation_experiment_design: Design of experiments for simulation studies.
  simulation_machine_learning: Use of machine learning in simulation.
  simulation_tools: Design and implementation of simulators and simulation tools.
  simulation_verification_validation: Verification, validation, and testing of simulation
    models.
  systems_models_classification: Classification of systems and models for simulation
    analysis.
  virtual_reality: Introduction to virtual reality.
