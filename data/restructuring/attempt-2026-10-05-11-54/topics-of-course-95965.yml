analysis:
  mode: all-courses
source_clusters:
- id: 21
  name: Artificial Intelligence Fundamentals (21)
course:
  id: '95965'
  name: Artificial Intelligence and Machine Learning for Business
topics:
  automated_decision_systems: Logical-functional architectures of systems that automatically
    support or make decisions.
  business_mathematical_modeling: Methods for developing mathematical models for business
    problems in data-science and decision-support contexts.
  classification_algorithms: Classification models and algorithms, including Bayes
    classifiers, k-nearest neighbor, support vector machines, multiclass classification,
    decision trees, and Bayesian networks where specified.
  clustering: Clustering methods for unsupervised learning, including K-means and
    expectation-maximization (EM).
  data_analytics: Data analytics and data elaboration, including practical analysis
    activities for agricultural and Internet-of-Things data.
  data_mining: Data-mining techniques and workflows, including knowledge discovery,
    data understanding and preparation, classification with decision trees and Bayesian
    networks, association rules, clustering, outlier detection, validation, and practical
    use of mining tools.
  data_science: Fundamental data-science methods for processing structured and unstructured
    data and developing intelligent applications.
  dynamic_systems: The concept of dynamic systems as covered in relation to decision
    support and sustainability.
  e_governance: Operational tools and applications of electronic governance for business.
  machine_learning: Fundamental machine-learning technologies and algorithms for developing
    intelligent applications.
  mathematical_modeling: Mathematical modeling of industrial problems.
  predictive_analytics: Predictive data analysis using statistical and machine-learning
    models.
  recommender_systems: Web recommender systems for multimedia data and content.
  regression_analysis: Regression models and algorithms for predicting continuous
    outcomes.
  sustainability_esg: Sustainability and Environmental, Social, and Governance (ESG)
    perspectives in data-science platforms and business-performance monitoring.
