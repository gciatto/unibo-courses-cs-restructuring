analysis:
  mode: all-courses
source_clusters:
- id: 29
  name: Informatics Informatic Humanities (29)
course:
  id: '81676'
  name: Digital Forensic
topics:
  chain_of_custody: The importance and handling of chain-of-custody procedures for
    digital evidence.
  cloud_forensics: Forensic investigation of cloud-based data and environments.
  command_line_systems: Working with Windows and command-line interface systems in
    digital-forensics investigations.
  digital_expert_testimony: Expert testimony in digital investigations.
  digital_forensics_analysis: Analysis of acquired digital evidence in digital-forensics
    investigations.
  digital_forensics_investigations: The digital-forensics profession, investigative
    procedures, common investigation scenarios, and the role of the investigator's
    office and laboratory.
  digital_forensics_tools: Current tools used to conduct digital-forensics investigations.
  digital_forensics_validation: Validation of digital-forensics analysis and investigative
    results.
  email_social_media_forensics: Forensic investigations involving email and social
    media.
  file_systems: File systems as an operating-system component.
  forensic_data_acquisition: Acquisition procedures for digital-forensics data from
    computers, tablets, smartphones, files, and other sources.
  forensic_data_preservation: Procedures for conserving digital-forensics data and
    maintaining its integrity during an investigation.
  forensic_ethics: Ethical considerations for expert witnesses in digital-forensics
    investigations.
  forensic_report_writing: Drafting final reports for high-technology digital investigations.
  forensic_scene_processing: Processing crime and incident scenes in digital-forensics
    investigations.
  graphics_file_recovery: Recovery of graphics files in digital-forensics investigations.
  mobile_device_forensics: Forensic investigation of mobile devices, including smartphones
    and tablets.
  network_forensics: Digital-forensics investigation of wired and wireless networks.
  virtual_machine_forensics: Forensic investigation of virtual machines, including
    live acquisitions.
