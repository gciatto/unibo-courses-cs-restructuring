analysis:
  mode: all-courses
source_clusters:
- id: 15
  name: Network Networks Programming (15)
course:
  id: '90730'
  name: Social Network Analysis
topics:
  network_analysis: Analysis of networks as representations of entities and relationships,
    including graph representations, paths, components, adjacency and matrix representations,
    network types, node and network measures, centrality, PageRank, hubs and authorities,
    cliques, cores, cohesion, reciprocity, similarity, equivalence, homophily, assortative
    mixing, clustering, transitivity, triads, centralisation, core-periphery structure,
    random graphs, degree distributions, power laws, scale-free and small-world networks,
    and component structure.
  network_data_management: Collection, reliability assessment, formatting, transformation,
    and management of data for network analysis, including algorithms and software
    used for network analysis and visualisation.
  network_research_design: Research design for network-analysis studies, including
    network questions, the scientific publication process, reading and analysing network-analysis
    research papers, hypothesis formulation, permutation tests, and dyadic hypothesis
    testing.
  network_visualization: Visualisation of networks using graph-layout algorithms,
    node attributes, node filtering, ego networks, tie characteristics and strengths,
    and representations of network change, including approaches for reducing and aggregating
    large networks.
