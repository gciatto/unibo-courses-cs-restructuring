analysis:
  mode: all-courses
source_clusters:
- id: 16
  name: Data Algorithms Structures (16)
course:
  id: 11929-B
  name: Algorithm and Data Structures
topics:
  algorithm_design_analysis: Algorithm design and analysis for solving problems with
    computers.
  asymptotic_analysis: Analysis of algorithmic computational cost using order-of-magnitude
    estimates.
  computational_complexity: Computational complexity and complexity classes, including
    P, NP, NP-complete problems, the P versus NP question, space complexity classes,
    oracle classes, class hierarchies, and functional classes.
  data_structures: Elementary data structures including vectors, records, lists, queues,
    stacks, trees, and graphs.
  graph_algorithms: Search and other basic algorithms for solving problems on graphs.
  hash_tables: Hash tables as a data structure.
  recursive_algorithms: Recursive algorithms and the divide-and-conquer methodology.
  search_algorithms: Search algorithms for solving problems.
  sorting_algorithms: Algorithms for sorting data.
