  mode: all-courses
source_clusters:
- id: 0
  name: Security Information Cryptography (0)
course:
  id: 93470-A
  name: Cybersecurity
topics:
  application_security: Security considerations for applications, including Web and
    mobile application security.
  cyber_deception: Deception as a modern cybersecurity approach for misleading, detecting,
    or disrupting cyber attackers.
  cyber_threat_intelligence: Cyber threat intelligence concerning the analysis of
    cyber threats, including threat actors, motivations, vulnerabilities, and relevant
    defensive responses.
  device_hardening: Hardening computing devices exposed to the Internet by reducing
    vulnerabilities and improving resistance to attacks.
  machine_learning: Fundamental machine-learning technologies and algorithms for developing
    intelligent applications.
  network_security: Security of communication networks, including privacy, integrity,
    secure network and transport layers, firewalls, and intrusion detection.
  offensive_security: Practical red-team security methods, including vulnerability
    identification, the cybersecurity kill chain, enumeration, scanning, credential
    brute forcing, privilege-escalation exploitation, web-application exploitation,
    and binary-code exploitation.
  risk_analysis: Risk analysis in information-system design and planning.
  security_auditing: Auditing activities for assessing the security of computing infrastructures
    and security controls.
  security_policies: Design and implementation of security policies as part of security
    management.
  security_threats_vulnerabilities_risk: Security threats, vulnerabilities, exploits,
    risks, attack methods, and their impacts on information and systems.
  zero_trust_security: Zero Trust as a modern cybersecurity approach for protecting
    information, services, software, components, and network connections.
