analysis:
  mode: all-courses
source_clusters:
- id: 25
  name: Administration Systems System (25)
course:
  id: '81917'
  name: Interaction Multimedia Services
topics:
  algorithm_design_analysis: Algorithm design and analysis for solving problems with
    computers.
  application_security: Security considerations for applications, including Web and
    mobile application security.
  artificial_intelligence: Introduction to the main principles, methods, history,
    application fields, and problem-solving approaches of artificial intelligence.
  client_server_model: Client/server interaction and the design of small client/server
    applications.
  cloud_computing: Cloud computing for Big Data, including comparisons between on-premises
    and cloud clusters, cloud technology stacks, and deployment of case studies on
    cloud providers.
  data_backup: Data-backup practices as part of basic cybersecurity and protection
    against data loss.
  design_thinking: Design Thinking as an iterative process involving empathize, define,
    ideate, prototype, and test activities.
  digital_privacy_security: Digital privacy and security issues associated with information
    technology.
  event_driven_computing: Event-driven computational models and applications, including
    proactive-reactive distributed software.
  functions: Functions in Python and their use in programming problem solutions.
  human_computer_interaction: Human-Computer Interaction and its relationship to user
    experience in the design of interactive services.
  intellectual_property: Intellectual-property concepts covered as part of computer-science
    fundamentals.
  internet_world_wide_web: The Internet and the World Wide Web.
  it_security: Basic information-technology security issues, including viruses and
    phishing.
  javascript_programming: JavaScript as a dynamic functional language with a prototype-based
    object model.
  machine_learning: Fundamental machine-learning technologies and algorithms for developing
    intelligent applications.
  markup_languages: Markup and presentation languages for Web-oriented digital resources,
    including XHTML, XML, HTML5, and CSS.
  password_management: Password-management practices covered as part of basic cybersecurity.
  privacy_law: Privacy law and online rights as they relate to digital services and
    technology use.
  program_execution_model: The model by which computer programs are executed.
  programming_basics: Basic principles of programming.
  programming_languages: Introduction to programming languages, including what languages
    are and the role of visual languages.
  service_design: Service design processes and deliverables, including service concepts,
    user journeys, ecosystem maps, and service blueprints.
  social_engineering: Social-engineering threats and the role of human factors in
    cybersecurity.
  statistical_data_analysis: Statistical analysis of datasets, including descriptive
    analysis and statistical tests used to understand data and assess models.
  usability_testing: Planning, conducting, and analyzing usability tests to gather
    feedback and iteratively improve service concepts.
  user_interface_design: Basics of designing user interfaces.
  user_research_methods: User-centered research methods, including semi-structured
    interviews, contextual inquiry, observation, personas, empathy maps, experience
    maps, surveys, and research planning.
  virtualization_cloud_services: Virtualization, containers, Docker, Kubernetes, and
    infrastructure-as-a-service and platform-as-a-service services.
