analysis:
  mode: all-courses
source_clusters:
- id: 29
  name: Informatics Informatic Humanities (29)
course:
  id: B4826
  name: Informatics for the Humanities
topics:
  algorithm_design_analysis: Algorithm design and analysis for solving problems with
    computers.
  bibliography_management: Building and coding bibliographies using scholarly resources
    and search services such as Google Scholar and Scopus.
  collaborative_tools: Collaborative tools used with web and social-network resources.
  computer_hardware_architecture: Hardware architecture of computers.
  computer_networks: Basic concepts of computer networks.
  computer_software_basics: Basic computer software, including the classification
    and use of simple application programs.
  data_structures: Elementary data structures including vectors, records, lists, queues,
    stacks, trees, and graphs.
  document_authoring: Document authoring and writing tools, including LaTeX and Overleaf,
    for preparing digital documents.
  information_systems: Introduction to managing, organizing, planning, and architecturally
    analyzing organizational information systems.
  internet_world_wide_web: The Internet and the World Wide Web.
  machine_learning: Fundamental machine-learning technologies and algorithms for developing
    intelligent applications.
  markup_languages: Markup and presentation languages for Web-oriented digital resources,
    including XHTML, XML, HTML5, and CSS.
  osi_model: The ISO OSI layered organization, including network, transport, session,
    presentation, and application layers.
  productivity_software: Individual productivity software, including spreadsheets,
    word processors, and presentation software.
  programming_in_python: Programming in Python, including names, visibility, functions,
    objects, classes, and problem-solving applications.
  programming_languages: Introduction to programming languages, including what languages
    are and the role of visual languages.
  regular_expressions: Regular expressions for pattern matching and processing strings,
    introduced as part of practical Python programming.
  scripting_languages: Scripting languages and their use for writing small-scale programs,
    including Python.
  search_engines: Search engines as basic information-technology tools.
