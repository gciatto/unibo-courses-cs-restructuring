analysis:
  mode: all-courses
source_clusters:
- id: 10
  name: Reliable Scalable Services (10)
course:
  id: B5796
  name: Scalable and Reliable Services M
topics:
  capacity_planning: Planning service capacity to support performance, scalability,
    reliability, and changing demand.
  cloud_computing: Cloud computing for Big Data, including comparisons between on-premises
    and cloud clusters, cloud technology stacks, and deployment of case studies on
    cloud providers.
  cloud_migration: Migration of services and systems to cloud platforms, including
    evaluation of cloud implementation alternatives.
  cloud_resource_federation: Federation of resources and coordination across multi-cloud
    systems for global distributed infrastructures.
  data_governance: Data governance as part of enterprise data management and data
    strategy.
  devops_practices: DevOps practices and tools supporting the development, deployment,
    and maintenance of software systems.
  distributed_scalability: Scalability considerations in distributed systems.
  enterprise_data_strategy: Enterprise data strategy, including strategic approaches
    for managing and using organizational data.
  fault_tolerance_reliability: Fault-tolerance and reliability concerns in distributed
    enterprise applications and their runtime support systems.
  high_availability: Basic concepts of availability and high-availability distributed
    systems.
  incident_management: Management of operational incidents and crises affecting high-quality
    digital services.
  service_monitoring: Operational monitoring of digital services, including performance
    monitoring and identification of warning signs.
  service_performance_testing: Benchmarking, performance testing, and stress testing
    for evaluating digital-service performance and capacity.
  software_architecture: Design of a software system's architecture and definition
    of a logical architecture for the problem domain.
  software_lifecycle: Phases and activities in the lifecycle of software systems,
    including planning, requirements analysis, design, production, testing, certification,
    and maintenance.
  software_quality_assurance: Software quality criteria, evaluation, and certification.
  software_testing: Testing activities for software systems.
