source_clusters:
- id: 12
  name: Knowledge Engineering Extraction (12)
course:
  id: B4948
  name: Cognitive Sematics for Artificial Intelligence
topics:
  artificial_intelligence: Introduction to the main principles, methods, history,
    application fields, and problem-solving approaches of artificial intelligence.
  cognitive_science: Cognitive-science approaches to cognition, including theoretical,
    empirical, and neurocognitive perspectives.
  four_e_cognition: The embodied, enactive, embedded, and extended (4E) approach assumed
    for interpreting cognition and multimodal content.
  multimodal_data_interpretation: Semiotic interpretation of multimodal data and content
    using formal, ontological, and computational methods.
  ontological_methods: Ontological methods for interpreting multimodal data and content
    across different ontological levels.
  semiotics: Semiotic approaches to signs, interpretation, and meaning-making across
    modalities, cultures, and practices.
