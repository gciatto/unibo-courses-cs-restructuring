analysis:
  mode: all-courses
source_clusters:
- id: 4
  name: Internet Things Systems (4)
course:
  id: '72787'
  name: Mobile Application Programming
topics:
  cross_platform_mobile_frameworks: Cross-platform and hybrid mobile application development
    using related frameworks and technologies.
  design_patterns: Design patterns used in software design.
  mobile_application_development: Development of mobile applications for Android and
    iOS, including platform setup, SDKs, platform architectures and components, Kotlin,
    Swift, Objective-C, Android Activities, iOS targets, actions, and outlets.
  mobile_device_features: Use of mobile-device capabilities and services, including
    input/output, sensors, geolocation and maps APIs, multimedia, background work,
    and mobile data management.
  mobile_networking_services: Networking services and application execution in wireless
    mobile scenarios.
  mobile_user_interfaces: Mobile user-interface development using Android Views, layouts,
    events, resources, Intents, fragments and navigation, iOS Storyboards and UIKit,
    and programmatic interfaces with Compose and SwiftUI.
  user_interface_design: Basics of designing user interfaces.
