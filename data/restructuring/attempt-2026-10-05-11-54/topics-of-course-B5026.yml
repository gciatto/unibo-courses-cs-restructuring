analysis:
  mode: all-courses
source_clusters:
- id: 12
  name: Knowledge Engineering Extraction (12)
course:
  id: B5026
  name: Introduction to Computability and Complexity
topics:
  computability_limits: Limitations of effective procedures, including non-decidable
    problems.
  computational_complexity: Computational complexity and complexity classes, including
    P, NP, NP-complete problems, the P versus NP question, space complexity classes,
    oracle classes, class hierarchies, and functional classes.
  pac_learning: Probably Approximately Correct (PAC) learning as a framework in computational
    learning theory.
  turing_machines: Turing machines as formal models for studying computability and
    the existence of programs computing specified functions.
  uniform_convergence: Learning via uniform convergence as a computational learning-theory
    approach.
  vc_dimension: VC-dimension as a measure used in computational learning theory.
