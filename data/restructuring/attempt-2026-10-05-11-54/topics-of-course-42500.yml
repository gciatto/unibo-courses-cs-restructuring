analysis:
  mode: all-courses
source_clusters:
- id: 12
  name: Knowledge Engineering Extraction (12)
course:
  id: '42500'
  name: Semantic Web
topics:
  graph_machine_learning: Graph machine-learning methods.
  information_retrieval: Basic information-retrieval models, including Boolean and
    vector-space models, text analysis, and web information retrieval with PageRank.
  knowledge_graph_alignment: Knowledge Graph mappings and alignment methods.
  knowledge_graph_embeddings: Knowledge Graph embeddings and Knowledge Graph completion
    techniques.
  knowledge_graphs: Knowledge Graph concepts, applications, programming, visualisation,
    and analytics for semantic management of knowledge.
  linked_open_data: Linked Open Data and the Web of Data, including the integration
    and reuse of linked resources.
  ontology_engineering: Knowledge representation and ontology development using OWL
    and related conceptualisation methods.
  rdf_rdfs: RDF and RDFS for representing metadata and knowledge on the Web, together
    with RDFa and microformats.
  semantic_inference: Logical inference over semantic representations and Knowledge
    Graph data.
  semantic_web: Architecture, concepts, standards, languages, and technologies of
    the Semantic Web.
  sparql: Querying RDF and Knowledge Graphs with SPARQL, including queries over the
    DBPedia Knowledge Graph.
