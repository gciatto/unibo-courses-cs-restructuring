analysis:
  mode: all-courses
source_clusters:
- id: 25
  name: Administration Systems System (25)
course:
  id: '17628'
  name: Concurrent and Distributed Programming
topics:
  actor_model_programming: Actor-based programming models and frameworks, including
    Akka for concurrent and distributed programming.
  asynchronous_programming: Asynchronous programming using futures, event loops, continuations,
    promises, and async/await techniques.
  cloud_computing: Cloud computing for Big Data, including comparisons between on-premises
    and cloud clusters, cloud technology stacks, and deployment of case studies on
    cloud providers.
  concurrency_formal_modeling: Formal and visual modeling of concurrent systems using
    Petri Nets, Statecharts, and Activity Diagrams.
  concurrent_computing: The concurrent programming paradigm.
  distributed_algorithms: Algorithms designed for distributed systems.
  distributed_communication: Communication mechanisms for distributed systems.
  distributed_systems: Concepts and organization of distributed systems.
  model_checking: Specification and verification of concurrent-program properties
    using LTL and model-checking techniques.
  process_synchronization: Concurrent-process problems and synchronization issues,
    including deadlock, starvation, and busy waiting.
  processes_threads: Processes and threads in operating systems.
  reactive_programming: Reactive programming models and techniques, including reactive
    extensions and RxJava.
  service_oriented_computing: Service-oriented computing, including Jolie.
