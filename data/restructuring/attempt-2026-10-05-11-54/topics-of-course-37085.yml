analysis:
  mode: all-courses
source_clusters:
- id: 24
  name: Systems Distributed Models (24)
course:
  id: '37085'
  name: Principles, Models and Applications for Distributed Systems M
topics:
  cloud_computing: Cloud computing for Big Data, including comparisons between on-premises
    and cloud clusters, cloud technology stacks, and deployment of case studies on
    cloud providers.
  computer_networks: Basic concepts of computer networks.
  distributed_communication: Communication mechanisms for distributed systems.
  distributed_naming: Resource naming in distributed systems, including DNS and advanced
    name systems.
  distributed_network_virtualization: Network virtualization technologies used in
    distributed and telecommunications systems.
  distributed_scalability: Scalability considerations in distributed systems.
  distributed_systems: Concepts and organization of distributed systems.
  http_web_protocols: Web communication protocols and identifiers, including HTTP,
    URIs, WebSocket, HTTP/2, HTTP/3, and QUIC.
  network_configuration_protocols: Network configuration and management protocols,
    including NETCONF and automatic configuration protocols such as RARP, BOOTP, and
    DHCP.
  network_function_virtualization: Network Function Virtualization (NFV) in telecommunications
    systems.
  network_sockets: Sockets and socket APIs for C on UNIX and Java as tools for client/server
    communication.
  open_radio_access_networks: Open Radio Access Network (O-RAN) technologies in telecommunications.
  processes_threads: Processes and threads in operating systems.
  programming_in_python: Programming in Python, including names, visibility, functions,
    objects, classes, and problem-solving applications.
  remote_procedure_call: Remote invocation mechanisms for distributed applications,
    including Sun RPC and Java RMI.
  software_defined_networking: Software-Defined Networking (SDN) technologies and
    their use in telecommunications systems.
  virtualization_cloud_services: Virtualization, containers, Docker, Kubernetes, and
    infrastructure-as-a-service and platform-as-a-service services.
