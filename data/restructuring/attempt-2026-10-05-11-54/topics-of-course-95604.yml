analysis:
  mode: all-courses
source_clusters:
- id: 15
  name: Network Networks Programming (15)
course:
  id: '95604'
  name: Operating Systems and Networks
topics:
  communication_principles: Communication fundamentals covered through signals, bandwidth,
    analog communication, digital communication, and communication services.
  computer_hardware_architecture: Hardware architecture of computers.
  computer_networks: Basic concepts of computer networks.
  internet_architecture: Organization and structure of the Internet, including internetworking
    fundamentals and communication across LAN, WAN, and MAN environments.
  internet_routing: Routing in the Internet.
  io_management: Operating-system management of input and output operations.
  memory_allocation: Memory allocation and direct memory management.
  network_quality_of_service: Quality-of-service requirements and mechanisms for networked
    and real-time communication.
  network_security: Security of communication networks, including privacy, integrity,
    secure network and transport layers, firewalls, and intrusion detection.
  network_services: Functional principles of network services and basic network applications
    in Internet-oriented networking.
  operating_systems: Operating-system structure and main functions.
  physical_layer_networking: Physical-layer networking concepts, including transmission
    media, signals, encoding and decoding, and radio-communication fundamentals such
    as antennas, propagation, link budgets, and decibels.
  processes_threads: Processes and threads in operating systems.
  protocol_analysis: Network-protocol analysis through traffic sniffing, traffic-trace
    collection, debugging, and use of the Wireshark protocol analyzer.
  tcp_ip_protocols: TCP/IP protocol-suite connections and common synchronous and asynchronous
    applications such as remote terminals, file transfer, mail, and news.
