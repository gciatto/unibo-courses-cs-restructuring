analysis:
  mode: all-courses
source_clusters:
- id: 21
  name: Artificial Intelligence Fundamentals (21)
course:
  id: B5727
  name: Introduction to Languages for Artificial Intelligence
topics:
  arrays_matrices: Arrays and matrices, including their organization and representation
    in memory.
  basic_data_types: Basic Python data types and their use in solving problems.
  concurrent_computing: The concurrent programming paradigm.
  constraint_programming: Constraint programming techniques for solving optimization
    and constraint problems, including global constraints and search strategies.
  exceptions: Exceptions as a programming-language construct.
  functions: Functions in Python and their use in programming problem solutions.
  language_implementation: Abstract machines, interpreters, compilers, and implementation
    of programming-language constructs.
  logic_programming: The logical programming paradigm.
  mathematical_logic: Introductory mathematical logic techniques covered in the course,
    including unification and resolution.
  object_mutability: Immutable and mutable objects in Python.
  object_oriented_programming: Fundamental concepts and features of object-oriented
    programming.
  programming_in_python: Programming in Python, including names, visibility, functions,
    objects, classes, and problem-solving applications.
  python_data_science_libraries: Python libraries and frameworks for data science,
    including NumPy and Pandas for numerical computation and data representation,
    and PyTorch and TensorFlow for defining and using machine-learning models.
  scope_visibility: Names and visibility rules in Python programs.
  unification_resolution: Unification and resolution methods used in the course's
    mathematical logic and logic-programming material.
