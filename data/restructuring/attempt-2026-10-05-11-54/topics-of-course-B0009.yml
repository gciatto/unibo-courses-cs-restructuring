analysis:
  mode: all-courses
source_clusters:
- id: 14
  name: Engineering Software Cultural (14)
course:
  id: B0009
  name: Advanced Software Modelling and Design
topics:
  acceptance_test_driven_development: Acceptance Test-Driven Development for specifying
    and validating system behavior through acceptance tests.
  aggregate_computing: Aggregate-computing patterns and programming techniques for
    coordinating behavior across collections of devices.
  ai_code_generation: Use of AI-generated code technologies in software development.
  ai_program_synthesis: AI-based program synthesis, including the use of large language
    models for software testing and program completion.
  approximate_model_checking: Approximate model-checking techniques for systematic
    validation of software systems.
  behavior_driven_development: Behavior-Driven Development techniques for specifying
    and testing software behavior.
  component_programming: Component-oriented programming patterns for constructing
    software systems in Java and Scala.
  cyber_physical_systems: Cyber-Physical Systems as embedded systems that integrate
    computational components with physical processes.
  design_patterns: Design patterns used in software design.
  distributed_systems: Concepts and organization of distributed systems.
  effectful_programming: Compositional approaches to programming with side effects,
    including effects related to partial computation, state, and input/output.
  functional_programming: The functional programming paradigm, including functional
    parameters, closures, and Scala.
  iot_systems: Internet of Things systems combining high-level application aspects
    with low-level devices in virtual and real environments.
  markov_chains: Discrete-time and continuous-time Markov chains for modeling stochastic
    system behavior.
  markov_decision_processes: Markov decision processes for modeling sequential decisions
    under uncertainty.
  model_checking: Specification and verification of concurrent-program properties
    using LTL and model-checking techniques.
  monadic_programming: Origins and classical uses of monads for partial computations,
    state, and input/output.
  multi_agent_reinforcement_learning: Reinforcement learning by multiple agents, including
    cooperation, coordination, and learning in social dilemmas.
  neural_networks_deep_learning: Neural networks and deep-learning techniques, including
    their use in machine-learning applications.
  petri_nets: Petri-net models for large-scale systems, including concurrency and
    non-deterministic behavior.
  probabilistic_model_checking: Probabilistic model checking for validating systems
    with stochastic behavior.
  property_based_testing: Property-based testing techniques for checking software
    behavior against general properties.
  reinforcement_learning: Reinforcement learning as a machine-learning approach.
  scala_programming: Scala as a blended programming language on the Java platform.
  self_organizing_systems: Self-organising systems, including nature-inspired coordination
    and self-organisation in multi-agent systems.
  simulation: Simulation methods used to analyze and solve industrial use cases.
  software_architecture: Design of a software system's architecture and definition
    of a logical architecture for the problem domain.
  software_testing: Testing activities for software systems.
  test_driven_development: Test-driven development as an iterative software-development
    approach involving automated tests and implementation.
