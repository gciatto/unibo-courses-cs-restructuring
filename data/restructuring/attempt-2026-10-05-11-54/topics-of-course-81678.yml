analysis:
  mode: all-courses
source_clusters:
- id: 4
  name: Internet Things Systems (4)
course:
  id: '81678'
  name: Laboratory of Making
topics:
  cnc_machine_control: Software for innovative control and operation of CNC-like machines,
    including 3D printers, CNC mills, and laser cutters.
  electronics_fundamentals: Fundamentals of passive-component electronics, including
    current, potential, power, energy, Kirchhoff's laws, resistors, capacitors, inductors,
    transformers, diodes, transistors, and digital electronics.
  embedded_systems: Embedded-system hardware and software, including microcontrollers,
    systems-on-chip, sensors, actuators, electronics, and programming models such
    as super-loops, tasks, and real-time operating-system-based architectures.
  hardware_description_languages: Programmable logic and the related digital-system
    design flow using the Verilog hardware description language.
  making_based_computing_education: Design and development of computer-science teaching
    methods based on Making and Making-oriented problem solving.
  motor_control: Engines and H-bridges for controlling actuators in digitally enabled
    physical objects.
  radio_frequency_identification: Radio Frequency Identification (RFID) technologies
    and their use in digitally enabled objects.
  serial_communication_protocols: Serial communication protocols for interfacing embedded
    devices and peripherals, including OneWire, I2C, SPI, and UART.
  subtractive_manufacturing: Subtractive methods for physically producing objects,
    including CNC mills and laser cutters.
  three_dimensional_printing: Three-dimensional printing principles and use in digitally
    enabled physical-object prototyping, including its role in cultural-heritage communication
    and object reconstruction.
  voip_telephony: VoIP telephone exchanges, including Asterisk.
  wireless_communication_systems: Wireless communication systems, including propagation
    and fading models and an overview of wireless technologies such as IEEE 802.11,
    IEEE 802.16, IEEE 802.20, cellular networks, Bluetooth, and ZigBee.
