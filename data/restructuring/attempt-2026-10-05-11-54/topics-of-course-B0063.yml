analysis:
  mode: all-courses
source_clusters:
- id: 7
  name: Informatica Computer Science (7)
course:
  id: B0063
  name: Programming Laboratory
topics:
  algorithm_design_analysis: Algorithm design and analysis for solving problems with
    computers.
  basic_data_types: Basic Python data types and their use in solving problems.
  classification_algorithms: Classification models and algorithms, including Bayes
    classifiers, k-nearest neighbor, support vector machines, multiclass classification,
    decision trees, and Bayesian networks where specified.
  clustering: Clustering methods for unsupervised learning, including K-means and
    expectation-maximization (EM).
  data_models: Structured, semi-structured, and unstructured data models.
  data_visualization: Visualization and graphical representation of datasets and their
    properties, including frequency tables and statistical graphics.
  debugging: Debugging as a programming practice for identifying and correcting errors
    in programs.
  development_environment: Use of a development environment for programming.
  exceptions: Exceptions as a programming-language construct.
  functions: Functions in Python and their use in programming problem solutions.
  imperative_constructs: Imperative programming concepts, including algorithms and
    programs, data types, assignment, input/output, conditional statements, and iteration.
  json_data_format: JSON as a data representation format used in basic Web technologies.
  model_selection_validation: Selection and validation of machine-learning models,
    including assessment and presentation of results.
  neural_networks_deep_learning: Neural networks and deep-learning techniques, including
    their use in machine-learning applications.
  programming_in_python: Programming in Python, including names, visibility, functions,
    objects, classes, and problem-solving applications.
  programming_languages: Introduction to programming languages, including what languages
    are and the role of visual languages.
  python_data_science_libraries: Python libraries and frameworks for data science,
    including NumPy and Pandas for numerical computation and data representation,
    and PyTorch and TensorFlow for defining and using machine-learning models.
  regression_analysis: Regression models and algorithms for predicting continuous
    outcomes.
  software_testing: Testing activities for software systems.
  supervised_unsupervised_learning: Supervised and unsupervised machine-learning approaches.
