analysis:
  mode: all-courses
source_clusters:
- id: 2
  name: Big Data Cloud (2)
course:
  id: B2133
  name: Big Data Analytics and Text Mining
topics:
  attention_mechanisms: Attention mechanisms used in computer-vision models, including
    their relationship to Transformer architectures.
  chatbots_function_calling: Chatbot construction and function-call generation in
    language-processing applications.
  data_mining: Data-mining techniques and workflows, including knowledge discovery,
    data understanding and preparation, classification with decision trees and Bayesian
    networks, association rules, clustering, outlier detection, validation, and practical
    use of mining tools.
  graph_machine_learning: Graph machine-learning methods.
  hadoop_ecosystem: The Hadoop ecosystem and its technologies for Big Data processing,
    including its relationship to Spark.
  knowledge_graph_embeddings: Knowledge Graph embeddings and Knowledge Graph completion
    techniques.
  knowledge_graphs: Knowledge Graph concepts, applications, programming, visualisation,
    and analytics for semantic management of knowledge.
  language_models: Language models, transformer architectures, and efficient attention
    mechanisms for text and language processing.
  large_action_models: Large action models as language-model-based systems for generating
    or carrying out actions.
  large_language_models: Generative large language models and their use in language-processing
    applications.
  machine_learning: Fundamental machine-learning technologies and algorithms for developing
    intelligent applications.
  mapreduce_computing: The MapReduce programming paradigm for Big Data, including
    its principles, limitations, algorithm design, and design of non-trivial MapReduce
    problems.
  model_compression_quantization: Model-compression and efficiency techniques for
    machine-learning and deep-learning models, including quantization, sparsity, depthwise
    convolutions, inverse bottlenecks, and optimized attention.
  model_evaluation: Evaluation methods for generative and machine-learning models.
  natural_language_processing: Natural language processing as an artificial-intelligence
    topic and application area.
  neural_networks_deep_learning: Neural networks and deep-learning techniques, including
    their use in machine-learning applications.
  parallel_computing: Parallel computing as an approach for processing Big Data.
  parameter_efficient_fine_tuning: Parameter-efficient fine-tuning methods such as
    QLoRA and prompt tuning.
  prompt_engineering: Prompt-engineering techniques for generative large language
    models.
  python_data_science_libraries: Python libraries and frameworks for data science,
    including NumPy and Pandas for numerical computation and data representation,
    and PyTorch and TensorFlow for defining and using machine-learning models.
  retrieval_augmented_generation: Retrieval-augmented generation using vector databases.
  spark_computing: Apache Spark for Big Data processing, including its architecture,
    data structures, partitioning, shuffling, computation optimization, and Spark
    SQL.
  text_mining: Text representation, retrieval, classification, opinion mining, summarization,
    and information extraction, with practical text-mining case studies.
  text_summarization: Text summarization as a practical text-mining and language-processing
    application.
  vision_language_models: Vision-language models for multimodal language and vision
    applications.
