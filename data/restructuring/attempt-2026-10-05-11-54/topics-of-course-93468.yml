analysis:
  mode: all-courses
source_clusters:
- id: 24
  name: Systems Distributed Models (24)
course:
  id: '93468'
  name: Distributed Software Systems
topics:
  blockchain_technologies: Blockchain and alternative distributed-ledger technologies,
    including their conceptual foundations, decentralization, Bitcoin, and blockchain-based
    distributed applications.
  cap_theorem: The CAP theorem in the context of non-relational and Big Data database
    management systems.
  code_mobility: Code mobility as a distributed-systems technique for moving code
    across networked environments.
  distributed_communication: Communication mechanisms for distributed systems.
  distributed_consistency: Consistency degrees in distributed systems and their effects
    on service properties, including BASE-related considerations.
  distributed_coordination: Coordination mechanisms and models for coordinating activities
    in distributed systems, including Linda-style coordination.
  distributed_middleware: Middleware definitions, categories, organization, patterns,
    and operating environments for developing and managing large distributed and cloud
    systems.
  distributed_replication: Replication models, strategies, and protocols for distributed
    and cloud systems.
  distributed_systems: Concepts and organization of distributed systems.
  distributed_time: Computational models of time and the treatment of time in distributed
    systems.
  distributed_trust: Distributed trust mechanisms in cryptographic systems.
  fault_tolerance_reliability: Fault-tolerance and reliability concerns in distributed
    enterprise applications and their runtime support systems.
  logical_clocks: Logical clocks for representing and reasoning about event ordering
    in distributed systems.
  multi_agent_programming: Programming multi-agent systems using agent-oriented technologies,
    including JADE and Jason for intentional agents.
  network_sockets: Sockets and socket APIs for C on UNIX and Java as tools for client/server
    communication.
  process_algebra: Process-algebraic modeling and reasoning, including the process
    algebras Lin, Fork, and Pet, representability theorems, congruence properties,
    and axiomatization.
  remote_procedure_call: Remote invocation mechanisms for distributed applications,
    including Sun RPC and Java RMI.
  software_architecture: Design of a software system's architecture and definition
    of a logical architecture for the problem domain.
  web_api_design: Design of Web application interfaces and APIs, including REST principles.
