analysis:
  mode: all-courses
source_clusters:
- id: 1
  name: Informatics Principles Foundations (1)
course:
  id: '28623'
  name: Foundations of Informatics and Laboratory
topics:
  algorithm_design_analysis: Algorithm design and analysis for solving problems with
    computers.
  arrays_matrices: Arrays and matrices, including their organization and representation
    in memory.
  asymptotic_analysis: Analysis of algorithmic computational cost using order-of-magnitude
    estimates.
  basic_data_types: Basic Python data types and their use in solving problems.
  computational_complexity: Computational complexity and complexity classes, including
    P, NP, NP-complete problems, the P versus NP question, space complexity classes,
    oracle classes, class hierarchies, and functional classes.
  computer_networks: Basic concepts of computer networks.
  computer_operation: Principles governing the operation of computers.
  development_environment: Use of a development environment for programming.
  file_handling: Input/output and file-handling functions.
  functions_recursion: Functions, parameter passing, and recursive functions.
  imperative_constructs: Imperative programming concepts, including algorithms and
    programs, data types, assignment, input/output, conditional statements, and iteration.
  memory_allocation: Memory allocation and direct memory management.
  operating_systems: Operating-system structure and main functions.
  program_input_output: Input and output operations in programs, including console
    and file input/output.
  programming_basics: Basic principles of programming.
  programming_in_c: Introduction to programming and software development using the
    C language.
  scoping_activation_records: Programming-language environments, scoping rules, activation-record
    stacks, and heaps.
  shell_scripting: Shell use and shell scripting.
  sorting_algorithms: Algorithms for sorting data.
  string_processing: String manipulation and string functions.
