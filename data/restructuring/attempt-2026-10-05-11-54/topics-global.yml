  open_methodology: Open methodologies for conducting and communicating research.
  open_metrics: Open metrics for evaluating and communicating research activity and
    impact.
  open_peer_review: Open peer-review practices in scholarly research and communication.
  open_radio_access_networks: Open Radio Access Network (O-RAN) technologies in telecommunications.
  open_science: Theoretical, historical, and social principles of the Open Science
