  model_compression_quantization: Model-compression and efficiency techniques for
    machine-learning and deep-learning models, including quantization, sparsity, depthwise
    convolutions, inverse bottlenecks, and optimized attention.
  model_distillation: Model distillation for producing efficient neural-network models.
  model_driven_software_development: Model-Driven Software Development using executable
    requirement and problem models and custom metamodels.
  model_evaluation: Evaluation methods for generative and machine-learning models.
  model_selection_validation: Selection and validation of machine-learning models,
