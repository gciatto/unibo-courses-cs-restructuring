  multimedia_data_management: Management of multimedia data and content in multimedia
    data-intensive applications and services, including multimedia data-management
    systems.
  multimedia_information: Representation of multimedia information using digital technologies.
  multimedia_retrieval: Multimedia-data retrieval methods, including query formulation,
    sequential retrieval, index-based retrieval, browsing, and retrieval models for
    multimedia content.
  multimedia_semantic_annotation: Automatic techniques for adding semantic annotations
    to multimedia data.
  multimedia_visualization: Visualization paradigms and presentation of multimedia
    data and collections, including interaction-oriented exploration and dimensionality-reduction
    techniques.
  multimodal_data_interpretation: Semiotic interpretation of multimodal data and content
    using formal, ontological, and computational methods.
  multiplatform_programming: Multi-platform and multi-target software development
    using Kotlin.
  multivariate_analysis: Analysis of multiple measured variables using scatter plots,
    correlation matrices, variable decomposition, principal component analysis, and
    partial least squares.
  n_gram_language_models: N-gram language models for representing and predicting sequences
    of natural-language tokens.
  named_entity_recognition: Named entity recognition as a downstream natural-language-processing
    task.
  natural_language_parsing: Parsing of natural language using modern parsing formalisms,
    including phrase-structure and dependency approaches.
  natural_language_processing: Natural language processing as an artificial-intelligence
    topic and application area.
  network_analysis: Analysis of networks as representations of entities and relationships,
