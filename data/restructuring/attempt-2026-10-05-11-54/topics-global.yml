  model_validation: Understanding and validation of data-mining and machine-learning
    results.
  modular_arithmetic: Basics of modular arithmetic as used in the study of cryptography.
  monad_transformers: Monad transformations for composing and structuring computational
    effects.
  monadic_programming: Origins and classical uses of monads for partial computations,
