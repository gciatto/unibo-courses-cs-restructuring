  knowledge_extraction: Methods and technologies for automatically extracting machine-queryable
    knowledge from text and other arbitrary content.
  knowledge_graph_alignment: Knowledge Graph mappings and alignment methods.
  knowledge_graph_embeddings: Knowledge Graph embeddings and Knowledge Graph completion
    techniques.
  knowledge_graphs: Knowledge Graph concepts, applications, programming, visualisation,
    and analytics for semantic management of knowledge.
  knowledge_representation: Knowledge representation for artificial-intelligence systems,
    including first-order predicate logic, production rules, knowledge-based systems,
    and introductory formal ontologies.
  kotlin_programming: Use of the Kotlin programming language in software-system development.
  kpi_management: Use of key performance indicators (KPIs) in digital transformation
    planning and action plans.
  labeled_transition_systems: Labeled transition systems for modeling the behavior
    of concurrent and distributed systems.
  lambda_calculus: Basic concepts of lambda calculus as a model for function evaluation.
  landscape_survey_representation: Methods and techniques for surveying, interpreting,
    and digitally representing landscapes, open spaces, site conditions, vegetation,
    and related design projects.
  language_evolution: Evolution of programming languages from assembly to higher-level
    languages.
  language_implementation: Abstract machines, interpreters, compilers, and implementation
    of programming-language constructs.
  language_models: Language models, transformer architectures, and efficient attention
    mechanisms for text and language processing.
  language_semantics: Formal description of programming-language meaning, including
    Structured Operational Semantics.
  language_syntax: Formal description of programming-language syntax, including Backus–Naur
    form and related grammar notation.
  large_action_models: Large action models as language-model-based systems for generating
    or carrying out actions.
  large_language_models: Generative large language models and their use in language-processing
    applications.
  laser_scanning: Laser-scanning techniques for documenting archaeological sites and
    acquiring three-dimensional point-cloud data.
  latent_semantic_analysis: Introduction to Latent Semantic Analysis (LSA) for deriving
    representations of text from word-document relationships.
  layout_sheet_organization: Logical organization, pagination, sequencing, layout,
    headers, printing, and presentation of drawing sheets for landscape and open-space
    projects.
  learning_theories: Learning paradigms and theories applied to Computer Science education,
    including constructivism and constructionism, as well as top-down and bottom-up
    teaching approaches.
  lexical_analysis: Design of lexical analysers, including the use of Lex.
  lexical_association_measures: Concordances, collocations, and measures of association
    between words in text corpora.
  lexical_semantics: Lexical semantic resources and analysis, including WordNet and
    FrameNet.
  linear_algebra: Linear algebra concepts used in deep-learning models and computations.
  linear_programming: Linear programming fundamentals, including the simplex algorithm
    and duality.
  linguistic_patterns: Linguistic patterns used as heuristics for extracting knowledge
    from text.
  link_layer_protocols: Link and network-access protocols and technologies, including
    MAC, Ethernet, IEEE 802.11, HDLC, PPP, ARP, and RARP.
  linked_open_data: Linked Open Data and the Web of Data, including the integration
    and reuse of linked resources.
  linux_introduction: Brief introduction to Linux at the beginning of the course.
  live_subtitling: Production of intralingual real-time subtitles from spoken and
    audiovisual material, including subtitling techniques for deaf audiences.
  local_image_features: Image gradients, smooth derivatives such as Sobel, Canny edge
    detection, keypoint detectors, descriptors, Harris corners, and scale-invariant
    SIFT features.
  local_search_algorithms: Local-search methods as an algorithmic technique for solving
    computational problems.
  localization_accessibility: Application of media accessibility requirements when
    localizing videogames, IT products, and web contents.
  localization_bug_prevention: Identification and prevention of bugs and other localization-specific
    problems in software applications.
  localization_editing_revision: Editing and revision of localized texts as part of
    software and digital-content localization.
  localization_information_mining: Information-mining techniques used in the localization
    of videogames, IT products, and web contents.
  localization_interface_constraints: Management of size and visual restrictions affecting
    localized software interfaces and other digital application content.
  localization_placeholders: Handling variables and placeholders in localized software
    content.
  localization_quality_assessment: Assessment of the linguistic quality of a localized
    videogame, IT product, or web content as a whole.
  localization_translation_adaptation: Translation and adaptation of complex digital
    applications and their varied text types between English and Italian.
  location_aware_systems: Systems that adapt their behavior or provide services based
    on the current location of users or devices.
  location_based_services: Services and applications whose behavior or functionality
    depends on the location of users or devices.
  location_intelligence: Use of location and spatial data to support location intelligence
    in context-aware systems.
  logic_programming: The logical programming paradigm.
  logical_clocks: Logical clocks for representing and reasoning about event ordering
    in distributed systems.
  logical_sentence_semantics: Logical approaches to representing and analyzing sentence
    semantics.
  machine_languages: General principles of machine languages.
  machine_learning: Fundamental machine-learning technologies and algorithms for developing
    intelligent applications.
  machine_translation: Machine translation, including its history, principles, engines,
    specialized software and utilities, model setup and maintenance, training-data
    preparation, and integration with computer-assisted translation systems.
  machine_translation_evaluation: Evaluation of machine-produced translations using
    important translation-quality metrics and interpretation of their results.
  maintenance_policies: Maintenance policies based on remaining-useful-life estimates.
  making_based_computing_education: Design and development of computer-science teaching
    methods based on Making and Making-oriented problem solving.
  malicious_software: Malicious software as a computer-security threat.
  mapreduce_computing: The MapReduce programming paradigm for Big Data, including
