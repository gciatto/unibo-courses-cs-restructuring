topics:
  abstract_data_types: Abstract data types, including type definitions and operations
    such as constructors, selectors, predicates, functions, and transformators, with
    related representation and implementation techniques.
  acceptance_test_driven_development: Acceptance Test-Driven Development for specifying
    and validating system behavior through acceptance tests.
  access_control_models: Access-control models and their implementation for protecting
    systems and information.
  action_logic: Action logic as a logical formalism covered in the context of modal
    and epistemic logic.
  active_databases: Active database concepts and programming.
  activity_aware_systems: Systems that adapt their behavior based on recognition of
    the user's current activity.
  actor_model_programming: Actor-based programming models and frameworks, including
    Akka for concurrent and distributed programming.
  advanced_interaction_paradigms: Interaction paradigms beyond traditional interfaces,
    including their rationale, vision, contemporary examples, and associated development
    tools.
  adversarial_examples: Techniques for fooling neural networks and studying adversarial
    behavior.
  agent_based_simulation: Agent-based simulation for analyzing systems through interacting
    agents.
  aggregate_computing: Aggregate-computing patterns and programming techniques for
    coordinating behavior across collections of devices.
  agile_software_development: Agile software development practices and approaches.
  ai_code_generation: Use of AI-generated code technologies in software development.
  ai_cybersecurity: Artificial intelligence considered in relation to cybersecurity
    risks, countermeasures, and cybersecurity management.
  ai_epistemology: Epistemological issues concerning artificial intelligence and its
    approaches.
  ai_ethics: Ethical issues concerning artificial intelligence, cognitive science,
    and robotics.
  ai_planning: Planning problems as a problem-solving approach in artificial intelligence.
  ai_problem_solving: AI problem formulation using states, forward and backward reasoning,
    search-based solving, and problem types including games, constraint satisfaction,
    and planning.
  ai_program_synthesis: AI-based program synthesis, including the use of large language
    models for software testing and program completion.
  ai_safety_alignment: Safety, value alignment, controllability, super-intelligence,
    and self-awareness as open problems in intelligent and autonomous AI systems.
  ai_translation_tools: AI-enhanced and generative-AI translation functionalities
    integrated into CAT tools to support translation and revision workflows.
  algorithm_design_analysis: Algorithm design and analysis for solving problems with
    computers.
  algorithm_selection_configuration: Automatic selection and configuration of algorithms
    for data-analysis and artificial-intelligence methods.
  algorithmic_game_theory: Algorithmic game-theory concepts for multi-agent learning,
    including cooperation, coordination, and social dilemmas.
  analog_digital_conversion: Analog-to-digital conversion, quantization levels, effective
    number of bits, resolution degradation, oversampling, bandwidth, and anti-aliasing
    filters in sensor acquisition chains.
  analytics_types: Types of data analytics, including diagnostic, descriptive, predictive,
    and prescriptive analytics.
  anomaly_detection: Detection of anomalous behavior in industrial data and systems.
  anti_forensics: Anti-computer-forensics techniques intended to obstruct or undermine
    the acquisition, analysis, or interpretation of digital evidence.
  application_layer_protocols: Application-layer network protocols and architectures,
    including Web and HTTP, FTP, SMTP, POP3, IMAP, DNS, and peer-to-peer systems such
    as BitTorrent.
  application_security: Security considerations for applications, including Web and
    mobile application security.
  approximate_model_checking: Approximate model-checking techniques for systematic
    validation of software systems.
  approximation_algorithms: Approximation algorithms for obtaining solutions to computationally
    difficult problems.
  archaeological_surveying: Archaeological site surveying and documentation using
    total stations, laser scanners, GNSS receivers, and digital photogrammetry.
  architectural_quality_attributes: Quality attributes used to analyze and evaluate
    software architectures in relation to organizational contexts.
  architectural_thinking: Foundational concepts and ways of thinking about software
    architecture, including the role and responsibilities of the software architect.
  architecture_power_performance: Analysis of how computer architecture affects processor
    and system power consumption and performance.
  arrays_matrices: Arrays and matrices, including their organization and representation
    in memory.
  artificial_intelligence: Introduction to the main principles, methods, history,
    application fields, and problem-solving approaches of artificial intelligence.
  association_rule_mining: Mining association rules from data.
  associative_learning: Associative learning mechanisms applied to robot adaptation
    and learning.
  asymptotic_analysis: Analysis of algorithmic computational cost using order-of-magnitude
    estimates.
  asynchronous_programming: Asynchronous programming using futures, event loops, continuations,
    promises, and async/await techniques.
  asynchronous_web_notifications: Asynchronous notifications in Web back-end applications.
  attention_mechanisms: Attention mechanisms used in computer-vision models, including
    their relationship to Transformer architectures.
  augmented_reality: Introduction to augmented reality and its applications in the
    course context.
  authentication_models: Authentication systems and principles for designing secure
    authentication protocols.
  autoencoders: Autoencoder neural-network architectures.
  automated_decision_systems: Logical-functional architectures of systems that automatically
    support or make decisions.
  automated_reasoning: Automated reasoning and reasoning agents as techniques for
    intelligent systems.
  automatic_code_generation: Automatic source-code generation through software factories
    and development environments in ecosystems such as Eclipse and IntelliJ.
  automatic_differentiation: Automatic differentiation as a calculus-based technique
    used in deep-learning computation and optimization.
  autonomous_adaptive_systems: Design, implementation, and evaluation of intelligent
    machines and autonomous systems that adapt and learn through interaction with
    their environment, including automatic and autonomous decision-making.
  autonomous_systems: Concepts, definitions, and interactions involving autonomous
    systems in intelligent-systems engineering.
  autonomous_vehicular_systems: Connected and autonomous vehicular systems, ranging
    from Advanced Driver Assistance Systems to fully autonomous driving, including
    sensing, perception, decision-making, planning, control, computation architectures,
    design, deployment, and validation.
  avatar_systems: Avatars in virtual and augmented reality environments.
  axiomatic_set_theory: Introduction to ZF axiomatic set theory, including relations,
    functions, quotients, cardinality, and Cantor’s Theorem.
  backtracking_algorithms: Backtracking as an algorithmic technique for solving computational
    problems.
  basic_data_types: Basic Python data types and their use in solving problems.
  basic_text_processing: Basic processing operations for analyzing and preparing natural-language
    text.
  bayesian_networks: Representation and reasoning with Bayesian networks, including
    exact and approximate inference.
  behavior_based_robotics: Behavior-based robotics paradigms for coordinating robot
    behaviors, including Subsumption Architecture, motor schemas, and behavior trees.
  behavior_change_models: Behavioral-change models used to understand and support
    user engagement, intervention, and health maintenance in digital health systems.
  behavior_driven_development: Behavior-Driven Development techniques for specifying
    and testing software behavior.
  bibliography_management: Building and coding bibliographies using scholarly resources
    and search services such as Google Scholar and Scopus.
  big_data_management: Big Data applications, challenges, technologies, storage approaches,
    programming paradigms, and methodologies for designing Big Data applications.
  big_data_platforms: Data platforms and cloud data platforms for managing and processing
    Big Data.
  binary_arithmetic: Numbering systems and the four arithmetic operations in the binary
    basis.
  binary_encoding: Binary encoding of information.
  bio_inspired_adaptation: Bio-inspired approaches to designing adaptive systems.
  biological_data_types: Types of biological data and the use of suitable data structures
    for representing them.
  biomedical_signal_processing: Acquisition of bioelectric EEG signals, conversion
    to digital form, digital signal processing, visualization, and storage.
  biomolecular_sequence_structure_analysis: Tools and computational approaches for
    sequence and structure analysis of biomolecules.
  bisimulation_equivalence: Bisimulation-based behavioral equivalences for linear
    nets, forking nets, and Petri nets, including strong, weak, branching, team, place,
    structure-preserving, sequential, concurrent, and causal variants.
  blockchain_mining: Mining as a mechanism used in blockchain and cryptocurrency networks.
  blockchain_privacy: Anonymity considerations in blockchain and cryptocurrency systems.
  blockchain_security: Attacks against blockchain systems.
  blockchain_technologies: Blockchain and alternative distributed-ledger technologies,
    including their conceptual foundations, decentralization, Bitcoin, and blockchain-based
    distributed applications.
  blockchain_transactions: Blockchain transactions and transaction scripting languages.
  boolean_algebra: Elements of Boolean algebra and logical functions.
  boolean_satisfiability: The Boolean satisfiability problem and SAT encodings for
    combinatorial decision-making and optimization.
  branch_and_bound: Branch-and-bound techniques for solving computational problems
    by systematically exploring and pruning a search space.
  brute_force_algorithms: Brute-force approaches for solving computational problems
    by systematically exploring candidate solutions.
  burrows_wheeler_transform: The reversible Burrows-Wheeler transform and its applications
    in string processing.
  bus_dma_io_architecture: System-level architecture topics including interleaved
    memory access, bus hierarchies and protocols, and multimaster systems with DMA-based
    I/O.
  business_intelligence: Business intelligence in corporate information systems, including
    the role of BI and the BI pyramid.
  business_mathematical_modeling: Methods for developing mathematical models for business
    problems in data-science and decision-support contexts.
  business_planning: Development of business ideas, business cases, business plans,
    and action plans for digital innovation initiatives.
  business_process_management: Business Process Management and BPMN for modeling and
    supporting the execution of business processes.
  business_process_reengineering: Business Process Reengineering projects and the
    analysis of organizational resources and processes.
  cache_coherence: Memory-coherence mechanisms for shared-memory multiprocessor architectures,
    including the MESI protocol.
  cad_technical_drawing: Basic use of computer-aided design tools for representing
    buildings and architectural components and for creating and managing digital technical
    drawings and architectural sheets.
  calculus: Calculus concepts used in deep learning, including differentiation.
  camera_calibration: Camera calibration using intrinsic and extrinsic parameters,
    lens-distortion models, planar targets, homography estimation, image rectification,
    and stereo calibration.
  cap_theorem: The CAP theorem in the context of non-relational and Big Data database
    management systems.
  capacity_planning: Planning service capacity to support performance, scalability,
    reliability, and changing demand.
  cat_tools: CAT tools such as Trados Studio, MemoQ, and MateCat, including their
    use for translation workflows.
  ccs_calculus: The Calculus of Communicating Systems (CCS), including its syntax,
    structural operational semantics, Turing completeness of finitary CCS, and undecidability
    of behavioral equivalences.
  centralized_configuration: Centralized and automated configuration of distributed
    systems, services, applications, and local or distributed infrastructure.
  centralized_monitoring: Centralized monitoring platforms for large and heterogeneous
    installations, including the SNMP protocol.
  certified_programming: Programming approaches and case studies that provide certified
    correctness guarantees, including certified computations over numbers, lists,
    and sized vectors.
  chain_of_custody: The importance and handling of chain-of-custody procedures for
    digital evidence.
  character_encoding: Character encoding and digital formats for producing humanistic
    digital objects.
  chatbots_function_calling: Chatbot construction and function-call generation in
    language-processing applications.
  classification_algorithms: Classification models and algorithms, including Bayes
    classifiers, k-nearest neighbor, support vector machines, multiclass classification,
    decision trees, and Bayesian networks where specified.
  client_server_model: Client/server interaction and the design of small client/server
    applications.
  clinical_efficiency: Use of digital health to improve care-delivery processes, reduce
    errors and bias, and reduce the time and unit or total cost of clinical procedures.
  clinical_studies_ethics: Ethical issues in digital-health research and product or
    prototype development involving human participants, including recruitment, consent,
    and ethics-protocol design.
  clinical_workflow_tracking: Configuration and tracking of workflows in clinical
    pathology, pathological anatomy, and transfusion medicine, including instrument
    connections, department configuration, user authorization, and registry changes.
  cloud_computing: Cloud computing for Big Data, including comparisons between on-premises
    and cloud clusters, cloud technology stacks, and deployment of case studies on
    cloud providers.
  cloud_cost_management: Cloud Computing billing models, cost estimation, quotations,
    project-management support, and management-control considerations for cloud solutions.
  cloud_forensics: Forensic investigation of cloud-based data and environments.
  cloud_migration: Migration of services and systems to cloud platforms, including
    evaluation of cloud implementation alternatives.
  cloud_ml_platforms: Cloud-provider platforms specifically supporting machine-learning
    and deep-learning applications.
  cloud_resource_federation: Federation of resources and coordination across multi-cloud
    systems for global distributed infrastructures.
  cloud_service_models: Service and cloud computing models used to organize and design
    large distributed and cloud systems.
  cloud_storage: Cloud-based storage of digital files and documents, including its
    use for online access and collaboration.
  cluster_computing: Cluster computing for handling Big Data, including hardware and
    software architectures and distributed cluster platforms.
  clustering: Clustering methods for unsupervised learning, including K-means and
    expectation-maximization (EM).
  cnc_machine_control: Software for innovative control and operation of CNC-like machines,
    including 3D printers, CNC mills, and laser cutters.
  coap_mqtt_protocols: Use of CoAP and MQTT protocols for message-based interactions
    among distributed software components and IoT devices.
  code_generation: Generation of target or intermediate code as a compiler phase.
  code_mobility: Code mobility as a distributed-systems technique for moving code
    across networked environments.
  code_transformation: Transformation of source code, including generation of intermediate
    code for standard and advanced programming-language features.
  cognitive_architectures: Cognitive architectures considered in the context of autonomous
    and intelligent systems.
  cognitive_models: Cognitive models used to explain how people develop software and
    to guide production processes.
  cognitive_science: Cognitive-science approaches to cognition, including theoretical,
    empirical, and neurocognitive perspectives.
  collaborative_software_development: Use of collaborative tools to support software
    development.
  collaborative_tools: Collaborative tools used with web and social-network resources.
  combinatorial_optimization: Modeling and solving complex combinatorial decision-making
    and optimization problems using constraint programming, SAT, SMT, linear programming,
    and integer linear programming approaches.
  command_line_systems: Working with Windows and command-line interface systems in
    digital-forensics investigations.
  communication_principles: Communication fundamentals covered through signals, bandwidth,
    analog communication, digital communication, and communication services.
  complex_hilbert_spaces: Complex Hilbert spaces as mathematical background for quantum
    computing.
  complex_systems_analysis: Analysis and evaluation of complex systems using simulation
    methods.
  component_programming: Component-oriented programming patterns for constructing
    software systems in Java and Scala.
  computability_limits: Limitations of effective procedures, including non-decidable
    problems.
  computational_complexity: Computational complexity and complexity classes, including
    P, NP, NP-complete problems, the P versus NP question, space complexity classes,
    oracle classes, class hierarchies, and functional classes.
  computational_linguistics: Computational linguistics concepts relevant to the computational
    processing and analysis of natural language.
  computational_morphology: Computational morphology, including morphological operations,
    static lexica, and two-level morphology.
  computational_phonetics: Computational analysis of speech samples, including acoustic
    properties, acoustic measures, frequency-domain analysis, spectrograms, and acoustic-phonetic
    applications.
  computational_thinking: Computational thinking as a way of formulating problems
    and designing step-by-step solutions.
  computer_aided_translation: Computer-assisted translation as a translation-technology
    approach, including CAT workflows and the integration of translation, revision,
    machine translation, and AI tools.
  computer_graphics: Computer-graphics principles used to design and create virtual
    and augmented reality environments.
  computer_hardware_architecture: Hardware architecture of computers.
  computer_networks: Basic concepts of computer networks.
  computer_operation: Principles governing the operation of computers.
  computer_performance: Measurement of computer performance and the impact of architecture
    on performance.
  computer_science_education: Computer Science education as a discipline, including
    historical, epistemological, and ethical aspects of Computer Science and the rationale
    for teaching it.
  computer_software_basics: Basic computer software, including the classification
    and use of simple application programs.
  computer_vision: Computer-vision topics and applications, including image representation,
    object detection and classification, classical techniques, and deep-learning solutions.
  computing_history: Historical development of computer science and computing systems
    from prehistory through the early 1980s, including stored-program electronic computers,
    calculators, mainframes, minicomputers, microprocessors, and personal computers.
  conceptual_blending: Conceptual blending as a framework for analyzing how meaning
    is constructed by integrating concepts across domains.
  concurrency_formal_modeling: Formal and visual modeling of concurrent systems using
    Petri Nets, Statecharts, and Activity Diagrams.
  concurrent_computing: The concurrent programming paradigm.
  concurrent_language_programming: Programming concurrent applications using shared-memory
    and message-passing languages and libraries, including C with pthreads, Google
    Go, and Ada.
  configuration_as_code: Automated creation and configuration of virtual systems using
    configuration-as-code and automation tools such as OpenTofu, Vagrant, and Ansible.
  connected_components_blob_analysis: Connected-components labeling and blob analysis
    of binary images.
  constraint_programming: Constraint programming techniques for solving optimization
    and constraint problems, including global constraints and search strategies.
  constraint_propagation: Local consistency notions and constraint-propagation techniques
    for reducing search in constraint-programming models.
  constraint_satisfaction: Constraint satisfaction problems as a problem-solving approach
    in artificial intelligence.
  constraint_scheduling: Constraint-based scheduling problems and methods for modeling
    and solving them.
  container_orchestration: Orchestration of containerized software systems as part
    of software development and deployment.
  context_aware_computing: Fundamental concepts, definitions, use cases, architectures,
    and applications of systems that adapt their behavior based on user, device, location,
    or activity context.
  context_aware_task_allocation: Allocation of tasks and workloads using metrics derived
    from the current context of users or devices, such as location.
  context_free_grammars_parsing: Context-free grammars, push-down automata, their
    equivalences and principal theorems, and parsing algorithms for LL(1), LR(0),
    SLR, LR(1), and LALR(1) grammars, including YACC.
  continuous_delivery: Continuous delivery and deployment practices for automatically
    preparing and releasing software.
  continuous_integration: Continuous Integration practices and tools for integrating
    and validating software changes.
  conversational_informatics: Conversational interaction with intelligent and autonomous
    systems, including ChatGPT-related interaction and conversational informatics.
  convolutional_neural_networks: Convolutional neural networks (CNNs) as a deep-learning
    architecture.
  corpus_construction: Construction and analysis of text corpora for developing prediction
    models in natural-language processing.
  cost_benefit_analysis: Cost-benefit analysis for information-system initiatives.
  cps_middleware: Middleware for cyber-physical systems, including microROS, XRCE-DDS,
    and DDS for communication among CPS components.
  cpu_organization: Internal CPU structure and implementation using a sequential organization,
    including DLX.
  cpu_pipelining: Pipelined CPU organization, including datapaths, performance metrics,
    dependencies, hazards, stalls, forwarding, control hazards, and branch prediction.
  cpu_scheduling: CPU scheduling in operating systems.
  crisp_dm_methodology: The CRISP-DM methodology and its application to data-mining
    projects, including business and data understanding, data preparation, modeling,
    evaluation, and deployment-oriented project activities.
  cross_compilation: Cross-compilation workflows for building software for cyber-physical
    and embedded-system target platforms.
  cross_platform_mobile_frameworks: Cross-platform and hybrid mobile application development
    using related frameworks and technologies.
  cryptocurrencies: Cryptocurrencies and their relationship to blockchain and distributed-ledger
    technologies.
  cryptographic_key_management: Symmetric and asymmetric cryptographic key-management
    models and systems, including key distribution centers, PKI, and PGP.
  cryptographic_protocol_verification: Formal, automatic, and semi-automatic techniques
    for verifying cryptographic protocols and detecting security bugs.
  cryptographic_protocols: Basic cryptographic protocols and protocols or systems
    such as SSL and PGP.
  cryptographic_security_properties: Cryptographic security properties including confidentiality,
    authentication, and integrity.
  cryptography: Cryptography, including its mathematical foundations, secret-key and
    public-key algorithms, and applications to protection and security in operating
    systems and distributed systems.
  cs_curriculum_design: Computer Science curricula, national guidelines, international
    and Italian school curricula, and the use of textbooks in planning Computer Science
    education.
  cs_education_pedagogy: Pedagogical and didactical approaches for teaching Computer
    Science at different school levels, including the organization of courses and
    study paths.
  cs_teaching_methods: Subject-specific methodologies for teaching Computer Science,
    including dramatization, making and tinkering with physical computing tools, unplugged
    activities, program-comprehension exercises, debugging others' code, and displaying
    machine state during program execution.
  csharp_dotnet_programming: Introduction to the .NET framework and the C# programming
    language.
  cultural_heritage_communication: Principles, strategies, and technologies for communicating
    cultural heritage.
  cyber_conflict: Cyber conflict as a risk and countermeasure context in cybersecurity
    management.
  cyber_deception: Deception as a modern cybersecurity approach for misleading, detecting,
    or disrupting cyber attackers.
  cyber_physical_systems: Cyber-Physical Systems as embedded systems that integrate
    computational components with physical processes.
  cyber_risk_management: Assessment and management of cyber risks to identify priorities
    for prevention, detection, and response across organizational contexts.
  cyber_threat_intelligence: Cyber threat intelligence concerning the analysis of
    cyber threats, including threat actors, motivations, vulnerabilities, and relevant
    defensive responses.
  cybersecurity_governance: Strategic, management, and operational governance of cybersecurity
    in public and private organizations, including defining organizational priorities
    and intervention priorities.
  data_analytics: Data analytics and data elaboration, including practical analysis
    activities for agricultural and Internet-of-Things data.
  data_at_rest_security: Anonymization and encryption for protecting data at rest.
  data_augmentation: Data-augmentation techniques for training image-classification
