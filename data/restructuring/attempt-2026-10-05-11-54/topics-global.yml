  markov_chains: Discrete-time and continuous-time Markov chains for modeling stochastic
    system behavior.
  markov_decision_processes: Markov decision processes for modeling sequential decisions
    under uncertainty.
  markup_languages: Markup and presentation languages for Web-oriented digital resources,
    including XHTML, XML, HTML5, and CSS.
  mathematical_logic: Introductory mathematical logic techniques covered in the course,
    including unification and resolution.
  mathematical_modeling: Mathematical modeling of industrial problems.
  mathematical_morphology: Mathematical morphology as a basic tool for image processing
    and analysis.
  media_market_dynamics: Market dynamics and structures in music and video, including
    relevant player types and the influence of technological evolution and changing
    consumer habits.
  media_value_chains: Value-chain analysis of the music and video industries.
  medical_3d_modeling: Technologies, software, segmentation, and practical design
    for three-dimensional modeling of anatomical structures and customized medical
    devices.
  medical_additive_manufacturing: Technologies and materials for additive printing
    in medicine.
  medical_devices: Medical devices and their use in medical and physiotherapy contexts.
  medical_image_processing: Manipulation of medical images using simple application
    programs.
  medical_imaging_ai: Use of deep-learning techniques for medical-imaging data within
    health AI.
  medical_informatics_software: Use of software tools for medical informatics in academic
    and professional contexts.
  memory_allocation: Memory allocation and direct memory management.
  memory_devices: Memory devices as components of computer architecture.
  memory_hierarchy: Memory-hierarchy goals, reference models, performance parameters,
    address mapping, write and replacement policies, and the organization of main
    memory and caches in Intel IA32 systems.
  memory_io_addressing: Addressing of computer memory and input/output devices.
  memory_organization_pointers: Computer memory organization, including addresses,
