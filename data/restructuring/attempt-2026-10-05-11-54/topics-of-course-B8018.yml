analysis:
  mode: all-courses
source_clusters:
- id: 17
  name: Basic Skills Informatics (17)
course:
  id: B8018
  name: DIGITAL HEALTH M
topics:
  activity_aware_systems: Systems that adapt their behavior based on recognition of
    the user's current activity.
  behavior_change_models: Behavioral-change models used to understand and support
    user engagement, intervention, and health maintenance in digital health systems.
  clinical_efficiency: Use of digital health to improve care-delivery processes, reduce
    errors and bias, and reduce the time and unit or total cost of clinical procedures.
  clinical_studies_ethics: Ethical issues in digital-health research and product or
    prototype development involving human participants, including recruitment, consent,
    and ethics-protocol design.
  clustering: Clustering methods for unsupervised learning, including K-means and
    expectation-maximization (EM).
  computer_vision: Computer-vision topics and applications, including image representation,
    object detection and classification, classical techniques, and deep-learning solutions.
  data_at_rest_security: Anonymization and encryption for protecting data at rest.
  data_science: Fundamental data-science methods for processing structured and unstructured
    data and developing intelligent applications.
  data_visualization: Visualization and graphical representation of datasets and their
    properties, including frequency tables and statistical graphics.
  digital_health: Digital health as an interdisciplinary transformation of healthcare
    involving digital technologies, data, artificial intelligence, sensing, monitoring,
    medical devices, mobile health, and health data science.
  health_data_privacy: Protection, processing, privacy management, and information
    security for health-related data.
  health_data_science: Application of statistics, machine learning, deep learning,
    and reinforcement learning to health datasets for classification, detection, prediction,
    and digital-health interventions.
  health_outcomes_measurement: Measurement of health and wellbeing outcomes to assess
    prevention and intervention effects in digital health.
  healthcare_delivery_systems: National and private healthcare delivery systems, their
    operational contexts, costs, advantages, and disadvantages.
  healthcare_payer_models: Payer models associated with healthcare delivery systems
    in different national and private care contexts.
  iot_systems: Internet of Things systems combining high-level application aspects
    with low-level devices in virtual and real environments.
  jupyter_notebooks: Jupyter notebooks as computational environments for developing
    and running programming solutions.
  machine_learning: Fundamental machine-learning technologies and algorithms for developing
    intelligent applications.
  medical_devices: Medical devices and their use in medical and physiotherapy contexts.
  medical_imaging_ai: Use of deep-learning techniques for medical-imaging data within
    health AI.
  mobile_health: Mobile-health applications and smartphone-based personal health systems
    for monitoring, diagnosis, intervention, support, empowerment, compliance, and
    lifestyle-related measures.
  model_selection_validation: Selection and validation of machine-learning models,
    including assessment and presentation of results.
  neural_networks_deep_learning: Neural networks and deep-learning techniques, including
    their use in machine-learning applications.
  personal_health_cybernetics: The cybernetic direction of personal health systems,
    including interventions, user or patient engagement, behavioral change, convergence,
    and health maintenance.
  personal_health_informatics: The informatics direction of personal health systems,
    including obtaining and interpreting data from users, devices, and platforms,
    with activity recognition as a covered example.
  predictive_analytics: Predictive data analysis using statistical and machine-learning
    models.
  programming_in_python: Programming in Python, including names, visibility, functions,
    objects, classes, and problem-solving applications.
  python_data_science_libraries: Python libraries and frameworks for data science,
    including NumPy and Pandas for numerical computation and data representation,
    and PyTorch and TensorFlow for defining and using machine-learning models.
  regression_analysis: Regression models and algorithms for predicting continuous
    outcomes.
  reinforcement_learning: Reinforcement learning as a machine-learning approach.
  secure_data_management: Privacy and secure management of data in digital-health
    clinical studies and systems.
  smart_homes: Smart homes as complex digital-health platforms integrating devices,
    solutions, sensing, and services for personal health purposes.
  statistical_data_analysis: Statistical analysis of datasets, including descriptive
    analysis and statistical tests used to understand data and assess models.
  supervised_unsupervised_learning: Supervised and unsupervised machine-learning approaches.
  systematic_literature_review: Systematic literature review as a methodology for
    scientific surveys of intelligent and autonomous systems.
  ubiquitous_systems: Design and development of ubiquitous systems and applications
    that use pervasive sensing and processing to provide adaptive services.
