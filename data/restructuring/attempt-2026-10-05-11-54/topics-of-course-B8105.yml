analysis:
  mode: all-courses
source_clusters:
- id: 17
  name: Basic Skills Informatics (17)
course:
  id: B8105
  name: Computational Management of Data
topics:
  algorithm_design_analysis: Algorithm design and analysis for solving problems with
    computers.
  asymptotic_analysis: Analysis of algorithmic computational cost using order-of-magnitude
    estimates.
  backtracking_algorithms: Backtracking as an algorithmic technique for solving computational
    problems.
  basic_data_types: Basic Python data types and their use in solving problems.
  brute_force_algorithms: Brute-force approaches for solving computational problems
    by systematically exploring candidate solutions.
  computability_limits: Limitations of effective procedures, including non-decidable
    problems.
  computational_thinking: Computational thinking as a way of formulating problems
    and designing step-by-step solutions.
  data_models: Structured, semi-structured, and unstructured data models.
  data_serialization: Data presentation, serialization, and deserialization tools
    and technologies for distributed systems.
  data_structures: Elementary data structures including vectors, records, lists, queues,
    stacks, trees, and graphs.
  data_visualization: Visualization and graphical representation of datasets and their
    properties, including frequency tables and statistical graphics.
  database_basics: Introductory coverage of databases at an outline level.
  databases_sql: Databases and SQL queries.
  descriptive_analytics: Descriptive analysis of data of various types using Python
    libraries.
  divide_and_conquer_algorithms: Divide-and-conquer as an algorithmic design paradigm.
  dynamic_programming: Dynamic programming as an algorithm design technique.
  graph_databases: Graph databases, including their configuration and population in
    hands-on data-management activities.
  greedy_algorithms: Greedy algorithm design techniques.
  imperative_constructs: Imperative programming concepts, including algorithms and
    programs, data types, assignment, input/output, conditional statements, and iteration.
  information_representation: Representation of information in digital information-technology
    systems.
  language_evolution: Evolution of programming languages from assembly to higher-level
    languages.
  object_oriented_programming: Fundamental concepts and features of object-oriented
    programming.
  programming_in_python: Programming in Python, including names, visibility, functions,
    objects, classes, and problem-solving applications.
  programming_languages: Introduction to programming languages, including what languages
    are and the role of visual languages.
  python_data_science_libraries: Python libraries and frameworks for data science,
    including NumPy and Pandas for numerical computation and data representation,
    and PyTorch and TensorFlow for defining and using machine-learning models.
  rdf_rdfs: RDF and RDFS for representing metadata and knowledge on the Web, together
    with RDFa and microformats.
  recursive_algorithms: Recursive algorithms and the divide-and-conquer methodology.
  search_algorithms: Search algorithms for solving problems.
  sorting_algorithms: Algorithms for sorting data.
  sparql: Querying RDF and Knowledge Graphs with SPARQL, including queries over the
    DBPedia Knowledge Graph.
  statistical_data_analysis: Statistical analysis of datasets, including descriptive
    analysis and statistical tests used to understand data and assess models.
  test_driven_development: Test-driven development as an iterative software-development
    approach involving automated tests and implementation.
