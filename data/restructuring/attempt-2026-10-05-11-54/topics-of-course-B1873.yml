analysis:
  mode: all-courses
source_clusters:
- id: 5
  name: Computing Education Informatics (5)
course:
  id: B1873
  name: Machine Learning for Humanities
topics:
  classification_algorithms: Classification models and algorithms, including Bayes
    classifiers, k-nearest neighbor, support vector machines, multiclass classification,
    decision trees, and Bayesian networks where specified.
  computer_vision: Computer-vision topics and applications, including image representation,
    object detection and classification, classical techniques, and deep-learning solutions.
  convolutional_neural_networks: Convolutional neural networks (CNNs) as a deep-learning
    architecture.
  feedforward_neural_networks: Feedforward neural-network architectures and their
    use in deep-learning applications.
  generative_ai_models: Generative AI models used as statistical methods for extracting
    knowledge from arbitrary content.
  language_models: Language models, transformer architectures, and efficient attention
    mechanisms for text and language processing.
  large_language_models: Generative large language models and their use in language-processing
    applications.
  machine_learning: Fundamental machine-learning technologies and algorithms for developing
    intelligent applications.
  natural_language_processing: Natural language processing as an artificial-intelligence
    topic and application area.
  neural_networks_deep_learning: Neural networks and deep-learning techniques, including
    their use in machine-learning applications.
  programming_in_python: Programming in Python, including names, visibility, functions,
    objects, classes, and problem-solving applications.
  python_data_science_libraries: Python libraries and frameworks for data science,
    including NumPy and Pandas for numerical computation and data representation,
    and PyTorch and TensorFlow for defining and using machine-learning models.
  regression_analysis: Regression models and algorithms for predicting continuous
    outcomes.
  retrieval_augmented_generation: Retrieval-augmented generation using vector databases.
