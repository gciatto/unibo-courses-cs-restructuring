analysis:
  mode: all-courses
source_clusters:
- id: 25
  name: Administration Systems System (25)
course:
  id: '73025'
  name: Distributed Systems M
topics:
  asynchronous_programming: Asynchronous programming using futures, event loops, continuations,
    promises, and async/await techniques.
  big_data_management: Big Data applications, challenges, technologies, storage approaches,
    programming paradigms, and methodologies for designing Big Data applications.
  dependency_injection_aop: Lightweight enterprise-container techniques, including
    Spring inversion of control and aspect-oriented programming.
  distributed_clustering: Clustering mechanisms and solutions for highly scalable
    distributed enterprise applications, including clustering support in JBoss/WildFly.
  distributed_naming: Resource naming in distributed systems, including DNS and advanced
    name systems.
  distributed_scalability: Scalability considerations in distributed systems.
  distributed_systems: Concepts and organization of distributed systems.
  enterprise_application_servers: Application servers and middleware/frameworks for
    designing, deploying, and running enterprise-level distributed applications, including
    JBoss/WildFly.
  enterprise_components: Component-based enterprise application development, including
    Enterprise JavaBeans, session-oriented and message-oriented components, interceptors,
    component integration, and component-model evolution.
  enterprise_messaging: Enterprise messaging and integration technologies, including
    Java Message Service, Enterprise Service Bus concepts, and Java Business Integration.
  enterprise_persistence: Persistence support for enterprise applications, including
    transparent persistence, object-relational mapping, query support, metadata, performance,
    JPA, and Hibernate.
  enterprise_transactions: Transaction management in enterprise applications and lightweight
    containers, including transaction support in EJB, Spring, and related enterprise
    frameworks.
  fault_tolerance_reliability: Fault-tolerance and reliability concerns in distributed
    enterprise applications and their runtime support systems.
  requirements_analysis: Analysis of software requirements as part of software-system
    planning and development.
  runtime_monitoring_management: Runtime monitoring, control, and management of application
    servers and distributed support frameworks, including JMX and performance evaluation.
  serverless_computing: Function-as-a-Service models and supporting frameworks as
    an evolution toward scalable asynchronous enterprise-server architectures.
  software_architecture: Design of a software system's architecture and definition
    of a logical architecture for the problem domain.
  stream_processing: Introductory high-performance online stream processing of big
    data over clustered distributed systems.
