analysis:
  mode: all-courses
source_clusters:
- id: 3
  name: Fashion Technologies Immersive (3)
course:
  id: '73273'
  name: Informatic Tecnologies for Fashion
topics:
  algorithm_design_analysis: Algorithm design and analysis for solving problems with
    computers.
  augmented_reality: Introduction to augmented reality and its applications in the
    course context.
  computer_networks: Basic concepts of computer networks.
  digital_privacy_security: Digital privacy and security issues associated with information
    technology.
  information_representation: Representation of information in digital information-technology
    systems.
  information_retrieval: Basic information-retrieval models, including Boolean and
    vector-space models, text analysis, and web information retrieval with PageRank.
  internet_world_wide_web: The Internet and the World Wide Web.
  it_security: Basic information-technology security issues, including viruses and
    phishing.
  markup_languages: Markup and presentation languages for Web-oriented digital resources,
    including XHTML, XML, HTML5, and CSS.
  multimedia_information: Representation of multimedia information using digital technologies.
  productivity_software: Individual productivity software, including spreadsheets,
    word processors, and presentation software.
  seo: Search-engine optimization as a Web and communication technology.
  social_implications_it: Social implications of information technology.
  three_dimensional_modeling: Three-dimensional modeling using software tools, including
    applications to cultural-heritage objects and fashion design.
  virtual_reality: Introduction to virtual reality.
  web_frameworks_content_management: Use of Web-development frameworks and content
    management systems.
