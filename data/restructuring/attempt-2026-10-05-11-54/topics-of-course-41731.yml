  name: Web Technologies Web-Related (13)
course:
  id: '41731'
  name: Web-related Technologies
topics:
  http_web_protocols: Web communication protocols and identifiers, including HTTP,
    URIs, WebSocket, HTTP/2, HTTP/3, and QUIC.
  internet_world_wide_web: The Internet and the World Wide Web.
  markup_languages: Markup and presentation languages for Web-oriented digital resources,
    including XHTML, XML, HTML5, and CSS.
  user_interface_design: Basics of designing user interfaces.
  web_api_design: Design of Web application interfaces and APIs, including REST principles.
  web_client_side_programming: Client-side Web programming using JavaScript and Ajax,
    including single-page applications and React.js.
  web_server_side_programming: Server-side Web programming and execution environments,
    including Servlets, JSP, event-oriented and stateless models, Node.js, and asynchronous
    I/O management.
