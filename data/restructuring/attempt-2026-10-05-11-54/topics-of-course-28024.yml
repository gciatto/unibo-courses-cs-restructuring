analysis:
  mode: all-courses
source_clusters:
- id: 15
  name: Network Networks Programming (15)
course:
  id: '28024'
  name: Computer Networks T
topics:
  client_server_model: Client/server interaction and the design of small client/server
    applications.
  computer_networks: Basic concepts of computer networks.
  distributed_communication: Communication mechanisms for distributed systems.
  distributed_naming: Resource naming in distributed systems, including DNS and advanced
    name systems.
  distributed_systems: Concepts and organization of distributed systems.
  file_systems: File systems as an operating-system component.
  network_sockets: Sockets and socket APIs for C on UNIX and Java as tools for client/server
    communication.
  operating_systems: Operating-system structure and main functions.
  osi_model: The ISO OSI layered organization, including network, transport, session,
    presentation, and application layers.
  processes_threads: Processes and threads in operating systems.
  remote_procedure_call: Remote invocation mechanisms for distributed applications,
    including Sun RPC and Java RMI.
  resource_management: Management and awareness of system resources across layers
    when designing distributed and system-level solutions.
  system_programming: System programming practices using UNIX tools and C or Java
    environments, with attention to resource usage, correctness, protocols, and user
    interfaces.
  tcp_ip_protocols: TCP/IP protocol-suite connections and common synchronous and asynchronous
    applications such as remote terminals, file transfer, mail, and news.
