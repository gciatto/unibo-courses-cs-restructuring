analysis:
  mode: all-courses
source_clusters:
- id: 21
  name: Artificial Intelligence Fundamentals (21)
course:
  id: '91411'
  name: Intelligent Robotic Systems
topics:
  ai_planning: Planning problems as a problem-solving approach in artificial intelligence.
  associative_learning: Associative learning mechanisms applied to robot adaptation
    and learning.
  behavior_based_robotics: Behavior-based robotics paradigms for coordinating robot
    behaviors, including Subsumption Architecture, motor schemas, and behavior trees.
  evolutionary_robotics: Artificial evolution and evolutionary robotics for adapting
    or designing robot behaviors and programs.
  fuzzy_logic_systems: Fuzzy logic and fuzzy systems used in robot behavior and control.
  reinforcement_learning: Reinforcement learning as a machine-learning approach.
  robot_control_evaluation: Experimental evaluation and parameter tuning of robot
    control software.
  robot_navigation: Robot navigation and path-planning problems, including solution
    approaches for navigating physical environments.
  robot_program_synthesis: Automatic design of programs for controlling robots.
  robotics: Robotics as an application and recent trend of artificial intelligence.
  search_algorithms: Search algorithms for solving problems.
  simulation: Simulation methods used to analyze and solve industrial use cases.
  swarm_robotics: Robotic systems involving swarm behavior and coordination among
    multiple robots.
