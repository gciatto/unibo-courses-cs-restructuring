analysis:
  mode: all-courses
source_clusters:
- id: 24
  name: Systems Distributed Models (24)
course:
  id: '66870'
  name: Concurrent Models and Systems
topics:
  bisimulation_equivalence: Bisimulation-based behavioral equivalences for linear
    nets, forking nets, and Petri nets, including strong, weak, branching, team, place,
    structure-preserving, sequential, concurrent, and causal variants.
  ccs_calculus: The Calculus of Communicating Systems (CCS), including its syntax,
    structural operational semantics, Turing completeness of finitary CCS, and undecidability
    of behavioral equivalences.
  computability_limits: Limitations of effective procedures, including non-decidable
    problems.
  concurrency_formal_modeling: Formal and visual modeling of concurrent systems using
    Petri Nets, Statecharts, and Activity Diagrams.
  concurrent_computing: The concurrent programming paradigm.
  distributed_systems: Concepts and organization of distributed systems.
  labeled_transition_systems: Labeled transition systems for modeling the behavior
    of concurrent and distributed systems.
  modal_logic: Modal and epistemic logic for representing and reasoning about modalities
    and knowledge.
  process_algebra: Process-algebraic modeling and reasoning, including the process
    algebras Lin, Fork, and Pet, representability theorems, congruence properties,
    and axiomatization.
