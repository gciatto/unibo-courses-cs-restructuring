analysis:
  mode: all-courses
source_clusters:
- id: 29
  name: Informatics Informatic Humanities (29)
course:
  id: '82202'
  name: Informatic
topics:
  big_data_management: Big Data applications, challenges, technologies, storage approaches,
    programming paradigms, and methodologies for designing Big Data applications.
  computer_hardware_architecture: Hardware architecture of computers.
  computer_networks: Basic concepts of computer networks.
  computer_operation: Principles governing the operation of computers.
  computer_software_basics: Basic computer software, including the classification
    and use of simple application programs.
  data_visualization: Visualization and graphical representation of datasets and their
    properties, including frequency tables and statistical graphics.
  database_architectures: Database management system architectures, including three-tier
    and client-server architectures, with introductory coverage of distributed and
    cloud database systems.
  database_basics: Introductory coverage of databases at an outline level.
  digital_document_lifecycle: Dematerialisation, lifecycle management, and preservation
    of digital documents in clinical and public-health settings.
  health_data_privacy: Protection, processing, privacy management, and information
    security for health-related data.
  healthcare_data_archiving: Data archiving in clinical pathology, pathological anatomy,
    and transfusion medicine.
  healthcare_information_systems: Laboratory Information Systems, Hospital Information
    Systems, and electronic health records in healthcare settings.
  information_retrieval: Basic information-retrieval models, including Boolean and
    vector-space models, text analysis, and web information retrieval with PageRank.
  internet_world_wide_web: The Internet and the World Wide Web.
  productivity_software: Individual productivity software, including spreadsheets,
    word processors, and presentation software.
  relational_data_model: Structure of the relational data model, integrity constraints,
    and normal forms.
  relational_database_design: Relational database design using the Entity-Relationship
    model, conceptual and logical design, and normalization techniques.
  spreadsheet_data_processing: Organizing, cleaning, and processing data in spreadsheets,
    including the use of Excel for data-processing tasks.
  telemedicine: Introduction to telemedicine as an emerging healthcare application
    of information technology.
  text_hypertext_management: Management of texts and hypertexts using simple application
    programs.
