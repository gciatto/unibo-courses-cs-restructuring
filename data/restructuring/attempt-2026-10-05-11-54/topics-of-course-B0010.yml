analysis:
  mode: all-courses
source_clusters:
- id: 14
  name: Engineering Software Cultural (14)
course:
  id: B0010
  name: Software Architecture and Platforms
topics:
  architectural_quality_attributes: Quality attributes used to analyze and evaluate
    software architectures in relation to organizational contexts.
  architectural_thinking: Foundational concepts and ways of thinking about software
    architecture, including the role and responsibilities of the software architect.
  autonomous_systems: Concepts, definitions, and interactions involving autonomous
    systems in intelligent-systems engineering.
  cloud_computing: Cloud computing for Big Data, including comparisons between on-premises
    and cloud clusters, cloud technology stacks, and deployment of case studies on
    cloud providers.
  cognitive_architectures: Cognitive architectures considered in the context of autonomous
    and intelligent systems.
  cyber_physical_systems: Cyber-Physical Systems as embedded systems that integrate
    computational components with physical processes.
  design_patterns: Design patterns used in software design.
  devops_practices: DevOps practices and tools supporting the development, deployment,
    and maintenance of software systems.
  digital_twins: Digital-twin concepts and their use in simulation.
  domain_driven_design: Domain-Driven Design concepts and building blocks, including
    domains, bounded contexts, models, ubiquitous language, entities, value objects,
    aggregates, repositories, services, factories, domain events, and anti-corruption
    layers.
  event_driven_computing: Event-driven computational models and applications, including
    proactive-reactive distributed software.
  intelligent_agents: Agents as systems that exhibit intelligent behavior, including
    the notion of an agent and the construction of systems that simulate human-expert
    behavior in specific disciplines.
  intelligent_systems: Definitions, problem types, and application areas of intelligent
    systems.
  iot_systems: Internet of Things systems combining high-level application aspects
    with low-level devices in virtual and real environments.
  microservices_architecture: Microservices as a distributed software-architecture
    style and as an architectural choice for subsystems.
  requirements_analysis: Analysis of software requirements as part of software-system
    planning and development.
  service_oriented_computing: Service-oriented computing, including Jolie.
  software_architecture: Design of a software system's architecture and definition
    of a logical architecture for the problem domain.
  software_design_principles: Design principles concerning rigidity, fragility, and
    immobility in software.
  software_engineering: Introduction to software engineering and the analysis, design,
    development, and testing of software systems.
  ubiquitous_systems: Design and development of ubiquitous systems and applications
    that use pervasive sensing and processing to provide adaptive services.
  uml_modeling: Modeling software systems with UML use case, class, object, sequence,
    collaboration, state, activity, component, and deployment diagrams.
  web_api_design: Design of Web application interfaces and APIs, including REST principles.
  web_of_things: Introductory Web of Things concepts for connecting and integrating
    embedded and Internet-of-Things devices with Web technologies.
