analysis:
  mode: all-courses
source_clusters:
- id: 20
  name: Language Natural Processing (20)
course:
  id: '96725'
  name: IT and Game Localization
topics:
  localization_accessibility: Application of media accessibility requirements when
    localizing videogames, IT products, and web contents.
  localization_bug_prevention: Identification and prevention of bugs and other localization-specific
    problems in software applications.
  localization_editing_revision: Editing and revision of localized texts as part of
    software and digital-content localization.
  localization_information_mining: Information-mining techniques used in the localization
    of videogames, IT products, and web contents.
  localization_interface_constraints: Management of size and visual restrictions affecting
    localized software interfaces and other digital application content.
  localization_placeholders: Handling variables and placeholders in localized software
    content.
  localization_quality_assessment: Assessment of the linguistic quality of a localized
    videogame, IT product, or web content as a whole.
  localization_translation_adaptation: Translation and adaptation of complex digital
    applications and their varied text types between English and Italian.
  software_localization: Localization of software and IT products, including the distinctive
    features, conventions, and potential pitfalls of adapting software content.
  videogame_localization: Localization of videogames, including the adaptation of
    dialogues, interfaces, tutorials, and other text types found in videogame applications.
  web_content_localization: Localization of web contents and their adaptation between
    English and Italian.
