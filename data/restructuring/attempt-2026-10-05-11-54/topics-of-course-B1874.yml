analysis:
  mode: all-courses
source_clusters:
- id: 14
  name: Engineering Software Cultural (14)
course:
  id: B1874
  name: Project Management and Software Engineering for Cultural Heritage
topics:
  agile_software_development: Agile software development practices and approaches.
  design_patterns: Design patterns used in software design.
  project_management: Project management principles, methodologies, processes, knowledge
    areas, project life cycles, and management of scope, time, cost, quality, resources,
    communications, risks, procurement, integration, and stakeholders, including traditional,
    incremental, iterative, and adaptive approaches.
  requirements_analysis: Analysis of software requirements as part of software-system
    planning and development.
  resource_planning: Planning and management of resources in industrial problems.
  risk_analysis: Risk analysis in information-system design and planning.
  software_engineering: Introduction to software engineering and the analysis, design,
    development, and testing of software systems.
  software_lifecycle: Phases and activities in the lifecycle of software systems,
    including planning, requirements analysis, design, production, testing, certification,
    and maintenance.
  software_testing: Testing activities for software systems.
