analysis:
  mode: all-courses
source_clusters:
- id: 13
  name: Web Technologies Web-Related (13)
course:
  id: '95645'
  name: Foundations of Web Systems
topics:
  character_encoding: Character encoding and digital formats for producing humanistic
    digital objects.
  http_web_protocols: Web communication protocols and identifiers, including HTTP,
    URIs, WebSocket, HTTP/2, HTTP/3, and QUIC.
  human_computer_interaction: Human-Computer Interaction and its relationship to user
    experience in the design of interactive services.
  javascript_programming: JavaScript as a dynamic functional language with a prototype-based
    object model.
  json_data_format: JSON as a data representation format used in basic Web technologies.
  markup_languages: Markup and presentation languages for Web-oriented digital resources,
    including XHTML, XML, HTML5, and CSS.
  usability_design_guidelines: Guidelines, patterns, standards, and methods for designing
    usable interactive systems, including usability considerations for Web applications
    and mobile apps.
  user_experience_design: User Experience and Experience Design principles and methodologies
    for designing interactive applications and systems.
  web_accessibility: Web accessibility principles and considerations for designing
    Web applications and content that can be accessed and used by diverse users.
  web_client_side_programming: Client-side Web programming using JavaScript and Ajax,
    including single-page applications and React.js.
  web_frameworks_content_management: Use of Web-development frameworks and content
    management systems.
