analysis:
  mode: all-courses
source_clusters:
- id: 0
  name: Security Information Cryptography (0)
course:
  id: B0833
  name: Computer Security Laboratory T
topics:
  access_control_models: Access-control models and their implementation for protecting
    systems and information.
  application_security: Security considerations for applications, including Web and
    mobile application security.
  authentication_models: Authentication systems and principles for designing secure
    authentication protocols.
  cryptographic_protocols: Basic cryptographic protocols and protocols or systems
    such as SSL and PGP.
  cryptography: Cryptography, including its mathematical foundations, secret-key and
    public-key algorithms, and applications to protection and security in operating
    systems and distributed systems.
  data_at_rest_security: Anonymization and encryption for protecting data at rest.
  incident_response_recovery: Incident-response and recovery activities following
    security incidents.
  intrusion_detection_monitoring: Attack detection using intrusion-detection systems,
    intrusion-prevention systems, and SIEM platforms.
  network_firewalls: Firewalls for preventing network-based attacks.
  offensive_security: Practical red-team security methods, including vulnerability
    identification, the cybersecurity kill chain, enumeration, scanning, credential
    brute forcing, privilege-escalation exploitation, web-application exploitation,
    and binary-code exploitation.
  operating_system_security_hardening: Basic operating-system hardening and mitigation
    of configuration weaknesses.
  physical_security: Physical security as a component of protecting computing systems.
  secure_network_communications: Secure communication protocols and virtual private
    networks for protecting data in transit.
  security_frameworks_certifications: Formal models for secure-system development,
    security frameworks, and security certifications.
  security_threats_vulnerabilities_risk: Security threats, vulnerabilities, exploits,
    risks, attack methods, and their impacts on information and systems.
