analysis:
  mode: all-courses
source_clusters:
- id: 17
  name: Basic Skills Informatics (17)
course:
  id: '75969'
  name: Basic Informatics
topics:
  algorithm_design_analysis: Algorithm design and analysis for solving problems with
    computers.
  computability_limits: Limitations of effective procedures, including non-decidable
    problems.
  computational_thinking: Computational thinking as a way of formulating problems
    and designing step-by-step solutions.
  computer_networks: Basic concepts of computer networks.
  computer_operation: Principles governing the operation of computers.
  data_structures: Elementary data structures including vectors, records, lists, queues,
    stacks, trees, and graphs.
  digital_humanities: Digital Humanities concepts, projects, tools, and computational
    technologies for humanities studies.
  distributed_naming: Resource naming in distributed systems, including DNS and advanced
    name systems.
  http_web_protocols: Web communication protocols and identifiers, including HTTP,
    URIs, WebSocket, HTTP/2, HTTP/3, and QUIC.
  internet_architecture: Organization and structure of the Internet, including internetworking
    fundamentals and communication across LAN, WAN, and MAN environments.
  internet_world_wide_web: The Internet and the World Wide Web.
  markup_languages: Markup and presentation languages for Web-oriented digital resources,
    including XHTML, XML, HTML5, and CSS.
  programming_languages: Introduction to programming languages, including what languages
    are and the role of visual languages.
  tcp_ip_protocols: TCP/IP protocol-suite connections and common synchronous and asynchronous
    applications such as remote terminals, file transfer, mail, and news.
  web_browsers: Web browsers, including what they are and their role in accessing
    Web resources.
  web_servers: Introduction to Web servers in the context of delivering Web pages
    and responding to Web requests.
