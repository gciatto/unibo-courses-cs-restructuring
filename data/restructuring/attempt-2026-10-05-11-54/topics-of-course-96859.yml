analysis:
  mode: all-courses
source_clusters:
- id: 4
  name: Internet Things Systems (4)
course:
  id: '96859'
  name: Embedded Systems and Internet of Things
topics:
  augmented_reality: Introduction to augmented reality and its applications in the
    course context.
  concurrent_computing: The concurrent programming paradigm.
  cyber_physical_systems: Cyber-Physical Systems as embedded systems that integrate
    computational components with physical processes.
  digital_twins: Digital-twin concepts and their use in simulation.
  electronics_fundamentals: Fundamentals of passive-component electronics, including
    current, potential, power, energy, Kirchhoff's laws, resistors, capacitors, inductors,
    transformers, diodes, transistors, and digital electronics.
  embedded_systems: Embedded-system hardware and software, including microcontrollers,
    systems-on-chip, sensors, actuators, electronics, and programming models such
    as super-loops, tasks, and real-time operating-system-based architectures.
  event_driven_computing: Event-driven computational models and applications, including
    proactive-reactive distributed software.
  finite_state_machines: Finite state machine modeling.
  iot_systems: Internet of Things systems combining high-level application aspects
    with low-level devices in virtual and real environments.
  message_passing: Message-passing models and implementations for interactions among
    distributed software components.
  mixed_reality: The mixed-reality continuum from augmented reality to virtual reality
    and the technologies supporting mixed-reality environments.
  mobile_application_development: Development of mobile applications for Android and
    iOS, including platform setup, SDKs, platform architectures and components, Kotlin,
    Swift, Objective-C, Android Activities, iOS targets, actions, and outlets.
  programming_in_cpp: Introduction to programming and creating programs using C++.
  real_time_operating_systems: Architecture, functionality, programming, and use of
    modern real-time operating systems, including FreeRTOS, NuttX, and Zephyr.
  real_time_scheduling: Clock-driven and priority-driven scheduling approaches for
    real-time systems, including RM, DM, EDF, and LSTF algorithms and server-based
    strategies for soft real-time aperiodic tasks.
  real_time_systems: Introduction to real-time systems, including their distinguishing
    features and typical application domains, with emphasis on design issues, implementation
    strategies, support environments, and performance evaluation.
  web_of_things: Introductory Web of Things concepts for connecting and integrating
    embedded and Internet-of-Things devices with Web technologies.
  wireless_communication_systems: Wireless communication systems, including propagation
    and fading models and an overview of wireless technologies such as IEEE 802.11,
    IEEE 802.16, IEEE 802.20, cellular networks, Bluetooth, and ZigBee.
