analysis:
  mode: all-courses
source_clusters:
- id: 7
  name: Informatica Computer Science (7)
course:
  id: '41588'
  name: INTRODUZIONE ALL'ANALISI DEI DATI
topics:
  algorithm_design_analysis: Algorithm design and analysis for solving problems with
    computers.
  analytics_types: Types of data analytics, including diagnostic, descriptive, predictive,
    and prescriptive analytics.
  basic_data_types: Basic Python data types and their use in solving problems.
  biological_data_types: Types of biological data and the use of suitable data structures
    for representing them.
  classification_algorithms: Classification models and algorithms, including Bayes
    classifiers, k-nearest neighbor, support vector machines, multiclass classification,
    decision trees, and Bayesian networks where specified.
  data_pipeline_design: Design of data-pipeline processes from data acquisition through
    data analysis and valorization.
  data_structures: Elementary data structures including vectors, records, lists, queues,
    stacks, trees, and graphs.
  descriptive_analytics: Descriptive analysis of data of various types using Python
    libraries.
  functions: Functions in Python and their use in programming problem solutions.
  imperative_constructs: Imperative programming concepts, including algorithms and
    programs, data types, assignment, input/output, conditional statements, and iteration.
  predictive_analytics: Predictive data analysis using statistical and machine-learning
    models.
  program_structure_libraries: Program structure, header inclusion, libraries, and
    library functions.
  programming_in_python: Programming in Python, including names, visibility, functions,
    objects, classes, and problem-solving applications.
  regression_analysis: Regression models and algorithms for predicting continuous
    outcomes.
  statistical_data_analysis: Statistical analysis of datasets, including descriptive
    analysis and statistical tests used to understand data and assess models.
  variable_importance_analysis: Use of statistical tests and model analysis to identify
    important variables.
