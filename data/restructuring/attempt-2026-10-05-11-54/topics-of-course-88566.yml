analysis:
  mode: all-courses
source_clusters:
- id: 13
  name: Web Technologies Web-Related (13)
course:
  id: '88566'
  name: Web Technology
topics:
  application_layer_protocols: Application-layer network protocols and architectures,
    including Web and HTTP, FTP, SMTP, POP3, IMAP, DNS, and peer-to-peer systems such
    as BitTorrent.
  character_encoding: Character encoding and digital formats for producing humanistic
    digital objects.
  http_web_protocols: Web communication protocols and identifiers, including HTTP,
    URIs, WebSocket, HTTP/2, HTTP/3, and QUIC.
  javascript_programming: JavaScript as a dynamic functional language with a prototype-based
    object model.
  json_data_format: JSON as a data representation format used in basic Web technologies.
  markup_languages: Markup and presentation languages for Web-oriented digital resources,
    including XHTML, XML, HTML5, and CSS.
  ontology_engineering: Knowledge representation and ontology development using OWL
    and related conceptualisation methods.
  rdf_rdfs: RDF and RDFS for representing metadata and knowledge on the Web, together
    with RDFa and microformats.
  semantic_web: Architecture, concepts, standards, languages, and technologies of
    the Semantic Web.
  sparql: Querying RDF and Knowledge Graphs with SPARQL, including queries over the
    DBPedia Knowledge Graph.
  user_experience_design: User Experience and Experience Design principles and methodologies
    for designing interactive applications and systems.
  web_client_side_programming: Client-side Web programming using JavaScript and Ajax,
    including single-page applications and React.js.
  web_frameworks_content_management: Use of Web-development frameworks and content
    management systems.
  web_server_side_programming: Server-side Web programming and execution environments,
    including Servlets, JSP, event-oriented and stateless models, Node.js, and asynchronous
    I/O management.
