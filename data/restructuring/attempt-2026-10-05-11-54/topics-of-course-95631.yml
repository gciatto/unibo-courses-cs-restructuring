analysis:
  mode: all-courses
source_clusters:
- id: 2
  name: Big Data Cloud (2)
course:
  id: '95631'
  name: Machine Learning and Data Mining
topics:
  association_rule_mining: Mining association rules from data.
  classification_algorithms: Classification models and algorithms, including Bayes
    classifiers, k-nearest neighbor, support vector machines, multiclass classification,
    decision trees, and Bayesian networks where specified.
  clustering: Clustering methods for unsupervised learning, including K-means and
    expectation-maximization (EM).
  crisp_dm_methodology: The CRISP-DM methodology and its application to data-mining
    projects, including business and data understanding, data preparation, modeling,
    evaluation, and deployment-oriented project activities.
  data_lakes: Data Lake concepts, architectures, and use as an enabling technology
    for data-mining processes.
  data_mining: Data-mining techniques and workflows, including knowledge discovery,
    data understanding and preparation, classification with decision trees and Bayesian
    networks, association rules, clustering, outlier detection, validation, and practical
    use of mining tools.
  data_warehousing: Enterprise data warehouse architectures, administration, reporting
    and OLAP analysis, and the data-warehouse lifecycle from data-source and requirements
    analysis through conceptual and logical design, ETL procedures, workload and volume
    assessment, and physical design.
  ensemble_learning: Ensemble-learning methods, including bagging, boosting, random
    forests, and related ensemble models, for predictive and machine-learning applications.
  machine_learning: Fundamental machine-learning technologies and algorithms for developing
    intelligent applications.
  model_evaluation: Evaluation methods for generative and machine-learning models.
  model_selection_validation: Selection and validation of machine-learning models,
    including assessment and presentation of results.
  regression_analysis: Regression models and algorithms for predicting continuous
    outcomes.
  supervised_unsupervised_learning: Supervised and unsupervised machine-learning approaches.
