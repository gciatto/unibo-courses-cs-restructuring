analysis:
  mode: all-courses
source_clusters:
- id: 26
  name: Programming Software Design (26)
course:
  id: '72671'
  name: Complements of Programming Languages
topics:
  code_transformation: Transformation of source code, including generation of intermediate
    code for standard and advanced programming-language features.
  language_implementation: Abstract machines, interpreters, compilers, and implementation
    of programming-language constructs.
  language_syntax: Formal description of programming-language syntax, including Backus–Naur
    form and related grammar notation.
  lexical_analysis: Design of lexical analysers, including the use of Lex.
  static_analysis: Static analysis of programs, including checking correctness properties
    and analyzing resource and asset consumption without executing the code.
  symbol_tables: Symbol tables used during semantic analysis of programs.
  type_checking: Types and type-checking mechanisms in programming languages.
