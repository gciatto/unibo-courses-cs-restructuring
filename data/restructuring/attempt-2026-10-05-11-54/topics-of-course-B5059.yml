analysis:
  mode: all-courses
source_clusters:
- id: 19
  name: Cultural Heritage Computer (19)
course:
  id: B5059
  name: Interaction Media Design
topics:
  cognitive_science: Cognitive-science approaches to cognition, including theoretical,
    empirical, and neurocognitive perspectives.
  computer_graphics: Computer-graphics principles used to design and create virtual
    and augmented reality environments.
  computer_vision: Computer-vision topics and applications, including image representation,
    object detection and classification, classical techniques, and deep-learning solutions.
  cultural_heritage_communication: Principles, strategies, and technologies for communicating
    cultural heritage.
  digital_image_formats: Digital-image formats used in document digitisation, together
    with considerations for visualisation and storage on different media.
  digital_image_processing: Basic concepts, algorithms, tools, and systems for processing
    and analyzing digital images.
  digital_images: Use of digital images in cultural-heritage communication.
  human_computer_interaction: Human-Computer Interaction and its relationship to user
    experience in the design of interactive services.
  image_color_models: Color models used as basic tools for image processing.
  image_formation_acquisition: Image formation and acquisition using pinhole cameras,
    perspective projection, lenses, field of view, depth of field, and image sensors.
  interaction_design: Design of interaction systems and interactive applications using
    tasks, design methods, and human-centered development processes.
  interaction_models: Foundational models and frameworks for human-computer interaction,
    including Norman’s Model of Interaction and the Abowd and Beale interaction framework.
  mental_models: Mental models as a consideration in the design of human-computer
    interactions.
  multimedia_information: Representation of multimedia information using digital technologies.
  prototyping: Low- and high-fidelity prototyping as methods for developing and evaluating
    interactive applications.
  three_dimensional_modeling: Three-dimensional modeling using software tools, including
    applications to cultural-heritage objects and fashion design.
  usability_design_guidelines: Guidelines, patterns, standards, and methods for designing
    usable interactive systems, including usability considerations for Web applications
    and mobile apps.
  usability_evaluation: Theories and methods for evaluating interface usability, including
    heuristic evaluation and introductory user-study approaches.
  user_experience_design: User Experience and Experience Design principles and methodologies
    for designing interactive applications and systems.
  user_research_methods: User-centered research methods, including semi-structured
    interviews, contextual inquiry, observation, personas, empathy maps, experience
    maps, surveys, and research planning.
  virtual_tours: Virtual tours as a digital technology for communicating cultural
    heritage.
