analysis:
  mode: all-courses
source_clusters:
- id: 4
  name: Internet Things Systems (4)
course:
  id: '99195'
  name: Cyber-Physical Systems Programming M
topics:
  autonomous_systems: Concepts, definitions, and interactions involving autonomous
    systems in intelligent-systems engineering.
  cps_middleware: Middleware for cyber-physical systems, including microROS, XRCE-DDS,
    and DDS for communication among CPS components.
  cross_compilation: Cross-compilation workflows for building software for cyber-physical
    and embedded-system target platforms.
  cyber_physical_systems: Cyber-Physical Systems as embedded systems that integrate
    computational components with physical processes.
  debugging: Debugging as a programming practice for identifying and correcting errors
    in programs.
  development_environment: Use of a development environment for programming.
  digital_signatures: Digital signatures as a cryptographic mechanism for authentication
    and integrity.
  embedded_cybersecurity: Cybersecurity mechanisms for embedded and cyber-physical
    systems, including Trusted Execution Environments, Trusted Platform Modules, firmware
    signature verification, control-flow integrity, and secure communication.
  embedded_device_drivers: Development and configuration of device drivers for sensors
    and other peripherals in embedded and real-time systems.
  embedded_firmware: Bare-metal embedded-firmware development, including C runtimes,
    call stacks, bootloaders, and firmware applications.
  embedded_systems: Embedded-system hardware and software, including microcontrollers,
    systems-on-chip, sensors, actuators, electronics, and programming models such
    as super-loops, tasks, and real-time operating-system-based architectures.
  heterogeneous_computing: Software development for heterogeneous platforms containing
    multicore processors, co-processors, and hardware and software accelerators.
  iot_systems: Internet of Things systems combining high-level application aspects
    with low-level devices in virtual and real environments.
  language_implementation: Abstract machines, interpreters, compilers, and implementation
    of programming-language constructs.
  message_oriented_middleware: Message-oriented middleware, including message-oriented
    communication environments and middleware-based message exchange.
  neural_networks_deep_learning: Neural networks and deep-learning techniques, including
    their use in machine-learning applications.
  programming_in_c: Introduction to programming and software development using the
    C language.
  publish_subscribe_messaging: Event management and publish/subscribe models, including
    event-router topologies, interest and subscription propagation, routing decisions,
    OMG DDS, distributed events, GENA, RSS/Atom, SIP Event Framework, and Web Services
    Eventing and Notification.
  real_time_operating_systems: Architecture, functionality, programming, and use of
    modern real-time operating systems, including FreeRTOS, NuttX, and Zephyr.
  real_time_systems: Introduction to real-time systems, including their distinguishing
    features and typical application domains, with emphasis on design issues, implementation
    strategies, support environments, and performance evaluation.
  reinforcement_learning: Reinforcement learning as a machine-learning approach.
  robotics: Robotics as an application and recent trend of artificial intelligence.
  secure_network_communications: Secure communication protocols and virtual private
    networks for protecting data in transit.
  sensor_data_stream_processing: Processing of real-time data streams from sensors
    toward actuators in cyber-physical-system applications.
  software_architecture: Design of a software system's architecture and definition
    of a logical architecture for the problem domain.
  system_calls: System calls used by programs to request operating-system services.
