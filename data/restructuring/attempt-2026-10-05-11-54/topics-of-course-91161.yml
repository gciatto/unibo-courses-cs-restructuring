analysis:
  mode: all-courses
source_clusters:
- id: 5
  name: Computing Education Informatics (5)
course:
  id: '91161'
  name: Networks, Security And Data Bases
topics:
  boolean_algebra: Elements of Boolean algebra and logical functions.
  computer_networks: Basic concepts of computer networks.
  cryptography: Cryptography, including its mathematical foundations, secret-key and
    public-key algorithms, and applications to protection and security in operating
    systems and distributed systems.
  database_design: Database design using the Entity-Relationship (ER) language and
    relational-model concepts.
  databases_sql: Databases and SQL queries.
  internet_applications: Prominent Internet applications and communication services,
    including email, news, chat, and peer-to-peer file sharing.
  internet_architecture: Organization and structure of the Internet, including internetworking
    fundamentals and communication across LAN, WAN, and MAN environments.
  modular_arithmetic: Basics of modular arithmetic as used in the study of cryptography.
  programming_in_python: Programming in Python, including names, visibility, functions,
    objects, classes, and problem-solving applications.
  rdbms_components: Main components of relational database management systems, including
    query optimization, transaction management, scheduling, recovery, caching, storage
    management, and access methods.
  relational_algebra: Relational algebra, including its basic and derived operators.
  relational_data_model: Structure of the relational data model, integrity constraints,
    and normal forms.
  relational_database_design: Relational database design using the Entity-Relationship
    model, conceptual and logical design, and normalization techniques.
