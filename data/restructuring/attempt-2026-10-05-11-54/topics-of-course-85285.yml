topics:
  asymptotic_analysis: Analysis of algorithmic computational cost using order-of-magnitude
    estimates.
  basic_data_types: Basic Python data types and their use in solving problems.
  data_structures: Elementary data structures including vectors, records, lists, queues,
    stacks, trees, and graphs.
  dynamic_programming: Dynamic programming as an algorithm design technique.
  exceptions: Exceptions as a programming-language construct.
  functional_programming: The functional programming paradigm, including functional
    parameters, closures, and Scala.
  functions: Functions in Python and their use in programming problem solutions.
  machine_learning: Fundamental machine-learning technologies and algorithms for developing
    intelligent applications.
  monte_carlo_simulation: Monte Carlo simulation methods based on stochastic programs,
    sampling, and repeated random experiments.
  object_mutability: Immutable and mutable objects in Python.
  object_oriented_programming: Fundamental concepts and features of object-oriented
    programming.
  probability_distributions: Probability concepts and probability distributions used
    in stochastic programming and analysis of experimental data.
  programming_basics: Basic principles of programming.
  programming_in_python: Programming in Python, including names, visibility, functions,
    objects, classes, and problem-solving applications.
  scope_visibility: Names and visibility rules in Python programs.
  software_testing: Testing activities for software systems.
  statistical_data_analysis: Statistical analysis of datasets, including descriptive
    analysis and statistical tests used to understand data and assess models.
