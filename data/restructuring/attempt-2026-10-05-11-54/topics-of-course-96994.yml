  mode: all-courses
source_clusters:
- id: 11
  name: Computer Computing High-Performance (11)
course:
  id: '96994'
  name: Smart Vehicular-Systems
topics:
  artificial_intelligence: Introduction to the main principles, methods, history,
    application fields, and problem-solving approaches of artificial intelligence.
  autonomous_systems: Concepts, definitions, and interactions involving autonomous
    systems in intelligent-systems engineering.
  autonomous_vehicular_systems: Connected and autonomous vehicular systems, ranging
    from Advanced Driver Assistance Systems to fully autonomous driving, including
    sensing, perception, decision-making, planning, control, computation architectures,
    design, deployment, and validation.
  digital_twins: Digital-twin concepts and their use in simulation.
  distributed_systems: Concepts and organization of distributed systems.
  robotics: Robotics as an application and recent trend of artificial intelligence.
  simulation_tools: Design and implementation of simulators and simulation tools.
  vehicular_communications: Vehicular communication challenges, opportunities, and
    deployments, including vehicle-to-vehicle (V2V) and vehicle-to-infrastructure
    (V2I) communication and the effects of mobility and propagation on performance.
