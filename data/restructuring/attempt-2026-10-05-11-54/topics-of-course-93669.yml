analysis:
  mode: all-courses
source_clusters:
- id: 21
  name: Artificial Intelligence Fundamentals (21)
course:
  id: '93669'
  name: Intelligent Systems Engineering
topics:
  agent_based_simulation: Agent-based simulation for analyzing systems through interacting
    agents.
  ai_planning: Planning problems as a problem-solving approach in artificial intelligence.
  artificial_intelligence: Introduction to the main principles, methods, history,
    application fields, and problem-solving approaches of artificial intelligence.
  automated_reasoning: Automated reasoning and reasoning agents as techniques for
    intelligent systems.
  autonomous_systems: Concepts, definitions, and interactions involving autonomous
    systems in intelligent-systems engineering.
  conversational_informatics: Conversational interaction with intelligent and autonomous
    systems, including ChatGPT-related interaction and conversational informatics.
  explainable_ai: An introduction to explainable artificial intelligence and methods
    for making intelligent-system behavior understandable.
  intelligent_agents: Agents as systems that exhibit intelligent behavior, including
    the notion of an agent and the construction of systems that simulate human-expert
    behavior in specific disciplines.
  intelligent_system_perception_actuation: Perception and actuation technologies as
    components of intelligent systems.
  knowledge_representation: Knowledge representation for artificial-intelligence systems,
    including first-order predicate logic, production rules, knowledge-based systems,
    and introductory formal ontologies.
  large_language_models: Generative large language models and their use in language-processing
    applications.
  multi_agent_programming: Programming multi-agent systems using agent-oriented technologies,
    including JADE and Jason for intentional agents.
  multi_agent_systems: Conceptual and technical foundations of multi-agent systems
    for modeling and engineering complex computational and socio-technical systems.
  natural_language_processing: Natural language processing as an artificial-intelligence
    topic and application area.
  self_organizing_systems: Self-organising systems, including nature-inspired coordination
    and self-organisation in multi-agent systems.
  systematic_literature_review: Systematic literature review as a methodology for
    scientific surveys of intelligent and autonomous systems.
