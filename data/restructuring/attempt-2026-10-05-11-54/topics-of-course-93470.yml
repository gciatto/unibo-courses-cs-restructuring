analysis:
  mode: all-courses
source_clusters:
- id: 0
  name: Security Information Cryptography (0)
course:
  id: '93470'
  name: Cybersecurity
topics:
  access_control_models: Access-control models and their implementation for protecting
    systems and information.
  anti_forensics: Anti-computer-forensics techniques intended to obstruct or undermine
    the acquisition, analysis, or interpretation of digital evidence.
  application_security: Security considerations for applications, including Web and
    mobile application security.
  authentication_models: Authentication systems and principles for designing secure
    authentication protocols.
  cryptographic_key_management: Symmetric and asymmetric cryptographic key-management
    models and systems, including key distribution centers, PKI, and PGP.
  cryptography: Cryptography, including its mathematical foundations, secret-key and
    public-key algorithms, and applications to protection and security in operating
    systems and distributed systems.
  denial_of_service_attacks: Denial-of-Service (DoS) and Distributed Denial-of-Service
    (DDoS) attacks.
  device_hardening: Hardening computing devices exposed to the Internet by reducing
    vulnerabilities and improving resistance to attacks.
  digital_forensics_investigations: The digital-forensics profession, investigative
    procedures, common investigation scenarios, and the role of the investigator's
    office and laboratory.
  digital_signatures: Digital signatures as a cryptographic mechanism for authentication
    and integrity.
  human_in_the_loop: Human-machine collaboration workflows in which feedback loops
    preserve human agency, oversight, and understanding of machine-learning model
    behavior.
  malicious_software: Malicious software as a computer-security threat.
  network_security: Security of communication networks, including privacy, integrity,
    secure network and transport layers, firewalls, and intrusion detection.
  risk_analysis: Risk analysis in information-system design and planning.
  security_auditing: Auditing activities for assessing the security of computing infrastructures
    and security controls.
  security_policies: Design and implementation of security policies as part of security
    management.
  security_threats_vulnerabilities_risk: Security threats, vulnerabilities, exploits,
    risks, attack methods, and their impacts on information and systems.
  social_engineering: Social-engineering threats and the role of human factors in
    cybersecurity.
