analysis:
  mode: all-courses
source_clusters:
- id: 1
  name: Informatics Principles Foundations (1)
course:
  id: '89988'
  name: Elements of Informatics
topics:
  basic_data_types: Basic Python data types and their use in solving problems.
  data_structures: Elementary data structures including vectors, records, lists, queues,
    stacks, trees, and graphs.
  debugging: Debugging as a programming practice for identifying and correcting errors
    in programs.
  file_handling: Input/output and file-handling functions.
  functions: Functions in Python and their use in programming problem solutions.
  functions_recursion: Functions, parameter passing, and recursive functions.
  imperative_constructs: Imperative programming concepts, including algorithms and
    programs, data types, assignment, input/output, conditional statements, and iteration.
  language_implementation: Abstract machines, interpreters, compilers, and implementation
    of programming-language constructs.
  object_oriented_programming: Fundamental concepts and features of object-oriented
    programming.
  programming_basics: Basic principles of programming.
  programming_in_python: Programming in Python, including names, visibility, functions,
    objects, classes, and problem-solving applications.
  scripting_languages: Scripting languages and their use for writing small-scale programs,
    including Python.
  statistical_data_analysis: Statistical analysis of datasets, including descriptive
    analysis and statistical tests used to understand data and assess models.
