analysis:
  mode: all-courses
source_clusters:
- id: 6
  name: Learning Machine Deep (6)
course:
  id: '88202'
  name: Machine Learning
topics:
  artificial_intelligence: Introduction to the main principles, methods, history,
    application fields, and problem-solving approaches of artificial intelligence.
  classification_algorithms: Classification models and algorithms, including Bayes
    classifiers, k-nearest neighbor, support vector machines, multiclass classification,
    decision trees, and Bayesian networks where specified.
  clustering: Clustering methods for unsupervised learning, including K-means and
    expectation-maximization (EM).
  convolutional_neural_networks: Convolutional neural networks (CNNs) as a deep-learning
    architecture.
  dimensionality_reduction: Dimensionality-reduction methods for machine-learning
    data, including principal component analysis (PCA) and DA as specified.
  language_models: Language models, transformer architectures, and efficient attention
    mechanisms for text and language processing.
  large_language_models: Generative large language models and their use in language-processing
    applications.
  machine_learning: Fundamental machine-learning technologies and algorithms for developing
    intelligent applications.
  neural_networks_deep_learning: Neural networks and deep-learning techniques, including
    their use in machine-learning applications.
  recurrent_neural_networks: Recurrent neural networks (RNNs) as a neural-network
    architecture for machine learning.
  regression_analysis: Regression models and algorithms for predicting continuous
    outcomes.
  reinforcement_learning: Reinforcement learning as a machine-learning approach.
  supervised_unsupervised_learning: Supervised and unsupervised machine-learning approaches.
