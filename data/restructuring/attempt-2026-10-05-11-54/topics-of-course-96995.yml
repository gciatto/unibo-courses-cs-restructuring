  name: Network Networks Programming (15)
course:
  id: '96995'
  name: Programmable Networking
topics:
  cloud_computing: Cloud computing for Big Data, including comparisons between on-premises
    and cloud clusters, cloud technology stacks, and deployment of case studies on
    cloud providers.
  distributed_network_virtualization: Network virtualization technologies used in
    distributed and telecommunications systems.
  docker_containerization: Use of Docker and container-based environments in software
    development and deployment.
  p4_data_plane_programming: Programming network data planes and switch behavior using
    the P4 language.
  software_defined_networking: Software-Defined Networking (SDN) technologies and
    their use in telecommunications systems.
