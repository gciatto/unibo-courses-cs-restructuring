analysis:
  mode: all-courses
source_clusters:
- id: 29
  name: Informatics Informatic Humanities (29)
course:
  id: '96007'
  name: Foundations of Computer Architecture and Operating Systems
topics:
  binary_arithmetic: Numbering systems and the four arithmetic operations in the binary
    basis.
  binary_encoding: Binary encoding of information.
  boolean_algebra: Elements of Boolean algebra and logical functions.
  computer_hardware_architecture: Hardware architecture of computers.
  computer_operation: Principles governing the operation of computers.
  computing_history: Historical development of computer science and computing systems
    from prehistory through the early 1980s, including stored-program electronic computers,
    calculators, mainframes, minicomputers, microprocessors, and personal computers.
  concurrent_computing: The concurrent programming paradigm.
  cpu_scheduling: CPU scheduling in operating systems.
  digital_logic_networks: Analysis and synthesis of combinational, asynchronous sequential,
    and synchronous sequential logic networks.
  file_systems: File systems as an operating-system component.
  io_management: Operating-system management of input and output operations.
  machine_languages: General principles of machine languages.
  memory_allocation: Memory allocation and direct memory management.
  memory_devices: Memory devices as components of computer architecture.
  operating_systems: Operating-system structure and main functions.
