source_clusters:
- id: 23
  name: Computer Science Statistics (23)
course:
  id: '88016'
  name: Statistics
topics:
  data_visualization: Visualization and graphical representation of datasets and their
    properties, including frequency tables and statistical graphics.
  probability_distributions: Probability concepts and probability distributions used
    in stochastic programming and analysis of experimental data.
  spreadsheet_data_processing: Organizing, cleaning, and processing data in spreadsheets,
    including the use of Excel for data-processing tasks.
  statistical_data_analysis: Statistical analysis of datasets, including descriptive
    analysis and statistical tests used to understand data and assess models.
  statistical_inference: Inferential statistical methods, including confidence intervals,
    precision and bias, and the practical application of statistical tests.
  study_designs: Overview of experimental and observational study designs.
