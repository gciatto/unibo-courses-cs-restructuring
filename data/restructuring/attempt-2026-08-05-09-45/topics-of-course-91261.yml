cluster:
  id: 25
  name: Administration Systems System (25)
course:
  id: '91261'
  name: Artificial Intelligence in Industry
topics:
  anomaly_detection: Detection of anomalous behavior in industrial systems and data.
  artificial_intelligence_machine_learning: Artificial intelligence and machine learning.
  combinatorial_optimization: Combinatorial optimization methods for industrial planning
    and decision problems.
  constraint_machine_learning_integration: Integration methods that combine constraints
    with machine-learning models.
  epidemic_control: Epidemic control as an application of industrial artificial-intelligence
    problem-solving methods.
  fairness_constraints: Fairness constraints in recommendation systems.
  industrial_ai_applications: Industrial applications of artificial intelligence and
    machine learning, taught through practical use cases from domains such as manufacturing,
    automotive, and multimedia.
  maintenance_policy_optimization: Maintenance policies based on Remaining Useful
    Life estimates.
  mathematical_modeling: Mathematical modeling of industrial problems and operational
    decision-making situations.
  optimization_machine_learning_integration: Integration methods that combine combinatorial
    optimization with machine-learning models.
  power_network_management: Management and optimization problems involving power networks.
  probabilistic_models: Probabilistic models and their integration with machine-learning
    methods for industrial use cases.
  production_planning: Production planning as an industrial optimization and decision-making
    problem.
  recommendation_systems: Recommendation systems considered in industrial use cases,
    including systems subject to fairness constraints.
  remaining_useful_life_estimation: Estimation of Remaining Useful Life (RUL) for
    industrial assets or systems.
  resource_management_planning: Planning the allocation and use of resources in industrial
    problems.
  simulation: Simulation methods used to analyze or solve industrial problems.
  time_series_models: Predictive and diagnostic models for time-series data, including
    their use in industrial applications.
