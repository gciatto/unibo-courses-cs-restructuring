cluster:
  id: 25
  name: Administration Systems System (25)
course:
  id: '96642'
  name: Virtualization and System Integration
topics:
  block_storage: Block storage as a storage technology considered alongside distributed
    filesystems.
  centralized_configuration: Centralized configuration of distributed services and
    systems.
  cloud_computing: Introduction to cloud computing in the context of distributed and
    service-oriented programming.
  component_based_architecture: Component-based evolution, integration, and deployment
    of components within distributed enterprise architectures, including three-tier
    and Web-integrated architectures.
  container_networking: Virtual networking between containers, including Docker container
    network configuration.
  container_orchestration: Orchestration of virtual machines, services, and containers
    using Docker Swarm and Kubernetes, including single-node platforms such as Minikube.
  containerization: Container-based virtualization, including Docker containers, images,
    Dockerfiles, and Docker Compose.
  deployment_automation: Centralized and automated deployment, maintenance, and management
    of distributed systems, services, and applications.
  distributed_filesystems: Distributed filesystems used in distributed and integrated
    computing environments.
  distributed_programming: Programming models and techniques for building distributed
    systems.
  distributed_system_monitoring: Runtime monitoring, control, and management of application
    servers and distributed support frameworks, including JMX, with attention to performance,
    scalability, fault tolerance, and reliability.
  identity_management: Identity management systems, platforms, and protocols including
    Active Directory, LDAP, Kerberos, and OpenLDAP.
  industrial_protocols: OPC network protocols for interaction between software systems
    and industrial controllers such as PLCs.
  ldap_authentication: Centralized authentication using LDAP.
  message_oriented_middleware: Distributed programming using message-oriented middleware,
    including RabbitMQ.
  microservices_architecture: Microservices architectures designed as language-independent,
    component-based systems for local and cloud contexts.
  network_management: Network administration, including interface and routing configuration
    and connection monitoring.
  network_security: Protection of local networks and server farms using filtering,
    NAT, firewalls, proxies, relays, and SOCKS-based proxying.
  on_premise_cloud_management: Management platforms for on-premise cloud systems.
  secure_communications: Secure communications for information systems and networks
    using protocols and utilities such as SSH, TLS/SSL, and DTLS.
  system_configuration: Configuration of GNU/Linux systems, including hardware setup
    and local system administration settings.
  system_integration: Integration of heterogeneous operating systems, services, APIs,
    and applications, including interactions between Windows and Linux systems.
  system_monitoring: Monitoring GNU/Linux systems and administering centralized monitoring
    platforms, including SNMP-based monitoring.
  virtualization: Virtualization as an enabling technology in computer systems and
    cloud environments.
