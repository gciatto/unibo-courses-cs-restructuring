cluster:
  id: 25
  name: Administration Systems System (25)
course:
  id: '88324'
  name: System Administration T
topics:
  configuration_as_code: Configuration as Code for automated creation and configuration
    of virtual systems using tools such as OpenTofu, Vagrant, and Ansible.
  file_systems: File systems in operating systems, including Unix filesystem administration.
  high_availability: Basic concepts and administration of high-availability distributed
    systems.
  ldap_authentication: Centralized authentication using LDAP.
  network_configuration: Automatic network configuration using RARP, BOOTP, DHCP,
    and DNS.
  network_management: Network administration, including interface and routing configuration
    and connection monitoring.
  operating_system_security: Operating-system authorization mechanisms, including
    authorization on Unix filesystems.
  process_management: Process configuration and administration in Unix and GNU/Linux
    systems.
  resource_management: Monitoring and managing resource usage in operating systems.
  shell_scripting: Bash shell programming and shell-based automation of system-administration
    activities.
  system_configuration: Configuration of GNU/Linux systems, including hardware setup
    and local system administration settings.
  system_monitoring: Monitoring GNU/Linux systems and administering centralized monitoring
    platforms, including SNMP-based monitoring.
  system_troubleshooting: Troubleshooting activities for networked computing systems.
  user_account_management: Management of user accounts in GNU/Linux systems.
  virtualization: Virtualization as an enabling technology in computer systems and
    cloud environments.
