cluster:
  id: 25
  name: Administration Systems System (25)
course:
  id: '78810'
  name: Real Time Systems for Automation M
topics:
  concurrency_synchronization: Synchronization mechanisms for concurrent programs,
    including semaphores and monitors.
  deadlock_handling: Deadlock conditions and handling in operating-system processes
    and concurrent applications.
  io_management: Operating-system I/O subsystem architecture, device drivers, and
    device-management methods including programmed I/O, interrupt-based I/O, and DMA.
  multi_threaded_programming: Programming with multiple threads, including Java mechanisms
    and libraries.
  object_oriented_programming: The object-oriented paradigm, including classes, objects,
    initialization, inheritance, and late binding.
  operating_system_structure: The structure and organization of modern multitasking
    operating systems.
  os_memory_management: Central memory management in operating systems.
  process_management: Process configuration and administration in Unix and GNU/Linux
    systems.
  process_scheduling: Scheduling in operating systems.
  python_programming: The Python programming language.
  real_time_scheduling: Scheduling aperiodic tasks and clock-based or priority-based
    periodic tasks in real-time systems.
  real_time_system_programming: Programming hard real-time periodic-task systems that
    share resources, including development with vxWorks and Workbench.
  real_time_systems: Fundamental concepts and characteristics of real-time systems
    for automation.
  resource_access_protocols: Protocols for controlling access to shared resources
    in real-time systems.
  shell_scripting: Bash shell programming and shell-based automation of system-administration
    activities.
  system_calls: System calls for interacting with operating-system services.
