cluster:
  id: 25
  name: Administration Systems System (25)
course:
  id: '73435'
  name: Project Management
topics:
  ict_project_management: ICT project management.
  project_lifecycle: Project life-cycle management across traditional, incremental,
    iterative, and adaptive approaches.
  project_management_approaches: Traditional, iterative, incremental, adaptive, and
    agile approaches to managing software development projects.
  project_management_knowledge_areas: Project Management Body of Knowledge (PMBOK)
    knowledge areas, including integration, scope, time, cost, quality, human resources,
    communications, risk, procurement, and stakeholder management.
  project_management_process_groups: Project management process groups, including
    scoping, planning, launching or executing, monitoring and controlling, and closing.
  project_program_portfolio: Project, program, and portfolio concepts in project management.
  project_scope_management: Defining and managing project scope, including its relationship
    with quality and resources.
