cluster:
  id: 25
  name: Administration Systems System (25)
course:
  id: '28652'
  name: IT Systems T-1
topics:
  data_flow_diagrams: Data-Flow Diagrams for modeling information-system data and
    operations.
  database_concurrency: Control of concurrent access to relational databases.
  database_indexes: Physical database organization using indexes, including B+ trees.
  database_normalization: Normal forms and normalization in relational database design.
  database_parallelism: Parallel architectures and parallelism in relational database
    systems.
  database_recovery: Recovery of database information after malfunctions.
  database_replication: Replication architectures for relational database systems.
  database_transactions: Database transaction concepts and distributed transactions.
  distributed_databases: Distributed databases, including fragmentation and distributed
    database organization.
  enterprise_resource_planning: Design and use of Enterprise Resource Planning (ERP)
    systems.
  entity_relationship_model: The Entity-Relationship model for conceptual data design.
  information_systems_design: Methods for designing information systems, including
    analysis of resources and processes and architectural analysis.
  query_optimization: Database query processing and optimization, including join methods.
  relational_algebra: Relational theory and relational algebra for representing and
    manipulating data.
  relational_databases: Relational database concepts, structures, and database management
    systems.
  relational_logical_design: Logical design of relational database schemata.
  requirements_engineering: Analysis and specification of software requirements.
  sql: SQL for data definition, manipulation, simple and complex queries, grouping,
    nesting, views, and database applications.
  workflow_modeling: Workflow schemata for modeling information-system processes and
    operations.
