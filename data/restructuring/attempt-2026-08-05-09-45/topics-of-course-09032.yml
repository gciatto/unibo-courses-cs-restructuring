cluster:
  id: 25
  name: Administration Systems System (25)
course:
  id: 09032
  name: Software Engineering
topics:
  object_oriented_analysis_design: Object-oriented analysis and design, including
    abstraction, information hiding, inheritance, polymorphism, delegation, and the
    design of object-oriented systems.
  object_oriented_programming: The object-oriented paradigm, including classes, objects,
    initialization, inheritance, and late binding.
  requirements_engineering: Analysis and specification of software requirements.
  software_certification: Software certification.
  software_design: Design of software systems, including planning and design activities
    in the software lifecycle.
  software_lifecycle: Phases and activities in the lifecycle of software systems,
    including planning, requirements analysis, and design.
  software_maintenance: Maintenance of software systems.
  software_production: Production activities in software engineering.
  software_prototyping: Prototyping of Web, mobile, and service concepts, including
    preparation of prototype specifications.
  software_quality: Automated quality assurance activities for software development.
  software_testing: Testing software through automated and multi-platform or multi-target
    testing activities.
  uml_modeling: The Unified Modeling Language (UML), including use case, class, object,
    sequence, collaboration, state, activity, component, and deployment diagrams.
  user_interface_design: Basic user interface design.
