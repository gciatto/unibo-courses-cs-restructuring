cluster:
  id: 25
  name: Administration Systems System (25)
course:
  id: '81917'
  name: Interaction Multimedia Services
topics:
  algorithms: Algorithms, including the design and analysis of simple algorithms.
  artificial_intelligence_machine_learning: Artificial intelligence and machine learning.
  cloud_computing: Introduction to cloud computing in the context of distributed and
    service-oriented programming.
  cybersecurity: Cybersecurity fundamentals, including threat actors, social engineering,
    password management, and data backup.
  design_thinking: Design Thinking, including empathize, define, ideate, prototype,
    and test activities.
  event_driven_programming: Event-driven programming, as covered through the event-driven
    component of JavaScript programming.
  html_programming: HTML programming for creating Web content and sites.
  intellectual_property: Intellectual property in the context of computer science
    and technology.
  javascript_programming: JavaScript programming, including variables, instructions,
    and functions.
  privacy_law: Privacy law, privacy, and online rights.
  programming_languages: Programming languages as a computer-science topic and practical
    programming medium.
  quantitative_research: Quantitative research methods, including survey design and
    statistical data analysis.
  service_design: Service design for developing and visualizing service concepts,
    including user journey maps, ecosystem maps, and service blueprints.
  software_prototyping: Prototyping of Web, mobile, and service concepts, including
    preparation of prototype specifications.
  usability_testing: Usability testing, including test principles, frameworks, test
    design, feedback collection, and iteration of a service concept.
  user_centered_design: User-centered design, including the relationship between Human-Computer
    Interaction and User Experience.
  user_research: User research methodologies, including semi-structured interviews,
    contextual inquiry, user observation, research planning, personas, empathy maps,
    and experience maps.
  virtualization: Virtualization as an enabling technology in computer systems and
    cloud environments.
  web_mobile_application_security: Security of Web and mobile applications.
  web_systems: Web systems, including Web basics, Web technologies, execution models,
    protocols, and Web environments.
