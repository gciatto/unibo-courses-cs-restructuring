cluster:
  id: 25
  name: Administration Systems System (25)
course:
  id: '73025'
  name: Distributed Systems M
topics:
  application_servers: Application servers, including JBoss/WildFly, and their runtime
    support for enterprise-level distributed applications.
  aspect_oriented_programming: Aspect-oriented programming as applied to enterprise
    application frameworks, including Spring AOP.
  component_based_architecture: Component-based evolution, integration, and deployment
    of components within distributed enterprise architectures, including three-tier
    and Web-integrated architectures.
  dependency_injection: Inversion of control and dependency injection in enterprise
    application frameworks, including Spring.
  distributed_clustering: Clustering mechanisms and configurations for distributed
    enterprise applications, including clustering support in JBoss/WildFly and high-end
    clusters.
  distributed_programming: Programming models and techniques for building distributed
    systems.
  distributed_system_monitoring: Runtime monitoring, control, and management of application
    servers and distributed support frameworks, including JMX, with attention to performance,
    scalability, fault tolerance, and reliability.
  enterprise_application_frameworks: Frameworks and lightweight containers for enterprise
    applications, including Spring and its use alongside application-server technologies.
  enterprise_java_beans: Enterprise JavaBeans, including the evolution from EJB 1.0
    to EJB 3.0 and the use of session-oriented and message-oriented components.
  enterprise_transaction_management: Transaction management in enterprise applications
    and supporting frameworks, including Spring transaction management.
  event_loop_programming: Asynchronous programming based on events and event-loop
    architectures, including continuations, promises, and async/await.
  message_oriented_middleware: Distributed programming using message-oriented middleware,
    including RabbitMQ.
  naming_services: Naming services and directory-service integration in enterprise
    deployment environments, including JNDI.
  persistence_frameworks: Persistence support in enterprise applications, including
    JPA and Hibernate, transparent persistence, object-relational mapping, query support,
    metadata, and performance considerations.
  requirements_engineering: Analysis and specification of software requirements.
  serverless_computing: Function as a Service and supporting frameworks as an asynchronous,
    highly scalable application model.
  software_design: Design of software systems, including planning and design activities
    in the software lifecycle.
  stream_processing: Introductory online stream processing of big data over clustered
    distributed systems.
