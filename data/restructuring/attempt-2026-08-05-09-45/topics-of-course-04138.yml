cluster:
  id: 25
  name: Administration Systems System (25)
course:
  id: 04138
  name: Programming Languages
topics:
  concurrent_programming: The concurrent programming paradigm.
  context_free_languages: Context-free grammars, push-down automata, their equivalences,
    and principal theorems including the pumping theorem.
  control_flow: Sequence control, procedures, and recursion.
  exceptions: Exceptions in programming languages.
  formal_syntax: BNF, regular grammars, and context-free grammars for specifying programming-language
    syntax.
  functional_programming: The functional programming paradigm, including Scala.
  language_description: The syntax, semantics, pragmatics, and implementation as aspects
    of describing a programming language.
  language_implementation: Abstract machines, interpreters, compilers, and implementation
    of principal programming-language constructs.
  lexical_analysis: Design of lexical analysers, including the use of Lex.
  logical_programming: The logical programming paradigm.
  memory_management: Memory management and garbage collection.
  object_oriented_programming: The object-oriented paradigm, including classes, objects,
    initialization, inheritance, and late binding.
  operational_semantics: Structured Operational Semantics (SOS) for specifying programming-language
    semantics.
  parameter_passing: Parameter mechanisms including passing by value, reference, result,
    and name, as well as functional parameters and closures.
  parsing: Parsing algorithms for deterministic context-free grammars, including LL(1),
    LR(0), SLR, LR(1), LALR(1), and YACC.
  programming_language_evolution: The evolution of programming languages from assembly
    languages to higher-level languages.
  regular_languages: Regular grammars, regular expressions, finite automata, their
    equivalences, and principal theorems including the pumping lemma.
  runtime_environment: Environments, scoping rules and their implementation, activation-record
    stacks, and heaps.
  service_oriented_computing: Service-oriented computing, including Jolie.
  subtyping: The distinction between subtyping and inheritance.
  types_type_checking: Types and type checking in programming languages.
