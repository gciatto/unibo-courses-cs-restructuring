cluster:
  id: 25
  name: Administration Systems System (25)
course:
  id: B0011
  name: Software Process Engineering
topics:
  build_automation: Automated build processes for software projects, including Gradle-based
    build automation.
  container_orchestration: Orchestration of virtual machines, services, and containers
    using Docker Swarm and Kubernetes, including single-node platforms such as Minikube.
  containerization: Container-based virtualization, including Docker containers, images,
    Dockerfiles, and Docker Compose.
  continuous_delivery: Continuous delivery and automated software deployment.
  continuous_integration: Continuous integration of software changes, including GitHub
    Actions.
  debugging: Debugging and bug-hunting activities in software development.
  domain_driven_design: Domain-Driven Design for technology-independent, domain-first
    software analysis and development.
  domain_specific_languages: Domain-specific languages, including external DSLs and
    internal DSLs implemented within general-purpose programming languages, together
    with corresponding code generators.
  kotlin_programming: The Kotlin programming language, including introductory programming
    and development of language-internal domain-specific languages.
  model_driven_design: Model-Driven Design and development based on models and model
    transformations.
  multi_platform_programming: Multi-platform software development using Kotlin.
  performance_engineering: Performance engineering for software systems.
  software_licensing: Software licensing models, with emphasis on open-source software
    licensing.
  software_quality: Automated quality assurance activities for software development.
  software_testing: Testing software through automated and multi-platform or multi-target
    testing activities.
  software_versioning: Software versioning models and practices.
  version_control: Version control systems and advanced Git workflows, including submodules,
    rebasing, cherry-picking, squashing, stashing, and team collaboration.
