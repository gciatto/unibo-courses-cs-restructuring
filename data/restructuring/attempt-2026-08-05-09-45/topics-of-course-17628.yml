cluster:
  id: 25
  name: Administration Systems System (25)
course:
  id: '17628'
  name: Concurrent and Distributed Programming
topics:
  actor_model: Programming with the actor model, including actor-based concurrent
    and distributed programming.
  asynchronous_programming: Asynchronous programming using futures, promises, continuations,
    async/await, and related task- and event-based mechanisms.
  cloud_computing: Introduction to cloud computing in the context of distributed and
    service-oriented programming.
  concurrency_synchronization: Synchronization mechanisms for concurrent programs,
    including semaphores and monitors.
  concurrent_program_verification: Verification of concurrent programs by specifying
    and checking liveness and safety properties, including Linear Temporal Logic,
    model checking, and Java PathFinder.
  concurrent_programming: The concurrent programming paradigm.
  distributed_algorithms: Algorithms for distributed systems.
  distributed_programming: Programming models and techniques for building distributed
    systems.
  event_loop_programming: Asynchronous programming based on events and event-loop
    architectures, including continuations, promises, and async/await.
  message_oriented_middleware: Distributed programming using message-oriented middleware,
    including RabbitMQ.
  message_passing: Message-based communication using synchronous and asynchronous
    channels.
  multi_threaded_programming: Programming with multiple threads, including Java mechanisms
    and libraries.
  petri_nets: Petri Nets as a visual formalism for modeling concurrent systems.
  reactive_programming: Reactive programming and reactive extensions, including Rx-based
    programming.
  remote_procedure_call: Distributed programming using RPC-like models, including
    Java RMI.
  service_oriented_computing: Service-oriented computing, including Jolie.
  shared_memory_concurrency: Concurrent interaction through shared memory, including
    semaphores and monitors.
  statecharts: Statecharts as a visual formalism for modeling concurrent systems.
  task_oriented_concurrency: Asynchronous programming based on task-oriented approaches
    and futures.
