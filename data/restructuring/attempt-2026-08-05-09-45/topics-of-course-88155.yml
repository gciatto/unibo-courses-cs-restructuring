cluster:
  id: 25
  name: Administration Systems System (25)
course:
  id: '88155'
  name: Industrial Informatics P
topics:
  concurrency_synchronization: Synchronization mechanisms for concurrent programs,
    including semaphores and monitors.
  concurrent_programming: The concurrent programming paradigm.
  deadlock_handling: Deadlock conditions and handling in operating-system processes
    and concurrent applications.
  file_systems: File systems in operating systems, including Unix filesystem administration.
  io_management: Operating-system I/O subsystem architecture, device drivers, and
    device-management methods including programmed I/O, interrupt-based I/O, and DMA.
  operating_system_structure: The structure and organization of modern multitasking
    operating systems.
  os_memory_management: Central memory management in operating systems.
  process_management: Process configuration and administration in Unix and GNU/Linux
    systems.
  process_scheduling: Scheduling in operating systems.
  resource_management: Monitoring and managing resource usage in operating systems.
