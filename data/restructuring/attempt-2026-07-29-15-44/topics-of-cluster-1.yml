cluster:
  id: 1
  name: Informatics Principles Foundations (1)
topics:
  agile_software_development: Agile software development practices, including the
    role of Scrum.
  algorithm_notations: Pseudocode and flow diagrams as notations for representing
    algorithms.
  algorithmic_problem_solving: Algorithmic approaches to solving fundamental problems
    with computers, including analysis of problems and corresponding solution algorithms.
  array_algorithms: Algorithms on arrays, including reversal, ordering, and search.
  assembly_language: Assembly language as a programming level associated with computer
    architectures.
  binary_information_encoding: Binary encoding of information.
  boolean_algebra: Boolean algebra as a foundation for digital logic.
  c_control_flow: C control-flow constructs, including selection, iteration, and cycles.
  c_data_structures: Arrays, matrices, lists, trees, vectors, stacks, and queues,
    including their representation or algebraic specification and implementation.
  c_functions_recursion: Library and user-defined functions, parameter passing by
    value, and recursive functions in C.
  c_input_output: C input/output functions, file functions, string functions, and
    functions for direct memory management.
  c_programming_basics: The purposes and main characteristics of C, program structure,
    headers, variable declarations, libraries, and elementary data types including
    integers, floating-point types, characters, and strings.
  computability_and_turing_machines: Turing machines, computable and non-computable
    functions, and the relationship between problem solutions and computability.
  computational_complexity: Intuitive analysis of the computational complexity of
    algorithms.
  computer_history: Introduction to the history of computers.
  computer_networking: Computer networking concepts, including local and wide area
    networks, email, internet access, and web access.
  computer_operation_architecture: General principles of computer operation and hardware
    architecture.
  computer_performance: Measurement of computer performance and the impact of architecture
    on performance.
  continuous_integration_delivery: Continuous integration and continuous delivery
    in software development.
  cpp_programming: Fundamental C++ programming constructs, including variables, operators,
    flow control, functions, and arrays.
  cpu_organization_dlx: Internal CPU structure and implementation using a sequential
    organization, including DLX.
  data_analysis: Analysis and browsing of data catalogs in multiple formats, sample
    selection, correlation analysis, and use of graphical and scientific/numerical
    Python modules.
  data_security: Data security in the context of computer and network use.
  data_structure_algorithms: Construction, search, and sorting algorithms for linear
    lists, and management algorithms for queues and stacks.
  database_integrity_constraints: Integrity constraints in relational databases, including
    keys, superkeys, referential integrity, primary keys, unique constraints, and
    foreign keys.
  derivative_approximation: Approximation of derivatives using elementary numerical
    methods.
  design_patterns: Design patterns, including advanced design and architectural patterns
    used across programming paradigms.
  digital_logic_networks: Analysis and synthesis of combinational logic networks and
    asynchronous and synchronous sequential logic networks.
  dynamic_memory_management: Dynamic memory allocation for scalar types, structures,
    and arrays in C, including memory management and memory leaks.
  finite_state_machines: Finite state machine models for representing sequential systems.
  function_approximation: Approximation of functions using elementary numerical methods.
  functional_programming: Functional programming techniques, including functions and
    functional approaches to programming.
  fundamental_data_structures: Fundamental data structures introduced in the context
    of algorithm design and programming, including arrays.
  hardware_software_interaction: Interaction between computer hardware and software,
    including laboratory-based experiments.
  instruction_set_architecture: Instruction Set Architecture (ISA) and its role in
    computer systems.
  integral_approximation: Approximation of integrals using elementary numerical methods.
  interrupts: Interrupts in computer-system operation and hardware/software interaction.
  iteration_and_recursion: Iteration and recursion as programming constructs or methods.
  java_programming: Fundamental constructs and features of the Java programming language.
  lambda_calculus: Lambda calculus as a formal foundation for functional programming.
  logic_design_principles: Principles of logic design as applied to digital computer
    systems.
  logic_programming: Logic programming using Prolog and integration between Java and
    Prolog.
  machine_language: Machine language as a level of computer-system operation associated
    with the CPU.
  machine_language_architectures: General considerations on machine languages and
    comparison of RISC and CISC architectures.
  matlab_octave_programming: MATLAB/Octave fundamental constructs, data structures,
    vector and matrix operations, vector programming, input and output, functions,
    variable visibility, and graphic functions.
  memory_devices: Memory devices as components of computer systems.
  memory_io_addressing: Addressing of memory and input/output devices.
  memory_pointers: Computer memory organization using addresses and words, pointers,
    pointer arithmetic, and passing function parameters by address.
  microprocessor_system_design: Design of microprocessor-based systems.
  nonnumeric_information_representation: Representation of non-numeric information
    in computer systems.
  numeric_information_representation: Representation of numeric information, including
    two's-complement and floating-point representations.
  numerical_analysis: Elements of numerical analysis as covered through elementary
    approximation methods.
  object_oriented_programming: Object-oriented programming, including the object-oriented
    paradigm and inheritance.
  operating_systems: Operating systems as part of computer software.
  parallel_architectures: Parallel computer architectures.
  program_execution_model: The model of program execution in a computer.
  programming_language_concepts: Programming language concepts, including language
    history, syntax, and semantics.
  programming_language_levels: Distinction between high-level and low-level programming
    languages.
  programming_tools: Programming tools, including editors, debuggers, compilers, and
    interpreters.
  project_documentation: Documentation practices for software projects.
  python_programming: Programming in Python, including the interpreter, variables,
    expressions, statements, data types, functions, conditionals, recursion, iteration,
    tables, CSV export, spreadsheets, modules, and basic object-oriented programming
    notation.
  quantum_algorithms: Quantum algorithms, including Simon's, Grover's, and Shor's
    algorithms.
  quantum_circuits: Quantum computational models based on quantum circuits, including
    sample circuits such as Deutsch and Bernstein-Vazirani.
  quantum_computational_complexity: Computational complexity in quantum computing.
  quantum_computing: Overview of quantum computing as an alternative computing paradigm.
  quantum_cryptography: Quantum cryptography concepts and applications.
  quantum_error_correction: Quantum error-correction methods and concepts.
  quantum_graphical_languages: Graphical languages for representing quantum circuits.
  quantum_linear_algebra: Linear algebra and complex Hilbert spaces as mathematical
    foundations for quantum computing.
  quantum_programming: Overview of quantum programming.
  quantum_protocols: Quantum protocols.
  qubits: Qubits and their mathematical representation.
  r_programming: Programming in R, including data types, structured-programming constructs,
    functions, random-value generation, and implementation and testing of programs.
  random_number_generation: Generation and use of random values in R programs.
  refactoring: Refactoring techniques for improving the structure and maintainability
    of software.
  relational_model: The relational model of data, including attributes, tuples, relations,
    database schemas, and relational algebra.
  runtime_activation_records: Runtime representation of C programs, including activation
    records associated with function execution.
  scala_programming: The Scala programming language, including its object-oriented
    and functional layers and advanced typing.
  software_development_phases: Phases involved in the development of a program.
  software_engineering_methodologies: Software development methodologies, including
    waterfall and agile approaches, for developing complex software systems.
  software_quality: Software quality practices including clean code, effective programming,
    and quality-oriented development approaches.
  software_testing: Software testing practices including unit testing, test-driven
    development, and agile testing approaches.
  sql_querying: SQL language features for querying and managing relational data, including
    predicates, joins, subqueries, aggregation, set operations, table creation, data
    modification, privileges, and views.
  statistical_data_modeling: Statistical methods for modelling data and applying computational
    analysis to astronomical problems.
  structured_programming: Structured programming as an approach to organizing imperative
    programs.
  von_neumann_architecture: The Von Neumann architecture.
  zero_approximation: Approximation of zeros using elementary numerical methods.
