cluster:
  id: 1
  name: Informatics Principles Foundations (1)
topics:
  abstract_data_types: Algebraic specification and implementation of data types and
    structures such as vectors, lists, stacks, and queues.
  algorithm_notations: Pseudo-code and flow diagrams as notations for representing
    algorithms.
  algorithmic_problem_solving: Computational problem-solving and algorithm-design
    methods for developing solutions to small-scale problems, including mapping simple
    physical problems into computational solutions.
  arrays_and_matrices: Arrays and matrices in C, including their organization and
    representation in memory.
  assembly_language_programming: Assembly language at the instruction-set-architecture
    level and concepts needed for assembly programming.
  binary_information_encoding: Binary encoding and representation of numeric information,
    including two's-complement integers and floating-point values, and of non-numeric
    information in digital computing systems.
  boolean_logic_and_gates: Boolean algebra, Boolean expressions and functions, logic
    gates, and circuit diagrams.
  c_data_types: Elementary C data types, including integer variants, floating-point
    types, double, char, and string representations.
  c_language_fundamentals: Purposes and main characteristics of C, including program
    structure, headers, variable declarations, and use of libraries.
  c_operators_and_expressions: Operators, values, and expressions in C.
  c_structures: Definition and use of structure types in C.
  combinational_logic_networks: Analysis and synthesis of combinational logic networks.
  computability_and_turing_machines: Computability and non-computability of functions
    and problems, including specific and universal Turing machines.
  computational_astronomy: Application of computational, scientific, numerical, and
    statistical tools to astronomical problems.
  computational_complexity: Introductory, intuitive notions of computational complexity
    used when analyzing simple algorithms.
  computer_fundamentals: Introductory concepts concerning computers and their use.
  computer_history: Historical development of computers.
  computer_organization: General principles of computer operation, Von Neumann organization,
    computer hardware architecture, memory devices, and the relationship between hardware
    and software.
  computer_performance: Measurement of computer performance and the impact of architectural
    choices on performance.
  computing_system_abstraction: Use of abstraction and hierarchical representation
    to manage the design complexity of computing systems.
  continuous_integration_and_delivery: Continuous integration and continuous delivery
    practices in software development.
  control_flow_and_iteration: Control-flow constructs and iterative cycles in C.
  cplusplus_arrays: Use of arrays in C++.
  cplusplus_classes_and_polymorphism: C++ classes and polymorphism-related mechanisms,
    including function overloading, inheritance, and templates.
  cplusplus_control_flow: Flow-control constructs in C++.
  cplusplus_functions: Definition and use of functions in C++.
  cplusplus_language_fundamentals: Fundamental C++ lexical, syntactic, and semantic
    elements, including variables and operators.
  cpu_structure_and_dlx: Internal CPU structure and processor implementation using
    the sequentially organized DLX architecture.
  csv_and_spreadsheet_output: Exporting data to CSV files and creating spreadsheets.
  data_catalogs_and_scientific_formats: Analysis and browsing of data catalogs represented
    in formats including ASCII and FITS.
  data_security: Introductory concepts of data security.
  data_selection_and_correlation: Selection of data samples and analysis of correlations.
  data_structure_fundamentals: Introductory concepts and examples of fundamental data
    structures.
  database_integrity_constraints: Database integrity constraints, including keys,
    superkeys, primary and unique keys, foreign keys, and referential integrity.
  declarative_and_imperative_knowledge: The distinction between declarative and imperative
    knowledge in computational problem solving.
  declarative_programming: Declarative programming techniques through functional and
    logic-programming approaches.
  design_patterns: The role and application of advanced design and architectural patterns
    across programming paradigms.
  digital_logic_fundamentals: The digital-logic level of computer systems.
  dynamic_memory_management: Dynamic allocation and management of memory in C for
    scalar values, structures, and arrays, including memory-leak issues.
  ebnf_grammars: Definition of programming-language syntax using EBNF grammars.
  finite_state_machines: Finite-state-machine models for representing sequential system
    behavior.
  functional_programming: Functions and the functional programming paradigm.
  functions_and_parameter_passing: Library and user-defined functions, including parameter
    passing by value and by address.
  high_level_and_scripting_languages: High-level and scripting languages as tools
    for computer programming.
  ict_concepts: General concepts and terminology of information and communication
    technologies.
  imperative_structured_programming: Imperative and structured approaches to organizing
    computer programs.
  informatics_overview: An introductory overview of informatics as a field.
  information_coding: Coding and representation of information in computer systems,
    without specification of particular encoding formats.
  input_output_and_files: C input/output operations and file-handling functions.
  instruction_set_architecture: Instruction Set Architecture as the interface involved
    in processor and computer operation.
  internet_services: Use of e-mail and access to Internet and web services.
  interrupts: Interrupts as part of computer-system organization and hardware/software
    interaction.
  iterative_programming: Use of iteration in programming.
  java_algorithms_and_data_structures: Implementation of algorithms and basic through
    advanced data structures in Java.
  java_inheritance: Inheritance in Java object-oriented programming.
  java_language_fundamentals: Fundamental constructs and use of the Java programming
    language.
  java_prolog_integration: Integration between Java and Prolog programs.
  lambda_calculus: Lambda calculus in the context of functional programming.
  linear_list_algorithms: Reversal, searching, ordering, sorting, and related algorithms
    on linear collections such as arrays and lists.
  linked_lists: Representation, construction, and use of linear and linked-list data
    structures.
  logic_programming: Techniques and concepts of the logic-programming paradigm.
  machine_language: Machine language in relation to the central processing unit and
    computer-system organization.
  machine_languages_and_processor_styles: General characteristics of machine languages
    and comparison of register-register RISC and memory-register CISC architectural
    styles.
  matlab_octave_functions_and_scope: Functions and variable visibility in MATLAB/Octave.
  matlab_octave_fundamentals: Fundamental MATLAB/Octave language constructs and data
    structures.
  matlab_octave_graphics: Use of graphic functions in MATLAB/Octave.
  matlab_octave_input_output: Input and output operations in MATLAB/Octave.
  matlab_octave_vector_matrix_programming: Operations on vectors and matrices and
    elements of vector programming in MATLAB/Octave.
  memory_addresses_and_pointers: Computer-memory organization, addresses, words, pointers,
    pointer arithmetic, and passing addresses to functions.
  microprocessor_system_design: Design of simple microprocessor-based systems.
  multiparadigm_programming: Advanced programming techniques in modern languages that
    combine object-oriented and functional paradigms.
  network_protocols_and_dns: Internet communication protocols and the Domain Name
    System.
  networking_fundamentals: Introductory concepts concerning computer networking.
  numerical_approximation_methods: Elementary numerical methods for approximating
    functions, derivatives, zeros, and integrals.
  numerical_computation_algorithms: Design and analysis of well-known algorithms for
    numerical computation.
  object_oriented_programming: Introduction to object-oriented programming and the
    object-oriented paradigm, including development of small programs.
  operating_systems: The operating system as a component of computer software.
  parallel_architectures: Architectures based on parallel organization and operation.
  program_development_process: The phases involved in developing a computer program.
  program_execution_and_addressing: The program execution model and addressing of
    memory and input/output devices.
  programming_environments: Programming environments used to implement programs.
  programming_languages_overview: Concepts, history, syntax, and semantics of programming
    languages.
  programming_tools: Programming tools, including editors, debuggers, compilers, and
    interpreters.
  project_documentation: Documentation of software projects.
  prolog_programming: Logic programming using Prolog.
  python_control_flow: Conditional execution and iteration in Python programs.
  python_data_types_and_tables: Python built-in data types and the use of tables.
  python_functions: Definition and use of functions in Python programs.
  python_language_fundamentals: Programming with the Python interpreter, including
    variables, expressions, statements, and small-scale programs.
  python_scientific_and_graphical_modules: Use of Python modules focused on graphical
    and scientific or numerical computing.
  quantum_algorithms: Quantum algorithms and example circuits, including the Deutsch,
    Bernstein–Vazirani, Simon, Grover, and Shor algorithms.
  quantum_circuits: Quantum circuits as a computational model and as families used
    to implement quantum algorithms.
  quantum_computational_complexity: Computational complexity in the context of quantum
    computation.
  quantum_computing_foundations: Mathematical foundations of quantum computing as
    an alternative computational paradigm, including linear algebra and complex Hilbert
    spaces.
  quantum_error_correction: Principles and methods of quantum error correction.
  quantum_programming_languages: An overview of quantum programming and graphical
    languages for quantum circuits.
  quantum_protocols_and_cryptography: Quantum protocols and advanced applications
    involving quantum cryptography.
  qubits: Qubits and their mathematical representation.
  r_control_flow: Sequence, iteration, and choice constructs for structured programming
    in R.
  r_data_types: Data types in the R programming language.
  r_file_io: Reading data from and writing data to files in R.
  r_functions: Procedures and functions in structured R programs.
  r_graphics_and_packages: Creation of graphics and use of packages in R.
  r_language_fundamentals: Fundamental use of the R programming language, including
    translating algorithms into R programs.
  r_random_number_generation: Generation and use of random values in R.
  recursion: Definition and use of recursive functions.
  refactoring: Refactoring as a practice for improving existing software code and
    design.
  relational_algebra: Relational algebra for operating on data represented in the
    relational model.
  relational_data_model: The relational data model, including attributes, tuples,
    relations, database and relation schemas, and databases.
  runtime_activation_records: The activation-record model and run-time behavior of
    function and procedure invocation.
  scala_programming: Programming in Scala, including its object-oriented layer, functional
    layer, and advanced typing features.
  sequential_logic_networks: Analysis and synthesis of synchronous and asynchronous
    sequential logic networks.
  signed_number_representation: Representation of signed numbers, including Python's
    approach to signed numeric values.
  software_categories: Categories of software, including operating systems and application
    programs.
  software_development_methodologies: Software-development methodologies from waterfall
    processes to agile approaches, including the role of Scrum.
  software_quality: Software-quality practices, including clean-code rules and techniques
    for effective programming.
  software_testing: Agile testing approaches, unit testing, and test-driven development.
  sorting_algorithms: Design and analysis of sorting algorithms through programming
    exercises and examples.
  sql_access_control: Management of SQL access privileges using GRANT and REVOKE.
  sql_data_definition_and_manipulation: Definition and modification of relational
    data with SQL statements including CREATE TABLE, INSERT, UPDATE, and DELETE.
  sql_querying: SQL queries using expressions, predicates, SELECT-FROM-WHERE clauses,
    joins, subqueries, grouping, aggregate functions, quantified predicates, outer
    joins, and set operations.
  sql_views: Definition of database views using SQL CREATE VIEW statements.
  stacks_and_queues: Implementation and management of stack and queue data structures.
  statistical_data_modeling: Statistical methods for modeling data.
  strings: Strings in C and the use of string-processing functions.
  structured_modular_programming: Structured and modular methodologies for organizing
    programs.
  trees: Tree data structures in C.
  unix_command_line: Introductory use of Unix commands and the console.
