analysis:
  mode: all-courses
source_clusters:
- id: 1
  name: Informatics Principles Foundations (1)
course:
  id: B3567
  name: INTRODUCTION TO QUANTUM COMPUTING
topics:
  complex_hilbert_spaces: Complex Hilbert spaces as mathematical background for quantum
    computing.
  computational_complexity: Computational complexity and complexity classes, including
    P, NP, NP-complete problems, the P versus NP question, space complexity classes,
    oracle classes, class hierarchies, and functional classes.
  linear_algebra: Linear algebra concepts used in deep-learning models and computations.
  quantum_algorithms: Quantum algorithms including Simon's, Grover's, and Shor's algorithms.
  quantum_circuits: Quantum circuits as a computational model, including implementation
    of quantum algorithms and sample circuits such as Deutsch and Bernstein–Vazirani.
  quantum_computing: Quantum computing as an alternative computational paradigm, including
    its basic overview and mathematical foundations.
  quantum_cryptography: Quantum cryptography as an advanced topic in quantum computing.
  quantum_error_correction: Quantum error-correction techniques.
  quantum_graphical_languages: Development and use of graphical languages for quantum
    circuits.
  quantum_programming: An overview of quantum programming.
  quantum_protocols: Quantum protocols.
  qubits: Qubits and their mathematical representation.
