  mode: all-courses
source_clusters:
- id: 14
  name: Engineering Software Cultural (14)
course:
  id: B5293
  name: Computer Studies and Humanities
topics:
  artificial_intelligence: Introduction to the main principles, methods, history,
    application fields, and problem-solving approaches of artificial intelligence.
  computing_history: Historical development of computer science and computing systems
    from prehistory through the early 1980s, including stored-program electronic computers,
    calculators, mainframes, minicomputers, microprocessors, and personal computers.
  internet_world_wide_web: The Internet and the World Wide Web.
  knowledge_graphs: Knowledge Graph concepts, applications, programming, visualisation,
    and analytics for semantic management of knowledge.
  markup_languages: Markup and presentation languages for Web-oriented digital resources,
    including XHTML, XML, HTML5, and CSS.
  ontology_engineering: Knowledge representation and ontology development using OWL
    and related conceptualisation methods.
  semantic_web: Architecture, concepts, standards, languages, and technologies of
    the Semantic Web.
