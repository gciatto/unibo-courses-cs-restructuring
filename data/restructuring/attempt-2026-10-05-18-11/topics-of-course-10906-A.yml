analysis:
  mode: all-courses
source_clusters:
- id: 8
  name: Databases Database Systems (8)
course:
  id: 10906-A
  name: Databases
topics:
  database_application_access: Database applications and data-access modalities, including
    examples using Java and .NET C#.
  database_architectures: Database management system architectures, including three-tier
    and client-server architectures, with introductory coverage of distributed and
    cloud database systems.
  database_storage_indexing: Data structures and management algorithms for database
    secondary storage, including sequential and direct access organizations, primary
    and secondary indexes, and B-tree, B*-tree, and B+tree structures.
  database_transactions: Database transactions, including ACID properties, concurrency
    management, and transaction protocols.
  databases_sql: Databases and SQL queries.
  nosql_databases: Introductory coverage of NoSQL systems, architectures, and non-relational
    data models.
  rdbms_components: Main components of relational database management systems, including
    query optimization, transaction management, scheduling, recovery, caching, storage
    management, and access methods.
  relational_algebra: Relational algebra, including its basic and derived operators.
  relational_data_model: Structure of the relational data model, integrity constraints,
    and normal forms.
  relational_database_design: Relational database design using the Entity-Relationship
    model, conceptual and logical design, and normalization techniques.
  requirements_analysis: Analysis of software requirements as part of software-system
    planning and development.
