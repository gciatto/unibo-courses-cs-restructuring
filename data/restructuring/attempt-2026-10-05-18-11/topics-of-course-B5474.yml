analysis:
  mode: all-courses
source_clusters:
- id: 14
  name: Engineering Software Cultural (14)
course:
  id: B5474
  name: ARCHITETTURE SOFTWARE A MICROSERVIZI
topics:
  business_process_management: Business Process Management and BPMN for modeling and
    supporting the execution of business processes.
  container_orchestration: Orchestration of containerized software systems as part
    of software development and deployment.
  data_serialization: Data presentation, serialization, and deserialization tools
    and technologies for distributed systems.
  distributed_scalability: Scalability considerations in distributed systems.
  docker_containerization: Use of Docker and container-based environments in software
    development and deployment.
  fault_tolerance_reliability: Fault-tolerance and reliability concerns in distributed
    enterprise applications and their runtime support systems.
  grpc: gRPC as a technology for implementing service-based and web-service interactions.
  microservice_patterns: Patterns for designing and implementing microservice-based
    applications.
  microservices_architecture: Microservices as a distributed software-architecture
    style and as an architectural choice for subsystems.
  service_choreography: Choreographies for modeling interactions between business
    processes and services and among different services.
  service_meshes: Service-mesh technologies, including Linkerd, for supporting communication
    and management among microservices.
  service_oriented_computing: Service-oriented computing, including Jolie.
  soap_wsdl: SOAP and Web Services Description Language (WSDL) technologies for implementing
    web services.
  software_architecture: Design of a software system's architecture and definition
    of a logical architecture for the problem domain.
  uml_modeling: Modeling software systems with UML use case, class, object, sequence,
    collaboration, state, activity, component, and deployment diagrams.
  virtualization_cloud_services: Virtualization, containers, Docker, Kubernetes, and
    infrastructure-as-a-service and platform-as-a-service services.
  web_api_design: Design of Web application interfaces and APIs, including REST principles.
  web_services: Web services as back-end technologies for Web applications.
  workflow_modeling: Workflow schemata for representing the operations and processes
    of information systems.
