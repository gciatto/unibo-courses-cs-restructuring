analysis:
  mode: all-courses
source_clusters:
- id: 17
  name: Basic Skills Informatics (17)
course:
  id: '85445'
  name: Information Modelling and Web Technologies
topics:
  application_layer_protocols: Application-layer network protocols and architectures,
    including Web and HTTP, FTP, SMTP, POP3, IMAP, DNS, and peer-to-peer systems such
    as BitTorrent.
  character_encoding: Character encoding and digital formats for producing humanistic
    digital objects.
  data_structures: Elementary data structures including vectors, records, lists, queues,
    stacks, trees, and graphs.
  http_web_protocols: Web communication protocols and identifiers, including HTTP,
    URIs, WebSocket, HTTP/2, HTTP/3, and QUIC.
  information_representation: Representation of information in digital information-technology
    systems.
  javascript_programming: JavaScript as a dynamic functional language with a prototype-based
    object model.
  json_data_format: JSON as a data representation format used in basic Web technologies.
  markup_languages: Markup and presentation languages for Web-oriented digital resources,
    including XHTML, XML, HTML5, and CSS.
  web_client_side_programming: Client-side Web programming using JavaScript and Ajax,
    including single-page applications and React.js.
