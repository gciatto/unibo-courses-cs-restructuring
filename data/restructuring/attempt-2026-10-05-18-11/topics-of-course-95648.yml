analysis:
  mode: all-courses
source_clusters:
- id: 26
  name: Programming Software Design (26)
course:
  id: '95648'
  name: Software Design and Development
topics:
  agile_software_development: Agile software development practices and approaches.
  concurrent_computing: The concurrent programming paradigm.
  continuous_integration: Continuous Integration practices and tools for integrating
    and validating software changes.
  design_patterns: Design patterns used in software design.
  development_environment: Use of a development environment for programming.
  devops_practices: DevOps practices and tools supporting the development, deployment,
    and maintenance of software systems.
  exceptions: Exceptions as a programming-language construct.
  functional_programming: The functional programming paradigm, including functional
    parameters, closures, and Scala.
  graphical_user_interfaces: Graphical user interfaces in Java applications.
  java_language_features: Java language features including generics, annotations,
    inner classes, and lambda expressions.
  object_oriented_programming: Fundamental concepts and features of object-oriented
    programming.
  object_oriented_software_design: Analysis and design of software systems using abstraction,
    information hiding, inheritance, polymorphism, delegation, and other object-oriented
    techniques.
  program_input_output: Input and output operations in programs, including console
    and file input/output.
  programming_in_java: Introduction to implementing and using data structures in Java,
    including basic Java language notions.
  software_build_automation: Build automation tools and practices used in software
    development.
  version_control_systems: Version control systems used in software development.
