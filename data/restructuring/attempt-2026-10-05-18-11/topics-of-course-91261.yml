analysis:
  mode: all-courses
source_clusters:
- id: 25
  name: Administration Systems System (25)
course:
  id: '91261'
  name: Artificial Intelligence in Industry
topics:
  anomaly_detection: Detection of anomalous behavior in industrial data and systems.
  combinatorial_optimization: Modeling and solving complex combinatorial decision-making
    and optimization problems using constraint programming, SAT, SMT, linear programming,
    and integer linear programming approaches.
  constraint_programming: Constraint programming techniques for solving optimization
    and constraint problems, including global constraints and search strategies.
  epidemic_control: Control problems for epidemics.
  fairness_constraints: Fairness constraints incorporated into recommendation systems.
  machine_learning: Fundamental machine-learning technologies and algorithms for developing
    intelligent applications.
  maintenance_policies: Maintenance policies based on remaining-useful-life estimates.
  mathematical_modeling: Mathematical modeling of industrial problems.
  power_network_management: Management and optimization problems involving power networks.
  predictive_analytics: Predictive data analysis using statistical and machine-learning
    models.
  probabilistic_models: Integration of probabilistic models with machine-learning
    methods.
  production_planning: Planning problems arising in industrial production.
  recommender_systems: Web recommender systems for multimedia data and content.
  remaining_useful_life_estimation: Estimation of the remaining useful life of industrial
    assets.
  resource_planning: Planning and management of resources in industrial problems.
  simulation: Simulation methods used to analyze and solve industrial use cases.
