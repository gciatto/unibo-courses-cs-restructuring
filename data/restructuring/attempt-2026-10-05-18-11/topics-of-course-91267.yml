analysis:
  mode: all-courses
source_clusters:
- id: 21
  name: Artificial Intelligence Fundamentals (21)
course:
  id: '91267'
  name: Multi-Agent Systems
topics:
  agent_based_simulation: Agent-based simulation for analyzing systems through interacting
    agents.
  automated_reasoning: Automated reasoning and reasoning agents as techniques for
    intelligent systems.
  distributed_coordination: Coordination mechanisms and models for coordinating activities
    in distributed systems, including Linda-style coordination.
  distributed_systems: Concepts and organization of distributed systems.
  intelligent_agents: Agents as systems that exhibit intelligent behavior, including
    the notion of an agent and the construction of systems that simulate human-expert
    behavior in specific disciplines.
  multi_agent_programming: Programming multi-agent systems using agent-oriented technologies,
    including JADE and Jason for intentional agents.
  multi_agent_systems: Conceptual and technical foundations of multi-agent systems
    for modeling and engineering complex computational and socio-technical systems.
  self_organizing_systems: Self-organising systems, including nature-inspired coordination
    and self-organisation in multi-agent systems.
  systematic_literature_review: Systematic literature review as a methodology for
    scientific surveys of intelligent and autonomous systems.
