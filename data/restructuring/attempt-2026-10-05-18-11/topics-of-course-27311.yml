  name: Knowledge Engineering Extraction (12)
course:
  id: '27311'
  name: Humanistic IT
topics:
  character_encoding: Character encoding and digital formats for producing humanistic
    digital objects.
  digital_content_production: Principles for producing digital objects and resources
    in the humanistic domain, including writing, content usability, page architecture,
    text, and multimedia.
  ict_project_management: ICT project management, including scope statements.
  internet_world_wide_web: The Internet and the World Wide Web.
  markup_languages: Markup and presentation languages for Web-oriented digital resources,
    including XHTML, XML, HTML5, and CSS.
  user_interface_design: Basics of designing user interfaces.
  web_distribution_frameworks: Frameworks and tools for distributing digital resources
    on the Web, including Boilerplate and Bootstrap.
