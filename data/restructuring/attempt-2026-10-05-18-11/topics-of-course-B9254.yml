analysis:
  mode: all-courses
source_clusters:
- id: 17
  name: Basic Skills Informatics (17)
course:
  id: B9254
  name: Basic IT Skills
topics:
  artificial_intelligence: Introduction to the main principles, methods, history,
    application fields, and problem-solving approaches of artificial intelligence.
  cloud_storage: Cloud-based storage of digital files and documents, including its
    use for online access and collaboration.
  collaborative_tools: Collaborative tools used with web and social-network resources.
  computer_hardware_architecture: Hardware architecture of computers.
  computer_networks: Basic concepts of computer networks.
  computer_software_basics: Basic computer software, including the classification
    and use of simple application programs.
  data_visualization: Visualization and graphical representation of datasets and their
    properties, including frequency tables and statistical graphics.
  digital_privacy_security: Digital privacy and security issues associated with information
    technology.
  document_authoring: Document authoring and writing tools, including LaTeX and Overleaf,
    for preparing digital documents.
  internet_applications: Prominent Internet applications and communication services,
    including email, news, chat, and peer-to-peer file sharing.
  it_security: Basic information-technology security issues, including viruses and
    phishing.
  malicious_software: Malicious software as a computer-security threat.
  medical_informatics_software: Use of software tools for medical informatics in academic
    and professional contexts.
  operating_systems: Operating-system structure and main functions.
  productivity_software: Individual productivity software, including spreadsheets,
    word processors, and presentation software.
  spreadsheet_data_processing: Organizing, cleaning, and processing data in spreadsheets,
    including the use of Excel for data-processing tasks.
