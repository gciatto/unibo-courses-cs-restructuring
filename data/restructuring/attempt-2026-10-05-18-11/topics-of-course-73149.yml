analysis:
  mode: all-courses
source_clusters:
- id: 12
  name: Knowledge Engineering Extraction (12)
course:
  id: '73149'
  name: Logic for Informatics
topics:
  action_logic: Action logic as a logical formalism covered in the context of modal
    and epistemic logic.
  first_order_logic: Syntax and semantics of first-order logic, including predicates,
    terms, quantifiers, free and bound variables, alpha-conversion, substitution,
    and natural deduction.
  imperative_constructs: Imperative programming concepts, including algorithms and
    programs, data types, assignment, input/output, conditional statements, and iteration.
  information_theory: Fundamental concepts of information and entropy, with introductory
    connections to information theory.
  knowledge_representation: Knowledge representation for artificial-intelligence systems,
    including first-order predicate logic, production rules, knowledge-based systems,
    and introductory formal ontologies.
  modal_logic: Modal and epistemic logic for representing and reasoning about modalities
    and knowledge.
  propositional_logic: Syntax, classical and intuitionistic semantics, natural deduction,
    soundness, compactness, and completeness for propositional logic.
  syllogistic_logic: Syllogistic logic and its formalisms as covered in the course.
  turing_machines: Turing machines as formal models for studying computability and
    the existence of programs computing specified functions.
