source_clusters:
- id: 23
  name: Computer Science Statistics (23)
course:
  id: 96346-B
  name: Computer Science
topics:
  algorithm_design_analysis: Algorithm design and analysis for solving problems with
    computers.
  artificial_intelligence: Introduction to the main principles, methods, history,
    application fields, and problem-solving approaches of artificial intelligence.
  binary_arithmetic: Numbering systems and the four arithmetic operations in the binary
    basis.
  binary_encoding: Binary encoding of information.
  boolean_algebra: Elements of Boolean algebra and logical functions.
  computer_hardware_architecture: Hardware architecture of computers.
  computer_operation: Principles governing the operation of computers.
  computer_software_basics: Basic computer software, including the classification
    and use of simple application programs.
  computing_history: Historical development of computer science and computing systems
    from prehistory through the early 1980s, including stored-program electronic computers,
    calculators, mainframes, minicomputers, microprocessors, and personal computers.
  digital_graphics: Digital graphics as part of digital information processing.
  digital_privacy_security: Digital privacy and security issues associated with information
    technology.
  medical_3d_modeling: Technologies, software, segmentation, and practical design
    for three-dimensional modeling of anatomical structures and customized medical
    devices.
  medical_additive_manufacturing: Technologies and materials for additive printing
    in medicine.
  medical_image_processing: Manipulation of medical images using simple application
    programs.
  operating_systems: Operating-system structure and main functions.
  productivity_software: Individual productivity software, including spreadsheets,
    word processors, and presentation software.
  programming_basics: Basic principles of programming.
