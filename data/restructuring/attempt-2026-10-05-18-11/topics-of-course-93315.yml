analysis:
  mode: all-courses
source_clusters:
- id: 15
  name: Network Networks Programming (15)
course:
  id: '93315'
  name: Computer Networks
topics:
  application_layer_protocols: Application-layer network protocols and architectures,
    including Web and HTTP, FTP, SMTP, POP3, IMAP, DNS, and peer-to-peer systems such
    as BitTorrent.
  centralized_monitoring: Centralized monitoring platforms for large and heterogeneous
    installations, including the SNMP protocol.
  client_server_model: Client/server interaction and the design of small client/server
    applications.
  computer_networks: Basic concepts of computer networks.
  cryptographic_security_properties: Cryptographic security properties including confidentiality,
    authentication, and integrity.
  cryptography: Cryptography, including its mathematical foundations, secret-key and
    public-key algorithms, and applications to protection and security in operating
    systems and distributed systems.
  digital_privacy_security: Digital privacy and security issues associated with information
    technology.
  digital_signatures: Digital signatures as a cryptographic mechanism for authentication
    and integrity.
  error_control_protocols: Channel reliability mechanisms, including error detection
    and correction, common error-detection codes, and ARQ protocols.
  http_web_protocols: Web communication protocols and identifiers, including HTTP,
    URIs, WebSocket, HTTP/2, HTTP/3, and QUIC.
  internet_architecture: Organization and structure of the Internet, including internetworking
    fundamentals and communication across LAN, WAN, and MAN environments.
  internet_routing: Routing in the Internet.
  interprocess_communication: Operating-system mechanisms for communication among
    processes.
  intrusion_detection_monitoring: Attack detection using intrusion-detection systems,
    intrusion-prevention systems, and SIEM platforms.
  link_layer_protocols: Link and network-access protocols and technologies, including
    MAC, Ethernet, IEEE 802.11, HDLC, PPP, ARP, and RARP.
  mobility_management: Mobility and handoff management in mobile systems, including
    location update and search, Mobile IP, HMIPv6, split connections, and I-TCP.
  network_configuration_management: Configuration of network interfaces and routing,
    together with tools for monitoring network connections.
  network_configuration_protocols: Network configuration and management protocols,
    including NETCONF and automatic configuration protocols such as RARP, BOOTP, and
    DHCP.
  network_firewalls: Firewalls for preventing network-based attacks.
  network_multicast: Multicast communication in computer networks.
  network_performance_metrics: Network-performance indices and their interpretation
    in different application contexts, including end-to-end communication performance
    and troubleshooting.
  network_quality_of_service: Quality-of-service requirements and mechanisms for networked
    and real-time communication.
  network_security: Security of communication networks, including privacy, integrity,
    secure network and transport layers, firewalls, and intrusion detection.
  network_sockets: Sockets and socket APIs for C on UNIX and Java as tools for client/server
    communication.
  network_switching: Circuit switching and packet switching in computer networks.
  network_topologies: Computer-network and LAN topologies, network links, resources,
    and logical channels.
  osi_model: The ISO OSI layered organization, including network, transport, session,
    presentation, and application layers.
  physical_layer_networking: Physical-layer networking concepts, including transmission
    media, signals, encoding and decoding, and radio-communication fundamentals such
    as antennas, propagation, link budgets, and decibels.
  secure_network_communications: Secure communication protocols and virtual private
    networks for protecting data in transit.
  software_defined_networking: Software-Defined Networking (SDN) technologies and
    their use in telecommunications systems.
  tcp_ip_protocols: TCP/IP protocol-suite connections and common synchronous and asynchronous
    applications such as remote terminals, file transfer, mail, and news.
  transport_layer_protocols: Transport-layer services and mechanisms, including multiplexing
    and demultiplexing, connectionless communication with UDP, reliable data transfer,
    connection-oriented communication with TCP, and congestion control.
  virtual_channels_networking: Virtual channels and virtual network mechanisms in
    computer networks, including MPLS and VLANs.
  virtual_networks: Virtual network systems and their implementation.
  wireless_communication_systems: Wireless communication systems, including propagation
    and fading models and an overview of wireless technologies such as IEEE 802.11,
    IEEE 802.16, IEEE 802.20, cellular networks, Bluetooth, and ZigBee.
  wireless_networking: Wireless networking and its relationship to the Internet.
