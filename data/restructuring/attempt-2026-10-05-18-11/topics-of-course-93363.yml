source_clusters:
- id: 7
  name: Informatica Computer Science (7)
course:
  id: '93363'
  name: Advanced Programming
topics:
  arrays_matrices: Arrays and matrices, including their organization and representation
    in memory.
  digital_graphics: Digital graphics as part of digital information processing.
  digital_image_processing: Basic concepts, algorithms, tools, and systems for processing
    and analyzing digital images.
  multimedia_information: Representation of multimedia information using digital technologies.
  object_oriented_programming: Fundamental concepts and features of object-oriented
    programming.
  open_source_technologies: Open-source technologies contrasted with proprietary technologies
    in the use of basic software tools.
  operating_systems: Operating-system structure and main functions.
  productivity_software: Individual productivity software, including spreadsheets,
    word processors, and presentation software.
  programming_in_python: Programming in Python, including names, visibility, functions,
    objects, classes, and problem-solving applications.
  python_data_science_libraries: Python libraries and frameworks for data science,
    including NumPy and Pandas for numerical computation and data representation,
    and PyTorch and TensorFlow for defining and using machine-learning models.
  scientific_computing: Basic concepts, methods, and tools for scientific computing.
  search_engines: Search engines as basic information-technology tools.
  uml_modeling: Modeling software systems with UML use case, class, object, sequence,
    collaboration, state, activity, component, and deployment diagrams.
