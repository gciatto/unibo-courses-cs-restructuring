analysis:
  mode: all-courses
source_clusters:
- id: 20
  name: Language Natural Processing (20)
course:
  id: B8536
  name: 'Computer-Aided Human Translation: CAT, MT and AI'
topics:
  ai_translation_tools: AI-enhanced and generative-AI translation functionalities
    integrated into CAT tools to support translation and revision workflows.
  cat_tools: CAT tools such as Trados Studio, MemoQ, and MateCat, including their
    use for translation workflows.
  computer_aided_translation: Computer-assisted translation as a translation-technology
    approach, including CAT workflows and the integration of translation, revision,
    machine translation, and AI tools.
  machine_translation: Machine translation, including its history, principles, engines,
    specialized software and utilities, model setup and maintenance, training-data
    preparation, and integration with computer-assisted translation systems.
  project_management: Project management principles, methodologies, processes, knowledge
    areas, project life cycles, and management of scope, time, cost, quality, resources,
    communications, risks, procurement, integration, and stakeholders, including traditional,
    incremental, iterative, and adaptive approaches.
  translation_file_formats: Handling and translating the main file formats within
    computer-assisted translation workflows.
  translation_memories: Creation and management of translation memories in CAT tools.
  translation_post_editing: Light and full post-editing of machine-translated and
    generative-AI-translated texts, including post-editor roles, task conditions,
    text types, audiences, publication contexts, and strategies for improving raw
    output.
  translation_prompting: Basic prompting techniques for optimizing machine-translated
    output and supporting post-editing within AI-based translation tools.
  translation_quality_assurance: Quality-assurance checks for target texts produced
    through CAT, machine translation, and post-editing workflows.
