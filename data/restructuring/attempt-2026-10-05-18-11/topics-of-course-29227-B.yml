analysis:
  mode: all-courses
source_clusters:
- id: 5
  name: Computing Education Informatics (5)
course:
  id: 29227-B
  name: Foundations of Informatics T
topics:
  arrays_matrices: Arrays and matrices, including their organization and representation
    in memory.
  file_systems: File systems as an operating-system component.
  imperative_constructs: Imperative programming concepts, including algorithms and
    programs, data types, assignment, input/output, conditional statements, and iteration.
  memory_allocation: Memory allocation and direct memory management.
  memory_organization_pointers: Computer memory organization, including addresses,
    words, pointers, pointer arithmetic, and memory representation.
  numerical_analysis: Elementary numerical analysis methods for approximating functions,
    derivatives, zeros, and integrals.
  numerical_errors: Numerical errors and precision issues, including absolute, relative,
    and percentage errors, cancellation, error propagation, machine precision, and
    significant digits.
  object_oriented_programming: Fundamental concepts and features of object-oriented
    programming.
  operating_systems: Operating-system structure and main functions.
  program_input_output: Input and output operations in programs, including console
    and file input/output.
  program_structure_libraries: Program structure, header inclusion, libraries, and
    library functions.
  programming_functions: Functions in C++ programming.
  programming_in_cpp: Introduction to programming and creating programs using C++.
  scientific_computing: Basic concepts, methods, and tools for scientific computing.
  shell_scripting: Shell use and shell scripting.
  variable_scope: Scope of variables in C++ programs, including external variables
    and visibility across program components.
