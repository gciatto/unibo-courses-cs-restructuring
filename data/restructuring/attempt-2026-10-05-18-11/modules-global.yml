  estimated_ects: 0.465
  source_topics:
    digitalization_impacts: Effects of digitalization and the information-technology
      revolution across astronomical, ecological, political, economic, social, and
      individual domains.
- key: decision_quality_monitoring
  description: Monitoring and assessment of the quality of decision-making processes.
  estimated_ects: 0.643
  source_topics:
    decision_quality_monitoring: Monitoring and assessment of the quality of decision-making
      processes.
- key: digital_transformation_project_design
  description: Technology assessment, business and action planning, KPI use, collaborative
