analysis:
  mode: all-courses
modules:
- key: calculus_for_deep_learning
  description: Calculus concepts, including differentiation, used in deep learning.
  estimated_ects: 0.429
  source_topics:
    calculus: Calculus concepts used in deep learning, including differentiation.
- key: neural_network_training_optimization
  description: Automatic differentiation, backpropagation, and optimization algorithms
    for deep-learning computation, training, and optimization.
  estimated_ects: 1.345
  source_topics:
    automatic_differentiation: Automatic differentiation as a calculus-based technique
      used in deep-learning computation and optimization.
    neural_network_training: Training of neural networks using backpropagation.
    optimization_algorithms: Optimization algorithms for training and optimizing deep-learning
      approaches.
- key: feedforward_neural_networks
  description: Feedforward neural-network architectures and their use in deep-learning
    applications.
  estimated_ects: 0.487
  source_topics:
    feedforward_neural_networks: Feedforward neural-network architectures and their
      use in deep-learning applications.
- key: convolutional_neural_networks
  description: Convolutional neural networks as a deep-learning architecture.
  estimated_ects: 0.414
  source_topics:
    convolutional_neural_networks: Convolutional neural networks (CNNs) as a deep-learning
      architecture.
- key: recurrent_neural_networks
  description: Recurrent neural networks as a neural-network architecture for machine
    learning.
  estimated_ects: 0.429
  source_topics:
    recurrent_neural_networks: Recurrent neural networks (RNNs) as a neural-network
      architecture for machine learning.
- key: generative_and_autoencoding_models
  description: Autoencoder architectures and generative deep-learning models, including
    adversarial and diffusion models.
  estimated_ects: 1.014
  source_topics:
    autoencoders: Autoencoder neural-network architectures.
    generative_models: Generative deep-learning models and techniques, including adversarial
      and diffusion models.
- key: neural_network_robustness_interpretation
  description: Adversarial behavior, visualization, and interpretation of neural-network
    behavior and hidden units.
  estimated_ects: 1.146
  source_topics:
    adversarial_examples: Techniques for fooling neural networks and studying adversarial
      behavior.
    neural_network_visualization: Visualization and interpretation of hidden neural
      units and neural-network behavior, including deep dreams and inceptionism.
- key: digital_image_fundamentals
  description: Basic digital-image processing together with image formation, acquisition,
    sensing, sampling, and quantization.
  estimated_ects: 1.044
  source_topics:
    digital_image_processing: Basic concepts, algorithms, tools, and systems for processing
      and analyzing digital images.
    image_formation_acquisition: Image formation and acquisition using pinhole cameras,
      perspective projection, lenses, field of view, depth of field, and image sensors.
    image_sampling_quantization: Basic image sensing, sampling, and quantization.
- key: image_filtering_and_edges
  description: Image convolution, filtering, gray-level histograms, and edge detection
    for digital-image analysis.
  estimated_ects: 1.426
  source_topics:
    image_convolution: Convolution as a basic tool for processing and analyzing images.
    image_filtering: Digital-image filtering using mean, Gaussian, median, bilateral,
      and non-local-means filters.
    image_histograms: Gray-level histograms for digital-image analysis.
    edge_detection: Image edge detection using image gradients, non-maximum suppression,
      the Laplacian of Gaussian, and the Canny edge detector.
- key: binary_image_analysis
  description: Digital topology, thresholding, mathematical morphology, connected-components
    labeling, blob analysis, and image segmentation.
  estimated_ects: 2.146
  source_topics:
    digital_topology: Digital topology as a basic tool for image processing and analysis.
    image_thresholding: Global, automatically estimated, and spatially adaptive thresholding
      for image binarization.
    mathematical_morphology: Mathematical morphology as a basic tool for image processing
      and analysis.
    connected_components_blob_analysis: Connected-components labeling and blob analysis
      of binary images.
    image_segmentation: Techniques for segmenting objects or regions from images.
- key: local_features_and_shape_matching
  description: Local image features, feature matching, Hough transforms, and instance
    detection through pattern and shape matching.
  estimated_ects: 1.306
  source_topics:
    local_image_features: Image gradients, smooth derivatives such as Sobel, Canny
      edge detection, keypoint detectors, descriptors, Harris corners, and scale-invariant
      SIFT features.
    feature_matching: Matching local image features, including efficient matching
      using kd-trees and invariant-feature matching.
    hough_transform: Hough and generalized Hough transforms for detecting analytic
      shapes and objects.
    instance_detection: Instance detection using pattern matching with SSD, SAD, NCC,
      and ZNCC, as well as shape-based matching and similarity estimation.
- key: camera_geometry_and_stereo
  description: Camera calibration and stereo vision, including camera parameters,
    distortion, planar targets, homography estimation, rectification, and stereopsis
    geometry.
  estimated_ects: 0.665
  source_topics:
    camera_calibration: Camera calibration using intrinsic and extrinsic parameters,
      lens-distortion models, planar targets, homography estimation, image rectification,
      and stereo calibration.
    stereo_vision: Geometry of stereopsis and stereo image calibration.
- key: object_detection_recognition_tracking
  description: Detection, recognition, and video tracking of objects in images and
    videos.
  estimated_ects: 1.882
  source_topics:
    object_detection: Techniques for detecting objects in images and videos.
    object_recognition: Recognition of objects from images and videos.
    video_object_tracking: Techniques for detecting and tracking objects in video.
- key: vision_classification_training
  description: Image classification and computer-vision training techniques, including
    data augmentation, regularization, and transfer learning.
  estimated_ects: 1.288
  source_topics:
    image_classification: Image classification using linear classifiers and fully
      connected neural networks.
    data_augmentation: Data-augmentation techniques for training image-classification
      and computer-vision models, including augmentations such as FixRes, cutout,
      mix-up, and cut-mix.
    regularization: Regularization and training techniques for computer-vision neural
      networks, including model capacity, learning-rate scheduling, weight decay,
      label smoothing, and dropout.
    transfer_learning: Transfer learning for deep-learning-based computer vision.
- key: visual_representations_metric_transformers
  description: Image representations, deep metric and representation learning, and
    Vision Transformer architectures for computer-vision tasks.
  estimated_ects: 1.116
  source_topics:
    image_representation: Image representations based on Bag of Visual Words, representation
      learning, convolutional layers, pooling, and batch normalization.
    metric_learning: Deep metric and representation learning for applications such
      as face recognition and identification, including contrastive and triplet losses,
      ArcFace, and NT-Xent loss.
    vision_transformers: Vision Transformer architectures for image classification
      and other computer-vision tasks.
- key: monocular_depth_estimation
  description: Monocular depth estimation from images, including photometric loss
    and Monodepth.
  estimated_ects: 0.4
  source_topics:
    depth_estimation: Monocular depth estimation from images, including photometric
      loss and Monodepth.
- key: image_video_captioning
  description: Image and video captioning using computer-vision and sequence-modeling
    techniques.
  estimated_ects: 0.4
  source_topics:
    image_video_captioning: Image and video captioning tasks addressed using computer-vision
      and sequence-modeling techniques.
- key: document_digitization_workflows
  description: Digitisation, representation, restoration, enhancement, calibration,
    quality control, metadata, and project planning for printed and handwritten textual
