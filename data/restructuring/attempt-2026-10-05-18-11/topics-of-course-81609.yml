analysis:
  mode: all-courses
source_clusters:
- id: 12
  name: Knowledge Engineering Extraction (12)
course:
  id: '81609'
  name: Languages, Compilers and Computational Models
topics:
  code_generation: Generation of target or intermediate code as a compiler phase.
  concurrency_formal_modeling: Formal and visual modeling of concurrent systems using
    Petri Nets, Statecharts, and Activity Diagrams.
  context_free_grammars_parsing: Context-free grammars, push-down automata, their
    equivalences and principal theorems, and parsing algorithms for LL(1), LR(0),
    SLR, LR(1), and LALR(1) grammars, including YACC.
  first_order_logic: Syntax and semantics of first-order logic, including predicates,
    terms, quantifiers, free and bound variables, alpha-conversion, substitution,
    and natural deduction.
  labeled_transition_systems: Labeled transition systems for modeling the behavior
    of concurrent and distributed systems.
  language_implementation: Abstract machines, interpreters, compilers, and implementation
    of programming-language constructs.
  lexical_analysis: Design of lexical analysers, including the use of Lex.
  process_synchronization: Concurrent-process problems and synchronization issues,
    including deadlock, starvation, and busy waiting.
  propositional_logic: Syntax, classical and intuitionistic semantics, natural deduction,
    soundness, compactness, and completeness for propositional logic.
  regular_languages_automata: Regular grammars, regular expressions, finite automata,
    their equivalences, and principal theorems including the pumping lemma.
  static_analysis: Static analysis of programs, including checking correctness properties
    and analyzing resource and asset consumption without executing the code.
  temporal_logic: Temporal logics for specifying and verifying properties of system
    behavior.
  turing_machines: Turing machines as formal models for studying computability and
    the existence of programs computing specified functions.
