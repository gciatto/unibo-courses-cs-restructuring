analysis:
  mode: all-courses
source_clusters:
- id: 21
  name: Artificial Intelligence Fundamentals (21)
course:
  id: '90147'
  name: Artificial intelligence
topics:
  ai_epistemology: Epistemological issues concerning artificial intelligence and its
    approaches.
  ai_ethics: Ethical issues concerning artificial intelligence, cognitive science,
    and robotics.
  ai_planning: Planning problems as a problem-solving approach in artificial intelligence.
  ai_problem_solving: AI problem formulation using states, forward and backward reasoning,
    search-based solving, and problem types including games, constraint satisfaction,
    and planning.
  artificial_intelligence: Introduction to the main principles, methods, history,
    application fields, and problem-solving approaches of artificial intelligence.
  cognitive_science: Cognitive-science approaches to cognition, including theoretical,
    empirical, and neurocognitive perspectives.
  human_computer_interaction: Human-Computer Interaction and its relationship to user
    experience in the design of interactive services.
  knowledge_representation: Knowledge representation for artificial-intelligence systems,
    including first-order predicate logic, production rules, knowledge-based systems,
    and introductory formal ontologies.
  machine_learning: Fundamental machine-learning technologies and algorithms for developing
    intelligent applications.
  natural_language_processing: Natural language processing as an artificial-intelligence
    topic and application area.
  neural_networks_deep_learning: Neural networks and deep-learning techniques, including
    their use in machine-learning applications.
  robotics: Robotics as an application and recent trend of artificial intelligence.
