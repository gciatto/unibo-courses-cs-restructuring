analysis:
  mode: all-courses
source_clusters:
- id: 2
  name: Big Data Cloud (2)
course:
  id: '96143'
  name: Methods and Models for Data Analytics M
topics:
  algorithm_selection_configuration: Automatic selection and configuration of algorithms
    for data-analysis and artificial-intelligence methods.
  association_rule_mining: Mining association rules from data.
  classification_algorithms: Classification models and algorithms, including Bayes
    classifiers, k-nearest neighbor, support vector machines, multiclass classification,
    decision trees, and Bayesian networks where specified.
  clustering: Clustering methods for unsupervised learning, including K-means and
    expectation-maximization (EM).
  constraint_programming: Constraint programming techniques for solving optimization
    and constraint problems, including global constraints and search strategies.
  data_analytics: Data analytics and data elaboration, including practical analysis
    activities for agricultural and Internet-of-Things data.
  data_mining: Data-mining techniques and workflows, including knowledge discovery,
    data understanding and preparation, classification with decision trees and Bayesian
    networks, association rules, clustering, outlier detection, validation, and practical
    use of mining tools.
  data_models: Structured, semi-structured, and unstructured data models.
  data_pipeline_design: Design of data-pipeline processes from data acquisition through
    data analysis and valorization.
  data_preprocessing: Preparation of data for mining and machine-learning analysis,
    including data acquisition, preprocessing, and transformation.
  data_visualization: Visualization and graphical representation of datasets and their
    properties, including frequency tables and statistical graphics.
  machine_learning: Fundamental machine-learning technologies and algorithms for developing
    intelligent applications.
  model_evaluation: Evaluation methods for generative and machine-learning models.
  neural_networks_deep_learning: Neural networks and deep-learning techniques, including
    their use in machine-learning applications.
  outlier_detection: Detection of outliers in data-mining analysis.
  predictive_maintenance: Predictive maintenance methods and use cases based on data-driven
    analysis.
  prescriptive_maintenance: Prescriptive maintenance methods for using data-driven
    analysis to support maintenance decisions.
  statistical_data_analysis: Statistical analysis of datasets, including descriptive
    analysis and statistical tests used to understand data and assess models.
  sustainability_esg: Sustainability and Environmental, Social, and Governance (ESG)
    perspectives in data-science platforms and business-performance monitoring.
  time_series_analysis: Time-series analysis as a method used in the computational
    analysis of data and decision-related processes.
