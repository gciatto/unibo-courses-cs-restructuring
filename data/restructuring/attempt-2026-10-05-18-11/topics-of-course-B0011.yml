analysis:
  mode: all-courses
source_clusters:
- id: 25
  name: Administration Systems System (25)
course:
  id: B0011
  name: Software Process Engineering
topics:
  automatic_code_generation: Automatic source-code generation through software factories
    and development environments in ecosystems such as Eclipse and IntelliJ.
  collaborative_software_development: Use of collaborative tools to support software
    development.
  container_orchestration: Orchestration of containerized software systems as part
    of software development and deployment.
  continuous_delivery: Continuous delivery and deployment practices for automatically
    preparing and releasing software.
  continuous_integration: Continuous Integration practices and tools for integrating
    and validating software changes.
  debugging: Debugging as a programming practice for identifying and correcting errors
    in programs.
  devops_practices: DevOps practices and tools supporting the development, deployment,
    and maintenance of software systems.
  docker_containerization: Use of Docker and container-based environments in software
    development and deployment.
  domain_driven_design: Domain-Driven Design concepts and building blocks, including
    domains, bounded contexts, models, ubiquitous language, entities, value objects,
    aggregates, repositories, services, factories, domain events, and anti-corruption
    layers.
  domain_specific_languages: Domain-Specific Languages (DSLs) for expressing domain-specific
    software models and solutions.
  kotlin_programming: Use of the Kotlin programming language in software-system development.
  model_driven_software_development: Model-Driven Software Development using executable
    requirement and problem models and custom metamodels.
  multiplatform_programming: Multi-platform and multi-target software development
    using Kotlin.
  software_build_automation: Build automation tools and practices used in software
    development.
  software_license: Software licensing concepts and practices, including copyright,
    copyleft, proprietary and free software, ownership versus licensing, and common
    licenses such as MIT, Apache, and GPL.
  software_performance_engineering: Bug hunting and performance engineering techniques
    for improving software behavior and performance.
  software_quality_assurance: Software quality criteria, evaluation, and certification.
  software_testing: Testing activities for software systems.
  software_versioning: Software versioning schemes, semantic versioning, API-stability
    considerations, and conventional commits for managing releases and version histories.
  version_control_systems: Version control systems used in software development.
