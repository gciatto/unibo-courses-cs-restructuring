  name: Fashion Technologies Immersive (3)
course:
  id: '90864'
  name: Elements of Computer Technologies for Fashion E-Commerce
topics:
  artificial_intelligence: Introduction to the main principles, methods, history,
    application fields, and problem-solving approaches of artificial intelligence.
  ecommerce_platforms: E-commerce platforms and their role in constructing and analyzing
    fashion e-commerce systems.
  immersive_ecommerce: Immersive technologies and platform approaches applied to fashion
    e-commerce.
  internet_world_wide_web: The Internet and the World Wide Web.
  it_security: Basic information-technology security issues, including viruses and
    phishing.
  social_networks: Social networks as part of Web 1.0 and Web 2.0 environments.
  software_architecture: Design of a software system's architecture and definition
    of a logical architecture for the problem domain.
  user_interface_design: Basics of designing user interfaces.
  web_servers: Introduction to Web servers in the context of delivering Web pages
    and responding to Web requests.
