source_clusters:
- id: 0
  name: Security Information Cryptography (0)
course:
  id: '72942'
  name: Information Security M
topics:
  authentication_models: Authentication systems and principles for designing secure
    authentication protocols.
  blockchain_technologies: Blockchain and alternative distributed-ledger technologies,
    including their conceptual foundations, decentralization, Bitcoin, and blockchain-based
    distributed applications.
  cryptographic_key_management: Symmetric and asymmetric cryptographic key-management
    models and systems, including key distribution centers, PKI, and PGP.
  cryptographic_protocols: Basic cryptographic protocols and protocols or systems
    such as SSL and PGP.
  cryptography: Cryptography, including its mathematical foundations, secret-key and
    public-key algorithms, and applications to protection and security in operating
    systems and distributed systems.
  federated_authentication: Federated authentication models and protocols or systems,
    including OAuth, OpenID, and SAML.
  single_sign_on: Single sign-on authentication models and related protocols or systems,
    including Kerberos.
