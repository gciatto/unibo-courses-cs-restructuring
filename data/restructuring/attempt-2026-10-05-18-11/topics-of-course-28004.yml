analysis:
  mode: all-courses
source_clusters:
- id: 1
  name: Informatics Principles Foundations (1)
course:
  id: '28004'
  name: Foundations of Informatics T-1
topics:
  algorithm_design_analysis: Algorithm design and analysis for solving problems with
    computers.
  computer_hardware_architecture: Hardware architecture of computers.
  data_structures: Elementary data structures including vectors, records, lists, queues,
    stacks, trees, and graphs.
  development_environment: Use of a development environment for programming.
  language_evolution: Evolution of programming languages from assembly to higher-level
    languages.
  language_semantics: Formal description of programming-language meaning, including
    Structured Operational Semantics.
  language_syntax: Formal description of programming-language syntax, including Backus–Naur
    form and related grammar notation.
  memory_devices: Memory devices as components of computer architecture.
  object_oriented_programming: Fundamental concepts and features of object-oriented
    programming.
  operating_systems: Operating-system structure and main functions.
  programming_basics: Basic principles of programming.
  programming_in_java: Introduction to implementing and using data structures in Java,
    including basic Java language notions.
  recursive_algorithms: Recursive algorithms and the divide-and-conquer methodology.
  software_lifecycle: Phases and activities in the lifecycle of software systems,
    including planning, requirements analysis, design, production, testing, certification,
    and maintenance.
  von_neumann_architecture: The Von Neumann computer architecture.
