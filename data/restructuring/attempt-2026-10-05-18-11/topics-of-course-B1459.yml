  name: Engineering Software Cultural (14)
course:
  id: B1459
  name: ARTIFICIAL INTELLIGENCE, BLOCKCHAIN E CRIPTOVALUTE NELLO SVILUPPO SOFTWARE
topics:
  artificial_intelligence: Introduction to the main principles, methods, history,
    application fields, and problem-solving approaches of artificial intelligence.
  blockchain_technologies: Blockchain and alternative distributed-ledger technologies,
    including their conceptual foundations, decentralization, Bitcoin, and blockchain-based
    distributed applications.
  cognitive_models: Cognitive models used to explain how people develop software and
    to guide production processes.
  cryptocurrencies: Cryptocurrencies and their relationship to blockchain and distributed-ledger
    technologies.
  data_analytics: Data analytics and data elaboration, including practical analysis
    activities for agricultural and Internet-of-Things data.
  machine_learning: Fundamental machine-learning technologies and algorithms for developing
    intelligent applications.
  software_engineering: Introduction to software engineering and the analysis, design,
    development, and testing of software systems.
  software_quality_models: Quality models involving the application of machine learning
    and artificial intelligence in software development and system development.
