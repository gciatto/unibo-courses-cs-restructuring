analysis:
  mode: all-courses
source_clusters:
- id: 0
  name: Security Information Cryptography (0)
course:
  id: '14015'
  name: Cryptography
topics:
  cryptographic_protocols: Basic cryptographic protocols and protocols or systems
    such as SSL and PGP.
  cryptographic_security_properties: Cryptographic security properties including confidentiality,
    authentication, and integrity.
  cryptography: Cryptography, including its mathematical foundations, secret-key and
    public-key algorithms, and applications to protection and security in operating
    systems and distributed systems.
  data_compression: Basic data-compression concepts covered alongside information
    theory.
  digital_certificates: Digital certificates used in cryptographic trust and authentication.
  digital_signatures: Digital signatures as a cryptographic mechanism for authentication
    and integrity.
  distributed_trust: Distributed trust mechanisms in cryptographic systems.
  information_theory: Fundamental concepts of information and entropy, with introductory
    connections to information theory.
  it_security: Basic information-technology security issues, including viruses and
    phishing.
  post_quantum_cryptography: Post-quantum cryptography.
