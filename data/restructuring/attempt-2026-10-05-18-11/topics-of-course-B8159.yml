analysis:
  mode: all-courses
source_clusters:
- id: 1
  name: Informatics Principles Foundations (1)
course:
  id: B8159
  name: INFORMATICA
topics:
  arrays_matrices: Arrays and matrices, including their organization and representation
    in memory.
  binary_arithmetic: Numbering systems and the four arithmetic operations in the binary
    basis.
  binary_encoding: Binary encoding of information.
  character_encoding: Character encoding and digital formats for producing humanistic
    digital objects.
  client_server_model: Client/server interaction and the design of small client/server
    applications.
  computer_networks: Basic concepts of computer networks.
  data_structures: Elementary data structures including vectors, records, lists, queues,
    stacks, trees, and graphs.
  databases_sql: Databases and SQL queries.
  distributed_naming: Resource naming in distributed systems, including DNS and advanced
    name systems.
  file_handling: Input/output and file-handling functions.
  imperative_constructs: Imperative programming concepts, including algorithms and
    programs, data types, assignment, input/output, conditional statements, and iteration.
  internet_protocols: Internet addressing and forwarding mechanisms, including IP
    addressing, IP forwarding, ICMP, DHCP, and Network Address Translation (NAT).
  operating_systems: Operating-system structure and main functions.
  program_execution_model: The model by which computer programs are executed.
  programming_in_r: Programming in R, including structured-programming constructs,
    procedures and functions, implementation of algorithms, and program development.
  r_data_types: Data types in the R language.
  r_functions: Definition and use of functions in the R language.
  r_graphics_packages: Graphics and package use in the R language.
  relational_algebra: Relational algebra, including its basic and derived operators.
  relational_data_model: Structure of the relational data model, integrity constraints,
    and normal forms.
  von_neumann_architecture: The Von Neumann computer architecture.
