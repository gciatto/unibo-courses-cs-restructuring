analysis:
  mode: all-courses
source_clusters:
- id: 16
  name: Data Algorithms Structures (16)
course:
  id: B5782
  name: Algorithms and Data Structures for Computational Biology
topics:
  algorithm_design_analysis: Algorithm design and analysis for solving problems with
    computers.
  approximation_algorithms: Approximation algorithms for obtaining solutions to computationally
    difficult problems.
  arrays_matrices: Arrays and matrices, including their organization and representation
    in memory.
  asymptotic_analysis: Analysis of algorithmic computational cost using order-of-magnitude
    estimates.
  branch_and_bound: Branch-and-bound techniques for solving computational problems
    by systematically exploring and pruning a search space.
  brute_force_algorithms: Brute-force approaches for solving computational problems
    by systematically exploring candidate solutions.
  burrows_wheeler_transform: The reversible Burrows-Wheeler transform and its applications
    in string processing.
  data_structures: Elementary data structures including vectors, records, lists, queues,
    stacks, trees, and graphs.
  divide_and_conquer_algorithms: Divide-and-conquer as an algorithmic design paradigm.
  dynamic_programming: Dynamic programming as an algorithm design technique.
  greedy_algorithms: Greedy algorithm design techniques.
  hash_tables: Hash tables as a data structure.
  heuristic_algorithms: Heuristic methods for addressing challenging computational
    problems.
  programming_in_python: Programming in Python, including names, visibility, functions,
    objects, classes, and problem-solving applications.
  sequence_alignment: Pairwise local and global sequence alignment, multiple sequence
    alignment, and algorithmic approaches to sequence alignment.
  sequence_assembly: Sequence-assembly methods using overlap graphs and greedy algorithms
    for shortest common supersequence problems.
  sorting_algorithms: Algorithms for sorting data.
  string_matching: Exact and approximate string-matching techniques.
  string_processing: String manipulation and string functions.
  suffix_data_structures: Suffix trees, suffix tries, and suffix arrays for string
    processing.
