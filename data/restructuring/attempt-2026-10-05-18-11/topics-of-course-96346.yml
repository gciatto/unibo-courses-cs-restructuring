analysis:
  mode: all-courses
source_clusters:
- id: 7
  name: Informatica Computer Science (7)
course:
  id: '96346'
  name: INFORMATICA
topics:
  abstract_data_types: Abstract data types, including type definitions and operations
    such as constructors, selectors, predicates, functions, and transformators, with
    related representation and implementation techniques.
  algorithm_design_analysis: Algorithm design and analysis for solving problems with
    computers.
  basic_data_types: Basic Python data types and their use in solving problems.
  computability_limits: Limitations of effective procedures, including non-decidable
    problems.
  computational_complexity: Computational complexity and complexity classes, including
    P, NP, NP-complete problems, the P versus NP question, space complexity classes,
    oracle classes, class hierarchies, and functional classes.
  computer_hardware_architecture: Hardware architecture of computers.
  data_structures: Elementary data structures including vectors, records, lists, queues,
    stacks, trees, and graphs.
  functions: Functions in Python and their use in programming problem solutions.
  object_mutability: Immutable and mutable objects in Python.
  program_execution_model: The model by which computer programs are executed.
  programming_basics: Basic principles of programming.
  programming_in_python: Programming in Python, including names, visibility, functions,
    objects, classes, and problem-solving applications.
  scope_visibility: Names and visibility rules in Python programs.
  sorting_algorithms: Algorithms for sorting data.
