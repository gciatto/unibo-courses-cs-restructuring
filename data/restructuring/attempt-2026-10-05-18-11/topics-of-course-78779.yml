analysis:
  mode: all-courses
source_clusters:
- id: 4
  name: Internet Things Systems (4)
course:
  id: '78779'
  name: Mobile Systems M
topics:
  data_synchronization: Data synchronization in mobile systems, including pessimistic
    and optimistic approaches, versioning, change detection, reconciliation, and SyncML
    representation and synchronization protocols.
  distributed_communication: Communication mechanisms for distributed systems.
  distributed_systems: Concepts and organization of distributed systems.
  edge_fog_computing: Edge and fog computing for integrating sensor, edge, and cloud
    resources, including distributed control and intelligence, offloading, proactive
    approaches, mobility prediction, ETSI Mobile Edge Computing, orchestration, ETSI
    MANO, and deployment in 5G environments.
  enterprise_messaging: Enterprise messaging and integration technologies, including
    Java Message Service, Enterprise Service Bus concepts, and Java Business Integration.
  event_driven_computing: Event-driven computational models and applications, including
    proactive-reactive distributed software.
  iot_systems: Internet of Things systems combining high-level application aspects
    with low-level devices in virtual and real environments.
  link_layer_protocols: Link and network-access protocols and technologies, including
    MAC, Ethernet, IEEE 802.11, HDLC, PPP, ARP, and RARP.
  message_passing: Message-passing models and implementations for interactions among
    distributed software components.
  mobile_ad_hoc_networks: Mobile ad hoc networks, including their application domains,
    reactive, proactive, geographic, and hybrid routing, DSR, AODV, GPSR, and clustering
    approaches such as LEACH, HEED, and REDMAN.
  mobile_application_development: Development of mobile applications for Android and
    iOS, including platform setup, SDKs, platform architectures and components, Kotlin,
    Swift, Objective-C, Android Activities, iOS targets, actions, and outlets.
  mobile_device_features: Use of mobile-device capabilities and services, including
    input/output, sensors, geolocation and maps APIs, multimedia, background work,
    and mobile data management.
  mobile_middleware: Middleware for mobile systems, including middleware motivations
    and principles, Internet and Web principles, SOA principles, mobile-computing
    and cross-layering principles, and architectural patterns for mobile computing.
  mobile_networking_services: Networking services and application execution in wireless
    mobile scenarios.
  mobility_management: Mobility and handoff management in mobile systems, including
    location update and search, Mobile IP, HMIPv6, split connections, and I-TCP.
  open_radio_access_networks: Open Radio Access Network (O-RAN) technologies in telecommunications.
  positioning_systems: Positioning systems for mobile and ad hoc environments, including
    positioning taxonomies, lateration, time difference of arrival, angulation, scene
    analysis, proximity, GPS, differential GPS, Bluetooth-based positioning, PlaceLab,
    RADAR, Ekahau, sensor fusion, and related frameworks.
  publish_subscribe_messaging: Event management and publish/subscribe models, including
    event-router topologies, interest and subscription propagation, routing decisions,
    OMG DDS, distributed events, GENA, RSS/Atom, SIP Event Framework, and Web Services
    Eventing and Notification.
  service_discovery: Discovery services for locating and accessing resources and services,
    including auto-configuration, Jini, the Service Location Protocol, and UPnP.
  session_management: Session management in converged 4G and IMS networks, including
    SIP, IMS architecture and functional entities, protocol examples, monitoring,
    load-balancing, scalability, and related limitations.
  web_services: Web services as back-end technologies for Web applications.
  wireless_communication_systems: Wireless communication systems, including propagation
    and fading models and an overview of wireless technologies such as IEEE 802.11,
    IEEE 802.16, IEEE 802.20, cellular networks, Bluetooth, and ZigBee.
  wireless_networking: Wireless networking and its relationship to the Internet.
