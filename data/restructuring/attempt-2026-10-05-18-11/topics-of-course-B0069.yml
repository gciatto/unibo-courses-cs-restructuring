analysis:
  mode: all-courses
source_clusters:
- id: 21
  name: Artificial Intelligence Fundamentals (21)
course:
  id: B0069
  name: Artificial Intelligence for Digital Innovation
topics:
  ai_ethics: Ethical issues concerning artificial intelligence, cognitive science,
    and robotics.
  ai_safety_alignment: Safety, value alignment, controllability, super-intelligence,
    and self-awareness as open problems in intelligent and autonomous AI systems.
  artificial_intelligence: Introduction to the main principles, methods, history,
    application fields, and problem-solving approaches of artificial intelligence.
  automated_reasoning: Automated reasoning and reasoning agents as techniques for
    intelligent systems.
  constraint_satisfaction: Constraint satisfaction problems as a problem-solving approach
    in artificial intelligence.
  generative_models: Generative deep-learning models and techniques, including adversarial
    and diffusion models.
  intelligent_agents: Agents as systems that exhibit intelligent behavior, including
    the notion of an agent and the construction of systems that simulate human-expert
    behavior in specific disciplines.
  knowledge_representation: Knowledge representation for artificial-intelligence systems,
    including first-order predicate logic, production rules, knowledge-based systems,
    and introductory formal ontologies.
  language_models: Language models, transformer architectures, and efficient attention
    mechanisms for text and language processing.
  machine_learning: Fundamental machine-learning technologies and algorithms for developing
    intelligent applications.
  natural_language_processing: Natural language processing as an artificial-intelligence
    topic and application area.
  neural_networks_deep_learning: Neural networks and deep-learning techniques, including
    their use in machine-learning applications.
  reinforcement_learning: Reinforcement learning as a machine-learning approach.
  search_algorithms: Search algorithms for solving problems.
  supervised_unsupervised_learning: Supervised and unsupervised machine-learning approaches.
