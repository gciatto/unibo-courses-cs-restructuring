analysis:
  mode: all-courses
source_clusters:
- id: 8
  name: Databases Database Systems (8)
course:
  id: '28796'
  name: Elements of Databases
topics:
  data_mining: Data-mining techniques and workflows, including knowledge discovery,
    data understanding and preparation, classification with decision trees and Bayesian
    networks, association rules, clustering, outlier detection, validation, and practical
    use of mining tools.
  data_models: Structured, semi-structured, and unstructured data models.
  data_warehousing: Enterprise data warehouse architectures, administration, reporting
    and OLAP analysis, and the data-warehouse lifecycle from data-source and requirements
    analysis through conceptual and logical design, ETL procedures, workload and volume
    assessment, and physical design.
  databases_sql: Databases and SQL queries.
  information_retrieval: Basic information-retrieval models, including Boolean and
    vector-space models, text analysis, and web information retrieval with PageRank.
  sql_xml_xquery: SQL/XML and XQuery, including their basic constructors and use with
    semi-structured and unstructured data.
