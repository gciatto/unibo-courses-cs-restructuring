analysis:
  mode: all-courses
source_clusters:
- id: 13
  name: Web Technologies Web-Related (13)
course:
  id: '94442'
  name: Design of Web Applications T
topics:
  database_application_access: Database applications and data-access modalities, including
    examples using Java and .NET C#.
  database_design: Database design using the Entity-Relationship (ER) language and
    relational-model concepts.
  database_transactions: Database transactions, including ACID properties, concurrency
    management, and transaction protocols.
  enterprise_components: Component-based enterprise application development, including
    Enterprise JavaBeans, session-oriented and message-oriented components, interceptors,
    component integration, and component-model evolution.
  enterprise_persistence: Persistence support for enterprise applications, including
    transparent persistence, object-relational mapping, query support, metadata, performance,
    JPA, and Hibernate.
  markup_languages: Markup and presentation languages for Web-oriented digital resources,
    including XHTML, XML, HTML5, and CSS.
  model_driven_software_development: Model-Driven Software Development using executable
    requirement and problem models and custom metamodels.
  requirements_analysis: Analysis of software requirements as part of software-system
    planning and development.
  software_architecture: Design of a software system's architecture and definition
    of a logical architecture for the problem domain.
  uml_modeling: Modeling software systems with UML use case, class, object, sequence,
    collaboration, state, activity, component, and deployment diagrams.
  web_application_modeling: Modeling Web applications using data, hypertext, and content-management
    models, including WebML and IFML-related model-based development.
  xml_processing: XML and XHTML information description, DTD and XML Schema typing,
    XSL and XSLT transformations, and XML parsing in Java using DOM and SAX models.
