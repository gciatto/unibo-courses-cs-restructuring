analysis:
  mode: all-courses
source_clusters:
- id: 26
  name: Programming Software Design (26)
course:
  id: '81672'
  name: Emerging Programming Paradigms
topics:
  certified_programming: Certified programming techniques and case studies involving
    numbers, lists, and sized vectors.
  classless_object_oriented: Classless object-oriented programming and its underlying
    object-model principles.
  dependent_types: Dependent types and their use in programming with stronger correctness
    guarantees.
  effect_composition: Compositional approaches to programming with side effects.
  monad_transformers: Monad transformations for composing monadic computational effects.
  monads: The origin and classical uses of monads for partial computations, state,
    and input/output.
  nondeterministic_parsing: Nondeterministic parsing as a case study in compositional
    programming.
  object_oriented_limits: Limits and weaknesses of the object-oriented programming
    paradigm.
  parametric_types: Parametric types and their role in generic, type-safe programming.
  property_based_testing: Property-based code testing using QuickCheck.
  software_transactional_memory: Concurrent programming using software transactional
    memory.
  traits: Traits in Go and Rust as constructs for composing reusable behavior.
  type_classes: Type classes in Haskell as a mechanism for expressing shared operations
    across types.
  types_and_type_checking: Types and type-checking mechanisms in programming languages.
