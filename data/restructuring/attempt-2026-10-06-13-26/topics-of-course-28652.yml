analysis:
  mode: all-courses
source_clusters:
- id: 25
  name: Administration Systems System (25)
course:
  id: '28652'
  name: IT Systems T-1
topics:
  conceptual_database_design: Requirements analysis and conceptual database design
    for relational databases.
  data_flow_workflows: Data-Flow Diagrams and workflow schemata for modelling information-system
    data flows and operations.
  database_access_architectures: Client-server architectures for relational database
    management systems, with introductory coverage of distributed and cloud database
    systems.
  database_architectures: Architectural organization of database systems, including
    client-server relational systems and introductory distributed and cloud database
    systems.
  database_normalization: Normal forms and normalization techniques for relational
    database design.
  database_storage_structures: Secondary-memory data structures and management algorithms,
    including sequential and direct access organizations, primary and secondary indexes,
    and B-tree, B*-tree, and B+tree structures.
  database_transactions: Database transactions, including ACID properties, concurrency
    management, and transaction protocols.
  enterprise_information_systems: Information systems used by firms and organizations.
  entity_relationship_model: Entity-Relationship modeling for representing data and
    relationships in database design.
  erp_systems: Enterprise Resource Planning (ERP) systems as a category of enterprise
    information systems.
  logical_database_design: Logical database design for relational databases.
  rdbms_components: Main relational database management system components, including
    query optimization, transaction management, scheduling, recovery, caching, storage
    management, and access methods.
  relational_algebra: Basic and derived operators of relational algebra.
  relational_model: Structure and principles of the relational data model.
  requirements_analysis: Analysis of software requirements as part of planning and
    software-system development.
  sql_queries: Databases and the formulation and use of SQL queries.
