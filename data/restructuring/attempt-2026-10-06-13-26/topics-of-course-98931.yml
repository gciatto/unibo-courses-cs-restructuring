analysis:
  mode: all-courses
source_clusters:
- id: 21
  name: Artificial Intelligence Fundamentals (21)
course:
  id: '98931'
  name: Fundamentals of Artificial Intelligence
topics:
  action_logic: Action logic for representing and reasoning about actions.
  adversarial_search: Search strategies for problems involving adversaries, including
    search in competitive or game-like settings.
  ai_introduction: Introduction to artificial intelligence, including its history,
    main application fields, and core principles and methods.
  ai_planning: Planning problems as a class of artificial-intelligence problem-solving
    tasks.
  ai_problem_solving: AI problem solving through state-based representation, games,
    constraint satisfaction problems, and planning problems.
  ai_search_strategies: Search-based problem solving in artificial intelligence using
    informed and uninformed search strategies.
  automated_reasoning: Fundamental concepts and techniques for automated reasoning
    using logical representations.
  bayesian_network_reasoning: Representation and reasoning with Bayesian networks.
  branch_and_bound: Branch-and-bound techniques for search and optimization in artificial-intelligence
    problem solving.
  constraint_relaxation: Constraint-relaxation techniques for solving artificial-intelligence
    problems.
  constraint_satisfaction: Constraint satisfaction problems as a class of artificial-intelligence
    problem-solving tasks.
  definite_clause_grammars: Definite Clause Grammars (DCGs) in Prolog-based rule systems.
  description_logics: Description logics as computational logic formalisms for representing
    knowledge and supporting automated reasoning.
  event_calculus: Event Calculus for temporal reasoning about actions, situations,
    and events in logic programs.
  exact_approximate_inference: Exact and approximate inference methods for Bayesian
    networks and uncertain knowledge.
  formal_ontologies: Introductory notions of formal ontologies for knowledge representation.
  forward_backward_reasoning: Forward and backward reasoning approaches used in artificial-intelligence
    problem solving.
  forward_chaining_rete: Forward-chaining rule inference using the RETE algorithm
    and Drools.
  graph_based_planning: Planning techniques that represent and solve planning problems
    using graph-based structures.
  knowledge_based_systems: Knowledge-based systems, including their concepts and architectural
    organization.
  knowledge_representation: Knowledge-representation techniques used in the context
    of automated reasoning.
  linear_planning: Linear planning in which actions and subgoals are arranged in a
    fixed sequence.
  local_search: Local-search methods that iteratively improve candidate solutions
    by exploring neighboring solutions.
  logical_programming: The logical programming paradigm.
  lpad: LPAD probabilistic logic programs for representing and reasoning with uncertain
    knowledge.
  metaheuristic_search: Metaheuristic methods for guiding search in artificial-intelligence
    problem solving.
  partial_order_planning: Partial-order planning in which actions are constrained
    by necessary ordering relations rather than a single total sequence.
  planning_scheduling: Scheduling methods covered alongside artificial-intelligence
    planning.
  probabilistic_reasoning: Reasoning under uncertainty using probability queries and
    independence.
  problem_decomposition: Problem-solving through decomposition into smaller subproblems.
  production_rule_systems: Production rule systems as a knowledge-representation approach.
  prolog_meta_interpreters: Introductory use of Prolog meta-predicates and meta-interpreters.
  prolog_programming: Design and development of simple Prolog programs for implementing
    artificial-intelligence systems and problem solvers.
  semantic_networks: Semantic networks for representing terminological knowledge.
