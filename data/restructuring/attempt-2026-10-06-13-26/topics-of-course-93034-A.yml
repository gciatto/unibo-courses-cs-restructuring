topics:
  algorithmic_problem_solving: Algorithmic approaches to solving problems with computers
    using the imperative programming paradigm.
  computer_hardware_architecture: Fundamental organization of computer hardware systems.
  functional_programming: Basic concepts and practical use of the functional programming
    paradigm.
  jupyter_notebooks: Using Jupyter Notebook as an interactive environment for developing
    and executing Python code.
  numerical_algorithms: Algorithms for numerical computation, as practiced through
    well-known numerical computation exercises.
  object_oriented_programming: Introduction to the object-oriented programming paradigm
    in practical lectures.
  operating_systems_overview: Overview of the main operating systems referenced in
    the course.
  python_data_structures: Data structures used in Python programming, as introduced
    alongside Python data types, control flow, functions, and libraries.
  python_functions: Functions in the Python programming language.
  python_interpreter: The Python interpreter and its role in executing Python programs.
  python_numerical_methods: Implementing introductory numerical methods in Python
    for solving numerical problems.
  python_programming_basics: Introduction to programming in Python.
  python_vector_computations: Performing vector computations in Python.
  structured_programming: Structured programming using imperative programming constructs.
  terminal_emulator: Using a terminal emulator to interact with a computer system.
