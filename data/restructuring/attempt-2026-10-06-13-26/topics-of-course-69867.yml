analysis:
  mode: all-courses
source_clusters:
- id: 13
  name: Web Technologies Web-Related (13)
course:
  id: '69867'
  name: Web Services and Applications
topics:
  async_web_notifications_workflows: Asynchronous notifications and workflows in Web
    applications.
  client_side_frameworks: Introduction to client-side Web frameworks, including Vue,
    React, and Angular.
  javascript_everywhere: Use of JavaScript across client-side and server-side parts
    of Web applications.
  mevn_stack: The MEVN Web solution stack and related MEAN and MERN stacks, including
    MongoDB, ExpressJS, and NodeJS.
  mvc_mvvm_web_patterns: Application of the Model-View-Controller and Model-View-ViewModel
    patterns in Web applications.
  web_architectures_stacks: Comparisons of Web architectures and solution stacks for
    developing Web sites, front ends, and back ends.
  web_browser_server: How Web browsers and Web servers work, including the technologies
    they support.
  web_language_supersets: Web-language supersets and preprocessors, including TypeScript,
    SCSS, and SASS.
  web_services: Development of back ends based on Web services.
