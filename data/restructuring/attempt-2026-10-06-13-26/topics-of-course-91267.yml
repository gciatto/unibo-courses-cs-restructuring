analysis:
  mode: all-courses
source_clusters:
- id: 21
  name: Artificial Intelligence Fundamentals (21)
course:
  id: '91267'
  name: Multi-Agent Systems
topics:
  agent_artifacts: Artifacts that support agent activities in multi-agent systems,
    including their functions and uses.
  agent_autonomy: Autonomy as a defining concept of agents in multi-agent systems.
  agent_based_simulation: Agent-based simulation methods.
  automated_reasoning: Fundamental concepts and techniques for automated reasoning
    using logical representations.
  distributed_systems: Fundamental concepts of distributed systems.
  intelligent_agents: Agents as entities that perceive, reason, and act to exhibit
    intelligent behavior.
  intentional_agents: Programming intentional agents with Jason, including exercises
    in agent-oriented programming.
  jade_agents: Simple distributed agents implemented with the JADE agent framework.
  multi_agent_coordination: Coordination mechanisms and issues for coordinating multiple
    agents.
  nature_inspired_coordination: Nature-inspired approaches to coordination and self-organization
    in multi-agent systems.
  self_organizing_systems: Self-organization in multi-agent and other complex systems.
  systematic_literature_review: Systematic literature review as a methodology for
    conducting scientific surveys of intelligent and autonomous systems.
