analysis:
  mode: all-courses
source_clusters:
- id: 29
  name: Informatics Informatic Humanities (29)
course:
  id: '78510'
  name: Informatics
topics:
  computer_history: Historical development of computers as introduced alongside computer
    architecture.
  computer_networks: Basic computer-network concepts.
  cryptographic_security_foundations: Fundamental security issues arising in computer
    systems as addressed through cryptography.
  digital_signatures: Digital signatures, including their use in email and certified
    email.
  internet_www: The Internet and World Wide Web.
  it_security: Basic IT security issues, including personal-data and file protection,
    viruses, and phishing.
  italian_health_system: Organization and structure of the Italian health system as
    introduced in the course.
  operating_systems_overview: Overview of the main operating systems referenced in
    the course.
  processor_memory_io: Basic elements of processors, memories, and input/output interfaces
    in digital systems.
  productivity_software: Personal productivity tools for word processing, spreadsheets,
    and presentations, including Microsoft Word, Excel, and PowerPoint.
  programming_languages_intro: Introductory concepts of programming languages, including
    what a language is and the role of programming languages.
  software_operating_systems: The software structure of a computer, including operating
    systems and application programs.
