analysis:
  mode: all-courses
source_clusters:
- id: 19
  name: Cultural Heritage Computer (19)
course:
  id: '98618'
  name: '"Document Digitization Techniques "'
topics:
  digital_collection_sizing: Estimating the storage space required for digital collections,
    including uncertainty in collection-size calculations.
  digital_file_naming: Use of nomenclature and logical naming structures for organizing
    digitized document files.
  digital_image_display: Visualization of digitized images on different output media.
  digital_image_formats: Digital formats used to represent images.
  digital_image_metadata: Technical metadata describing digitized images and supporting
    their management and preservation.
  digital_image_quality_assessment: Assessment of digital-image quality using histograms,
    distributions, and information-content measures.
  digital_image_storage: Storage requirements and considerations for digital images
    and digitized document collections.
  digital_images: Digital images as technologies for communicating cultural heritage.
  digital_textualization: Transposition and digitization of humanities texts and documents
    for use in Digital Humanities projects.
  digitization_guidelines_specs: Critical analysis of cultural-heritage digitization
    guidelines and technical specifications for digitization tenders.
  document_digitization_workflows: Workflows for digitally acquiring, processing,
    representing, enhancing, and restoring printed and handwritten textual documents.
  document_image_restoration: Digital restoration and enhancement activities for images
    of textual documents.
  file_formats: File formats and their role in storing, exchanging, and archiving
    digital documents and data.
  image_formation_acquisition: Image formation and acquisition concepts, including
    image sensors and the use of lenses.
  image_resolution: Optical and interpolated image resolution in the digitization
    of textual documents.
  scanner_calibration: Calibration of scanners used to acquire digital images of textual
    documents.
