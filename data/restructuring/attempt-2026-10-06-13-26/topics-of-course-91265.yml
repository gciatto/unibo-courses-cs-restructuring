analysis:
  mode: all-courses
source_clusters:
- id: 12
  name: Knowledge Engineering Extraction (12)
course:
  id: '91265'
  name: Knowledge Engineering
topics:
  automated_reasoning: Fundamental concepts and techniques for automated reasoning
    using logical representations.
  knowledge_extraction: Methods for automatically extracting knowledge from text and
    other arbitrary content using rule-based, linguistic, graph-based, and statistical
    approaches.
  knowledge_graphs: Knowledge graphs in the Web of Data, including their conceptual
    foundations and use for representing and integrating knowledge.
  large_language_models: Generative large language models.
  neurosymbolic_methods: Neuro-symbolic methods for trustworthy artificial intelligence.
  ontology_design_methodologies: Methodologies for designing ontologies, including
    systematic approaches to ontology development and engineering.
  ontology_design_patterns: Reusable ontology design patterns for structuring and
    representing domain knowledge.
  ontology_modeling_owl: Knowledge representation with ontologies and the OWL ontology
    language.
  rdf_rdfs: RDF and RDFS for representing metadata and structured knowledge on the
    Web.
  semantic_web_architecture: Architecture, concepts, standards, and languages underlying
    the Semantic Web and Web of Data.
  sparql_querying: Querying RDF and knowledge graphs with SPARQL, including use of
    the DBpedia knowledge graph.
