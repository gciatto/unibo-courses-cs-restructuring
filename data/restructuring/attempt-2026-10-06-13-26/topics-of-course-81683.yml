analysis:
  mode: all-courses
source_clusters:
- id: 4
  name: Internet Things Systems (4)
course:
  id: '81683'
  name: Internet of Things
topics:
  arduino_programming: Programming the Arduino UNO microcontroller platform using
    introductory C++ and the Wiring framework.
  bluetooth_networking: Bluetooth protocol stack, topologies, discovery, scatternets,
    multi-hop communication, and Bluetooth programming support.
  edge_ai_tinyml: Artificial-intelligence processing at the edge, including TinyML
    techniques for resource-constrained IoT devices.
  edge_fog_computing: Edge and fog computing for sensor-edge-cloud integration, distributed
    control and intelligence, offloading, proactive approaches, mobility prediction,
    and orchestration in mobile and industrial environments.
  embedded_iot_programming: Embedded IoT application development using C++ and MicroPython,
    including sensor and actuator interfacing.
  embedded_networks: Networks of embedded systems, including their models, architectures,
    communication protocols, and wireless technologies.
  embedded_systems_intro: Introduction to embedded systems, including microcontrollers,
    systems-on-chip, sensors, actuators, and related electronics.
  esp32_idf_programming: Programming ESP32-based IoT systems using the ESP-IDF framework.
  internet_of_things: Design and development of applications combining high-level
    software or AI capabilities with connected Internet of Things devices.
  iot_ai_forecasting: Time-series forecasting and sensor-data analysis using artificial-intelligence
    and machine-learning techniques.
  iot_architectures_platforms: Basic architectures and platforms for Internet of Things
    systems.
  iot_devices_sensors: Internet of Things things, including sensors, actuators, and
    complex devices, with examples such as Raspberry Pi and Arduino platforms.
  iot_messaging_protocols: Message-based Internet of Things interactions using CoAP
    and MQTT, alongside TCP, UDP, and HTTP communication.
  iot_network_routing: Network architectures and routing for IoT systems, including
    6LoWPAN and RPL.
  iot_platforms: Internet of Things platform environments, including Raspberry Pi,
    Arduino, and Mbed OS, as well as other IoT service platforms.
  iot_wireless_technologies: Wireless communication technologies and encoding for
    IoT, including BLE, IEEE 802.15.4, Z-Wave, WLAN, and LoRa/LoRaWAN low-power wide-area
    networking.
  kafka_streaming: Use of the Apache Kafka framework for IoT data acquisition and
    streaming.
  semantic_web_architecture: Architecture, concepts, standards, and languages underlying
    the Semantic Web and Web of Data.
  serial_communication_protocols: Serial communication protocols for interfacing electronic
    components and systems, including OneWire, I2C, SPI, and UART.
  time_series_data_management: Storage and processing of sensor time-series data using
    time-series databases, including InfluxDB.
  time_series_forecasting: Time-series forecasting using statistical methods.
  time_series_visualization: Visualization of IoT time-series data using tools such
    as Grafana.
  web_of_things: Introductory Web of Things concepts for connecting and interacting
    with Internet of Things devices through Web technologies.
  wireless_networking: Wireless networking and its relationship to Internet communication.
