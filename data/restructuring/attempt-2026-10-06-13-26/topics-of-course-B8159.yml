analysis:
  mode: all-courses
source_clusters:
- id: 1
  name: Informatics Principles Foundations (1)
course:
  id: B8159
  name: INFORMATICA
topics:
  binary_encoding: Binary encoding of information.
  character_encodings: Character encodings used to represent text in web documents
    and communications.
  computer_networks: Basic computer-network concepts.
  cpu_fetch_cycle: The fetch cycle as a basic stage of computer instruction execution.
  database_integrity_constraints: Integrity constraints governing valid data in relational
    databases.
  dns: DNS and advanced name systems used in distributed environments.
  internet_basics: Basic concepts of the Internet introduced alongside computer-network
    fundamentals.
  internetworking_fundamentals: Fundamentals and organization of internetworks, including
    the structure of the Internet and communication across LAN, WAN, and MAN environments.
  network_protocols: Introduction to protocols used in computer networks.
  numeric_representation: Representation and computation with numeric formats, including
    binary notation, two's-complement representation, and floating-point numbers.
  operating_systems_overview: Overview of the main operating systems referenced in
    the course.
  r_data_structures: Vectors, lists, matrices, and data frames in the R language.
  r_file_io: Reading and writing files with R programs.
  r_functions: Procedures and functions implemented and used in the R programming
    language.
  r_graphics_packages: Graphics production and package use in the R language.
  r_programming_basics: Introduction to programming with the R language, including
    translating algorithms into R programs and implementing programs in laboratory
    exercises.
  r_structured_programming: Structured programming constructs in R, including sequence,
    iteration, and choice.
  relational_algebra: Basic and derived operators of relational algebra.
  relational_keys: Keys used to identify and relate records in relational databases.
  relational_model: Structure and principles of the relational data model.
  sql_access_control: SQL access-control statements, including GRANT and REVOKE.
  sql_ddl_dml: SQL statements for defining relational database structures and creating,
    modifying, and deleting data.
  sql_queries: Databases and the formulation and use of SQL queries.
  sql_views: Definition and use of views in SQL databases.
  von_neumann_architecture: The organization and operating principles of the Von Neumann
    computer architecture.
