analysis:
  mode: all-courses
source_clusters:
- id: 20
  name: Language Natural Processing (20)
course:
  id: '96725'
  name: IT and Game Localization
topics:
  localization_accessibility: Applying media-accessibility requirements when localizing
    videogames, IT products, and web content.
  localization_bug_prevention: Identification and prevention of bugs arising in software-localization
    work.
  localization_layout_constraints: Managing size and visual restrictions that affect
    localized software, videogame, and web content.
  localization_placeholders: Handling variables and placeholders when translating
    localized software content.
  localization_quality_assessment: Assessment of the linguistic quality of a localized
    videogame, IT product, or web content as a whole.
  localization_text_revision: Information mining, editing, and revision techniques
    applied to texts being localized.
  localization_text_types: Translation of software-application content such as videogame
    or application dialogues, interfaces, and tutorials.
  software_localization_domains: Localization of videogames, IT products, and web
    content, including its distinctive features and potential pitfalls compared with
    other forms of translation.
