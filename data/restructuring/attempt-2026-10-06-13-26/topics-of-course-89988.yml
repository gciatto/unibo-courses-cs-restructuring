analysis:
  mode: all-courses
source_clusters:
- id: 1
  name: Informatics Principles Foundations (1)
course:
  id: '89988'
  name: Elements of Informatics
topics:
  compilers: Compilers as implementation mechanisms for programming languages.
  computational_thinking: Computational thinking as an approach to formulating and
    solving problems with computers.
  csv_file_handling: Reading and processing CSV files in Python.
  debugging_assertions: Debugging techniques for checking and diagnosing programs.
  interpreters: Interpreters as implementation mechanisms for programming languages.
  numeric_representation: Representation and computation with numeric formats, including
    binary notation, two's-complement representation, and floating-point numbers.
  object_oriented_programming: Introduction to the object-oriented programming paradigm
    in practical lectures.
  programming_languages_intro: Introductory concepts of programming languages, including
    what a language is and the role of programming languages.
  python_control_flow: Conditional statements and iteration constructs in Python.
  python_data_types: Basic Python data types and their use in solving problems.
  python_functions: Functions in the Python programming language.
  python_interpreter: The Python interpreter and its role in executing Python programs.
  python_programming_basics: Introduction to programming in Python.
  python_scientific_modules: Python modules for graphical, scientific, and numerical
    computation.
  python_tables: Tables as Python data structures or tabular data handled in Python
    programs.
  python_variables_expressions: Variables and expressions in Python programming.
  recursion: Recursion and recursive procedures in programming languages.
  sample_selection_correlation: Sample selection and correlation analysis for scientific
    data.
  scientific_data_formats: Analysis and browsing of scientific data catalogs using
    ASCII and FITS formats.
  scripting_languages: Scripting languages as tools for writing and executing small
    programs.
  spreadsheet_creation: Creating spreadsheets through programming as part of computational
    data handling.
  statistical_data_analysis: Statistical analysis of data as part of data understanding
    for data mining.
