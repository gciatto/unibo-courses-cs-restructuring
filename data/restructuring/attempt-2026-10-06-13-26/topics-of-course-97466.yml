analysis:
  mode: all-courses
source_clusters:
- id: 14
  name: Engineering Software Cultural (14)
course:
  id: '97466'
  name: Digital represention of the Landscape Project
topics:
  autocad_2d_drawing: Use of AutoCAD for two-dimensional landscape-design drawing,
    including the interface, units, layers, line types, properties, object snaps,
    grips, text, dimensions, blocks, and image insertion.
  digital_graphics: Introductory concepts of digital graphics as part of digital information
    processing.
  file_formats: File formats and their role in storing, exchanging, and archiving
    digital documents and data.
  graphic_library_management: Organization and maintenance of graphic and image libraries
    used for landscape-project representation.
  landscape_survey_representation: Methods and techniques for surveying and graphically
    representing urban, rural, and landscape contexts, including the digital translation
    of survey information into landscape design representations.
  layout_sheet_management: Organization and production of project layout sheets, including
    pagination, sequencing, headers, print layouts, sheet setup, and preparation of
    print files.
  raster_graphics: Raster graphics concepts including pixels, color space, image and
    device resolution, raster formats, compression, and practical use of Adobe Photoshop.
  vector_graphics: Vector graphics concepts including graphic primitives, drawing
    and modification tools, layers, line styles and weights, vector and raster formats,
    and graphic-layout preparation.
