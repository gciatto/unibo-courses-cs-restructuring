  name: Security Information Cryptography (0)
course:
  id: '93466'
  name: FONDAMENTI DI CYBERSECURITY
topics:
  authorization: Authorization as a cybersecurity mechanism for controlling access
    to resources or actions.
  block_ciphers: Block ciphers, including their secure use and attacks arising from
    incorrect use.
  digital_signatures: Digital signatures, including their use in email and certified
    email.
  one_time_pad: One-time-pad encryption as a secret-key cryptographic technique.
  patches_exploits: Security patching and exploitation of software vulnerabilities.
  penetration_testing: Authorized security testing that simulates attacks to identify
    exploitable weaknesses in computer systems and networks.
  pki: Public Key Infrastructure as a model and system for asymmetric key management.
  public_key_cryptography: Public-key cryptographic algorithms and their use.
  reverse_engineering: Reverse-engineering techniques for analyzing software or systems
    to understand their operation and security properties.
  sdr_radio_attacks: Software-defined radio and radio-based attacks against wireless
    communication systems.
  secret_key_cryptography: Secret-key cryptographic algorithms and their use.
  stream_ciphers: Stream ciphers, including their secure use and attacks arising from
    incorrect use.
  tor_dark_web: TOR-based communication and Dark Web environments, including their
    security characteristics and uses.
  vulnerability_assessment: Methods for identifying and assessing vulnerabilities
    in computer systems.
  wifi_network_security: Security mechanisms, threats, and attacks specific to Wi-Fi
    networks.
