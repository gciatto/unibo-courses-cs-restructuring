  name: Computing Education Informatics (5)
course:
  id: '90157'
  name: Open Science
topics:
  fair_open_data: FAIR principles and Open Data practices, including gathering, analyzing,
    modifying, and investigating open data with appropriate tools and techniques.
  open_access: Open Access principles and channels for making scholarly research outputs
    publicly available.
  open_infrastructures: Open infrastructures that support the development, sharing,
    and communication of Open Science projects.
  open_methodology: Open methodologies for documenting, conducting, and sharing research
    methods and experimental workflows.
  open_metrics: Open metrics for assessing and communicating the reach, use, and influence
    of research outputs.
  open_peer_review: Open peer-review principles and practices for conducting and communicating
    the evaluation of scientific work.
  open_science: Theoretical, historical, and social principles of the Open Science
    movement, including common practices for developing Open Science projects.
  open_source_software: Open Source Software principles and practices relevant to
    developing and sharing research software.
  reproducible_research: Reproducibility principles and practices for making research
    works and experiments repeatable and verifiable.
  semantic_publishing: Semantic Publishing technologies for communicating research
    results and representing scholarly information on the Web.
