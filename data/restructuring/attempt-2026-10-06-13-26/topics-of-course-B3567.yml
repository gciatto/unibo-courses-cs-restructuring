analysis:
  mode: all-courses
source_clusters:
- id: 1
  name: Informatics Principles Foundations (1)
course:
  id: B3567
  name: INTRODUCTION TO QUANTUM COMPUTING
topics:
  deutsch_bernstein_vazirani_algorithms: Deutsch and Bernstein-Vazirani algorithms
    presented through sample quantum circuits.
  grover_algorithm: Grover’s quantum search algorithm.
  quantum_circuits: Quantum computational models based on quantum circuits, including
    circuit construction and implementation.
  quantum_computational_complexity: Computational complexity concepts for quantum
    computation.
  quantum_computing_overview: Overview of quantum computing as an alternative computing
    paradigm.
  quantum_cryptography: Quantum cryptography and its associated quantum protocols.
  quantum_error_correction: Quantum error-correction methods.
  quantum_graphical_languages: Graphical languages for representing quantum circuits
    and quantum computations.
  quantum_linear_algebra: Linear algebra and complex Hilbert spaces as mathematical
    foundations for quantum computing.
  quantum_programming: Overview of programming quantum computations and implementing
    quantum algorithms.
  qubits: Qubits and their mathematical representation.
  shor_algorithm: Shor’s quantum algorithm.
  simon_algorithm: Simon’s quantum algorithm.
