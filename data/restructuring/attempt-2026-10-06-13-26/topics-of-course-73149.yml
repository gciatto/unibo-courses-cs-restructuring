analysis:
  mode: all-courses
source_clusters:
- id: 12
  name: Knowledge Engineering Extraction (12)
course:
  id: '73149'
  name: Logic for Informatics
topics:
  action_logic: Action logic for representing and reasoning about actions.
  automated_reasoning: Fundamental concepts and techniques for automated reasoning
    using logical representations.
  first_order_logic: Syntax and semantics of first-order logic, including predicates,
    terms, quantifiers, free and bound variables, alpha-conversion, substitution,
    and natural deduction.
  imperative_programming_constructs: Fundamental constructs of imperative programming
    introduced from logical and action-based concepts.
  information_theory_basics: Fundamental concepts of information and entropy.
  knowledge_representation: Knowledge-representation techniques used in the context
    of automated reasoning.
  modal_epistemic_logic: Modal and epistemic logic for representing modalities and
    knowledge.
  propositional_logic: Syntax, classical and intuitionistic semantics, and natural
    deduction for propositional logic, including soundness, compactness, and completeness
    theorems.
  syllogistic_logic: Syllogistic logic and its formal treatment alongside propositional
    and predicate logic.
  turing_machines: Turing machines as formal models for computation.
