analysis:
  mode: all-courses
source_clusters:
- id: 16
  name: Data Algorithms Structures (16)
course:
  id: '85301'
  name: Algorithms and Data Structures in Biology
topics:
  algorithm_design_analysis: Design and analysis of algorithms for solving programming
    problems.
  approximate_algorithms: Approximate algorithms for computational problems where
    exact solutions may be impractical.
  asymptotic_analysis: Discrete-mathematics notions for estimating the order of magnitude
    and computational cost of algorithms.
  computational_complexity: An introduction to computational complexity.
  divide_and_conquer: Divide-and-conquer as an algorithm design technique.
  dynamic_programming: Dynamic programming as an algorithm design technique.
  edit_distance: Dynamic-programming algorithms for computing edit distance between
    sequences.
  exhaustive_search: Exhaustive-search algorithms, including their application to
    computational tasks in biology.
  greedy_algorithms: Greedy methods as an algorithm design technique.
  iterative_recursive_models: Iterative and recursive computational models, including
    tail-recursion optimization.
  manhattan_distance: Dynamic-programming algorithms for computing Manhattan distance
    in grid-based problems.
  motif_finding: Algorithms for finding motifs in biological sequences.
  recursive_algorithms: Recursive algorithms and their use in algorithm design.
  restriction_mapping: Algorithms for solving restriction-mapping problems in computational
    biology.
  sorting_by_reversals: Greedy algorithms for sorting sequences by reversals.
