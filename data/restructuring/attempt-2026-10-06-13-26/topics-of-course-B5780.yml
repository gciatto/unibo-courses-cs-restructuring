  name: Informatica Computer Science (7)
course:
  id: B5780
  name: Computational Methods for Bioinformatics
topics:
  dictionaries: Dictionary data structures for storing and retrieving key-value associations.
  dynamic_programming: Dynamic programming as an algorithm design technique.
  linux_operating_systems: GNU/Linux operating-system concepts covered at an introductory
    level.
  object_oriented_programming: Introduction to the object-oriented programming paradigm
    in practical lectures.
  pairwise_sequence_alignment: Pairwise alignment of biomolecular sequences using
    local, global, and semiglobal alignment algorithms, including Python implementations.
  python_control_flow: Conditional statements and iteration constructs in Python.
  python_data_types: Basic Python data types and their use in solving problems.
  python_file_handling: Reading, creating, modifying, and storing files using Python
    programs.
  python_functions: Functions in the Python programming language.
  python_sequences: Sequences as data structures in Python.
  python_variables_expressions: Variables and expressions in Python programming.
  recursion: Recursion and recursive procedures in programming languages.
  sequence_alignment_heuristics: Heuristic algorithms for biomolecular sequence alignment
    and their theoretical basis.
