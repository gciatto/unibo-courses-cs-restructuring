analysis:
  mode: all-courses
source_clusters:
- id: 29
  name: Informatics Informatic Humanities (29)
course:
  id: '81676'
  name: Digital Forensic
topics:
  cloud_forensics: Digital-forensics investigations involving cloud environments and
    data.
  crime_incident_scene_processing: Processing crime and incident scenes in digital-forensics
    investigations.
  digital_forensic_testimony: Expert testimony in digital investigations.
  email_social_media_forensics: Investigations involving email and social media data.
  forensic_analysis_validation: Analysis and validation of digital-forensics findings.
  forensic_data_acquisition: Acquisition of digital data for forensic investigation
    from computers, tablets, smartphones, files, and other sources.
  forensic_evidence_handling: Chain of custody and procedures for conserving digital
    evidence during forensic investigations.
  forensic_expert_ethics: Ethical responsibilities and considerations for expert witnesses
    in digital investigations.
  forensic_file_systems: Analysis of Linux and Macintosh file systems for digital-forensics
    purposes.
  forensic_investigations: The digital-forensics profession and the procedures used
    in digital investigations.
  forensic_laboratory: The organization and functions of an investigator's office
    and digital-forensics laboratory.
  forensic_report_writing: Writing final reports for high-technology digital-forensics
    investigations.
  forensic_tools: Current tools used to conduct digital-forensics investigations.
  graphics_file_recovery: Recovery of graphics files during digital-forensics investigations.
  live_acquisition_forensics: Live acquisition techniques used in digital-forensics
    investigations.
  mobile_device_forensics: Digital-forensics investigations of mobile devices, including
    smartphones and tablets.
  network_forensics: Forensic investigation of wired and wireless networks.
  virtual_machine_forensics: Forensic investigation of virtual machines.
  windows_cli_forensics: Working with Windows and command-line systems in digital-forensics
    investigations.
