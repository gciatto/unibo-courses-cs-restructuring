source_clusters:
- id: 6
  name: Learning Machine Deep (6)
course:
  id: 91250-A
  name: Deep Learning
topics:
  adversarial_examples: Techniques for fooling neural networks through adversarial
    inputs.
  backpropagation: Backpropagation as the typical training algorithm for deep neural
    networks.
  cnn_architectures: Convolutional neural-network architectures for computer vision,
    including ResNeXt and grouped convolutions, MobileNets, EfficientNet, RegNet,
    AlexNet, VGG, Inception, and ResNet.
  diffusion_models: Modern generative diffusion models and their use in deep-learning
    applications.
  feedforward_neural_networks: Feedforward neural-network architectures as a basic
    type of neural network.
  neural_network_visualization: Techniques for visualizing and interpreting hidden
    neural units, including deep dreams and inceptionism.
  neural_networks_deep_learning: Introduction to neural networks and deep learning,
    including their applications.
  recurrent_neural_networks: Recurrent neural networks.
  reinforcement_learning: Reinforcement-learning methods.
  supervised_unsupervised_learning: Supervised and unsupervised machine-learning approaches.
