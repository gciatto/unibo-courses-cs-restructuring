analysis:
  mode: all-courses
source_clusters:
- id: 1
  name: Informatics Principles Foundations (1)
course:
  id: '60348'
  name: Informatics
topics:
  algorithmic_problem_solving: Algorithmic approaches to solving problems with computers
    using the imperative programming paradigm.
  algorithms_programming_basics: Basic principles of algorithms and programming.
  computational_complexity: An introduction to computational complexity.
  computer_hardware_architecture: Fundamental organization of computer hardware systems.
  computer_networks: Basic computer-network concepts.
  computer_operation_principles: General principles governing the operation of computers
    and the relationship between hardware and software.
  computer_performance: Measurement of computer performance.
  internet_applications: Prominent Internet applications including email, news, chat,
    and the World Wide Web.
  internet_www: The Internet and World Wide Web.
  it_security: Basic IT security issues, including personal-data and file protection,
    viruses, and phishing.
  memory_devices: Memory devices as components of computer architecture.
  processor_memory_io: Basic elements of processors, memories, and input/output interfaces
    in digital systems.
  r_data_types: Data types in the R programming language.
  r_functions: Procedures and functions implemented and used in the R programming
    language.
  r_programming_basics: Introduction to programming with the R language, including
    translating algorithms into R programs and implementing programs in laboratory
    exercises.
  r_random_values: Generation and use of random values in R.
  r_structured_programming: Structured programming constructs in R, including sequence,
    iteration, and choice.
  sequence_control: Sequence control constructs in programming languages.
  software_operating_systems: The software structure of a computer, including operating
    systems and application programs.
  software_testing: Testing activities for software systems.
  structured_programming: Structured programming using imperative programming constructs.
