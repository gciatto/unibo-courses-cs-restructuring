  web_mobile_development_frameworks_tools: Frameworks, platforms, and development
    tools used to create Web and mobile sites and applications.
  web_multilayer_architecture: Multi-layer Web architectures with horizontal and vertical
    distribution, separation of business logic, and component-container models.
  web_of_things: Introductory Web of Things concepts for connecting and interacting
    with Internet of Things devices through Web technologies.
  web_scraping: Using programs to retrieve and process data from websites.
  web_servers: Web servers and their role in providing services and content for e-commerce
    platforms.
  web_services: Development of back ends based on Web services.
  web_standards: Web standardization organizations and processes governing World Wide
    Web technologies.
  web_state_sessions: Personalization, state management, sessions, and conversations
    in dynamic Web applications.
  web_usability_ux: Design and verification of Web usability and user experience,
    including correctness and universal accessibility.
  web_vulnerability_exploitation: Exploitation of vulnerabilities in web applications,
    including cross-site scripting, path traversal, and code injection.
  webml_modeling: WebML models for Web applications, including data, hypertext, and
    content-management models and their use in hypertext design and implementation.
  weka_data_mining: Practical data-mining work using the Weka software.
  wifi_network_security: Security mechanisms, threats, and attacks specific to Wi-Fi
    networks.
  windows_cli_forensics: Working with Windows and command-line systems in digital-forensics
    investigations.
  windows_linux_integration: Integration and interaction between Windows and Linux
    systems using relevant protocols and application approaches.
  windows_os_file_management: Windows operating-system organization, file-system hierarchy,
    file-manager use, and system utilities.
  wireless_access_standards: Overview of IEEE 802.16 and IEEE 802.20 wireless communication
    technologies.
  wireless_link_budget: Radio communication system design involving antennas, link
    budgets, and decibel calculations.
  wireless_networking: Wireless networking and its relationship to Internet communication.
  wireless_propagation_fading: Propagation and fading models used to characterize
    wireless communication systems.
  word_association_measures: Concordances, collocations, and statistical measures
    of association between words in corpora.
  word_embeddings: Vector representations of words, including word vectors and learned
    word embeddings for capturing semantic relationships.
  word_processing: Editing and formatting professional documents with tables, headers,
    notes, images, PDF/PDF-A export, printing, and archiving.
  word_sense_disambiguation: Methods for determining the intended sense of an ambiguous
    word in context.
  wordnet_framenet: Use of WordNet and FrameNet for representing lexical-semantic
    information.
  xml_java_parsing: Processing XML in Java with DOM and SAX parser models.
  xml_schema_validation: XML information typing and validation using DTDs and XML
    Schema.
  xml_transformations: XML transformation with XSL and XSLT.
  yacc: The YACC parser-generation tool.
  zephyr: The Zephyr real-time operating system.
  zero_approximation: Numerical methods for finding zeros of nonlinear equations,
    including bisection, Newton-Raphson, secant, and Regula Falsi methods.
  zero_trust_security: Zero Trust as a modern cybersecurity approach.
  zigbee: ZigBee features, architecture, and network topologies.
