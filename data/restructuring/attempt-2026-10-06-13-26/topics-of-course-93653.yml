analysis:
  mode: all-courses
source_clusters:
- id: 2
  name: Big Data Cloud (2)
course:
  id: '93653'
  name: Iot And Big Data For Smart Agricultural Systems
topics:
  agricultural_iot_data_transfer: Data-transfer technologies used to connect and communicate
    with Internet of Things devices in open-field agricultural settings.
  ai_ml_for_big_data: Introductory Artificial Intelligence and Machine Learning concepts
    and tools considered in relation to Big Data and agricultural applications.
  big_data_management: Introductory approaches and technologies for managing big data
    as alternatives or complements to relational databases.
  binary_encoding: Binary encoding of information.
  cloud_computing: Introduction to cloud computing in the context of distributed and
    service-oriented programming.
  computer_hardware_architecture: Fundamental organization of computer hardware systems.
  data_analytics: Data analysis and elaboration methods applied to datasets in the
    course laboratory work.
  data_visualization: Infographic communication techniques and principles for visualizing
    data.
  edge_fog_computing: Edge and fog computing for sensor-edge-cloud integration, distributed
    control and intelligence, offloading, proactive approaches, mobility prediction,
    and orchestration in mobile and industrial environments.
  iot_architectures_platforms: Basic architectures and platforms for Internet of Things
    systems.
  iot_devices_sensors: Internet of Things things, including sensors, actuators, and
    complex devices, with examples such as Raspberry Pi and Arduino platforms.
  parallel_computing_big_data: Introduction to parallel computing as an approach for
    processing Big Data.
  smart_agriculture_iot_applications: Internet of Things and Big Data applications
    for smart agriculture, including monitoring soil properties, weather conditions,
    and crops, and designing practical applications for arboriculture and extensive
    culture.
  smart_sensors: Operating principles and characteristics of smart sensors for collecting
    data in Internet of Things applications.
