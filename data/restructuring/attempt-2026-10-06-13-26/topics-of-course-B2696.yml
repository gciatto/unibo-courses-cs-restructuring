analysis:
  mode: all-courses
source_clusters:
- id: 20
  name: Language Natural Processing (20)
course:
  id: B2696
  name: 'Language, Technology, Research I: Computational Thinking'
topics:
  algorithmic_problem_solving: Algorithmic approaches to solving problems with computers
    using the imperative programming paradigm.
  basic_programming_operations: Basic operations used when writing and executing introductory
    programs and scripts.
  computational_abstraction: Abstraction as a central computational-thinking tool
    for simplifying and representing problems.
  computational_thinking: Computational thinking as an approach to formulating and
    solving problems with computers.
  data_types: Basic types of data used in computational problem solving and programming.
  fundamental_data_structures: Introductory fundamental data structures considered
    alongside algorithms and programming.
  jupyter_notebooks: Using Jupyter Notebook as an interactive environment for developing
    and executing Python code.
  numerical_data_processing: Processing numerical data with scripts and core programming
    libraries.
  pattern_recognition: Pattern recognition as a computational-thinking method for
    identifying similarities and regularities in problems and data.
  problem_decomposition: Problem-solving through decomposition into smaller subproblems.
  programming_classes: Classes as introductory programming constructs for organizing
    data and behavior.
  programming_languages_intro: Introductory concepts of programming languages, including
    what a language is and the role of programming languages.
  programming_methods: Methods as reusable units of behavior in introductory programming.
  scripting_languages: Scripting languages as tools for writing and executing small
    programs.
  text_processing: Processing textual data with scripts and core programming libraries.
