analysis:
  mode: all-courses
source_clusters:
- id: 21
  name: Artificial Intelligence Fundamentals (21)
course:
  id: B0069
  name: Artificial Intelligence for Digital Innovation
topics:
  ai_epistemology_ethics: Philosophical, epistemological, and ethical issues concerning
    artificial intelligence and cognitive science.
  ai_introduction: Introduction to artificial intelligence, including its history,
    main application fields, and core principles and methods.
  ai_safety_alignment: Open problems in autonomous and intelligent systems concerning
    safety, value alignment, super-intelligence, controllability, and self-awareness.
  ai_search_strategies: Search-based problem solving in artificial intelligence using
    informed and uninformed search strategies.
  automated_reasoning: Fundamental concepts and techniques for automated reasoning
    using logical representations.
  constraint_satisfaction: Constraint satisfaction problems as a class of artificial-intelligence
    problem-solving tasks.
  generative_ai_models: Generative artificial-intelligence models used as statistical
    methods for extracting knowledge from content.
  intelligent_agents: Agents as entities that perceive, reason, and act to exhibit
    intelligent behavior.
  knowledge_representation: Knowledge-representation techniques used in the context
    of automated reasoning.
  language_models: Language models used in text-mining and language-processing workflows.
  machine_learning_basics: Basic machine-learning algorithms and methods used to develop
    intelligent applications.
  neural_networks_deep_learning: Introduction to neural networks and deep learning,
    including their applications.
  nlp_basics: Fundamentals of natural language processing, including introductory
    methods for analyzing and processing text.
  reinforcement_learning: Reinforcement-learning methods.
  supervised_unsupervised_learning: Supervised and unsupervised machine-learning approaches.
