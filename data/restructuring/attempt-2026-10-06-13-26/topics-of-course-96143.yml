analysis:
  mode: all-courses
source_clusters:
- id: 2
  name: Big Data Cloud (2)
course:
  id: '96143'
  name: Methods and Models for Data Analytics M
topics:
  algorithm_selection_configuration: Automatic selection and configuration of algorithms
    for data-analytics and artificial-intelligence methods.
  association_rules: Association-rule mining.
  clustering: Clustering techniques for data mining.
  constraint_programming: Constraint-programming methods, including global constraints,
    search strategies, and applications.
  data_acquisition_processing: Data acquisition and processing in CRISP-DM workflows
    applied to real datasets and use cases.
  data_analytics: Data analysis and elaboration methods applied to datasets in the
    course laboratory work.
  data_mining_overview: General concepts, application scenarios, and supervised and
    unsupervised techniques in data mining.
  data_mining_validation: Understanding and validating data-mining results.
  data_quality_preprocessing: Data-quality assessment and preprocessing operations
    for data mining.
  data_types_for_mining: Features and handling considerations of different data types
    in data-mining tasks.
  data_visualization: Infographic communication techniques and principles for visualizing
    data.
  decision_tree_classification: Classification using decision-tree models.
  model_evaluation: Evaluation methods for language and machine-learning models.
  neural_networks: Neural networks as a technique and current technical issue in artificial
    intelligence.
  neural_networks_deep_learning: Introduction to neural networks and deep learning,
    including their applications.
  outlier_detection: Detection of outliers in data-mining datasets.
  predictive_maintenance: Predictive-maintenance methods addressed as an artificial-intelligence
    application.
  prescriptive_maintenance: Prescriptive-maintenance methods addressed as an artificial-intelligence
    application.
  statistical_data_analysis: Statistical analysis of data as part of data understanding
    for data mining.
  sustainable_information_technologies: Sustainable information technologies and data-driven
    knowledge infrastructures considered in relation to social, economic, political,
    and United Nations Sustainable Development Goals.
  time_series_analysis: Analysis of time-series data as a method used within digital
    intelligence.
