course:
  id: '95638'
  name: Operational Analytics
topics:
  boosting_ensemble_learning: Boosting as an ensemble-learning method, introduced
    for object-detection applications.
  combinatorial_optimization: Combinatorial optimization methods for industrial decision
    problems.
  data_analytics_types: Types of data analytics, including diagnostic, predictive,
    and prescriptive analytics, and their enabling techniques.
  decision_tree_classification: Classification using decision-tree models.
  descriptive_statistics: Univariate and bivariate descriptive statistics for summarizing
    biomedical and clinical data.
  feedforward_neural_networks: Feedforward neural-network architectures as a basic
    type of neural network.
  integer_linear_programming: Integer Linear Programming for modeling and solving
    combinatorial decision and optimization problems.
  lstm_networks: Long Short-Term Memory (LSTM) recurrent neural networks.
  metaheuristic_search: Metaheuristic methods for guiding search in artificial-intelligence
    problem solving.
  operational_performance_indicators: Performance indicators for monitoring and assessing
    business-process and operational performance.
  probability_distributions: Probability distributions used to represent and reason
    about random quantities in computational programs.
  random_forest_classification: Random-forest ensemble methods for classification.
  statistical_tests: Statistical tests used in data analysis to identify important
    variables.
  time_series_analysis: Analysis of time-series data as a method used within digital
    intelligence.
  time_series_forecasting: Time-series forecasting using statistical methods.
