analysis:
  mode: all-courses
source_clusters:
- id: 13
  name: Web Technologies Web-Related (13)
course:
  id: '88566'
  name: Web Technology
topics:
  character_encodings: Character encodings used to represent text in web documents
    and communications.
  client_side_frameworks: Introduction to client-side Web frameworks, including Vue,
    React, and Angular.
  client_side_web_programming: Client-side Web programming using JavaScript and Ajax.
  http_protocols: HTTP protocols used in distributed-system and network communication.
  http_uris: The HTTP protocol and Uniform Resource Identifiers as primary elements
    of the original Web model.
  json: JSON as a data representation format used in web technologies.
  nodejs_web_development: Server-side web application development using Node.js.
  ontology_modeling_owl: Knowledge representation with ontologies and the OWL ontology
    language.
  rdf_rdfs: RDF and RDFS for representing metadata and structured knowledge on the
    Web.
  server_side_php: Server-side web application development using PHP.
  server_side_python: Server-side web application development using Python.
  sparql_querying: Querying RDF and knowledge graphs with SPARQL, including use of
    the DBpedia knowledge graph.
  web_markup_languages: Web markup and styling languages including XHTML, XML, HTML5,
    and CSS.
  web_standards: Web standardization organizations and processes governing World Wide
    Web technologies.
  web_usability_ux: Design and verification of Web usability and user experience,
    including correctness and universal accessibility.
