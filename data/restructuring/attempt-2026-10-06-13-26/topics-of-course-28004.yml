analysis:
  mode: all-courses
source_clusters:
- id: 1
  name: Informatics Principles Foundations (1)
course:
  id: '28004'
  name: Foundations of Informatics T-1
topics:
  algorithmic_problem_solving: Algorithmic approaches to solving problems with computers
    using the imperative programming paradigm.
  algorithms_programming_basics: Basic principles of algorithms and programming.
  compilers: Compilers as implementation mechanisms for programming languages.
  computer_hardware_architecture: Fundamental organization of computer hardware systems.
  inheritance: Inheritance in object-oriented programming.
  interpreters: Interpreters as implementation mechanisms for programming languages.
  java_data_structures: Implementation and use of data structures in Java.
  java_oop: Introduction to object-oriented programming in Java.
  java_programming_basics: Fundamental features and constructs of the Java programming
    language.
  language_evolution: The evolution of programming languages from assembly languages
    to higher-level languages.
  language_semantics: The semantics of programming languages as part of their formal
    description.
  language_syntax: The syntax of programming languages as part of their formal description.
  memory_devices: Memory devices as components of computer architecture.
  modular_programming: Modular programming methodologies for organizing programs into
    separate modules.
  recursion: Recursion and recursive procedures in programming languages.
  software_lifecycle: Phases and activities in the lifecycle of software systems,
    including planning, requirements analysis, and design.
  software_operating_systems: The software structure of a computer, including operating
    systems and application programs.
  structured_programming: Structured programming using imperative programming constructs.
  von_neumann_architecture: The organization and operating principles of the Von Neumann
    computer architecture.
