analysis:
  mode: all-courses
source_clusters:
- id: 7
  name: Informatica Computer Science (7)
course:
  id: B0064
  name: Introduction to Data Science and Computational Thinking
topics:
  algorithmic_problem_solving: Algorithmic approaches to solving problems with computers
    using the imperative programming paradigm.
  algorithms_programming_basics: Basic principles of algorithms and programming.
  computational_thinking: Computational thinking as an approach to formulating and
    solving problems with computers.
  digital_transformation_concepts: The concept of digital transformation and the role
    of computational tools and text processing in transformation processes.
  fundamental_data_structures: Introductory fundamental data structures considered
    alongside algorithms and programming.
  program_execution_model: The model by which computer programs are executed.
  programming_languages_intro: Introductory concepts of programming languages, including
    what a language is and the role of programming languages.
  python_data_structures: Data structures used in Python programming, as introduced
    alongside Python data types, control flow, functions, and libraries.
  python_programming_basics: Introduction to programming in Python.
  python_text_processing: Manipulation and automated processing of text, including
    string operations and creation of text documents in Python.
  software_evaluation: Evaluation of software systems.
  software_production: Production activities in software engineering.
  software_testing: Testing activities for software systems.
