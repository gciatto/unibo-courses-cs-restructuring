analysis:
  mode: all-courses
source_clusters:
- id: 26
  name: Programming Software Design (26)
course:
  id: '72671'
  name: Complements of Programming Languages
topics:
  antlr_framework: Using the ANTLR framework to build language tools, including lexical
    and syntactical analysis components.
  code_transformation: Transformation of source code as a programming-language implementation
    technique.
  compilers: Compilers as implementation mechanisms for programming languages.
  intermediate_code_generation: Generation of intermediate code for standard and advanced
    programming-language features.
  interpreters: Interpreters as implementation mechanisms for programming languages.
  lexical_analysis: Design of lexical analysers for programming languages.
  static_analysis: Static analysis of program correctness properties and resource
    or asset consumption without executing the program.
  symbol_tables: Symbol tables used during semantic analysis of programs.
  syntax_analysis: Syntactic analysis of programs, including parsing techniques used
    in compiler construction.
  types_and_type_checking: Types and type-checking mechanisms in programming languages.
  virtual_machines: Structure and implementation of virtual machines.
