analysis:
  mode: all-courses
source_clusters:
- id: 15
  name: Network Networks Programming (15)
course:
  id: '95604'
  name: Operating Systems and Networks
topics:
  computer_hardware_architecture: Fundamental organization of computer hardware systems.
  internet_routing: Routing mechanisms and organization used to move packets through
    the Internet.
  internet_security_privacy: Introductory security and privacy considerations in Internet
    communication.
  internetworking_fundamentals: Fundamentals and organization of internetworks, including
    the structure of the Internet and communication across LAN, WAN, and MAN environments.
  io_management: Operating-system management of input and output operations and devices.
  network_architecture: Hardware and software architectures for computer networks.
  network_protocols: Introduction to protocols used in computer networks.
  network_qos: Quality-of-service mechanisms and requirements in computer networks.
  os_introduction_history: The role, structure, objectives, and resource-management
    functions of operating systems as execution environments for programs.
  os_memory_management: Memory-management concepts and techniques in operating systems.
  physical_layer_transmission: Physical-layer transmission media, signals, and transmission
    fundamentals.
  processes_threads: Operating-system processes and threads, including their organization
    and execution.
