source_clusters:
- id: 27
  name: Architectures Computer Architetture (27)
course:
  id: B8563
  name: SISTEMI DI ELABORAZIONE ACCELERATA M
topics:
  concurrent_programming: The concurrent programming paradigm.
  cuda_architecture_memory: CUDA processor architecture and memory hierarchy as used
    for GPU programming.
  cuda_programming: CUDA programming for machine-learning workloads, including threads,
    thread groups, grids, synchronization primitives, and shared memory.
  fixed_point_representation: Fixed-point numeric representation and computations.
  fpga_computing: Field-Programmable Gate Arrays (FPGAs) as emerging reconfigurable-computing
    technologies for accelerated computation.
  gpu_programming: Programming general-purpose graphics processing units (GPGPUs).
  hpc_architectures: High-performance computing architectures, including Flynn taxonomy,
    shared-memory and distributed-memory architectures, and GPGPU systems.
  multicore_architectures: Multicore processor architectures and their organization.
  numeric_representation: Representation and computation with numeric formats, including
    binary notation, two's-complement representation, and floating-point numbers.
  parallel_computation_models: Models of parallel computation used to describe and
    organize parallel algorithms.
  simd_vectorization: SIMD principles and programming for vectorized computation,
    including compiler intrinsics and compiler auto-vectorization.
