analysis:
  mode: all-courses
source_clusters:
- id: 4
  name: Internet Things Systems (4)
course:
  id: '77780'
  name: Embedded Systems Programming and Internet of Things
topics:
  arduino_programming: Programming the Arduino UNO microcontroller platform using
    introductory C++ and the Wiring framework.
  augmented_reality: Introductory overview of augmented reality.
  digital_twins: Digital-twin concepts in simulation.
  embedded_networks: Networks of embedded systems, including their models, architectures,
    communication protocols, and wireless technologies.
  embedded_systems_intro: Introduction to embedded systems, including microcontrollers,
    systems-on-chip, sensors, actuators, and related electronics.
  embedded_tasks: Tasks as units of execution in embedded-software programming models.
  esp32_freertos: Programming the ESP32 system-on-chip and Internet of Things platform
    with the FreeRTOS real-time operating system.
  event_driven_architecture: Event-driven computational models and architectures for
    distributed proactive-reactive applications.
  finite_state_machines: Finite state machine models for representing sequential systems.
  internet_of_things: Design and development of applications combining high-level
    software or AI capabilities with connected Internet of Things devices.
  iot_architectures_platforms: Basic architectures and platforms for Internet of Things
    systems.
  iot_devices_sensors: Internet of Things things, including sensors, actuators, and
    complex devices, with examples such as Raspberry Pi and Arduino platforms.
  message_passing: Concurrent message-passing models based on synchronous and asynchronous
    communication.
  mobile_system_integration: Integration of embedded and Internet of Things systems
    with mobile systems and mobile application programming.
  real_time_systems: Main design issues, implementation strategies, supporting environments,
    performance evaluation, and application domains of real-time systems.
  rtos_architectures: Embedded-system architectures based on real-time operating systems.
  super_loop_architecture: The super-loop programming model for embedded systems.
  web_of_things: Introductory Web of Things concepts for connecting and interacting
    with Internet of Things devices through Web technologies.
  wireless_networking: Wireless networking and its relationship to Internet communication.
