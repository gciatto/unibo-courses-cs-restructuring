course:
  id: B8905
  name: Foundations of Programming
topics:
  object_oriented_programming: Introduction to the object-oriented programming paradigm
    in practical lectures.
  programming_classes: Classes as introductory programming constructs for organizing
    data and behavior.
  python_animation: Creating basic animations with Python programs and turtle-based
    graphics.
  python_control_flow: Conditional statements and iteration constructs in Python.
  python_data_structures: Data structures used in Python programming, as introduced
    alongside Python data types, control flow, functions, and libraries.
  python_data_types: Basic Python data types and their use in solving problems.
  python_file_handling: Reading, creating, modifying, and storing files using Python
    programs.
  python_functions: Functions in the Python programming language.
  python_input_output: Interactive input and output in Python programs, including
    the input() function and type-conversion functions.
  python_modules_packages: Python modules, standard-library components, and packages.
  python_programming_basics: Introduction to programming in Python.
  python_sequences: Sequences as data structures in Python.
  python_text_processing: Manipulation and automated processing of text, including
    string operations and creation of text documents in Python.
  python_turtle_graphics: Using Python turtle modules to draw basic geometric shapes.
  python_variables_expressions: Variables and expressions in Python programming.
