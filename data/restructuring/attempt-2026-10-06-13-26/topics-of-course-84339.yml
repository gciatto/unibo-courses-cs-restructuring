analysis:
  mode: all-courses
source_clusters:
- id: 8
  name: Databases Database Systems (8)
course:
  id: '84339'
  name: Advanced Database Systems
topics:
  active_database_programming: Database programming and active-database concepts for
    relational database management systems.
  database_administration: Administration activities for relational database management
    systems.
  database_provisioning_optimization: Provisioning and resource optimization for relational
    database management systems.
  mongodb_laboratory: Laboratory exercises using MongoDB to practice NoSQL database
    design and management.
  nosql_architecture_sharding: NoSQL DBMS architectures involving clusters, sharding,
    and persistence.
  nosql_data_design: Data-design techniques for NoSQL database management systems.
  nosql_data_models: Design and use of non-relational data models, including document-based,
    graph-based, and column-oriented models.
  nosql_databases: Introductory architectures and non-relational data models of NoSQL
    systems.
