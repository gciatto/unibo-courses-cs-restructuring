analysis:
  mode: all-courses
source_clusters:
- id: 5
  name: Computing Education Informatics (5)
course:
  id: 29227-B
  name: Foundations of Informatics T
topics:
  conditionals_and_iteration: Conditional statements and iteration constructs in C++.
  cpp_arrays: Arrays in the C++ programming language.
  cpp_build_tools: C++ header files, conditional inclusion, compilation of multiple
    source files, and Makefiles.
  cpp_classes: Classes in the C++ programming language.
  cpp_functions: Functions in C++.
  cpp_pointers: Pointers and addresses in C++, including pointer arithmetic, pointer-based
    function arguments, pointer arrays, pointers to pointers, multidimensional arrays,
    command-line arguments, function pointers, and void pointers.
  cpp_variables_operators: Variables and operators in the C++ programming language.
  derivative_approximation: Elementary numerical methods for approximating derivatives.
  environment_scoping: Programming-language environments, scoping rules, and their
    implementation.
  finite_difference_methods: Finite-difference approximations of first, second, and
    higher derivatives using forward, backward, and centered differences, including
    truncation error and application to a second-order ODE.
  function_approximation: Elementary numerical methods for approximating functions.
  integral_approximation: Elementary numerical methods for approximating integrals.
  linux_operating_systems: GNU/Linux operating-system concepts covered at an introductory
    level.
  memory_allocation: Memory allocation in C++.
  modular_programming: Modular programming methodologies for organizing programs into
    separate modules.
  numerical_algorithms: Algorithms for numerical computation, as practiced through
    well-known numerical computation exercises.
  numerical_error_analysis: Absolute, relative, and percentage errors; numerical cancellation;
    error propagation; machine precision; and significant digits in numerical computation.
  operating_systems_filesystems: Operating-system structure and main functions, together
    with basic file-system operations.
  overloading: Overloading in C++.
  parameter_passing_modes: Parameter-passing mechanisms including by value, by reference,
    by result, and by name.
  shell_scripting: Shell use and shell scripting for interacting with and administering
    operating systems.
  zero_approximation: Numerical methods for finding zeros of nonlinear equations,
    including bisection, Newton-Raphson, secant, and Regula Falsi methods.
