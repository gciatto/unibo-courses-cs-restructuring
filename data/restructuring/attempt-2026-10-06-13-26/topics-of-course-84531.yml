analysis:
  mode: all-courses
source_clusters:
- id: 2
  name: Big Data Cloud (2)
course:
  id: '84531'
  name: Infrastructures For Cloud Computing and Big Data M
topics:
  cap_theorem: The CAP theorem in the context of non-relational and Big Data database
    management systems.
  client_server_model: Client/server interaction and the design of small client/server
    applications.
  cloud_computing: Introduction to cloud computing in the context of distributed and
    service-oriented programming.
  cloud_infrastructure_models: Data-center, multicloud, and federated-resource infrastructure
    models supporting large distributed and cloud systems, including cloud internals
    and organizational patterns.
  distributed_communication: Communication mechanisms and concepts for distributed
    systems.
  distributed_consistency: Consistency degrees and their effects on service properties
    in distributed systems, including BASE and CAP considerations.
  distributed_systems: Fundamental concepts of distributed systems.
  group_communication: Communication models, protocols, and algorithms for groups
    and many-to-many communication, including multicast.
  iaas_paas: Cloud service models including Infrastructure as a Service (IaaS), Platform
    as a Service (PaaS), and Software as a Service (SaaS).
  mapreduce: The MapReduce programming paradigm, including its principles, limitations,
    algorithm design, and application to non-trivial problems.
  message_oriented_middleware: Distributed programming using message-oriented middleware,
    including RabbitMQ.
  message_passing: Concurrent message-passing models based on synchronous and asynchronous
    communication.
  nosql_data_models: Design and use of non-relational data models, including document-based,
    graph-based, and column-oriented models.
  online_stream_processing: Introductory high-performance online stream processing
    of big data over clustered distributed systems.
  parallel_computation_models: Models of parallel computation used to describe and
    organize parallel algorithms.
  qos_distributed_systems: Systems and protocols for providing quality of service
    in large distributed and cloud systems.
  replication_strategies: Replication models, strategies, and protocols for distributed
    and cloud systems.
  scalability_distributed_systems: Scalability considerations in distributed systems.
  spark: The Apache Spark system, including its architecture, data structures, data
    partitioning, shuffling, and computation optimization.
