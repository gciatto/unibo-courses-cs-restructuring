analysis:
  mode: all-courses
source_clusters:
- id: 21
  name: Artificial Intelligence Fundamentals (21)
course:
  id: '92858'
  name: Autonomous and Adaptive Systems M
topics:
  agent_autonomy: Autonomy as a defining concept of agents in multi-agent systems.
  agentic_ai_systems: Agentic artificial-intelligence systems that autonomously select
    and execute actions.
  ai_epistemology_ethics: Philosophical, epistemological, and ethical issues concerning
    artificial intelligence and cognitive science.
  ai_safety_alignment: Open problems in autonomous and intelligent systems concerning
    safety, value alignment, super-intelligence, controllability, and self-awareness.
  algorithmic_game_theory: Algorithmic game-theory concepts applied to multi-agent
    learning systems.
  bio_inspired_adaptive_systems: Bio-inspired approaches to designing adaptive systems.
  direct_preference_optimization: Direct Preference Optimization for training models
    from preference data without a separate reinforcement-learning optimization loop.
  function_approximation_reinforcement_learning: Function-approximation methods for
    reinforcement learning when value functions or policies cannot be represented
    with tables.
  generative_learning_creativity: Generative learning methods and the use of artificial
    intelligence for computational creativity.
  intelligent_agents: Agents as entities that perceive, reason, and act to exhibit
    intelligent behavior.
  large_language_models: Generative large language models.
  llm_agent_design: Design of agents based on large language models or other foundation
    models.
  monte_carlo_reinforcement_learning: Monte Carlo methods for estimating returns and
    learning in reinforcement-learning systems.
  multi_agent_coordination: Coordination mechanisms and issues for coordinating multiple
    agents.
  multi_agent_reinforcement_learning: Multi-Agent Reinforcement Learning in systems
    of interacting learning agents.
  multi_armed_bandits: Multi-armed bandit problems as an introductory reinforcement-learning
    setting.
  policy_based_reinforcement_learning: Policy-based methods for reinforcement learning
    that learn or optimize action-selection policies.
  reinforcement_learning: Reinforcement-learning methods.
  reinforcement_learning_applications: Applications of reinforcement learning to games,
    classical control problems, and robotics.
  rlhf: Reinforcement Learning from Human Feedback for training and aligning intelligent
    or generative systems.
  social_dilemmas: Social-dilemma scenarios in multi-agent learning, including tensions
    between individual and collective outcomes.
  tabular_reinforcement_learning: Tabular reinforcement-learning methods for learning
    value functions or policies over discrete states and actions.
