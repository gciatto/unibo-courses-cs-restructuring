analysis:
  mode: all-courses
source_clusters:
- id: 25
  name: Administration Systems System (25)
course:
  id: '73435'
  name: Project Management
topics:
  agile_software_development: Agile software-development principles and practices.
  ict_project_management: Project-management practices for information and communication
    technology projects.
  project_communications_management: Planning and management of communications among
    project participants and stakeholders.
  project_cost_management: Management of project costs within project planning and
    control.
  project_integration_management: Integration management for coordinating project
    elements and management activities.
  project_process_groups: Project-management process groups covering scoping, planning,
    launching or executing, monitoring and controlling, and closing.
  project_procurement_management: Management of procurement activities within projects.
  project_program_portfolio: Definitions and relationships among projects, programs,
    and portfolios in project-management contexts.
  project_quality_management: Management of quality as a project objective and its
    relationship to scope and resources.
  project_resource_management: Management of project resources, including their relationship
    to scope and quality.
  project_risk_management: Identification and management of risks in projects.
  project_scope_management: Management of project scope, including scope definition
    and the scoping process group.
  project_stakeholder_management: Identification and management of project stakeholders.
  project_time_management: Management of project time and schedules within project
    planning and control.
  scope_statement: Definition of project scope statements for information-system initiatives.
  software_lifecycle: Phases and activities in the lifecycle of software systems,
    including planning, requirements analysis, and design.
  software_production: Production activities in software engineering.
