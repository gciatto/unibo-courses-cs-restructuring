analysis:
  mode: all-courses
source_clusters:
- id: 8
  name: Databases Database Systems (8)
course:
  id: '90107'
  name: BASI DI DATI
topics:
  conceptual_database_design: Requirements analysis and conceptual database design
    for relational databases.
  database_architectures: Architectural organization of database systems, including
    client-server relational systems and introductory distributed and cloud database
    systems.
  database_storage_structures: Secondary-memory data structures and management algorithms,
    including sequential and direct access organizations, primary and secondary indexes,
    and B-tree, B*-tree, and B+tree structures.
  database_transactions: Database transactions, including ACID properties, concurrency
    management, and transaction protocols.
  entity_relationship_model: Entity-Relationship modeling for representing data and
    relationships in database design.
  logical_database_design: Logical database design for relational databases.
  relational_algebra: Basic and derived operators of relational algebra.
  relational_calculus: Relational calculus as a formal query language for expressing
    database queries over the relational data model.
  relational_model: Structure and principles of the relational data model.
  sql_queries: Databases and the formulation and use of SQL queries.
