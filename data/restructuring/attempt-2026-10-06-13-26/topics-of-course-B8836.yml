  name: Knowledge Engineering Extraction (12)
course:
  id: B8836
  name: Universal Semantics
topics:
  cognitive_science: Classical and contemporary cognitive science in relation to artificial
    intelligence.
  conceptual_blending: Conceptual blending as a framework for analyzing how meaning
    is constructed by integrating elements from different conceptual domains.
  multimodal_semantic_interpretation: Formal, ontological, and computational interpretation
    of meaning in multimodal data and content.
  pattern_recognition: Pattern recognition as a computational-thinking method for
    identifying similarities and regularities in problems and data.
  perspectivization: Perspectivization as the construction and interpretation of meaning
    from particular viewpoints across languages, modalities, cultures, and practices.
  semantic_universals: Semantic universals investigated across languages, modalities,
    cultures, practices, and neurocognitive systems.
  semiotics_signs: Fundamentals of semiotics and the sign as applied to communication.
  theory_of_mind: Theory of mind as a phenomenon relevant to interpreting meaning-making
    in social and cognitive environments.
