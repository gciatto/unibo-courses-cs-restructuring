analysis:
  mode: all-courses
source_clusters:
- id: 2
  name: Big Data Cloud (2)
course:
  id: '98671'
  name: Business Analytics
topics:
  bi_report_sharing: Techniques for sharing Business Intelligence and Business Analytics
    reports.
  bi_reporting: Reporting as a business-intelligence technique for analyzing enterprise
    data.
  business_data_modeling: Data-modeling techniques for organizing corporate data used
    in Business Intelligence and Business Analytics reports.
  data_analytics: Data analysis and elaboration methods applied to datasets in the
    course laboratory work.
  data_analytics_types: Types of data analytics, including diagnostic, predictive,
    and prescriptive analytics, and their enabling techniques.
  data_quality_preprocessing: Data-quality assessment and preprocessing operations
    for data mining.
  data_visualization: Infographic communication techniques and principles for visualizing
    data.
  database_architectures: Architectural organization of database systems, including
    client-server relational systems and introductory distributed and cloud database
    systems.
  database_management_systems: Database Management Systems as software for organizing,
    managing, and accessing relational and NoSQL databases.
  etl_procedures: Design of extract, transform, and load procedures for populating
    a data warehouse.
  power_bi_reporting: Use of Power BI to design and create Business Intelligence and
    Business Analytics reports.
  r_analytics_in_bi: Use of R for analytics calculations incorporated into Business
    Intelligence reports.
