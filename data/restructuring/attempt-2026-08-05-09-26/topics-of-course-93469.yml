cluster:
  id: 21
  name: Artificial Intelligence Fundamentals (21)
course:
  id: '93469'
  name: Human Data Science
topics:
  ai_ethics: Ethical issues arising from different approaches to artificial intelligence
    and cognitive science.
  data_quality_bias: Assessment of training-data and dataset reliability, integrity,
    and bias, including sampling bias and the separation of signal from noise.
  datafication: Transformation of human behavior and activity into data, including
    risks of misinterpretation and inappropriate conclusions from datified behavior.
  deep_learning: Deep learning methods as a subfield of machine learning.
  human_machine_collaboration: Human-centered workflows for machine learning involving
    action-feedback loops, human agency, oversight, and collaboration between people
    and models.
  logical_inference: Formal logical inference, including Modus Ponens and Modus Tollens,
    used to model human reasoning and decision-making.
  machine_learning: Symbolic and sub-symbolic machine learning methods, including
    decision trees, random forests, neural networks, Bayesian approaches, and inductive
    logic programming.
  predictive_modeling: Predictive modeling applications of machine learning to concrete
    business cases, including predictions and recommendations.
  probabilistic_reasoning: Reasoning under uncertainty using probability queries,
    independence, Bayesian network representation, and exact or approximate inference.
  statistical_inference: Statistical methods for analyzing human-centered data, including
    regression, hypothesis testing, confidence intervals, sampling, variance partitioning,
    and reliability assessment.
