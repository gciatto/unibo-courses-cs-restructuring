cluster:
  id: 21
  name: Artificial Intelligence Fundamentals (21)
course:
  id: '90147'
  name: Artificial intelligence
topics:
  ai_ethics: Ethical issues arising from different approaches to artificial intelligence
    and cognitive science.
  ai_introduction: Introduction to the history, main application fields, principles,
    and methods of Artificial Intelligence.
  ai_philosophical_aspects: Philosophical aspects and future challenges of artificial
    intelligence.
  automated_planning: Automated planning methods including linear planning, partial-order
    planning, graph-based planning with GraphPlan, and scheduling.
  cognitive_science: Cognitive science, including classical and contemporary approaches,
    as related to artificial intelligence.
  human_computer_interaction: Human-computer interaction issues and approaches related
    to artificial intelligence systems.
  knowledge_representation: Knowledge representation using semantic networks, description
    logics, ontologies, representations of actions, situations, and events, and rule-based
    systems.
  machine_learning: Symbolic and sub-symbolic machine learning methods, including
    decision trees, random forests, neural networks, Bayesian approaches, and inductive
    logic programming.
  natural_language_processing: Natural language processing as an area of artificial
    intelligence.
  neural_networks: Neural network models and methods in artificial intelligence.
  robotics: Robotics and the implications of artificial intelligence for recent robotics.
