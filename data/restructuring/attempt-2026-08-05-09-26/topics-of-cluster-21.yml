cluster:
  id: 21
  name: Artificial Intelligence Fundamentals (21)
topics:
  abstract_machines: Abstract machines as models for understanding program execution
    and language implementation.
  adaptive_autonomous_systems: Design, implementation, and evaluation of intelligent
    machines and autonomous systems that learn through interaction with their environments.
  agent_coordination: Coordination mechanisms for multi-agent systems, including nature-inspired
    coordination approaches.
  ai_agents: The notion and role of agents in artificial intelligence systems.
  ai_alignment: AI safety and value alignment, including super-intelligence, controllability,
    and self-awareness as open problems in autonomous and agentic AI systems.
  ai_ethics: Ethical issues arising from different approaches to artificial intelligence
    and cognitive science.
  ai_introduction: Introduction to the history, main application fields, principles,
    and methods of Artificial Intelligence.
  ai_philosophical_aspects: Philosophical aspects and future challenges of artificial
    intelligence.
  ai_problem_solving_search: AI problem solving using state representations, forward
    and backward reasoning, search, and informed or uninformed search strategies.
  ai_safety: Safety considerations in artificial intelligence, including risks and
    safeguards associated with AI systems.
  algorithmic_game_theory: Algorithmic game theory for multi-agent learning, including
    cooperation, coordination, and social dilemmas.
  automated_planning: Automated planning methods including linear planning, partial-order
    planning, graph-based planning with GraphPlan, and scheduling.
  automated_reasoning: Automated reasoning and reasoning agents in multi-agent systems.
  autonomous_systems: Concepts and definitions of autonomy in intelligent and autonomous
    systems.
  behavior_based_robotics: Robotics approaches based on coordinating and combining
    robot behaviors, including behavior-based control paradigms and practical control-software
    evaluation and tuning.
  behavior_trees: Behavior trees as a method for organizing and controlling robot
    behaviors.
  bio_inspired_adaptation: Bio-inspired approaches to adaptive systems.
  boolean_satisfiability: Boolean satisfiability, including SAT problem formulation
    and encodings, resolution, unit propagation, the DPLL algorithm, and conflict-driven
    clause learning.
  cognitive_science: Cognitive science, including classical and contemporary approaches,
    as related to artificial intelligence.
  constraint_programming: Constraint programming for combinatorial decision making
    and optimization, including constraint modeling, propagation, global constraints,
    constructive tree search, branching heuristics, randomization, search restarts,
    and Large Neighbourhood Search.
  constraint_satisfaction: Constraint satisfaction problems as a symbolic artificial
    intelligence problem-solving approach.
  coordination_mechanisms: Coordination mechanisms for multi-agent systems, including
    cooperation and nature-inspired coordination approaches.
  data_exploration: Operational tools and techniques for exploring and analyzing business
    data in data science settings.
  data_mining: Data mining methods for business data, including classification, clustering,
    regression, and automatic learning approaches.
  data_quality_bias: Assessment of training-data and dataset reliability, integrity,
    and bias, including sampling bias and the separation of signal from noise.
  datafication: Transformation of human behavior and activity into data, including
    risks of misinterpretation and inappropriate conclusions from datified behavior.
  decision_support_systems: Evidence-based decision support systems, including decision-making
    processes, system structures, and operational implementation techniques.
  deep_learning: Deep learning methods as a subfield of machine learning.
  esg_performance_monitoring: Co-design and monitoring of business performance systems
    using ESG criteria and machine-learning or data-science tools.
  evolutionary_robotics: Artificial evolution and evolutionary robotics, including
    automatic design of robot programs.
  explainable_ai: Explainable artificial intelligence, including introductory approaches
    to making AI systems understandable and explainable.
  functional_programming: Functional programming concepts and techniques as part of
    the programming-language foundations used in artificial intelligence.
  fuzzy_logic: Fuzzy logic and fuzzy systems used in intelligent robotic systems.
  games_constraint_planning: Application of AI problem-solving methods to games, constraint
    satisfaction problems, and planning problems.
  generative_learning: Generative learning and artificial intelligence creativity.
  human_computer_interaction: Human-computer interaction issues and approaches related
    to artificial intelligence systems.
  human_feedback_learning: Training agentic and generative AI systems using reinforcement
    learning from human feedback and Direct Preference Optimization.
  human_machine_collaboration: Human-centered workflows for machine learning involving
    action-feedback loops, human agency, oversight, and collaboration between people
    and models.
  integer_linear_programming: Integer linear programming and its extensions and hybrid
    methods for combinatorial decision making and optimization.
  knowledge_based_systems: Architectural organization, principles, and implementation
    of systems that use explicit knowledge to solve problems.
  knowledge_representation: Knowledge representation using semantic networks, description
    logics, ontologies, representations of actions, situations, and events, and rule-based
    systems.
  language_models: Language models as artificial intelligence models for processing
    and generating language.
  large_language_models: Large language models as an artificial intelligence technology.
  linear_programming: Linear programming, including the simplex algorithm and linear-programming
    duality.
  logic_programming: Logic programming as a programming and reasoning approach in
    artificial intelligence.
  logical_inference: Formal logical inference, including Modus Ponens and Modus Tollens,
    used to model human reasoning and decision-making.
  machine_learning: Symbolic and sub-symbolic machine learning methods, including
    decision trees, random forests, neural networks, Bayesian approaches, and inductive
    logic programming.
  multi_agent_programming: Technologies and programming environments for multi-agent
    systems, including JADE and Jason, and programming intentional agents.
  multi_agent_reinforcement_learning: Reinforcement learning in systems with multiple
    learning agents.
  multi_agent_simulation: Simulation as an introductory approach for studying multi-agent
    systems.
  multi_agent_systems: Multi-agent systems as a framework for modeling and engineering
    complex computational and socio-technical systems using agent-oriented abstractions,
    technologies, and methodologies.
  multi_armed_bandits: Multi-armed bandit methods for reinforcement learning and sequential
    decision-making.
  natural_language_processing: Natural language processing as an area of artificial
    intelligence.
  neural_networks: Neural network models and methods in artificial intelligence.
  optimization: Optimization and advanced search methods, including local search,
    metaheuristics, decomposition, constraint relaxation, and branch-and-bound techniques.
  perception_actuation: Perception and actuation as technologies for implementing
    intelligent systems that sense and act in their environments.
  predictive_modeling: Predictive modeling applications of machine learning to concrete
    business cases, including predictions and recommendations.
  probabilistic_reasoning: Reasoning under uncertainty using probability queries,
    independence, Bayesian network representation, and exact or approximate inference.
  procedural_declarative_programming: Design and implementation of practical systems
    using procedural and declarative programming languages.
  prolog_logic_programming: Use of Prolog for logic programming, implementing AI solvers,
    developing simple Prolog programs, and introductory meta-predicates and meta-interpreters.
  python_programming: Programming in Python, including functions, data types, mutability,
    object-oriented features, exceptions, and NumPy arrays.
  reinforcement_learning: Reinforcement learning for robot adaptation and behavior
    acquisition.
  robot_learning: Robot adaptation and learning methods, including associative learning,
    value-based learning, and intrinsic motivation.
  robot_navigation: Robot planning and navigation, including path planning with informed
    search algorithms such as A* and its variants.
  robotics: Robotics and the implications of artificial intelligence for recent robotics.
  rule_based_systems: Rule-based AI systems, including Prolog and its extensions,
    meta-interpreters, forward chaining, RETE, and Drools.
  satisfiability_modulo_theories: Satisfiability Modulo Theories, including eager
    and lazy encodings, the DPLL(T) algorithm, theory solvers, and combinations of
    theories.
  self_organizing_systems: Self-organising systems and self-organisation in multi-agent
    systems.
  statistical_inference: Statistical methods for analyzing human-centered data, including
    regression, hypothesis testing, confidence intervals, sampling, variance partitioning,
    and reliability assessment.
  supervised_learning: Learning methods for making predictions and recommendations
    from labeled business data.
  swarm_intelligence: Computational optimization methods inspired by ant colonies,
    bee colonies, and particle swarms.
  swarm_robotics: Swarm robotics, including the use of multiple interacting robots
    and swarm-based robot behavior.
  systematic_literature_review: Systematic literature review as a methodology for
    conducting scientific surveys of intelligent and autonomous systems.
  unsupervised_learning: Unsupervised machine learning methods for discovering patterns
    or structure in data without labeled outcomes.
