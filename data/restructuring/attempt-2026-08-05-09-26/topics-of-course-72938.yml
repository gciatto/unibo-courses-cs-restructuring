cluster:
  id: 21
  name: Artificial Intelligence Fundamentals (21)
course:
  id: '72938'
  name: Foundations Of Artificial Intelligence T
topics:
  ai_introduction: Introduction to the history, main application fields, principles,
    and methods of Artificial Intelligence.
  ai_problem_solving_search: AI problem solving using state representations, forward
    and backward reasoning, search, and informed or uninformed search strategies.
  games_constraint_planning: Application of AI problem-solving methods to games, constraint
    satisfaction problems, and planning problems.
  knowledge_based_systems: Architectural organization, principles, and implementation
    of systems that use explicit knowledge to solve problems.
  knowledge_representation: Knowledge representation using semantic networks, description
    logics, ontologies, representations of actions, situations, and events, and rule-based
    systems.
  procedural_declarative_programming: Design and implementation of practical systems
    using procedural and declarative programming languages.
  prolog_logic_programming: Use of Prolog for logic programming, implementing AI solvers,
    developing simple Prolog programs, and introductory meta-predicates and meta-interpreters.
