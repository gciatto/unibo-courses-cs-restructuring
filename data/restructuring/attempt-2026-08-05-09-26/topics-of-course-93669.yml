cluster:
  id: 21
  name: Artificial Intelligence Fundamentals (21)
course:
  id: '93669'
  name: Intelligent Systems Engineering
topics:
  agent_coordination: Coordination mechanisms for multi-agent systems, including nature-inspired
    coordination approaches.
  ai_agents: The notion and role of agents in artificial intelligence systems.
  ai_introduction: Introduction to the history, main application fields, principles,
    and methods of Artificial Intelligence.
  automated_planning: Automated planning methods including linear planning, partial-order
    planning, graph-based planning with GraphPlan, and scheduling.
  automated_reasoning: Automated reasoning and reasoning agents in multi-agent systems.
  autonomous_systems: Concepts and definitions of autonomy in intelligent and autonomous
    systems.
  coordination_mechanisms: Coordination mechanisms for multi-agent systems, including
    cooperation and nature-inspired coordination approaches.
  explainable_ai: Explainable artificial intelligence, including introductory approaches
    to making AI systems understandable and explainable.
  human_computer_interaction: Human-computer interaction issues and approaches related
    to artificial intelligence systems.
  knowledge_representation: Knowledge representation using semantic networks, description
    logics, ontologies, representations of actions, situations, and events, and rule-based
    systems.
  large_language_models: Large language models as an artificial intelligence technology.
  multi_agent_programming: Technologies and programming environments for multi-agent
    systems, including JADE and Jason, and programming intentional agents.
  multi_agent_simulation: Simulation as an introductory approach for studying multi-agent
    systems.
  multi_agent_systems: Multi-agent systems as a framework for modeling and engineering
    complex computational and socio-technical systems using agent-oriented abstractions,
    technologies, and methodologies.
  natural_language_processing: Natural language processing as an area of artificial
    intelligence.
  perception_actuation: Perception and actuation as technologies for implementing
    intelligent systems that sense and act in their environments.
  self_organizing_systems: Self-organising systems and self-organisation in multi-agent
    systems.
  systematic_literature_review: Systematic literature review as a methodology for
    conducting scientific surveys of intelligent and autonomous systems.
