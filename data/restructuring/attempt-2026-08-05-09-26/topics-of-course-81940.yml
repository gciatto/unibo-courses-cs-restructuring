cluster:
  id: 21
  name: Artificial Intelligence Fundamentals (21)
course:
  id: '81940'
  name: Artificial Intelligence
topics:
  ai_agents: The notion and role of agents in artificial intelligence systems.
  ai_introduction: Introduction to the history, main application fields, principles,
    and methods of Artificial Intelligence.
  ai_philosophical_aspects: Philosophical aspects and future challenges of artificial
    intelligence.
  ai_problem_solving_search: AI problem solving using state representations, forward
    and backward reasoning, search, and informed or uninformed search strategies.
  games_constraint_planning: Application of AI problem-solving methods to games, constraint
    satisfaction problems, and planning problems.
  large_language_models: Large language models as an artificial intelligence technology.
  logic_programming: Logic programming as a programming and reasoning approach in
    artificial intelligence.
  machine_learning: Symbolic and sub-symbolic machine learning methods, including
    decision trees, random forests, neural networks, Bayesian approaches, and inductive
    logic programming.
  optimization: Optimization and advanced search methods, including local search,
    metaheuristics, decomposition, constraint relaxation, and branch-and-bound techniques.
