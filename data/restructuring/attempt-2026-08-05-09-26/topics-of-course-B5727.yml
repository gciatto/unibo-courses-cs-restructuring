cluster:
  id: 21
  name: Artificial Intelligence Fundamentals (21)
course:
  id: B5727
  name: Introduction to Languages for Artificial Intelligence
topics:
  abstract_machines: Abstract machines as models for understanding program execution
    and language implementation.
  constraint_programming: Constraint programming for combinatorial decision making
    and optimization, including constraint modeling, propagation, global constraints,
    constructive tree search, branching heuristics, randomization, search restarts,
    and Large Neighbourhood Search.
  functional_programming: Functional programming concepts and techniques as part of
    the programming-language foundations used in artificial intelligence.
  logic_programming: Logic programming as a programming and reasoning approach in
    artificial intelligence.
  logical_inference: Formal logical inference, including Modus Ponens and Modus Tollens,
    used to model human reasoning and decision-making.
  procedural_declarative_programming: Design and implementation of practical systems
    using procedural and declarative programming languages.
  prolog_logic_programming: Use of Prolog for logic programming, implementing AI solvers,
    developing simple Prolog programs, and introductory meta-predicates and meta-interpreters.
  python_programming: Programming in Python, including functions, data types, mutability,
    object-oriented features, exceptions, and NumPy arrays.
