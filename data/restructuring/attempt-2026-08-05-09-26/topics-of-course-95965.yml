cluster:
  id: 21
  name: Artificial Intelligence Fundamentals (21)
course:
  id: '95965'
  name: Artificial Intelligence and Machine Learning for Business
topics:
  data_exploration: Operational tools and techniques for exploring and analyzing business
    data in data science settings.
  data_mining: Data mining methods for business data, including classification, clustering,
    regression, and automatic learning approaches.
  decision_support_systems: Evidence-based decision support systems, including decision-making
    processes, system structures, and operational implementation techniques.
  esg_performance_monitoring: Co-design and monitoring of business performance systems
    using ESG criteria and machine-learning or data-science tools.
  machine_learning: Symbolic and sub-symbolic machine learning methods, including
    decision trees, random forests, neural networks, Bayesian approaches, and inductive
    logic programming.
  predictive_modeling: Predictive modeling applications of machine learning to concrete
    business cases, including predictions and recommendations.
  supervised_learning: Learning methods for making predictions and recommendations
    from labeled business data.
