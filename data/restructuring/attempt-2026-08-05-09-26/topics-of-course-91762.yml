cluster:
  id: 21
  name: Artificial Intelligence Fundamentals (21)
course:
  id: '91762'
  name: Combinatorial Decision Making and Optimization
topics:
  boolean_satisfiability: Boolean satisfiability, including SAT problem formulation
    and encodings, resolution, unit propagation, the DPLL algorithm, and conflict-driven
    clause learning.
  constraint_programming: Constraint programming for combinatorial decision making
    and optimization, including constraint modeling, propagation, global constraints,
    constructive tree search, branching heuristics, randomization, search restarts,
    and Large Neighbourhood Search.
  integer_linear_programming: Integer linear programming and its extensions and hybrid
    methods for combinatorial decision making and optimization.
  linear_programming: Linear programming, including the simplex algorithm and linear-programming
    duality.
  optimization: Optimization and advanced search methods, including local search,
    metaheuristics, decomposition, constraint relaxation, and branch-and-bound techniques.
  satisfiability_modulo_theories: Satisfiability Modulo Theories, including eager
    and lazy encodings, the DPLL(T) algorithm, theory solvers, and combinations of
    theories.
