cluster:
  id: 7
  name: Informatica Computer Science (7)
course:
  id: '95602'
  name: Programming and Computer Architectures
topics:
  cloud_computing: The cloud computing paradigm in modern computer architectures.
  computer_architecture: Computer architecture concepts, milestones, trends, applications,
    and comparisons of modern architectures.
  computer_performance: Computer performance and the factors affecting it.
  data_structures: Data structures used to organize and represent data in Python programs.
  data_types: Basic data types and their use in solving problems.
  data_visualization: Working with graphs as computational representations using libraries.
  digital_logic: Digital representation, logic circuits, chips, and chip production.
  hardware_components: Computer hardware components, including CPUs, RAM, HDD/SSD
    storage, and input/output devices.
  modules_packages: Python modules, the standard library, and packages.
  object_attributes_methods: Object attributes and methods in Python programs.
  parallel_computing: Parallelism in modern computer architectures.
  problem_solving: Computational thinking and algorithmic approaches to solving problems,
    including organizing systems, understanding complex structures, and forecasting
    possible events.
  programming_constructs: Variables, expressions, statements, functions, conditionals,
    and iteration in programming languages.
  python_programming: Programming in Python, including names and visibility, functions,
    and mutable and immutable objects.
  spreadsheet_creation: Creating and using spreadsheets as computational tools.
  statistics_computing: Using libraries to work with statistical data.
  tabular_data: Tables as a structure for organizing and working with data.
  web_pages: Working with web pages using computational libraries and tools.
