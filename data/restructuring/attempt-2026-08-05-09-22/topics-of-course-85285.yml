cluster:
  id: 7
  name: Informatica Computer Science (7)
course:
  id: '85285'
  name: Programming
topics:
  classes_objects: Classes and objects in Python.
  computational_complexity: Introduction to computational complexity and analysis
    of algorithmic procedures.
  data_structures: Data structures used to organize and represent data in Python programs.
  data_types: Basic data types and their use in solving problems.
  dynamic_programming: Dynamic programming as an algorithmic problem-solving technique.
  exception_handling: Handling exceptions and using assertions in Python programs.
  higher_order_functions: Higher-order functions and functional abstractions in programming.
  machine_learning: Supervised and unsupervised machine learning algorithms and models
    used in data science applications.
  problem_solving: Computational thinking and algorithmic approaches to solving problems,
    including organizing systems, understanding complex structures, and forecasting
    possible events.
  programming_constructs: Variables, expressions, statements, functions, conditionals,
    and iteration in programming languages.
  python_programming: Programming in Python, including names and visibility, functions,
    and mutable and immutable objects.
  statistical_inference: Sampling, probability distributions, confidence intervals,
    and the interpretation of experimental data.
  stochastic_simulation: Stochastic programs, probability-based computation, and Monte
    Carlo simulations.
  testing_debugging: Testing and debugging programs.
