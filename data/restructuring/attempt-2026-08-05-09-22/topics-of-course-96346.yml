cluster:
  id: 7
  name: Informatica Computer Science (7)
course:
  id: '96346'
  name: INFORMATICA
topics:
  abstract_data_types: Abstract data types implemented as classes.
  abstract_machines: Abstract machines, including the Python machine model.
  computational_complexity: Introduction to computational complexity and analysis
    of algorithmic procedures.
  data_structures: Data structures used to organize and represent data in Python programs.
  data_types: Basic data types and their use in solving problems.
  problem_solving: Computational thinking and algorithmic approaches to solving problems,
    including organizing systems, understanding complex structures, and forecasting
    possible events.
  python_programming: Programming in Python, including names and visibility, functions,
    and mutable and immutable objects.
  sorting_algorithms: Sorting algorithms, including their analysis and design.
  undecidable_problems: Limitations of effective procedures, including non-decidable
    problems.
