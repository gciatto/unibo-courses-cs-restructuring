cluster:
  id: 7
  name: Informatica Computer Science (7)
course:
  id: B5780
  name: Computational Methods for Bioinformatics
topics:
  data_structures: Data structures used to organize and represent data in Python programs.
  dynamic_programming: Dynamic programming as an algorithmic problem-solving technique.
  file_operations: File operations and interaction with the operating system in Python-based
    computational workflows.
  linux: Linux as an operating system environment introduced for computational work.
  object_oriented_computing: Object-oriented computing using Python as the reference
    programming language.
  programming_constructs: Variables, expressions, statements, functions, conditionals,
    and iteration in programming languages.
  python_programming: Programming in Python, including names and visibility, functions,
    and mutable and immutable objects.
  recursion_iteration: Recursive programming techniques and recursion as a programming
    construct.
  sequence_alignment_algorithms: Pairwise sequence alignment algorithms, including
    local, global, and semiglobal alignment, heuristic methods, and their Python implementation.
