  name: Informatica Computer Science (7)
course:
  id: '93363'
  name: Advanced Programming
topics:
  array_oriented_computing: Array-oriented computing for scientific computing using
    Python.
  image_graphics: Image manipulation and graphics as basic software tools.
  multimedia_data: Multimedia representation of data using proprietary and open source
    technologies.
  object_oriented_computing: Object-oriented computing using Python as the reference
    programming language.
  operating_systems: Operating systems as basic information technology tools and concepts.
  python_data_libraries: Python libraries for scientific and data analysis, including
    NumPy, SciPy, Matplotlib, pandas, and scikit-learn.
  python_programming: Programming in Python, including names and visibility, functions,
    and mutable and immutable objects.
  scientific_computing: Scientific computing with Python libraries for analyzing,
    visualizing, and modeling scientific datasets.
  search_engines: Search engines as basic information technology tools.
  uml: Unified Modeling Language (UML) for visualizing the design of software applications.
  word_processing: Word processing as a basic software tool.
