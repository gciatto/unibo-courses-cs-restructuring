cluster:
  id: 7
  name: Informatica Computer Science (7)
course:
  id: '41588'
  name: INTRODUZIONE ALL'ANALISI DEI DATI
topics:
  biological_data: Types of biological data and suitable data structures, with applications
    of data analytics in biology.
  data_analytics: Data analytics types and applications, including diagnostic, predictive,
    and prescriptive analytics.
  data_pipelines: Designing data pipelines from data acquisition through analysis
    and valorization.
  data_structures: Data structures used to organize and represent data in Python programs.
  data_types: Basic data types and their use in solving problems.
  descriptive_analytics: Descriptive analysis of different data types using Python
    libraries.
  predictive_analytics: Predictive analysis using regression and classification models.
  problem_solving: Computational thinking and algorithmic approaches to solving problems,
    including organizing systems, understanding complex structures, and forecasting
    possible events.
  programming_constructs: Variables, expressions, statements, functions, conditionals,
    and iteration in programming languages.
  python_data_libraries: Python libraries for scientific and data analysis, including
    NumPy, SciPy, Matplotlib, pandas, and scikit-learn.
  python_programming: Programming in Python, including names and visibility, functions,
    and mutable and immutable objects.
  statistical_model_analysis: Statistical tests and model analysis for identifying
    important variables.
