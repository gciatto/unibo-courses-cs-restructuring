cluster:
  id: 7
  name: Informatica Computer Science (7)
course:
  id: '37262'
  name: Computer Programming
topics:
  classes_objects: Classes and objects in Python.
  computing_systems: Operating systems, computer networks, and information systems
    as basic informatics concepts.
  csv_processing: Reading and working with CSV files in Python programs.
  data_types: Basic data types and their use in solving problems.
  financial_computing: Mapping financial problems to computational solutions and accessing
    financial data.
  problem_solving: Computational thinking and algorithmic approaches to solving problems,
    including organizing systems, understanding complex structures, and forecasting
    possible events.
  programming_constructs: Variables, expressions, statements, functions, conditionals,
    and iteration in programming languages.
  programming_languages: Computer languages, interpreters, and compilers.
  python_programming: Programming in Python, including names and visibility, functions,
    and mutable and immutable objects.
  recursion_iteration: Recursive programming techniques and recursion as a programming
    construct.
  spreadsheet_creation: Creating and using spreadsheets as computational tools.
  tabular_data: Tables as a structure for organizing and working with data.
  web_scraping: Accessing and extracting information from websites through web scraping.
