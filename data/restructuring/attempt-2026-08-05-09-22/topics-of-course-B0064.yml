cluster:
  id: 7
  name: Informatica Computer Science (7)
course:
  id: B0064
  name: Introduction to Data Science and Computational Thinking
topics:
  data_structures: Data structures used to organize and represent data in Python programs.
  digital_transformation: Digital transformation as a process involving computational
    tools and text processing.
  problem_solving: Computational thinking and algorithmic approaches to solving problems,
    including organizing systems, understanding complex structures, and forecasting
    possible events.
  programming_languages: Computer languages, interpreters, and compilers.
  python_programming: Programming in Python, including names and visibility, functions,
    and mutable and immutable objects.
  software_production: Software production from organizational and cognitive perspectives,
    including the development and evaluation of programs and prototypes.
  testing_debugging: Testing and debugging programs.
  text_processing: Processing and understanding text as a paradigm for digital transformation.
