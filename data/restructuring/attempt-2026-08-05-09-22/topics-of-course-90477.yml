cluster:
  id: 7
  name: Informatica Computer Science (7)
course:
  id: '90477'
  name: Machine Learning Systems For Data Science
topics:
  data_structures: Data structures used to organize and represent data in Python programs.
  deep_learning: Deep learning methods based on neural networks, including convolutional,
    recurrent, and LSTM networks.
  development_tools: Python development environments and platforms, including integrated
    development environments, Jupyter Notebook, Google Colab, Hugging Face, and GitLab.
  generative_models: Generative deep learning models, including GANs, autoencoders,
    and transformers.
  large_language_models: Large language models as a topic in data science and natural
    language processing.
  machine_learning: Supervised and unsupervised machine learning algorithms and models
    used in data science applications.
  ml_frameworks: Machine learning frameworks for defining and using models, including
    PyTorch and TensorFlow.
  natural_language_processing: Natural language processing, including foundational
    methods and topic modeling.
  programming_constructs: Variables, expressions, statements, functions, conditionals,
    and iteration in programming languages.
  python_data_libraries: Python libraries for scientific and data analysis, including
    NumPy, SciPy, Matplotlib, pandas, and scikit-learn.
  python_programming: Programming in Python, including names and visibility, functions,
    and mutable and immutable objects.
