cluster:
  id: 7
  name: Informatica Computer Science (7)
course:
  id: '65094'
  name: ADVANCED PROGRAMMING
topics:
  classes_objects: Classes and objects in Python.
  data_structures: Data structures used to organize and represent data in Python programs.
  data_types: Basic data types and their use in solving problems.
  descriptive_analytics: Descriptive analysis of different data types using Python
    libraries.
  numerical_modeling: Basic numerical modeling for solving physical equations, including
    wave, heat, and transport equations.
  programming_constructs: Variables, expressions, statements, functions, conditionals,
    and iteration in programming languages.
  python_data_libraries: Python libraries for scientific and data analysis, including
    NumPy, SciPy, Matplotlib, pandas, and scikit-learn.
  python_programming: Programming in Python, including names and visibility, functions,
    and mutable and immutable objects.
  scientific_computing: Scientific computing with Python libraries for analyzing,
    visualizing, and modeling scientific datasets.
  shell_commands: Basic shell commands for automating computational workflows and
    sequences of code.
