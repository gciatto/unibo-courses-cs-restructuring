  name: Informatica Computer Science (7)
course:
  id: '96346'
  name: INFORMATICA
topics:
  abstract_data_types: Abstract data types as specifications of data collections and
    their supported operations.
  abstract_machines: Abstract machines used to explain programming-language execution
    and implementation.
  algorithmic_problem_solving: Algorithmic approaches to solving problems with computers
    using the imperative programming paradigm.
  binary_trees: Binary trees as an abstract data type, including their structure and
    use in Python programming.
  computational_complexity: An introduction to computational complexity.
  computer_hardware_architecture: Fundamental organization of computer hardware systems.
  dictionaries: Dictionary data structures for storing and retrieving key-value associations.
  immutable_mutable_objects: Immutable and mutable objects in Python.
  python_data_structures: Data structures used in Python programming, as introduced
    alongside Python data types, control flow, functions, and libraries.
  python_data_types: Basic Python data types and their use in solving problems.
  python_functions: Functions in the Python programming language.
  python_machine: The Python machine as an abstract machine for explaining Python
    program execution.
  python_name_scope: Names and their visibility, including scope rules, in Python
    programs.
  python_programming_basics: Introduction to programming in Python.
  sorting_algorithms: Algorithms for sorting data.
  undecidable_problems: Limitations of effective procedures, including non-decidable
    problems.
