analysis:
  mode: all-courses
source_clusters:
- id: 2
  name: Big Data Cloud (2)
course:
  id: B2125
  name: Machine Learning and Data Mining M
topics:
  association_rules: Association-rule mining.
  bagging_ensemble_learning: Bagging ensemble-learning methods for combining predictions
    from multiple models.
  bayesian_classifiers: Bayesian methods for classification.
  boosting_ensemble_learning: Boosting as an ensemble-learning method, introduced
    for object-detection applications.
  classification_models_general: Classification models and algorithms for assigning
    data instances to classes.
  clustering: Clustering techniques for data mining.
  data_lakes: Data Lake concepts and their role as enabling infrastructure for data-mining
    processes.
  data_mining_overview: General concepts, application scenarios, and supervised and
    unsupervised techniques in data mining.
  data_mining_system_architectures: Architectures of systems that integrate data-mining
    components.
  data_mining_validation: Understanding and validating data-mining results.
  data_warehouse_architecture: Architectural organization of enterprise data warehouses.
  data_warehousing_olap: Data-warehouse design and development with online analytical
    processing (OLAP).
  dbscan_clustering: DBSCAN density-based clustering for data segmentation.
  decision_tree_classification: Classification using decision-tree models.
  em_clustering: Clustering using the Expectation-Maximization method.
  hierarchical_clustering: Hierarchical methods for clustering and segmentation.
  kernel_clustering: Kernel methods applied to clustering and segmentation.
  kmeans_clustering: K-means clustering.
  knn_classification: k-nearest-neighbor classification.
  knowledge_discovery_process: Knowledge discovery and data-mining process design,
    including the CRISP-DM methodology.
  learning_theory: Theory of learning as a foundation for understanding machine-learning
    methods.
  linear_discriminant_classification: Classification using linear discrimination methods.
  logistic_regression: Logistic regression for classification.
  machine_learning_basics: Basic machine-learning algorithms and methods used to develop
    intelligent applications.
  model_evaluation: Evaluation methods for language and machine-learning models.
  model_selection: Selection of machine-learning models and methods suited to a data-mining
    process.
  random_forest_classification: Random-forest ensemble methods for classification.
  regression_models: Regression models and algorithms for predicting continuous outcomes.
  supervised_unsupervised_learning: Supervised and unsupervised machine-learning approaches.
  support_vector_machines: Support Vector Machine classification methods.
