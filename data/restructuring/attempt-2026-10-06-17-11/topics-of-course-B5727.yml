analysis:
  mode: all-courses
source_clusters:
- id: 21
  name: Artificial Intelligence Fundamentals (21)
course:
  id: B5727
  name: Introduction to Languages for Artificial Intelligence
topics:
  abstract_machines: Abstract machines used to explain programming-language execution
    and implementation.
  concurrent_constraint_programming: Concurrent constraint programming based on concurrent
    agents or processes that communicate through constraints.
  constraint_logic_programming: Constraint logic programming, combining logic-programming
    representations with constraints.
  constraint_programming: Constraint-programming methods, including global constraints,
    search strategies, and applications.
  dictionaries: Dictionary data structures for storing and retrieving key-value associations.
  exceptions: Exception mechanisms in programming languages.
  immutable_mutable_objects: Immutable and mutable objects in Python.
  inheritance: Inheritance in object-oriented programming.
  lists: List data structures, including their practical implementation and use.
  logic_resolution: Resolution as a logical inference technique.
  logic_unification: Unification techniques used in mathematical logic and logic programming.
  logical_programming: The logical programming paradigm.
  mathematical_logic: Introductory mathematical logic covered as a foundation for
    unification, resolution, and logic programming.
  minizinc: The MiniZinc language for specifying constraint-programming models.
  numpy_ndarrays: NumPy N-dimensional array objects as introduced for Python programming.
  oo_classes_objects: Classes and objects in the object-oriented programming paradigm.
  programming_methods: Methods as reusable units of behavior in introductory programming.
  prolog_programming: Design and development of simple Prolog programs for implementing
    artificial-intelligence systems and problem solvers.
  python_data_types: Basic Python data types and their use in solving problems.
  python_functions: Functions in the Python programming language.
  python_machine: The Python machine as an abstract machine for explaining Python
    program execution.
  python_name_scope: Names and their visibility, including scope rules, in Python
    programs.
  python_sequences: Sequences as data structures in Python.
