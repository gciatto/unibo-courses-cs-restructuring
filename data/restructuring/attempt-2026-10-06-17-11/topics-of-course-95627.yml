analysis:
  mode: all-courses
source_clusters:
- id: 14
  name: Engineering Software Cultural (14)
course:
  id: '95627'
  name: Software Engineering
topics:
  agile_software_development: Agile software-development principles and practices.
  api_documentation: Designing and documenting Web APIs with specifications and tools
    such as OpenAPI and Swagger.
  build_automation: Build automation tools and practices for automating software construction.
  cloud_computing: Introduction to cloud computing in the context of distributed and
    service-oriented programming.
  code_coverage: Code-coverage measurement as a software-testing and quality-assurance
    practice.
  command_line_interfaces: Command-line interfaces and their use for interacting with
    software and development tools.
  compilers: Compilers as implementation mechanisms for programming languages.
  continuous_integration: Continuous Integration and delivery practices for integrating,
    validating, and delivering software changes.
  conventional_commits: Conventional Commit messages and their use in versioning and
    automated release workflows.
  dependency_management: Managing software libraries, dependencies, virtual environments,
    and package declarations in Python projects.
  devops_practices: DevOps practices for software development, deployment, and maintenance
    processes.
  distributed_architectures: Software and system architectures used to model and design
    distributed systems.
  distributed_communication: Communication mechanisms and concepts for distributed
    systems.
  distributed_systems: Fundamental concepts of distributed systems.
  distributed_version_control: Distributed version-control concepts and workflows,
    including Git repositories, commits, branches, merges, remotes, forks, pull requests,
    conflicts, and branching strategies.
  domain_driven_design: Domain-Driven Design concepts and practices, including domains,
    bounded contexts, ubiquitous language, entities, value objects, aggregates, repositories,
    services, factories, domain events, and anti-corruption layers.
  domain_modeling: Analysis-model domain modeling for representing the concepts and
    relationships in a software system's problem domain.
  hexagonal_architecture: Hexagonal software architecture for separating domain logic
    from external interfaces and infrastructure.
  immutable_mutable_objects: Immutable and mutable objects in Python.
  inheritance: Inheritance in object-oriented programming.
  integration_acceptance_testing: Integration testing of collaborating software components
    and acceptance testing against system requirements.
  intelligent_agents: Agents as entities that perceive, reason, and act to exhibit
    intelligent behavior.
  intelligent_systems_intro: Definitions, problem types, and application areas of
    intelligent systems.
  interpreters: Interpreters as implementation mechanisms for programming languages.
  microservices: Microservice architectures, including their principles, technologies,
    and enterprise-software perspective.
  modular_programming: Modular programming methodologies for organizing programs into
    separate modules.
  multi_agent_coordination: Coordination mechanisms and issues for coordinating multiple
    agents.
  multi_agent_systems: Models, technologies, and methodologies for engineering intelligent
    systems with multiple interacting agents.
  object_oriented_programming: Introduction to the object-oriented programming paradigm
    in practical lectures.
  oo_abstraction_information_hiding: Abstraction and information hiding in object-oriented
    software design.
  oo_classes_objects: Classes and objects in the object-oriented programming paradigm.
  oo_polymorphism: Polymorphism in object-oriented programming, as covered through
    Java programming.
  overloading: Overloading in C++.
  python_modules_packages: Python modules, standard-library components, and packages.
  python_objects_attributes_methods: Python objects, including object attributes and
    methods.
  python_packaging: Building, packaging, releasing, and distributing Python projects
    with tools such as Poetry and package repositories such as PyPI.
  rest_web_apis: REST principles and design of APIs for Web applications.
  semantic_versioning: Semantic versioning and other software-versioning schemes,
    including the relationship between versions and API stability.
  service_oriented_computing: Service-oriented computing as illustrated through Jolie.
  software_architecture_styles: Selection and use of layered, client-server, pipeline,
    microkernel, service-based, event-driven, space-based, and microservice architectural
    styles for software subsystems.
  software_licensing: Software licensing concepts and practices, including copyright,
    copyleft, proprietary and free software, ownership, and licenses such as MIT,
    Apache, and GPL.
  software_lifecycle: Phases and activities in the lifecycle of software systems,
    including planning, requirements analysis, and design.
  software_methodologies: Overview of software-development methodologies, including
    waterfall and agile approaches.
  software_quality_criteria: Quality criteria for software systems.
  software_testing: Testing activities for software systems.
  static_analysis: Static analysis of program correctness properties and resource
    or asset consumption without executing the program.
  terminal_emulator: Using a terminal emulator to interact with a computer system.
  test_driven_development: Test-driven development practices for designing and implementing
    software through iterative test-first development.
  uml_architecture_diagrams: Component and deployment diagrams in the UML language.
  uml_behavior_diagrams: State and activity diagrams in the UML language.
  uml_class_object_diagrams: Class and object diagrams in the UML language.
  uml_diagram_generation: Generating UML diagrams from textual specifications using
    PlantUML.
  uml_interaction_diagrams: Sequence and collaboration diagrams in the UML language.
  uml_software_modeling: Unified Modeling Language (UML) as a standard language for
    visualizing software-application designs.
  uml_use_case_diagrams: Use case diagrams in the UML language.
  unit_testing: Unit testing of software components as part of software testing.
  version_control_systems: Version control systems used in software development.
  web_services: Development of back ends based on Web services.
