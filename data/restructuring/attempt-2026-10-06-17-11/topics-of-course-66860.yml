analysis:
  mode: all-courses
source_clusters:
- id: 4
  name: Internet Things Systems (4)
course:
  id: '66860'
  name: Mobile Applications Laboratory
topics:
  android_activities: Android activities and their role in application development.
  android_architecture_components: Android platform architecture and application components.
  android_background_work: Background work in Android applications.
  android_compose_ui: Programmatic Android user-interface development with Compose.
  android_data_management: Data management in Android applications.
  android_fragments_navigation: Android fragments and navigation between application
    screens.
  android_intents: Android intents for communication and navigation among application
    components.
  android_resources: Resources used by Android applications.
  android_setup: Setting up the Android development environment and tools.
  android_views_layouts_events: Android views, layouts, and event handling.
  cross_platform_mobile_frameworks: Cross-platform mobile application development
    with Flutter and React Native.
  ios_architecture_components: iOS platform architecture and application components.
  ios_setup: Setting up the iOS development environment and tools.
  ios_storyboards_uikit: iOS storyboards and UIKit for designing application interfaces.
  ios_swiftui: Programmatic iOS user-interface development with SwiftUI.
  ios_targets_actions_outlets: iOS targets, actions, and outlets for connecting interface
    elements with application behavior.
  kotlin_android: Kotlin programming for Android application development.
  mobile_application_types: Differences among web, hybrid, and native mobile applications.
  mobile_debugging: Debugging mobile applications.
  mobile_multimedia_management: Multimedia management in mobile applications.
  mobile_mvc_architecture: Model-View-Controller design for mobile applications.
  mobile_networking_services: Networking services used by mobile applications.
  mobile_pervasive_computing: Pervasive mobile-computing features involving maps and
    device sensors.
  mobile_wireless_execution: Basic execution issues for applications operating in
    wireless mobile scenarios.
  software_design_patterns: Design patterns used in the design of software systems.
  software_testing: Testing activities for software systems.
  swift_ios: Swift programming for iOS application development.
