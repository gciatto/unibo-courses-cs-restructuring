analysis:
  mode: all-courses
source_clusters:
- id: 29
  name: Informatics Informatic Humanities (29)
course:
  id: '57828'
  name: Informatics
topics:
  algorithms_programming_basics: Basic principles of algorithms and programming.
  client_server_model: Client/server interaction and the design of small client/server
    applications.
  cloud_collaboration_storage: Use of cloud tools for online collaboration and storage.
  collaborative_tools: Collaborative tools used on the Web.
  computational_thinking: Computational thinking as an approach to formulating and
    solving problems with computers.
  computer_hardware_architecture: Fundamental organization of computer hardware systems.
  computer_networks: Basic computer-network concepts.
  conceptual_database_design: Requirements analysis and conceptual database design
    for relational databases.
  database_import_export: Importing and exporting data in databases used for structured
    archive management.
  database_overviews: Introductory outlines and basic organization of databases as
    part of individual productivity software.
  file_formats: File formats and their role in storing, exchanging, and archiving
    digital documents and data.
  internet_www: The Internet and World Wide Web.
  it_security: Basic IT security issues, including personal-data and file protection,
    viruses, and phishing.
  network_protocols: Introduction to protocols used in computer networks.
  operating_systems_filesystems: Operating-system structure and main functions, together
    with basic file-system operations.
  operating_systems_overview: Overview of the main operating systems referenced in
    the course.
  productivity_software: Personal productivity tools for word processing, spreadsheets,
    and presentations, including Microsoft Word, Excel, and PowerPoint.
  relational_keys: Keys used to identify and relate records in relational databases.
  relational_model: Structure and principles of the relational data model.
  search_engines: Use of search engines for internet-based research.
  software_lifecycle: Phases and activities in the lifecycle of software systems,
    including planning, requirements analysis, and design.
  software_operating_systems: The software structure of a computer, including operating
    systems and application programs.
  spreadsheet_formulas_functions: Spreadsheet structure, cells, formulas, and useful
    functions for data processing.
  spreadsheet_import_export: Importing and exporting spreadsheet data, including exporting
    data to the R platform for statistical analysis and handling data formats.
  spreadsheet_reporting: Creating spreadsheet tables, charts, and reports using filtering,
    sorting, and conditional formatting.
  visual_block_programming: Introduction to programming through visual block-based
    programming environments.
  web_applications: Basic concepts and use of Web applications, including browsing
    institutional portals.
  windows_os_file_management: Windows operating-system organization, file-system hierarchy,
    file-manager use, and system utilities.
  word_processing: Editing and formatting professional documents with tables, headers,
    notes, images, PDF/PDF-A export, printing, and archiving.
