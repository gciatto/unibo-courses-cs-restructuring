analysis:
  mode: all-courses
source_clusters:
- id: 15
  name: Network Networks Programming (15)
course:
  id: '93315'
  name: Computer Networks
topics:
  arp: Address Resolution Protocol for mapping IP addresses to link-layer addresses.
  arq_protocols: Automatic Repeat reQuest protocols for achieving reliable communication
    over unreliable channels.
  binary_encoding: Binary encoding of information.
  bluetooth_networking: Bluetooth protocol stack, topologies, discovery, scatternets,
    multi-hop communication, and Bluetooth programming support.
  circuit_packet_switching: Circuit-switched and packet-switched network communication.
  computer_networks: Basic computer-network concepts.
  confidentiality: Confidentiality as a security goal addressed by cryptographic techniques.
  congestion_control: Congestion-control mechanisms for transport-layer communication.
  cryptographic_security_foundations: Fundamental security issues arising in computer
    systems as addressed through cryptography.
  digital_signatures: Digital signatures, including their use in email and certified
    email.
  dns: DNS and advanced name systems used in distributed environments.
  email_protocols: Internet email protocols including SMTP, POP, and IMAP.
  error_detection_correction: Channel reliability mechanisms, including error detection
    and correction and common error-detection codes.
  firewalls: Firewalls for preventing network-based attacks.
  flow_control: Transport-layer flow-control mechanisms for regulating end-to-end
    data transmission.
  group_communication: Communication models, protocols, and algorithms for groups
    and many-to-many communication, including multicast.
  http_protocols: HTTP protocols used in distributed-system and network communication.
  icmp: Internet Control Message Protocol and its role in IP network operation.
  ieee_80211_networking: IEEE 802.11 networking, including CSMA/CA, hidden and exposed
    terminals, MACA, infrastructure and ad-hoc configurations, municipal meshes, and
    Wi-Fi Direct.
  integrity: Integrity as a security goal addressed by cryptographic techniques.
  inter_process_communication: Mechanisms for communication and coordination between
    processes.
  internet_routing: Routing mechanisms and organization used to move packets through
    the Internet.
  internetworking_fundamentals: Fundamentals and organization of internetworks, including
    the structure of the Internet and communication across LAN, WAN, and MAN environments.
  intrusion_detection_monitoring: Attack detection and monitoring using intrusion
    detection systems, intrusion prevention systems, and SIEM platforms.
  ipsec: IPsec mechanisms for securing communication at the network layer.
  ipv4_addressing_subnetting: IPv4 addressing, network classes, CIDR, subnetting,
    supernetting, and IP configuration.
  ipv6: IPv6 protocol and addressing.
  lan_switching: LAN connectivity devices and technologies, including hubs, repeaters,
    bridges, and switches.
  link_layer_protocols: Link-layer and access protocols including Ethernet, IEEE 802.11,
    HDLC, PPP, ARP, and RARP.
  mac_addressing_access: MAC addressing and Medium Access Control techniques for shared
    communication channels.
  mobile_ip: Mobile IP and Hierarchical Mobile IPv6 architectures, protocols, issues,
    split connections, and I-TCP.
  network_address_translation: Network Address Translation in IP networks.
  network_architecture: Hardware and software architectures for computer networks.
  network_autoconfiguration: Protocols for automatic network configuration, including
    RARP, BOOTP, and DHCP.
  network_design_ip: Design of networks and subnetworks within IP domains.
  network_gaming: Networked gaming as an application-layer service.
  network_performance: Network-performance indexes and their interpretation in different
    application contexts.
  network_protocols: Introduction to protocols used in computer networks.
  network_qos: Quality-of-service mechanisms and requirements in computer networks.
  network_service_architectures: Client/server, peer-to-peer, and hybrid network service
    architectures.
  network_sockets: Sockets and related C/UNIX and Java APIs for implementing TCP/IP
    client/server interactions.
  network_topologies: Network topologies, network resources, and logical channels.
  network_troubleshooting: Troubleshooting and analysis of network performance and
    network issues.
  osi_model: ISO OSI layered organization, including network, transport, session,
    presentation, and application layers.
  physical_layer_transmission: Physical-layer transmission media, signals, and transmission
    fundamentals.
  radio_waves: Radio waves and radio transmission as used in digitally enabled objects.
  real_time_networking: Real-time communication over computer networks.
  reliable_data_transfer: Techniques and protocols for reliable data transfer in network
    communication.
  secure_communications_vpn: Secure communication protocols and virtual private networks
    for protecting data in transit.
  session_presentation_layers: Session-layer and presentation-layer functions in network
    architectures.
  snmp_monitoring: The Simple Network Management Protocol and platforms for centralized
    monitoring of large or heterogeneous installations.
  software_defined_networking: Software-Defined Networking (SDN) concepts and technologies.
  ssl: SSL for securing communications.
  streaming_video: Streaming-video services and protocols at the application layer.
  tcp_ip_protocols: TCP/IP protocol connections and common synchronous and asynchronous
    applications.
  tcp_protocol: The Transmission Control Protocol as a connection-oriented transport
    protocol.
  transport_layer_services: Transport-layer services, including connectionless and
    connection-oriented communication and reliable data transfer.
  transport_multiplexing: Transport-layer multiplexing and demultiplexing of application
    communication.
  udp_protocol: The User Datagram Protocol as a connectionless transport protocol.
  virtual_channels_networks: Virtual channels using MPLS and virtual networks using
    VLANs.
  voip_asterisk: VoIP telephone exchanges using Asterisk.
  wireless_link_budget: Radio communication system design involving antennas, link
    budgets, and decibel calculations.
  wireless_propagation_fading: Propagation and fading models used to characterize
    wireless communication systems.
