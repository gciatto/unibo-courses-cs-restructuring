analysis:
  mode: all-courses
source_clusters:
- id: 22
  name: Computer Vision Image (22)
course:
  id: '93478'
  name: COMPUTER VISION
topics:
  attention_mechanisms: Attention mechanisms for visual and language representations,
    including their use in vision Transformers and image-classification architectures.
  camera_calibration: Camera calibration using intrinsic and extrinsic parameters,
    lens-distortion correction, planar targets, homography estimation, and Zhang's
    algorithm.
  cnn_architectures: Convolutional neural-network architectures for computer vision,
    including ResNeXt and grouped convolutions, MobileNets, EfficientNet, RegNet,
    AlexNet, VGG, Inception, and ResNet.
  cnn_layers_components: Convolutional neural-network components for image representation,
    including convolutional layers, pooling, and batch normalization.
  cnn_object_detection: Neural-network approaches to object detection, including two-stage,
    one-stage, anchor-free, Feature Pyramid Network, focal-loss, and DETR-based detectors.
  edge_detection: Image-gradient and edge-detection methods, including smooth derivatives,
    Sobel operators, and the Canny detector.
  image_convolution: Convolution and correlation as basic image-processing operations.
  image_filtering: Mean, Gaussian, median, bilateral, and non-local-means filtering
    of digital images.
  image_formation_acquisition: Image formation and acquisition concepts, including
    image sensors and the use of lenses.
  image_sampling_quantization: Basic image sensing, sampling, and quantization.
  image_segmentation: Image-segmentation methods for separating objects or regions,
    including semantic segmentation architectures such as Fully Convolutional Networks,
    U-Net, and DeepLab.
  image_video_captioning: Image and video captioning tasks using combinations of visual
    processing and recurrent or attention-based neural architectures.
  local_features_descriptors: Keypoint detectors and descriptors, including Harris
    corners and scale-invariant SIFT features.
  metric_learning: Deep metric and representation learning for visual applications
    such as face recognition and identification, including contrastive loss, triplet
    loss, ArcFace, and NT-Xent loss.
  object_detection: Techniques for detecting objects in images and video.
  perspective_projection: Pinhole-camera geometry, projective coordinates, perspective
    projection matrices, field of view, and depth of field.
  recurrent_neural_networks: Recurrent neural networks.
  semantic_instance_panoptic_segmentation: Semantic, instance, and panoptic image
    segmentation, including Mask R-CNN and MaskFormer, transposed and dilated convolutions,
    and body-part segmentation.
  transformers: Transformer architectures and attention-based models, including applications
    to visual and language-related machine-learning tasks.
  vision_transformers: Vision Transformer architectures for image classification and
    other computer-vision tasks.
