analysis:
  mode: all-courses
source_clusters:
- id: 17
  name: Basic Skills Informatics (17)
course:
  id: B8018
  name: DIGITAL HEALTH M
topics:
  behavior_change_models: Behavioral-change models used to understand and support
    user engagement and convergence in digital-health systems.
  classification_models_general: Classification models and algorithms for assigning
    data instances to classes.
  clinical_efficiency: Use of digital health to improve care-delivery processes, reduce
    time and cost, and reduce errors and personal bias in medical practice.
  clinical_research_regulation: Regulatory pathways and ethics-review requirements
    for digital-health clinical studies, including the University of Bologna Ethics
    Review Committee process and protocol design.
  clustering: Clustering techniques for data mining.
  cross_validation: Cross-validation procedures used to evaluate and train health-data-science
    models.
  data_science_fundamentals: Fundamental data-science concepts and methods for processing
    data in intelligent applications.
  digital_health_case_studies: Digital-health case studies concerning COPD and atrial
    fibrillation.
  digital_health_ethics: Ethical issues in digital-health research and in developing
    products or prototypes involving human participants.
  digital_health_intro: Definitions, perspectives, contexts of use, and technology
    scope of digital health.
  digital_therapeutics: Digital therapeutics and their use of digital-health interventions,
    including reinforcement-learning contexts.
  future_healthcare: Visioning and evidence-based projections concerning the future
    structure, focus, cost, technology, and services of healthcare.
  health_determinants_wellbeing: Determinants of individual health and wellbeing and
    their potential to benefit from digital health.
  health_iot_systems: Health Internet-of-Things systems using connected devices and
    sensors for digital-health monitoring and care purposes.
  health_outcomes_measurement: Measurement of health and wellbeing outcomes for evaluating
    digital-health prevention and intervention effects.
  health_platforms: Digital-health platforms that integrate devices, solutions, and
    services, including smart-home and smart-hospital concepts.
  healthcare_delivery_systems: National and private healthcare delivery systems, including
    their operational structures, costs, advantages, and limitations.
  healthcare_payer_models: Payer models associated with healthcare delivery systems
    in different parts of the world.
  human_activity_recognition: Architectures and algorithms for recognizing human activities
    in activity-aware systems.
  informed_consent: Participant recruitment and informed-consent requirements for
    digital-health clinical studies.
  iot_architectures_platforms: Basic architectures and platforms for Internet of Things
    systems.
  iot_devices_sensors: Internet of Things things, including sensors, actuators, and
    complex devices, with examples such as Raspberry Pi and Arduino platforms.
  iot_sensing_processing_communication: Sensing, identification, processing, and communication
    functions in Internet of Things and Industrial IoT solutions.
  jupyter_notebooks: Using Jupyter Notebook as an interactive environment for developing
    and executing Python code.
  medical_device_regulation: Regulatory requirements for developing medical devices
    and software as a medical device.
  medical_devices: Basic insights into medical devices and their use in healthcare
    contexts.
  mobile_health_apps: Mobile health applications using smartphones to support monitoring,
    intervention, health support, empowerment, compliance, and lifestyle-related health
    goals.
  model_evaluation: Evaluation methods for language and machine-learning models.
  neural_networks_deep_learning: Introduction to neural networks and deep learning,
    including their applications.
  numpy_arrays_operations: NumPy arrays and matrices, including mathematical and statistical
    operations, array manipulation, and advanced NumPy functions.
  pandas_data_manipulation_cleaning: Manipulating and cleaning data with Pandas.
  pandas_series_dataframes: Pandas Series and DataFrame structures for tabular data
    analysis.
  personal_health_cybernetics: Personal health cybernetics concerning intervention,
    patient engagement, health maintenance, and feedback-driven care.
  personal_health_informatics: Personal health informatics methods and models for
    acquiring and interpreting data from users and their devices or platforms.
  personal_health_systems: Personal health systems combining wearables, sensors, Health
    IoT, and other components for monitoring, diagnosis, intervention, support, empowerment,
    and compliance.
  python_data_analysis_libraries: Use of Python libraries for data analysis, including
    NumPy, SciPy, Matplotlib, pandas, and scikit-learn.
  regression_models: Regression models and algorithms for predicting continuous outcomes.
  reinforcement_learning: Reinforcement-learning methods.
  seaborn_visualization: Data visualization with Seaborn using relational, distribution,
    and categorical plots.
  secure_health_data_management: Privacy and secure management of health data in digital-health
    research and system development.
  smart_health_homes: Smart-home platforms and case studies for digital-health purposes.
  smart_sensors: Operating principles and characteristics of smart sensors for collecting
    data in Internet of Things applications.
  systematic_literature_review: Systematic literature review as a methodology for
    conducting scientific surveys of intelligent and autonomous systems.
