analysis:
  mode: all-courses
source_clusters:
- id: 21
  name: Artificial Intelligence Fundamentals (21)
course:
  id: '93469'
  name: Human Data Science
topics:
  algorithmic_decision_elsi: Ethical, legal, and social implications of algorithm-driven
    decisions, including human factors in evaluating such systems.
  confidence_intervals: Confidence intervals for expressing uncertainty in statistical
    estimates.
  data_filtering: Critical filtering of information in conditions of data deluge and
    information profusion.
  data_integrity_quality: Data integrity and data quality as factors affecting the
    validity of analyses and machine-learning models.
  datafication_human_behavior: Transformation of human behavior and interaction into
    data, including risks of misinterpretation.
  deductive_inference: Logical inference for modeling human reasoning and decision-making,
    including Modus Ponens and Modus Tollens.
  human_event_forecasting: Promises and limitations of forecasting human-centric events.
  human_in_the_loop_ml: Human-machine collaboration workflows using action-feedback
    loops to preserve human agency and oversight in machine-learning systems.
  machine_learning_basics: Basic machine-learning algorithms and methods used to develop
    intelligent applications.
  neural_networks_deep_learning: Introduction to neural networks and deep learning,
    including their applications.
  probabilistic_reasoning: Reasoning under uncertainty using probability queries and
    independence.
  regression_models: Regression models and algorithms for predicting continuous outcomes.
  reliability_assessment: Assessment of the reliability of data and measurements in
    human-centered analyses.
  sampling_bias: Sampling bias as a source of unreliable conclusions in data analysis
    of human-centric phenomena.
  statistical_tests: Statistical tests used in data analysis to identify important
    variables.
  variance_partitioning: Partitioning variance to separate signal from noise in complex
    human-domain data.
