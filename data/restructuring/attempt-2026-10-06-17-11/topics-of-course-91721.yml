analysis:
  mode: all-courses
source_clusters:
- id: 4
  name: Internet Things Systems (4)
course:
  id: '91721'
  name: Laboratory of Virtual Reality and Advanced Reality
topics:
  ar_vr_applications: Applications of virtual and augmented reality.
  ar_vr_avatars: Avatars used to represent users or participants in virtual and augmented
    reality environments.
  ar_vr_future_directions: Future directions and emerging developments in virtual
    and augmented reality.
  augmented_reality: Introductory overview of augmented reality.
  collaborative_virtual_environments: Collaborative virtual environments that enable
    multiple users to interact within shared virtual spaces.
  distributed_virtual_environments: Distributed virtual environments and the software-platform
    principles used to support them.
  game_engines: Game engines used as software platforms for designing and creating
    virtual- and augmented-reality environments.
  mixed_reality: The mixed-reality continuum from augmented reality to virtual reality
    and the technologies used to implement mixed-reality environments.
  real_time_physics_engines: Real-time physics engines used in virtual- and augmented-reality
    software platforms.
  virtual_reality: Introduction to virtual reality.
  vr_3d_user_interfaces: Strategies for designing, developing, and evaluating three-dimensional
    user interfaces in virtual and augmented reality.
  vr_computer_graphics: Computer-graphics principles used to create and render virtual
    and augmented reality environments.
  vr_content_design_standards: Standards and design principles for creating virtual-reality
    content.
  vr_input_tracking: Tracking systems and input devices used for interaction with
    virtual and augmented reality environments.
  vr_interaction_techniques: Interaction techniques in virtual and augmented reality,
    including selection and manipulation, travel, navigation, wayfinding, system control,
    and symbolic input.
  vr_output_hardware: Virtual- and augmented-reality output hardware for visual, auditory,
    haptic, vestibular, and olfactory channels.
  vr_perception_human_factors: Perception and human-factor principles relevant to
    designing and developing virtual and augmented reality environments.
  vr_runtime_systems: Runtime software platforms that support virtual-reality environments.
