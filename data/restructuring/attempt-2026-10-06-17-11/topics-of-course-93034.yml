analysis:
  mode: all-courses
source_clusters:
- id: 1
  name: Informatics Principles Foundations (1)
course:
  id: '93034'
  name: Foundations of Computer Science T
topics:
  abstract_data_types: Abstract data types as specifications of data collections and
    their supported operations.
  activation_records: Stacks of activation records used to implement procedure calls
    and execution environments.
  algorithmic_problem_solving: Algorithmic approaches to solving problems with computers
    using the imperative programming paradigm.
  c_arrays: Arrays in the C programming language.
  c_control_flow: Control-flow structures and cycles in the C programming language.
  c_data_types: Data types in the C programming language.
  c_file_handling: File-handling functions in C.
  c_functions: Library functions and user-defined functions in C.
  c_input_output: Input and output functions in C.
  c_memory_management: Direct memory-management functions in C.
  c_operators_expressions: Types, values, operators, and expressions in the C programming
    language.
  c_pointers: Pointers and pointer arithmetic in C.
  c_strings: Character strings in the C programming language.
  c_structures: Structures in the C programming language, including their definition
    and use with scalar values, arrays, and dynamically allocated memory.
  computer_hardware_architecture: Fundamental organization of computer hardware systems.
  computer_history: Historical development of computers as introduced alongside computer
    architecture.
  ebnf: Extended Backus-Naur Form grammars for defining the syntax of programming
    languages.
  information_representation: Representation of information as covered in the course's
    information-representation material.
  lists: List data structures, including their practical implementation and use.
  modular_programming: Modular programming methodologies for organizing programs into
    separate modules.
  operating_systems_overview: Overview of the main operating systems referenced in
    the course.
  procedures: Procedures and their implementation in programming languages.
  programming_languages_intro: Introductory concepts of programming languages, including
    what a language is and the role of programming languages.
  queues: Queue data structures in C++.
  recursion: Recursion and recursive procedures in programming languages.
  recursive_problems: Recursive or decidable languages and problems, including their
    relationship to computable decision procedures and Turing machines.
  sorting_algorithms: Algorithms for sorting data.
  stacks: Stack data structures as elementary data structures.
  structured_programming: Structured programming using imperative programming constructs.
  turing_machines: Turing machines as formal models for computation.
  undecidable_problems: Limitations of effective procedures, including non-decidable
    problems.
  von_neumann_architecture: The organization and operating principles of the Von Neumann
    computer architecture.
