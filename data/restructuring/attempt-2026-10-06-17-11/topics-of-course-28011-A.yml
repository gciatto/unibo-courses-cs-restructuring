analysis:
  mode: all-courses
source_clusters:
- id: 1
  name: Informatics Principles Foundations (1)
course:
  id: 28011-A
  name: Logic Design T
topics:
  arithmetic_logic_circuits: Binary arithmetic circuits including half adders, full
    adders, n-bit adders, and arithmetic-logic units.
  asynchronous_sequential_logic: Analysis and synthesis of asynchronous sequential
    logic networks.
  binary_arithmetic: The four arithmetic operations performed in binary notation.
  binary_encoding: Binary encoding of information.
  boolean_algebra: Boolean algebra and logical functions.
  combinational_logic: Analysis and synthesis of combinational logic networks.
  combinational_standard_circuits: Design and use of standard combinational circuits
    including decoders, encoders, multiplexers, ROMs, and three-state buffers.
  finite_state_machines: Finite state machine models for representing sequential systems.
  karnaugh_maps: Gate-level minimization of Boolean functions using Karnaugh maps.
  latches_flip_flops: Binary memory elements for asynchronous sequential circuits,
    including SR latches, D latches, and D flip-flops.
  logic_gates_circuits: Boolean logic gates and circuit diagrams.
  programmable_logic: Programmable logic devices and their use in digital-system design.
  sequential_logic_circuits: Sequential circuit networks, including their basic design
    and operation.
  signed_binary_representation: Representation of unsigned and signed binary numbers,
    including two's-complement representation.
  synchronous_sequential_logic: Analysis and synthesis of synchronous sequential logic
    networks.
  synchronous_standard_circuits: Synchronous sequential circuits including registers,
    shift registers, synchronizers, and counters.
