analysis:
  mode: all-courses
source_clusters:
- id: 18
  name: Data Management Multimedia (18)
course:
  id: '77933'
  name: Multimedia Data Management M
topics:
  dimensionality_reduction: Dimensionality-reduction techniques used for multimedia-data
    presentation and exploration.
  index_based_multimedia_retrieval: Index-based algorithms and structures for efficient
    retrieval of multimedia data.
  multimedia_browsing: Browsing paradigms for exploring collections of multimedia
    data.
  multimedia_content_representation: Representation of multimedia content for management,
    retrieval, presentation, and exploration.
  multimedia_data_coding: Coding methods for representing multimedia data and content.
  multimedia_databases: Database-management systems designed to store and manage multimedia
    data.
  multimedia_information: Representation of multimedia information as covered in the
    course's multimedia-information material.
  multimedia_object_models: Description models for representing complex multimedia
    objects.
  multimedia_query_formulation: Query-formulation paradigms for expressing information
    needs over multimedia data.
  multimedia_retrieval_models: Retrieval models for finding multimedia data of interest.
  multimedia_semantic_annotation: Automatic techniques for assigning semantic annotations
    to multimedia data.
  multimedia_visualization: Visualization paradigms for presenting and exploring multimedia
    data.
  recommender_systems: Web recommender systems for suggesting multimedia or other
    content to users.
  relevance_feedback: Relevance-feedback techniques for improving the accuracy and
    relevance of multimedia retrieval results.
  search_engines: Use of search engines for internet-based research.
  semantic_web_architecture: Architecture, concepts, standards, and languages underlying
    the Semantic Web and Web of Data.
  sequential_multimedia_retrieval: Sequential algorithms for retrieving multimedia
    data.
  similarity_dissimilarity: Measures of similarity and dissimilarity used in data-mining
    analysis.
  social_networks: Social networks as Web-based communication and collaboration platforms.
  user_interface_design: Basic principles of user interface design.
