analysis:
  mode: all-courses
source_clusters:
- id: 4
  name: Internet Things Systems (4)
course:
  id: '72787'
  name: Mobile Application Programming
topics:
  android_activities: Android activities and their role in application development.
  android_architecture_components: Android platform architecture and application components.
  android_background_work: Background work in Android applications.
  android_camera: Camera use in Android mobile applications.
  android_data_management: Data management in Android applications.
  android_intents: Android intents for communication and navigation among application
    components.
  android_material_ui: Android user-interface elements and Material Design, including
    menus, dialogs, and toast notifications.
  android_resources: Resources used by Android applications.
  hybrid_mobile_applications: Introduction to hybrid mobile applications and their
    related technologies.
  ios_core_data: Core Data for data management in iOS applications.
  ios_swiftui: Programmatic iOS user-interface development with SwiftUI.
  ios_touch_gestures: Event handling, multi-touch interaction, and gesture recognition
    in iOS applications.
  mobile_app_design: Design considerations for native smartphone applications, including
    application architecture and graphical interfaces.
  mobile_mvvm_architecture: Model-View-ViewModel architecture for mobile applications.
  mobile_networking_services: Networking services used by mobile applications.
  mobile_pervasive_computing: Pervasive mobile-computing features involving maps and
    device sensors.
  swift_ios: Swift programming for iOS application development.
