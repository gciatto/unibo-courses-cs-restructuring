analysis:
  mode: all-courses
source_clusters:
- id: 29
  name: Informatics Informatic Humanities (29)
course:
  id: 08574-A
  name: Operating Systems
topics:
  concurrent_programming: The concurrent programming paradigm.
  cpu_scheduling: Operating-system CPU scheduling concepts and algorithms.
  deadlock_starvation_busy_waiting: Operating-system concurrency problems involving
    deadlock, starvation, and busy waiting.
  iaas_paas: Cloud service models including Infrastructure as a Service (IaaS), Platform
    as a Service (PaaS), and Software as a Service (SaaS).
  inter_process_communication: Mechanisms for communication and coordination between
    processes.
  io_management: Operating-system management of input and output operations and devices.
  linux_kernel: The Linux kernel as a case study in operating-system implementation.
  operating_systems_filesystems: Operating-system structure and main functions, together
    with basic file-system operations.
  os_introduction_history: The role, structure, objectives, and resource-management
    functions of operating systems as execution environments for programs.
  os_memory_management: Memory-management concepts and techniques in operating systems.
  processes_threads: Operating-system processes and threads, including their organization
    and execution.
  secondary_storage_management: Operating-system management of secondary memory and
    storage devices.
  shell_scripting: Shell use and shell scripting for interacting with and administering
    operating systems.
  virtualization_containers: Virtualization and container technologies, including
    Docker and Kubernetes.
