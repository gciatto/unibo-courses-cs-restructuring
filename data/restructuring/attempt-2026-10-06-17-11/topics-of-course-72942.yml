analysis:
  mode: all-courses
source_clusters:
- id: 0
  name: Security Information Cryptography (0)
course:
  id: '72942'
  name: Information Security M
topics:
  authentication: Authentication as a security goal and cryptographic mechanism.
  bitcoin: Basic operation of the Bitcoin platform as an example of blockchain technology.
  block_ciphers: Block ciphers, including their secure use and attacks arising from
    incorrect use.
  blockchain_technology: Principles of operation of blockchain technologies.
  cryptographic_hashes: Cryptographically secure hash functions and their use in cryptographic
    mechanisms.
  cryptographic_protocols: Basic protocols that use cryptographic techniques.
  cryptographic_security_foundations: Fundamental security issues arising in computer
    systems as addressed through cryptography.
  digital_certificates: Digital certificates used in cryptographic trust and authentication.
  ethereum: Basic operation of the Ethereum platform as an example of blockchain technology.
  federated_authentication: Federated authentication models and related protocols
    or systems.
  kerberos: Kerberos as an example of a Single Sign-On authentication system.
  key_distribution_centers: Key Distribution Centers as systems for distributing and
    managing cryptographic keys.
  key_management: Symmetric and asymmetric cryptographic key-management models and
    systems.
  oauth: OAuth as an example of a federated authentication protocol or system.
  openid: OpenID as an example of a federated authentication protocol or system.
  pgp: PGP for cryptographic protection and communication.
  pki: Public Key Infrastructure as a model and system for asymmetric key management.
  prng: Pseudorandom number generators, including pitfalls in their use for cryptographic
    applications.
  public_key_cryptography: Public-key cryptographic algorithms and their use.
  saml: SAML as an example of a federated authentication protocol or system.
  secret_key_cryptography: Secret-key cryptographic algorithms and their use.
  single_sign_on: Single Sign-On authentication models and related protocols or systems.
  stream_ciphers: Stream ciphers, including their secure use and attacks arising from
    incorrect use.
