analysis:
  mode: all-courses
source_clusters:
- id: 21
  name: Artificial Intelligence Fundamentals (21)
course:
  id: '95965'
  name: Artificial Intelligence and Machine Learning for Business
topics:
  business_data_exploration: Operational tools and techniques for exploring business
    data.
  business_mathematical_modeling: Methods for developing mathematical models for business
    problems and decisions.
  classification_models_general: Classification models and algorithms for assigning
    data instances to classes.
  clustering: Clustering techniques for data mining.
  data_mining_overview: General concepts, application scenarios, and supervised and
    unsupervised techniques in data mining.
  decision_making_processes: Structure and stages of the decision-making process.
  decision_support_systems: Classic and new-generation decision support systems for
    supporting business decision-making.
  dynamic_systems_sustainability: Concepts of dynamic systems and sustainability as
    foundations for business decision analysis.
  e_governance_business_tools: Operational e-governance tools applied to business
    contexts.
  esg_data_science_platforms: Data-science analytical platforms considered from an
    environmental, social, and governance perspective.
  esg_performance_monitoring: Co-design of monitoring systems for environmental, social,
    and governance business performance.
  evidence_based_decision_support: Operational techniques for implementing evidence-based
    decision support systems.
  machine_learning_basics: Basic machine-learning algorithms and methods used to develop
    intelligent applications.
  machine_learning_tools: Operational tools used to develop and apply machine-learning
    methods.
  recommender_systems: Web recommender systems for suggesting multimedia or other
    content to users.
  regression_models: Regression models and algorithms for predicting continuous outcomes.
  supervised_unsupervised_learning: Supervised and unsupervised machine-learning approaches.
