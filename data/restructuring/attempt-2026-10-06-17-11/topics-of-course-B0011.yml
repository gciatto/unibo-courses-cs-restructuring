analysis:
  mode: all-courses
source_clusters:
- id: 25
  name: Administration Systems System (25)
course:
  id: B0011
  name: Software Process Engineering
topics:
  automated_quality_assurance: Automated software-quality assurance, including automated
    testing across multiple platforms and targets.
  build_automation: Build automation tools and practices for automating software construction.
  code_generation: Automatic source-code generation in software factories and development
    environments such as Eclipse and IntelliJ.
  continuous_delivery: Continuous delivery and deployment practices for automatically
    preparing and releasing software.
  continuous_integration: Continuous Integration and delivery practices for integrating,
    validating, and delivering software changes.
  debugging_assertions: Debugging techniques for checking and diagnosing programs.
  distributed_version_control: Distributed version-control concepts and workflows,
    including Git repositories, commits, branches, merges, remotes, forks, pull requests,
    conflicts, and branching strategies.
  domain_driven_design: Domain-Driven Design concepts and practices, including domains,
    bounded contexts, ubiquitous language, entities, value objects, aggregates, repositories,
    services, factories, domain events, and anti-corruption layers.
  domain_specific_languages: Domain Specific Languages and related language-development
    environments for expressing domain models and software solutions.
  kotlin_multiplatform_programming: Multi-platform programming with Kotlin for targeting
    multiple platforms from shared code.
  kotlin_programming: Kotlin programming as a software-development language.
  model_driven_development: Model Driven Software Development using executable requirements
    and problem models, custom metamodels, and model-based development processes.
  open_source_software: Open Source Software principles and practices relevant to
    developing and sharing research software.
  performance_engineering: Software performance engineering, including performance
    analysis and improvement activities.
  service_orchestration: Orchestration of cloud services, including practical use
    of OpenStack and Kubernetes.
  software_licensing: Software licensing concepts and practices, including copyright,
    copyleft, proprietary and free software, ownership, and licenses such as MIT,
    Apache, and GPL.
  software_versioning: Software-versioning models and practices for managing and communicating
    software releases.
  virtualization_containers: Virtualization and container technologies, including
    Docker and Kubernetes.
