topics:
  a_star_path_planning: A* and related informed-search variants for robot path-planning
    problems.
  abstract_data_types: Abstract data types as specifications of data collections and
    their supported operations.
  abstract_machines: Abstract machines used to explain programming-language execution
    and implementation.
  access_databases: Creating and managing databases with Microsoft Access, including
    tables, relationships, and database interfaces.
  action_logic: Action logic for representing and reasoning about actions.
  activation_records: Stacks of activation records used to implement procedure calls
    and execution environments.
  active_database_programming: Database programming and active-database concepts for
    relational database management systems.
  actor_model: Actor-based concurrent and distributed programming, including Akka
    programming in Java or Scala.
  adc_quantization: Quantization levels, effective number of bits, resolution degradation
    in acquisition chains, and the effects of bandwidth and oversampling.
  additive_subtractive_manufacturing: Additive and subtractive manufacturing methods
    for physically realizing objects, including CNC-like machines such as 3D printers,
    CNC mills, and laser cutters.
  address_segmentation: Segmentation of addresses into logical and physical addresses
    in Intel architecture.
  adversarial_examples: Techniques for fooling neural networks through adversarial
    inputs.
  adversarial_search: Search strategies for problems involving adversaries, including
    search in competitive or game-like settings.
  agent_artifacts: Artifacts that support agent activities in multi-agent systems,
    including their functions and uses.
  agent_autonomy: Autonomy as a defining concept of agents in multi-agent systems.
  agent_based_simulation: Agent-based simulation methods.
  agentic_ai_systems: Agentic artificial-intelligence systems that autonomously select
    and execute actions.
  aggregate_computing: Aggregate-computing and macro-programming patterns for programming
    networks of devices and enabling self-organisation.
  agile_software_development: Agile software-development principles and practices.
  agricultural_iot_data_transfer: Data-transfer technologies used to connect and communicate
    with Internet of Things devices in open-field agricultural settings.
  ai_assisted_translation: Generative-artificial-intelligence functionalities used
    to support translation and revision workflows.
  ai_code_generation: Use of AI-generated code technologies within software-development
    environments and model-driven development workflows.
  ai_driven_interaction: AI-driven interaction paradigms, including their rationale,
    vision, contemporary examples, and development tools.
  ai_epistemology_ethics: Philosophical, epistemological, and ethical issues concerning
    artificial intelligence and cognitive science.
  ai_for_cybersecurity_management: Use of artificial-intelligence tools to support
    cybersecurity management, with declared use and shared results.
  ai_introduction: Introduction to artificial intelligence, including its history,
    main application fields, and core principles and methods.
  ai_medicine: Introductory artificial intelligence concepts and applications in medicine.
  ai_ml_for_big_data: Introductory Artificial Intelligence and Machine Learning concepts
    and tools considered in relation to Big Data and agricultural applications.
  ai_paradigms: Use of artificial-intelligence paradigms in fashion e-commerce platforms.
  ai_planning: Planning problems as a class of artificial-intelligence problem-solving
    tasks.
  ai_problem_solving: AI problem solving through state-based representation, games,
    constraint satisfaction problems, and planning problems.
  ai_program_synthesis: AI-based program synthesis, including the use of large language
    models for software testing and program completion.
  ai_safety_alignment: Open problems in autonomous and intelligent systems concerning
    safety, value alignment, super-intelligence, controllability, and self-awareness.
  ai_search_strategies: Search-based problem solving in artificial intelligence using
    informed and uninformed search strategies.
  ai_tools_software_development: Opportunities and limitations of applying artificial-intelligence
    tools to software development.
  ai_vba_generation: Using an AI system to generate VBA macros for Excel and incorporating
    the generated code into spreadsheets.
  algorithm_design_analysis: Design and analysis of algorithms for solving programming
    problems.
  algorithm_notations: Representing algorithms using pseudocode and flow diagrams.
  algorithm_selection_configuration: Automatic selection and configuration of algorithms
    for data-analytics and artificial-intelligence methods.
  algorithmic_decision_elsi: Ethical, legal, and social implications of algorithm-driven
    decisions, including human factors in evaluating such systems.
  algorithmic_game_theory: Algorithmic game-theory concepts applied to multi-agent
    learning systems.
  algorithmic_problem_solving: Algorithmic approaches to solving problems with computers
    using the imperative programming paradigm.
  algorithms_and_programs: Algorithms and programs in the context of introductory
    C++ programming.
  algorithms_programming_basics: Basic principles of algorithms and programming.
  anatomical_3d_modeling: Technologies and software for three-dimensional modeling
    of anatomical structures and customized medical devices.
  android_activities: Android activities and their role in application development.
  android_architecture_components: Android platform architecture and application components.
  android_background_work: Background work in Android applications.
  android_camera: Camera use in Android mobile applications.
  android_compose_ui: Programmatic Android user-interface development with Compose.
  android_data_management: Data management in Android applications.
  android_fragments_navigation: Android fragments and navigation between application
    screens.
  android_intents: Android intents for communication and navigation among application
    components.
  android_material_ui: Android user-interface elements and Material Design, including
    menus, dialogs, and toast notifications.
  android_power_management: Android power management and wakelocks.
  android_resources: Resources used by Android applications.
  android_setup: Setting up the Android development environment and tools.
  android_threading_model: Android application threading and execution models.
  android_views_layouts_events: Android views, layouts, and event handling.
  anomaly_detection: Detection of anomalous behavior in industrial systems and data.
  ant_colony_optimization: Ant-colony optimization methods inspired by ant foraging
    behavior.
  antconc_terminology_analysis: Use of AntConc as a basic tool for detecting and analysing
    terminology in specialised corpora.
  anti_forensics: Anti-computer-forensics techniques intended to hinder or undermine
    forensic investigations.
  antlr_framework: Using the ANTLR framework to build language tools, including lexical
    and syntactical analysis components.
  aperiodic_server_strategies: Polling, deferrable, priority exchange, sporadic, constant
    utilization, and total bandwidth servers for improving the response time of soft
    real-time aperiodic tasks.
  aperiodic_task_scheduling: Scheduling of aperiodic tasks in real-time systems.
  api_documentation: Designing and documenting Web APIs with specifications and tools
    such as OpenAPI and Swagger.
  application_portfolio_management: Analysis and classification of software modules
    within an enterprise information-system application portfolio.
  application_security: Security considerations and protective practices for web and
    mobile applications.
  application_server_clustering: Clustering mechanisms and configuration for highly
    scalable enterprise applications in JBoss or WildFly.
  application_servers: Application-server platforms such as JBoss and WildFly for
    deploying and running distributed enterprise applications.
  approximate_algorithms: Approximate algorithms for computational problems where
    exact solutions may be impractical.
  approximate_model_checking: Approximate model-checking techniques for validating
    complex or probabilistic systems.
  approximate_string_matching: Algorithms for finding inexact string or pattern matches
    while allowing discrepancies.
  ar_vr_applications: Applications of virtual and augmented reality.
  ar_vr_avatars: Avatars used to represent users or participants in virtual and augmented
    reality environments.
  ar_vr_future_directions: Future directions and emerging developments in virtual
    and augmented reality.
  ar_vr_platforms: Augmented- and virtual-reality platforms and solutions used to
    support immersive applications.
  archaeological_digital_surveying: Digital documentation and surveying of archaeological
    sites using total stations, laser scanners, GNSS receivers, and related techniques,
    including challenges posed by site extent and preservation conditions.
  archaeological_virtual_reconstruction: Evidence-based methodology for reliable virtual
    reconstruction of archaeological objects or contexts, including information collection
    and analysis, 2D representation, 3D model development, and planning public presentation.
  archaeological_web_information_systems: Server-web information systems for archiving
    and multimedia representation of archaeological data.
  architectural_patterns: Advanced architectural patterns for structuring and designing
    software systems.
  architectural_requirements: Architecturally significant requirements used to guide
    software-architecture decisions and evaluation.
  architecture_comparison: Comparison of computer architecture approaches.
  architecture_evolution: Evolution of software architectures through the design,
    implementation, evaluation, documentation, and ongoing adaptation of architectural
    solutions.
  architecture_performance_impact: The impact of computer architecture on system performance.
  arduino_programming: Programming the Arduino UNO microcontroller platform using
    introductory C++ and the Wiring framework.
  arithmetic_logic_circuits: Binary arithmetic circuits including half adders, full
    adders, n-bit adders, and arithmetic-logic units.
  arp: Address Resolution Protocol for mapping IP addresses to link-layer addresses.
  arq_protocols: Automatic Repeat reQuest protocols for achieving reliable communication
    over unreliable channels.
  array_algorithms: Algorithms on arrays, including reversal, ordering, and searching.
  array_oriented_computing: Array-oriented computing for scientific applications,
    as covered using Python.
  assignment_and_io: Assignment operations and input/output in C++.
  association_rules: Association-rule mining.
  associative_learning: Associative learning methods for robot adaptation and learning.
  asymptotic_analysis: Discrete-mathematics notions for estimating the order of magnitude
    and computational cost of algorithms.
  async_futures: Task-oriented asynchronous programming using future mechanisms.
  async_web_notifications_workflows: Asynchronous notifications and workflows in Web
    applications.
  asynchronous_sequential_logic: Analysis and synthesis of asynchronous sequential
    logic networks.
  atlas_iot_architecture: The Atlas IoT architectures and middleware, including Atlas
    1.0 SODA middleware and the Atlas 2.0 IoT Thing Architecture.
  attention_mechanisms: Attention mechanisms for visual and language representations,
    including their use in vision Transformers and image-classification architectures.
  augmented_reality: Introductory overview of augmented reality.
  authentication: Authentication as a security goal and cryptographic mechanism.
  authorization: Authorization as a cybersecurity mechanism for controlling access
    to resources or actions.
  autocad_2d_drawing: Use of AutoCAD for two-dimensional landscape-design drawing,
    including the interface, units, layers, line types, properties, object snaps,
    grips, text, dimensions, blocks, and image insertion.
  autoencoders: Autoencoder architectures and methods in deep learning.
  automated_quality_assurance: Automated software-quality assurance, including automated
    testing across multiple platforms and targets.
  automated_reasoning: Fundamental concepts and techniques for automated reasoning
    using logical representations.
  automatic_decision_systems: Characteristics of activation and the logical-functional
    architecture of automatic decision systems.
  automatic_differentiation: Automatic differentiation techniques for computing derivatives
    in deep-learning models.
  automatic_robot_program_design: Automatic design of programs for controlling robots.
  autonomous_mobile_robots: Development of relatively autonomous mobile robotic applications
    operating in virtual or real environments.
  autonomous_vehicle_decision_planning_control: Decision-making, planning, and control
    methods for autonomous vehicular systems, including laboratory work with these
    functions.
  autonomous_vehicle_sensing_perception: Sensing and perception components and architectures
    for autonomous vehicular systems.
  autonomous_vehicle_system_architecture: Requirements analysis and selection of sensing,
    perception, communication, and computation architectures for autonomous systems.
  axiomatic_set_theory: ZF axiomatic set theory, relations, functions, quotients,
    cardinality, and Cantor's Theorem.
  backpropagation: Backpropagation as the typical training algorithm for deep neural
    networks.
  backtracking_algorithms: Backtracking as an algorithmic technique for systematically
    exploring and pruning candidate solutions.
  bag_of_visual_words: Bag-of-Visual-Words representations for digital images.
  bagging_ensemble_learning: Bagging ensemble-learning methods for combining predictions
    from multiple models.
  basic_programming_operations: Basic operations used when writing and executing introductory
    programs and scripts.
  bayesian_approaches: Bayesian approaches to machine learning covered as part of
    the course's symbolic and sub-symbolic methods.
  bayesian_classifiers: Bayesian methods for classification.
  bayesian_network_classification: Classification using Bayesian networks.
  bayesian_network_reasoning: Representation and reasoning with Bayesian networks.
  bee_colony_optimization: Bee-colony optimization methods inspired by the collective
    behavior of bees.
  behavior_based_control: Behavior-based robotics paradigms for coordinating multiple
    robot behaviors.
  behavior_change_models: Behavioral-change models used to understand and support
    user engagement and convergence in digital-health systems.
  behavior_driven_development: Behavior-Driven Development (BDD) and its use in specifying
    and testing software behavior.
  behavior_trees: Behavior trees for structuring and controlling robot behaviors.
  benchmarking: Benchmarking methods for evaluating service performance.
  bi_report_sharing: Techniques for sharing Business Intelligence and Business Analytics
    reports.
  bi_reporting: Reporting as a business-intelligence technique for analyzing enterprise
    data.
  bibliography_management: Building and managing bibliographies using scholarly databases
    and search services such as Google Scholar and Scopus.
  big_data_management: Introductory approaches and technologies for managing big data
    as alternatives or complements to relational databases.
  big_data_processing_modes: Batch, interactive, and streaming processing and analysis
    methodologies for Big Data systems.
  big_data_revolution: The Big Data Revolution and its implications for enterprise
    data strategies and technologies.
  binary_arithmetic: The four arithmetic operations performed in binary notation.
  binary_encoding: Binary encoding of information.
  binary_exploitation: Exploitation of vulnerabilities in binary code, including buffer
    overflows, shellcoding, and return-to-libc attacks.
  binary_search: Binary-search algorithms for locating elements in ordered data.
  binary_search_trees: Binary search trees and binary balanced search trees.
  binary_trees: Binary trees as an abstract data type, including their structure and
    use in Python programming.
  bio_inspired_adaptive_systems: Bio-inspired approaches to designing adaptive systems.
  biological_data_types: Types of biological data and suitable data structures for
    representing and analyzing them.
  bisimulation: Bisimulation and related behavioral equivalences, including language,
    trace, isomorphism, place, structure-preserving, and team bisimulation.
  bitcoin: Basic operation of the Bitcoin platform as an example of blockchain technology.
  bits_bytes: Bits and bytes as basic units for representing and transferring information.
  block_ciphers: Block ciphers, including their secure use and attacks arising from
    incorrect use.
  block_storage: Block-storage technologies for distributed and virtualized systems,
    including iSCSI.
  blockchain_anonymity: Anonymity considerations in blockchain and cryptocurrency
    systems.
  blockchain_attacks: Attacks against blockchain systems and networks.
  blockchain_mining: Mining processes used in blockchain networks.
  blockchain_technology: Principles of operation of blockchain technologies.
  blockchain_transactions: Blockchain transactions and transaction scripting languages.
  bluetooth_networking: Bluetooth protocol stack, topologies, discovery, scatternets,
    multi-hop communication, and Bluetooth programming support.
  bnf: Backus-Naur Form for specifying programming-language syntax.
  boolean_algebra: Boolean algebra and logical functions.
  boolean_satisfiability: The Boolean Satisfiability problem as a general-purpose
    approach to combinatorial decision making and optimization.
  boosting_ensemble_learning: Boosting as an ensemble-learning method, introduced
    for object-detection applications.
  bootcat_corpus_building: Use of BootCaT to construct electronic specialised corpora
    for terminology work.
  branch_and_bound: Branch-and-bound techniques for search and optimization in artificial-intelligence
    problem solving.
  branch_prediction: Branch prediction for handling control hazards in pipelined CPUs.
  brute_force_algorithms: Brute-force approaches to solving algorithmic problems through
    systematic exploration of possible solutions.
  build_automation: Build automation tools and practices for automating software construction.
  burrows_wheeler_transform: The reversible Burrows-Wheeler transform and its applications
    in string processing.
  bus_cycles: Processor PC and bus cycles and their role in computer operation.
  bus_hierarchy_protocols: Bus hierarchies and bus protocols in computer system architectures.
  business_case_development: Development of business cases for digital innovation
    challenges.
  business_data_exploration: Operational tools and techniques for exploring business
    data.
  business_data_modeling: Data-modeling techniques for organizing corporate data used
    in Business Intelligence and Business Analytics reports.
  business_intelligence_overview: Role of business intelligence in the corporate information
    system and the structure of the BI pyramid.
  business_mathematical_modeling: Methods for developing mathematical models for business
    problems and decisions.
  business_plan_development: Development of business plans for digital transformation
    initiatives.
  business_process_agents: Artificial agents applied to productivity and business
    processes.
  business_process_modeling_bpmn: Modeling business processes with Business Process
    Model and Notation (BPMN).
  business_process_reengineering: Business Process Reengineering methods and projects
    for redesigning organizational processes.
  c_arrays: Arrays in the C programming language.
  c_arrays_matrices: Arrays and matrices in C, including their memory representation.
  c_command_line_arguments: Processing command-line arguments and command-line input
    in C programs.
  c_control_flow: Control-flow structures and cycles in the C programming language.
  c_data_structures: Fundamental and complex data structures used in C programming.
  c_data_types: Data types in the C programming language.
  c_file_handling: File-handling functions in C.
  c_functions: Library functions and user-defined functions in C.
  c_headers_libraries: Inclusion and use of headers and libraries in C programs.
  c_input_output: Input and output functions in C.
  c_linked_lists: Linear list data structures and their construction, search, and
    sorting in C.
  c_memory_management: Direct memory-management functions in C.
  c_memory_organization: Computer memory organization in C, including addresses, words,
    and memory representation.
  c_operators_expressions: Types, values, operators, and expressions in the C programming
    language.
  c_parameter_passing: Parameter passing in C functions.
  c_pointers: Pointers and pointer arithmetic in C.
  c_program_structure: The structure of C programs.
  c_queues: Queue data structures and their management in C.
  c_runtime: The C runtime environment and its role in embedded firmware execution.
  c_stacks: Stack data structures and their management in C.
  c_string_functions: String functions in C.
  c_strings: Character strings in the C programming language.
  c_structures: Structures in the C programming language, including their definition
    and use with scalar values, arrays, and dynamically allocated memory.
  c_trees: Tree data structures in C.
  c_vectors: Vectors as algebraically specified and implemented data structures in
    C.
  cache_coherence: Memory coherence in shared-memory multiprocessor systems using
    the MESI protocol.
  cache_mapping_policies: Cache address mapping, write policies, replacement policies,
    and related implementation techniques.
  cad_technical_drawing: Basic use of computer-aided design tools for representing
    buildings and architectural components, producing technical drawings, and preparing
    drawings for screen display and printing.
  camera_calibration: Camera calibration using intrinsic and extrinsic parameters,
    lens-distortion correction, planar targets, homography estimation, and Zhang's
    algorithm.
  cap_theorem: The CAP theorem in the context of non-relational and Big Data database
    management systems.
  capacity_planning: Planning service capacity to support performance, scalability,
    and reliability requirements.
  card_sorting: Card-sorting activities for organizing content and understanding users'
    conceptual groupings in interactive-media design.
  carla_simulation: Hands-on modeling and experimentation with autonomous and connected
    vehicular systems using the CARLA simulator.
  cartographic_projections: Fundamental cartographic projections used in numerical
    cartography.
  case_mix_classification: Case-mix classification systems used to classify and organize
    healthcare activity and patient cases.
  cat_mt_integration: Integration of computer-assisted translation tools with machine-translation
    systems and related generative translation functions.
  cat_tools: Use of proprietary and free computer-assisted translation tools, including
    Trados Studio, MemoQ, and MateCat.
  ccs: The Calculus of Communicating Systems, including its syntax and structural
    operational semantics.
  cellular_networks_handoff: Cellular-network architecture and handoff procedures,
    including GSM, common and differentiated MSC configurations, and handoff classification.
  central_tendency: Measures of distribution center, including the mean, median, and
    mode.
  centralized_configuration_management: Centralized configuration of distributed systems,
    services, and applications, including dynamic configuration support.
  centralized_monitoring: Centralized monitoring of distributed systems and services
    using monitoring applications such as Nagios.
  certified_programming: Certified programming techniques and case studies involving
    numbers, lists, and sized vectors.
  change_management: Managing changes affecting services and their operation.
  channel_communication: Channel-based message passing, including communication implemented
    in the Go language.
  character_encodings: Character encodings used to represent text in web documents
    and communications.
  chatbot_generation: Generation of chatbots using text-mining and language-model
    tools.
  chemical_oriented_models: Chemical-oriented models for representing and modelling
    complex software systems.
  chip_manufacturing: Computer chips and their production as part of computer hardware
    technology.
  chomsky_hierarchy: Chomsky classification of formal grammars and the corresponding
    language classes.
  cim_systems: Computer Integrated Manufacturing (CIM) systems as a category of enterprise
    information systems.
  circuit_packet_switching: Circuit-switched and packet-switched network communication.
  classic_image_representation: Classic computer-vision techniques for representing
    and processing images.
  classification_models: Predictive data analysis using classification models in Python.
  classification_models_general: Classification models and algorithms for assigning
    data instances to classes.
  classless_object_oriented: Classless object-oriented programming and its underlying
    object-model principles.
  clean_code: Rules and practices for writing clean, effective, and maintainable code.
  client_server_model: Client/server interaction and the design of small client/server
    applications.
  client_side_frameworks: Introduction to client-side Web frameworks, including Vue,
