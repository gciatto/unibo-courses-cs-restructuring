    usability-design process.
  usability_testing: Designing and conducting usability tests to gather feedback and
    iterate on a service concept.
  user_authorization: User authorization within clinical information-system workflows.
  user_centered_design: User-centered design and the relationship between human-computer
    interaction, user experience, and product development.
  user_interface_design: Basic principles of user interface design.
  user_journey_mapping: User journey maps for representing and contextualizing users'
    interactions with a service.
  user_level_operating_systems: User-level operating systems, with VUOS as the course
    example.
  user_research_methods: Qualitative user-research methods including semi-structured
    interviews, contextual inquiry, observation, and research planning.
  user_studies: Basic user-study methods for evaluating interactive applications and
    interfaces.
  ux_for_complex_systems: Application of User Experience Design principles and evaluation
    to complex systems, including AI systems.
  value_based_learning: Value-based learning methods for robot adaptation and decision-making.
  variability_measures: Measures used to describe variability in statistical distributions.
  variance_partitioning: Partitioning variance to separate signal from noise in complex
    human-domain data.
  vba_macros: Automating Excel data-processing tasks with VBA macros, including insertion,
    verification, debugging, and best practices.
  vc_dimension: VC-dimension as a measure used in computational learning theory.
  vector_databases: Vector databases used to store and retrieve embedding-based representations
    for knowledge-enhanced language-model applications.
  vector_graphics: Vector graphics concepts including graphic primitives, drawing
    and modification tools, layers, line styles and weights, vector and raster formats,
    and graphic-layout preparation.
  vectors_tensors: Vectors and tensors introduced as data structures for organizing
    data in programs.
  vehicular_application_scenarios: Vehicular application scenarios ranging from Advanced
    Driver Assistance Systems to fully autonomous driving, including their evolution.
  vehicular_communications: Vehicle-to-vehicle (V2V) and vehicle-to-infrastructure
    (V2I) communication challenges, opportunities, examples, and deployments.
  vehicular_mobility_propagation: Effects of vehicular mobility and wireless-propagation
    conditions on the performance of vehicular systems.
  verilog_design_flow: Introduction to the digital-design flow using the Verilog hardware-description
    language.
  version_control_systems: Version control systems used in software development.
  video_industry_value_chain: Value-chain organization and player typologies in the
    video industry, including effects of technological evolution and changing consumer
    habits on market dynamics and structure.
  video_object_tracking: Detection and tracking of objects in video.
  virtual_channels_networks: Virtual channels using MPLS and virtual networks using
    VLANs.
  virtual_devices: Structure and implementation of virtual devices.
  virtual_file_systems: Structure and implementation of virtual file systems.
  virtual_machine_forensics: Forensic investigation of virtual machines.
  virtual_machines: Structure and implementation of virtual machines.
  virtual_memory: Virtual-memory organization and management, including paging, to
    support efficient program execution.
  virtual_networking_stacks: Virtual networking stacks, including the Internet of
    Threads (IoTh).
  virtual_networks: Structure and implementation of virtual networks.
  virtual_reality: Introduction to virtual reality.
  virtual_restoration: Virtual restoration of cultural heritage objects using digital
    three-dimensional reconstruction and modeling.
  virtual_tours: Virtual tours as a digital technology for communicating cultural
    heritage.
  virtuality_introduction: Introduction to virtuality in the context of virtual systems.
  virtualization_containers: Virtualization and container technologies, including
    Docker and Kubernetes.
