analysis:
  mode: all-courses
source_clusters:
- id: 7
  name: Informatica Computer Science (7)
course:
  id: '85285'
  name: Programming
topics:
  algorithms_programming_basics: Basic principles of algorithms and programming.
  asymptotic_analysis: Discrete-mathematics notions for estimating the order of magnitude
    and computational cost of algorithms.
  debugging_assertions: Debugging techniques for checking and diagnosing programs.
  dynamic_programming: Dynamic programming as an algorithm design technique.
  environment_scoping: Programming-language environments, scoping rules, and their
    implementation.
  exceptions: Exception mechanisms in programming languages.
  experimental_data_statistics: Statistical interpretation of experimental data, including
    awareness of misleading or deceptive statistical presentations.
  functional_parameters: Functional parameters in programming languages.
  fundamental_data_structures: Introductory fundamental data structures considered
    alongside algorithms and programming.
  immutable_mutable_objects: Immutable and mutable objects in Python.
  machine_learning_basics: Basic machine-learning algorithms and methods used to develop
    intelligent applications.
  monte_carlo_simulation: Monte Carlo simulation methods that use repeated random
    sampling to estimate quantities or study outcomes.
  object_oriented_programming: Introduction to the object-oriented programming paradigm
    in practical lectures.
  oo_classes_objects: Classes and objects in the object-oriented programming paradigm.
  probability_distributions: Probability distributions used to represent and reason
    about random quantities in computational programs.
  python_data_structures: Data structures used in Python programming, as introduced
    alongside Python data types, control flow, functions, and libraries.
  python_data_types: Basic Python data types and their use in solving problems.
  python_functions: Functions in the Python programming language.
  python_programming_basics: Introduction to programming in Python.
  python_variables_expressions: Variables and expressions in Python programming.
  sampling_confidence_intervals: Sampling methods and confidence intervals for quantifying
    uncertainty in estimates.
  software_testing: Testing activities for software systems.
  stochastic_programming: Programming with stochastic behavior, including the use
    of randomness in computational procedures.
