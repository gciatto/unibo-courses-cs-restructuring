analysis:
  mode: all-courses
source_clusters:
- id: 4
  name: Internet Things Systems (4)
course:
  id: B5722
  name: Embedded Sensors
topics:
  adc_quantization: Quantization levels, effective number of bits, resolution degradation
    in acquisition chains, and the effects of bandwidth and oversampling.
  embedded_networks: Networks of embedded systems, including their models, architectures,
    communication protocols, and wireless technologies.
  embedded_spectral_sensors: Embedded spectral sensors as an application of sensor
    data analysis and machine-learning-oriented dimensionality reduction.
  feedback_sensor_design: Feedback-based sensor design and concrete feedback-sensor
    examples.
  information_theory_basics: Fundamental concepts of information and entropy.
  multivariate_analysis: Multivariate sensor-data analysis using multiple variables,
    scatter plots, and correlation matrices.
  partial_least_squares: Partial Least Squares (PLS) for reducing or modeling sensor
    outputs.
  predictive_models: Predictive models for embedded sensors, including comparison
    of measured and predicted measurements.
  principal_component_analysis: Principal Component Analysis for dimensionality reduction.
  random_processes: Random signals, power and correlation functions, and random and
    ergodic processes as tools for sensor-signal analysis.
  sensor_acquisition_chains: Sensor acquisition chains, gain plots, analog-to-digital
    conversion, signal bandwidth, oversampling, and non-aliasing filters.
  sensor_measurement_fundamentals: Sensor measurements, operating modes, distributions,
    estimation, DC and AC measurements, digits and full-scale, measurement errors,
    resolution, precision, and accuracy.
  sensor_modeling: Ideal and non-ideal sensor models, black-box interfaces, quasi-static
    functions, sensitivity, spatial and temporal quantization, bandwidth, and uncertainty
    modeling.
  sensor_networks: Embedded sensor networks and their communication and networking
    concepts.
  sensor_tradeoffs: Trade-offs among sensor-system design characteristics illustrated
    through sensor design examples.
  serial_communication_protocols: Serial communication protocols for interfacing electronic
    components and systems, including OneWire, I2C, SPI, and UART.
  signal_noise_analysis: Comparison of signal and noise using minimum detectable signal,
    signal-to-noise ratio, dynamic range, power spectral distributions, and systematic-error
    models.
  smart_sensors: Operating principles and characteristics of smart sensors for collecting
    data in Internet of Things applications.
  wireless_networking: Wireless networking and its relationship to Internet communication.
