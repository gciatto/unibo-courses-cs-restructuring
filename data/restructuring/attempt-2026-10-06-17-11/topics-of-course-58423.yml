analysis:
  mode: all-courses
source_clusters:
- id: 15
  name: Network Networks Programming (15)
course:
  id: '58423'
  name: Internet Architecture
topics:
  client_server_model: Client/server interaction and the design of small client/server
    applications.
  email_protocols: Internet email protocols including SMTP, POP, and IMAP.
  http_protocols: HTTP protocols used in distributed-system and network communication.
  internet_applications: Prominent Internet applications including email, news, chat,
    and the World Wide Web.
  internet_routing: Routing mechanisms and organization used to move packets through
    the Internet.
  internet_security_privacy: Introductory security and privacy considerations in Internet
    communication.
  internet_www: The Internet and World Wide Web.
  internetworking_fundamentals: Fundamentals and organization of internetworks, including
    the structure of the Internet and communication across LAN, WAN, and MAN environments.
  link_layer_protocols: Link-layer and access protocols including Ethernet, IEEE 802.11,
    HDLC, PPP, ARP, and RARP.
  network_layer_architecture: Layered organization of network communication, including
    MAC, transport, and application layers.
  network_protocols: Introduction to protocols used in computer networks.
  p2p_file_sharing: Peer-to-peer networking as used for Internet file sharing.
  tcp_ip_protocols: TCP/IP protocol connections and common synchronous and asynchronous
    applications.
  wireless_networking: Wireless networking and its relationship to Internet communication.
