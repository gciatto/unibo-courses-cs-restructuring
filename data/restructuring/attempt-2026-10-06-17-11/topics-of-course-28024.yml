analysis:
  mode: all-courses
source_clusters:
- id: 15
  name: Network Networks Programming (15)
course:
  id: '28024'
  name: Computer Networks T
topics:
  client_server_model: Client/server interaction and the design of small client/server
    applications.
  computer_networks: Basic computer-network concepts.
  distributed_communication: Communication mechanisms and concepts for distributed
    systems.
  distributed_file_systems: File-system concepts and tools in distributed operating
    systems.
  distributed_operating_systems: Distributed operating-system concepts and tools.
  distributed_resource_management: Resource management in distributed operating systems
    and distributed applications.
  distributed_systems: Fundamental concepts of distributed systems.
  dns: DNS and advanced name systems used in distributed environments.
  message_passing: Concurrent message-passing models based on synchronous and asynchronous
    communication.
  network_sockets: Sockets and related C/UNIX and Java APIs for implementing TCP/IP
    client/server interactions.
  osi_model: ISO OSI layered organization, including network, transport, session,
    presentation, and application layers.
  resource_naming: Resource naming in distributed operating systems, including DNS
    and advanced naming systems.
  rpc: Distributed programming using remote-procedure-call-like models, including
    Java RMI.
  shared_memory_synchronization: Shared-memory interaction mechanisms for concurrent
    programs, including semaphores and monitors.
  tcp_ip_protocols: TCP/IP protocol connections and common synchronous and asynchronous
    applications.
