source_clusters:
- id: 20
  name: Language Natural Processing (20)
course:
  id: '87901'
  name: Methods and Advanced Technologies for Interpreting
topics:
  live_subtitling: Techniques for producing intralingual live and real-time subtitles
    from oral or audiovisual material, including subtitles intended for deaf audiences.
  speech_recognition_software: Use of speech-recognition software to convert spoken
    input into written text for interpreting and live-subtitling workflows, including
    DIT.tafono and Dragon NaturallySpeaking.
  terminography_software: Terminographic software for creating, managing, and consulting
    glossaries and terminology databases, including MultiTerm, Interplex, and InterpretBank.
  terminology_database_management: Building and managing glossaries and terminology
    databases needed for interpreting oral speeches.
