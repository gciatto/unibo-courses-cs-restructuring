topics:
  ai_introduction: Introduction to artificial intelligence, including its history,
    main application fields, and core principles and methods.
  computer_history: Historical development of computers as introduced alongside computer
    architecture.
  formal_ontologies: Introductory notions of formal ontologies for knowledge representation.
  informatics_basics: Basic concepts of informatics as introduced in the course.
  internet_www: The Internet and World Wide Web.
  knowledge_graphs: Knowledge graphs in the Web of Data, including their conceptual
    foundations and use for representing and integrating knowledge.
  ontology_design_methodologies: Methodologies for designing ontologies, including
    systematic approaches to ontology development and engineering.
  semantic_web_architecture: Architecture, concepts, standards, and languages underlying
    the Semantic Web and Web of Data.
  web_markup_languages: Web markup and styling languages including XHTML, XML, HTML5,
    and CSS.
