analysis:
  mode: all-courses
source_clusters:
- id: 29
  name: Informatics Informatic Humanities (29)
course:
  id: '39176'
  name: Basic and Laboratory Informatics
topics:
  access_databases: Creating and managing databases with Microsoft Access, including
    tables, relationships, and database interfaces.
  clinical_data_archiving: Archiving data from clinical pathology, pathological anatomy,
    and transfusion medicine.
  collaborative_tools: Collaborative tools used on the Web.
  computer_networks: Basic computer-network concepts.
  conceptual_database_design: Requirements analysis and conceptual database design
    for relational databases.
  data_presentation_slides: Importing research data into presentation software and
    creating slides to present processed spreadsheet data to a board.
  database_architectures: Architectural organization of database systems, including
    client-server relational systems and introductory distributed and cloud database
    systems.
  database_queries: Formulating and using queries when managing databases.
  digital_signal_processing: Processing EEG signals using digital techniques.
  eeg_signal_digitization: Acquisition of bioelectric EEG signals and their conversion
    into digital numerical representations.
  eeg_visualization_storage: Visualization and storage of EEG signals.
  internet_www: The Internet and World Wide Web.
  it_security: Basic IT security issues, including personal-data and file protection,
    viruses, and phishing.
  medical_document_lifecycle: Dematerialization of clinical-health documents, their
    information-technology life cycle, and preservation requirements for medical documents
    in public health organizations.
  neurophysiology_information_systems: Functional requirements of computer systems
    and services supporting a Neurophysiology Information System.
  productivity_software: Personal productivity tools for word processing, spreadsheets,
    and presentations, including Microsoft Word, Excel, and PowerPoint.
  relational_model: Structure and principles of the relational data model.
  search_engines: Use of search engines for internet-based research.
  social_networks: Social networks as Web-based communication and collaboration platforms.
  spreadsheet_data_analysis: Organizing, summarizing, processing, analyzing, and representing
    biometric and clinical data with spreadsheet software, including spreadsheet operations
    and functions.
  spreadsheet_import_export: Importing and exporting spreadsheet data, including exporting
    data to the R platform for statistical analysis and handling data formats.
  web_evolution: The development of the Web from Web 1.0 to Web 2.0.
  web_information_retrieval: Information-retrieval techniques applied to Web information.
