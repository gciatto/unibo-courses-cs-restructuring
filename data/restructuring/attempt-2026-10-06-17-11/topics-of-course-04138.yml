analysis:
  mode: all-courses
source_clusters:
- id: 25
  name: Administration Systems System (25)
course:
  id: 04138
  name: Programming Languages
topics:
  abstract_machines: Abstract machines used to explain programming-language execution
    and implementation.
  activation_records: Stacks of activation records used to implement procedure calls
    and execution environments.
  bnf: Backus-Naur Form for specifying programming-language syntax.
  closures: Closures and their role in programming-language implementation.
  compilers: Compilers as implementation mechanisms for programming languages.
  concurrent_programming: The concurrent programming paradigm.
  context_free_grammars: Context-free grammars, including their equivalences and principal
    theorems such as the pumping theorem.
  environment_scoping: Programming-language environments, scoping rules, and their
    implementation.
  exceptions: Exception mechanisms in programming languages.
  finite_automata: Finite automata, their equivalence with regular-language formalisms,
    and results such as the pumping lemma.
  functional_parameters: Functional parameters in programming languages.
  functional_programming_scala: The functional programming paradigm as illustrated
    through Scala.
  garbage_collection: Garbage collection as a programming-language memory-management
    technique.
  grammar_parsing: Algorithms for parsing deterministic context-free grammars.
  heap_memory: Heap memory as part of programming-language runtime implementation.
  inheritance: Inheritance in object-oriented programming.
  interpreters: Interpreters as implementation mechanisms for programming languages.
  language_evolution: The evolution of programming languages from assembly languages
    to higher-level languages.
  language_pragmatics_implementation: Pragmatics and implementation considerations
    in the description of programming languages.
  language_semantics: The semantics of programming languages as part of their formal
    description.
  language_syntax: The syntax of programming languages as part of their formal description.
  late_binding: Late binding in the object-oriented programming paradigm.
  lex: The Lex tool for generating lexical analysers.
  lexical_analysis: Design of lexical analysers for programming languages.
  ll1_parsing: LL(1) grammars and parsing.
  logical_programming: The logical programming paradigm.
  lr_parsing: LR(0), SLR, LR(1), and LALR(1) grammars and parsing methods.
  oo_classes_objects: Classes and objects in the object-oriented programming paradigm.
  oo_initialization: Initialization of objects in the object-oriented programming
    paradigm.
  parameter_passing_modes: Parameter-passing mechanisms including by value, by reference,
    by result, and by name.
  procedures: Procedures and their implementation in programming languages.
  pushdown_automata: Push-down automata and their equivalence with context-free grammars.
  recursion: Recursion and recursive procedures in programming languages.
  regular_expressions: Regular expressions and their relationship to regular-language
    formalisms.
  regular_grammars: Regular grammars, including their equivalences and principal theorems.
  sequence_control: Sequence control constructs in programming languages.
  service_oriented_computing: Service-oriented computing as illustrated through Jolie.
  structured_operational_semantics: Structured Operational Semantics for formally
    specifying programming-language behavior.
  subtyping: Subtyping and its distinction from inheritance.
  types_and_type_checking: Types and type-checking mechanisms in programming languages.
  yacc: The YACC parser-generation tool.
