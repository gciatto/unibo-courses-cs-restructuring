analysis:
  mode: all-courses
source_clusters:
- id: 11
  name: Computer Computing High-Performance (11)
course:
  id: '96994'
  name: Smart Vehicular-Systems
topics:
  autonomous_vehicle_decision_planning_control: Decision-making, planning, and control
    methods for autonomous vehicular systems, including laboratory work with these
    functions.
  autonomous_vehicle_sensing_perception: Sensing and perception components and architectures
    for autonomous vehicular systems.
  autonomous_vehicle_system_architecture: Requirements analysis and selection of sensing,
    perception, communication, and computation architectures for autonomous systems.
  carla_simulation: Hands-on modeling and experimentation with autonomous and connected
    vehicular systems using the CARLA simulator.
  connected_vehicle_distributed_systems: Distributed-systems concepts applied to connected
    vehicular systems.
  connected_vehicle_networking: Networking architectures and principles for connected
    vehicles, including approaches beyond traditional Internet models.
  digital_twins: Digital-twin concepts in simulation.
  vehicular_application_scenarios: Vehicular application scenarios ranging from Advanced
    Driver Assistance Systems to fully autonomous driving, including their evolution.
  vehicular_communications: Vehicle-to-vehicle (V2V) and vehicle-to-infrastructure
    (V2I) communication challenges, opportunities, examples, and deployments.
  vehicular_mobility_propagation: Effects of vehicular mobility and wireless-propagation
    conditions on the performance of vehicular systems.
