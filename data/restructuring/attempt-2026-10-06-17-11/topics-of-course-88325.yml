analysis:
  mode: all-courses
source_clusters:
- id: 0
  name: Security Information Cryptography (0)
course:
  id: '88325'
  name: Computer and Network Security Lab T
topics:
  application_security: Security considerations and protective practices for web and
    mobile applications.
  authentication: Authentication as a security goal and cryptographic mechanism.
  authorization: Authorization as a cybersecurity mechanism for controlling access
    to resources or actions.
  binary_exploitation: Exploitation of vulnerabilities in binary code, including buffer
    overflows, shellcoding, and return-to-libc attacks.
  confidentiality: Confidentiality as a security goal addressed by cryptographic techniques.
  credential_attack_techniques: Brute-force attacks and related techniques for compromising
    credentials.
  cryptographic_security_foundations: Fundamental security issues arising in computer
    systems as addressed through cryptography.
  cyber_kill_chain: The cybersecurity kill chain as a model for understanding stages
    of cyber attacks.
  data_at_rest_protection: Protection of data at rest through anonymization and encryption.
  firewalls: Firewalls for preventing network-based attacks.
  incident_response_recovery: Incident-response and recovery activities following
    information-security incidents.
  integrity: Integrity as a security goal addressed by cryptographic techniques.
  intrusion_detection_monitoring: Attack detection and monitoring using intrusion
    detection systems, intrusion prevention systems, and SIEM platforms.
  os_hardening: Basic operating-system hardening practices for reducing system vulnerabilities.
  physical_security: Physical security measures for protecting computing systems and
    information.
  privilege_escalation: Exploitation of configuration mistakes and other weaknesses
    to escalate privileges.
  reconnaissance_scanning: Enumeration and scanning techniques used to discover systems,
    services, and attack surfaces.
  secure_communications_vpn: Secure communication protocols and virtual private networks
    for protecting data in transit.
  security_frameworks_certifications: Formal models, security frameworks, and certifications
    relevant to secure-system development and information security.
  security_threats_vulnerabilities: Definitions and relationships among threats, vulnerabilities,
    exploits, and risks in information and system security.
  vulnerability_identification: Origins and identification of vulnerabilities in computing
    systems.
  web_vulnerability_exploitation: Exploitation of vulnerabilities in web applications,
    including cross-site scripting, path traversal, and code injection.
