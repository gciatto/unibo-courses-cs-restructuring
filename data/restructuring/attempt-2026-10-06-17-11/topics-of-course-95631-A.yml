analysis:
  mode: all-courses
source_clusters:
- id: 2
  name: Big Data Cloud (2)
course:
  id: 95631-A
  name: Machine Learning and Data Mining
topics:
  association_rules: Association-rule mining.
  bayesian_network_classification: Classification using Bayesian networks.
  chatbot_generation: Generation of chatbots using text-mining and language-model
    tools.
  clustering: Clustering techniques for data mining.
  data_acquisition_processing: Data acquisition and processing in CRISP-DM workflows
    applied to real datasets and use cases.
  data_integrity_quality: Data integrity and data quality as factors affecting the
    validity of analyses and machine-learning models.
  data_mining_overview: General concepts, application scenarios, and supervised and
    unsupervised techniques in data mining.
  data_mining_validation: Understanding and validating data-mining results.
  data_quality_preprocessing: Data-quality assessment and preprocessing operations
    for data mining.
  data_types_for_mining: Features and handling considerations of different data types
    in data-mining tasks.
  decision_tree_classification: Classification using decision-tree models.
  efficient_attention: Efficient attention mechanisms for transformer-based models.
  feature_engineering: Selection and creation of attributes, including feature extraction
    for mining and machine-learning workflows.
  feature_extraction: Feature extraction in machine-learning workflows.
  function_call_generation: Generation of function calls in language-model applications.
  graph_machine_learning: Machine-learning methods for graph-structured data.
  information_extraction: Information extraction from text in practical case studies.
  knowledge_discovery_process: Knowledge discovery and data-mining process design,
    including the CRISP-DM methodology.
  language_models: Language models used in text-mining and language-processing workflows.
  large_action_models: Large action models for generating or selecting actions.
  large_language_models: Generative large language models.
  model_compression_quantization: Model-compression techniques for neural networks,
    including scalar, block, and vector quantization and sparsity.
  model_evaluation: Evaluation methods for language and machine-learning models.
  neural_networks_deep_learning: Introduction to neural networks and deep learning,
    including their applications.
  neurosymbolic_methods: Neuro-symbolic methods for trustworthy artificial intelligence.
  nlp_libraries_tools: Libraries and tools used to implement natural-language processing
    systems and applications.
  opinion_mining: Opinion mining from textual data.
  outlier_detection: Detection of outliers in data-mining datasets.
  parameter_efficient_finetuning: Parameter-efficient fine-tuning methods including
    QLoRA and prompt tuning.
  prompt_engineering: Prompt-engineering methods for generative language models.
  retrieval_augmented_generation: Retrieval-augmented generation using vector databases.
  similarity_dissimilarity: Measures of similarity and dissimilarity used in data-mining
    analysis.
  statistical_data_analysis: Statistical analysis of data as part of data understanding
    for data mining.
  text_classification: Classification of text documents or other textual data.
  text_representation: Representation of text for text-mining applications.
  text_retrieval: Retrieval of textual information in text-mining applications.
  text_summarization: Text summarization in practical text-mining case studies.
  transformers: Transformer architectures and attention-based models, including applications
    to visual and language-related machine-learning tasks.
  vision_language_models: Models combining visual and language information.
  weka_data_mining: Practical data-mining work using the Weka software.
