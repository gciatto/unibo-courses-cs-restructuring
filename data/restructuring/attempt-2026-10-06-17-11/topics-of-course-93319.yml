topics:
  cnn_layers_components: Convolutional neural-network components for image representation,
    including convolutional layers, pooling, and batch normalization.
  discriminative_generative_models: Distinction between discriminative models, which
    model prediction boundaries or conditional outcomes, and generative models, which
    model data generation.
  entropy_likelihood: Entropy and likelihood as probabilistic concepts introduced
    for machine-learning models.
  gradient_descent: Gradient-descent optimization for adjusting machine-learning model
    parameters to reduce a loss function.
  image_classification: Image classification using linear classifiers and fully connected
    neural networks.
  image_transformation: Application of neural-network models to basic image-transformation
    problems.
  machine_learning_basics: Basic machine-learning algorithms and methods used to develop
    intelligent applications.
  ml_parametric_models_loss: Parametric machine-learning model classes and loss functions
    used to compare model predictions and guide parameter selection.
  neural_networks_deep_learning: Introduction to neural networks and deep learning,
    including their applications.
  reinforcement_learning: Reinforcement-learning methods.
  supervised_unsupervised_learning: Supervised and unsupervised machine-learning approaches.
