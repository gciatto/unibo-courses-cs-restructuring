analysis:
  mode: all-courses
source_clusters:
- id: 13
  name: Web Technologies Web-Related (13)
course:
  id: '95605'
  name: Web and Mobile Systems
topics:
  hci_techniques: Human-computer interaction techniques applied to web application
    and website design.
  http_uris: The HTTP protocol and Uniform Resource Identifiers as primary elements
    of the original Web model.
  mobile_app_design: Design considerations for native smartphone applications, including
    application architecture and graphical interfaces.
  mobile_operating_systems: Introduction to the main operating systems used in the
    mobile ecosystem.
  mobile_technology_evolution: Evolution of mobile technologies as covered alongside
    the development of the Web.
  user_interface_design: Basic principles of user interface design.
  web_evolution: The development of the Web from Web 1.0 to Web 2.0.
  web_markup_languages: Web markup and styling languages including XHTML, XML, HTML5,
    and CSS.
  web_mobile_architectures: Architectures for Web and mobile systems and applications.
  web_mobile_development_frameworks_tools: Frameworks, platforms, and development
    tools used to create Web and mobile sites and applications.
  web_standards: Web standardization organizations and processes governing World Wide
    Web technologies.
