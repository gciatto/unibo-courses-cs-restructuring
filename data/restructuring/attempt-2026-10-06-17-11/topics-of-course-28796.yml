analysis:
  mode: all-courses
source_clusters:
- id: 8
  name: Databases Database Systems (8)
course:
  id: '28796'
  name: Elements of Databases
topics:
  data_warehousing_olap: Data-warehouse design and development with online analytical
    processing (OLAP).
  information_retrieval_models: Boolean and vector-space models for information retrieval.
  pagerank: PageRank as a method for Web information retrieval.
  semi_structured_data: Semi-structured data models and their relationship to SQL/XML
    and XQuery.
  sql_limitations: Limits of SQL in handling the data models and information needs
    covered by the course.
  sql_xml_xquery: Introduction to SQL/XML and XQuery, including their central constructors
    for semi-structured data.
  structured_data_models: Structured data models covered in comparison with semi-structured
    and unstructured data models.
  text_analysis: Basic techniques for analyzing text in information-retrieval contexts.
  unstructured_data: Unstructured data models considered alongside structured and
    semi-structured data.
  web_information_retrieval: Information-retrieval techniques applied to Web information.
