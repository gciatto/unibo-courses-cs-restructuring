analysis:
  mode: all-courses
source_clusters:
- id: 6
  name: Learning Machine Deep (6)
course:
  id: '81610'
  name: Machine Learning
topics:
  bayesian_classifiers: Bayesian methods for classification.
  classification_models_general: Classification models and algorithms for assigning
    data instances to classes.
  clustering: Clustering techniques for data mining.
  cnn_architectures: Convolutional neural-network architectures for computer vision,
    including ResNeXt and grouped convolutions, MobileNets, EfficientNet, RegNet,
    AlexNet, VGG, Inception, and ResNet.
  dimensionality_reduction: Dimensionality-reduction techniques used for multimedia-data
    presentation and exploration.
  em_clustering: Clustering using the Expectation-Maximization method.
  kmeans_clustering: K-means clustering.
  knn_classification: k-nearest-neighbor classification.
  large_language_models: Generative large language models.
  multiclass_classification: Classification involving multiple classes and multiclass
    classifiers.
  neural_networks_deep_learning: Introduction to neural networks and deep learning,
    including their applications.
  principal_component_analysis: Principal Component Analysis for dimensionality reduction.
  recurrent_neural_networks: Recurrent neural networks.
  regression_models: Regression models and algorithms for predicting continuous outcomes.
  reinforcement_learning: Reinforcement-learning methods.
  supervised_unsupervised_learning: Supervised and unsupervised machine-learning approaches.
  support_vector_machines: Support Vector Machine classification methods.
  transformers: Transformer architectures and attention-based models, including applications
    to visual and language-related machine-learning tasks.
