  program_execution_model: The model by which computer programs are executed.
  risc_cisc_architectures: RISC and CISC processor architecture approaches.
  synchronous_sequential_logic: Analysis and synthesis of synchronous sequential logic
    networks.
  von_neumann_architecture: The organization and operating principles of the Von Neumann
    computer architecture.
