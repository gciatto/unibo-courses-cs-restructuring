analysis:
  mode: all-courses
source_clusters:
- id: 25
  name: Administration Systems System (25)
course:
  id: '73025'
  name: Distributed Systems M
topics:
  application_server_clustering: Clustering mechanisms and configuration for highly
    scalable enterprise applications in JBoss or WildFly.
  application_servers: Application-server platforms such as JBoss and WildFly for
    deploying and running distributed enterprise applications.
  distributed_fault_tolerance: Fault-tolerance and reliability concerns in distributed
    enterprise applications and their runtime support systems.
  distributed_systems: Fundamental concepts of distributed systems.
  ejb_components: Enterprise JavaBeans component models, including the evolution from
    EJB 1.0 to EJB 3.0 and session-oriented and message-oriented components.
  enterprise_java_containers: Enterprise JavaBeans and Spring as examples of heavy
    and lightweight container-based server-side environments.
  enterprise_messaging: Enterprise messaging systems and integration technologies,
    including Java Message Service (JMS), Enterprise Service Bus concepts, and Java
    Business Integration (JBI).
  enterprise_transactions: Transaction management for enterprise components and Spring-based
    distributed applications.
  function_as_a_service: Function as a Service (FaaS) models and supporting frameworks
    for asynchronous, scalable enterprise applications.
  interceptors: Interceptors used in enterprise application components and container-based
    runtime processing.
  jmx_management: Runtime monitoring, control, and management of application servers
    and distributed support frameworks using JMX.
  jndi_naming: Differentiated naming services and their integration in enterprise
    deployment environments, including Java Naming and Directory Interface (JNDI).
  jpa_hibernate_persistence: Enterprise persistence with JPA and Hibernate, including
    transparent persistence, object-relational mapping, query support, metadata, and
    performance.
  nodejs_async_io: Event-oriented and stateless server-side models using Node.js and
    asynchronous input/output management.
  online_stream_processing: Introductory high-performance online stream processing
    of big data over clustered distributed systems.
  requirements_analysis: Analysis of software requirements as part of planning and
    software-system development.
  scalability_distributed_systems: Scalability considerations in distributed systems.
  software_architecture_design: Design of system architecture and definition of the
    logical architecture of a software problem.
  software_architecture_styles: Selection and use of layered, client-server, pipeline,
    microkernel, service-based, event-driven, space-based, and microservice architectural
    styles for software subsystems.
  spring_ioc_aop: Spring lightweight containers, inversion of control, and aspect-oriented
    programming for enterprise applications.
