analysis:
  mode: all-courses
source_clusters:
- id: 16
  name: Data Algorithms Structures (16)
course:
  id: B4913
  name: ALGORITMI E STRUTTURE DATI
topics:
  abstract_data_types: Abstract data types as specifications of data collections and
    their supported operations.
  algorithm_design_analysis: Design and analysis of algorithms for solving programming
    problems.
  asymptotic_analysis: Discrete-mathematics notions for estimating the order of magnitude
    and computational cost of algorithms.
  backtracking_algorithms: Backtracking as an algorithmic technique for systematically
    exploring and pruning candidate solutions.
  binary_search: Binary-search algorithms for locating elements in ordered data.
  binary_search_trees: Binary search trees and binary balanced search trees.
  dictionaries: Dictionary data structures for storing and retrieving key-value associations.
  divide_and_conquer: Divide-and-conquer as an algorithm design technique.
  dynamic_programming: Dynamic programming as an algorithm design technique.
  graph_algorithms: Basic algorithms for solving problems on graphs.
  graph_search_algorithms: Search algorithms operating on graphs.
  graphs: Graphs as elementary data structures.
  greedy_algorithms: Greedy methods as an algorithm design technique.
  hash_tables: Hash tables for implementing dictionary operations.
  heaps: Heap data structures and their use in HeapSort.
  lists: List data structures, including their practical implementation and use.
  local_search: Local-search methods that iteratively improve candidate solutions
    by exploring neighboring solutions.
  minimum_spanning_trees: Minimum spanning tree algorithms, including Prim's and Kruskal's
    algorithms.
  np_completeness: NP-completeness within the study of computational complexity.
  np_hard_problems: NP-hard computational problems and their complexity.
  p_np_classes: The computational complexity classes P and NP.
  priority_queues: Priority queues implemented using heap-based data structures.
  queues: Queue data structures in C++.
  recurrence_equations: Recurrence equations used to analyze the computational cost
    of algorithms.
  red_black_trees: Red-black trees as balanced search-tree data structures.
  search_algorithms: Algorithms for searching and retrieving items in data structures.
  sets: Set data structures for representing unordered collections and related operations.
  shortest_paths: Shortest-path algorithms, including Bellman-Ford, Dijkstra, and
    Floyd-Warshall.
  sorting_algorithms: Algorithms for sorting data.
  space_complexity: Analysis of the memory space required by algorithm execution.
  stacks: Stack data structures as elementary data structures.
  tree_data_structures: Tree data structures introduced as hierarchical structures
    for organizing information.
  union_find: Union-find structures for maintaining disjoint sets.
