analysis:
  mode: all-courses
source_clusters:
- id: 13
  name: Web Technologies Web-Related (13)
course:
  id: '94442'
  name: Design of Web Applications T
topics:
  conceptual_database_design: Requirements analysis and conceptual database design
    for relational databases.
  dao_pattern: The Data Access Object pattern for structuring persistence access in
    Web applications.
  database_transactions: Database transactions, including ACID properties, concurrency
    management, and transaction protocols.
  entity_relationship_model: Entity-Relationship modeling for representing data and
    relationships in database design.
  ifml_web_modeling: IFML and Web Ratio as tools and technologies for model-based
    development of Web applications.
  impedance_mismatch: The object-relational impedance mismatch between object-based
    application architectures and relational databases.
  jdbc_database_access: Direct database access from Web applications using JDBC interfaces
    and abstractions.
  jpa_hibernate_persistence: Enterprise persistence with JPA and Hibernate, including
    transparent persistence, object-relational mapping, query support, metadata, and
    performance.
  model_driven_development: Model Driven Software Development using executable requirements
    and problem models, custom metamodels, and model-based development processes.
  requirements_analysis: Analysis of software requirements as part of planning and
    software-system development.
  software_lifecycle: Phases and activities in the lifecycle of software systems,
    including planning, requirements analysis, and design.
  uml_software_modeling: Unified Modeling Language (UML) as a standard language for
    visualizing software-application designs.
  web_markup_languages: Web markup and styling languages including XHTML, XML, HTML5,
    and CSS.
  web_multilayer_architecture: Multi-layer Web architectures with horizontal and vertical
    distribution, separation of business logic, and component-container models.
  webml_modeling: WebML models for Web applications, including data, hypertext, and
    content-management models and their use in hypertext design and implementation.
  xml_java_parsing: Processing XML in Java with DOM and SAX parser models.
  xml_schema_validation: XML information typing and validation using DTDs and XML
    Schema.
  xml_transformations: XML transformation with XSL and XSLT.
