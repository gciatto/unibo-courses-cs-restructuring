analysis:
  mode: all-courses
source_clusters:
- id: 19
  name: Cultural Heritage Computer (19)
course:
  id: B5079
  name: Digital Humanities and Data Management for Cultural Heritage
topics:
  digital_humanities_projects: Digital projects that apply computer science technologies
    to humanities studies.
  digital_resource_design: Conception, design, and implementation of digital resources
    intended to enhance cultural heritage.
  fair_data_management: Principles and practices for managing cultural-heritage and
    humanities data as Findable, Accessible, Interoperable, and Reusable (FAIR) data.
  humanities_data_lifecycle: Management of humanities data throughout the lifecycle
    of a Digital Humanities project, including bibliographic, archival, documentary,
    and artistic data.
  linked_open_data: Linked Open Data approaches for integrating, organising, and using
    interconnected Web resources.
  open_science: Theoretical, historical, and social principles of the Open Science
    movement, including common practices for developing Open Science projects.
