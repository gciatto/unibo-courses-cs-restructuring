analysis:
  mode: all-courses
source_clusters:
- id: 8
  name: Databases Database Systems (8)
course:
  id: '96793'
  name: Information Systems and Database Management
topics:
  conceptual_database_design: Requirements analysis and conceptual database design
    for relational databases.
  database_management_systems: Database Management Systems as software for organizing,
    managing, and accessing relational and NoSQL databases.
  entity_relationship_model: Entity-Relationship modeling for representing data and
    relationships in database design.
  logical_database_design: Logical database design for relational databases.
  nosql_data_models: Design and use of non-relational data models, including document-based,
    graph-based, and column-oriented models.
  nosql_databases: Introductory architectures and non-relational data models of NoSQL
    systems.
  nosql_queries: Querying data stored in NoSQL databases.
  python_data_analysis_libraries: Use of Python libraries for data analysis, including
    NumPy, SciPy, Matplotlib, pandas, and scikit-learn.
  relational_model: Structure and principles of the relational data model.
  sql_queries: Databases and the formulation and use of SQL queries.
  sql_views: Definition and use of views in SQL databases.
  statistical_data_analysis: Statistical analysis of data as part of data understanding
    for data mining.
