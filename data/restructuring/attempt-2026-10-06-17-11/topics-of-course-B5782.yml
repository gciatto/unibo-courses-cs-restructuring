analysis:
  mode: all-courses
source_clusters:
- id: 16
  name: Data Algorithms Structures (16)
course:
  id: B5782
  name: Algorithms and Data Structures for Computational Biology
topics:
  algorithm_design_analysis: Design and analysis of algorithms for solving programming
    problems.
  algorithm_notations: Representing algorithms using pseudocode and flow diagrams.
  approximate_algorithms: Approximate algorithms for computational problems where
    exact solutions may be impractical.
  approximate_string_matching: Algorithms for finding inexact string or pattern matches
    while allowing discrepancies.
  asymptotic_analysis: Discrete-mathematics notions for estimating the order of magnitude
    and computational cost of algorithms.
  binary_trees: Binary trees as an abstract data type, including their structure and
    use in Python programming.
  branch_and_bound: Branch-and-bound techniques for search and optimization in artificial-intelligence
    problem solving.
  brute_force_algorithms: Brute-force approaches to solving algorithmic problems through
    systematic exploration of possible solutions.
  burrows_wheeler_transform: The reversible Burrows-Wheeler transform and its applications
    in string processing.
  comparison_sorting_lower_bounds: Lower bounds for comparison-based sorting algorithms.
  computational_complexity: An introduction to computational complexity.
  divide_and_conquer: Divide-and-conquer as an algorithm design technique.
  dynamic_programming: Dynamic programming as an algorithm design technique.
  exact_string_matching: Algorithms for finding exact occurrences of strings or patterns
    in biological sequences.
  graphs: Graphs as elementary data structures.
  greedy_algorithms: Greedy methods as an algorithm design technique.
  hash_tables: Hash tables for implementing dictionary operations.
  heuristic_search: Heuristic search methods for solving constrained combinatorial
    problems.
  linear_time_sorting: Linear-time sorting techniques including counting sort and
    radix sort.
  lists: List data structures, including their practical implementation and use.
  multiple_sequence_alignment: Multiple alignment of biological sequences.
  pairwise_sequence_alignment: Pairwise alignment of biomolecular sequences using
    local, global, and semiglobal alignment algorithms, including Python implementations.
  queues: Queue data structures in C++.
  sequence_assembly: Sequence-assembly algorithms using overlap graphs and greedy
    construction of shortest common supersequences.
  sorting_algorithms: Algorithms for sorting data.
  stacks: Stack data structures as elementary data structures.
  suffix_data_structures: Suffix trees, suffix tries, and suffix arrays for indexing
    and processing strings.
  trees: Tree data structures in C++.
