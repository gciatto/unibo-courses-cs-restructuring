analysis:
  mode: all-courses
source_clusters:
- id: 20
  name: Language Natural Processing (20)
course:
  id: B8603
  name: Machine Translation and Artificial Intelligence for Language Services
topics:
  machine_translation: Machine-translation systems and their use as part of AI-enhanced
    translation workflows.
  mt_history_evolution: History and evolution of machine translation, including its
    main developmental phases.
  mt_model_operations: Setting up and maintaining machine-translation models.
  mt_principles: The main theoretical principles underlying machine-translation systems.
  mt_software_tools: Specialised machine-translation software and utilities used in
    language-service workflows.
  mt_training_data_preparation: Gathering and cleaning training data for machine-translation
    models.
  post_editing: Light, full, and other post-editing interventions for improving machine-translation
    and generative-AI output according to translation-context requirements.
  pre_editing: Preparing source text before machine translation to improve processing
    and output quality.
  prompt_engineering: Prompt-engineering methods for generative language models.
  translation_ai_ethics: Ethical standards for applying machine translation and artificial
    intelligence to language and translation services.
  translation_evaluation_metrics: Important metrics for evaluating and interpreting
    the quality of machine-produced translations.
  translation_prompting: Basic prompting techniques used within AI-based translation
    tools to optimize machine-translated output and support post-editing.
