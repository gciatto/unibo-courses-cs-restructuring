  name: Knowledge Engineering Extraction (12)
course:
  id: B5292
  name: Knowledge Engeneering for the Humanities
topics:
  knowledge_graphs: Knowledge graphs in the Web of Data, including their conceptual
    foundations and use for representing and integrating knowledge.
  large_language_models: Generative large language models.
  ontology_modeling_owl: Knowledge representation with ontologies and the OWL ontology
    language.
  prompting_language_models: Prompting pre-trained language models for natural-language-processing
    applications.
  semantic_web_architecture: Architecture, concepts, standards, and languages underlying
    the Semantic Web and Web of Data.
  sparql_querying: Querying RDF and knowledge graphs with SPARQL, including use of
    the DBpedia knowledge graph.
