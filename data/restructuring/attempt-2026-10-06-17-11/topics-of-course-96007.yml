analysis:
  mode: all-courses
source_clusters:
- id: 29
  name: Informatics Informatic Humanities (29)
course:
  id: '96007'
  name: Foundations of Computer Architecture and Operating Systems
topics:
  binary_arithmetic: The four arithmetic operations performed in binary notation.
  binary_encoding: Binary encoding of information.
  boolean_algebra: Boolean algebra and logical functions.
  computer_hardware_architecture: Fundamental organization of computer hardware systems.
  computer_history: Historical development of computers as introduced alongside computer
    architecture.
  computer_operation_principles: General principles governing the operation of computers
    and the relationship between hardware and software.
  concurrent_programming: The concurrent programming paradigm.
  cpu_scheduling: Operating-system CPU scheduling concepts and algorithms.
  io_management: Operating-system management of input and output operations and devices.
  machine_languages: General considerations on machine languages.
  memory_devices: Memory devices as components of computer architecture.
  numeric_representation: Representation and computation with numeric formats, including
    binary notation, two's-complement representation, and floating-point numbers.
  operating_systems_filesystems: Operating-system structure and main functions, together
    with basic file-system operations.
  os_introduction_history: The role, structure, objectives, and resource-management
    functions of operating systems as execution environments for programs.
  os_memory_management: Memory-management concepts and techniques in operating systems.
  processor_memory_io: Basic elements of processors, memories, and input/output interfaces
    in digital systems.
