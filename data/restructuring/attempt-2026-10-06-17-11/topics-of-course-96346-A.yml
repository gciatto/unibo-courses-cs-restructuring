  documentary_databases: Consultation of documentary databases through online information
    services.
  electronic_document_management: Management of electronic documents in dematerialized
    administrative processes.
  electronic_documents: Electronic documents and their use in paperless transactions.
  electronic_identification: Electronic identification systems used to identify users
    in digital government services.
  electronic_trust_services: Electronic trust services covered in the context of digital
    transformation and electronic transactions.
  italian_government_portals: Italian government portals and telematic public services,
    including the Companies House, SUAP, regional mandatory-communication services,
    Revenue Agency, INPS, INAIL, Justice of the Peace, police biometric-passport services,
    and electronic identity-card services.
