analysis:
  mode: all-courses
source_clusters:
- id: 7
  name: Informatica Computer Science (7)
course:
  id: '98735'
  name: Python Coding and Data Science
topics:
  algorithms_programming_basics: Basic principles of algorithms and programming.
  array_oriented_computing: Array-oriented computing for scientific applications,
    as covered using Python.
  big_data_management: Introductory approaches and technologies for managing big data
    as alternatives or complements to relational databases.
  data_visualization: Infographic communication techniques and principles for visualizing
    data.
  exceptions: Exception mechanisms in programming languages.
  language_semantics: The semantics of programming languages as part of their formal
    description.
  language_syntax: The syntax of programming languages as part of their formal description.
  machine_learning_basics: Basic machine-learning algorithms and methods used to develop
    intelligent applications.
  numpy_arrays_operations: NumPy arrays and matrices, including mathematical and statistical
    operations, array manipulation, and advanced NumPy functions.
  object_oriented_programming: Introduction to the object-oriented programming paradigm
    in practical lectures.
  pandas_data_io: Reading and writing data with Pandas.
  pandas_data_manipulation_cleaning: Manipulating and cleaning data with Pandas.
  pandas_series_dataframes: Pandas Series and DataFrame structures for tabular data
    analysis.
  programming_languages_intro: Introductory concepts of programming languages, including
    what a language is and the role of programming languages.
  pyspark_basics: Fundamental PySpark programming concepts for processing data with
    Apache Spark.
  python_control_flow: Conditional statements and iteration constructs in Python.
  python_data_structures: Data structures used in Python programming, as introduced
    alongside Python data types, control flow, functions, and libraries.
  python_data_types: Basic Python data types and their use in solving problems.
  python_environment_setup: Installing and configuring the Python programming environment
    for the course.
  python_file_handling: Reading, creating, modifying, and storing files using Python
    programs.
  python_interpreter: The Python interpreter and its role in executing Python programs.
  python_modules_packages: Python modules, standard-library components, and packages.
  python_os_interaction: Using Python to perform file-management operations and interact
    with the operating system.
  python_programming_basics: Introduction to programming in Python.
  python_scientific_modules: Python modules for graphical, scientific, and numerical
    computation.
  python_variables_expressions: Variables and expressions in Python programming.
  python_vector_computations: Performing vector computations in Python.
  scikit_learn_workflow: The Scikit-Learn workflow for applying machine-learning methods,
    illustrated through examples.
  spark: The Apache Spark system, including its architecture, data structures, data
    partitioning, shuffling, and computation optimization.
  supervised_unsupervised_learning: Supervised and unsupervised machine-learning approaches.
