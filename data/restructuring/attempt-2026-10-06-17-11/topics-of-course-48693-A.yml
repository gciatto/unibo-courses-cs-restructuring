analysis:
  mode: all-courses
source_clusters:
- id: 19
  name: Cultural Heritage Computer (19)
course:
  id: 48693-A
  name: Computer Science for Cultural Heritage
topics:
  digital_humanities_databases: Creation and management of databases and Web databases
    for humanities and cultural-heritage data.
  digital_images: Digital images as technologies for communicating cultural heritage.
  digital_resource_design: Conception, design, and implementation of digital resources
    intended to enhance cultural heritage.
  digital_text_analysis: Analysis of digitized texts and documents in bibliographic,
    archival, documentary, and artistic contexts.
  digital_textualization: Transposition and digitization of humanities texts and documents
    for use in Digital Humanities projects.
  fair_data_management: Principles and practices for managing cultural-heritage and
    humanities data as Findable, Accessible, Interoperable, and Reusable (FAIR) data.
  gis_fundamentals: Fundamentals of geographic information systems (GIS).
  humanities_data_lifecycle: Management of humanities data throughout the lifecycle
    of a Digital Humanities project, including bibliographic, archival, documentary,
    and artistic data.
  three_d_modeling: Three-dimensional modeling of cultural heritage objects.
  virtual_restoration: Virtual restoration of cultural heritage objects using digital
    three-dimensional reconstruction and modeling.
