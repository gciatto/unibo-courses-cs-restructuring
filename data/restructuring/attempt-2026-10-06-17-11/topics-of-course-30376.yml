analysis:
  mode: all-courses
source_clusters:
- id: 2
  name: Big Data Cloud (2)
course:
  id: '30376'
  name: Business Intelligence
topics:
  bi_reporting: Reporting as a business-intelligence technique for analyzing enterprise
    data.
  business_intelligence_overview: Role of business intelligence in the corporate information
    system and the structure of the BI pyramid.
  conceptual_database_design: Requirements analysis and conceptual database design
    for relational databases.
  data_source_analysis: Analysis of data sources as part of the data-warehouse lifecycle.
  data_warehouse_architecture: Architectural organization of enterprise data warehouses.
  data_warehouse_physical_design: Physical design of enterprise data warehouses.
  data_warehouse_workload_volume: Assessment of data-warehouse workloads and data
    volumes during warehouse design.
  data_warehousing_olap: Data-warehouse design and development with online analytical
    processing (OLAP).
  etl_procedures: Design of extract, transform, and load procedures for populating
    a data warehouse.
  logical_database_design: Logical database design for relational databases.
  requirements_analysis: Analysis of software requirements as part of planning and
    software-system development.
