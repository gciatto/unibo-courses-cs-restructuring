analysis:
  mode: all-courses
source_clusters:
- id: 20
  name: Language Natural Processing (20)
course:
  id: '87898'
  name: Methods and Technologies for Interpreting
topics:
  antconc_terminology_analysis: Use of AntConc as a basic tool for detecting and analysing
    terminology in specialised corpora.
  bootcat_corpus_building: Use of BootCaT to construct electronic specialised corpora
    for terminology work.
  conference_interpreter_documentation: Traditional and AI-supported documentation
    strategies for preparing conference interpreters for oral speeches.
  electronic_specialized_corpora: Construction and use of electronic specialised corpora
    to support terminology research and extraction.
  search_engines: Use of search engines for internet-based research.
  terminography_software: Terminographic software for creating, managing, and consulting
    glossaries and terminology databases, including MultiTerm, Interplex, and InterpretBank.
  terminology_database_management: Building and managing glossaries and terminology
    databases needed for interpreting oral speeches.
  terminology_extraction: Traditional and AI-supported methods for detecting and extracting
    terminology from specialised material.
  terminology_theory: Theoretical foundations of terminology presented as a basis
    for terminology research and interpretation.
