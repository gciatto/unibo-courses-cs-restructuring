syllabus:
  it:
    url: https://www.unibo.it/it/studiare/insegnamenti-competenze-trasversali-moocs/insegnamenti/insegnamento/2025/518192
    title: 2025/2026 LABORATORIO DI PROGRAMMAZIONE — Università di Bologna
    contents:
      Conoscenze e abilità da conseguire: 'Al termine del corso lo studente comprende
        la programmazione di un computer; conosce le tipologie di linguaggi di programmazione
        e comprenderne il perché sono indispensabili per l''interazione con il computer;
        conosce gli strumenti essenziali che si utilizzano per le attività di programmazione:
        editor, compilatore; comprende quali sono gli effetti delle operazioni effettuate
        in termini di sintassi e semantica del linguaggio Python. Sa risolvere esercizi
        sugli argomenti trattati durante il corso; sa leggere programmi, di bassa
        o media complessità, scritti in linguaggio Python e comprendere per quali
        scopi sono progettati, basandosi sull''interpretazione del codice e dei commenti
        ad esso associati. sa progettare piccole applicazioni scritte in linguaggio
        Python partendo dalle specifiche di un problema o da porzioni di codice esistente.'
      Contenuti: 'Il corso si occupa dei seguenti argomenti:


        - Algoritmi e linguaggi di programmazione

        - Modelli e formati di dati: dati primitivi, formati dati per il Web (JSON,
        CSV, …)

        - Fondamenti di programmazione in Python: tipi di dato, funzioni, costrutti
        di confronto, condizionali e iterativi, gestione delle eccezioni, testing
        e debugging

        - Esplorare i dati con Pandas: serie e dataframe, manipolazione dei dati (indici,
        selezione, aggregazione, ordinamento, ecc.)

        - Data visualization con Seaborn: grafici relazionali, categorici e per distribuzioni

        - Machine Learning con Python: tipi di problema (classificazione, regressione,
        clustering), tipi di apprendimento (es. supervised vs unsupervised), valutazione
        delle prestazioni (validazione), classificatori e reti neurali'
      Testi/Bibliografia: 'Guttag, Introduzione alla programmazione con Python, Egea,
        2021.


        Bellini & Guidi, Python e machine learning, McGraw-Hill, 2022.'
      Metodi didattici: 'Il materiale didattico viene illustrato utilizzando slide,
        rese disponibili sul sito del corso insieme ad esempi di codice.


        Il corso prevede inoltre ore di laboratorio dove gli studenti possono sperimentare
        gli strumenti e le tecnologie presentati durante il corso, ed in cui vengono
        svolti esercizi e approfonditi gli argomenti discussi nelle lezioni frontali.'
      Modalità di verifica e valutazione dell'apprendimento: 'La valutazione è basata
        su una prova scritta individuale e sulla presentazione di un progetto di gruppo.


        Lo scritto è composto da alcuni esercizi sulle tecnologie descritte nel corso
        e alcune domande teoriche.


        La presentazione del progetto tende a verificare la correttezza e completezza
        dell’analisi sviluppata, nonché le conoscenze acquisite dallo studente sulle
        principali tecnologie presentate nelle lezioni.'
      Strumenti a supporto della didattica: Il sito del corso che contiene slide,
        esercitazioni pratiche, dettagli sul progetto, informazioni utili ed avvisi
        del corso.
      Orario di ricevimento: Consulta il sito web di Francesco Poggi (https://www.unibo.it/sitoweb/francesco.poggi5)
      SDGs: 'Istruzione di qualità Lavoro dignitoso e crescita economica


        L''insegnamento contribuisce al perseguimento degli Obiettivi

        di Sviluppo Sostenibile dell''Agenda 2030 dell''ONU.'
  en:
    url: https://www.unibo.it/en/study/course-units-transferable-skills-moocs/course-unit-catalogue/course-unit/2025/518192
    title: 2025/2026 Programming Laboratory — University of Bologna
    contents:
      Learning outcomes: 'At the end of the course the student understands the basics
        of computer programming. The student knows the types of programming languages
        and understands why they are essential for interacting with computers. The
        student knows the main tools that are used for programming activities: editor,
        compiler, development environment; understands what are the effects of the
        main Python operations in terms of syntax and semantics. The student can solve
        exercises on the course topics, read Python programs of low or medium complexity,
        and understand what are their purposes. The student can analyse data and design
        small applications written in Python starting from the description of a problem
        or from portions of existing code.'
      Course contents: 'The course discusses the following topics:


        - Algorithms and programming languages

        - Data models and formats: basic data types, data types for the Web (JSON,
        CSV, …)

        - Basics of programming in Python: data types, functions, comparison, conditional
        and iterative constructs, exception handling, testing and debugging

        - Data exploration with Pandas: Series e Dataframe, data manipulation (indexes,
        selection, aggregation, sorting, etc.)

        - Data visualization with Seaborn: relational, distribution and categorical
        plots

        - Machine Learning with Python: problem types (classification, regression,
        clustering), learning types (e.g. supervised vs unsupervised), performance
        evaluation (validation), classifiers and neural networks'
      Readings/Bibliography: 'Guttag, Introduzione alla programmazione con Python,
        Egea, 2021.


        Bellini & Guidi, Python e machine learning, McGraw-Hill, 2022.'
      Teaching methods: 'The topics will be explained with slides, made available
        on the course website together with examples of code.


        Some hands-on sessions aimed at testing the tools and technologies introduced
        by the course will be organised in the laboratory.'
      Assessment methods: 'The assessment is based on two separate tests: the presentation
        of the project by the team and a written test carried out individually.


        The written test is composed of some exercises on the technologies described
        during the course and a few theoretical questions.


        The presentation of the project focuses on assessing the correctness and completeness
        of the analysis performed by the team, as well as the individual contribution
        to the overall project.'
      Teaching tools: The course site contains slides, exercises, details about the
        project, general information and notices about the course.
      Office hours: See the website of Francesco Poggi (https://www.unibo.it/sitoweb/francesco.poggi5/en)
      SDGs: 'Quality education Decent work and economic growth


        This teaching activity contributes to the achievement of the Sustainable Development
        Goals of the UN 2030 Agenda.'
