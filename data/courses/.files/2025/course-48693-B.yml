syllabus:
  it:
    title: 2025/2026 INFORMATICA PER I BENI CULTURALI — Università di Bologna
    contents:
      Conoscenze e abilità da conseguire: 'Al termine del corso lo studente acquisisce
        le competenze informatiche di base per lo studio dei beni culturali, dai

        principi generali di funzionamento dell’hardware e del software alle tecniche
        di computer grafica utili per la conservazione e la valorizzazione di manufatti
        artistici o di interesse storico.

        E’ in grado di utilizzare con efficacia le reti di computer per la ricerca
        e la condivisione di informazioni, di gestire, produrre e interpretare dati
        e metadati conosce le tecniche di fotogrammetria, di scansione a luce strutturata
        e di modellazione per la restituzione tridimensionale di oggetti del patrimonio
        culturale e per il loro restauro virtuale.'
      Contenuti: 'Principi della comunicazione, basi della semiotica del segno, strategie
        e tecnologie per la comunicazione del patrimonio culturale: Immagini digitali,
        principi di fotogrammetria, principi di scansione 3D a luce strutturata, 3D
        printing, modellazione 3D, virtual tour, principi di GIS e web-app gis-based'
      Testi/Bibliografia: 'Bibliografia sintetica di riferimento. Ulteriori contributi
        di carattere specifico saranno indicati nel corso delle lezioni.


        Barilli R., Estetica e società tecnologica. Marshall McLuhan, in Il Mulino,
        marzo-aprile 1973


        Ciotti F., Roncaglia G., Il mondo digitale, LaTerza, 2000


        Eco U., Piano R., Zeri F., Graziani A., Le isole del tesoro, Electa, 1988


        Zaccarini et al., A multi-disciplinary approach to the preservation of cultural
        heritage: a case study on the Piazzetta degli Ariani, Ravenna. Download at
        - https://tinyurl.com/zrogujf'
      Metodi didattici: Lezioni frontali con esercitazioni pratiche e sviluppo di
        progetti
      Modalità di verifica e valutazione dell'apprendimento: Esame orale con presentazione
        di un progetto su case study a scelta dello studente
      Strumenti a supporto della didattica: power point e guide sui software principali
        utilizzati a lezione
      Orario di ricevimento: 'Consulta il sito web di Simone Zambruno (https://www.unibo.it/sitoweb/simone.zambruno2)


        Consulta il sito web di Anna Forte (https://www.unibo.it/sitoweb/anna.forte3)'
      SDGs: 'Istruzione di qualità


        L''insegnamento contribuisce al perseguimento degli Obiettivi

        di Sviluppo Sostenibile dell''Agenda 2030 dell''ONU.'
  en:
    title: 2025/2026 Computer Science for Cultural Heritage — University of Bologna
    contents:
      Learning outcomes: At the end of the course, the student acquires the skills
        necessary for effective communication of cultural heritage, with particular
        emphasis on the use of digital technologies. They are able to effectively
        apply techniques of photogrammetry, structured-light scanning, and modeling
        for the three-dimensional reconstruction of cultural heritage objects and
        for their virtual restoration.
      Course contents: 'Principles of communication, fundamentals of the semiotics
        of the sign, strategies and technologies for the communication of cultural
        heritage: digital images; principles of photogrammetry; principles of structured-light
        3D scanning; 3D printing; 3D modeling; virtual tours; fundamentals of GIS
        and GIS-based web applications.'
      Readings/Bibliography: 'Essential reference bibliography. Additional, more specific
        materials will be provided during the lectures.


        Barilli R., Estetica e società tecnologica. Marshall McLuhan, in Il Mulino,
        marzo-aprile 1973


        Ciotti F., Roncaglia G., Il mondo digitale, LaTerza, 2000


        Eco U., Piano R., Zeri F., Graziani A., Le isole del tesoro, Electa, 1988


        Zaccarini et al., A multi-disciplinary approach to the preservation of cultural
        heritage: a case study on the Piazzetta degli Ariani, Ravenna. Download at
        - https://tinyurl.com/zrogujf'
      Teaching methods: Lectures combined with practical exercises and project development.
      Assessment methods: Oral examination including the presentation of a project
        based on a case study chosen by the student.
      Teaching tools: PowerPoint presentations and guides to the main software used
        during the
      Office hours: 'See the website of Simone Zambruno (https://www.unibo.it/sitoweb/simone.zambruno2/en)


        See the website of Anna Forte (https://www.unibo.it/sitoweb/anna.forte3/en)'
      SDGs: 'Quality education


        This teaching activity contributes to the achievement of the Sustainable Development
        Goals of the UN 2030 Agenda.'
