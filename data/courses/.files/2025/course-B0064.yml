syllabus:
  it:
    title: 2025/2026 INTRODUZIONE ALLA DATA SCIENCE E AL PENSIERO COMPUTAZIONALE —
      Università di Bologna
    contents:
      Contenuti: '- Definire una base solida omogenea della struttura del processo
        computazionale.

        - Strutturare il concetto di programmazione e di linguaggio di programmazione.

        - Elaborare il concetto di trasformazione digitale.

        - Evidenziare il concetto di produzione del software, da un punto di vista
        sia organizzativo che cognitivo.

        - Presentare come l''uso del pensiero computazionale e degli strumenti informatici
        possano risolvere problemi di organizzazione dei sistemi, di comprensione
        di strutture complesse e di previsione di eventi.

        - Fornire l''elaborazione del testo e la sua comprensione come paradigma interpretativo
        del processo di trasformazione digitale.'
      Testi/Bibliografia: 'Non c''è un libro di testo obbligatorio. Qui nel seguito
        si presenta una serie di lettura consigliate:


        - Dirk Hovy, Text Analysis in Python for Social Scientists - Discovery and
        Exploration, Cambridge University Press, 2021, ISBN 978-1108873352

        - Sofía De Jesús , Dayrene Martinez, Applied Computational Thinking with Python,
        Packt Publishing, 2020, ISBN 978-1839219436

        - Autori multipli, The LaTeX Wikibook, Wikibooks community,https://en.wikibooks.org/wiki/LaTeX'
      Modalità di verifica e valutazione dell'apprendimento: 'Nella prima sessione,
        lo studente in corso e frequentante può decidere la forma valutativa che
        preferisce tra le seguenti:


        - orale omnicomprensivo,

        - elaborazione di un testo su un ambito specifico del corso accettato dal
        docente e seguito da un orale focalizzato


        In tutti gli altri casi l''esame consiste in un orale omnicomprensivo.'
      Strumenti a supporto della didattica: 'Questo è un corso gestito in strettissima
        sinergia con il corso di Laboratorio di Programmazione.


        Il docente è raggiungibile via email (francesco.poggi@cnr.it (mailto://francesco.poggi@cnr.it)).


        Il ricevimento studenti è gestito on demand, previa richiesta da fare preferibilmente
        via email.


        Il corso usa anche come veicolo di comunicazione il seguente gruppo telegram
        cui gli studenti devono iscriversi quanto prima: https://t.me/+rOAH0070UAk1NTZk.'
      Orario di ricevimento: Consulta il sito web di Francesco Poggi (https://www.unibo.it/sitoweb/francesco.poggi5)
      Conoscenze e abilità da conseguire: Al termine del corso lo studente avrà una
        buona conoscenza e comprensione delle nozioni di base concernenti l’algoritmica
        e la programmazione con il linguaggio Python, in particolare di problemi con
        grandi quantità di dati. Lo studente sarà in grado di applicare le conoscenze
        apprese per leggere, scrivere e testare programmi utilizzando il linguaggio
        di programmazione Python. Lo studente sarà inoltrein grado di comprendere
        prototipi e programmi realizzati da terzi. Grazie alle conoscenze apprese,
        lo studente sarà in grado di valutare i pro e i contro di un prototipo o di
        una implementazione nel linguaggio Python di un programma facente uso di tecniche
        di algoritmica per trattare strutture dati tratte dal web o da repository
        aperti.
  en:
    title: 2025/2026 Introduction to Data Science and Computational Thinking — University
      of Bologna
    contents:
      Course contents: '- To define a solid and homogeneous base of the structure
        of the computational process.

        - To structure the concept of programming and of programming languages.

        - Elaborate the concept of digital transformation.

        - Evidence the concept of production of software, both from a organizational
        and from a cognitive viewpoint.

        - Present how the use of computational thinking and of the informatics tools
        could help solving problems of organizing systems, of understanding complex
        structures, and of forecasting possible events.

        - Use text processing and its understanding as a paradigmm of the process
        of digital transformation'
      Readings/Bibliography: 'The course does not have a mandatory textbook. Here
        below there is a list of suggested readings:


        - Dirk Hovy, Text Analysis in Python for Social Scientists - Discovery and
        Exploration, Cambridge University Press, 2021, ISBN 978-1108873352

        - Sofía De Jesús , Dayrene Martinez, Applied Computational Thinking with Python,
        Packt Publishing, 2020, ISBN 978-1839219436

        - Autori multipli, The LaTeX Wikibook, Wikibooks community, https://en.wikibooks.org/wiki/LaTeX'
      Assessment methods: 'In the first session, the student attending the course
        for the first time may decide the evaluation method most suitable for the
        personal learning profile among the following:


        - overall oral,

        - preparation of a report on distributed cognition that would evidence the
        content of the material presented in the course


        In all the other cases the exam is an overall oral.'
      Teaching tools: 'This course is managed in strict synchrony with the one of
        Laboratorio di Programmazione.


        The instructor can be reached by email (francesco.poggi@cnr.it (mailto://francesco.poggi@cnr.it)).


        Student office hours are held on demand, upon request, preferably via email.


        The course also uses the following Telegram group as a communication channel,
        and students are required to join it as soon as possible: https://t.me/+rOAH0070UAk1NTZk.'
      Office hours: See the website of Francesco Poggi (https://www.unibo.it/sitoweb/francesco.poggi5/en)
      Learning outcomes: 'At the end of this course, the students will have a good
        knowledge and understanding of the fundamental principles of algorithmics
        and of programming in Python, with specific focus on problems with large amount
        of data. The students will be able to apply the acquired knowledge to read,
        write, and test programs using the Python programming language. Moreover,
        the student will be able to understand prototypes and programs written by
        other people.


        Thanks to the acquired knowledge, the student will be able to evaluate pros
        and cons of a prototype or of an implementation in the Python language of
        a program using typical algorithmic techniques to handle data structures coming
        from the web or from open repositories.'
