syllabus:
  it:
    url: https://www.unibo.it/it/studiare/insegnamenti-competenze-trasversali-moocs/insegnamenti/insegnamento/2025/543892
    title: 2025/2026 STATISTICS AND MACHINE LEARNING FOR SIGNAL PROCESSING M — Università
      di Bologna
    contents:
      Conoscenze e abilità da conseguire: The course aims at reviewing basic concepts
        of probability, operator theory and optimization and using them in the development
        of fundamental signal processing methods ranging from filtering to spectrum
        estimation, linear prediction, adaptive sampling and dimensionality reduction.
      Contenuti: "Il corso è articolato in due moduli tra loro complementari.\n\n\
        Sistemi e segnali a tempo discreto\n\n- Segnali tempo discreto: rappresentazione\
        \ e operazioni fondamentali\n- Sistemi lineari tempo-invarianti (LTI): risposta\
        \ all’impulso, convoluzione, stabilità e causalità\n- Trasformata di Fourier\
        \ tempo discreto (DTFT): definizione e proprietà\n- Trasformata Z: definizione,\
        \ regione di convergenza (ROC), analisi dei sistemi\n- Filtri digitali: strutture\
        \ FIR e IIR, risposta in frequenza, criteri di progetto\n- Campionamento e\
        \ quantizzazione: effetti della quantizzazione, rumore di quantizzazione\n\
        - Trasformata discreta di Fourier (DFT) e Fast Fourier Transform (FFT): principi\
        \ e implementazione efficiente\n  Processi stocastici e modellazione\n- Richiami\
        \ di teoria della probabilità\n- Spazi vettoriali e algebra lineare\n- Ottimizzazione\
        \ e algoritmi di ottimizzazione\n- Covarianza e indipendenza\n- Processi stocastici:\
        \ proprietà, stazionarietà, ergodicità\n- Blocchi di processamento e rappresentazioni\
        \ lineari\n- Vettori e processi gaussiani\n- Densità spettrale di potenza\
        \ (PSD)\n- Predizione lineare, modelli autoregressivi ed equazioni di Yule-Walker\n\
        - Teorema di Wold\n\nIl corso fornisce strumenti teorici e metodologici per\
        \ l’analisi e il progetto di sistemi di elaborazione dei segnali deterministici\
        \ e stocastici."
      Metodi didattici: Lezioni frontali sui temi del corso
      Modalità di verifica e valutazione dell'apprendimento: esame scritto
      Orario di ricevimento: Consulta il sito web di Mauro Mangia (https://www.unibo.it/sitoweb/mauro.mangia)
  en:
    url: https://www.unibo.it/en/study/course-units-transferable-skills-moocs/course-unit-catalogue/course-unit/2025/543892
    title: 2025/2026 STATISTICS AND MACHINE LEARNING FOR SIGNAL PROCESSING M — University
      of Bologna
    contents:
      Learning outcomes: The course aims at reviewing basic concepts of probability,
        operator theory and optimization and using them in the development of fundamental
        signal processing methods ranging from filtering to spectrum estimation, linear
        prediction, adaptive sampling and dimensionality reduction.
      Course contents: "The course is organized into two complementary moduls.\n\n\
        Discrete-Time Signals and Systems\n\n- Discrete-time signals: representation\
        \ and basic operations\n- Linear Time-Invariant (LTI) systems: impulse response,\
        \ convolution, stability and causality\n- Discrete-Time Fourier Transform\
        \ (DTFT): definition and properties\n- Z-transform: definition, region of\
        \ convergence (ROC), system analysis\n- Digital filters: FIR and IIR structures,\
        \ frequency response, design criteria\n- Sampling and quantization: quantization\
        \ effects, quantization noise\n- Discrete Fourier Transform (DFT) and Fast\
        \ Fourier Transform (FFT): principles and efficient implementation\n  Stochastic\
        \ Processes and Modeling\n- Review of probability theory\n- Vector spaces\
        \ and linear algebra\n- Optimization and optimization algorithms\n- Covariance\
        \ and independence\n- Stochastic processes: properties, stationarity, ergodicity\n\
        - Processing blocks and linear representations\n- Gaussian vectors and processes\n\
        - Power Spectral Density (PSD)\n- Linear prediction, autoregressive models,\
        \ and Yule-Walker equations\n- Wold theorem\n\nThe course provides theoretical\
        \ and methodological tools for the analysis and design of deterministic and\
        \ stochastic signal processing systems."
      Teaching methods: Lectures for the presentation of theoretical concepts
      Assessment methods: written exam
      Office hours: See the website of Mauro Mangia (https://www.unibo.it/sitoweb/mauro.mangia/en)
